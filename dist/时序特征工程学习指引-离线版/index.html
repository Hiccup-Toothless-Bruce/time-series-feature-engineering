sna().astype(int)   # 留个标记，方便以后分析\ndf[&quot;pm2.5&quot;] = df[&quot;pm2.5&quot;].interpolate(method=&quot;linear&quot;, limit=6, limit_direction=&quot;both&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>连续缺失不超过 6 小时 → 用前后值线性插值补上（相邻小时污染水平接近，这样猜比较合理）。<\/li>\n<li>连续缺失很久 → 保留 NaN，不硬猜；建模时按用到的特征删掉这些行。<\/li>\n<li>插值也是\"猜\"，必须在报告里写清楚处理方式，不能装作数据本来没有缺失。<\/li>\n<\/ul>\n<h2 id=\"34\">3.4 时区换算（要看北京作息时）<\/h2>\n<pre><code class=\"language-python\">df[&quot;hour_beijing&quot;] = (df[&quot;hour&quot;] + 8) % 24                      # 简便算法\ndf[&quot;datetime_beijing&quot;] = df.index.tz_convert(&quot;Asia/Shanghai&quot;)   # 正规做法\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>本项目统一用 UTC 讲解；UTC 08:00 = 北京 16:00。<\/li>\n<li>想研究\"北京早高峰\"，就加上 <code>hour_beijing<\/code> 这一列再分组看。<\/li>\n<\/ul>\n<hr />\n<h1 id=\"4\">4. 时间特征<\/h1>\n<p>对应脚本：<code>scripts/05_time_features.py<\/code>。<\/p>\n<h2 id=\"41\">4.1 日历特征<\/h2>\n<pre><code class=\"language-python\">index = df.index\ndf[&quot;year&quot;] = index.year\ndf[&quot;month&quot;] = index.month\ndf[&quot;day&quot;] = index.day\ndf[&quot;hour&quot;] = index.hour\ndf[&quot;dayofweek&quot;] = index.dayofweek          # 0=周一, 6=周日\ndf[&quot;is_weekend&quot;] = (index.dayofweek &gt;= 5).astype(int)\ndf[&quot;dayofyear&quot;] = index.dayofyear\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>把\"时间戳\"翻译成模型看得懂的数字：年看长期趋势，月看季节，小时看早晚高峰。<\/li>\n<li><code>day<\/code>（几号）通常用处不大，容易让模型记住偶然现象（过拟合），可以先不加。<\/li>\n<li><code>is_weekend<\/code> 是最直观的一个：工作日和周末的规律常常不一样。<\/li>\n<\/ul>\n<h2 id=\"42\">4.2 星期几的可读版本<\/h2>\n<pre><code class=\"language-python\">WEEKDAY_NAMES = [&quot;周一&quot;, &quot;周二&quot;, &quot;周三&quot;, &quot;周四&quot;, &quot;周五&quot;, &quot;周六&quot;, &quot;周日&quot;]\ndf[&quot;weekday_name&quot;] = df[&quot;dayofweek&quot;].map(lambda x: WEEKDAY_NAMES[x])\n<\/code><\/pre>\n<p><strong>作用<\/strong>：给人看的列，画图、写报告时比 0~6 直观；建模时用 <code>dayofweek<\/code> 数字列。<\/p>\n<h2 id=\"43-sincos\">4.3 周期编码：sin/cos<\/h2>\n<pre><code class=\"language-python\">import numpy as np\n\ndf[&quot;hour_sin&quot;] = np.sin(2 * np.pi * df[&quot;hour&quot;] / 24)\ndf[&quot;hour_cos&quot;] = np.cos(2 * np.pi * df[&quot;hour&quot;] / 24)\n\ndf[&quot;dayofweek_sin&quot;] = np.sin(2 * np.pi * df[&quot;dayofweek&quot;] / 7)\ndf[&quot;dayofweek_cos&quot;] = np.cos(2 * np.pi * df[&quot;dayofweek&quot;] / 7)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>直接给模型 <code>hour=23<\/code> 和 <code>hour=0<\/code>，模型会以为它们差 23；放到圆上以后，它俩其实是邻居。<\/li>\n<li>除以周期长度（24 小时、7 天、12 个月），再用 sin/cos 算出圆上的横纵坐标，两个数配对表示一个位置。<\/li>\n<li>月份编码写 <code>(month - 1) / 12<\/code>，是为了让 1 月从 0 开始，跟其他周期的写法一致。<\/li>\n<\/ul>\n<h2 id=\"44\">4.4 观察周期性<\/h2>\n<pre><code class=\"language-python\">by_hour = df.groupby(&quot;hour&quot;)[&quot;pm2.5&quot;].mean()\nby_weekday = df.groupby(&quot;weekday_name&quot;)[&quot;pm2.5&quot;].mean().reindex(WEEKDAY_NAMES)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：分组求平均，看看\"哪个小时更脏、哪一天更脏\"。柱子高低差别明显，就说明时间特征有用。<\/p>\n<hr />\n<h1 id=\"5\">5. 滞后与滑动窗口<\/h1>\n<p>对应脚本：<code>scripts/08_lag_rolling_features.py<\/code>。<\/p>\n<h2 id=\"51-lag\">5.1 lag：把过去的值挪到当前行<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_now&quot;] = df[&quot;pm2.5&quot;]        # 当前时刻的值（可以立刻测到，能用）\ndf[&quot;pm25_lag1&quot;] = df[&quot;pm2.5&quot;].shift(1)      # 上一小时\ndf[&quot;pm25_lag2&quot;] = df[&quot;pm2.5&quot;].shift(2)      # 上两小时\ndf[&quot;pm25_lag24&quot;] = df[&quot;pm2.5&quot;].shift(24)    # 昨天同一小时\ndf[&quot;pm25_lag168&quot;] = df[&quot;pm2.5&quot;].shift(168)  # 上周同一小时（7×24）\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>shift(1)<\/code> 把整列往下挪一格，于是\"上一小时的值\"出现在当前行，可以当作特征。<\/li>\n<li>污染物有明显惯性，<code>lag1<\/code>、<code>lag24<\/code> 通常是最有用的特征。<\/li>\n<li>挪完前几行会出现 NaN，这是正常的，最后 <code>dropna<\/code> 掉即可。<\/li>\n<\/ul>\n<h2 id=\"52-diff\">5.2 diff：变化量<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_diff1&quot;] = df[&quot;pm2.5&quot;].diff(1)     # 比上一小时高/低了多少\ndf[&quot;pm25_diff24&quot;] = df[&quot;pm2.5&quot;].diff(24)   # 比昨天同一小时高/低了多少\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<code>diff<\/code> 相当于\"当前值 − 之前的值\"，描述的是趋势和变化速度，对突变更敏感。<\/p>\n<h2 id=\"53-rolling\">5.3 rolling：滑动窗口<\/h2>\n<pre><code class=\"language-python\">window24 = df[&quot;pm2.5&quot;].rolling(window=24, min_periods=18)\n\ndf[&quot;pm25_roll24_mean&quot;] = window24.mean()   # 最近 24 小时平均\ndf[&quot;pm25_roll24_std&quot;] = window24.std()     # 最近 24 小时波动\ndf[&quot;pm25_roll24_max&quot;] = window24.max()     # 最近 24 小时最高\ndf[&quot;pm25_roll24_min&quot;] = window24.min()     # 最近 24 小时最低\n\ndf[&quot;pm25_roll168_mean&quot;] = df[&quot;pm2.5&quot;].rolling(window=168, min_periods=120).mean()  # 最近 7 天\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>默认窗口在当前时刻结束（trailing），里面全是过去的值，预测下一小时时是安全的。<\/li>\n<li><code>min_periods=18<\/code> 表示\"24 小时里至少有 18 个有效值才算\"，既不会被个别缺失整行丢掉，也不会只靠一两个值硬算平均。<\/li>\n<li><code>mean<\/code> 看水平、<code>std<\/code> 看稳定程度、<code>max/min<\/code> 看极端情况。<\/li>\n<\/ul>\n<h2 id=\"54\">5.4 目标：下一个小时的值<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_next&quot;] = df[&quot;pm2.5&quot;].shift(-1)    # 向上挪一格 = 下一小时的值\ndf = df.dropna(subset=[&quot;pm25_next&quot;])       # 最后一行没有下一小时，删掉\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>这一列是<strong>答案（y）<\/strong>，只能用来训练和打分，绝不能出现在特征列里。<\/li>\n<li><code>shift(-1)<\/code> 和 <code>shift(1)<\/code> 方向相反：负数 = 未来，正数 = 过去。<\/li>\n<\/ul>\n<h2 id=\"55\">5.5 时间对齐：一张表看懂谁对应谁<\/h2>\n<table>\n<thead>\n<tr>\n<th>列名<\/th>\n<th>对应时刻<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>pm2.5<\/code><\/td>\n<td>t<\/td>\n<td>当前小时测得的值<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag1<\/code><\/td>\n<td>t-1<\/td>\n<td>上一小时<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag24<\/code><\/td>\n<td>t-24<\/td>\n<td>昨天同一小时<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_roll24_mean<\/code><\/td>\n<td>t-23 ~ t<\/td>\n<td>最近 24 小时的平均<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_next<\/code><\/td>\n<td>t+1<\/td>\n<td>要预测的答案<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>作用<\/strong>：写代码时随时回看这张表，就不容易把未来信息混进特征（这是最常见的错误）。<\/p>\n<hr />\n<h1 id=\"6\">6. 建模与评估<\/h1>\n<p>对应脚本：<code>scripts/06_baseline_model.py<\/code>、<code>07_cyclic_encoding.py<\/code>、<code>09_model_comparison.py<\/code>。<\/p>\n<h2 id=\"61-x-y\">6.1 准备好 X 和 y<\/h2>\n<pre><code class=\"language-python\">features = [&quot;month&quot;, &quot;day&quot;, &quot;hour&quot;, &quot;dayofweek&quot;, &quot;is_weekend&quot;, &quot;dayofyear&quot;]\n\nx_train = train[features]      # 特征（问题）\ny_train = train[&quot;pm25_next&quot;]   # 目标（答案）\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>建模就是把\"能知道的信息\"（X）和\"要预测的答案\"（y）分清楚。<\/li>\n<li>特征必须满足一个条件：<strong>在预测时刻已经能拿到<\/strong>。<\/li>\n<\/ul>\n<h2 id=\"62\">6.2 按时间切分训练集/测试集<\/h2>\n<pre><code class=\"language-python\">split_index = int(len(df) * 0.8)\ntrain = df.iloc[:split_index].copy()     # 前 80%：训练\ntest = df.iloc[split_index:].copy()      # 后 20%：测试\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>时序数据必须\"用过去训练、拿未来测试\"，模拟真实预测场景。<\/li>\n<li>随机切分会让未来信息混进训练集，分数虚高（第 7 章有真实数字对比）。<\/li>\n<\/ul>\n<h2 id=\"63\">6.3 基线模型：先跑简单的<\/h2>\n<pre><code class=\"language-python\">from sklearn.dummy import DummyRegressor\n\ndummy = DummyRegressor(strategy=&quot;mean&quot;)   # 永远预测训练集的平均值\ndummy.fit(x_train, y_train)\ndummy_pred = dummy.predict(x_test)\n\npersistence_pred = test[&quot;pm25_now&quot;].to_numpy()   # 持续法：下一小时 = 当前小时\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>平均值基线：什么都不学，只猜平均值，用来当\"最低标准\"。<\/li>\n<li>持续法：直接说\"下一小时和现在差不多\"。在污染物、股价这类有惯性的数据上，它往往很强。<\/li>\n<li>复杂模型如果打不过这两个基线，说明特征或方法有问题。<\/li>\n<\/ul>\n<h2 id=\"64\">6.4 线性回归<\/h2>\n<pre><code class=\"language-python\">from sklearn.linear_model import LinearRegression\n\nmodel = LinearRegression()\nmodel.fit(x_train, y_train)      # 训练\npred = model.predict(x_test)     # 预测\n\nfor name, coef in zip(features, model.coef_):\n    print(name, round(coef, 4))  # 看每个特征的系数\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>线性回归就是给每个特征学一个权重，然后加权求和。<\/li>\n<li>系数正负表示方向（正 = 越大越容易高），但系数大小受量纲影响，不能直接当重要性排名；想比较大小要先标准化。<\/li>\n<\/ul>\n<h2 id=\"65\">6.5 标准化后再看系数<\/h2>\n<pre><code class=\"language-python\">from sklearn.preprocessing import StandardScaler\n\nscaler = StandardScaler()\nx_train_scaled = scaler.fit_transform(train[features])\nx_test_scaled = scaler.transform(test[features])     # 注意：用训练集的规则去转换测试集\n\nmodel = LinearRegression().fit(x_train_scaled, y_train)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：把所有特征缩放到可比的尺度，系数大小才能横向比较（本项目输出到 <code>09_feature_coefficients.csv<\/code>）。<\/p>\n<h2 id=\"66\">6.6 三个指标怎么读<\/h2>\n<pre><code class=\"language-python\">mae = np.mean(np.abs(y_true - y_pred))                    # 平均差多少\nrmse = np.sqrt(np.mean((y_true - y_pred) ** 2))           # 更重罚大错\nr2 = 1 - np.sum((y_true - y_pred) ** 2) / np.sum((y_true - y_true.mean()) ** 2)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><strong>MAE<\/strong>：平均每次预测差多少，最好和 PM2.5 本身的平均值一起看（本数据平均约 80~100，MAE 11 就不错）。<\/li>\n<li><strong>RMSE<\/strong>：和 MAE 类似，但对离谱的大错误更敏感。<\/li>\n<li><strong>R²<\/strong>：1 最好；0 约等于\"只会猜平均值\"；负数说明比猜平均值还差。<\/li>\n<\/ul>\n<h2 id=\"67\">6.7 实验怎么写<\/h2>\n<pre><code class=\"language-text\">实验名 | 用了哪些特征 | 切分方式 | MAE | RMSE | R² | 是否可信\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>一次只改一处，其他保持不变，这样的对比才有意义（控制变量）。<\/li>\n<li>表里一定要标出\"是否可信\"，把泄漏实验单独区分开（项目里已有这张表：<code>outputs/tables/09_model_comparison.csv<\/code>）。<\/li>\n<\/ul>\n<hr />\n<h1 id=\"7\">7. 数据泄漏：三种错误示范<\/h1>\n<p>对应脚本：<code>scripts/08_lag_rolling_features.py<\/code>、<code>scripts/09_model_comparison.py<\/code>。<\/p>\n<h2 id=\"71\">7.1 中心滑动窗口（看了未来）<\/h2>\n<pre><code class=\"language-python\"># 错误：center=True 表示窗口中心在当前行，会包含 t+1、t+2 的未来值\ndf[&quot;pm25_roll24_mean_center_leaky&quot;] = df[&quot;pm2.5&quot;].rolling(window=24, center=True, min_periods=24).mean()\n<\/code><\/pre>\n<p><strong>作用/后果<\/strong>：预测下一小时时却用了后面几小时的信息。分数会变好，但这个\"好\"是假的。<\/p>\n<h2 id=\"72\">7.2 把答案当特征（最离谱的作弊）<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_answer_leaky&quot;] = df[&quot;pm25_next&quot;]     # 严重错误：答案直接变成特征\n<\/code><\/pre>\n<p><strong>作用/后果<\/strong>：模型等于抄答案，R² 会到 1.0000、MAE 会到 0。看到\"完美分数\"先怀疑泄漏，而不是高兴。<\/p>\n<h2 id=\"73\">7.3 随机切分（考试漏题）<\/h2>\n<pre><code class=\"language-python\"># 错误做法：时序数据不要这样切\nx_train, x_test, y_train, y_test = train_test_split(x, y, test_size=0.2, random_state=42)\n<\/code><\/pre>\n<p><strong>作用/后果<\/strong>：随机切分会把\"未来\"混进训练集，测试分数虚高（本项目对比：随机切分 R² 0.9494，按时间切分 0.9426，看起来更好，但不可信）。<\/p>\n<h2 id=\"74\">7.4 防泄漏检查清单<\/h2>\n<ul>\n<li>[ ] 每一列特征，在预测时刻 t 都拿得到吗？（拿不到就删）<\/li>\n<li>[ ] 有没有 <code>center=True<\/code>？有就改成默认的 trailing 窗口。<\/li>\n<li>[ ] 有没有列名带 <code>next<\/code>、<code>answer<\/code>、<code>leaky<\/code> 却出现在 <code>features<\/code> 里？<\/li>\n<li>[ ] 是在排序 + 补齐时间轴之后才算的 <code>shift<\/code>/<code>rolling<\/code> 吗？<\/li>\n<li>[ ] 训练集时间是否完全早于测试集？<\/li>\n<li>[ ] 分数好得反常（R²&gt;0.99）时，是否停下来查一遍泄漏？<\/li>\n<\/ul>\n<hr />\n<h1 id=\"8\">8. 画图<\/h1>\n<p>对应脚本：<code>scripts/10_plots.py<\/code>；对应教程：<code>docs/06-画图与Kaggle.md<\/code>。<\/p>\n<h2 id=\"81\">8.1 中文画图设置<\/h2>\n<pre><code class=\"language-python\">import matplotlib\nmatplotlib.use(&quot;Agg&quot;)            # 不弹窗，直接存图片文件\n\nimport matplotlib.pyplot as plt\nplt.rcParams[&quot;font.sans-serif&quot;] = [&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;]   # 中文不乱码\nplt.rcParams[&quot;axes.unicode_minus&quot;] = False                        # 负号正常显示\nplt.rcParams[&quot;figure.dpi&quot;] = 120\n<\/code><\/pre>\n<p><strong>作用<\/strong>：不设置字体，中文标题会变成一排方框；<code>Agg<\/code> 让脚本在服务器/无窗口环境也能出图。<\/p>\n<h2 id=\"82\">8.2 常用图<\/h2>\n<pre><code class=\"language-python\">fig, axes = plt.subplots(2, 1, figsize=(12, 8))    # 上下两张图\n\naxes[0].plot(daily.index, daily[&quot;pm2.5&quot;], color=&quot;#2c7fb8&quot;)        # 折线：看趋势\naxes[0].set_title(&quot;PM2.5 日均值（UTC）&quot;)\naxes[0].set_ylabel(&quot;PM2.5&quot;)\n\naxes[1].plot(sample.index, sample[&quot;pm2.5&quot;], linewidth=0.8)        # 局部放大看细节\nfig.tight_layout()\nfig.savefig(&quot;outputs/figures/01_原始序列与趋势.png&quot;, bbox_inches=&quot;tight&quot;)\n<\/code><\/pre>\n<pre><code class=\"language-python\">plt.figure(figsize=(8, 4))\nplt.bar(by_hour.index, by_hour.values, color=&quot;#31a354&quot;)           # 柱状：比较不同小时\nplt.xlabel(&quot;UTC 小时&quot;); plt.ylabel(&quot;平均 PM2.5&quot;)\nplt.savefig(&quot;outputs/figures/03_周期性观察.png&quot;, bbox_inches=&quot;tight&quot;)\n<\/code><\/pre>\n<pre><code class=\"language-python\">fig, ax = plt.subplots(figsize=(13, 5.5))\nax.plot(part.index, part[&quot;y_true&quot;], color=&quot;black&quot;, linewidth=2, label=&quot;真实值&quot;)\nax.plot(part.index, part[&quot;pred_time_cyc&quot;], color=&quot;#e6550d&quot;, label=&quot;只用周期时间特征&quot;)\nax.plot(part.index, part[&quot;pred_full&quot;], color=&quot;#2c7fb8&quot;, label=&quot;完整正确特征&quot;)\nax.legend()\nax.set_title(&quot;测试期前 14 天：预测值 vs 真实值&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>折线看趋势和周期，柱状比较分组均值，散点看两个变量的关系。<\/li>\n<li>预测对比图是最有说服力的一张：真实值、简单特征、完整特征画在一起，一眼看出差别。<\/li>\n<\/ul>\n<h2 id=\"83\">8.3 每张图在说什么<\/h2>\n<table>\n<thead>\n<tr>\n<th>图<\/th>\n<th>看什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>原始序列<\/td>\n<td>整体趋势、有没有季节性<\/td>\n<\/tr>\n<tr>\n<td>滑动平均与差分<\/td>\n<td>7 天滑动平均像降噪滤镜；差分把突变单独拎出来<\/td>\n<\/tr>\n<tr>\n<td>周期性观察<\/td>\n<td>不同小时/星期/月份的平均值差别大不大<\/td>\n<\/tr>\n<tr>\n<td>预测对比<\/td>\n<td>简单特征几乎是一条平线，完整特征能跟住真实值<\/td>\n<\/tr>\n<tr>\n<td>周期编码圆<\/td>\n<td>23 点和 0 点在圆上是邻居<\/td>\n<\/tr>\n<tr>\n<td>相关性热力图<\/td>\n<td>哪个特征和下一小时 PM2.5 线性相关更强（相关 ≠ 因果）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h1 id=\"9-sqlite\">9. SQLite 数据库<\/h1>\n<p>对应脚本：<code>scripts/03_sqlite_basics.py<\/code>。Python 自带，零配置。<\/p>\n<h2 id=\"91\">9.1 连接与建表<\/h2>\n<pre><code class=\"language-python\">import sqlite3\n\nconn = sqlite3.connect(&quot;data/processed/practice.db&quot;)\nconn.execute(&quot;&quot;&quot;\n    CREATE TABLE IF NOT EXISTS weather_notes (\n        id    INTEGER PRIMARY KEY,   -- 主键：唯一身份证，不能重复\n        city  TEXT NOT NULL,\n        date  TEXT NOT NULL,\n        temp  REAL,\n        note  TEXT\n    )\n&quot;&quot;&quot;)\nconn.commit()\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>SQLite 把整个数据库存成一个 <code>.db<\/code> 文件，不用装服务器，适合练习和小项目。<\/li>\n<li><code>PRIMARY KEY<\/code> 保证每行有唯一 id；<code>NOT NULL<\/code> 表示这列不能空着。<\/li>\n<li>类型：<code>INTEGER<\/code> 整数、<code>TEXT<\/code> 文本、<code>REAL<\/code> 小数。<\/li>\n<\/ul>\n<h2 id=\"92\">9.2 增删改查<\/h2>\n<pre><code class=\"language-python\"># 增：? 是占位符，防止拼字符串出错（也能防注入）\nconn.executemany(\n    &quot;INSERT OR REPLACE INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)&quot;,\n    [(1, &quot;Nanjing&quot;, &quot;2026-10-01&quot;, 28.0, &quot;sunny&quot;)],\n)\n\n# 查\nconn.execute(&quot;SELECT * FROM weather_notes WHERE city = ? ORDER BY id&quot;, (&quot;Nanjing&quot;,))\nconn.execute(&quot;SELECT city, COUNT(*) AS n FROM weather_notes GROUP BY city ORDER BY n DESC&quot;)\n\n# 改\nconn.execute(&quot;UPDATE weather_notes SET temp = ?, note = ? WHERE id = ?&quot;, (29.5, &quot;updated&quot;, 1))\n\n# 删\nconn.execute(&quot;DELETE FROM weather_notes WHERE id = ?&quot;, (4,))\n\nconn.commit()    # 增删改之后一定要 commit\nconn.close()     # 用完关掉\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>SELECT<\/code> 查、<code>INSERT<\/code> 增、<code>UPDATE<\/code> 改、<code>DELETE<\/code> 删 —— 数据库的四个基本动作。<\/li>\n<li><code>WHERE<\/code> 决定动哪几行；<strong>忘了写 WHERE，UPDATE/DELETE 会作用到整张表<\/strong>，务必先 <code>SELECT<\/code> 确认。<\/li>\n<\/ul>\n<h2 id=\"93\">9.3 主键与索引<\/h2>\n<pre><code class=\"language-python\">conn.execute(&quot;CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>主键：自动唯一，插入重复 id 会直接报 <code>IntegrityError<\/code>（这是好事，数据更安全）。<\/li>\n<li>索引：像书的目录，让\"按 city 查询\"更快；代价是占空间、写入稍慢，只给常用查询列建。<\/li>\n<\/ul>\n<hr />\n<h1 id=\"10_1\">10. 报错急救<\/h1>\n<p>对应教程：<code>docs/99-报错急救.md<\/code>。<\/p>\n<table>\n<thead>\n<tr>\n<th>报错信息（关键部分）<\/th>\n<th>原因<\/th>\n<th>怎么解决<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>python 不是内部或外部命令<\/code><\/td>\n<td>没装 Python 或没勾选 Add to PATH<\/td>\n<td>重新安装 Python 并勾选 Add Python to PATH；或用 <code>py<\/code> 命令<\/td>\n<\/tr>\n<tr>\n<td><code>无法加载文件 ... Activate.ps1，未对文件进行数字签名<\/code><\/td>\n<td>PowerShell 执行策略限制<\/td>\n<td><code>Set-ExecutionPolicy -Scope CurrentUser RemoteSigned<\/code> 后重开窗口<\/td>\n<\/tr>\n<tr>\n<td><code>ModuleNotFoundError: No module named 'pandas'<\/code><\/td>\n<td>没装库，或虚拟环境没激活<\/td>\n<td>先 <code>.\\.venv\\Scripts\\Activate.ps1<\/code>，再 <code>pip install -r requirements.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>FileNotFoundError: ... data/raw/...csv<\/code><\/td>\n<td>数据还没下载<\/td>\n<td>先跑 <code>python scripts\\download_data.py<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>FileNotFoundError: ... pm25_clean.csv<\/code><\/td>\n<td>上一个脚本没跑<\/td>\n<td>按顺序跑 04 → 05 → 06…，或直接 <code>.\\run_all.ps1<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>KeyError: 'hour'<\/code><\/td>\n<td>列名不存在/拼错，或少了上一步生成的特征<\/td>\n<td>用 <code>df.columns<\/code> 看真实列名；确认跑过 05/08<\/td>\n<\/tr>\n<tr>\n<td><code>ValueError: could not convert string to float<\/code><\/td>\n<td>该是数字的列里混了文字/空值<\/td>\n<td><code>df[\"列\"].head()<\/code> 看看内容；必要时 <code>pd.to_numeric(errors=\"coerce\")<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>TypeError: unsupported operand type(s)<\/code><\/td>\n<td>字符串当数字算了<\/td>\n<td>检查这列的 <code>dtype<\/code>（<code>df.dtypes<\/code>），先转换类型<\/td>\n<\/tr>\n<tr>\n<td><code>SettingWithCopyWarning<\/code><\/td>\n<td>在切片副本上改数据<\/td>\n<td>先 <code>.copy()<\/code>，再赋值：<code>part = df.iloc[:100].copy()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>UnicodeDecodeError: 'utf-8' codec can't decode<\/code><\/td>\n<td>文件不是 UTF-8（常见 GBK）<\/td>\n<td>读的时候加 <code>encoding=\"gbk\"<\/code>；写 CSV 用 <code>utf-8-sig<\/code><\/td>\n<\/tr>\n<tr>\n<td>CSV 用 Excel 打开中文乱码<\/td>\n<td>编码不是 Excel 认的格式<\/td>\n<td>保存时用 <code>encoding=\"utf-8-sig\"<\/code><\/td>\n<\/tr>\n<tr>\n<td>matplotlib 中文变方框<\/td>\n<td>没设置中文字体<\/td>\n<td>加 <code>plt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\"]<\/code><\/td>\n<\/tr>\n<tr>\n<td>服务器提示端口被占用<\/td>\n<td>8765 已被别的程序占用<\/td>\n<td>换端口：<code>start-server.ps1 -Port 8899<\/code><\/td>\n<\/tr>\n<tr>\n<td>Git <code>fatal: not a git repository<\/code><\/td>\n<td>当前目录还不是仓库<\/td>\n<td>在项目根目录先 <code>git init<\/code><\/td>\n<\/tr>\n<tr>\n<td>Git <code>failed to push<\/code> / 要登录<\/td>\n<td>远端仓库或凭据问题<\/td>\n<td><code>git remote -v<\/code> 检查地址；按提示登录 GitHub<\/td>\n<\/tr>\n<tr>\n<td><code>PermissionError: [Errno 13]<\/code><\/td>\n<td>文件被 Excel 等程序占用<\/td>\n<td>关掉正在打开的文件再运行脚本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>通用排查三步<\/strong>：<\/p>\n<ol>\n<li>看报错<strong>最后一行<\/strong>（错误类型 + 原因），再看它指出的是哪个文件哪一行。<\/li>\n<li>打开那个文件、找到那一行，想想这一行需要什么（列？文件？库？）。<\/li>\n<li>还没头绪就把整段报错复制去搜索，或者把\"最后一行 + 代码那几行\"发给同学/导师。<\/li>\n<\/ol>\n<hr />\n<h1 id=\"a\">附录 A　特征清单（可直接抄进报告）<\/h1>\n<table>\n<thead>\n<tr>\n<th>特征名<\/th>\n<th>构造方法<\/th>\n<th>含义<\/th>\n<th>可能的作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>year<\/code><\/td>\n<td><code>index.year<\/code><\/td>\n<td>年份<\/td>\n<td>捕捉长期趋势<\/td>\n<\/tr>\n<tr>\n<td><code>month<\/code><\/td>\n<td><code>index.month<\/code><\/td>\n<td>月份 1–12<\/td>\n<td>捕捉季节变化<\/td>\n<\/tr>\n<tr>\n<td><code>day<\/code><\/td>\n<td><code>index.day<\/code><\/td>\n<td>几号<\/td>\n<td>通常用处不大，容易过拟合<\/td>\n<\/tr>\n<tr>\n<td><code>hour<\/code><\/td>\n<td><code>index.hour<\/code><\/td>\n<td>小时 0–23<\/td>\n<td>捕捉一天内的变化<\/td>\n<\/tr>\n<tr>\n<td><code>dayofweek<\/code><\/td>\n<td><code>index.dayofweek<\/code><\/td>\n<td>0=周一…6=周日<\/td>\n<td>工作日/周末差异<\/td>\n<\/tr>\n<tr>\n<td><code>is_weekend<\/code><\/td>\n<td><code>dayofweek &gt;= 5<\/code><\/td>\n<td>是否周末 0/1<\/td>\n<td>简单明了的周末效应<\/td>\n<\/tr>\n<tr>\n<td><code>dayofyear<\/code><\/td>\n<td><code>index.dayofyear<\/code><\/td>\n<td>一年中的第几天<\/td>\n<td>更细的季节位置<\/td>\n<\/tr>\n<tr>\n<td><code>hour_sin<\/code> / <code>hour_cos<\/code><\/td>\n<td><code>sin(2π·hour/24)<\/code> / <code>cos(...)<\/code><\/td>\n<td>小时在圆上的坐标<\/td>\n<td>让 23 点和 0 点变近<\/td>\n<\/tr>\n<tr>\n<td><code>dayofweek_sin<\/code> / <code>dayofweek_cos<\/code><\/td>\n<td><code>sin(2π·dow/7)<\/code> / <code>cos(...)<\/code><\/td>\n<td>星期在圆上的坐标<\/td>\n<td>表达\"周而复始\"<\/td>\n<\/tr>\n<tr>\n<td><code>month_sin<\/code> / <code>month_cos<\/code><\/td>\n<td><code>sin(2π·(month-1)/12)<\/code><\/td>\n<td>月份在圆上的坐标<\/td>\n<td>表达季节循环<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_now<\/code><\/td>\n<td>原列<\/td>\n<td>当前小时的值<\/td>\n<td>惯性，最强特征之一<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag1 / lag2 / lag3<\/code><\/td>\n<td><code>shift(1/2/3)<\/code><\/td>\n<td>前 1~3 小时的值<\/td>\n<td>近期惯性<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag24<\/code><\/td>\n<td><code>shift(24)<\/code><\/td>\n<td>昨天同一小时<\/td>\n<td>日周期<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag168<\/code><\/td>\n<td><code>shift(168)<\/code><\/td>\n<td>上周同一小时<\/td>\n<td>周周期<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_diff1 / diff24<\/code><\/td>\n<td><code>diff(1) / diff(24)<\/code><\/td>\n<td>相比上一小时/昨天同小时的变化<\/td>\n<td>趋势与突变<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_roll24_mean/std/max/min<\/code><\/td>\n<td><code>rolling(24).mean()/std()/max()/min()<\/code><\/td>\n<td>最近 24 小时统计<\/td>\n<td>水平、波动、极值<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_roll168_mean/std<\/code><\/td>\n<td><code>rolling(168)<\/code><\/td>\n<td>最近 7 天统计<\/td>\n<td>周级别水平与波动<\/td>\n<\/tr>\n<tr>\n<td><code>TEMP_lag1<\/code> / <code>TEMP_roll24_mean<\/code><\/td>\n<td>对温度做同样的操作<\/td>\n<td>温度的历史信息<\/td>\n<td>说明方法可迁移到其他列<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>一句话模板<\/strong>：<code>xxx 特征是用 xxx 方法构造的，它让模型知道 xxx，加入后 MAE 从 __ 降到 __。<\/code><\/p>\n<hr />\n<h1 id=\"b\">附录 B　本项目的实验结论（真实数字）<\/h1>\n<h2 id=\"b1-outputstables09_model_comparisoncsv\">B.1 特征对照实验（<code>outputs/tables/09_model_comparison.csv<\/code>）<\/h2>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>特征<\/th>\n<th>切分方式<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R²<\/th>\n<th>是否可信<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平均值基线<\/td>\n<td>无<\/td>\n<td>按时间 8:2<\/td>\n<td>64.740<\/td>\n<td>82.470<\/td>\n<td>-0.0286<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>持续法基线<\/td>\n<td>当前 pm2.5<\/td>\n<td>按时间 8:2<\/td>\n<td>10.981<\/td>\n<td>19.968<\/td>\n<td>0.9397<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>只用原始时间特征<\/td>\n<td>month/day/hour/weekday…<\/td>\n<td>按时间 8:2<\/td>\n<td>62.576<\/td>\n<td>81.323<\/td>\n<td>-0.0002<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>只用周期编码时间<\/td>\n<td>hour_sin/cos…<\/td>\n<td>按时间 8:2<\/td>\n<td>62.656<\/td>\n<td>80.601<\/td>\n<td>0.0175<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>周期编码 + 滞后<\/td>\n<td>时间 + lag/diff<\/td>\n<td>按时间 8:2<\/td>\n<td>10.934<\/td>\n<td>19.670<\/td>\n<td>0.9415<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>完整正确版<\/td>\n<td>周期 + 滞后 + 滑动 + 天气<\/td>\n<td>按时间 8:2<\/td>\n<td>10.754<\/td>\n<td>19.473<\/td>\n<td>0.9426<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>中心滑动窗口（泄漏）<\/td>\n<td>窗口包含未来值<\/td>\n<td>按时间 8:2<\/td>\n<td>10.413<\/td>\n<td>18.112<\/td>\n<td>0.9504<\/td>\n<td>不可信<\/td>\n<\/tr>\n<tr>\n<td>把答案当特征（作弊）<\/td>\n<td><code>pm25_answer_leaky<\/code><\/td>\n<td>按时间 8:2<\/td>\n<td>0.000<\/td>\n<td>0.000<\/td>\n<td>1.0000<\/td>\n<td>不可信<\/td>\n<\/tr>\n<tr>\n<td>随机切分（错误做法）<\/td>\n<td>完整正确特征<\/td>\n<td>随机 8:2<\/td>\n<td>12.430<\/td>\n<td>21.106<\/td>\n<td>0.9494<\/td>\n<td>不可信<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"b2-outputstables09_ablationcsv\">B.2 消融实验（<code>outputs/tables/09_ablation.csv<\/code>）<\/h2>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>特征个数<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>完整特征<\/td>\n<td>29<\/td>\n<td>10.754<\/td>\n<td>19.473<\/td>\n<td>0.9426<\/td>\n<\/tr>\n<tr>\n<td>去掉滞后<\/td>\n<td>21<\/td>\n<td>33.376<\/td>\n<td>45.330<\/td>\n<td>0.6892<\/td>\n<\/tr>\n<tr>\n<td>去掉滑动窗口<\/td>\n<td>23<\/td>\n<td>10.804<\/td>\n<td>19.511<\/td>\n<td>0.9424<\/td>\n<\/tr>\n<tr>\n<td>去掉天气<\/td>\n<td>21<\/td>\n<td>10.885<\/td>\n<td>19.634<\/td>\n<td>0.9417<\/td>\n<\/tr>\n<tr>\n<td>只留时间特征<\/td>\n<td>7<\/td>\n<td>62.656<\/td>\n<td>80.601<\/td>\n<td>0.0175<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"b3\">B.3 三条可以写进报告的结论<\/h2>\n<ol>\n<li><strong>只用钟表时间不够<\/strong>：只加月/日/小时/星期，MAE 62.6，和\"猜平均值\"（64.7）差不多；换成周期编码也只有极小改善。<\/li>\n<li><strong>过去的值才是主力<\/strong>：加上滞后和滑动窗口后，MAE 从 62.6 降到 10.9；消融实验里\"去掉滞后\"这一项 MAE 直接涨到 33.4，说明这类特征贡献最大。<\/li>\n<li><strong>分数越高越要警惕<\/strong>：中心滑动窗口（10.413）和\"把答案当特征\"（MAE 0、R² 1.0）分数更漂亮，但都是泄漏，不能写进结论。<\/li>\n<\/ol>\n<hr />\n<h1 id=\"c\">附录 C　文件地图<\/h1>\n<table>\n<thead>\n<tr>\n<th>位置<\/th>\n<th>里面是什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>README.md<\/code><\/td>\n<td>项目总览、7 天学习计划、导师要求对照<\/td>\n<\/tr>\n<tr>\n<td><code>docs/00<\/code> ~ <code>docs/07<\/code><\/td>\n<td>分步教程（导师要求翻译、环境、Python、pandas/SQLite、特征工程核心、建模、画图与 Kaggle、交作业模板）<\/td>\n<\/tr>\n<tr>\n<td><code>docs/08-知识点与代码速查.md<\/code><\/td>\n<td><strong>本手册的 Markdown 版本<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>docs/99-报错急救.md<\/code><\/td>\n<td>报错对照表（比本手册第 10 章更详细）<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/01<\/code> ~ <code>03<\/code><\/td>\n<td>Python、pandas、SQLite 基础练习<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/04<\/code> ~ <code>08<\/code><\/td>\n<td>数据清洗 → 时间特征 → 基线模型 → 周期编码 → 滞后滑窗<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/09<\/code><\/td>\n<td>模型对比、消融实验、泄漏演示<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/10<\/code><\/td>\n<td>画 6 张观察图<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/common.py<\/code><\/td>\n<td>公共函数：路径、读数据、指标、中文字体<\/td>\n<\/tr>\n<tr>\n<td><code>data/raw/<\/code><\/td>\n<td>原始数据（下载得到）<\/td>\n<\/tr>\n<tr>\n<td><code>data/processed/<\/code><\/td>\n<td>清洗后数据、特征数据、练习数据库<\/td>\n<\/tr>\n<tr>\n<td><code>outputs/figures/<\/code><\/td>\n<td>6 张图（PNG，可插入报告）<\/td>\n<\/tr>\n<tr>\n<td><code>outputs/tables/<\/code><\/td>\n<td>实验表格（CSV，可插入报告）<\/td>\n<\/tr>\n<tr>\n<td><code>outputs/知识点与代码速查.pdf<\/code><\/td>\n<td><strong>本手册的 PDF（打印用）<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>guide/<\/code><\/td>\n<td>网页版指引：<code>index.html<\/code>、本地服务器 <code>server.py<\/code>、生成脚本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"d\">附录 D　交作业自查<\/h2>\n<ul>\n<li>[ ] 代码能一键跑通：<code>.\\run_all.ps1<\/code><\/li>\n<li>[ ] 代码已推到 GitHub，仓库链接能打开<\/li>\n<li>[ ] 笔记里有每个特征的\"构造 + 含义 + 实验证据\"（用 <code>notes/学习笔记模板.md<\/code>）<\/li>\n<li>[ ] 实验记录表填好：模型对比、消融实验（用 <code>notes/实验记录模板.md<\/code>）<\/li>\n<li>[ ] 报告里有 1~2 张图（建议：原始序列+滑动平均、预测对比）<\/li>\n<li>[ ] 报告里写清楚了：预测目标是什么、怎么切分、有没有数据泄漏、结论是什么<\/li>\n<li>[ ] 能口头解释：为什么 23 点和 0 点是邻居、为什么要 shift、为什么不能随机切分<\/li>\n<\/ul>\n<\/body>\n<\/html>\n"},"outputs/知识点与代码速查.pdf":{"path":"outputs/知识点与代码速查.pdf","name":"知识点与代码速查.pdf","size":1115172,"mtime":"2026-10-09 15:04","ext":".pdf","kind":"binary","href":"outputs/%E7%9F%A5%E8%AF%86%E7%82%B9%E4%B8%8E%E4%BB%A3%E7%A0%81%E9%80%9F%E6%9F%A5.pdf"},"requirements.txt":{"path":"requirements.txt","name":"requirements.txt","size":239,"mtime":"2026-10-08 21:33","ext":".txt","kind":"text","href":"requirements.txt","text":"# 本项目在 Python 3.14.7 + Windows 上验证过的版本\n# 安装命令：pip install -r requirements.txt\npandas==3.0.6\nnumpy==2.5.3\nmatplotlib==3.11.2\nscikit-learn==1.9.1\nmarkdown==3.11      # 用来把教程 Markdown 渲染成网页\n"},"run_all.ps1":{"path":"run_all.ps1","name":"run_all.ps1","size":1704,"mtime":"2026-10-09 00:20","ext":".ps1","kind":"text","href":"run_all.ps1","text":"# 一键运行全部课程脚本（Windows PowerShell）\n# 用法：在项目根目录打开 PowerShell，输入  .\\run_all.ps1\n\n$ErrorActionPreference = \"Stop\"\n$ProjectRoot = $PSScriptRoot\n$Python = Join-Path $ProjectRoot \".venv\\Scripts\\python.exe\"\n\nif (-not (Test-Path $Python)) {\n    Write-Host \"找不到虚拟环境 .venv\\Scripts\\python.exe\" -ForegroundColor Red\n    Write-Host \"请先按 README.md 的“第 0 步”创建并安装依赖。\" -ForegroundColor Yellow\n    exit 1\n}\n\n$env:PYTHONIOENCODING = \"utf-8\"\n[Console]::OutputEncoding = [System.Text.Encoding]::UTF8\n$OutputEncoding = [System.Text.Encoding]::UTF8\n\n$scripts = @(\n    \"download_data.py\",\n    \"01_python_basics.py\",\n    \"02_pandas_basics.py\",\n    \"03_sqlite_basics.py\",\n    \"04_load_clean.py\",\n    \"05_time_features.py\",\n    \"06_baseline_model.py\",\n    \"07_cyclic_encoding.py\",\n    \"08_lag_rolling_features.py\",\n    \"09_model_comparison.py\",\n    \"10_plots.py\"\n)\n\nforeach ($name in $scripts) {\n    Write-Host \"`n========== 正在运行 $name ==========\" -ForegroundColor Cyan\n    & $Python (Join-Path $ProjectRoot \"scripts\\$name\")\n}\n\nWrite-Host \"`n========== 正在生成网页学习指引 ==========\" -ForegroundColor Cyan\n& $Python (Join-Path $ProjectRoot \"guide\\build_guide.py\")\n\nWrite-Host \"`n========== 正在生成可打印的 PDF 手册 ==========\" -ForegroundColor Cyan\n& $Python (Join-Path $ProjectRoot \"guide\\build_handbook.py\")\n\nWrite-Host \"`n全部脚本运行完成！请看 outputs 文件夹里的图片和表格。\" -ForegroundColor Green\nWrite-Host \"网页指引已生成：guide\\index.html\" -ForegroundColor Green\nWrite-Host \"推荐打开方式：powershell -File .\\guide\\start-server.ps1\" -ForegroundColor Green\n"},"scripts/01_python_basics.py":{"path":"scripts/01_python_basics.py","name":"01_python_basics.py","size":6311,"mtime":"2026-10-09 13:51","ext":".py","kind":"text","href":"scripts/01_python_basics.py","text":"\"\"\"第 1 课：Python 零基础速通。\n\n这一课只讲后面做特征工程一定会用到的 6 样东西：\n1. 变量和列表 list\n2. 字典 dict\n3. 队列 deque\n4. 函数 def\n5. 文件读写\n6. 循环和条件\n\n运行：python scripts/01_python_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import deque\n\nfrom common import TABLES_DIR, print_step, print_title\n\n\n# ---------------------------------------------------------------------------\n# 1. 列表 list：一排有顺序的数据\n# ---------------------------------------------------------------------------\ndef lesson_list() -> None:\n    print_step(\"1. 列表 list：就像一排储物柜，每个格子有编号\")\n\n    # 注意：Python 的编号从 0 开始，不是从 1 开始。\n    temperatures = [11.0, 12.5, 10.8, 9.6, 13.2]\n    print(\"原始列表：\", temperatures)\n    print(\"第 1 个元素 temperatures[0] =\", temperatures[0])\n    print(\"最后 1 个元素 temperatures[-1] =\", temperatures[-1])\n    print(\"前 3 个元素 temperatures[:3] =\", temperatures[:3])\n\n    temperatures.append(14.0)\n    print(\"append(14.0) 之后：\", temperatures)\n    print(\"最大值 =\", max(temperatures), \"  平均值 =\", sum(temperatures) / len(temperatures))\n\n\n# ---------------------------------------------------------------------------\n# 2. 字典 dict：用名字找值，就像通讯录\n# ---------------------------------------------------------------------------\ndef lesson_dict() -> None:\n    print_step(\"2. 字典 dict：用名字（键）找值\")\n\n    row = {\n        \"city\": \"南京\",\n        \"date\": \"2026-10-08\",\n        \"temperature\": 22.5,\n        \"is_weekend\": False,\n    }\n    print(\"一整条记录：\", row)\n    print('row[\"temperature\"] =', row[\"temperature\"])\n\n    row[\"weather\"] = \"多云\"  # 新增一个键\n    row[\"temperature\"] = 23.1  # 修改已有的键\n    print(\"修改后：\", row)\n\n    for key, value in row.items():\n        print(f\"  {key} -> {value}\")\n\n\n# ---------------------------------------------------------------------------\n# 3. 队列 deque：只保留最近 N 个值，天然适合“滑动窗口”\n# ---------------------------------------------------------------------------\ndef lesson_queue() -> None:\n    print_step(\"3. 队列 deque：进门排队，先来先走；只留最近 3 个数\")\n\n    window = deque(maxlen=3)\n    hourly_pm25 = [80, 75, 90, 120, 110, 95]\n\n    for hour, value in enumerate(hourly_pm25):\n        window.append(value)\n        average = sum(window) / len(window)\n        print(f\"第 {hour} 小时 PM2.5={value:>3}，窗口={list(window)}，窗口均值={average:.1f}\")\n\n    print(\"\\n这就是“滑动窗口”：每一步丢掉最老的数，加入最新的数，再算统计量。\")\n\n\n# ---------------------------------------------------------------------------\n# 4. 函数 def：把一段代码打包，起个名字反复用\n# ---------------------------------------------------------------------------\ndef c_to_f(celsius: float) -> float:\n    \"\"\"把摄氏度换成华氏度。\"\"\"\n    return celsius * 9 / 5 + 32\n\n\ndef lesson_function() -> None:\n    print_step(\"4. 函数 def：输入 -> 处理 -> 输出\")\n\n    for celsius in [0, 10, 25, 37]:\n        print(f\"{celsius:>3} 摄氏度 = {c_to_f(celsius):>5.1f} 华氏度\")\n\n\n# ---------------------------------------------------------------------------\n# 5. 文件读写：把结果存下来，下次还能用\n# ---------------------------------------------------------------------------\ndef lesson_file() -> None:\n    print_step(\"5. 文件读写：写出去，再读回来\")\n\n    note_path = TABLES_DIR / \"python_notes.txt\"\n    note_path.write_text(\n        \"我今天学会了列表、字典、队列、函数和文件读写。\\n\",\n        encoding=\"utf-8\",\n    )\n    print(f\"已写入：{note_path}\")\n    print(\"读回来：\", note_path.read_text(encoding=\"utf-8\").strip())\n\n    # 追加一行（\\n 表示换行）\n    with note_path.open(\"a\", encoding=\"utf-8\") as f:\n        f.write(\"下一步：用 pandas 读真正的 CSV 数据。\\n\")\n    print(\"追加后文件内容：\")\n    print(note_path.read_text(encoding=\"utf-8\"))\n\n\n# ---------------------------------------------------------------------------\n# 6. 循环 + 条件：自动给每条记录打标签\n# ---------------------------------------------------------------------------\ndef lesson_loop_and_if() -> None:\n    print_step(\"6. 循环 + 条件：给每个 PM2.5 数值分级\")\n\n    hourly_pm25 = [35, 76, 120, 210, 45, 90]\n    for value in hourly_pm25:\n        if value <= 50:\n            level = \"优\"\n        elif value <= 100:\n            level = \"良\"\n        elif value <= 150:\n            level = \"轻度污染\"\n        else:\n            level = \"中重度污染\"\n        print(f\"PM2.5={value:>3} -> {level}\")\n\n\n# ---------------------------------------------------------------------------\n# 小练习：先自己想，再看运行结果对照\n# ---------------------------------------------------------------------------\ndef exercises() -> None:\n    print_step(\"小练习（先暂停，自己写一写再看答案）\")\n\n    print(\"题目 1：把 [3, 1, 4, 1, 5] 排序后取最大值。\")\n    numbers = [3, 1, 4, 1, 5]\n    numbers.sort()\n    print(\"答案 1：排序后 =\", numbers, \"，最大值 =\", numbers[-1])\n\n    print(\"\\n题目 2：统计一句话里每个单词出现的次数。\")\n    sentence = \"time time series window time\"\n    counts: dict[str, int] = {}\n    for word in sentence.split():\n        counts[word] = counts.get(word, 0) + 1\n    print(\"答案 2：\", counts)\n\n    print(\"\\n题目 3：用 deque 算最近 3 个数的平均值。\")\n    window = deque(maxlen=3)\n    for value in [10, 20, 30, 40]:\n        window.append(value)\n    print(\"答案 3：最后一个窗口 =\", list(window), \"，均值 =\", sum(window) / len(window))\n\n\ndef main() -> None:\n    print_title(\"第 1 课：Python 零基础速通\")\n    print(\"这一课不需要背，先看代码 -> 运行 -> 改数字再运行。\")\n\n    lesson_list()\n    lesson_dict()\n    lesson_queue()\n    lesson_function()\n    lesson_file()\n    lesson_loop_and_if()\n    exercises()\n\n    print(\"\\n完成！你刚刚已经用到了后面做滑动窗口的核心思路。\")\n    print(\"下一步：python scripts/02_pandas_basics.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/02_pandas_basics.py":{"path":"scripts/02_pandas_basics.py","name":"02_pandas_basics.py","size":3652,"mtime":"2026-10-08 21:09","ext":".py","kind":"text","href":"scripts/02_pandas_basics.py","text":"\"\"\"第 2 课：pandas 基础。\n\npandas 是 Python 处理表格数据的工具。你可以把它想成“用代码操作的 Excel”。\n最重要的两个概念：\n- Series：一列数据\n- DataFrame：一张表格（很多列）\n\n运行：python scripts/02_pandas_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom common import PROCESSED_DIR, load_raw_data, print_step, print_title\n\n\ndef describe_dataframe() -> pd.DataFrame:\n    \"\"\"手动造一张小表，先认识 DataFrame 长什么样。\"\"\"\n    print_step(\"1. 手动造一张表：3 天的天气记录\")\n\n    df = pd.DataFrame(\n        {\n            \"date\": [\"2026-10-01\", \"2026-10-02\", \"2026-10-03\"],\n            \"city\": [\"南京\", \"南京\", \"南京\"],\n            \"temperature\": [28.0, 31.5, 24.0],\n            \"rain_mm\": [0.0, 12.5, 3.2],\n        }\n    )\n\n    print(df)\n    print(\"\\n形状（行数, 列数）：\", df.shape)\n    print(\"列名：\", df.columns.tolist())\n    print(\"\\n每一列的类型：\")\n    print(df.dtypes)\n    print(\"\\n数值列的统计：\")\n    print(df.describe())\n    return df\n\n\ndef select_and_filter(df: pd.DataFrame) -> None:\n    print_step(\"2. 选列、筛选行、加新列\")\n\n    print('只选一列 df[\"temperature\"]：')\n    print(df[\"temperature\"])\n\n    print(\"\\n只选两列：\")\n    print(df[[\"date\", \"temperature\"]])\n\n    print(\"\\n筛选出下雨超过 5 毫米的行：\")\n    rainy = df[df[\"rain_mm\"] > 5]\n    print(rainy)\n\n    df[\"is_rainy\"] = df[\"rain_mm\"] > 0\n    df[\"temp_f\"] = df[\"temperature\"] * 9 / 5 + 32\n    print(\"\\n新增两列后：\")\n    print(df)\n\n\ndef groupby_demo() -> None:\n    print_step(\"3. groupby：把数据分组后再算统计量\")\n\n    bigger = pd.DataFrame(\n        {\n            \"city\": [\"南京\", \"南京\", \"北京\", \"北京\", \"上海\"],\n            \"temperature\": [28.0, 31.5, 22.0, 20.5, 26.0],\n        }\n    )\n    print(bigger)\n    print(\"\\n按城市求温度平均值：\")\n    print(bigger.groupby(\"city\")[\"temperature\"].mean())\n\n\ndef datetime_demo() -> None:\n    print_step(\"4. 时间列：字符串 -> datetime -> 拆出年月日时\")\n\n    stamps = pd.Series([\"2026-10-08 08:00:00\", \"2026-10-08 09:00:00\", \"2026-10-09 00:00:00\"])\n    dt = pd.to_datetime(stamps)\n\n    print(\"原来的字符串：\")\n    print(stamps)\n    print(\"\\n变成 datetime 后：\")\n    print(dt)\n\n    result = pd.DataFrame(\n        {\n            \"datetime\": dt,\n            \"year\": dt.dt.year,\n            \"month\": dt.dt.month,\n            \"day\": dt.dt.day,\n            \"hour\": dt.dt.hour,\n            \"weekday\": dt.dt.dayofweek,  # 0=周一, 6=周日\n            \"is_weekend\": dt.dt.dayofweek >= 5,\n        }\n    )\n    print(\"\\n拆出来的时间特征：\")\n    print(result)\n\n\ndef read_real_csv() -> None:\n    print_step(\"5. 读真正的 CSV：北京 PM2.5 原始数据\")\n\n    df = load_raw_data()\n    print(\"形状（行数, 列数）：\", df.shape)\n    print(\"\\n前 5 行：\")\n    print(df.head().to_string(index=False))\n    print(\"\\n每列缺多少个值：\")\n    print(df.isna().sum())\n    print(\"\\npm2.5 这一列的统计：\")\n    print(df[\"pm2.5\"].describe())\n\n    demo_path = PROCESSED_DIR / \"pandas_demo.csv\"\n    df.head(100).to_csv(demo_path, index=False, encoding=\"utf-8-sig\")\n    print(f\"\\n前 100 行已保存到：{demo_path}\")\n\n\ndef main() -> None:\n    print_title(\"第 2 课：pandas 基础\")\n\n    df = describe_dataframe()\n    select_and_filter(df)\n    groupby_demo()\n    datetime_demo()\n    read_real_csv()\n\n    print(\"\\n完成！记住 4 个动作：读数据、看数据、选数据、造新列。\")\n    print(\"下一步：python scripts/03_sqlite_basics.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/03_sqlite_basics.py":{"path":"scripts/03_sqlite_basics.py","name":"03_sqlite_basics.py","size":4809,"mtime":"2026-10-09 12:00","ext":".py","kind":"text","href":"scripts/03_sqlite_basics.py","text":"\"\"\"第 3 课：SQLite 数据库基础（Python 自带，零配置）。\n\n你要掌握的 4 个动作：\n- 增：INSERT\n- 删：DELETE\n- 改：UPDATE\n- 查：SELECT\n\n外加两个重要概念：\n- 主键 PRIMARY KEY：每一行的唯一身份证，不允许重复\n- 索引 INDEX：像书的目录，查得更快\n\n运行：python scripts/03_sqlite_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sqlite3\n\nfrom common import PROCESSED_DIR, print_step, print_title\n\nDB_PATH = PROCESSED_DIR / \"practice.db\"\n\n\ndef create_table(conn: sqlite3.Connection) -> None:\n    print_step(\"1. 建表：CREATE TABLE（id 是主键）\")\n\n    sql = \"\"\"\n    CREATE TABLE IF NOT EXISTS weather_notes (\n        id      INTEGER PRIMARY KEY,   -- 唯一身份证，不能重复\n        city    TEXT    NOT NULL,\n        date    TEXT    NOT NULL,\n        temp    REAL,\n        note    TEXT\n    )\n    \"\"\"\n    conn.execute(sql)\n    conn.commit()\n    print(\"表 weather_notes 已创建。\")\n    print(\"字段：id（主键）, city, date, temp, note\")\n\n\ndef insert_rows(conn: sqlite3.Connection) -> None:\n    print_step(\"2. 增：INSERT 插入数据\")\n\n    rows = [\n        (1, \"Nanjing\", \"2026-10-01\", 28.0, \"sunny\"),\n        (2, \"Nanjing\", \"2026-10-02\", 31.5, \"hot\"),\n        (3, \"Beijing\", \"2026-10-01\", 22.0, \"cloudy\"),\n        (4, \"Shanghai\", \"2026-10-03\", 26.0, \"rainy\"),\n    ]\n    conn.executemany(\n        \"INSERT OR REPLACE INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\",\n        rows,\n    )\n    conn.commit()\n    print(f\"插入了 {len(rows)} 行。注意 SQL 里的 ? 是占位符，防止拼字符串出错。\")\n\n\ndef select_rows(conn: sqlite3.Connection) -> None:\n    print_step(\"3. 查：SELECT 查询数据\")\n\n    print(\"查询全部（按 id 排序）：\")\n    for row in conn.execute(\"SELECT id, city, date, temp, note FROM weather_notes ORDER BY id\"):\n        print(\"  \", row)\n\n    print(\"\\n只查南京的记录：\")\n    for row in conn.execute(\"SELECT * FROM weather_notes WHERE city = ?\", (\"Nanjing\",)):#必须为元组\n        print(\"  \", row)\n\n    print(\"\\n每个城市有几条记录（GROUP BY）：\")\n    for row in conn.execute(\n        \"SELECT city, COUNT(*) AS n FROM weather_notes GROUP BY city ORDER BY n DESC\"\n    ):\n        print(\"  \", row)\n\n\ndef update_row(conn: sqlite3.Connection) -> None:\n    print_step(\"4. 改：UPDATE 修改数据\")\n\n    conn.execute(\"UPDATE weather_notes SET temp = ?, note = ? WHERE id = ?\", (29.5, \"updated\", 1))\n    conn.commit()\n    print(\"把 id=1 的温度改成 29.5：\")\n    print(\"  \", conn.execute(\"SELECT * FROM weather_notes WHERE id = 1\").fetchone())\n\n\ndef delete_row(conn: sqlite3.Connection) -> None:\n    print_step(\"5. 删：DELETE 删除数据（只删 id=4）\")\n\n    conn.execute(\"DELETE FROM weather_notes WHERE id = ?\", (4,))\n    conn.commit()\n    remaining = conn.execute(\"SELECT COUNT(*) FROM weather_notes\").fetchone()[0]\n    print(f\"删除后还剩 {remaining} 行。\")\n\n\ndef show_primary_key_rule(conn: sqlite3.Connection) -> None:\n    print_step(\"6. 主键为什么重要：插入重复 id 会直接报错\")\n\n    try:\n        conn.execute(\n            \"INSERT INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\",\n            (2, \"Suzhou\", \"2026-10-05\", 25.0, \"duplicate test\"),\n        )\n        conn.commit()\n        print(\"居然插入成功了？说明主键设置有问题。\")\n    except sqlite3.IntegrityError as exc:\n        print(\"插入失败，这其实是好事：\", exc)\n        print(\"数据库帮我们挡住了重复 id=2，保证每一行都有唯一身份。\")\n\n\ndef create_index(conn: sqlite3.Connection) -> None:\n    print_step(\"7. 索引：给常用查询列建目录\")\n\n    conn.execute(\"CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)\")\n    conn.commit()\n    print(\"已创建索引 idx_weather_city（按 city 查询会更快）。\")\n\n    print(\"\\n当前数据库里的表和索引：\")\n    for row in conn.execute(\n        \"SELECT type, name FROM sqlite_master WHERE type IN ('table', 'index') ORDER BY type, name\"\n    ):\n        print(\"  \", row)\n\n\ndef main() -> None:\n    print_title(\"第 3 课：SQLite 数据库基础\")\n\n    # 每次运行先删掉旧数据库，保证结果可重复。\n    if DB_PATH.exists():\n        DB_PATH.unlink()\n\n    conn = sqlite3.connect(DB_PATH)\n    try:\n        create_table(conn)\n        insert_rows(conn)\n        select_rows(conn)\n        update_row(conn)\n        delete_row(conn)\n        show_primary_key_rule(conn)\n        create_index(conn)\n    finally:\n        conn.close()\n\n    print(f\"\\n数据库文件：{DB_PATH}\")\n    print(\"可以用 DB Browser for SQLite 这个免费软件打开它，点点看表里的数据。\")\n    print(\"下一步：python scripts/04_load_clean.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/04_load_clean.py":{"path":"scripts/04_load_clean.py","name":"04_load_clean.py","size":5523,"mtime":"2026-10-08 21:12","ext":".py","kind":"text","href":"scripts/04_load_clean.py","text":"\"\"\"第 4 课：把原始 CSV 清洗成能建模的数据。\n\n做完这一步，你会得到 data/processed/pm25_clean.csv，它满足：\n1. 时间列是真正的 datetime，不是字符串；\n2. 时间统一标成 UTC；\n3. 按时间从早到晚排好序；\n4. 没有重复时间戳；\n5. 保持完整的“每小时一行”；短缺失插值，长缺失保留为空。\n\n运行：python scripts/04_load_clean.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_raw_data,\n    print_step,\n    print_title,\n)\n\nOUT_CSV = PROCESSED_DIR / \"pm25_clean.csv\"\nREPORT_TXT = TABLES_DIR / \"04_cleaning_report.txt\"\n\n\ndef build_utc_datetime(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 把 年/月/日/小时 四列拼成一个 UTC 时间列\")\n\n    print(\"原始数据里的时间是这样分开存的：\")\n    print(df[[\"year\", \"month\", \"day\", \"hour\"]].head(3).to_string(index=False))\n\n    # pd.to_datetime 可以把多列拼成时间；tz_localize(\"UTC\") 表示“这个时间本来就是 UTC”。\n    dt = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]])\n    df = df.copy()\n    df[\"datetime\"] = dt.dt.tz_localize(\"UTC\")\n\n    print(\"\\n拼好以后：\")\n    print(df[[\"datetime\", \"pm2.5\", \"TEMP\"]].head(3).to_string(index=False))\n    print(f\"\\n时间范围：{df['datetime'].min()} 到 {df['datetime'].max()}\")\n    return df\n\n\ndef sort_and_check(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 排序 + 检查重复 + 检查有没有漏掉整点\")\n\n    df = df.set_index(\"datetime\").sort_index()\n    # asfreq(\"h\") 保证时间轴是“每个整点一行”。如果有漏掉的整点，会补一行 NaN，\n    # 这样后面的 shift(24) 才真的表示 24 小时前，而不是“往前数 24 行”。\n    df = df.asfreq(\"h\")\n\n    duplicate_count = int(df.index.duplicated().sum())\n    print(f\"重复的时间戳数量：{duplicate_count}\")\n\n    expected = pd.date_range(df.index.min(), df.index.max(), freq=\"h\")\n    missing_timestamps = len(expected) - len(df)\n    print(f\"应该有的小时数：{len(expected)}\")\n    print(f\"实际有的行数：{len(df)}\")\n    print(f\"中间漏掉的时间戳数量：{missing_timestamps}\")\n\n    if duplicate_count == 0 and missing_timestamps == 0:\n        print(\"结论：时间轴完整且没有重复，可以做滞后和滑动窗口。\")\n    else:\n        print(\"注意：时间轴不完整！后面的 lag/rolling 需要先补齐时间轴。\")\n\n    return df\n\n\ndef handle_missing_pm25(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"3. 处理缺失值（重点是目标列 pm2.5）\")\n\n    missing_before = int(df[\"pm2.5\"].isna().sum())\n    print(f\"pm2.5 缺失数量：{missing_before} / {len(df)} （{missing_before / len(df):.2%}）\")\n\n    df = df.copy()\n    # 留一个“这个值原本是不是缺失”的标记，之后可以研究缺失是否和污染有关。\n    df[\"pm25_was_missing\"] = df[\"pm2.5\"].isna().astype(int)\n\n    # 时间序列常用做法：用前后时刻线性插值。\n    # limit=6 表示“最多连续补 6 个小时”，补不了的宁可按缺失处理。\n    df[\"pm2.5\"] = df[\"pm2.5\"].interpolate(method=\"linear\", limit=6, limit_direction=\"both\")\n\n    missing_after = int(df[\"pm2.5\"].isna().sum())\n    print(f\"短缺口插值后还缺：{missing_after}（占 {missing_after / len(df):.2%}）\")\n    print(\"处理原则：短缺口（不超过 6 小时）用前后值线性插值；长缺口保留 NaN，不硬猜。\")\n    print(\"为什么不直接删掉缺失行？因为删行会让时间轴断开，\")\n    print(\"shift/rolling 里的“24 小时”就会变成“往前数 24 行”，发生错位。\")\n    print(\"所以这里保留完整小时轴；建模脚本再按实际用到的特征删除无法计算的行。\")\n    print(\"注意：插值是一种“猜”，必须在报告里写清楚，不能装作数据本来没有缺失。\")\n    return df\n\n\ndef main() -> None:\n    print_title(\"第 4 课：加载 → 解析时间 → 排序 → 检查缺失\")\n\n    raw = load_raw_data()\n    print(f\"原始数据形状：{raw.shape}\")\n\n    df = build_utc_datetime(raw)\n    df = sort_and_check(df)\n    df = handle_missing_pm25(df)\n\n    print_step(\"4. 保存清洗后的数据\")\n    df.to_csv(OUT_CSV, encoding=\"utf-8-sig\")\n    print(f\"已保存：{OUT_CSV}\")\n\n    report_lines = [\n        \"北京 PM2.5 数据清洗报告\",\n        \"=\" * 40,\n        f\"原始行数：{len(raw)}\",\n        f\"最终行数（保持完整小时轴）：{len(df)}\",\n        f\"时间范围：{df.index.min()} 到 {df.index.max()}\",\n        \"时间频率：每小时（UTC）\",\n        f\"原始 pm2.5 缺失：{int(raw['pm2.5'].isna().sum())}\",\n        f\"短缺口插值后剩余缺失：{int(df['pm2.5'].isna().sum())}\",\n        \"\",\n        \"pm2.5 统计量（缺失值不参与统计）：\",\n        df[\"pm2.5\"].describe().to_string(),\n        \"\",\n        \"处理说明：\",\n        \"1. 把 year/month/day/hour 拼成 UTC datetime；\",\n        \"2. asfreq('h') 补齐时间轴，保证每个整点一行；\",\n        \"3. 对连续缺失不超过 6 小时的缺口做线性插值；\",\n        \"4. 长缺口保留为 NaN，建模时按使用的特征删除无法计算的行；\",\n        \"5. 保留 pm25_was_missing 标记，记录哪些值原本缺失。\",\n    ]\n    REPORT_TXT.write_text(\"\\n\".join(report_lines), encoding=\"utf-8\")\n    print(f\"清洗报告：{REPORT_TXT}\")\n\n    print(\"\\n完成！下一步：python scripts/05_time_features.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/05_time_features.py":{"path":"scripts/05_time_features.py","name":"05_time_features.py","size":5928,"mtime":"2026-10-08 21:13","ext":".py","kind":"text","href":"scripts/05_time_features.py","text":"\"\"\"第 5 课：从时间戳里拆出模型能用的特征。\n\n这一课对应导师要求 2.3：年、月、日、星期、小时、是否周末。\n另外还加上“周期编码”：用 sin/cos 告诉模型“23 点和 0 点是挨着的”。\n\n运行：python scripts/05_time_features.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import PROCESSED_DIR, TABLES_DIR, load_clean_data, print_step, print_title\n\nOUT_CSV = PROCESSED_DIR / \"pm25_time_features.csv\"\nDICT_CSV = TABLES_DIR / \"05_feature_dictionary.csv\"\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef add_calendar_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 拆出年、月、日、星期、小时、是否周末\")\n\n    df = df.copy()\n    index = df.index\n\n    df[\"year\"] = index.year\n    df[\"month\"] = index.month\n    df[\"day\"] = index.day\n    df[\"hour\"] = index.hour\n    df[\"dayofweek\"] = index.dayofweek  # 0=周一, 6=周日\n    df[\"weekday_name\"] = index.dayofweek.map(lambda x: WEEKDAY_NAMES[x])\n    df[\"is_weekend\"] = (index.dayofweek >= 5).astype(int)\n    df[\"dayofyear\"] = index.dayofyear\n    df[\"weekofyear\"] = index.isocalendar().week.to_numpy()\n    df[\"quarter\"] = index.quarter\n\n    print(\"新增了：year, month, day, hour, dayofweek, weekday_name, is_weekend, dayofyear, weekofyear, quarter\")\n    print(\"注意：这份数据的时间戳是 UTC。北京本地时间 = UTC + 8；\"\n          \"如果你想看北京作息，可以再算 (hour + 8) % 24。本教程保持 UTC 统一。\")\n    print(\"\\n随机看 5 行：\")\n    columns = [\"pm2.5\", \"year\", \"month\", \"day\", \"hour\", \"dayofweek\", \"weekday_name\", \"is_weekend\"]\n    print(df[columns].sample(5, random_state=42).sort_index().to_string())\n    return df\n\n\ndef add_cyclic_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 周期编码：把小时、星期、月份变成圆上的坐标\")\n\n    df = df.copy()\n\n    # 为什么小时用 24、星期用 7、月份用 12？\n    # 因为它们在各自的周期结束后会“回到开头”。\n    df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\n    df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n\n    df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n\n    df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12)\n    df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12)\n\n    print(\"新增了：hour_sin, hour_cos, dayofweek_sin, dayofweek_cos, month_sin, month_cos\")\n    print(\"\\n看几个关键时刻，体会 23 点和 0 点在圆上是挨着的：\")\n    demo = pd.DataFrame(\n        {\n            \"hour\": [0, 1, 6, 12, 18, 22, 23],\n        }\n    )\n    demo[\"hour_sin\"] = np.sin(2 * np.pi * demo[\"hour\"] / 24)\n    demo[\"hour_cos\"] = np.cos(2 * np.pi * demo[\"hour\"] / 24)\n    print(demo.to_string(index=False))\n    return df\n\n\ndef save_feature_dictionary() -> None:\n    print_step(\"3. 保存“特征字典”：每个特征怎么构造、什么意思、有什么用\")\n\n    rows = [\n        (\"year\", \"index.year\", \"年份\", \"捕捉长期变化趋势（本例里只有 5 年）\"),\n        (\"month\", \"index.month\", \"月份 1-12\", \"捕捉季节变化\"),\n        (\"day\", \"index.day\", \"几号\", \"通常用处不大，容易造成过拟合\"),\n        (\"hour\", \"index.hour\", \"小时 0-23\", \"捕捉一天内的早晚高峰\"),\n        (\"dayofweek\", \"index.dayofweek\", \"0=周一...6=周日\", \"捕捉工作日/周末差异\"),\n        (\"is_weekend\", \"dayofweek >= 5\", \"是否周末 0/1\", \"简单明了地告诉模型周末效应\"),\n        (\"dayofyear\", \"index.dayofyear\", \"1-366\", \"季节位置，比 month 精度更高\"),\n        (\"weekofyear\", \"index.isocalendar().week\", \"一年中的第几周\", \"周期性任务、报告常用\"),\n        (\"hour_sin\", \"sin(2*pi*hour/24)\", \"小时在圆上的横坐标\", \"让 23 点和 0 点距离变近\"),\n        (\"hour_cos\", \"cos(2*pi*hour/24)\", \"小时在圆上的纵坐标\", \"和 hour_sin 配对使用\"),\n        (\"dayofweek_sin\", \"sin(2*pi*dayofweek/7)\", \"星期在圆上的横坐标\", \"表达“周而复始”\"),\n        (\"dayofweek_cos\", \"cos(2*pi*dayofweek/7)\", \"星期在圆上的纵坐标\", \"和 dayofweek_sin 配对\"),\n        (\"month_sin\", \"sin(2*pi*(month-1)/12)\", \"月份在圆上的横坐标\", \"表达季节循环\"),\n        (\"month_cos\", \"cos(2*pi*(month-1)/12)\", \"月份在圆上的纵坐标\", \"和 month_sin 配对\"),\n    ]\n    dictionary = pd.DataFrame(rows, columns=[\"特征名\", \"构造方法\", \"含义\", \"可能的作用\"])\n    dictionary.to_csv(DICT_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"已保存：{DICT_CSV}\")\n    print(dictionary.to_string(index=False))\n\n\ndef print_group_patterns(df: pd.DataFrame) -> None:\n    print_step(\"4. 用平均值观察周期性：不同小时/星期，PM2.5 是否不一样？\")\n\n    by_hour = df.groupby(\"hour\")[\"pm2.5\"].mean()\n    by_weekday = df.groupby(\"weekday_name\")[\"pm2.5\"].mean().reindex(WEEKDAY_NAMES)\n\n    print(\"每个小时的平均 PM2.5（越高说明这个时段污染越重）：\")\n    for hour_value, mean_value in by_hour.items():\n        bar = \"#\" * int(mean_value / 5)\n        print(f\"  {hour_value:02d} 点：{mean_value:6.1f}  {bar}\")\n\n    print(\"\\n周一至周日的平均 PM2.5：\")\n    for name, mean_value in by_weekday.items():\n        print(f\"  {name}：{mean_value:6.1f}\")\n\n\ndef main() -> None:\n    print_title(\"第 5 课：时间特征提取\")\n\n    df = load_clean_data()\n    df = add_calendar_features(df)\n    df = add_cyclic_features(df)\n    save_feature_dictionary()\n    print_group_patterns(df)\n\n    print_step(\"5. 保存带时间特征的数据\")\n    df.to_csv(OUT_CSV, encoding=\"utf-8-sig\")\n    print(f\"已保存：{OUT_CSV}\")\n    print(f\"现在共有 {df.shape[1]} 列特征。\")\n\n    print(\"\\n完成！下一步：python scripts/06_baseline_model.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/06_baseline_model.py":{"path":"scripts/06_baseline_model.py","name":"06_baseline_model.py","size":5220,"mtime":"2026-10-08 21:08","ext":".py","kind":"text","href":"scripts/06_baseline_model.py","text":"\"\"\"第 6 课：第一个基线模型（线性回归）。\n\n任务：用“现在这个小时的时间信息”，预测“下一个小时的 PM2.5”。\n\n这一课的重点不是分数高不高，而是把整套流程跑通：\n- 目标 y 是什么\n- 特征 X 是什么\n- 怎么切分训练集/测试集（时序数据必须按时间切）\n- MAE、RMSE、R2 怎么看\n\n运行：python scripts/06_baseline_model.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.dummy import DummyRegressor\nfrom sklearn.linear_model import LinearRegression\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_time_features,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"06_baseline_results.csv\"\nPRED_CSV = TABLES_DIR / \"06_baseline_predictions.csv\"\n\n# 只允许用“预测时刻已经知道/能算出来”的列。\n# 例如现在的 month/hour 是可以知道的；pm2.5 下一个小时的值不能拿来当特征。\nTIME_FEATURES = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\n\n\ndef build_target(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 构造目标 y：下一个小时的 pm2.5\")\n\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n\n    print(\"shift(-1) 的意思是“把整列往上提一行”：\")\n    demo = df[[\"pm2.5\", \"pm25_next\"]].head(4)\n    print(demo.to_string())\n    print(\"\\n看第 1 行：现在是 80，下一小时是 75，所以 pm25_next=75。\")\n    print(\"最后一行没有“下一个小时”，所以最后一个是 NaN，待会要删掉。\")\n\n    # 最后一行没有未来目标，删掉；特征有缺失的也删掉。\n    return df.dropna(subset=[\"pm25_next\"] + TIME_FEATURES)\n\n\ndef chronological_split(df: pd.DataFrame, train_ratio: float = 0.8) -> tuple[pd.DataFrame, pd.DataFrame]:\n    print_step(\"2. 按时间切分：前 80% 训练，后 20% 测试\")\n\n    split_index = int(len(df) * train_ratio)\n    train = df.iloc[:split_index].copy()\n    test = df.iloc[split_index:].copy()\n\n    print(f\"训练集：{len(train)} 行，时间 {train.index.min()} 到 {train.index.max()}\")\n    print(f\"测试集：{len(test)} 行，时间 {test.index.min()} 到 {test.index.max()}\")\n    print(\"为什么不能随机切分？因为随机切分会把未来的数据混进训练集（考试漏题）。\")\n    return train, test\n\n\ndef evaluate(name: str, y_true: pd.Series, y_pred: np.ndarray, results: list[dict]) -> None:\n    metrics = regression_metrics(y_true, y_pred)\n    print(\n        f\"{name:<24} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\"\n    )\n    results.append(\n        {\n            \"模型\": name,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n        }\n    )\n\n\ndef main() -> None:\n    print_title(\"第 6 课：线性回归基线模型\")\n\n    df = load_time_features()\n    df = build_target(df)\n    train, test = chronological_split(df)\n\n    x_train = train[TIME_FEATURES]\n    x_test = test[TIME_FEATURES]\n    y_train = train[\"pm25_next\"]\n    y_test = test[\"pm25_next\"]\n\n    results: list[dict] = []\n    print_step(\"3. 两个模型对比：只会猜平均 vs 线性回归\")\n\n    # 基线 1：完全不管特征，永远预测训练集的平均值。\n    dummy = DummyRegressor(strategy=\"mean\")\n    dummy.fit(x_train, y_train)\n    dummy_pred = dummy.predict(x_test)\n    evaluate(\"平均值基线\", y_test, dummy_pred, results)\n\n    # 基线 2：用时间特征做线性回归。\n    model = LinearRegression()\n    model.fit(x_train, y_train)\n    pred = model.predict(x_test)\n    evaluate(\"线性回归（时间特征）\", y_test, pred, results)\n\n    print_step(\"4. 看看线性回归到底学到了什么\")\n    for feature, coefficient in sorted(\n        zip(TIME_FEATURES, model.coef_), key=lambda pair: abs(pair[1]), reverse=True\n    ):\n        print(f\"  {feature:<12} 系数 = {coefficient: .4f}\")\n    print(\"\\n系数正负只表示方向；系数大小会受特征单位影响，不能直接当重要性排名。\")\n\n    result_df = pd.DataFrame(results)\n    result_df.to_csv(RESULT_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"\\n结果表已保存：{RESULT_CSV}\")\n\n    prediction_df = pd.DataFrame(\n        {\n            \"datetime\": test.index,\n            \"y_true\": y_test.to_numpy(),\n            \"pred_dummy\": dummy_pred,\n            \"pred_time_only\": pred,\n        }\n    )\n    prediction_df.to_csv(PRED_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"预测值已保存：{PRED_CSV}\")\n\n    print(\"\\n怎么读这些指标：\")\n    print(\"- MAE：平均每次预测差多少，最好和 pm2.5 本身的平均值一起看。\")\n    print(\"- RMSE：和 MAE 类似，但会重罚离谱的大错误。\")\n    print(\"- R2：1 最好；0 约等于只会猜平均值；负数比猜平均值还差。\")\n    print(\"\\n如果 R2 很低，不要沮丧，这说明“只看钟表时间”确实不够，\")\n    print(\"下一课加入周期编码，再下一课加入滞后和滑动窗口，看看能不能变好。\")\n    print(\"\\n下一步：python scripts/07_cyclic_encoding.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/07_cyclic_encoding.py":{"path":"scripts/07_cyclic_encoding.py","name":"07_cyclic_encoding.py","size":3941,"mtime":"2026-10-08 21:09","ext":".py","kind":"text","href":"scripts/07_cyclic_encoding.py","text":"\"\"\"第 7 课：正弦/余弦周期编码，到底有没有用？\n\n对比两种写法：\nA. 直接把 hour=0..23 当成数字喂给线性回归；\nB. 把 hour 拆成 hour_sin、hour_cos 两个数再喂给线性回归。\n\n运行：python scripts/07_cyclic_encoding.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\n\nfrom common import (\n    TABLES_DIR,\n    load_time_features,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"07_cyclic_results.csv\"\nPRED_CSV = TABLES_DIR / \"07_cyclic_predictions.csv\"\n\nRAW_FEATURES = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\nCYCLIC_FEATURES = [\n    \"is_weekend\",\n    \"hour_sin\",\n    \"hour_cos\",\n    \"dayofweek_sin\",\n    \"dayofweek_cos\",\n    \"month_sin\",\n    \"month_cos\",\n]\n\n\ndef explain_problem() -> None:\n    print_step(\"1. 先说清楚：为什么直接把 23 和 0 当数字很别扭？\")\n\n    demo = pd.DataFrame({\"hour\": [0, 1, 6, 12, 18, 22, 23]})\n    demo[\"hour_sin\"] = np.sin(2 * np.pi * demo[\"hour\"] / 24)\n    demo[\"hour_cos\"] = np.cos(2 * np.pi * demo[\"hour\"] / 24)\n    print(demo.to_string(index=False))\n    print(\"\\n对模型来说，如果只给一个 hour 数字：\")\n    print(\"  23 和 0 相差 23，看起来隔得很远；\")\n    print(\"  但现实中 23:00 和 00:00 只差 1 小时。\")\n    print(\"用 sin/cos 把时间放到圆上后，两者坐标就非常接近。\")\n\n\ndef make_target(df: pd.DataFrame) -> pd.DataFrame:\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n    return df.dropna(subset=[\"pm25_next\"])\n\n\ndef fit_and_evaluate(\n    name: str,\n    train: pd.DataFrame,\n    test: pd.DataFrame,\n    features: list[str],\n    results: list[dict],\n) -> np.ndarray:\n    model = LinearRegression()\n    model.fit(train[features], train[\"pm25_next\"])\n    pred = model.predict(test[features])\n    metrics = regression_metrics(test[\"pm25_next\"], pred)\n    print(\n        f\"{name:<20} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\"\n    )\n    results.append(\n        {\n            \"模型\": name,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n        }\n    )\n    return pred\n\n\ndef main() -> None:\n    print_title(\"第 7 课：周期编码对照实验\")\n\n    explain_problem()\n\n    df = make_target(load_time_features())\n    split_index = int(len(df) * 0.8)\n    train = df.iloc[:split_index]\n    test = df.iloc[split_index:]\n\n    print_step(\"2. 同一个任务、同一段时间切分，只改特征写法\")\n    print(f\"训练集 {len(train)} 行，测试集 {len(test)} 行。\")\n\n    results: list[dict] = []\n\n    pred_raw = fit_and_evaluate(\"原始数字时间\", train, test, RAW_FEATURES, results)\n    pred_cyclic = fit_and_evaluate(\"周期编码时间\", train, test, CYCLIC_FEATURES, results)\n\n    result_df = pd.DataFrame(results)\n    result_df.to_csv(RESULT_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"\\n结果表已保存：{RESULT_CSV}\")\n\n    prediction_df = pd.DataFrame(\n        {\n            \"datetime\": test.index,\n            \"y_true\": test[\"pm25_next\"].to_numpy(),\n            \"pred_raw\": pred_raw,\n            \"pred_cyclic\": pred_cyclic,\n        }\n    )\n    prediction_df.to_csv(PRED_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"预测值已保存：{PRED_CSV}\")\n\n    print(\"\\n怎么解读：\")\n    print(\"- 如果周期编码后的 MAE/RMSE 更小、R2 更大，说明它确实有帮助。\")\n    print(\"- 如果差别很小，也不代表周期编码没用，可能只是这个数据/模型没利用好它。\")\n    print(\"- 不要把结论写成“sin/cos 一定更好”，要写成“在这个数据、这个模型、这段测试期上，结果如何”。\")\n    print(\"\\n下一步：python scripts/08_lag_rolling_features.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/08_lag_rolling_features.py":{"path":"scripts/08_lag_rolling_features.py","name":"08_lag_rolling_features.py","size":6907,"mtime":"2026-10-08 21:12","ext":".py","kind":"text","href":"scripts/08_lag_rolling_features.py","text":"\"\"\"第 8 课：滞后（lag）和滑动窗口（rolling）特征。\n\n先约定预测场景（非常重要）：\n    站在时间 t，用截至 t 已经知道的信息，预测 t+1 时刻的 pm2.5。\n\n所以：\n- t 时刻的 pm2.5、天气，都是“已经知道”的，可以用。\n- t+1 及以后的值，绝对不能作为特征，否则就是作弊（数据泄漏）。\n\n本脚本会生成：\n1. 正确特征：lag、diff、trailing rolling；\n2. 故意错误特征：中心滑动窗口（会看到未来）、把答案当特征；\n   它们只用于第 9 课的错误示范，不能放进正式模型。\n\n运行：python scripts/08_lag_rolling_features.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_clean_data,\n    print_step,\n    print_title,\n)\n\nOUT_CSV = PROCESSED_DIR / \"pm25_model_data.csv\"\nALIGN_CSV = TABLES_DIR / \"08_time_alignment.csv\"\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef add_time_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 先把第 5 课的时间特征加上\")\n\n    df = df.copy()\n    index = df.index\n    df[\"year\"] = index.year\n    df[\"month\"] = index.month\n    df[\"day\"] = index.day\n    df[\"hour\"] = index.hour\n    df[\"dayofweek\"] = index.dayofweek\n    df[\"weekday_name\"] = index.dayofweek.map(lambda x: WEEKDAY_NAMES[x])\n    df[\"is_weekend\"] = (index.dayofweek >= 5).astype(int)\n    df[\"dayofyear\"] = index.dayofyear\n\n    df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\n    df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n    df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12)\n    df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12)\n\n    print(\"时间特征已加上。\")\n    return df\n\n\ndef add_lag_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 滞后特征 lag：把过去的值挪到当前行\")\n\n    df = df.copy()\n\n    # 当前值：站在 t 时刻，pm2.5 已经测到了，当然可以用。\n    df[\"pm25_now\"] = df[\"pm2.5\"]\n\n    # shift(1) 表示“上一小时的值”，shift(24) 表示“昨天同一小时”。\n    df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1)\n    df[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2)\n    df[\"pm25_lag3\"] = df[\"pm2.5\"].shift(3)\n    df[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24)\n    df[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168)  # 24*7，上周同一小时\n\n    # diff 是“变化量”：比昨天同一小时高了多少？\n    df[\"pm25_diff1\"] = df[\"pm2.5\"].diff(1)\n    df[\"pm25_diff24\"] = df[\"pm2.5\"].diff(24)\n\n    print(\"新增：pm25_now, pm25_lag1/2/3/24/168, pm25_diff1, pm25_diff24\")\n    print(\"解释：lag24 能帮模型看到“昨天这个时候的污染水平”，lag168 看“上周同一时刻”。\")\n    return df\n\n\ndef add_rolling_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"3. 滑动窗口特征 rolling：最近的均值、波动、最大值\")\n\n    df = df.copy()\n\n    # 注意：窗口在 t 时刻结束（trailing window），里面的值都 <= t，预测 t+1 时是安全的。\n    # 数据里有少量长缺口，所以 min_periods 不要求 24/168 个值全部存在：\n    # 24 小时窗口至少要有 18 个值，168 小时窗口至少要有 120 个值。\n    # 既不会因为个别缺失就把整行丢掉，也不会只靠一两个值硬算平均。\n    window24 = df[\"pm2.5\"].rolling(window=24, min_periods=18)\n    window168 = df[\"pm2.5\"].rolling(window=168, min_periods=120)\n\n    df[\"pm25_roll24_mean\"] = window24.mean()\n    df[\"pm25_roll24_std\"] = window24.std()\n    df[\"pm25_roll24_max\"] = window24.max()\n    df[\"pm25_roll24_min\"] = window24.min()\n\n    df[\"pm25_roll168_mean\"] = window168.mean()\n    df[\"pm25_roll168_std\"] = window168.std()\n\n    print(\"新增：roll24 的 mean/std/max/min，roll168 的 mean/std。\")\n    print(\"min_periods=18 表示：24 小时窗口里至少有 18 个有效值才算；不够就填 NaN。\")\n\n    # 另外给天气变量也做几个滞后/滑动特征，体会同一套方法可以用在其他列上。\n    df[\"TEMP_lag1\"] = df[\"TEMP\"].shift(1)\n    df[\"TEMP_roll24_mean\"] = df[\"TEMP\"].rolling(24, min_periods=18).mean()\n    print(\"另外加了 TEMP_lag1、TEMP_roll24_mean 作为其他变量的例子。\")\n    return df\n\n\ndef add_target(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"4. 定义预测目标：下一个小时的 pm2.5\")\n\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n\n    print(\"pm25_next = pm2.5.shift(-1)，也就是把未来一行的值移到当前行。\")\n    print(\"这一列是“答案”，只能当 y，不能当特征 X。\")\n    return df\n\n\ndef add_leaky_demo_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"5. 故意制造两个“错误示范”特征，供下一课打脸用\")\n\n    df = df.copy()\n\n    # 错误 1：center=True 表示窗口中心在当前时刻，会看到 t+1、t+2... 的未来值。\n    df[\"pm25_roll24_mean_center_leaky\"] = df[\"pm2.5\"].rolling(\n        window=24, center=True, min_periods=24\n    ).mean()\n    df[\"pm25_roll168_mean_center_leaky\"] = df[\"pm2.5\"].rolling(\n        window=168, center=True, min_periods=168\n    ).mean()\n\n    # 错误 2：直接把答案挪过来当特征，这是最离谱的作弊方式。\n    df[\"pm25_answer_leaky\"] = df[\"pm25_next\"]\n\n    print(\"已创建 _leaky 结尾的错误特征。\")\n    print(\"名字里带 leaky 的列禁止进入正式模型，它们只用来演示“分数为什么会假高”。\")\n    return df\n\n\ndef show_alignment(df: pd.DataFrame) -> None:\n    print_step(\"6. 看一眼时间对齐：每一行到底用了哪些时刻的数据\")\n\n    columns = [\n        \"pm2.5\",\n        \"pm25_lag1\",\n        \"pm25_lag24\",\n        \"pm25_roll24_mean\",\n        \"pm25_next\",\n    ]\n    demo = df[columns].iloc[200:206]\n    print(demo.to_string())\n    print(\"\\n读表方法：\")\n    print(\"- 以某一行为当前时刻 t；\")\n    print(\"- pm25_lag1 是 t-1 的值；\")\n    print(\"- pm25_roll24_mean 是 t-23 到 t 这 24 个值的平均；\")\n    print(\"- pm25_next 是 t+1 的值，也就是我们要预测的答案。\")\n\n    demo.to_csv(ALIGN_CSV, encoding=\"utf-8-sig\")\n    print(f\"\\n对齐示例已保存：{ALIGN_CSV}\")\n\n\ndef main() -> None:\n    print_title(\"第 8 课：滞后特征 + 滑动窗口特征\")\n\n    df = load_clean_data()\n    df = add_time_features(df)\n    df = add_lag_features(df)\n    df = add_rolling_features(df)\n    df = add_target(df)\n    df = add_leaky_demo_features(df)\n    show_alignment(df)\n\n    print_step(\"7. 保存完整建模数据\")\n    df.to_csv(OUT_CSV, encoding=\"utf-8-sig\")\n    print(f\"已保存：{OUT_CSV}\")\n    print(f\"总列数：{df.shape[1]}\")\n\n    print(\"\\n完成！下一步：python scripts/09_model_comparison.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/09_model_comparison.py":{"path":"scripts/09_model_comparison.py","name":"09_model_comparison.py","size":9175,"mtime":"2026-10-08 21:09","ext":".py","kind":"text","href":"scripts/09_model_comparison.py","text":"\"\"\"第 9 课：把各种特征放在一起对比，并亲手演示数据泄漏。\n\n对比模型（全部用同一段训练/测试时间，除最后两个错误示范）：\n1. 平均值基线：永远猜训练集平均值\n2. 持续法基线：把当前 pm2.5 直接当成下一小时预测\n3. 只用原始时间特征\n4. 用周期编码时间特征\n5. 周期编码 + 滞后特征\n6. 周期编码 + 滞后 + 滑动窗口 + 天气（完整正确版）\n7. 错误示范：中心滑动窗口，偷看了未来\n8. 错误示范：把答案当特征，R2 约为 1\n9. 错误示范：随机切分时间序列\n\n运行：python scripts/09_model_comparison.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardScaler\n\nfrom common import (\n    TABLES_DIR,\n    load_model_data,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"09_model_comparison.csv\"\nABLATION_CSV = TABLES_DIR / \"09_ablation.csv\"\nPRED_CSV = TABLES_DIR / \"09_test_predictions.csv\"\nCOEF_CSV = TABLES_DIR / \"09_feature_coefficients.csv\"\n\nTIME_RAW = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\nTIME_CYC = [\n    \"is_weekend\",\n    \"hour_sin\",\n    \"hour_cos\",\n    \"dayofweek_sin\",\n    \"dayofweek_cos\",\n    \"month_sin\",\n    \"month_cos\",\n]\nLAGS = [\n    \"pm25_now\",\n    \"pm25_lag1\",\n    \"pm25_lag2\",\n    \"pm25_lag3\",\n    \"pm25_lag24\",\n    \"pm25_lag168\",\n    \"pm25_diff1\",\n    \"pm25_diff24\",\n]\nROLLS = [\n    \"pm25_roll24_mean\",\n    \"pm25_roll24_std\",\n    \"pm25_roll24_max\",\n    \"pm25_roll24_min\",\n    \"pm25_roll168_mean\",\n    \"pm25_roll168_std\",\n]\nWEATHER = [\"TEMP\", \"DEWP\", \"PRES\", \"Iws\", \"Is\", \"Ir\", \"TEMP_lag1\", \"TEMP_roll24_mean\"]\nLEAKY_CENTER = [\"pm25_roll24_mean_center_leaky\", \"pm25_roll168_mean_center_leaky\"]\nLEAKY_ANSWER = [\"pm25_answer_leaky\"]\n\n\ndef prepare_data() -> pd.DataFrame:\n    df = load_model_data()\n    needed = TIME_RAW + TIME_CYC + LAGS + ROLLS + WEATHER + LEAKY_CENTER + LEAKY_ANSWER + [\"pm25_next\"]\n    needed = list(dict.fromkeys(needed))  # 去重，保持顺序\n    df = df.dropna(subset=needed)\n    # 为了公平对比，错误特征在 dropna 后也一起留下；正式模型只是不选它们而已。\n    return df\n\n\ndef evaluate(\n    name: str,\n    feature_desc: str,\n    split_desc: str,\n    y_true: pd.Series,\n    y_pred: np.ndarray,\n    trust: str,\n    results: list[dict],\n) -> None:\n    metrics = regression_metrics(y_true, y_pred)\n    print(\n        f\"{name:<28} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}  [{trust}]\"\n    )\n    results.append(\n        {\n            \"实验\": name,\n            \"特征\": feature_desc,\n            \"切分方式\": split_desc,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n            \"是否可信\": trust,\n        }\n    )\n\n\ndef fit_predict(train: pd.DataFrame, test: pd.DataFrame, features: list[str]) -> np.ndarray:\n    model = LinearRegression()\n    model.fit(train[features], train[\"pm25_next\"])\n    return model.predict(test[features])\n\n\ndef main() -> None:\n    print_title(\"第 9 课：特征对照实验 + 数据泄漏演示\")\n\n    df = prepare_data()\n    split_index = int(len(df) * 0.8)\n    train = df.iloc[:split_index]\n    test = df.iloc[split_index:]\n\n    print(f\"总行数：{len(df)}，训练集 {len(train)}，测试集 {len(test)}\")\n    print(f\"训练时间：{train.index.min()} 到 {train.index.max()}\")\n    print(f\"测试时间：{test.index.min()} 到 {test.index.max()}\")\n\n    y_train = train[\"pm25_next\"]\n    y_test = test[\"pm25_next\"]\n    results: list[dict] = []\n\n    print_step(\"1. 正规对比（测试期都在训练期之后）\")\n\n    # 1. 平均值基线\n    mean_pred = np.full(len(test), y_train.mean())\n    evaluate(\"平均值基线\", \"无\", \"按时间 8:2\", y_test, mean_pred, \"可信\", results)\n\n    # 2. 持续法：直接把当前 pm2.5 当作下一小时\n    persistence_pred = test[\"pm25_now\"].to_numpy()\n    evaluate(\"持续法基线\", \"当前 pm2.5\", \"按时间 8:2\", y_test, persistence_pred, \"可信\", results)\n\n    pred_time_raw = fit_predict(train, test, TIME_RAW)\n    evaluate(\"只用原始时间特征\", \"month/day/hour/weekday...\", \"按时间 8:2\", y_test, pred_time_raw, \"可信\", results)\n\n    pred_time_cyc = fit_predict(train, test, TIME_CYC)\n    evaluate(\"只用周期编码时间\", \"hour_sin/cos...\", \"按时间 8:2\", y_test, pred_time_cyc, \"可信\", results)\n\n    pred_lags = fit_predict(train, test, TIME_CYC + LAGS)\n    evaluate(\"周期编码 + 滞后\", \"时间 + lag/diff\", \"按时间 8:2\", y_test, pred_lags, \"可信\", results)\n\n    full_features = TIME_CYC + LAGS + ROLLS + WEATHER\n    pred_full = fit_predict(train, test, full_features)\n    evaluate(\"完整正确版\", \"周期 + 滞后 + 滑动 + 天气\", \"按时间 8:2\", y_test, pred_full, \"可信\", results)\n\n    print_step(\"2. 错误示范：为什么会得到“假高分”\")\n\n    pred_center_leaky = fit_predict(train, test, TIME_CYC + LAGS + LEAKY_CENTER + WEATHER)\n    evaluate(\"中心滑动窗口（泄漏）\", \"窗口包含了未来值\", \"按时间 8:2\", y_test, pred_center_leaky, \"不可信\", results)\n\n    pred_answer_leaky = fit_predict(train, test, TIME_CYC + LAGS + LEAKY_ANSWER + WEATHER)\n    evaluate(\"把答案当特征（作弊）\", \"pm25_answer_leaky = 答案\", \"按时间 8:2\", y_test, pred_answer_leaky, \"不可信\", results)\n\n    # 随机切分：时间顺序被打乱，虽然有滞后列都 <= t，但它不代表“预测未来”。\n    train_random, test_random = train_test_split(df, test_size=0.2, shuffle=True, random_state=42)\n    pred_random = fit_predict(train_random, test_random, full_features)\n    evaluate(\n        \"随机切分（错误做法）\",\n        \"完整正确特征\",\n        \"随机 8:2\",\n        test_random[\"pm25_next\"],\n        pred_random,\n        \"不可信\",\n        results,\n    )\n\n    print_step(\"3. 哪些特征组有用？做“拿掉一组”对照（消融实验）\")\n    ablation_specs = [\n        (\"完整特征\", full_features),\n        (\"去掉滞后\", TIME_CYC + ROLLS + WEATHER),\n        (\"去掉滑动窗口\", TIME_CYC + LAGS + WEATHER),\n        (\"去掉天气\", TIME_CYC + LAGS + ROLLS),\n        (\"只留时间特征\", TIME_CYC),\n    ]\n\n    ablation_rows = []\n    for name, features in ablation_specs:\n        pred = fit_predict(train, test, features)\n        metrics = regression_metrics(y_test, pred)\n        print(f\"  {name:<12} MAE={metrics['MAE']:7.3f}  RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\")\n        ablation_rows.append(\n            {\n                \"实验\": name,\n                \"特征个数\": len(features),\n                \"MAE\": round(metrics[\"MAE\"], 3),\n                \"RMSE\": round(metrics[\"RMSE\"], 3),\n                \"R2\": round(metrics[\"R2\"], 4),\n            }\n        )\n\n    print_step(\"4. 标准化后的回归系数（粗看谁更重要）\")\n    scaler = StandardScaler()\n    x_train_scaled = scaler.fit_transform(train[full_features])\n    x_test_scaled = scaler.transform(test[full_features])\n    scaled_model = LinearRegression()\n    scaled_model.fit(x_train_scaled, y_train)\n\n    coefficient_rows = []\n    for feature, coefficient in zip(full_features, scaled_model.coef_):\n        coefficient_rows.append({\"特征\": feature, \"标准化系数\": round(float(coefficient), 4)})\n    coefficient_df = pd.DataFrame(coefficient_rows).sort_values(\n        \"标准化系数\", key=lambda s: s.abs(), ascending=False\n    )\n    print(coefficient_df.head(12).to_string(index=False))\n    print(\"\\n提醒：特征之间高度相关时，单个系数会被分摊，不能把它当成严格的因果结论。\")\n\n    result_df = pd.DataFrame(results)\n    result_df.to_csv(RESULT_CSV, index=False, encoding=\"utf-8-sig\")\n    pd.DataFrame(ablation_rows).to_csv(ABLATION_CSV, index=False, encoding=\"utf-8-sig\")\n    coefficient_df.to_csv(COEF_CSV, index=False, encoding=\"utf-8-sig\")\n\n    prediction_df = pd.DataFrame(\n        {\n            \"datetime\": test.index,\n            \"y_true\": y_test.to_numpy(),\n            \"pred_persistence\": persistence_pred,\n            \"pred_time_raw\": pred_time_raw,\n            \"pred_time_cyc\": pred_time_cyc,\n            \"pred_lags\": pred_lags,\n            \"pred_full\": pred_full,\n            \"pred_center_leaky\": pred_center_leaky,\n        }\n    )\n    prediction_df.to_csv(PRED_CSV, index=False, encoding=\"utf-8-sig\")\n\n    print(f\"\\n对比表：{RESULT_CSV}\")\n    print(f\"消融表：{ABLATION_CSV}\")\n    print(f\"预测值：{PRED_CSV}\")\n    print(f\"系数表：{COEF_CSV}\")\n\n    print(\"\\n结论怎么写（给你一个模板）：\")\n    print(\"从 MAE 看，完整正确版比只用时间特征好了约 X；加入滞后后提升最大，\")\n    print(\"说明 PM2.5 的“临近时刻值”信息量很强。中心滑动窗口分数虽然更好，\")\n    print(\"但它使用了预测时刻之后的数据，属于数据泄漏，不能作为真实效果。\")\n    print(\"\\n下一步：python scripts/10_plots.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"scripts/10_plots.py":{"path":"scripts/10_plots.py","name":"10_plots.py","size":8813,"mtime":"2026-10-08 21:09","ext":".py","kind":"text","href":"scripts/10_plots.py","text":"\"\"\"第 10 课：画图观察特征。\n\n图比数字更容易让人看懂：\n- 原始序列：整体趋势和季节变化\n- 7 天滑动平均：把短期噪声抹平，看清趋势\n- 差分序列：今天比昨天变化了多少，异常点更刺眼\n- 小时/星期/月份平均：周期长什么样\n- 周期编码圆：23 点和 0 点为什么变近了\n- 预测对比：加了特征以后，预测线有没有更贴近真实线\n\n运行：python scripts/10_plots.py\n图片保存在 outputs/figures/\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import (\n    FIGURES_DIR,\n    TABLES_DIR,\n    load_clean_data,\n    load_model_data,\n    load_time_features,\n    print_step,\n    print_title,\n    setup_matplotlib_chinese,\n)\n\nplt = setup_matplotlib_chinese()\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef plot_original_series() -> None:\n    print_step(\"1. 原始序列：整体看 5 年，再放大看 2 周\")\n\n    df = load_clean_data()\n    daily = df[\"pm2.5\"].resample(\"D\").mean()\n    zoom = df.loc[\"2014-06-01\":\"2014-06-14\", \"pm2.5\"]\n\n    fig, axes = plt.subplots(2, 1, figsize=(12, 8))\n    axes[0].plot(daily.index, daily.values, color=\"#2c7fb8\", linewidth=1)\n    axes[0].set_title(\"PM2.5 日平均值（2010-2014）\")\n    axes[0].set_ylabel(\"PM2.5\")\n    axes[0].grid(alpha=0.3)\n\n    axes[1].plot(zoom.index, zoom.values, color=\"#d95f02\", linewidth=1)\n    axes[1].set_title(\"放大看：2014 年 6 月前两周的每小时 PM2.5\")\n    axes[1].set_ylabel(\"PM2.5\")\n    axes[1].set_xlabel(\"UTC 时间\")\n    axes[1].grid(alpha=0.3)\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"01_原始序列与趋势.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n\n    print(\"怎么读图：\")\n    print(\"- 上图：能看出季节变化（冬天通常更高）和长期趋势。\")\n    print(\"- 下图：能看出一天内的高低起伏，这就是“日周期”。\")\n\n\ndef plot_rolling_and_diff() -> None:\n    print_step(\"2. 原始序列 vs 7 天滑动平均 vs 差分\")\n\n    df = load_clean_data()\n    daily = df[\"pm2.5\"].resample(\"D\").mean()\n    rolling7 = daily.rolling(7).mean()\n    diff1 = daily.diff(1)\n\n    fig, axes = plt.subplots(2, 1, figsize=(12, 8))\n    axes[0].plot(daily.index, daily.values, color=\"#aaaaaa\", linewidth=1, label=\"每日原始值\")\n    axes[0].plot(rolling7.index, rolling7.values, color=\"#e6550d\", linewidth=2.5, label=\"7 天滑动平均\")\n    axes[0].set_title(\"原始序列 vs 7 天滑动平均\")\n    axes[0].set_ylabel(\"PM2.5\")\n    axes[0].legend()\n    axes[0].grid(alpha=0.3)\n\n    axes[1].plot(diff1.index, diff1.values, color=\"#31a354\", linewidth=1)\n    axes[1].axhline(0, color=\"black\", linewidth=0.8)\n    axes[1].set_title(\"差分序列：今天 - 昨天（变化量）\")\n    axes[1].set_ylabel(\"变化量\")\n    axes[1].set_xlabel(\"日期（UTC）\")\n    axes[1].grid(alpha=0.3)\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"02_滑动平均与差分.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n    print(\"怎么读图：滑动平均像“降噪滤镜”；差分把“变化大不大”单独拎出来，突刺就是异常点。\")\n\n\ndef plot_periodicity() -> None:\n    print_step(\"3. 周期长什么样：按小时 / 星期 / 月份求平均\")\n\n    df = load_time_features()\n    by_hour = df.groupby(\"hour\")[\"pm2.5\"].mean()\n    by_weekday = df.groupby(\"dayofweek\")[\"pm2.5\"].mean().reindex(range(7))\n    by_month = df.groupby(\"month\")[\"pm2.5\"].mean().reindex(range(1, 13))\n\n    fig, axes = plt.subplots(1, 3, figsize=(16, 4.5))\n\n    axes[0].bar(by_hour.index, by_hour.values, color=\"#2c7fb8\")\n    axes[0].set_title(\"一天内的周期（按小时平均）\")\n    axes[0].set_xlabel(\"小时（UTC）\")\n    axes[0].set_ylabel(\"平均 PM2.5\")\n    axes[0].set_xticks(range(0, 24, 3))\n    axes[0].grid(alpha=0.3, axis=\"y\")\n\n    axes[1].bar(range(7), by_weekday.values, color=\"#31a354\")\n    axes[1].set_title(\"一周内的周期（按星期平均）\")\n    axes[1].set_xticks(range(7), WEEKDAY_NAMES)\n    axes[1].grid(alpha=0.3, axis=\"y\")\n\n    axes[2].bar(by_month.index, by_month.values, color=\"#e6550d\")\n    axes[2].set_title(\"一年内的周期（按月份平均）\")\n    axes[2].set_xlabel(\"月份\")\n    axes[2].set_xticks(range(1, 13))\n    axes[2].grid(alpha=0.3, axis=\"y\")\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"03_周期性观察.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n    print(\"怎么读图：柱子不是一条直线，说明小时/星期/月份确实包含预测信息。\")\n\n\ndef plot_prediction_comparison() -> None:\n    print_step(\"4. 预测对比：只看时间 vs 加上滞后滑动特征 vs 真实值\")\n\n    path = TABLES_DIR / \"09_test_predictions.csv\"\n    if not path.exists():\n        print(f\"找不到 {path}，请先运行 09_model_comparison.py。\")\n        return\n\n    pred = pd.read_csv(path)\n    pred[\"datetime\"] = pd.to_datetime(pred[\"datetime\"], utc=True)\n    pred = pred.set_index(\"datetime\")\n\n    # 测试期有大约 8500 小时，全部画会看不清，只取前 14 天。\n    start = pred.index.min()\n    end = start + pd.Timedelta(days=14)\n    part = pred.loc[start:end]\n\n    fig, ax = plt.subplots(figsize=(13, 5.5))\n    ax.plot(part.index, part[\"y_true\"], color=\"black\", linewidth=2, label=\"真实值\")\n    ax.plot(part.index, part[\"pred_time_cyc\"], color=\"#e6550d\", linewidth=1.5, alpha=0.9, label=\"只用周期时间特征\")\n    ax.plot(part.index, part[\"pred_full\"], color=\"#2c7fb8\", linewidth=1.5, alpha=0.9, label=\"完整正确特征\")\n    ax.set_title(\"测试期前 14 天：预
