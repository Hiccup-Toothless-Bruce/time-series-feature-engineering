x\ndf[\"year\"] = index.year\ndf[\"month\"] = index.month\ndf[\"day\"] = index.day\ndf[\"hour\"] = index.hour\ndf[\"dayofweek\"] = index.dayofweek          # 0=周一, 6=周日\ndf[\"is_weekend\"] = (index.dayofweek >= 5).astype(int)\ndf[\"dayofyear\"] = index.dayofyear\n```\n\n**作用**：\n\n- 把\"时间戳\"翻译成模型看得懂的数字：年看长期趋势，月看季节，小时看早晚高峰。\n- `day`（几号）通常用处不大，容易让模型记住偶然现象（过拟合），可以先不加。\n- `is_weekend` 是最直观的一个：工作日和周末的规律常常不一样。\n\n## 4.2 星期几的可读版本\n\n```python\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\ndf[\"weekday_name\"] = df[\"dayofweek\"].map(lambda x: WEEKDAY_NAMES[x])\n```\n\n**作用**：给人看的列，画图、写报告时比 0~6 直观；建模时用 `dayofweek` 数字列。\n\n## 4.3 周期编码：sin/cos\n\n```python\nimport numpy as np\n\ndf[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\ndf[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n\ndf[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\ndf[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n```\n\n**作用**：\n\n- 直接给模型 `hour=23` 和 `hour=0`，模型会以为它们差 23；放到圆上以后，它俩其实是邻居。\n- 除以周期长度（24 小时、7 天、12 个月），再用 sin/cos 算出圆上的横纵坐标，两个数配对表示一个位置。\n- 月份编码写 `(month - 1) / 12`，是为了让 1 月从 0 开始，跟其他周期的写法一致。\n\n## 4.4 观察周期性\n\n```python\nby_hour = df.groupby(\"hour\")[\"pm2.5\"].mean()\nby_weekday = df.groupby(\"weekday_name\")[\"pm2.5\"].mean().reindex(WEEKDAY_NAMES)\n```\n\n**作用**：分组求平均，看看\"哪个小时更脏、哪一天更脏\"。柱子高低差别明显，就说明时间特征有用。\n\n---\n\n# 5. 滞后与滑动窗口\n\n对应脚本：`scripts/08_lag_rolling_features.py`。\n\n## 5.1 lag：把过去的值挪到当前行\n\n```python\ndf[\"pm25_now\"] = df[\"pm2.5\"]        # 当前时刻的值（可以立刻测到，能用）\ndf[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1)      # 上一小时\ndf[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2)      # 上两小时\ndf[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24)    # 昨天同一小时\ndf[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168)  # 上周同一小时（7×24）\n```\n\n**作用**：\n\n- `shift(1)` 把整列往下挪一格，于是\"上一小时的值\"出现在当前行，可以当作特征。\n- 污染物有明显惯性，`lag1`、`lag24` 通常是最有用的特征。\n- 挪完前几行会出现 NaN，这是正常的，最后 `dropna` 掉即可。\n\n## 5.2 diff：变化量\n\n```python\ndf[\"pm25_diff1\"] = df[\"pm2.5\"].diff(1)     # 比上一小时高/低了多少\ndf[\"pm25_diff24\"] = df[\"pm2.5\"].diff(24)   # 比昨天同一小时高/低了多少\n```\n\n**作用**：`diff` 相当于\"当前值 − 之前的值\"，描述的是趋势和变化速度，对突变更敏感。\n\n## 5.3 rolling：滑动窗口\n\n```python\nwindow24 = df[\"pm2.5\"].rolling(window=24, min_periods=18)\n\ndf[\"pm25_roll24_mean\"] = window24.mean()   # 最近 24 小时平均\ndf[\"pm25_roll24_std\"] = window24.std()     # 最近 24 小时波动\ndf[\"pm25_roll24_max\"] = window24.max()     # 最近 24 小时最高\ndf[\"pm25_roll24_min\"] = window24.min()     # 最近 24 小时最低\n\ndf[\"pm25_roll168_mean\"] = df[\"pm2.5\"].rolling(window=168, min_periods=120).mean()  # 最近 7 天\n```\n\n**作用**：\n\n- 默认窗口在当前时刻结束（trailing），里面全是过去的值，预测下一小时时是安全的。\n- `min_periods=18` 表示\"24 小时里至少有 18 个有效值才算\"，既不会被个别缺失整行丢掉，也不会只靠一两个值硬算平均。\n- `mean` 看水平、`std` 看稳定程度、`max/min` 看极端情况。\n\n## 5.4 目标：下一个小时的值\n\n```python\ndf[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)    # 向上挪一格 = 下一小时的值\ndf = df.dropna(subset=[\"pm25_next\"])       # 最后一行没有下一小时，删掉\n```\n\n**作用**：\n\n- 这一列是**答案（y）**，只能用来训练和打分，绝不能出现在特征列里。\n- `shift(-1)` 和 `shift(1)` 方向相反：负数 = 未来，正数 = 过去。\n\n## 5.5 时间对齐：一张表看懂谁对应谁\n\n| 列名 | 对应时刻 | 说明 |\n| --- | --- | --- |\n| `pm2.5` | t | 当前小时测得的值 |\n| `pm25_lag1` | t-1 | 上一小时 |\n| `pm25_lag24` | t-24 | 昨天同一小时 |\n| `pm25_roll24_mean` | t-23 ~ t | 最近 24 小时的平均 |\n| `pm25_next` | t+1 | 要预测的答案 |\n\n**作用**：写代码时随时回看这张表，就不容易把未来信息混进特征（这是最常见的错误）。\n\n---\n\n# 6. 建模与评估\n\n对应脚本：`scripts/06_baseline_model.py`、`07_cyclic_encoding.py`、`09_model_comparison.py`。\n\n## 6.1 准备好 X 和 y\n\n```python\nfeatures = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\n\nx_train = train[features]      # 特征（问题）\ny_train = train[\"pm25_next\"]   # 目标（答案）\n```\n\n**作用**：\n\n- 建模就是把\"能知道的信息\"（X）和\"要预测的答案\"（y）分清楚。\n- 特征必须满足一个条件：**在预测时刻已经能拿到**。\n\n## 6.2 按时间切分训练集/测试集\n\n```python\nsplit_index = int(len(df) * 0.8)\ntrain = df.iloc[:split_index].copy()     # 前 80%：训练\ntest = df.iloc[split_index:].copy()      # 后 20%：测试\n```\n\n**作用**：\n\n- 时序数据必须\"用过去训练、拿未来测试\"，模拟真实预测场景。\n- 随机切分会让未来信息混进训练集，分数虚高（第 7 章有真实数字对比）。\n\n## 6.3 基线模型：先跑简单的\n\n```python\nfrom sklearn.dummy import DummyRegressor\n\ndummy = DummyRegressor(strategy=\"mean\")   # 永远预测训练集的平均值\ndummy.fit(x_train, y_train)\ndummy_pred = dummy.predict(x_test)\n\npersistence_pred = test[\"pm25_now\"].to_numpy()   # 持续法：下一小时 = 当前小时\n```\n\n**作用**：\n\n- 平均值基线：什么都不学，只猜平均值，用来当\"最低标准\"。\n- 持续法：直接说\"下一小时和现在差不多\"。在污染物、股价这类有惯性的数据上，它往往很强。\n- 复杂模型如果打不过这两个基线，说明特征或方法有问题。\n\n## 6.4 线性回归\n\n```python\nfrom sklearn.linear_model import LinearRegression\n\nmodel = LinearRegression()\nmodel.fit(x_train, y_train)      # 训练\npred = model.predict(x_test)     # 预测\n\nfor name, coef in zip(features, model.coef_):\n    print(name, round(coef, 4))  # 看每个特征的系数\n```\n\n**作用**：\n\n- 线性回归就是给每个特征学一个权重，然后加权求和。\n- 系数正负表示方向（正 = 越大越容易高），但系数大小受量纲影响，不能直接当重要性排名；想比较大小要先标准化。\n\n## 6.5 标准化后再看系数\n\n```python\nfrom sklearn.preprocessing import StandardScaler\n\nscaler = StandardScaler()\nx_train_scaled = scaler.fit_transform(train[features])\nx_test_scaled = scaler.transform(test[features])     # 注意：用训练集的规则去转换测试集\n\nmodel = LinearRegression().fit(x_train_scaled, y_train)\n```\n\n**作用**：把所有特征缩放到可比的尺度，系数大小才能横向比较（本项目输出到 `09_feature_coefficients.csv`）。\n\n## 6.6 三个指标怎么读\n\n```python\nmae = np.mean(np.abs(y_true - y_pred))                    # 平均差多少\nrmse = np.sqrt(np.mean((y_true - y_pred) ** 2))           # 更重罚大错\nr2 = 1 - np.sum((y_true - y_pred) ** 2) / np.sum((y_true - y_true.mean()) ** 2)\n```\n\n**作用**：\n\n- **MAE**：平均每次预测差多少，最好和 PM2.5 本身的平均值一起看（本数据平均约 80~100，MAE 11 就不错）。\n- **RMSE**：和 MAE 类似，但对离谱的大错误更敏感。\n- **R²**：1 最好；0 约等于\"只会猜平均值\"；负数说明比猜平均值还差。\n\n## 6.7 实验怎么写\n\n```text\n实验名 | 用了哪些特征 | 切分方式 | MAE | RMSE | R² | 是否可信\n```\n\n**作用**：\n\n- 一次只改一处，其他保持不变，这样的对比才有意义（控制变量）。\n- 表里一定要标出\"是否可信\"，把泄漏实验单独区分开（项目里已有这张表：`outputs/tables/09_model_comparison.csv`）。\n\n---\n\n# 7. 数据泄漏：三种错误示范\n\n对应脚本：`scripts/08_lag_rolling_features.py`、`scripts/09_model_comparison.py`。\n\n## 7.1 中心滑动窗口（看了未来）\n\n```python\n# 错误：center=True 表示窗口中心在当前行，会包含 t+1、t+2 的未来值\ndf[\"pm25_roll24_mean_center_leaky\"] = df[\"pm2.5\"].rolling(window=24, center=True, min_periods=24).mean()\n```\n\n**作用/后果**：预测下一小时时却用了后面几小时的信息。分数会变好，但这个\"好\"是假的。\n\n## 7.2 把答案当特征（最离谱的作弊）\n\n```python\ndf[\"pm25_answer_leaky\"] = df[\"pm25_next\"]     # 严重错误：答案直接变成特征\n```\n\n**作用/后果**：模型等于抄答案，R² 会到 1.0000、MAE 会到 0。看到\"完美分数\"先怀疑泄漏，而不是高兴。\n\n## 7.3 随机切分（考试漏题）\n\n```python\n# 错误做法：时序数据不要这样切\nx_train, x_test, y_train, y_test = train_test_split(x, y, test_size=0.2, random_state=42)\n```\n\n**作用/后果**：随机切分会把\"未来\"混进训练集，测试分数虚高（本项目对比：随机切分 R² 0.9494，按时间切分 0.9426，看起来更好，但不可信）。\n\n## 7.4 防泄漏检查清单\n\n- [ ] 每一列特征，在预测时刻 t 都拿得到吗？（拿不到就删）\n- [ ] 有没有 `center=True`？有就改成默认的 trailing 窗口。\n- [ ] 有没有列名带 `next`、`answer`、`leaky` 却出现在 `features` 里？\n- [ ] 是在排序 + 补齐时间轴之后才算的 `shift`/`rolling` 吗？\n- [ ] 训练集时间是否完全早于测试集？\n- [ ] 分数好得反常（R²>0.99）时，是否停下来查一遍泄漏？\n\n---\n\n# 8. 画图\n\n对应脚本：`scripts/10_plots.py`；对应教程：`docs/06-画图与Kaggle.md`。\n\n## 8.1 中文画图设置\n\n```python\nimport matplotlib\nmatplotlib.use(\"Agg\")            # 不弹窗，直接存图片文件\n\nimport matplotlib.pyplot as plt\nplt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\", \"SimHei\"]   # 中文不乱码\nplt.rcParams[\"axes.unicode_minus\"] = False                        # 负号正常显示\nplt.rcParams[\"figure.dpi\"] = 120\n```\n\n**作用**：不设置字体，中文标题会变成一排方框；`Agg` 让脚本在服务器/无窗口环境也能出图。\n\n## 8.2 常用图\n\n```python\nfig, axes = plt.subplots(2, 1, figsize=(12, 8))    # 上下两张图\n\naxes[0].plot(daily.index, daily[\"pm2.5\"], color=\"#2c7fb8\")        # 折线：看趋势\naxes[0].set_title(\"PM2.5 日均值（UTC）\")\naxes[0].set_ylabel(\"PM2.5\")\n\naxes[1].plot(sample.index, sample[\"pm2.5\"], linewidth=0.8)        # 局部放大看细节\nfig.tight_layout()\nfig.savefig(\"outputs/figures/01_原始序列与趋势.png\", bbox_inches=\"tight\")\n```\n\n```python\nplt.figure(figsize=(8, 4))\nplt.bar(by_hour.index, by_hour.values, color=\"#31a354\")           # 柱状：比较不同小时\nplt.xlabel(\"UTC 小时\"); plt.ylabel(\"平均 PM2.5\")\nplt.savefig(\"outputs/figures/03_周期性观察.png\", bbox_inches=\"tight\")\n```\n\n```python\nfig, ax = plt.subplots(figsize=(13, 5.5))\nax.plot(part.index, part[\"y_true\"], color=\"black\", linewidth=2, label=\"真实值\")\nax.plot(part.index, part[\"pred_time_cyc\"], color=\"#e6550d\", label=\"只用周期时间特征\")\nax.plot(part.index, part[\"pred_full\"], color=\"#2c7fb8\", label=\"完整正确特征\")\nax.legend()\nax.set_title(\"测试期前 14 天：预测值 vs 真实值\")\n```\n\n**作用**：\n\n- 折线看趋势和周期，柱状比较分组均值，散点看两个变量的关系。\n- 预测对比图是最有说服力的一张：真实值、简单特征、完整特征画在一起，一眼看出差别。\n\n## 8.3 每张图在说什么\n\n| 图 | 看什么 |\n| --- | --- |\n| 原始序列 | 整体趋势、有没有季节性 |\n| 滑动平均与差分 | 7 天滑动平均像降噪滤镜；差分把突变单独拎出来 |\n| 周期性观察 | 不同小时/星期/月份的平均值差别大不大 |\n| 预测对比 | 简单特征几乎是一条平线，完整特征能跟住真实值 |\n| 周期编码圆 | 23 点和 0 点在圆上是邻居 |\n| 相关性热力图 | 哪个特征和下一小时 PM2.5 线性相关更强（相关 ≠ 因果） |\n\n---\n\n# 9. SQLite 数据库\n\n对应脚本：`scripts/03_sqlite_basics.py`。Python 自带，零配置。\n\n## 9.1 连接与建表\n\n```python\nimport sqlite3\n\nconn = sqlite3.connect(\"data/processed/practice.db\")\nconn.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS weather_notes (\n        id    INTEGER PRIMARY KEY,   -- 主键：唯一身份证，不能重复\n        city  TEXT NOT NULL,\n        date  TEXT NOT NULL,\n        temp  REAL,\n        note  TEXT\n    )\n\"\"\")\nconn.commit()\n```\n\n**作用**：\n\n- SQLite 把整个数据库存成一个 `.db` 文件，不用装服务器，适合练习和小项目。\n- `PRIMARY KEY` 保证每行有唯一 id；`NOT NULL` 表示这列不能空着。\n- 类型：`INTEGER` 整数、`TEXT` 文本、`REAL` 小数。\n\n## 9.2 增删改查\n\n```python\n# 增：? 是占位符，防止拼字符串出错（也能防注入）\nconn.executemany(\n    \"INSERT OR REPLACE INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\",\n    [(1, \"Nanjing\", \"2026-10-01\", 28.0, \"sunny\")],\n)\n\n# 查\nconn.execute(\"SELECT * FROM weather_notes WHERE city = ? ORDER BY id\", (\"Nanjing\",))\nconn.execute(\"SELECT city, COUNT(*) AS n FROM weather_notes GROUP BY city ORDER BY n DESC\")\n\n# 改\nconn.execute(\"UPDATE weather_notes SET temp = ?, note = ? WHERE id = ?\", (29.5, \"updated\", 1))\n\n# 删\nconn.execute(\"DELETE FROM weather_notes WHERE id = ?\", (4,))\n\nconn.commit()    # 增删改之后一定要 commit\nconn.close()     # 用完关掉\n```\n\n**作用**：\n\n- `SELECT` 查、`INSERT` 增、`UPDATE` 改、`DELETE` 删 —— 数据库的四个基本动作。\n- `WHERE` 决定动哪几行；**忘了写 WHERE，UPDATE/DELETE 会作用到整张表**，务必先 `SELECT` 确认。\n\n## 9.3 主键与索引\n\n```python\nconn.execute(\"CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)\")\n```\n\n**作用**：\n\n- 主键：自动唯一，插入重复 id 会直接报 `IntegrityError`（这是好事，数据更安全）。\n- 索引：像书的目录，让\"按 city 查询\"更快；代价是占空间、写入稍慢，只给常用查询列建。\n\n---\n\n# 10. 报错急救\n\n对应教程：`docs/99-报错急救.md`。\n\n| 报错信息（关键部分） | 原因 | 怎么解决 |\n| --- | --- | --- |\n| `python 不是内部或外部命令` | 没装 Python 或没勾选 Add to PATH | 重新安装 Python 并勾选 Add Python to PATH；或用 `py` 命令 |\n| `无法加载文件 ... Activate.ps1，未对文件进行数字签名` | PowerShell 执行策略限制 | `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` 后重开窗口 |\n| `ModuleNotFoundError: No module named 'pandas'` | 没装库，或虚拟环境没激活 | 先 `.\\.venv\\Scripts\\Activate.ps1`，再 `pip install -r requirements.txt` |\n| `FileNotFoundError: ... data/raw/...csv` | 数据还没下载 | 先跑 `python scripts\\download_data.py` |\n| `FileNotFoundError: ... pm25_clean.csv` | 上一个脚本没跑 | 按顺序跑 04 → 05 → 06…，或直接 `.\\run_all.ps1` |\n| `KeyError: 'hour'` | 列名不存在/拼错，或少了上一步生成的特征 | 用 `df.columns` 看真实列名；确认跑过 05/08 |\n| `ValueError: could not convert string to float` | 该是数字的列里混了文字/空值 | `df[\"列\"].head()` 看看内容；必要时 `pd.to_numeric(errors=\"coerce\")` |\n| `TypeError: unsupported operand type(s)` | 字符串当数字算了 | 检查这列的 `dtype`（`df.dtypes`），先转换类型 |\n| `SettingWithCopyWarning` | 在切片副本上改数据 | 先 `.copy()`，再赋值：`part = df.iloc[:100].copy()` |\n| `UnicodeDecodeError: 'utf-8' codec can't decode` | 文件不是 UTF-8（常见 GBK） | 读的时候加 `encoding=\"gbk\"`；写 CSV 用 `utf-8-sig` |\n| CSV 用 Excel 打开中文乱码 | 编码不是 Excel 认的格式 | 保存时用 `encoding=\"utf-8-sig\"` |\n| matplotlib 中文变方框 | 没设置中文字体 | 加 `plt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\"]` |\n| 服务器提示端口被占用 | 8765 已被别的程序占用 | 换端口：`start-server.ps1 -Port 8899` |\n| Git `fatal: not a git repository` | 当前目录还不是仓库 | 在项目根目录先 `git init` |\n| Git `failed to push` / 要登录 | 远端仓库或凭据问题 | `git remote -v` 检查地址；按提示登录 GitHub |\n| `PermissionError: [Errno 13]` | 文件被 Excel 等程序占用 | 关掉正在打开的文件再运行脚本 |\n\n**通用排查三步**：\n\n1. 看报错**最后一行**（错误类型 + 原因），再看它指出的是哪个文件哪一行。\n2. 打开那个文件、找到那一行，想想这一行需要什么（列？文件？库？）。\n3. 还没头绪就把整段报错复制去搜索，或者把\"最后一行 + 代码那几行\"发给同学/导师。\n\n---\n\n# 附录 A　特征清单（可直接抄进报告）\n\n| 特征名 | 构造方法 | 含义 | 可能的作用 |\n| --- | --- | --- | --- |\n| `year` | `index.year` | 年份 | 捕捉长期趋势 |\n| `month` | `index.month` | 月份 1–12 | 捕捉季节变化 |\n| `day` | `index.day` | 几号 | 通常用处不大，容易过拟合 |\n| `hour` | `index.hour` | 小时 0–23 | 捕捉一天内的变化 |\n| `dayofweek` | `index.dayofweek` | 0=周一…6=周日 | 工作日/周末差异 |\n| `is_weekend` | `dayofweek >= 5` | 是否周末 0/1 | 简单明了的周末效应 |\n| `dayofyear` | `index.dayofyear` | 一年中的第几天 | 更细的季节位置 |\n| `hour_sin` / `hour_cos` | `sin(2π·hour/24)` / `cos(...)` | 小时在圆上的坐标 | 让 23 点和 0 点变近 |\n| `dayofweek_sin` / `dayofweek_cos` | `sin(2π·dow/7)` / `cos(...)` | 星期在圆上的坐标 | 表达\"周而复始\" |\n| `month_sin` / `month_cos` | `sin(2π·(month-1)/12)` | 月份在圆上的坐标 | 表达季节循环 |\n| `pm25_now` | 原列 | 当前小时的值 | 惯性，最强特征之一 |\n| `pm25_lag1 / lag2 / lag3` | `shift(1/2/3)` | 前 1~3 小时的值 | 近期惯性 |\n| `pm25_lag24` | `shift(24)` | 昨天同一小时 | 日周期 |\n| `pm25_lag168` | `shift(168)` | 上周同一小时 | 周周期 |\n| `pm25_diff1 / diff24` | `diff(1) / diff(24)` | 相比上一小时/昨天同小时的变化 | 趋势与突变 |\n| `pm25_roll24_mean/std/max/min` | `rolling(24).mean()/std()/max()/min()` | 最近 24 小时统计 | 水平、波动、极值 |\n| `pm25_roll168_mean/std` | `rolling(168)` | 最近 7 天统计 | 周级别水平与波动 |\n| `TEMP_lag1` / `TEMP_roll24_mean` | 对温度做同样的操作 | 温度的历史信息 | 说明方法可迁移到其他列 |\n\n**一句话模板**：`xxx 特征是用 xxx 方法构造的，它让模型知道 xxx，加入后 MAE 从 __ 降到 __。`\n\n---\n\n# 附录 B　本项目的实验结论（真实数字）\n\n## B.1 特征对照实验（`outputs/tables/09_model_comparison.csv`）\n\n| 实验 | 特征 | 切分方式 | MAE | RMSE | R² | 是否可信 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 平均值基线 | 无 | 按时间 8:2 | 64.740 | 82.470 | -0.0286 | 可信 |\n| 持续法基线 | 当前 pm2.5 | 按时间 8:2 | 10.981 | 19.968 | 0.9397 | 可信 |\n| 只用原始时间特征 | month/day/hour/weekday… | 按时间 8:2 | 62.576 | 81.323 | -0.0002 | 可信 |\n| 只用周期编码时间 | hour_sin/cos… | 按时间 8:2 | 62.656 | 80.601 | 0.0175 | 可信 |\n| 周期编码 + 滞后 | 时间 + lag/diff | 按时间 8:2 | 10.934 | 19.670 | 0.9415 | 可信 |\n| 完整正确版 | 周期 + 滞后 + 滑动 + 天气 | 按时间 8:2 | 10.754 | 19.473 | 0.9426 | 可信 |\n| 中心滑动窗口（泄漏） | 窗口包含未来值 | 按时间 8:2 | 10.413 | 18.112 | 0.9504 | 不可信 |\n| 把答案当特征（作弊） | `pm25_answer_leaky` | 按时间 8:2 | 0.000 | 0.000 | 1.0000 | 不可信 |\n| 随机切分（错误做法） | 完整正确特征 | 随机 8:2 | 12.430 | 21.106 | 0.9494 | 不可信 |\n\n## B.2 消融实验（`outputs/tables/09_ablation.csv`）\n\n| 实验 | 特征个数 | MAE | RMSE | R² |\n| --- | --- | --- | --- | --- |\n| 完整特征 | 29 | 10.754 | 19.473 | 0.9426 |\n| 去掉滞后 | 21 | 33.376 | 45.330 | 0.6892 |\n| 去掉滑动窗口 | 23 | 10.804 | 19.511 | 0.9424 |\n| 去掉天气 | 21 | 10.885 | 19.634 | 0.9417 |\n| 只留时间特征 | 7 | 62.656 | 80.601 | 0.0175 |\n\n## B.3 三条可以写进报告的结论\n\n1. **只用钟表时间不够**：只加月/日/小时/星期，MAE 62.6，和\"猜平均值\"（64.7）差不多；换成周期编码也只有极小改善。\n2. **过去的值才是主力**：加上滞后和滑动窗口后，MAE 从 62.6 降到 10.9；消融实验里\"去掉滞后\"这一项 MAE 直接涨到 33.4，说明这类特征贡献最大。\n3. **分数越高越要警惕**：中心滑动窗口（10.413）和\"把答案当特征\"（MAE 0、R² 1.0）分数更漂亮，但都是泄漏，不能写进结论。\n\n---\n\n# 附录 C　文件地图\n\n| 位置 | 里面是什么 |\n| --- | --- |\n| `README.md` | 项目总览、7 天学习计划、导师要求对照 |\n| `docs/00` ~ `docs/07` | 分步教程（导师要求翻译、环境、Python、pandas/SQLite、特征工程核心、建模、画图与 Kaggle、交作业模板） |\n| `docs/08-知识点与代码速查.md` | **本手册的 Markdown 版本** |\n| `docs/99-报错急救.md` | 报错对照表（比本手册第 10 章更详细） |\n| `scripts/01` ~ `03` | Python、pandas、SQLite 基础练习 |\n| `scripts/04` ~ `08` | 数据清洗 → 时间特征 → 基线模型 → 周期编码 → 滞后滑窗 |\n| `scripts/09` | 模型对比、消融实验、泄漏演示 |\n| `scripts/10` | 画 6 张观察图 |\n| `scripts/common.py` | 公共函数：路径、读数据、指标、中文字体 |\n| `data/raw/` | 原始数据（下载得到） |\n| `data/processed/` | 清洗后数据、特征数据、练习数据库 |\n| `outputs/figures/` | 6 张图（PNG，可插入报告） |\n| `outputs/tables/` | 实验表格（CSV，可插入报告） |\n| `outputs/知识点与代码速查.pdf` | **本手册的 PDF（打印用）** |\n| `guide/` | 网页版指引：`index.html`、本地服务器 `server.py`、生成脚本 |\n\n---\n\n## 附录 D　交作业自查\n\n- [ ] 代码能一键跑通：`.\\run_all.ps1`\n- [ ] 代码已推到 GitHub，仓库链接能打开\n- [ ] 笔记里有每个特征的\"构造 + 含义 + 实验证据\"（用 `notes/学习笔记模板.md`）\n- [ ] 实验记录表填好：模型对比、消融实验（用 `notes/实验记录模板.md`）\n- [ ] 报告里有 1~2 张图（建议：原始序列+滑动平均、预测对比）\n- [ ] 报告里写清楚了：预测目标是什么、怎么切分、有没有数据泄漏、结论是什么\n- [ ] 能口头解释：为什么 23 点和 0 点是邻居、为什么要 shift、为什么不能随机切分\n"},"docs/99-报错急救.md":{"path":"docs/99-报错急救.md","name":"99-报错急救.md","size":7721,"mtime":"2026-10-08 21:16","ext":".md","kind":"text","href":"docs/99-%E6%8A%A5%E9%94%99%E6%80%A5%E6%95%91.md","text":"# 99 报错急救：先在表里找，再决定要不要问人\n\n## 0. 通用三步\n\n1. **看最后一行**：错误类型 + 原因；\n2. **看文件名和行号**：哪一行代码出错；\n3. **看上下文**：出错前运行了什么命令、数据文件存在吗。\n\n不要一看到红字就关掉终端。Python 的报错其实是在告诉你哪里出了问题。\n\n---\n\n## 1. 环境类错误\n\n### `'python' 不是内部或外部命令`\n\n**原因**：没装 Python，或者安装时没勾选 \"Add Python to PATH\"。\n\n**解决**：\n\n1. 重新安装 Python，勾选 \"Add python.exe to PATH\"；\n2. 或者用 `py --version` 试试；\n3. 装完重开 PowerShell。\n\n### 虚拟环境激活失败：`Activate.ps1 cannot be loaded because running scripts is disabled`\n\n**解决**：\n\n```powershell\nSet-ExecutionPolicy -Scope Process Bypass\n.\\.venv\\Scripts\\Activate.ps1\n```\n\n### `ModuleNotFoundError: No module named 'pandas'`\n\n**原因**：没装库，或者没激活虚拟环境。\n\n**解决**：\n\n```powershell\n.\\.venv\\Scripts\\Activate.ps1\npip install -r requirements.txt\n```\n\n如果提示 `pip` 不是命令，用：\n\n```powershell\npython -m pip install -r requirements.txt\n```\n\n### `pip` 下载很慢或超时\n\n换国内镜像：\n\n```powershell\npython -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple\n```\n\n---\n\n## 2. 文件类错误\n\n### `FileNotFoundError: [Errno 2] No such file or directory: ...`\n\n**原因**：文件不存在，或者你在错误的文件夹运行脚本。\n\n**解决**：\n\n1. 用 `Get-Location` 确认在项目根目录；\n2. 先运行生成数据的上一个脚本：\n\n```powershell\npython scripts\\download_data.py\npython scripts\\04_load_clean.py\npython scripts\\05_time_features.py\npython scripts\\08_lag_rolling_features.py\n```\n\n3. 注意脚本的运行顺序：\n\n```text\ndownload_data → 04 → 05 → 06/07/08 → 09 → 10\n```\n\n### `UnicodeDecodeError`\n\n**原因**：文件编码不是 UTF-8。\n\n**解决**：本项目读写 CSV 时统一用：\n\n```python\npd.read_csv(path, encoding=\"utf-8-sig\")\ndf.to_csv(path, index=False, encoding=\"utf-8-sig\")\n```\n\n### 终端中文乱码\n\n```powershell\nchcp 65001\n[Console]::OutputEncoding = [System.Text.Encoding]::UTF8\n$env:PYTHONIOENCODING = \"utf-8\"\n```\n\n然后重新运行脚本。\n\n### `PermissionError: [Errno 13] Permission denied`\n\n**原因**：文件被 Excel/WPS 打开着，或者没有写权限。\n\n**解决**：关闭正在打开该 CSV/图片的软件，再运行脚本。\n\n---\n\n## 3. pandas 类错误\n\n### `KeyError: 'pm2.5'`\n\n**原因**：列名写错了，或者数据没有读对。\n\n**解决**：\n\n```python\nprint(df.columns.tolist())\n```\n\n把列名打印出来，一个一个对照。注意大小写和空格：\n\n- `pm2.5` 和 `pm25` 不是一回事；\n- `TEMP` 和 `temp` 不是一回事。\n\n### `SettingWithCopyWarning`\n\n**原因**：你对一个\"切片\"做修改，pandas 不确定你改的是原表还是副本。\n\n**解决**：在筛选后加 `.copy()`：\n\n```python\nsubset = df[df[\"pm2.5\"] > 100].copy()\nsubset[\"new_col\"] = 1\n```\n\n### `ValueError: Input contains NaN`\n\n**原因**：模型不允许特征里有缺失值。\n\n**解决**：在训练前明确处理：\n\n```python\ndf = df.dropna(subset=feature_columns + [\"target\"])\n```\n\n或者填补：\n\n```python\ndf[feature_columns] = df[feature_columns].fillna(df[feature_columns].median())\n```\n\n但要注意：用中位数/均值填补时，只能从训练集算统计量，不能用测试集。\n\n### `ValueError: could not convert string to float`\n\n**原因**：特征里有字符串列，例如 `cbwd`（风向）。\n\n**解决**：要么删掉这列，要么做独热编码：\n\n```python\ndf = pd.get_dummies(df, columns=[\"cbwd\"], drop_first=True)\n```\n\n### 关于 `NaN` 的一个提醒\n\n`NaN`（Not a Number）表示缺失值。它和 0 完全不同：\n\n- 0 是\"知道它等于 0\"；\n- NaN 是\"不知道它等于多少\"。\n\n不要把 NaN 直接改成 0 就完事，除非你确定 0 有物理意义。\n\n---\n\n## 4. 时间序列特有错误\n\n### `shift` 之后出现一堆 NaN\n\n**原因**：shift 会让开头几行没有值，这是正常的。例如 `shift(168)` 前 168 行都是 NaN。\n\n**解决**：在建模前按用到的特征删除：\n\n```python\ndf = df.dropna(subset=[\"pm25_lag168\", \"pm25_roll168_mean\", \"pm25_next\"])\n```\n\n### 删缺失行之后，lag24 不是 24 小时前\n\n**原因**：删行让时间轴断了。\n\n**解决**：保持完整小时时间轴：\n\n```python\ndf = df.set_index(\"datetime\").sort_index().asfreq(\"h\")\n```\n\n短缺口插值，长缺口保留 NaN，建模时再删除无法计算的行。\n\n### 模型分数高得离谱（R² > 0.99）\n\n**第一反应**：检查数据泄漏。\n\n- 特征里有没有 `shift(-1)`、`center=True`；\n- 有没有把目标列本身当特征；\n- 有没有先在全量数据上算统计量再切分；\n- 有没有随机切分时间序列。\n\n本项目的 `_leaky` 特征就是反面教材，千万不要放进正式模型。\n\n### `rolling` 结果前面全是 NaN\n\n**原因**：窗口还没凑满。例如 `rolling(24)` 前 23 行都是 NaN。\n\n**解决**：这是正常现象。可以用 `min_periods` 放宽，但要写清楚理由：\n\n```python\ndf[\"roll24_mean\"] = df[\"pm2.5\"].rolling(24, min_periods=18).mean()\n```\n\n---\n\n## 5. sklearn 类错误\n\n### `ValueError: Found input variables with inconsistent numbers of samples`\n\n**原因**：X 和 y 的行数不一样。\n\n**解决**：打印行数：\n\n```python\nprint(x_train.shape, y_train.shape)\nprint(x_test.shape, y_test.shape)\n```\n\n确保它们都来自同一个 `train` / `test` 表。\n\n### `ValueError: Expected 2D array, got 1D array instead`\n\n**原因**：sklearn 的模型要求 X 是二维表格（很多列），不是一维 Series。\n\n**解决**：\n\n```python\nx_train = train[[\"pm25_lag1\"]]   # 注意双层方括号\n```\n\n### 模型分数是负数\n\nR² 负数表示模型比\"永远猜平均值\"还差。常见原因：\n\n- 特征没有信息；\n- 数据泄漏或切分错误；\n- 训练集和测试集分布差异太大；\n- 有极端异常值。\n\n先回到基线：你的模型有没有打赢\"平均值\"和\"持续法\"？\n\n---\n\n## 6. Git / GitHub 类错误\n\n### `fatal: not a git repository`\n\n**原因**：当前文件夹没有初始化 Git。\n\n**解决**：\n\n```powershell\ncd 正确的项目文件夹\ngit init\n```\n\n### `git push` 提示 `rejected` / `fetch first`\n\n**原因**：GitHub 上的版本比本地新。\n\n**解决**（确保本地修改已提交）：\n\n```powershell\ngit pull --rebase origin main\ngit push\n```\n\n### `remote origin already exists`\n\n**原因**：已经加过远程地址了。\n\n**解决**：\n\n```powershell\ngit remote -v\ngit remote set-url origin https://github.com/你的用户名/仓库名.git\n```\n\n### 推不上去，要输密码\n\nGitHub 现在不支持账号密码，要用 Personal Access Token（PAT）。\n看 `01-环境与工具.md` 的 5.4 节。\n\n---\n\n## 7. 什么时候该问人\n\n自己尝试 3 次（每次换一种思路）还不行，就可以问。问的时候一次给全：\n\n```text\n1. 我运行了什么命令：\n   python scripts\\09_model_comparison.py\n\n2. 完整报错（最后 15 行）：\n   （粘贴）\n\n3. 我已经试过：\n   - 确认激活了 .venv\n   - 重新跑了 08\n   - 删掉了 __pycache__\n\n4. 我的环境：\n   Windows 11 / Python 3.14 / pandas 3.0.6\n```\n\n不要只发一句\"为什么报错\"，那样别人很难帮你。\n\n---\n\n## 8. 最后的心理建设\n\n- 报错是正常的，程序员每天都在看报错；\n- 报错不是\"我太笨\"，而是\"电脑在告诉我哪里不通\"；\n- 先复制报错最后一行去搜索，八成有人遇到过；\n- 每次解决一个报错，就把它写进笔记的\"踩坑记录\"——这也是科研训练的一部分。\n\n祝顺利。\n"},"guide/app.js":{"path":"guide/app.js","name":"app.js","size":45791,"mtime":"2026-10-09 15:05","ext":".js","kind":"text","href":"guide/app.js","text":"/* 时序特征工程 · 学习指引 —— 页面逻辑\n   数据来自 build_guide.py 注入的 <script id=\"guide-data\">。 */\n\n(function () {\n  \"use strict\";\n\n  var DATA = (function () {\n    var node = document.getElementById(\"guide-data\");\n    if (!node) return null;\n    try {\n      return JSON.parse(node.textContent);\n    } catch (err) {\n      return null;\n    }\n  })();\n\n  if (!DATA) {\n    document.getElementById(\"view\").innerHTML =\n      '<div class=\"panel\"><h1 class=\"panel-title\">页面数据没有读到<\/h1>' +\n      '<p class=\"muted\">请在项目根目录重新运行：<code>python guide\\\\build_guide.py<\/code><\/p><\/div>';\n    return;\n  }\n\n  var OFFLINE = DATA.offline || null;\n  var OFFLINE_FILES = OFFLINE && OFFLINE.files ? OFFLINE.files : {};\n\n  var DOC_BY_ID = {};\n  DATA.docs.forEach(function (item) { DOC_BY_ID[item.id] = item; });\n\n  var SCRIPT_BY_ID = {};\n  DATA.scripts.forEach(function (item) { SCRIPT_BY_ID[item.id] = item; });\n\n  var COPY_SOURCES = new WeakMap();\n  var PROGRESS_KEY = \"tsfe-progress-v1\";\n  var currentRunText = \"\";\n  var lastView = null;\n\n  /* ------------------------------------------------------------ 小工具 */\n\n  function $(id) { return document.getElementById(id); }\n\n  function esc(value) {\n    return String(value == null ? \"\" : value)\n      .replace(/&/g, \"&amp;\")\n      .replace(/<\/g, \"&lt;\")\n      .replace(/>/g, \"&gt;\")\n      .replace(/\"/g, \"&quot;\")\n      .replace(/'/g, \"&#39;\");\n  }\n\n  function icon(name, cls) {\n    return '<i data-lucide=\"' + name + '\"' + (cls ? ' class=\"' + cls + '\"' : \"\") + \"><\/i>\";\n  }\n\n  function refreshIcons() {\n    if (window.lucide && typeof window.lucide.createIcons === \"function\") {\n      window.lucide.createIcons();\n    }\n  }\n\n  function toast(message) {\n    var node = $(\"toast\");\n    node.textContent = message;\n    node.classList.add(\"show\");\n    window.clearTimeout(toast._timer);\n    toast._timer = window.setTimeout(function () { node.classList.remove(\"show\"); }, 1800);\n  }\n\n  function copyFallback(text, done) {\n    var area = document.createElement(\"textarea\");\n    area.value = text;\n    area.setAttribute(\"readonly\", \"readonly\");\n    area.style.position = \"fixed\";\n    area.style.top = \"-1000px\";\n    document.body.appendChild(area);\n    area.select();\n    var ok = false;\n    try { ok = document.execCommand(\"copy\"); } catch (err) { ok = false; }\n    document.body.removeChild(area);\n    if (ok) { done(); } else { toast(\"复制失败，请手动选中后按 Ctrl+C\"); }\n  }\n\n  function copyText(text, message) {\n    var done = function () { toast(message || \"已复制\"); };\n    if (navigator.clipboard && window.isSecureContext) {\n      navigator.clipboard.writeText(text).then(done, function () { copyFallback(text, done); });\n    } else {\n      copyFallback(text, done);\n    }\n  }\n\n  function openDialog(title, html) {\n    $(\"dialogTitle\").textContent = title;\n    $(\"dialogBody\").innerHTML = html;\n    $(\"dialogBackdrop\").classList.remove(\"hidden\");\n    refreshIcons();\n  }\n\n  function closeDialog() {\n    $(\"dialogBackdrop\").classList.add(\"hidden\");\n    $(\"dialogBody\").innerHTML = \"\";\n  }\n\n  function loadProgress() {\n    try { return JSON.parse(window.localStorage.getItem(PROGRESS_KEY)) || {}; }\n    catch (err) { return {}; }\n  }\n\n  function saveProgress(value) {\n    try { window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(value)); } catch (err) { /* 忽略 */ }\n  }\n\n  function runBlock(command) {\n    if (OFFLINE) return command;\n    var slash = \"\\\\\";\n    return 'cd \"' + DATA.projectRoot + '\"\\n.' + slash + '.venv' + slash + 'Scripts' + slash + 'Activate.ps1\\n' + command;\n  }\n\n  function codeBlock(code, lang) {\n    return '<div class=\"code-block\"><div class=\"code-head\">' +\n      '<span class=\"code-lang\">' + esc(lang || \"text\") + \"<\/span>\" +\n      '<button class=\"code-copy\" type=\"button\">' + icon(\"copy\") + \"<span>复制<\/span><\/button>\" +\n      \"<\/div><pre><code>\" + esc(code) + \"<\/code><\/pre><\/div>\";\n  }\n\n  /* ------------------------------------------------------------ 装饰渲染结果 */\n\n  function detectLang(codeEl) {\n    var cls = codeEl.className || \"\";\n    var match = cls.match(/language-([a-z0-9+#-]+)/i);\n    if (match) return match[1];\n    if (codeEl.closest(\".cmd-line\")) return \"powershell\";\n    return \"code\";\n  }\n\n  function decorate(scope) {\n    scope.querySelectorAll(\"pre > code\").forEach(function (codeEl) {\n      var pre = codeEl.parentElement;\n      if (pre.closest(\".code-block\")) return;\n\n      var wrap = document.createElement(\"div\");\n      wrap.className = \"code-block\";\n\n      var head = document.createElement(\"div\");\n      head.className = \"code-head\";\n      head.innerHTML = '<span class=\"code-lang\">' + esc(detectLang(codeEl)) + \"<\/span>\";\n\n      var btn = document.createElement(\"button\");\n      btn.type = \"button\";\n      btn.className = \"code-copy\";\n      btn.innerHTML = icon(\"copy\") + \"<span>复制<\/span>\";\n      head.appendChild(btn);\n\n      pre.parentNode.insertBefore(wrap, pre);\n      wrap.appendChild(head);\n      wrap.appendChild(pre);\n      COPY_SOURCES.set(btn, codeEl.textContent);\n    });\n\n    scope.querySelectorAll(\"table\").forEach(function (table) {\n      table.classList.add(\"data-table\");\n      if (table.parentElement && table.parentElement.classList.contains(\"table-wrap\")) return;\n      var box = document.createElement(\"div\");\n      box.className = \"table-wrap\";\n      table.parentNode.insertBefore(box, table);\n      box.appendChild(table);\n    });\n  }\n\n  /* ------------------------------------------------------------ 侧边导航 */\n\n  function navItem(route, iconName, label) {\n    return '<a class=\"nav-item\" data-nav=\"' + esc(route) + '\" href=\"#' + esc(route) + '\">' +\n      icon(iconName) + '<span class=\"nav-label\">' + esc(label) + \"<\/span><\/a>\";\n  }\n\n  function buildNav() {\n    var groups = [];\n    var order = [];\n    DATA.docs.forEach(function (doc) {\n      if (order.indexOf(doc.group) === -1) order.push(doc.group);\n    });\n\n    groups.push(\n      '<div class=\"nav-group\"><div class=\"nav-group-title\">总览<\/div>' +\n      navItem(\"home\", \"layout-dashboard\", \"首页\") +\n      \"<\/div>\"\n    );\n\n    order.forEach(function (groupName) {\n      var items = DATA.docs.filter(function (doc) { return doc.group === groupName; });\n      groups.push(\n        '<div class=\"nav-group\"><div class=\"nav-group-title\">' + esc(groupName) + \"<\/div>\" +\n        items.map(function (doc) { return navItem(\"doc-\" + doc.id, doc.icon, doc.title); }).join(\"\") +\n        \"<\/div>\"\n      );\n    });\n\n    groups.push(\n      '<div class=\"nav-group\"><div class=\"nav-group-title\">项目内容<\/div>' +\n      navItem(\"files\", \"folder-open\", \"项目文件\") +\n      navItem(\"figures\", \"image\", \"实验图表\") +\n      navItem(\"tables\", \"table-2\", \"数据表格\") +\n      navItem(\"roadmap\", \"route\", \"学习路线\") +\n      navItem(\"requirements\", \"list-checks\", \"导师要求对照\") +\n      \"<\/div>\"\n    );\n\n    groups.push(\n      '<div class=\"nav-group\"><div class=\"nav-group-title\">脚本源码<\/div>' +\n      DATA.scripts.map(function (script) {\n        return navItem(\"script-\" + script.id, \"code-xml\", script.title);\n      }).join(\"\") +\n      \"<\/div>\"\n    );\n\n    $(\"nav\").innerHTML = groups.join(\"\");\n  }\n\n  function markActiveNav(route) {\n    document.querySelectorAll(\"[data-nav]\").forEach(function (node) {\n      node.classList.toggle(\"is-active\", node.getAttribute(\"data-nav\") === route);\n    });\n  }\n\n  /* ------------------------------------------------------------ 搜索 */\n\n  function setupSearch() {\n    var input = $(\"searchInput\");\n    var box = input.closest(\".search-box\");\n    var panel = null;\n    var items = [];\n    var active = -1;\n\n    function close() {\n      if (panel) { panel.remove(); panel = null; }\n      items = [];\n      active = -1;\n    }\n\n    function score(entry, query) {\n      var title = entry.title.toLowerCase();\n      var text = (entry.text || \"\").toLowerCase();\n      if (title.indexOf(query) === 0) return 0;\n      if (title.indexOf(query) >= 0) return 1;\n      if (text.indexOf(query) >= 0) return 2;\n      return -1;\n    }\n\n    function open(query) {\n      var q = query.trim().toLowerCase();\n      if (q.length < 1) { close(); return; }\n\n      var matches = DATA.search\n        .map(function (entry) { return { entry: entry, rank: score(entry, q) }; })\n        .filter(function (row) { return row.rank >= 0; })\n        .sort(function (a, b) { return a.rank - b.rank; })\n        .slice(0, 12)\n        .map(function (row) { return row.entry; });\n\n      items = matches;\n      active = matches.length ? 0 : -1;\n\n      if (!panel) {\n        panel = document.createElement(\"div\");\n        panel.className = \"search-results\";\n        box.appendChild(panel);\n      }\n\n      if (!matches.length) {\n        panel.innerHTML = '<div class=\"sr-empty\">没有找到，换个词试试（比如“滑动窗口”“MAE”“星期”）。<\/div>';\n        return;\n      }\n\n      panel.innerHTML = matches.map(function (entry, index) {\n        return '<button class=\"sr-item' + (index === active ? \" is-active\" : \"\") + '\" type=\"button\" data-route=\"' +\n          esc(entry.route) + '\"><span class=\"sr-title\">' + esc(entry.title) + '<\/span>' +\n          '<span class=\"sr-meta\">' + esc(entry.type) + \"<\/span><\/button>\";\n      }).join(\"\");\n    }\n\n    function move(delta) {\n      if (!items.length || !panel) return;\n      active = (active + delta + items.length) % items.length;\n      Array.prototype.forEach.call(panel.children, function (node, index) {\n        node.classList.toggle(\"is-active\", index === active);\n      });\n    }\n\n    function go(index) {\n      if (!items.length) return;\n      var target = items[index < 0 ? 0 : index];\n      input.value = \"\";\n      close();\n      window.location.hash = target.route.replace(/^#/, \"\");\n      input.blur();\n    }\n\n    input.addEventListener(\"input\", function () { open(input.value); });\n    input.addEventListener(\"focus\", function () { if (input.value.trim()) open(input.value); });\n    input.addEventListener(\"keydown\", function (event) {\n      if (event.key === \"ArrowDown\") { event.preventDefault(); move(1); }\n      else if (event.key === \"ArrowUp\") { event.preventDefault(); move(-1); }\n      else if (event.key === \"Enter\") { event.preventDefault(); go(active); }\n      else if (event.key === \"Escape\") { input.value = \"\"; close(); input.blur(); }\n    });\n\n    document.addEventListener(\"click\", function (event) {\n      if (panel) {\n        var button = event.target.closest(\".sr-item\");\n        if (button) {\n          event.preventDefault();\n          var route = button.getAttribute(\"data-route\").replace(/^#/, \"\");\n          input.value = \"\";\n          close();\n          window.location.hash = route;\n          return;\n        }\n      }\n      if (!box.contains(event.target)) close();\n    });\n\n    document.addEventListener(\"keydown\", function (event) {\n      if (event.key !== \"/\") return;\n      var tag = (document.activeElement && document.activeElement.tagName) || \"\";\n      if (tag === \"INPUT\" || tag === \"TEXTAREA\") return;\n      event.preventDefault();\n      input.focus();\n    });\n  }\n\n  /* ------------------------------------------------------------ 页面：首页 */\n\n  function viewHome() {\n    var allCommand = \".\\\\run_all.ps1\";\n    currentRunText = runBlock(allCommand);\n\n    var steps = [\n      {\n        no: \"1\",\n        title: \"运行一键脚本\",\n        text: \"在项目文件夹里打开 PowerShell，先激活虚拟环境，再运行全部课程脚本。\",\n        action: \"复制命令\",\n        copy: allCommand,\n        message: \"已复制，粘贴到 PowerShell 里运行\"\n      },\n      {\n        no: \"2\",\n        title: \"看结果文件\",\n        text: \"脚本会生成图片和表格，点左边“实验图表”“数据表格”就能直接看。\",\n        action: \"打开图表\",\n        route: \"#figures\"\n      },\n      {\n        no: \"3\",\n        title: \"照着路线学\",\n        text: \"7 天走完：先 Python 基础，再特征工程，最后建模对比与画图。\",\n        action: \"打开学习路线\",\n        route: \"#roadmap\"\n      }\n    ];\n\n    var stepsHtml = steps.map(function (step) {\n      var action = step.route\n        ? '<a class=\"link-btn\" href=\"' + esc(step.rou --------------------------------------- 统一的渲染入口 */\n  /* ------------------------------------------------------------ 页面：项目文件 */\n\n  var fileState = {\n    source: OFFLINE ? \"offline\" : \"none\",\n    rootName: OFFLINE ? (OFFLINE.rootName || \"离线分享包\") : \"\",\n    rootPath: OFFLINE ? (OFFLINE.rootPath || \"\") : \"\",\n    tree: [],\n    files: {},\n    urls: {},\n    currentPath: null\n  };\n\n  var PICK_KINDS = {\n    image: [\".png\", \".jpg\", \".jpeg\", \".gif\", \".svg\", \".webp\", \".bmp\", \".ico\"],\n    text: [\".py\", \".md\", \".txt\", \".json\", \".csv\", \".js\", \".css\", \".html\", \".ps1\", \".yml\", \".yaml\", \".toml\", \".sql\"]\n  };\n  var SKIP_NAMES = [\"node_modules\", \".git\", \".venv\", \"venv\", \"__pycache__\"];\n\n  function safeDecode(value) {\n    try { return decodeURIComponent(value); } catch (err) { return value; }\n  }\n\n  function formatSize(bytes) {\n    if (typeof bytes !== \"number\") return \"\";\n    if (bytes < 1024) return bytes + \" B\";\n    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + \" KB\";\n    return (bytes / 1024 / 1024).toFixed(1) + \" MB\";\n  }\n\n  function countFiles(nodes) {\n    return (nodes || []).reduce(function (total, node) {\n      return total + (node.type === \"dir\" ? countFiles(node.children) : 1);\n    }, 0);\n  }\n\n  function findFileNode(nodes, path) {\n    var list = nodes || [];\n    for (var i = 0; i < list.length; i += 1) {\n      var node = list[i];\n      if (node.type === \"file\" && node.path === path) return node;\n      if (node.type === \"dir\") {\n        var found = findFileNode(node.children, path);\n        if (found) return found;\n      }\n    }\n    return null;\n  }\n\n  function nodeIcon(node) {\n    if (node.type === \"dir\") return \"folder\";\n    if (node.kind === \"image\") return \"file-image\";\n    if (node.kind === \"csv\") return \"table-2\";\n    if ([\".py\", \".ps1\", \".js\", \".css\", \".html\"].indexOf(node.ext) >= 0) return \"file-code- e> 就可以了。<\/div><\/div>\" +\n      '<p class=\"muted\">也可以点上面的“选择其他文件夹”，手动挑一个文件夹来读（Chrome / Edge 支持）。<\/p>';\n  }\n\n  function viewFiles(options) {\n    options = options || {};\n    currentRunText = runBlock(\".\\\\run_all.ps1\");\n    fileState.currentPath = options.file || null;\n\n    var offlineMode = !!OFFLINE;\n    var fileSummary = offlineMode\n      ? \"离线分享包里已经内置教程、脚本、图表、实验表格和速查 PDF。左边选文件，右边直接看；打包后新增的文件需要重新打包才会出现。\"\n      : \"这里是项目文件夹的真实内容：左边选文件，右边直接看。改了代码或笔记，点“重新读取”就能看到最新的。\";\n    var sourceChip = offlineMode\n      ? icon(\"hard-drive\") + \"离线文件清单\"\n      : icon(\"link\") + \"http://127.0.0.1:8765/guide/index.html\";\n    var statusText = offlineMode ? \"正在读取离线文件清单…\" : \"正在连接本地服务…\";\n\n    var html =\n      '<div class=\"page-head\">' +\n      \"<h1>项目文件<\/h1>\" +\n      '<p class=\"summary\">' + esc(fileSummary) + \"<\/p>\" +\n      '<div class=\"meta-row\">' +\n      '<span class=\"chip accent\">' + icon(\"folder-open\") + (offlineMode ? \"离线内置文件\" : \"读取文件夹\") + \"<\/span>\" +\n      '<span class=\"chip\" id=\"fileRootChip\">' + icon(\"hard-drive\") + \"正在读取…\" + \"<\/span>\" +\n      '<span class=\"chip\">' + sourceChip + \"<\/span>\" +\n      \"<\/div><\/div>\" +\n      '<div class=\"files-toolbar\">' +\n      '<button class=\"link-btn\" type=\"button\" id=\"reloadTree\">' + icon(\"refresh-cw\") + (offlineMode ? \"重新读取清单\" : \"重新读取\") + \"<\/button>\" +\n      '<button class=\"link-btn\" type=\"button\" id=\"pickFolder\">' + icon(\"folder-open\") + \"选择其他文件夹\" + \"<\/button>\" +\n      '<span class=\"muted\" id=\"filesStatus\">' + statusText + \"<\/span>\" +\n      \"<\/div>\" +\n      '<div class=\"files-layout\">' +\n      '<div class=\"file-tree\" id=\"fileTree\"><p class=\"muted\">正在读取…<\/p><\/div>' +\n      '<div class=\"file-preview\" id=\"filePreview\"><\/div>' +\n      \"<\/div>\";\n\n    paint(\"项目文件\", html, {\n      onReady: function () {\n        bindFilesEvents();\n        loadProjectTree();\n      }\n    });\n  }\n\n  function markActiveTreeItem(path) {\n    document.querySelectorAll(\"[data-open-file]\").forEach(function (node) {\n      node.classList.toggle(\"is-active\", node.getAttribute(\"data-open-file\") === path);\n    });\n  }\n\n  function loadProjectTree() {\n    var treeBox = $(\"fileTree\");\n    var status = $(\"filesStatus\");\n    var rootChip = $(\"fileRootChip\");\n    if (!treeBox) return;\n\n    if (OFFLINE) {\n      fileState.source = \"offline\";\n      fileState.rootName = OFFLINE.rootName || \"离线分享包\";\n      fileState.rootPath = OFFLINE.rootPath || \"\";\n      fileState.tree = OFFLINE.tree || [];\n      rootChip.innerHTML = icon(\"hard-drive\") + esc(fileState.rootName);\n      status.textContent = \"已读取 \" + countFiles(fileState.tree) + \" 个离线文件（打包时快照）\";\n      treeBox.innerHTML = treeHtml(fileState.tree, 0) || '<p class=\"muted\">离线清单是空的。<\/p>';\n      refreshIcons();\n      markActiveTreeItem(fileState.currentPath);\n      openFilePreview(fileState.currentPath);\n      return;\n    }\n\n    fetch(\"/api/tree\", { cache: \"no-store\" })\n      .then(function (response) {\n        if (!response.ok) throw new Error(\"HTTP \" + response.status);\n        return response.json();\n      })\n      .then(function (data) {\n        fileState.source = \"server\";\n        fileState.rootName = data.name;\n        fileState.rootPath = data.root;\n        fileState.tree = data.entries || [];\n        rootChip.innerHTML = icon(\"hard-drive\") + esc(data.name);\n        status.textContent = \"已读取 \" + countFiles(fileState.tree) + \" 个文件（\" + data.time + \"）\";\n        treeBox.innerHTML = treeHtml(fileState.tree, 0) || '<p class=\"muted\">这个文件夹是空的。<\/p>';\n        refreshIcons();\n        markActiveTreeItem(fileState.currentPath);\n        openFilePreview(fileState.currentPath);\n      })\n      .catch(function () {\n        fileState.source = \"none\";\n        fileState.tree = [];\n        rootChip.innerHTML = icon(\"hard-drive\") + \"未连接本地服务\";\n        status.textContent = \"没有连上本地服务，暂时读不到文件夹。\";\n        treeBox.innerHTML = serverHintHtml();\n        refreshIcons();\n        openFilePreview(null);\n      });\n  }\n\n  function readFileText(path) {\n    if (fileState.source === \"picker\") {\n      var file = fileState.files[path];\n      if (!file) return Promise.resolve({ error: \"找不到这个文件，请重新读取文件夹。\" });\n      if (file.size > 512 * 1024) {\n        return Promise.resolve({ error: \"这个文件比较大（\" + formatSize(file.size) + \"），点“新标签打开”看原文件吧。\" });\n      }\n      return file.text().then(function (text) {\n        return { text: text, ext: \".\" + path.split(\".\").pop() };\n      });\n    }\n\n    if (fileState.source === \"offline\") {\n      var offlineItem = OFFLINE_FILES[path];\n      if (!offlineItem) return Promise.resolve({ error: \"离线清单里没有这个文件，请重新打包。\" });\n      if (typeof offlineItem.text === \"string\") {\n        return Promise.resolve({ text: offlineItem.text, ext: offlineItem.ext });\n      }\n      return Promise.resolve({ error: \"这个文件比较大或不是纯文本，点右上角“新标签打开”查看原文件。\" });\n    }\n\n    return fetch(\"/api/file?path=\" + encodeURIComponent(path), { cache: \"no-store\" })\n      .then(function (response) {\n        return response.json().then(function (data) { return { data: data }; });\n      })\n      .then(function (result) {\n        if (result.data && typeof result.data.text === \"string\") {\n          return { text: result.data.text, ext: result.data.ext };\n        }\n        return { error: (result.data && result.data.error) || \"读取失败。\" };\n      })\n      .catch(function () {\n        return { error: \"读取失败，请确认本地服务还在运行。\" };\n      });\n  }\n\n  function openFilePreview(path) {\n    var box = $(\"filePreview\");\n    if (!box) return;\n\n    if (!path) {\n      box.innerHTML = '<div class=\"preview-empty\">' + icon(\"mouse-pointer-click\") +\n        \"<p>左边点一个文件，这里就会显示它的内容。<\/p><\/div>\";\n      refreshIcons();\n      return;\n    }\n\n    var node = findFileNode(fileState.tree, path);\n    var url = fileUrl(path);\n    var meta = node ? formatSize(node.size) + \" · \" + esc(node.mtime || \"\") : \"\";\n    box.innerHTML =\n      '<div class=\"preview-head\"><div class=\"preview-title\"><strong>' + esc(path) + \"<\/strong>\" +\n      (meta ? '<span class=\"muted\">' + meta + \"<\/span>\" : \"\") + \"<\/div>\" +\n      (url ? '<a class=\"link-btn\" href=\"' + esc(url) + '\" target=\"_blank\" rel=\"noopener\">' + icon(\"external-link\") + \"新标签打开<\/a>\" : \"\") +\n      \"<\/div>\" +\n      '<div class=\"preview-body\" id=\"previewBody\"><p class=\"muted\">正在读取…<\/p><\/div>';\n    refreshIcons();\n\n    if (node && node.kind === \"image\" && url) {\n      $(\"previewBody\").innerHTML = '<img src=\"' + esc(url) + '\" alt=\"' + esc(node.name) +\n        '\" data-zoom=\"' + esc(url) + '\" data-zoom-title=\"' + esc(node.name) + '\">';\n      return;\n    }\n\n    readFileText(path).then(function (result) {\n      var body = $(\"previewBody\");\n      if (!body) return;\n      if (result.error) {\n        body.innerHTML = '<div class=\"note danger\">' + icon(\"circle-alert\") + \"<div>\" + esc(result.error) + \"<\/div><\/div>\";\n      } else {\n        body.innerHTML = codeBlock(result.text, (result.ext || \"\").replace(\".\", \"\") || \"text\");\n      }\n      refreshIcons();\n    });\n  }\n\n  function bindFilesEvents() {\n    var reload = $(\"reloadTree\");\n    if (reload) {\n      reload.addEventListener(\"click\", function () {\n        if (fileState.source === \"picker\") { refreshPickerTree(); toast(\"已重新读取你选择的文件夹\"); }\n        else if (fileState.source === \"offline\") { loadProjectTree(); toast(\"已重新读取离线文件清单\"); }\n        else { loadProjectTree(); toast(\"正在重新读取项目文件夹…\"); }\n      });\n    }\n    var pick = $(\"pickFolder\");\n    if (pick) pick.addEventListener(\"click\", pickFolder);\n  }\n\n  function refreshPickerTree() {\n    if (!$(\"fileTree\")) return;\n    $(\"fileTree\").innerHTML = treeHtml(fileState.tree, 0);\n    refreshIcons();\n    markActiveTreeItem(fileState.currentPath);\n  }\n\n  function pickKind(name) {\n    var ext = (\".\" + name.split(\".\").pop()).toLowerCase();\n    if (PICK_KINDS.image.indexOf(ext) >= 0) return \"image\";\n    if (ext === \".csv\") return \"csv\";\n    if (PICK_KINDS.text.indexOf(ext) >= 0) return \"text\";\n    return \"binary\";\n  }\n\n  function walkDirectory(handle, prefix, depth) {\n    var nodes = [];\n    var MAX_ENTRIES = 300;\n    return new Promise(function (resolve) {\n      var iterator = handle.values();\n      (function next() {\n        iterator.next().then(function (result) {\n          if (result.done || nodes.length >= MAX_ENTRIES) { resolve(nodes); return; }\n          var entry = result.value;\n          if (entry.name.charAt(0) === \".\" || SKIP_NAMES.indexOf(entry.name) >= 0) { next(); return; }\n          var path = prefix ? prefix + \"/\" + entry.name : entry.name;\n          if (entry.kind === \"directory\") {\n            if (depth >= 3) { next(); return; }\n            walkDirectory(entry, path, depth + 1).then(function (children) {\n              nodes.push({ type: \"dir\", name: entry.name, path: path, children: children });\n              next();\n            });\n          } else {\n            entry.getFile().then(function (file) {\n              fileState.files[path] = file;\n              nodes.push({\n                type: \"file\", name: entry.name, path: path, size: file.size,\n                mtime: new Date(file.lastModified).toLocaleString(),\n                ext: (\".\" + entry.name.split(\".\").pop()).toLowerCase(),\n                kind: pickKind(entry.name)\n              });\n              next();\n            });\n          }\n        });\n      })();\n    });\n  }\n\n  function pickFolder() {\n    if (!window.showDirectoryPicker) {\n      toast(\"这个浏览器不支持“选择文件夹”，请改用 Chrome 或 Edge\");\n      return;\n    }\n    window.showDirectoryPicker().then(function (handle) {\n      releaseUrls();\n      fileState.source = \"picker\";\n      fileState.rootName = handle.name;\n      fileState.rootPath = handle.name;\n      fileState.files = {};\n      $(\"filesStatus\").textContent = \"正在读取 \" + handle.name + \" …\";\n      return walkDirectory(handle, \"\", 0);\n    }).then(function (entries) {\n      if (!entries) return;\n      fileState.tree = entries;\n      $(\"fileRootChip\").innerHTML = icon(\"hard-drive\") + esc(fileState.rootName);\n      $(\"filesStatus\").textContent = \"已读取 \" + countFiles(entries) + \" 个文件（来自你选择的文件夹）\";\n      $(\"fileTree\").innerHTML = treeHtml(entries, 0) || '<p class=\"muted\">这个文件夹是空的。<\/p>';\n      refreshIcons();\n      markActiveTreeItem(null);\n      openFilePreview(null);\n      toast(\"已读取文件夹：\" + fileState.rootName);\n    }).catch(function () { /* 用户取消选择 */ });\n  }\n\n\n  function paint(title, html, options) {\n    options = options || {};\n    $(\"crumb\").textContent = title;\n    document.title = title + \" · 时序特征工程学习指引\";\n\n    var view = $(\"view\");\n    view.innerHTML = html;\n    decorate(view);\n    refreshIcons();\n\n    if (!options.keepScroll) window.scrollTo(0, 0);\n    if (options.focus) {\n      var target = document.getElementById(options.focus);\n      if (target) target.scrollIntoView({ block: \"start\" });\n    }\n    if (options.onReady) options.onReady();\n  }\n\n  function parseRoute() {\n    var raw = (window.location.hash || \"\").replace(/^#/, \"\").trim();\n    if (!raw) return { name: \"home\", raw: \"home\" };\n    if (raw.indexOf(\"doc-\") === 0) return { name: \"doc\", id: raw.slice(4), raw: raw };\n    if (raw.indexOf(\"script-\") === 0) return { name: \"script\", id: raw.slice(7), raw: raw };\n    if (raw.indexOf(\"file-\") === 0) return { name: \"files\", file: safeDecode(raw.slice(5)), raw: raw };\n    if (raw === \"files\") return { name: \"files\", raw: raw };\n    if (raw.indexOf(\"table-\") === 0) return { name: \"tables\", focus: raw.slice(6), raw: raw };\n    if (raw === \"figures\") return { name: \"figures\", raw: raw };\n    if (raw === \"tables\") return { name: \"tables\", raw: raw };\n    if (raw === \"roadmap\") return { name: \"roadmap\", raw: raw };\n    if (raw === \"requirements\") return { name: \"requirements\", raw: raw };\n    return { name: \"home\", raw: \"home\" };\n  }\n\n  function render() {\n    var route = parseRoute();\n    markActiveNav(route.raw);\n\n    if (route.name === \"files\") {\n      if (lastView === \"files\" && fileState.tree.length) {\n        fileState.currentPath = route.file || null;\n        markActiveTreeItem(fileState.currentPath);\n        openFilePreview(fileState.currentPath);\n        return;\n      }\n      lastView = \"files\";\n      viewFiles(route);\n      return;\n    }\n\n    lastView = route.name;\n\n    if (route.name === \"doc\") {\n      var doc = DOC_BY_ID[route.id];\n      if (doc) { viewDoc(doc); return; }\n    }\n    if (route.name === \"script\") {\n      var script = SCRIPT_BY_ID[route.id];\n      if (script) { viewScript(script); return; }\n    }\n    if (route.name === \"figures\") { viewFigures(); return; }\n    if (route.name === \"tables\") { viewTables(route.focus); return; }\n    if (route.name === \"roadmap\") { viewRoadmap(); return; }\n    if (route.name === \"requirements\") { viewRequirements(); return; }\n    viewHome();\n  }\n\n  /* ------------------------------------------------------------ 事件绑定 */\n\n  function closeNav() {\n    document.querySelector(\".app\").classList.remove(\"nav-open\");\n  }\n\n  function bindEvents() {\n    var app = document.querySelector(\".app\");\n\n    var scrim = document.createElement(\"div\");\n    scrim.className = \"nav-scrim\";\n    app.appendChild(scrim);\n    scrim.addEventListener(\"click\", closeNav);\n\n    $(\"menuBtn\").addEventListener(\"click\", function () {\n      app.classList.toggle(\"nav-open\");\n    });\n\n    $(\"copyPathBtn\").addEventListener(\"click\", function () {\n      copyText(DATA.projectRoot, \"已复制项目路径\");\n    });\n\n    $(\"runBtn\").addEventListener(\"click\", function () {\n      copyText(currentRunText || runBlock(\".\\\\run_all.ps1\"), \"已复制运行命令，粘贴到 PowerShell 里执行\");\n    });\n\n    $(\"dialogClose\").addEventListener(\"click\", closeDialog);\n    $(\"dialogBackdrop\").addEventListener(\"click\", function (event) {\n      if (event.target === $(\"dialogBackdrop\")) closeDialog();\n    });\n\n    document.addEventListener(\"keydown\", function (event) {\n      if (event.key === \"Escape\") { closeDialog(); closeNav(); }\n    });\n\n    document.addEventListener(\"click\", function (event) {\n      var fileButton = event.target.closest(\"[data-open-file]\");\n      if (fileButton) {\n        event.preventDefault();\n        window.location.hash = \"file-\" + encodeURIComponent(fileButton.getAttribute(\"data-open-file\"));\n        return;\n      }\n\n      var copyButton = event.target.closest(\"[data-copy-text]\");\n      if (copyButton) {\n        event.preventDefault();\n        copyText(copyButton.getAttribute(\"data-copy-text\"),\n          copyButton.getAttribute(\"data-copy-message\") || \"已复制\");\n        return;\n      }\n\n      var codeButton = event.target.closest(\".code-copy\");\n      if (codeButton) {\n        event.preventDefault();\n        var text = COPY_SOURCES.get(codeButton);\n        if (text == null) {\n          var codeEl = codeButton.closest(\".code-block\").querySelector(\"code\");\n          text = codeEl ? codeEl.textContent : \"\";\n        }\n        copyText(text, \"已复制代码\");\n        return;\n      }\n\n      var zoom = event.target.closest(\"[data-zoom]\");\n      if (zoom) {\n        event.preventDefault();\n        openDialog(zoom.getAttribute(\"data-zoom-title\") || \"图片\",\n          '<img src=\"' + esc(zoom.getAttribute(\"data-zoom\")) + '\" alt=\"' +\n          esc(zoom.getAttribute(\"data-zoom-title\") || \"图片\") + '\">');\n        return;\n      }\n\n      if (event.target.closest(\"#resetProgress\")) {\n        saveProgress({});\n        viewRoadmap();\n        markActiveNav(\"roadmap\");\n        toast(\"进度已清空\");\n        return;\n      }\n\n      if (event.target.closest(\".nav-item\")) closeNav();\n    });\n\n    document.addEventListener(\"change\", function (event) {\n      var box = event.target.closest(\"[data-day]\");\n      if (!box) return;\n      var progress = loadProgress();\n      if (box.checked) { progress[box.getAttribute(\"data-day\")] = true; }\n      else { delete progress[box.getAttribute(\"data-day\")]; }\n      saveProgress(progress);\n\n      var item = box.closest(\".roadmap-item\");\n      if (item) item.classList.toggle(\"is-done\", box.checked);\n\n      var done = Object.keys(progress).length;\n      var label = document.querySelector(\".progress-line span\");\n      var fill = document.querySelector(\".progress-fill\");\n      if (label) label.textContent = \"已完成 \" + done + \" / \" + DATA.roadmap.length;\n      if (fill) fill.style.width = Math.round((done / DATA.roadmap.length) * 100) + \"%\";\n    });\n\n    window.addEventListener(\"hashchange\", function () {\n      render();\n      closeNav();\n    });\n  }\n\n  /* ------------------------------------------------------------ 启动 */\n\n  buildNav();\n  setupSearch();\n  bindEvents();\n  render();\n  refreshIcons();\n})();\n"},"guide/build_guide.py":{"path":"guide/build_guide.py","name":"build_guide.py","size":27641,"mtime":"2026-10-09 15:01","ext":".py","kind":"text","href":"guide/build_guide.py","text":"\"\"\"生成一个静态学习指引网页：guide/index.html\n\n特点：\n- 不需要联网（除了页面里的图片路径，也都是本地文件）；\n- 左边是导航，右边直接读教程、看代码、看实验结果；\n- 支持搜索、复制命令、勾选学习进度；\n- 打开方式：guide/index.html，或用 guide/start-server.ps1 启动本地网页服务。\n\n运行：python guide/build_guide.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\nimport html\nimport json\nimport re\nfrom datetime import datetime\nfrom pathlib import Path\nfrom urllib.parse import quote, unquote\n\nimport markdown\n\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\nGUIDE_DIR = PROJECT_ROOT / \"guide\"\nOUTPUT_HTML = GUIDE_DIR / \"index.html\"\n\n# ---------------------------------------------------------------------------\n# 1. 页面里要展示的教程\n# ---------------------------------------------------------------------------\nDOCS: list[dict[str, str]] = [\n    {\n        \"id\": \"overview\",\n        \"title\": \"项目总览\",\n        \"group\": \"开始\",\n        \"icon\": \"home\",\n        \"file\": \"README.md\",\n        \"summary\": \"项目做什么、怎么运行、7 天学习计划。\",\n    },\n    {\n        \"id\": \"req\",\n        \"title\": \"导师要求翻译\",\n        \"group\": \"开始\",\n        \"icon\": \"list-checks\",\n        \"file\": \"docs/00-先读我-导师要求翻译.md\",\n        \"summary\": \"把导师的每条要求翻译成'我要做什么'。\",\n    },\n    {\n        \"id\": \"env\",\n        \"title\": \"环境与工具\",\n        \"group\": \"教程\",\n        \"icon\": \"settings\",\n        \"file\": \"docs/01-环境与工具.md\",\n        \"summary\": \"Python、venv、Git、GitHub、Markdown 最小必要操作。\",\n    },\n    {\n        \"id\": \"python\",\n        \"title\": \"Python 零基础\",\n        \"group\": \"教程\",\n        \"icon\": \"braces\",\n        \"file\": \"docs/02-Python零基础.md\",\n        \"summary\": \"list、dict、deque、函数、文件读写和报错阅读。\",\n    },\n    {\n        \"id\": \"pandas-sqlite\",\n        \"title\": \"pandas 与 SQLite\",\n        \"group\": \"教程\",\n        \"icon\": \"table-2\",\n        \"file\": \"docs/03-pandas与SQLite.md\",\n        \"summary\": \"读 CSV、筛选、groupby、时间处理、SQL 增删改查。\",\n    },\n    {\n        \"id\": \"feature-core\",\n        \"title\": \"时序特征工程核心\",\n        \"group\": \"教程\",\n        \"icon\": \"calendar-clock\",\n        \"file\": \"docs/04-时序特征工程核心.md\",\n        \"summary\": \"UTC、日历特征、sin/cos、lag、rolling、数据泄漏。\",\n    },\n    {\n        \"id\": \"modeling\",\n        \"title\": \"建模与实验\",\n        \"group\": \"教程\",\n        \"icon\": \"line-chart\",\n        \"file\": \"docs/05-建模与实验.md\",\n        \"summary\": \"线性回归、按时间切分、MAE/RMSE/R²、结果解读。\",\n    },\n    {\n        \"id\": \"plots-kaggle\",\n        \"title\": \"画图与 Kaggle\",\n        \"group\": \"教程\",\n        \"icon\": \"image\",\n        \"file\": \"docs/06-画图与Kaggle.md\",\n        \"summary\": \"6 张图怎么读，以及 Kaggle 入门赛的练法。\",\n    },\n    {\n        \"id\": \"handbook\",\n        \"title\": \"知识点速查手册\",\n        \"group\": \"教程\",\n        \"icon\": \"book-marked\",\n        \"file\": \"docs/08-知识点与代码速查.md\",\n        \"summary\": \"所有知识点 + 代码 + 一句话作用，可打印；PDF 在 outputs 文件夹。\",\n    },\n    {\n        \"id\": \"homework\",\n        \"title\": \"交作业清单与报告模板\",\n        \"group\": \"教程\",\n        \"icon\": \"clipboard-check\",\n        \"file\": \"docs/07-交作业清单与报告模板.md\",\n        \"summary\": \"交付清单、一页报告模板、五分钟汇报提纲。\",\n    },\n    {\n        \"id\": \"errors\",\n        \"title\": \"报错急救\",\n        \"group\": \"教程\",\n        \"icon\": \"life-buoy\",\n        \"file\": \"docs/99-报错急救.md\",\n        \"summary\": \"最常见报错的原因和解决办法。\",\n    },\n    {\n        \"id\": \"note-feature\",\n        \"title\": \"学习笔记模板\",\n        \"group\": \"笔记\",\n        \"icon\": \"notebook-pen\",\n        \"file\": \"notes/学习笔记模板.md\",\n        \"summary\": \"每个特征一张表：构造、含义、实验证据、结论。\",\n    },\n    {\n        \"id\": \"note-experiment\",\n        \"title\": \"实验记录模板\",\n        \"group\": \"笔记\",\n        \"icon\": \"flask-conical\",\n        \"file\": \"notes/实验记录模板.md\",\n        \"summary\": \"模型对比表、消融实验表、结论模板。\",\n    },\n]\n\n# ---------------------------------------------------------------------------\n# 2. 页面里要展示的脚本\n# ---------------------------------------------------------------------------\nSCRIPTS: list[dict[str, str]] = [\n    {\n        \"id\": \"download\",\n        \"title\": \"下载数据集\",\n        \"group\": \"准备\",\n        \"file\": \"scripts/download_data.py\",\n        \"cmd\": \"python scripts\\\\download_data.py\",\n        \"summary\": \"下载 UCI 北京 PM2.5 数据；网络失败时自动生成结构相同的模拟数据。\",\n    },\n    {\n        \"id\": \"python-basics\",\n        \"title\": \"01 Python 基础\",\n        \"group\": \"基础\",\n        \"file\": \"scripts/01_python_basics.py\",\n        \"cmd\": \"python scripts\\\\01_python_basics.py\",\n        \"summary\": \"列表、字典、deque 队列、函数、文件读写、循环和条件。\",\n    },\n    {\n        \"id\": \"pandas-basics\",\n        \"title\": \"02 pandas 基础\",\n        \"group\": \"基础\",\n        \"file\": \"scripts/02_pandas_basics.py\",\n        \"cmd\": \"python scripts\\\\02_pandas_basics.py\",\n        \"summary\": \"DataFrame、选列、筛行、groupby、datetime、读真实 CSV。\",\n    },\n    {\n        \"id\": \"sqlite-basics\",\n        \"title\": \"03 SQLite 基础\",\n        \"group\": \"基础\",\n        \"file\": \"scripts/03_sqlite_basics.py\",\n        \"cmd\": \"python scripts\\\\03_sqlite_basics.py\",\n        \"summary\": \"建表、增删改查、主键、索引，全部用 Python 自带的 sqlite3。\",\n    },\n    {\n        \"id\": \"load-clean\",\n        \"title\": \"04 加载与清洗\",\n        \"group\": \"数据处理\",\n        \"file\": \"scripts/04_load_clean.py\",\n        \"cmd\": \"python scripts\\\\04_load_clean.py\",\n        \"summary\": \"拼 UTC 时间、排序、检查重复和缺失、保持完整小时时间轴。\",\n    },\n    {\n        \"id\": \"time-features\",\n        \"title\": \"05 时间特征提取\",\n        \"group\": \"特征工程\",\n        \"file\": \"scripts/05_time_features.py\",\n        \"cmd\": \"python scripts\\\\05_time_features.py\",\n        \"summary\": \"年、月、日、星期、小时、是否周末，以及 sin/cos 周期编码。\",\n    },\n    {\n        \"id\": \"baseline\",\n        \"title\": \"06 基线模型\",\n        \"group\": \"建模实验\",\n        \"file\": \"scripts/06_baseline_model.py\",\n        \"cmd\": \"python scripts\\\\06_baseline_model.py\",\n        \"summary\": \"平均值基线 vs 线性回归；按时间前 80% 训练、后 20% 测试。\",\n    },\n    {\n        \"id\": \"cyclic\",\n        \"title\": \"07 周期编码对照\",\n        \"group\": \"建模实验\",\n        \"file\": \"scripts/07_cyclic_encoding.py\",\n        \"cmd\": \"python scripts\\\\07_cyclic_encoding.py\",\n        \"summary\": \"只改特征写法：原始小时/星期 vs sin/cos 周期编码。\",\n    },\n    {\n        \"id\": \"lag-rolling\",\n        \"title\": \"08 滞后与滑动窗口\",\n        \"group\": \"特征工程\",\n        \"file\": \"scripts/08_lag_rolling_features.py\",\n        \"cmd\": \"python scripts\\\\08_lag_rolling_features.py\",\n        \"summary\": \"shift 造 lag，rolling 造均值/波动/极值，并故意造出 _leaky 错误特征。\",\n    },\n    {\n        \"id\": \"compare\",\n        \"title\": \"09 模型对比与泄漏演示\",\n        \"group\": \"建模实验\",\n        \"file\": \"scripts/09_model_comparison.py\",\n        \"cmd\": \"python scripts\\\\09_model_comparison.py\",\n        \"summary\": \"多组特征对照、消融实验、中心滑窗泄漏、把答案当特征。\",\n    },\n    {\n        \"id\": \"plots\",\n        \"title\": \"10 画图观察特征\",\n        \"group\": \"可视化\",\n        \"file\": \"scripts/10_plots.py\",\n        \"cmd\": \"python scripts\\\\10_plots.py\",\n        \"summary\": \"原始序列、滑动平均、差分、周期性、预测对比、周期编码圆、相关性热力图。\",\n    },\n    {\n        \"id\": \"common\",\n        \"title\": \"公共工具 common.py\",\n        \"group\": \"公共\",\n        \"file\": \"scripts/common.py\",\n        \"cmd\": \"（不用单独运行，被其他脚本 import）\",\n        \"summary\": \"路径、读数据、MAE/RMSE/R²、中文画图设置。\",\n    },\n]\n\n# ---------------------------------------------------------------------------\n# 3. 图片和表格\n# ---------------------------------------------------------------------------\nFIGURES = [\n    {\n        \"file\": \"outputs/figures/01_原始序列与趋势.png\",\n        \"title\": \"原始序列与趋势\",\n        \"caption\": \"上图是 5 年日平均，下图是两周小时数据。先看趋势和日周期。\",\n    },\n    {\n        \"file\": \"outputs/figures/02_滑动平均与差分.png\",\n        \"title\": \"滑动平均与差分\",\n        \"caption\": \"7 天滑动平均像降噪滤镜；差分把变化量和异常点单独拎出来。\",\n    },\n    {\n        \"file\": \"outputs/figures/03_周期性观察.png\",\n        \"title\": \"周期性观察\",\n        \"caption\": \"按小时、星期、月份求平均。柱子高低明显，说明时间包含预测信号。\",\n    },\n    {\n        \"file\": \"outputs/figures/04_预测对比.png\",\n        \"title\": \"预测对比\",\n        \"caption\": \"黑线真实值，橙线只用时间特征（几乎是平的），蓝线完整特征（紧跟真实值）。\",\n    },\n    {\n        \"file\": \"outputs/figures/05_周期编码圆.png\",\n        \"title\": \"周期编码圆\",\n        \"caption\": \"23 点和 0 点在圆上相邻，这就是 sin/cos 编码想表达的事情。\",\n    },\n    {\n        \"file\": \"outputs/figures/06_相关性热力图.png\",\n        \"title\": \"相关性热力图\",\n        \"caption\": \"和下一小时 PM2.5 的线性相关。相关不等于因果，只能作为第一眼参考。\",\n    },\n]\n\nTABLES = [\n    {\n        \"id\": \"comparison\",\n        \"title\": \"模型对比：哪些特征有用\",\n        \"file\": \"outputs/tables/09_model_comparison.csv\",\n        \"description\": \"同一段时间切分，只改特征。注意区分'可信'和'不可信'的结论。\",\n        \"max_rows\": 50,\n    },\n    {\n        \"id\": \"ablation\",\n        \"title\": \"消融实验：拿掉一组会怎样\",\n        \"file\": \"outputs/tables/09_ablation.csv\",\n        \"description\": \"从完整特征里拿掉一组，看 MAE/R² 变差多少。\",\n        \"max_rows\": 50,\n    },\n    {\n        \"id\": \"coefficients\",\n        \"title\": \"标准化回归系数\",\n        \"file\": \"outputs/tables/09_feature_coefficients.csv\",\n        \"description\": \"粗略看哪些特征和预测关系更大；特征相关时不能当因果。\",\n        \"max_rows\": 50,\n    },\n    {\n        \"id\": \"feature-dict\",\n        \"title\": \"特征字典\",\n        \"file\": \"outputs/tables/05_feature_dictionary.csv\",\n        \"description\": \"每个时间特征的构造方法、含义和可能作用。\",\n        \"max_rows\": 50,\n    },\n    {\n        \"id\": \"alignment\",\n        \"title\": \"时间对齐示例\",\n        \"file\": \"outputs/tables/08_time_alignment.csv\",\n        \"description\": \"看清 lag1、lag24、roll24_mean、pm25_next 分别对应哪些时刻。\",\n        \"max_rows\": 20,\n    },\n    {\n        \"id\": \"baseline-results\",\n        \"title\": \"基线模型结果\",\n        \"file\": \"outputs/tables/06_baseline_results.csv\",\n        \"description\": \"平均值基线 vs 只用时间特征的线性回归。\",\n        \"max_rows\": 20,\n    },\n    {\n        \"id\": \"cyclic-results\",\n        \"title\": \"周期编码结果\",\n        \"file\": \"outputs/tables/07_cyclic_results.csv\",\n        \"description\": \"原始数字时间 vs sin/cos 周期编码。\",\n        \"max_rows\": 20,\n    },\n    {\n        \"id\": \"predictions\",\n        \"title\": \"预测结果预览（前 20 行）\",\n        \"file\": \"outputs/tables/09_test_predictions.csv\",\n        \"description\": \"测试期的真实值、持续法、只用时间、完整特征、泄漏版的预测对比。\",\n        \"max_rows\": 20,\n    },\n]\n\nCONCEPTS = [\n    {\n        \"icon\": \"globe\",\n        \"title\": \"UTC\",\n        \"text\": \"世界统一时间，避免时区混乱。北京时间 = UTC + 8。\",\n        \"route\": \"#doc-feature-core\",\n    },\n    {\n        \"icon\": \"refresh-cw\",\n        \"title\": \"周期编码\",\n        \"text\": \"用 sin/cos 把小时、星期放到圆上，让 23 点和 0 点变成邻居。\",\n        \"route\": \"#doc-feature-core\",\n    },\n    {\n        \"icon\": \"history\",\n        \"title\": \"滞后 lag\",\n        \"text\": \"shift(1) 是上一小时，shift(24) 是昨天同一小时。\",\n        \"route\": \"#doc-feature-core\",\n    },\n    {\n        \"icon\": \"move-horizontal\",\n        \"title\": \"滑动窗口 rolling\",\n        \"text\": \"最近 24/168 小时的均值、波动、最大值、最小值。\",\n        \"route\": \"#doc-feature-core\",\n    },\n    {\n        \"icon\": \"shield-alert\",\n        \"title\": \"数据泄漏\",\n        \"text\": \"用了 t+1 或更晚的信息，测试分数会假高。\",\n        \"route\": \"#doc-feature-core\",\n    },\n    {\n        \"icon\": \"target\",\n        \"title\": \"基线\",\n        \"text\": \"平均值和持续法。复杂模型必须先打赢它们。\",\n        \"route\": \"#doc-modeling\",\n    },\n]\n\nROADMAP = [\n    {\n        \"day\": \"第 1 天\",\n        \"title\": \"环境、Git、Markdown\",\n        \"desc\": \"跑通一键脚本，建 GitHub 仓库，学会写笔记。\",\n        \"route\": \"#doc-env\",\n        \"key\": \"day1\",\n    },\n    {\n        \"day\": \"第 2 天\",\n        \"title\": \"Python 基础\",\n        \"desc\": \"跑 01–03，改几个数字再运行，理解 list/dict/deque。\",\n        \"route\": \"#script-python-basics\",\n        \"key\": \"day2\",\n    },\n    {\n        \"day\": \"第 3 天\",\n        \"title\": \"pandas 与 SQLite\",\n        \"desc\": \"会读 CSV、筛选、分组、时间处理，会写四条 SQL。\",\n        \"route\": \"#doc-pandas-sqlite\",\n        \"key\": \"day3\",\n    },\n    {\n        \"day\": \"第 4 天\",\n        \"title\": \"清洗与时间特征\",\n        \"desc\": \"跑 04、05，理解 UTC、缺失值、is_weekend、sin/cos。\",\n        \"route\": \"#script-time-features\",\n        \"key\": \"day4\",\n    },\n    {\n        \"day\": \"第 5 天\",\n        \"title\": \"基线模型与周期编码\",\n        \"desc\": \"跑 06、07，理解 MAE/RMSE/R²，把结果抄进实验记录。\",\n        \"route\": \"#doc-modeling\",\n        \"key\": \"day5\",\n    },\n    {\n        \"day\": \"第 6 天\",\n        \"title\": \"滞后、滑动窗口、防泄漏\",\n        \"desc\": \"跑 08、09，重点看中心滑窗和'把答案当特征'的错误示范。\",\n        \"route\": \"#script-compare\",\n        \"key\": \"day6\",\n    },\n    {\n        \"day\": \"第 7 天\",\n        \"title\": \"画图、Kaggle、总结\",\n        \"desc\": \"跑 10，读 3 篇 Kaggle notebook，写一页实验总结。\",\n        \"route\": \"#doc-plots-kaggle\",\n        \"key\": \"day7\",\n    },\n]\n\nREQUIREMENTS = [\n    (\"1.1 Git 和 GitHub\", \"上传代码到仓库\", \"#doc-env\"),\n    (\"1.2 Markdown\", \"写特征笔记和实验记录\", \"#doc-note-feature\"),\n    (\"1.3 Python\", \"列表、字典、文件、pandas、SQLite\", \"#script-python-basics\"),\n    (\"2.1 数据集\", \"带时间戳的 CSV\", \"#script-download\"),\n    (\"2.2 基础处理\", \"解析时间、排序、检查缺失\", \"#script-load-clean\"),\n    (\"2.3 时间特征\", \"年、月、日、星期、小时、是否周末\", \"#script-time-features\"),\n    (\"2.4 基线模型\", \"线性回归基线\", \"#script-baseline\"),\n    (\"2.5 周期编码\", \"小时/星期 sin/cos 对照\", \"#script-cyclic\"),\n    (\"3.1 滞后和滑窗\", \"shift 和 rolling，防止未来数据\", \"#script-lag-rolling\"),\n    (\"3.2 对比效果\", \"记录哪些特征有用\", \"#table-comparison\"),\n    (\"3.3 画图观察\", \"原始、滑均、差分序列\", \"#figures\"),\n    (\"3.4 Kaggle\", \"看别人的特征工程思路\", \"#doc-plots-kaggle\"),\n]\n\n\n# ---------------------------------------------------------------------------\n# 工具函数\n# ---------------------------------------------------------------------------\ndef read_text(path: Path) -> str:\n    \"\"\"读文本，优先 UTF-8，失败再试 GBK。\"\"\"\n    try:\n        return path.read_text(encoding=\"utf-8-sig\")\n    except UnicodeDecodeError:\n        return path.read_text(encoding=\"gbk\", errors=\"replace\")\n\n\ndef strip_tags(value: str) -> str:\n    \"\"\"粗略去掉 HTML 标签，用于搜索索引。\"\"\"\n    value = re.sub(r\"<script.*?<\/script>\", \" \", value, flags=re.S | re.I)\n    value = re.sub(r\"<style.*?<\/style>\", \" \", value, flags=re.S | re.I)\n    value = re.sub(r\"<[^>]+>\", \" \", value)\n    value = html.unescape(value)\n    return re.sub(r\"\\s+\", \" \", value).strip()\n\n\ndef iter_project_files(limit: int = 400) -> list[dict[str, str]]:\n    \"\"\"列出项目里的文件，给搜索框做索引（跳过虚拟环境和缓存目录）。\"\"\"\n    skip = {\".git\", \".venv\", \"venv\", \"__pycache__\", \"node_modules\", \".idea\", \".vscode\", \"dist\"}\n    result: list[dict[str, str]] = []\n    for path in sorted(PROJECT_ROOT.rglob(\"*\")):\n        if len(result) >= limit:\n            break\n        if not path.is_file():\n            continue\n        parts = set(path.relative_to(PROJECT_ROOT).parts)\n        if parts & skip:\n            continue\n        result.append(\n            {\n                \"path\": path.relative_to(PROJECT_ROOT).as_posix(),\n                \"name\": path.name,\n            }\n        )\n    return result\n\n\ndef render_table(path: Path, max_rows: int = 100) -> str:\n    \"\"\"把 CSV 渲染成 HTML 表格。\"\"\"\n    if not path.exists():\n        return '<p class=\"muted\">还没有这个文件，请先运行对应脚本。<\/p>'\n\n    with path.open(\"r\", encoding=\"utf-8-sig\", newline=\"\") as handle:\n        rows = list(csv.reader(handle))\n\n    if not rows:\n        return '<p class=\"muted\">表格是空的。<\/p>'\n\n    header, body = rows[0], rows[1 : max_rows + 1]\n    parts = ['<div class=\"table-wrap\"><table class=\"data-table\">', \"<thead><tr>\"]\n    for name in header:\n        parts.append(f\"<th>{html.escape(name)}<\/th>\")\n    parts.append(\"<\/tr><\/thead><tbody>\")\n\n    for row in body:\n        parts.append(\"<tr>\")\n        for index, cell in enumerate(row):\n            column = header[index] if index < len(header) else \"\"\n            classes = []\n            if re.fullmatch(r\"-?\\d+(\\.\\d+)?\", cell.strip()):\n                classes.append(\"num\")\n            if column == \"是否可信\":\n                classes.append(\"trust\" if cell.strip() == \"可信\" else \"untrust\")\n            class_attr = f' class=\"{\" \".join(classes)}\"' if classes else \"\"\n            parts.append(f\"<td{class_attr}>{html.escape(cell)}<\/td>\")\n        parts.append(\"<\/tr>\")\n    parts.append(\"<\/tbody><\/table><\/div>\")\n\n    if len(rows) - 1 > len(body):\n        parts.append(\n            f'<p class=\"muted\">只显示前 {len(body)} 行，共 {len(rows) - 1} 行。'\n            f'完整文件：<code>{html.escape(str(path.relative_to(PROJECT_ROOT)))}<\/code><\/p>'\n        )\n    return \"\\n\".join(parts)\n\n\ndef resolve_link(url: str, doc_by_file: dict[str, str], doc_by_name: dict[str, str], script_by_file: dict[str, str]) -> str:\n    \"\"\"把 Markdown 里的相对链接改写成网页内部路由。\"\"\"\n    if url.startswith((\"http://\", \"https://\", \"mailto:\", \"#\", \"data:\")):\n        return url\n\n    clean = unquote(url).replace(\"\\\\\", \"/\").lstrip(\"./\")\n    name = clean.split(\"/\")[-1]\n\n    if clean == \"README.md\":\n        return \"#doc-overview\"\n    if clean in doc_by_file:\n        return f\"#doc-{doc_by_file[clean]}\"\n    if name in doc_by_name:\n        return f\"#doc-{doc_by_name[name]}\"\n    if clean in script_by_file:\n        return f\"#script-{script_by_file[clean]}\"\n    if clean.startswith(\"notes/\"):\n        return \"#doc-note-feature\"\n    if clean.startswith(\"outputs/\"):\n        return f\"../{clean}\"\n    if clean.startswith(\"data/\"):\n        return f\"../{clean}\"\n    return url\n\n\ndef rewrite_links(raw_html: str, doc_by_file: dict[str, str], doc_by_name: dict[str, str], script_by_file: dict[str, str]) -> str:\n    def repl(match: re.Match[str]) -> str:\n        attr, url = match.group(1), match.group(2)\n        return f'{attr}=\"{resolve_link(url, doc_by_file, doc_by_name, script_by_file)}\"'\n\n    return re.sub(r'(href|src)=\"([^\"]+)\"', repl, raw_html)\n\n\ndef build_docs(doc_by_file: dict[str, str], doc_by_name: dict[str, str], script_by_file: dict[str, str]) -> list[dict[str, str]]:\n    result = []\n    for item in DOCS:\n        path = PROJECT_ROOT / item[\"file\"]\n        if not path.exists():\n            text = f\"# {item['title']}\\n\\n文件还没有生成：`{item['file']}`\"\n        else:\n            text = read_text(path)\n\n        rendered = markdown.markdown(\n            text,\n            extensions=[\"tables\", \"fenced_code\", \"sane_lists\", \"attr_list\", \"md_in_html\"],\n        )\n        rendered = rewrite_links(rendered, doc_by_file, doc_by_name, script_by_file)\n        result.append(\n            {\n                **item,\n                \"html\": rendered,\n                \"plain\": strip_tags(rendered),\n            }\n        )\n    return result\n\n\ndef build_scripts() -> list[dict[str, str]]:\n    result = []\n    for item in SCRIPTS:\n        path = PROJECT_ROOT / item[\"file\"]\n        code = read_text(path) if path.exists() else f\"# 文件不存在：{item['file']}\"\n        result.append({**item, \"code\": code})\n    return result\n\n\n# ---------------------------------------------------------------------------\n# 4. 生成 HTML\n# ---------------------------------------------------------------------------\nHTML_TEMPLATE = \"\"\"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>时序特征工程 · 学习指引<\/title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n<body>\n  <div class=\"app\">\n    <aside class=\"sidebar\" id=\"sidebar\">\n      <div class=\"brand\">\n        <span class=\"brand-icon\"><i data-lucide=\"activity\"><\/i><\/span>\n        <div>\n          <strong>时序特征工程<\/strong>\n          <span>北京 PM2.5 实战<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"search-box\">\n        <i data-lucide=\"search\"><\/i>\n        <input id=\"searchInput\" type=\"search\" placeholder=\"搜索教程、特征、脚本\" autocomplete=\"off\">\n        <kbd>/<\/kbd>\n      <\/div>\n\n      <nav class=\"nav\" id=\"nav\"><\/nav>\n\n      <div class=\"sidebar-foot\">\n        <button class=\"ghost-btn\" id=\"copyPathBtn\" type=\"button\">\n          <i data-lucide=\"folder\"><\/i>\n          <span>复制项目路径<\/span>\n        <\/button>\n      <\/div>\n    <\/aside>\n\n    <div class=\"main\">\n      <header class=\"topbar\">\n        <button class=\"icon-btn menu-btn\" id=\"menuBtn\" type=\"button\" aria-label=\"打开菜单\">\n          <i data-lucide=\"menu\"><\/i>\n        <\/button>\n        <div class=\"crumb\" id=\"crumb\">项目总览<\/div>\n        <div class=\"top-actions\">\n          <button class=\"primary-btn\" id=\"runBtn\" type=\"button\">\n            <i data-lucide=\"play\"><\/i>\n            <span>复制运行命令<\/span>\n          <\/button>\n        <\/div>\n      <\/header>\n\n      <main class=\"content\" id=\"view\"><\/main>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n  <div class=\"dialog-backdrop hidden\" id=\"dialogBackdrop\">\n    <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dialogTitle\">\n      <div class=\"dialog-head\">\n        <h2 id=\"dialogTitle\">代码<\/h2>\n        <button class=\"icon-btn\" id=\"dialogClose\" type=\"button\" aria-label=\"关闭\">\n          <i data-lucide=\"x\"><\/i>\n        <\/button>\n      <\/div>\n      <div class=\"dialog-body\" id=\"dialogBody\"><\/div>\n    <\/div>\n  <\/div>\n\n  <script id=\"guide-data\" type=\"application/json\">__GUIDE_DATA__<\/script>\n  <script src=\"vendor/lucide.min.js\"><\/script>\n  <script src=\"app.js\"><\/script>\n<\/body>\n<\/html>\n\"\"\"\n\n\ndef main() -> None:\n    doc_by_file = {item[\"file\"]: item[\"id\"] for item in DOCS}\n    doc_by_name = {item[\"file\"].split(\"/\")[-1]: item[\"id\"] for item in DOCS}\n    script_by_file = {item[\"file\"]: item[\"id\"] for item in SCRIPTS}\n\n    docs = build_docs(doc_by_file, doc_by_name, script_by_file)\n    scripts = build_scripts()\n\n    tables = {}\n    for item in TABLES:\n        path = PROJECT_ROOT / item[\"file\"]\n        tables[item[\"id\"]] = {\n            **item,\n            \"html\": render_table(path, item.get(\"max_rows\", 100)),\n            \"exists\": path.exists(),\n        }\n\n    cleaning_report_path = PROJECT_ROOT / \"outputs\" / \"tables\" / \"04_cleaning_report.txt\"\n    cleaning_report = (\n        f'<pre class=\"report-pre\">{html.escape(read_text(cleaning_report_path))}<\/pre>'\n        if cleaning_report_path.exists()\n        else '<p class=\"muted\">还没有清洗报告，请先运行 04_load_clean.py。<\/p>'\n    )\n\n    copied_figures = []\n    for item in FIGURES:\n        path = PROJECT_ROOT / item[\"file\"]\n        copied_figures.append(\n            {\n                **item,\n                \"href\": f\"../{item['file']}\",\n                \"exists\": path.exists(),\n            }\n        )\n\n    search_index = []\n    for item in docs:\n        search_index.append(\n            {\n                \"title\": item[\"title\"],\n                \"type\": item[\"group\"],\n                \"route\": f\"#doc-{item['id']}\",\n                \"text\": item[\"plain\"][:4000],\n            }\n        )\n    for item in scripts:\n        search_index.append(\n            {\n                \"title\": item[\"title\"],\n                \"type\": \"脚本\",\n                \"route\": f\"#script-{item['id']}\",\n                \"text\": f\"{item['summary']} {item['cmd']} {item['code'][:2500]}\",\n            }\n        )\n    for item in copied_figures:\n        search_index.append(\n            {\n                \"title\": item[\"title\"],\n                \"type\": \"图\",\n                \"route\": \"#figures\",\n                \"text\": item[\"caption\"],\n            }\n        )\n\n    search_index.append(\n        {\n            \"title\": \"项目文件（读取文件夹）\",\n            \"type\": \"工具\",\n            \"route\": \"#files\",\n            \"text\": \"浏览项目文件夹里的文件，教程、代码、笔记、表格、图片都能直接打开；可重新读取刷新。\",\n        }\n    )\n    for file_item in iter_project_files():\n        search_index.append(\n            {\n                \"title\": file_item[\"path\"],\n                \"type\": \"文件\",\n                \"route\": \"#file-\" + quote(file_item[\"path\"], safe=\"\"),\n                \"text\": file_item[\"path\"] + \" \" + file_item[\"name\"],\n            }\n        )\n\n    data = {\n        \"projectRoot\": str(PROJECT_ROOT),\n        \"generatedAt\": datetime.now().strftime(\"%Y-%m-%d %H:%M\"),\n        \"docs\": docs,\n        \"scripts\": scripts,\n        \"tables\": tables,\n        \"figures\": copied_figures,\n        \"cleaningReport\": cleaning_report,\n        \"concepts\": CONCEPTS,\n        \"roadmap\": ROADMAP,\n        \"requirements\": [\n            {\"requirement\": row[0], \"task\": row[1], \"route\": row[2]} for row in REQUIREMENTS\n        ],\n        \"search\": search_index,\n    }\n\n    payload = json.dumps(data, ensure_ascii=False)\n    payload = payload.replace(\"<\/\", \"<\\\\/\").replace(\"\\u2028\", \"\\\\u2028\").replace(\"\\u2029\", \"\\\\u2029\")\n    rendered = HTML_TEMPLATE.replace(\"__GUIDE_DATA__\", payload)\n\n    GUIDE_DIR.mkdir(parents=True, exist_ok=True)\n    OUTPUT_HTML.write_text(rendered, encoding=\"utf-8\")\n    print(f\"已生成：{OUTPUT_HTML}\")\n    print(f\"教程 {len(docs)} 篇，脚本 {len(scripts)} 个，表格 {len(tables)} 张，图片 {len(copied_figures)} 张。\")\n    print(\"打开方式一：双击 guide/index.html\")\n    print(\"打开方式二：powershell -File guide/start-server.ps1，然后访问 http://127.0.0.1:8765/guide/index.html\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"guide/build_handbook.py":{"path":"guide/build_handbook.py","name":"build_handbook.py","size":11637,"mtime":"2026-10-09 00:24","ext":".py","kind":"text","href":"guide/build_handbook.py","text":"\"\"\"把 docs/08-知识点与代码速查.md 变成可打印的 PDF。\n\n流程只有三步：\n\n1. 用 markdown 库把 Markdown 渲染成 HTML；\n2. 套上专门的\"打印样式\"（A4 纸张、紧凑排版、代码块自动换行）；\n3. 调用本机已有的浏览器（Chrome 或 Edge）做\"打印成 PDF\"。\n\n运行（在项目根目录）：\n\n    python guide\\\\build_handbook.py                    # 紧凑版：HTML + PDF\n    python guide\\\\build_handbook.py --no-pdf           # 只生成 HTML\n    python guide\\\\build_handbo
