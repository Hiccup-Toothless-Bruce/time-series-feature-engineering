  print(\"新增了：hour_sin, hour_cos, dayofweek_sin, dayofweek_cos, month_sin, month_cos\")\n    print(\"\\n看几个关键时刻，体会 23 点和 0 点在圆上是挨着的：\")\n    demo = pd.DataFrame(\n        {\n            \"hour\": [0, 1, 6, 12, 18, 22, 23],\n        }\n    )\n    demo[\"hour_sin\"] = np.sin(2 * np.pi * demo[\"hour\"] / 24)\n    demo[\"hour_cos\"] = np.cos(2 * np.pi * demo[\"hour\"] / 24)\n    print(demo.to_string(index=False))\n    return df\n\n\ndef save_feature_dictionary() -> None:\n    print_step(\"3. 保存“"},{"title":"06 基线模型","type":"脚本","route":"#script-baseline","text":"平均值基线 vs 线性回归；按时间前 80% 训练、后 20% 测试。 python scripts\\06_baseline_model.py \"\"\"第 6 课：第一个基线模型（线性回归）。\n\n任务：用“现在这个小时的时间信息”，预测“下一个小时的 PM2.5”。\n\n这一课的重点不是分数高不高，而是把整套流程跑通：\n- 目标 y 是什么\n- 特征 X 是什么\n- 怎么切分训练集/测试集（时序数据必须按时间切）\n- MAE、RMSE、R2 怎么看\n\n运行：python scripts/06_baseline_model.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.dummy import DummyRegressor\nfrom sklearn.linear_model import LinearRegression\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_time_features,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"06_baseline_results.csv\"\nPRED_CSV = TABLES_DIR / \"06_baseline_predictions.csv\"\n\n# 只允许用“预测时刻已经知道/能算出来”的列。\n# 例如现在的 month/hour 是可以知道的；pm2.5 下一个小时的值不能拿来当特征。\nTIME_FEATURES = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\n\n\ndef build_target(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 构造目标 y：下一个小时的 pm2.5\")\n\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n\n    print(\"shift(-1) 的意思是“把整列往上提一行”：\")\n    demo = df[[\"pm2.5\", \"pm25_next\"]].head(4)\n    print(demo.to_string())\n    print(\"\\n看第 1 行：现在是 80，下一小时是 75，所以 pm25_next=75。\")\n    print(\"最后一行没有“下一个小时”，所以最后一个是 NaN，待会要删掉。\")\n\n    # 最后一行没有未来目标，删掉；特征有缺失的也删掉。\n    return df.dropna(subset=[\"pm25_next\"] + TIME_FEATURES)\n\n\ndef chronological_split(df: pd.DataFrame, train_ratio: float = 0.8) -> tuple[pd.DataFrame, pd.DataFrame]:\n    print_step(\"2. 按时间切分：前 80% 训练，后 20% 测试\")\n\n    split_index = int(len(df) * train_ratio)\n    train = df.iloc[:split_index].copy()\n    test = df.iloc[split_index:].copy()\n\n    print(f\"训练集：{len(train)} 行，时间 {train.index.min()} 到 {train.index.max()}\")\n    print(f\"测试集：{len(test)} 行，时间 {test.index.min()} 到 {test.index.max()}\")\n    print(\"为什么不能随机切分？因为随机切分会把未来的数据混进训练集（考试漏题）。\")\n    return train, test\n\n\ndef evaluate(name: str, y_true: pd.Series, y_pred: np.ndarray, results: list[dict]) -> None:\n    metrics = regression_metrics(y_true, y_pred)\n    print(\n        f\"{name:<24} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\"\n    )\n    results.append(\n        {\n            \"模型\": name,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n        }\n    )\n\n\ndef main() -> None:\n    print_title(\"第 6 课：线性回归基线模型\")\n\n    df = load_time_features()\n    df = build_target(df)\n    train, test = chronological_split(df)\n\n    x_train = train[TIME_FEATURES]\n    x_test = test[TIME_FEATURES]\n    y_train = train[\"pm25_next\"]\n    y_test = test[\"pm25_ne"},{"title":"07 周期编码对照","type":"脚本","route":"#script-cyclic","text":"只改特征写法：原始小时/星期 vs sin/cos 周期编码。 python scripts\\07_cyclic_encoding.py \"\"\"第 7 课：正弦/余弦周期编码，到底有没有用？\n\n对比两种写法：\nA. 直接把 hour=0..23 当成数字喂给线性回归；\nB. 把 hour 拆成 hour_sin、hour_cos 两个数再喂给线性回归。\n\n运行：python scripts/07_cyclic_encoding.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\n\nfrom common import (\n    TABLES_DIR,\n    load_time_features,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"07_cyclic_results.csv\"\nPRED_CSV = TABLES_DIR / \"07_cyclic_predictions.csv\"\n\nRAW_FEATURES = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\nCYCLIC_FEATURES = [\n    \"is_weekend\",\n    \"hour_sin\",\n    \"hour_cos\",\n    \"dayofweek_sin\",\n    \"dayofweek_cos\",\n    \"month_sin\",\n    \"month_cos\",\n]\n\n\ndef explain_problem() -> None:\n    print_step(\"1. 先说清楚：为什么直接把 23 和 0 当数字很别扭？\")\n\n    demo = pd.DataFrame({\"hour\": [0, 1, 6, 12, 18, 22, 23]})\n    demo[\"hour_sin\"] = np.sin(2 * np.pi * demo[\"hour\"] / 24)\n    demo[\"hour_cos\"] = np.cos(2 * np.pi * demo[\"hour\"] / 24)\n    print(demo.to_string(index=False))\n    print(\"\\n对模型来说，如果只给一个 hour 数字：\")\n    print(\"  23 和 0 相差 23，看起来隔得很远；\")\n    print(\"  但现实中 23:00 和 00:00 只差 1 小时。\")\n    print(\"用 sin/cos 把时间放到圆上后，两者坐标就非常接近。\")\n\n\ndef make_target(df: pd.DataFrame) -> pd.DataFrame:\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n    return df.dropna(subset=[\"pm25_next\"])\n\n\ndef fit_and_evaluate(\n    name: str,\n    train: pd.DataFrame,\n    test: pd.DataFrame,\n    features: list[str],\n    results: list[dict],\n) -> np.ndarray:\n    model = LinearRegression()\n    model.fit(train[features], train[\"pm25_next\"])\n    pred = model.predict(test[features])\n    metrics = regression_metrics(test[\"pm25_next\"], pred)\n    print(\n        f\"{name:<20} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\"\n    )\n    results.append(\n        {\n            \"模型\": name,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n        }\n    )\n    return pred\n\n\ndef main() -> None:\n    print_title(\"第 7 课：周期编码对照实验\")\n\n    explain_problem()\n\n    df = make_target(load_time_features())\n    split_index = int(len(df) * 0.8)\n    train = df.iloc[:split_index]\n    test = df.iloc[split_index:]\n\n    print_step(\"2. 同一个任务、同一段时间切分，只改特征写法\")\n    print(f\"训练集 {len(train)} 行，测试集 {len(test)} 行。\")\n\n    results: list[dict] = []\n\n    pred_raw = fit_and_evaluate(\"原始数字时间\", train, test, RAW_FEATURES, results)\n    pred_cyclic = fit_and"},{"title":"08 滞后与滑动窗口","type":"脚本","route":"#script-lag-rolling","text":"shift 造 lag，rolling 造均值/波动/极值，并故意造出 _leaky 错误特征。 python scripts\\08_lag_rolling_features.py \"\"\"第 8 课：滞后（lag）和滑动窗口（rolling）特征。\n\n先约定预测场景（非常重要）：\n    站在时间 t，用截至 t 已经知道的信息，预测 t+1 时刻的 pm2.5。\n\n所以：\n- t 时刻的 pm2.5、天气，都是“已经知道”的，可以用。\n- t+1 及以后的值，绝对不能作为特征，否则就是作弊（数据泄漏）。\n\n本脚本会生成：\n1. 正确特征：lag、diff、trailing rolling；\n2. 故意错误特征：中心滑动窗口（会看到未来）、把答案当特征；\n   它们只用于第 9 课的错误示范，不能放进正式模型。\n\n运行：python scripts/08_lag_rolling_features.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_clean_data,\n    print_step,\n    print_title,\n)\n\nOUT_CSV = PROCESSED_DIR / \"pm25_model_data.csv\"\nALIGN_CSV = TABLES_DIR / \"08_time_alignment.csv\"\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef add_time_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 先把第 5 课的时间特征加上\")\n\n    df = df.copy()\n    index = df.index\n    df[\"year\"] = index.year\n    df[\"month\"] = index.month\n    df[\"day\"] = index.day\n    df[\"hour\"] = index.hour\n    df[\"dayofweek\"] = index.dayofweek\n    df[\"weekday_name\"] = index.dayofweek.map(lambda x: WEEKDAY_NAMES[x])\n    df[\"is_weekend\"] = (index.dayofweek >= 5).astype(int)\n    df[\"dayofyear\"] = index.dayofyear\n\n    df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\n    df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n    df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12)\n    df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12)\n\n    print(\"时间特征已加上。\")\n    return df\n\n\ndef add_lag_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 滞后特征 lag：把过去的值挪到当前行\")\n\n    df = df.copy()\n\n    # 当前值：站在 t 时刻，pm2.5 已经测到了，当然可以用。\n    df[\"pm25_now\"] = df[\"pm2.5\"]\n\n    # shift(1) 表示“上一小时的值”，shift(24) 表示“昨天同一小时”。\n    df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1)\n    df[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2)\n    df[\"pm25_lag3\"] = df[\"pm2.5\"].shift(3)\n    df[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24)\n    df[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168)  # 24*7，上周同一小时\n\n    # diff 是“变化量”：比昨天同一小时高了多少？\n    df[\"pm25_diff1\"] = df[\"pm2.5\"].diff(1)\n    df[\"pm25_diff24\"] = df[\"pm2.5\"].diff(24)\n\n    print(\"新增：pm25_now, pm25_lag1/2/3/24/168, pm25_diff1, pm25_diff24\")\n    print(\"解释：lag24 能帮模型看到“昨天这个时候的污染水平”，lag168 看“上周同一时刻”。\")\n    return df\n\n\ndef add_rolling_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"3. 滑动窗口特征 rolling：最近的均值、波动、最大值\")\n\n    df = df.copy()\n\n    # 注意：窗口在 t 时刻结束（trailing window），里面的值都 <= t，预测 t+1 时是安全的。\n    # 数据里有少量长缺口，所以 min_perio"},{"title":"09 模型对比与泄漏演示","type":"脚本","route":"#script-compare","text":"多组特征对照、消融实验、中心滑窗泄漏、把答案当特征。 python scripts\\09_model_comparison.py \"\"\"第 9 课：把各种特征放在一起对比，并亲手演示数据泄漏。\n\n对比模型（全部用同一段训练/测试时间，除最后两个错误示范）：\n1. 平均值基线：永远猜训练集平均值\n2. 持续法基线：把当前 pm2.5 直接当成下一小时预测\n3. 只用原始时间特征\n4. 用周期编码时间特征\n5. 周期编码 + 滞后特征\n6. 周期编码 + 滞后 + 滑动窗口 + 天气（完整正确版）\n7. 错误示范：中心滑动窗口，偷看了未来\n8. 错误示范：把答案当特征，R2 约为 1\n9. 错误示范：随机切分时间序列\n\n运行：python scripts/09_model_comparison.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardScaler\n\nfrom common import (\n    TABLES_DIR,\n    load_model_data,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"09_model_comparison.csv\"\nABLATION_CSV = TABLES_DIR / \"09_ablation.csv\"\nPRED_CSV = TABLES_DIR / \"09_test_predictions.csv\"\nCOEF_CSV = TABLES_DIR / \"09_feature_coefficients.csv\"\n\nTIME_RAW = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\nTIME_CYC = [\n    \"is_weekend\",\n    \"hour_sin\",\n    \"hour_cos\",\n    \"dayofweek_sin\",\n    \"dayofweek_cos\",\n    \"month_sin\",\n    \"month_cos\",\n]\nLAGS = [\n    \"pm25_now\",\n    \"pm25_lag1\",\n    \"pm25_lag2\",\n    \"pm25_lag3\",\n    \"pm25_lag24\",\n    \"pm25_lag168\",\n    \"pm25_diff1\",\n    \"pm25_diff24\",\n]\nROLLS = [\n    \"pm25_roll24_mean\",\n    \"pm25_roll24_std\",\n    \"pm25_roll24_max\",\n    \"pm25_roll24_min\",\n    \"pm25_roll168_mean\",\n    \"pm25_roll168_std\",\n]\nWEATHER = [\"TEMP\", \"DEWP\", \"PRES\", \"Iws\", \"Is\", \"Ir\", \"TEMP_lag1\", \"TEMP_roll24_mean\"]\nLEAKY_CENTER = [\"pm25_roll24_mean_center_leaky\", \"pm25_roll168_mean_center_leaky\"]\nLEAKY_ANSWER = [\"pm25_answer_leaky\"]\n\n\ndef prepare_data() -> pd.DataFrame:\n    df = load_model_data()\n    needed = TIME_RAW + TIME_CYC + LAGS + ROLLS + WEATHER + LEAKY_CENTER + LEAKY_ANSWER + [\"pm25_next\"]\n    needed = list(dict.fromkeys(needed))  # 去重，保持顺序\n    df = df.dropna(subset=needed)\n    # 为了公平对比，错误特征在 dropna 后也一起留下；正式模型只是不选它们而已。\n    return df\n\n\ndef evaluate(\n    name: str,\n    feature_desc: str,\n    split_desc: str,\n    y_true: pd.Series,\n    y_pred: np.ndarray,\n    trust: str,\n    results: list[dict],\n) -> None:\n    metrics = regression_metrics(y_true, y_pred)\n    print(\n        f\"{name:<28} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}  [{trust}]\"\n    )\n    results.append(\n        {\n            \"实验\": name,\n            \"特征\": feature_desc,\n            \"切分方式\": split_desc,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"]"},{"title":"10 画图观察特征","type":"脚本","route":"#script-plots","text":"原始序列、滑动平均、差分、周期性、预测对比、周期编码圆、相关性热力图。 python scripts\\10_plots.py \"\"\"第 10 课：画图观察特征。\n\n图比数字更容易让人看懂：\n- 原始序列：整体趋势和季节变化\n- 7 天滑动平均：把短期噪声抹平，看清趋势\n- 差分序列：今天比昨天变化了多少，异常点更刺眼\n- 小时/星期/月份平均：周期长什么样\n- 周期编码圆：23 点和 0 点为什么变近了\n- 预测对比：加了特征以后，预测线有没有更贴近真实线\n\n运行：python scripts/10_plots.py\n图片保存在 outputs/figures/\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import (\n    FIGURES_DIR,\n    TABLES_DIR,\n    load_clean_data,\n    load_model_data,\n    load_time_features,\n    print_step,\n    print_title,\n    setup_matplotlib_chinese,\n)\n\nplt = setup_matplotlib_chinese()\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef plot_original_series() -> None:\n    print_step(\"1. 原始序列：整体看 5 年，再放大看 2 周\")\n\n    df = load_clean_data()\n    daily = df[\"pm2.5\"].resample(\"D\").mean()\n    zoom = df.loc[\"2014-06-01\":\"2014-06-14\", \"pm2.5\"]\n\n    fig, axes = plt.subplots(2, 1, figsize=(12, 8))\n    axes[0].plot(daily.index, daily.values, color=\"#2c7fb8\", linewidth=1)\n    axes[0].set_title(\"PM2.5 日平均值（2010-2014）\")\n    axes[0].set_ylabel(\"PM2.5\")\n    axes[0].grid(alpha=0.3)\n\n    axes[1].plot(zoom.index, zoom.values, color=\"#d95f02\", linewidth=1)\n    axes[1].set_title(\"放大看：2014 年 6 月前两周的每小时 PM2.5\")\n    axes[1].set_ylabel(\"PM2.5\")\n    axes[1].set_xlabel(\"UTC 时间\")\n    axes[1].grid(alpha=0.3)\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"01_原始序列与趋势.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n\n    print(\"怎么读图：\")\n    print(\"- 上图：能看出季节变化（冬天通常更高）和长期趋势。\")\n    print(\"- 下图：能看出一天内的高低起伏，这就是“日周期”。\")\n\n\ndef plot_rolling_and_diff() -> None:\n    print_step(\"2. 原始序列 vs 7 天滑动平均 vs 差分\")\n\n    df = load_clean_data()\n    daily = df[\"pm2.5\"].resample(\"D\").mean()\n    rolling7 = daily.rolling(7).mean()\n    diff1 = daily.diff(1)\n\n    fig, axes = plt.subplots(2, 1, figsize=(12, 8))\n    axes[0].plot(daily.index, daily.values, color=\"#aaaaaa\", linewidth=1, label=\"每日原始值\")\n    axes[0].plot(rolling7.index, rolling7.values, color=\"#e6550d\", linewidth=2.5, label=\"7 天滑动平均\")\n    axes[0].set_title(\"原始序列 vs 7 天滑动平均\")\n    axes[0].set_ylabel(\"PM2.5\")\n    axes[0].legend()\n    axes[0].grid(alpha=0.3)\n\n    axes[1].plot(diff1.index, diff1.values, color=\"#31a354\", linewidth=1)\n    axes[1].axhline(0, color=\"black\", linewidth=0.8)\n    axes[1].set_title(\"差分序列：今天 - 昨天（变化量）\")\n    axes[1].set_ylabel(\"变化量\")\n    axes[1].set_xlabel(\"日期（UTC）\")\n    axes[1].grid(alpha=0.3)\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"02_滑动平均与差分.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n    print(\"怎么读图：滑动平均像“降噪滤镜”；差分把“变化大不大”单独拎出来，突刺就"},{"title":"公共工具 common.py","type":"脚本","route":"#script-common","text":"路径、读数据、MAE/RMSE/R²、中文画图设置。 （不用单独运行，被其他脚本 import） \"\"\"公共工具函数。\n\n为什么要有一个 common.py？\n- 每个脚本都要找数据文件、算指标、设置中文字体，如果每份代码都复制一遍，\n  改起来很容易漏。放到一个公共文件里，新手也能一眼看懂。\n\n运行方式：这个文件不用单独运行，别的脚本会自动 import 它。\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\n# ---------------------------------------------------------------------------\n# 1. 项目里所有重要文件夹和文件的位置\n# ---------------------------------------------------------------------------\n# Path(__file__) 是“当前这个 py 文件”的路径；parents[1] 就是项目根目录。\n# 这样不管你在哪个文件夹里敲命令，路径都不会错。\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\n\nRAW_CSV = (\n    PROJECT_ROOT\n    / \"data\"\n    / \"raw\"\n    / \"beijing_pm25\"\n    / \"PRSA_data_2010.1.1-2014.12.31.csv\"\n)\nPROCESSED_DIR = PROJECT_ROOT / \"data\" / \"processed\"\nFIGURES_DIR = PROJECT_ROOT / \"outputs\" / \"figures\"\nTABLES_DIR = PROJECT_ROOT / \"outputs\" / \"tables\"\n\n# exist_ok=True 表示“文件夹已存在也不要报错”；parents=True 表示“缺上级文件夹就一起建”。\nfor folder in (PROCESSED_DIR, FIGURES_DIR, TABLES_DIR):\n    folder.mkdir(parents=True, exist_ok=True)\n\n\n# ---------------------------------------------------------------------------\n# 2. 打印小工具，让终端输出更易读\n# ---------------------------------------------------------------------------\ndef print_title(title: str) -> None:\n    \"\"\"打印一个醒目的标题。\"\"\"\n    print()\n    print(\"=\" * 68)\n    print(title)\n    print(\"=\" * 68)\n\n\ndef print_step(step: str) -> None:\n    \"\"\"打印一小步的说明。\"\"\"\n    print(f\"\\n--- {step} ---\")\n\n\n# ---------------------------------------------------------------------------\n# 3. 读数据\n# ---------------------------------------------------------------------------\ndef load_raw_data() -> pd.DataFrame:\n    \"\"\"读取最原始的 CSV，不做任何清洗。\"\"\"\n    if not RAW_CSV.exists():\n        raise FileNotFoundError(\n            f\"找不到原始数据：{RAW_CSV}\\n\"\n            \"请先运行：python scripts/download_data.py\"\n        )\n    return pd.read_csv(RAW_CSV)\n\n\ndef _read_csv_with_utc_index(path: Path) -> pd.DataFrame:\n    \"\"\"读带 datetime 列的 CSV，并把 datetime 设为 UTC 时间索引。\"\"\"\n    if not path.exists():\n        raise FileNotFoundError(f\"找不到文件：{path}\\n请先运行生成它的上一个脚本。\")\n    df = pd.read_csv(path)\n    df[\"datetime\"] = pd.to_datetime(df[\"datetime\"], utc=True)\n    return df.set_index(\"datetime\").sort_index()\n\n\ndef load_clean_data() -> pd.DataFrame:\n    \"\"\"读取 04_load_clean.py 生成的干净数据。\"\"\"\n    return _read_csv_with_utc_index(PROCESSED_DIR / \"pm25_clean.csv\")\n\n\ndef load_time_features() -> pd.DataFrame:\n    \"\"\"读取 05_time_features.py 生成的时间特征数据。\"\"\"\n    return _read_csv_with_utc_index(PROCESSED_DIR / \"pm25_time_features.csv\")\n\n\ndef load_model_data() -> pd.DataFrame"},{"title":"原始序列与趋势","type":"图","route":"#figures","text":"上图是 5 年日平均，下图是两周小时数据。先看趋势和日周期。"},{"title":"滑动平均与差分","type":"图","route":"#figures","text":"7 天滑动平均像降噪滤镜；差分把变化量和异常点单独拎出来。"},{"title":"周期性观察","type":"图","route":"#figures","text":"按小时、星期、月份求平均。柱子高低明显，说明时间包含预测信号。"},{"title":"预测对比","type":"图","route":"#figures","text":"黑线真实值，橙线只用时间特征（几乎是平的），蓝线完整特征（紧跟真实值）。"},{"title":"周期编码圆","type":"图","route":"#figures","text":"23 点和 0 点在圆上相邻，这就是 sin/cos 编码想表达的事情。"},{"title":"相关性热力图","type":"图","route":"#figures","text":"和下一小时 PM2.5 的线性相关。相关不等于因果，只能作为第一眼参考。"},{"title":"项目文件（读取文件夹）","type":"工具","route":"#files","text":"浏览项目文件夹里的文件，教程、代码、笔记、表格、图片都能直接打开；可重新读取刷新。"},{"title":"docs/00-先读我-导师要求翻译.md","type":"文件","route":"#file-docs%2F00-%E5%85%88%E8%AF%BB%E6%88%91-%E5%AF%BC%E5%B8%88%E8%A6%81%E6%B1%82%E7%BF%BB%E8%AF%91.md","text":"docs/00-先读我-导师要求翻译.md 00-先读我-导师要求翻译.md"},{"title":"docs/01-环境与工具.md","type":"文件","route":"#file-docs%2F01-%E7%8E%AF%E5%A2%83%E4%B8%8E%E5%B7%A5%E5%85%B7.md","text":"docs/01-环境与工具.md 01-环境与工具.md"},{"title":"docs/02-Python零基础.md","type":"文件","route":"#file-docs%2F02-Python%E9%9B%B6%E5%9F%BA%E7%A1%80.md","text":"docs/02-Python零基础.md 02-Python零基础.md"},{"title":"docs/03-pandas与SQLite.md","type":"文件","route":"#file-docs%2F03-pandas%E4%B8%8ESQLite.md","text":"docs/03-pandas与SQLite.md 03-pandas与SQLite.md"},{"title":"docs/04-时序特征工程核心.md","type":"文件","route":"#file-docs%2F04-%E6%97%B6%E5%BA%8F%E7%89%B9%E5%BE%81%E5%B7%A5%E7%A8%8B%E6%A0%B8%E5%BF%83.md","text":"docs/04-时序特征工程核心.md 04-时序特征工程核心.md"},{"title":"docs/05-建模与实验.md","type":"文件","route":"#file-docs%2F05-%E5%BB%BA%E6%A8%A1%E4%B8%8E%E5%AE%9E%E9%AA%8C.md","text":"docs/05-建模与实验.md 05-建模与实验.md"},{"title":"docs/06-画图与Kaggle.md","type":"文件","route":"#file-docs%2F06-%E7%94%BB%E5%9B%BE%E4%B8%8EKaggle.md","text":"docs/06-画图与Kaggle.md 06-画图与Kaggle.md"},{"title":"docs/07-交作业清单与报告模板.md","type":"文件","route":"#file-docs%2F07-%E4%BA%A4%E4%BD%9C%E4%B8%9A%E6%B8%85%E5%8D%95%E4%B8%8E%E6%8A%A5%E5%91%8A%E6%A8%A1%E6%9D%BF.md","text":"docs/07-交作业清单与报告模板.md 07-交作业清单与报告模板.md"},{"title":"docs/08-知识点与代码速查.md","type":"文件","route":"#file-docs%2F08-%E7%9F%A5%E8%AF%86%E7%82%B9%E4%B8%8E%E4%BB%A3%E7%A0%81%E9%80%9F%E6%9F%A5.md","text":"docs/08-知识点与代码速查.md 08-知识点与代码速查.md"},{"title":"docs/99-报错急救.md","type":"文件","route":"#file-docs%2F99-%E6%8A%A5%E9%94%99%E6%80%A5%E6%95%91.md","text":"docs/99-报错急救.md 99-报错急救.md"},{"title":"guide/app.js","type":"文件","route":"#file-guide%2Fapp.js","text":"guide/app.js app.js"},{"title":"guide/build_guide.py","type":"文件","route":"#file-guide%2Fbuil 左边选文件、右边看代码或图片，改完文件点“重新读取”就能看到最新的。\n\n打开方式（二选一）：\n\n```powershell\n# 方式一：直接双击 guide\\index.html（最简单，离线可看）\n\n# 方式二（推荐）：启一个本地网页服务，图片和表格加载最稳\npowershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1\n# 浏览器会自动打开 http://127.0.0.1:8765/guide/index.html\n# 如果提示端口被占用：powershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1 -Port 8899\n```\n\n两种打开方式的能力不一样：\n\n| 打开方式 | 能看教程/图片/表格 | 能读取项目文件夹 |\n| --- | --- | --- |\n| 双击 `guide\\index.html` | 能 | 不能（浏览器安全限制） |\n| 运行 `start-server.ps1` | 能 | 能 |\n\n启动服务后会**自动用你电脑上的默认浏览器（Chrome / Edge 等）打开**页面；也可以自己把地址粘到浏览器里：\n\n```text\nhttp://127.0.0.1:8765/guide/index.html\n```\n\n嫌上面命令太长，也可以直接运行：\n\n```powershell\npython guide\\server.py\n```\n\n在“项目文件”页里还有一个“选择其他文件夹”按钮，可以在 Chrome / Edge 里临时读取你电脑上任意一个文件夹（不写入、不上传）。\n\n服务只允许本机访问（127.0.0.1），并且只能读到本项目文件夹里的内容。\n\n网页是本地生成的，不联网也能看。改动教程文档或脚本后，重新生成一次即可：\n\n```powershell\npython guide\\build_guide.py\n```\n\n---\n\n## 知识点与代码速查手册（可打印）\n\n项目里的知识点和代码全部集中在一份手册里：每段代码下面都有“作用”说明，按章节排好，打印出来可以直接放在手边查。\n\n- Markdown 版：`docs/08-知识点与代码速查.md`\n- PDF 版（推荐打印）：`outputs/知识点与代码速查.pdf`\n- 网页版：打开学习指引，点左边「知识点速查手册」\n\n重新生成（不需要额外装软件，用本机的 Chrome / Edge 打印）：\n\n```powershell\npython guide\\build_handbook.py            # 同时生成 HTML 和 PDF\npython guide\\build_handbook.py --no-pdf   # 只生成 HTML\n```\n\n打印建议：A4 纸、缩放 100%。PDF 一共二十多页，每章从新的一页开始，可以用双面打印。\n\n默认是紧凑排版，约 14 页；章节之间不强制换页，打印更省纸。如果确实需要每章另起一页，可以加参数：\n\n```powershell\npython guide\\build_handbook.py --page-break-chapters\n```\n\n---\n\n---\n\n## 分享给同学：一键打包离线网页\n\n如果想把教程网页发给同学，不需要对方安装 Python，也不需要启动本地服务。运行下面的命令，会生成一个可以直接分享的 zip：\n\n```powershell\n# 先激活项目虚拟环境，再执行\npython guide\\build_share_zip.py\n```\n\n生成结果在 `dist/时序特征工程学习指引-离线版.zip`（约 3 MB）。对方解压后双击里面的 `index.html`，就能离线看教程、代码、图表、表格和速查 PDF。\n\n- `--no-rebuild`：不重新生成教程和 PDF，直接打包当前版本；\n- `--no-zip`：只生成文件夹，不生成压缩包。\n\n离线包不包含 `data/` 里的原始数据和处理后数据，所以体积比较小，适合分享阅读。\n\n## 1. 导师要求 → 本项目对应位置（最重要的一张表）\n\n| 导师要求 | 你要做的事 | 在本项目里看哪里 | 你会得到什么 |\n| --- | --- | --- | --- |\n| 1.1 Git 和 GitHub | 把代码传到 GitHub | `docs/01-环境与工具.md` 的 Git 部分 | 一个能打开的代码仓库 |\n| 1.2 Markdown | 用 Markdown 写笔记 | `notes/学习笔记模板.md` | 特征笔记 + 实验记录 |\n| 1.3 Python | 数组、列表、字典、文件、pandas、SQLite | `scripts/01`、`02`、`03` | 能看懂基础代码 |\n| 2.1 找数据集 | 带时间戳的 CSV | `scripts/download_data.py` | 北京 PM2.5 数据（UTC 每小时） |\n| 2.2 基础处理 | 解析时间、排序、检查缺失 | `scripts/04_load_clean.py` | `pm25_clean.csv` |\n| 2.3 拆时间特征 | 年、月、日、星期、小时、是否周末 | `scripts/05_time_features.py` | 时间特征 + 特征字典 |\n| 2.4 基线模型 | 用线性回归跑通 | `scripts/06_baseline_model.py` | 第一组 MAE/RMSE/R² |\n| 2.5 周期编码 | 小时/星期做 sin/cos | `scripts/07_cyclic_encoding.py` | 前后对比结果 |\n| 3.1 滞后和滑动 | `shift()` 和 `rolling()` | `scripts/08_lag_rolling_features.py` | 滞后/滑窗特征 |\n| 3.1 防未来数据 | 理解数据泄漏 | `scripts/09_model_comparison.py` | 正确 vs 错误对照 |\n| 3.2 对比效果 | 记录哪些特征有用 | `scripts/09` + `notes/实验记录模板.md` | 消融实验表 |\n| 3.3 画图观察 | 原始/滑均/差分序列 | `scripts/10_plots.py` | 6 张中文图 |\n| 3.4 Kaggle 练手 | 看别人的特征工程思路 | `docs/06-画图与Kaggle.md` | 复现计划 |\n\n---\n\n## 2. 第 0 步：把项目跑起来（Windows，约 5 分钟）\n\n### 2.1 打开 PowerShell，进入项目文件夹\n\n在文件夹窗口的地址栏输入 `powershell` 并回车，或者在 VS Code 里按 `Ctrl + 反引号` 打开终端。\n\n确认你在这个文件夹：\n\n```powershell\nGet-Location\n```\n\n应该看到以 `time-series-feature-engineering` 结尾的路径。\n\n### 2.2 创建虚拟环境\n\n虚拟环境就是\"只属于这个项目的工具箱\"，不会污染电脑里的其他 Python 项目。\n\n```powershell\npython -m venv .venv\n```\n\n### 2.3 激活虚拟环境\n\n```powershell\n.\\.venv\\Scripts\\Activate.ps1\n```\n\n成功后，命令行前面会出现 `(.venv)`。\n\n如果报\"禁止运行脚本\"，先执行下面这行，再重新激活：\n\n```powershell\nSet-ExecutionPolicy -Scope Process Bypass\n```\n\n### 2.4 安装依赖\n\n```powershell\npip install -r requirements.txt\n```\n\n### 2.5 一键跑完全部课程\n\n```powershell\n.\\run_all.ps1\n```\n\n看到\"全部脚本运行完成\"就成功了。图片在 `outputs/figures/`，表格在 `outputs/tables/`，\n网页指引也会自动重新生成到 `guide/index.html`。\n\n> 不想一键跑，也可以按顺序一条条运行：\n> ```powershell\n> python scripts\\download_data.py\n> python scripts\\01_python_basics.py\n> python scripts\\02_pandas_basics.py\n> python scripts\\03_sqlite_basics.py\n> python scripts\\04_load_clean.py\n> python scripts\\05_time_features.py\n> python scripts\\06_baseline_model.py\n> python scripts\\07_cyclic_encoding.py\n> python scripts\\08_lag_rolling_features.py\n> python scripts\\09_model_comparison.py\n> python scripts\\10_plots.py\n> ```\n\n---\n\n## 3. 目录说明\n\n```text\ntime-series-feature-engineering/\n├─ README.md                     ← 你正在看的文件\n├─ requirements.txt              ← 需要安装的 Python 库\n├─ run_all.ps1                   ← 一键运行全部脚本\n├─ docs/                         ← 分步教学文档\n│  ├─ 00-先读我-导师要求翻译.md\n│  ├─ 01-环境与工具.md\n│  ├─ 02-Python零基础.md\n│  ├─ 03-pandas与SQLite.md\n│  ├─ 04-时序特征工程核心.md\n│  ├─ 05-建模与实验.md\n│  ├─ 06-画图与Kaggle.md\n│  ├─ 07-交作业清单与报告模板.md\n│  ├─ 08-知识点与代码速查.md\n│  └─ 99-报错急救.md\n├─ scripts/                      ← 按顺序运行的代码\n├─ notes/                        ← 你要填的笔记模板\n├─ guide/                        ← 网页版学习指引（index.html + 启动脚本）\n├─ data/\n│  ├─ raw/                       ← 原始数据（download_data.py 下载）\n│  └─ processed/                 ← 清洗、特征工程后的数据\n└─ outputs/\n   ├─ 知识点与代码速查.pdf        ← 可打印的知识点手册\n   ├─ figures/                   ← 6 张图\n   └─ tables/                    ← 实验表格、预测结果、清洗报告\n```\n\n---\n\n## 4. 建议的 7 天学习计划（每天 1–2 小时）\n\n| 天数 | 学什么 | 做什么 | 当天检查点 |\n| --- | --- | --- | --- |\n| 第 1 天 | Git、Markdown、环境 | 跑通 `run_all.ps1`，建 GitHub 仓库 | 能在 GitHub 看到代码 |\n| 第 2 天 | Python 基础 | 跑 `01`–`03`，改几个数字再跑 | 能解释 list/dict/deque |\n| 第 3 天 | pandas 基础 | 跑 `02`，在笔记里写 5 个常用操作 | 能自己读一个 CSV |\n| 第 4 天 | 数据清洗 + 时间特征 | 跑 `04`、`05`，看特征字典 | 能解释 UTC 和 is_weekend |\n| 第 5 天 | 基线 + 周期编码 | 跑 `06`、`07`，把结果抄进实验记录 | 能解释 MAE/R² |\n| 第 6 天 | 滞后、滑窗、防泄漏 | 跑 `08`、`09`，重点看错误示范 | 能说出 3 种数据泄漏 |\n| 第 7 天 | 画图 + Kaggle + 总结 | 跑 `10`，挑 1 个 Kaggle 比赛看 3 篇 notebook | 交出一页实验总结 |\n\n---\n\n## 5. 这个项目里已经为你准备好的\"成品\"\n\n- 真实数据：UCI 北京 PM2.5，43824 小时，UTC 时区；\n- 完整代码：从 Python 基础到特征对照实验；\n- 中文注释：每一段代码都在解释\"为什么\"；\n- 6 张中文图：原始序列、滑均/差分、周期性、预测对比、周期编码圆、相关性热力图；\n- 实验表格：模型对比、消融实验、特征系数；\n- 笔记模板：按特征逐条填写，最后能直接交给导师。\n\n---\n\n## 6. 学习时不要做的事\n\n- 不要一上来就推公式。先看输出，再理解公式。\n- 不要复制完就跑、不看终端输出。输出里每句话都是给你看的。\n- 不要用随机切分时间序列。时序数据必须按时间切。\n- 不要只看 R²。还要看 MAE、RMSE 和预测曲线。\n- 不要把 `_leaky` 结尾的特征放进正式模型。\n- 不要因为周期编码没有大幅提升就认为它没用——要看实验条件。\n\n---\n\n## 7. 最终要交给导师的材料\n\n1. GitHub 仓库链接；\n2. 本项目的 README（说明怎么运行）；\n3. 填好的 `notes/学习笔记模板.md`；\n4. 填好的 `notes/实验记录模板.md`；\n5. `outputs/figures/` 里的 6 张图；\n6. 一页总结：做了什么、哪个特征有用、哪个没用、为什么、下一步做什么。\n\n报告怎么写，看 `docs/07-交作业清单与报告模板.md`。\n\n---\n\n## 8. 常用命令速查\n\n```powershell\n# 进入项目\ncd E:\\develop\\codex\\github\\time-series-feature-engineering\n\n# 激活虚拟环境\n.\\.venv\\Scripts\\Activate.ps1\n\n# 运行某个脚本\npython scripts\\05_time_features.py\n\n# 一键运行\n.\\run_all.ps1\n\n# 查看当前状态\ngit status\n\n# 保存一次修改\ngit add .\ngit commit -m \"完成时间特征提取\"\n\n# 第一次连接 GitHub（把网址换成你自己的）\ngit remote add origin https://github.com/你的用户名/仓库名.git\ngit push -u origin main\n```\n\n---\n\n## 9. 遇到报错怎么办\n\n先不要删代码、不要重装 Python。\n\n1. 把终端里**最后 10 行**完整看一遍；\n2. 找到 `Error` 或 `Traceback` 那一行；\n3. 打开 `docs/99-报错急救.md` 对照；\n4. 还是不会，把\"你运行了什么命令 + 完整报错 + 已经试过什么\"发给同学或导师。\n\n---\n\n> 下一步：打开 `docs/00-先读我-导师要求翻译.md`，先把导师的话翻译成人话。\n"},"docs/00-先读我-导师要求翻译.md":{"path":"docs/00-先读我-导师要求翻译.md","name":"00-先读我-导师要求翻译.md","size":9203,"mtime":"2026-10-08 21:14","ext":".md","kind":"text","href":"docs/00-%E5%85%88%E8%AF%BB%E6%88%91-%E5%AF%BC%E5%B8%88%E8%A6%81%E6%B1%82%E7%BF%BB%E8%AF%91.md","text":"# 00 先读我：把导师的要求翻译成人话\n\n## 1. 一句话看懂你的任务\n\n导师给了你一份\"时序数据集\"，让你做**特征工程**。\n\n说白了就是：\n\n> 原始数据里只有一列时间，模型看不懂\"2010-01-01 08:00\"这种东西。\n> 你要把它拆成\"年=2010、月=1、日=1、小时=8、星期几、是不是周末\"等数字，\n> 再告诉模型\"过去几小时发生了什么\"（滞后、滑动窗口），\n> 最后用实验证明：加了这些特征以后，预测有没有变好。\n\n---\n\n## 2. 导师每一条要求，翻译成\"我要做什么\"\n\n### 1.1 Git 和 GitHub（上传代码）\n\n**人话**：把代码放到网上，让导师能看到你做了什么、改了什么。\n\n**你要做**：\n\n1. 在 GitHub 建一个仓库（repository）；\n2. 在项目文件夹执行 `git init`；\n3. 每次写完一部分就 `git add .` + `git commit -m \"说明\"`；\n4. 最后 `git push` 到 GitHub。\n\n**怎么算完成**：把仓库链接发给导师，链接能打开，里面有代码和 README。\n\n细节看 `01-环境与工具.md` 的 Git 部分。\n\n---\n\n### 1.2 Markdown（写笔记）\n\n**人话**：用简单的符号写带格式的笔记，GitHub 会自动把它显示得很漂亮。\n\n**你要做**：把每个特征的\"怎么构造、什么意思、实验效果\"记下来。\n\n**怎么算完成**：`notes/学习笔记模板.md` 里每个特征都有记录，至少写 5 个。\n\n例子：\n\n```markdown\n## hour_sin / hour_cos（小时周期编码）\n\n- 怎么构造：`sin(2*pi*hour/24)` 和 `cos(2*pi*hour/24)`\n- 什么意思：把 0–23 点放到一个圆上，23 点和 0 点变成邻居\n- 实验效果：第 7 课对比，R² 从 ____ 变成 ____\n- 结论：有用 / 作用不明显，因为 ____\n```\n\n---\n\n### 1.3 Python（实现功能）\n\n**人话**：用 Python 完成上面这些事情。导师列的是基础中的基础。\n\n**你要会**：\n\n| 东西 | 一句话解释 | 本教程哪里学 |\n| --- | --- | --- |\n| list 列表 | 一排有顺序的数据 | `scripts/01` |\n| dict 字典 | 用名字找值 | `scripts/01` |\n| deque 队列 | 只保留最近 N 个数，滑窗的基础 | `scripts/01` |\n| 函数 def | 把一段代码打包反复用 | `scripts/01` |\n| 文件读写 | 把结果存下来 | `scripts/01` |\n| pandas | 用代码操作 Excel 表格 | `scripts/02` |\n| SQL 增删改查 | 数据库的基本操作 | `scripts/03` |\n| 主键 | 每行数据的唯一身份证 | `scripts/03` |\n| 索引 | 像书的目录，查得更快 | `scripts/03` |\n| SQLite | Python 自带的轻量数据库 | `scripts/03` |\n\n**怎么算完成**：能跑通 01–03，并且能自己改一个数字，说出结果哪里变了。\n\n---\n\n### 2.1 找一份带时间戳的数据集\n\n**人话**：CSV 里要有一列时间，而且每一行是一个时间点的记录。\n\n**本项目已经帮你找好了**：UCI 北京 PM2.5 数据。\n\n- 2010-01-01 到 2014-12-31；\n- 每小时一条，共 43824 条；\n- 时间戳是 UTC；\n- 目标列是 `pm2.5`（空气污染浓度）。\n\n**怎么算完成**：运行 `python scripts\\download_data.py`，看到前 5 行数据。\n\n---\n\n### 2.2 用 pandas 读进内存，解析时间、排序、检查缺失\n\n**人话**：\n\n1. 读 CSV；\n2. 把\"年/月/日/小时\"拼成真正的时间；\n3. 按时间从小到大排序；\n4. 看每一列缺了多少值，决定怎么处理。\n\n**你要做**：运行 `python scripts\\04_load_clean.py`。\n\n**怎么算完成**：能回答：\n\n- 这份数据一共多少小时？\n- 时间戳有没有重复？\n- `pm2.5` 缺了多少？\n- 为什么不能直接删掉缺失行？\n\n答案都在脚本输出和 `outputs/tables/04_cleaning_report.txt` 里。\n\n---\n\n### 2.3 从时间戳里拆出年、月、日、星期、小时、是否周末\n\n**人话**：模型只认数字，所以你要把时间\"翻译\"成数字。\n\n**你要做**：运行 `python scripts\\05_time_features.py`。\n\n**怎么算完成**：知道这些列分别是什么：\n\n- `year`、`month`、`day`、`hour`\n- `dayofweek`（0=周一，6=周日）\n- `is_weekend`（1=周末，0=工作日）\n- `hour_sin` / `hour_cos`（后面 2.5 才讲）\n\n---\n\n### 2.4 选一个目标，用线性回归跑基线\n\n**人话**：先跑一个最笨的模型，作为以后对比的\"地板\"。\n\n**本项目选的目标**：站在时间 t，用现在知道的信息，预测 t+1 时刻的 PM2.5。\n\n**你要做**：运行 `python scripts\\06_baseline_model.py`。\n\n**怎么算完成**：能说出：\n\n- 训练集是前 80%，测试集是后 20%；\n- 为什么不能随机切分；\n- MAE、RMSE、R² 分别是什么意思。\n\n---\n\n### 2.5 对小时、星期做正弦/余弦编码，观察效果变化\n\n**人话**：直接给模型 `hour=23` 和 `hour=0`，它会觉得这两个数差得很远；\n但现实中它们是挨着的。sin/cos 把时间放到一个圆上，让 23 点和 0 点变近。\n\n**你要做**：运行 `python scripts\\07_cyclic_encoding.py`，对比两行结果。\n\n**怎么算完成**：能写出：\"在这个数据上，原始数字时间的 MAE = ____，周期编码的 MAE = ____，R² = ____。\"\n\n> 注意：不一定周期编码一定大幅更好。实验结论要写\"在这个数据、这个模型、这段测试期上怎么样\"，不要写\"sin/cos 永远更好\"。\n\n---\n\n### 3.1 做滞后和滑动窗口，体会不能混入未来数据\n\n**人话**：\n\n- 滞后（lag）：把过去的值挪到当前行，例如 `lag1` 是上一小时的值；\n- 滑动窗口（rolling）：算过去 24 小时的平均值、标准差、最大值；\n- 预测 t+1 时，只能用 t 及更早的数据，不能用 t+1 的数据。\n\n**你要做**：运行 `python scripts\\08_lag_rolling_features.py`。\n\n**怎么算完成**：能指着表说出：对每一行，`lag1` 是哪个时刻、`roll24_mean` 用了哪些时刻、`pm25_next` 是哪个时刻。\n\n---\n\n### 3.2 加入滞后、滑动窗口，对比效果，记录哪些有用\n\n**人话**：做对照实验。一次只改一组特征，其他条件不变。\n\n**你要做**：运行 `python scripts\\09_model_comparison.py`。\n\n**怎么算完成**：把 `outputs/tables/09_model_comparison.csv` 的数字抄进 `notes/实验记录模板.md`，并写出 3 条结论。\n\n---\n\n### 3.3 画图观察特征\n\n**人话**：图比数字直观。看趋势、周期、异常点。\n\n**你要做**：运行 `python scripts\\10_plots.py`。\n\n**怎么算完成**：每张图下面写 2–3 句话：\n\n1. 我看到了什么现象？\n2. 这个现象说明哪个特征可能有用？\n3. 实验里它到底有没有用？\n\n---\n\n### 3.4 用 Kaggle 入门赛练手\n\n**人话**：找别人写过的时间序列入门赛，看他们怎么做特征，然后自己复现一遍。\n\n**你要做**：看 `06-画图与Kaggle.md`，选一个 Playground 比赛，读 3 篇公开 notebook，\n把\"他们用了哪些特征、为什么\"抄进笔记。\n\n**怎么算完成**：能提交一次结果，并在笔记里写出\"我复现了哪个特征、效果如何\"。\n\n---\n\n## 3. 名词速查（先混个眼熟）\n\n| 名词 | 一句话解释 | 例子 |\n| --- | --- | --- |\n| 时序数据 | 带时间戳、按时间排序的记录 | 每小时一条 PM2.5 |\n| 时间戳 | 记录发生的具体时间 | 2014-01-01 08:00 |\n| UTC | 世界统一时间，避免时区混乱 | 北京时间 = UTC+8 |\n| 特征 | 喂给模型的输入列 | hour、is_weekend |\n| 特征工程 | 从原始数据造出更有用的特征 | 把时间拆成小时和星期 |\n| 周期 | 每隔一段时间重复出现的规律 | 一天、一周、一年 |\n| 滞后 lag | 过去某个时刻的值 | `pm2.5.shift(1)` |\n| 滑动窗口 rolling | 过去 N 个值的统计量 | 过去 24 小时平均 |\n| 差分 diff | 当前值减上一个值 | 今天比昨天高多少 |\n| 基线模型 | 最笨但必须有的对比模型 | 永远猜平均值 |\n| 训练集 | 用来学习的旧数据 | 前 80% |\n| 测试集 | 用来考试的新数据 | 后 20% |\n| 数据泄漏 | 不小心把答案或未来信息喂给模型 | 用 t+1 的值预测 t+1 |\n| MAE | 平均差多少，越小越好 | 10 表示平均差 10 |\n| RMSE | 更重罚大错误的指标 | 也是越小越好 |\n| R² | 拟合好不好的指标，1 最好 | 0 约等于只会猜平均 |\n\n---\n\n## 4. 整个项目的数据流\n\n```text\n原始 CSV\n  ↓ download_data.py\n带 year/month/day/hour 的原始表\n  ↓ 04_load_clean.py：拼 UTC 时间、排序、检查缺失\n干净的小时级数据（完整时间轴）\n  ↓ 05_time_features.py：拆年/月/日/星期/小时/是否周末 + sin/cos\n带时间特征的表\n  ↓ 08_lag_rolling_features.py：shift + rolling + 目标 y\n完整建模数据\n  ↓ 09_model_comparison.py：按时间切分、训练线性回归、对比\n实验表格 + 预测值\n  ↓ 10_plots.py\n6 张图\n```\n\n---\n\n## 5. 现在就开始：你的第一个 30 分钟\n\n1. 打开 README 的\"第 0 步\"，把项目跑起来；\n2. 看到 `run_all.ps1` 输出\"全部脚本运行完成\"；\n3. 打开 `outputs/figures/`，把 6 张图从前到后看一遍；\n4. 在 `notes/学习笔记模板.md` 里写下你最好奇的一个问题；\n5. 明天再回来，从 `01-环境与工具.md` 开始逐课学。\n\n> 记住：这个阶段的目标不是\"全懂\"，而是\"能跑通 + 能说出每个东西大概在干什么\"。\n"},"docs/01-环境与工具.md":{"path":"docs/01-环境与工具.md","name":"01-环境与工具.md","size":6760,"mtime":"2026-10-08 21:15","ext":".md","kind":"text","href":"docs/01-%E7%8E%AF%E5%A2%83%E4%B8%8E%E5%B7%A5%E5%85%B7.md","text":"# 01 环境与工具：Python、Git、GitHub、Markdown\n\n这一课的目标：让你的电脑能跑 Python，让你会保存代码、上传代码、写笔记。\n\n---\n\n## 1. PowerShell 最少必要命令\n\nWindows 里搜索 \"PowerShell\"，打开。下面 6 个命令够你用很久：\n\n| 命令 | 作用 | 例子 |\n| --- | --- | --- |\n| `Get-Location` | 我现在在哪个文件夹 | `Get-Location` |\n| `cd 路径` | 进入某个文件夹 | `cd E:\\develop\\codex\\github` |\n| `dir` 或 `ls` | 看文件夹里有什么 | `dir` |\n| `python --version` | 看 Python 版本 | `python --version` |\n| `python 文件.py` | 运行一个 Python 脚本 | `python scripts\\05_time_features.py` |\n| `git status` | 看 Git 现在是什么状态 | `git status` |\n\n小技巧：在文件资源管理器的地址栏直接输入 `powershell` 再回车，就会在当前文件夹打开 PowerShell。\n\n---\n\n## 2. 虚拟环境：为什么每个人都要建 `.venv`\n\n假设你以后做了 10 个项目：\n\n- 项目 A 需要 pandas 2.0；\n- 项目 B 需要 pandas 3.0。\n\n如果所有库都装在电脑全局，就会打架。虚拟环境就是给每个项目一个独立的工具箱。\n\n### 创建\n\n```powershell\npython -m venv .venv\n```\n\n### 激活\n\n```powershell\n.\\.venv\\Scripts\\Activate.ps1\n```\n\n成功后命令行前面会有 `(.venv)`。\n\n### 常见问题：禁止运行脚本\n\n报错类似：\n\n```text\n无法加载文件 ... Activate.ps1，因为在此系统上禁止运行脚本\n```\n\n解决：\n\n```powershell\nSet-ExecutionPolicy -Scope Process Bypass\n.\\.venv\\Scripts\\Activate.ps1\n```\n\n`-Scope Process` 表示只对当前这个终端窗口生效，关掉就恢复，安全。\n\n### 安装依赖\n\n```powershell\npip install -r requirements.txt\n```\n\n如果下载很慢，可以换国内镜像（任选一个）：\n\n```powershell\npip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple\n```\n\n---\n\n## 3. 建议用 VS Code 写代码\n\n1. 下载安装 VS Code（免费）；\n2. 用 VS Code 打开本项目文件夹：`File -> Open Folder`；\n3. 安装 Python 扩展（左侧扩展图标搜索 Python）；\n4. 按 `Ctrl + Shift + P`，输入 `Python: Select Interpreter`，选择 `.venv\\Scripts\\python.exe`；\n5. 按 `Ctrl + 反引号` 打开终端，就能直接运行脚本。\n\nVS Code 只是编辑器，不是必须的。但你迟早要用它看代码、改代码。\n\n---\n\n## 4. 运行本项目\n\n### 方式一：一键运行\n\n```powershell\n.\\run_all.ps1\n```\n\n### 方式二：一个脚本一个脚本运行（推荐学习用）\n\n```powershell\npython scripts\\01_python_basics.py\npython scripts\\02_pandas_basics.py\npython scripts\\03_sqlite_basics.py\npython scripts\\04_load_clean.py\npython scripts\\05_time_features.py\npython scripts\\06_baseline_model.py\npython scripts\\07_cyclic_encoding.py\npython scripts\\08_lag_rolling_features.py\npython scripts\\09_model_comparison.py\npython scripts\\10_plots.py\n```\n\n### 中文乱码怎么办\n\n先执行：\n\n```powershell\nchcp 65001\n[Console]::OutputEncoding = [System.Text.Encoding]::UTF8\n$env:PYTHONIOENCODING = \"utf-8\"\n```\n\n然后再运行脚本。`run_all.ps1` 里已经自动设置好了。\n\n---\n\n## 5. Git：先把\"保存\"这件事学会\n\nGit 就像游戏存档：每完成一小步，就存一个档。GitHub 是云端的存档仓库。\n\n### 5.1 第一次配置身份\n\n```powershell\ngit config --global user.name \"你的名字\"\ngit config --global user.email \"你的邮箱\"\n```\n\n### 5.2 在本项目里初始化 Git\n\n```powershell\ncd E:\\develop\\codex\\github\\time-series-feature-engineering\ngit init\ngit status\n```\n\n### 5.3 日常最常用的 4 条命令\n\n```powershell\n# 1. 看现在改了哪些文件\ngit status\n\n# 2. 把所有修改放进\"待保存\"\ngit add .\n\n# 3. 存一个档（引号里写这次做了什么）\ngit commit -m \"完成时间特征提取\"\n\n# 4. 看历史记录\ngit log --oneline\n```\n\n提交信息建议：\n\n- `完成数据下载脚本`\n- `跑通 pandas 基础练习`\n- `添加小时和星期特征`\n- `完成模型对比实验`\n- `画了 6 张特征观察图`\n\n### 5.4 创建 GitHub 仓库并上传\n\n1. 打开 <https://github.com>，注册/登录；\n2. 点右上角 `+` → `New repository`；\n3. 仓库名建议：`time-series-feature-engineering`；\n4. 选择 Public（公开）或 Private（私有，需要给导师加权限）；\n5. **不要**勾选 \"Add a README file\"（我们本地已经有了）；\n6. 创建后，GitHub 会给你一个仓库地址，类似：\n\n```text\nhttps://github.com/你的用户名/time-series-feature-engineering.git\n```\n\n在本地执行：\n\n```powershell\ngit branch -M main\ngit remote add origin https://github.com/你的用户名/time-series-feature-engineering.git\ngit push -u origin main\n```\n\n第一次 push 可能需要登录。GitHub 现在不能用账号密码，需要用 Personal Access Token（PAT）：\n\n1. GitHub 右上角头像 → `Settings`；\n2. 左侧最下 `Developer settings`；\n3. `Personal access tokens` → `Tokens (classic)` → `Generate new token`；\n4. 勾选 `repo`；\n5. 生成后复制 token（只显示一次）；\n6. push 时用户名填 GitHub 用户名，密码位置粘贴 token。\n\n### 5.5 每次写完代码的完整流程\n\n```powershell\ngit status\ngit add .\ngit commit -m \"这次完成了什么\"\ngit push\n```\n\n### 5.6 进阶一点：分支\n\n```powershell\n# 新建并切换到一个分支\ngit switch -c add-lag-features\n\n# 在分支上改代码、提交\ngit add .\ngit commit -m \"添加滞后特征\"\n\n# 推送到 GitHub\ngit push -u origin add-lag-features\n```\n\n然后去 GitHub 网页上开 Pull Request（PR），自己 review 一下，再合并到 main。\n这一步很加分，因为它说明你会团队协作的基本流程。\n\n> 更完整的 Git/GitHub 教程：你之前已经有 `github-start-guide` 项目，可以直接对照看。\n\n---\n\n## 6. Markdown：30 秒学会写笔记\n\nMarkdown 就是\"用几个符号表示格式\"。\n\n| 你写的 | 显示效果 |\n| --- | --- |\n| `# 一级标题` | 大标题 |\n| `## 二级标题` | 中标题 |\n| `- 一句话` | 无序列表 |\n| `1. 第一步` | 有序列表 |\n| `**加粗**` | **加粗** |\n| `` `代码` `` | 行内代码 |\n| ```` ```python ```` | 代码块 |\n| `![图](路径)` | 插入图片 |\n| `[链接](网址)` | 插入链接 |\n\n本项目里已经准备好了两个模板：\n\n- `notes/学习笔记模板.md`：每个特征一张表；\n- `notes/实验记录模板.md`：每次实验一组数据。\n\n---\n\n## 7. 本课检查点\n\n- [ ] 我能创建并激活虚拟环境；\n- [ ] 我能运行一个脚本并看懂终端输出；\n- [ ] 我执行过 `git init`、`git add`、`git commit`；\n- [ ] 我把代码 push 到了 GitHub；\n- [ ] 我会用 Markdown 写标题、列表、代码块；\n- [ ] 我知道中文乱码时用 `chcp 65001`。\n\n有任何报错，先看 `99-报错急救.md`。\n"},"docs/02-Python零基础.md":{"path":"docs/02-Python零基础.md","name":"02-Python零基础.md","size":4663,"mtime":"2026-10-08 21:15","ext":".md","kind":"text","href":"docs/02-Python%E9%9B%B6%E5%9F%BA%E7%A1%80.md","text":"# 02 Python 零基础：只学够用的 20%\n\n你不需要先学完一整本 Python 书。做时序特征工程，先掌握下面这些就够了。\n\n对应脚本：`scripts/01_python_basics.py`。\n\n---\n\n## 1. 变量：给数据起名字\n\n```python\ntemperature = 22.5\ncity = \"南京\"\nis_weekend = False\n```\n\n- `temperature` 是名字；\n- `22.5`、`\"南京\"`、`False` 是值；\n- `=` 是\"把右边的值放进左边的名字\"，不是数学里的等于。\n\n---\n\n## 2. 列表 list：一排有顺序的数据\n\n```python\ntemperatures = [11.0, 12.5, 10.8, 9.6, 13.2]\n\nprint(temperatures[0])    # 11.0，Python 从 0 开始编号\nprint(temperatures[-1])   # 13.2，-1 表示最后一个\nprint(temperatures[:3])   # 前 3 个\n\ntemperatures.append(14.0) # 在末尾追加\nprint(max(temperatures))\nprint(sum(temperatures) / len(temperatures))\n```\n\n什么时候用：存一列数字。\n\n---\n\n## 3. 字典 dict：用名字找值\n\n```python\nrow = {\n    \"city\": \"南京\",\n    \"date\": \"2026-10-08\",\n    \"temperature\": 22.5,\n    \"is_weekend\": False,\n}\n\nprint(row[\"temperature\"])  # 22.5\nrow[\"weather\"] = \"多云\"     # 新增键\nrow[\"temperature\"] = 23.1  # 修改值\n```\n\n什么时候用：存\"一条记录\"，每个字段有名字。\n\n---\n\n## 4. 队列 deque：滑动窗口的思想原型\n\n```python\nfrom collections import deque\n\nwindow = deque(maxlen=3)\n\nfor value in [80, 75, 90, 120, 110]:\n    window.append(value)\n    print(list(window), sum(window) / len(window))\n```\n\n输出：\n\n```text\n[80] 80.0\n[80, 75] 77.5\n[80, 75, 90] 81.66666666666667\n[75, 90, 120] 95.0\n[90, 120, 110] 106.66666666666667\n```\n\n`maxlen=3` 表示窗口只能装 3 个：新的进来，最老的自动出去。\n\n这就是 `rolling(3).mean()` 的直觉：**只看最近 3 个，算平均**。\n\n---\n\n## 5. 函数 def：把代码打包\n\n```python\ndef c_to_f(celsius):\n    return celsius * 9 / 5 + 32\n\nprint(c_to_f(25))   # 77.0\n```\n\n- `def` 是定义函数；\n- 括号里是输入；\n- `return` 是输出。\n\n以后你会看到很多函数，例如：\n\n```python\ndef regression_metrics(y_true, y_pred):\n    ...\n    return {\"MAE\": ..., \"RMSE\": ..., \"R2\": ...}\n```\n\n不要怕，先看\"输入是什么、输出是什么\"。\n\n---\n\n## 6. 循环和条件：批量处理\n\n```python\nfor value in [35, 76, 120, 210]:\n    if value <= 50:\n        level = \"优\"\n    elif value <= 100:\n        level = \"良\"\n    elif value <= 150:\n        level = \"轻度污染\"\n    else:\n        level = \"中重度污染\"\n    print(value, level)\n```\n\nPython 用**缩进**表示\"谁属于谁\"。缩进乱了，程序就报错。\n\n---\n\n## 7. 文件读写：把结果存下来\n\n```python\nfrom pathlib import Path\n\npath = Path(\"outputs/tables/my_note.txt\")\npath.write_text(\"我今天学会了列表和字典。\\n\", encoding=\"utf-8\")\n\ncontent = path.read_text(encoding=\"utf-8\")\nprint(content)\n```\n\n时间序列数据通常也是这样：读一个 CSV 进来，处理完再写一个 CSV 出去。\n\n---\n\n## 8. 怎么读报错信息\n\nPython 报错看起来吓人，其实结构固定：\n\n```text\nTraceback (most recent call last):\n  File \"scripts/02_pandas_basics.py\", line 122, in <module>\n    main()\n  File \"scripts/02_pandas_basics.py\", line 121, in main\n    groupby_demo(df)\nTypeError: groupby_demo() takes 0 positional arguments but 1 was given\n```\n\n看三件事：\n\n1. **最后一行**：错误类型和原因（这里是参数多给了一个）；\n2. **文件名和行号**：`scripts/02_pandas_basics.py, line 122`；\n3. **箭头附近**：出错的那行代码。\n\n新手最常见的 4 个错误：\n\n| 报错 | 大概原因 | 怎么办 |\n| --- | --- | --- |\n| `IndentationError` | 缩进不对 | 检查空格，别混用 Tab 和空格 |\n| `NameError` | 用了没定义的变量 | 检查变量名拼写 |\n| `ModuleNotFoundError` | 没装库或没激活虚拟环境 | 激活 `.venv`，`pip install -r requirements.txt` |\n| `FileNotFoundError` | 文件路径不对 | 确认先运行了生成数据的上一个脚本 |\n\n---\n\n## 9. 动手练习\n\n在 `scripts/01_python_basics.py` 里改这几处，每改一次就运行一次：\n\n1. 把 `hourly_pm25` 的最后一个数改成 200，看平均值怎么变；\n2. 把 `deque(maxlen=3)` 改成 `maxlen=5`，看窗口怎么变；\n3. 在 `exercises()` 里加一个数字 `7`，看最大值和排序结果；\n4. 把文件里写的那句话改成你自己的名字。\n\n---\n\n## 10. 检查点\n\n- [ ] 我能解释 list 和 dict 的区别；\n- [ ] 我能说出 deque(maxlen=3) 在干什么；\n- [ ] 我能定义并调用一个函数；\n- [ ] 我知道报错要看最后一行、文件名、行号；\n- [ ] 我改过代码里的数字并成功重新运行。\n\n下一课：`03-pandas与SQLite.md`。\n"},"docs/03-pandas与SQLite.md":{"path":"docs/03-pandas与SQLite.md","name":"03-pandas与SQLite.md","size":6940,"mtime":"2026-10-08 21:15","ext":".md","kind":"text","href":"docs/03-pandas%E4%B8%8ESQLite.md","text":"# 03 pandas 与 SQLite：数据处理的两把常用工具\n\n对应脚本：\n\n- `scripts/02_pandas_basics.py`\n- `scripts/03_sqlite_basics.py`\n\n---\n\n## 第一部分：pandas\n\npandas 是 Python 里最常用的表格处理工具。你可以把它想成\"用代码操作的 Excel\"。\n\n### 1. 两个核心概念\n\n| 概念 | 是什么 | 类比 |\n| --- | --- | --- |\n| `Series` | 一列数据 | Excel 里的一列 |\n| `DataFrame` | 一张表，很多列 | 一整个 Excel 工作表 |\n\n### 2. 读 CSV\n\n```python\nimport pandas as pd\n\ndf = pd.read_csv(\"data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv\")\n```\n\n- `df` 是变量名，随便起，但大家习惯叫 `df`（DataFrame 的缩写）；\n- 路径可以用相对于项目根目录的路径；\n- 读进来之后，先用眼睛看，别急着建模。\n\n### 3. 看数据的 5 个动作\n\n```python\ndf.head()          # 前 5 行\ndf.shape           # (行数, 列数)\ndf.columns         # 列名\ndf.dtypes          # 每一列的类型\ndf.describe()      # 数值列的统计量\ndf.isna().sum()    # 每一列缺多少个值\n```\n\n**新手最容易犯的错**：拿到数据直接扔进模型。正确顺序是：先看，再洗，再用。\n\n### 4. 选列和筛选行\n\n```python\ndf[\"pm2.5\"]                       # 选一列（Series）\ndf[[\"pm2.5\", \"TEMP\"]]             # 选两列（DataFrame）\ndf[df[\"pm2.5\"] > 100]             # 只保留 pm2.5 大于 100 的行\ndf[(df[\"pm2.5\"] > 100) & (df[\"TEMP\"] < 0)]  # 两个条件\n```\n\n注意：多个条件要用 `&`（并且）、`|`（或者），每个条件要加括号。\n\n### 5. 造新列\n\n```python\ndf[\"is_weekend\"] = df[\"dayofweek\"] >= 5\ndf[\"temp_f\"] = df[\"TEMP\"] * 9 / 5 + 32\n```\n\n特征工程本质上就是不断造新列。\n\n### 6. 分组统计 groupby\n\n```python\ndf.groupby(\"hour\")[\"pm2.5\"].mean()       # 每个小时的平均 PM2.5\ndf.groupby(\"dayofweek\")[\"pm2.5\"].mean()  # 每个星期的平均 PM2.5\n```\n\n这是观察周期性的最快方法：如果每个小时的平均值不一样，说明小时可能有预测价值。\n\n### 7. 时间处理：字符串 → datetime → 拆特征\n\n```python\ndf[\"datetime\"] = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]])\ndf[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"UTC\")\n\ndf[\"year\"] = df[\"datetime\"].dt.year\ndf[\"month\"] = df[\"datetime\"].dt.month\ndf[\"day\"] = df[\"datetime\"].dt.day\ndf[\"hour\"] = df[\"datetime\"].dt.hour\ndf[\"dayofweek\"] = df[\"datetime\"].dt.dayofweek   # 0=周一\n```\n\n- `datetime` 是真正的时间类型，可以排序、相减、取年/月/日；\n- `tz_localize(\"UTC\")` 表示\"这个时间本来就是 UTC\"；\n- 如果原始时间是北京时间 `Asia/Shanghai`，要先用 `tz_localize(\"Asia/Shanghai\")`，再用 `tz_convert(\"UTC\")`。\n\n### 8. 时间索引和重采样\n\n```python\ndf = df.set_index(\"datetime\").sort_index()\n\ndaily = df[\"pm2.5\"].resample(\"D\").mean()   # 每天平均\nweekly = df[\"pm2.5\"].resample(\"W\").mean()  # 每周平均\n```\n\n- `resample(\"D\")`：按天分组；\n- `resample(\"W\")`：按周分组；\n- 这是画趋势图之前常用的操作。\n\n### 9. shift 和 rolling（先看一眼，下一课细讲）\n\n```python\ndf[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1)                 # 上一小时\ndf[\"pm25_roll24_mean\"] = df[\"pm2.5\"].rolling(24).mean() # 最近 24 小时平均\n```\n\n用之前一定先问自己：**这一行看到的数，在预测的时候真的拿得到吗？**\n\n### 10. pandas 动手练习\n\n在 `scripts/02_pandas_basics.py` 里改：\n\n1. 把筛选条件从 `rain_mm > 5` 改成 `rain_mm > 1`，看结果变化；\n2. 把 `groupby(\"city\")` 改成按别的列分组；\n3. 把 `df.head(100)` 改成 `df.head(500)`；\n4. 在真正的数据上，自己算一遍 `df[\"cbwd\"].value_counts()`，看风向有几种。\n\n---\n\n## 第二部分：SQLite\n\nSQLite 是 Python 自带的轻量数据库，零配置。你不需要装 MySQL。\n\n对应脚本：`scripts/03_sqlite_basics.py`。\n\n### 1. 为什么需要数据库\n\nCSV 适合\"读进来一次性分析\"；数据库适合\"很多次增删改查\"。\n\n比如你要做一个天气记录系统，每天新增记录、修改、删除、查询，用数据库更合适。\n\n### 2. 连接数据库\n\n```python\nimport sqlite3\n\nconn = sqlite3.connect(\"data/processed/practice.db\")\n```\n\n`connect` 时如果文件不存在，会自动创建。\n\n### 3. 建表 + 主键\n\n```python\nconn.execute(\"\"\"\nCREATE TABLE IF NOT EXISTS weather_notes (\n    id      INTEGER PRIMARY KEY,   -- 主键：唯一身份证，不能重复\n    city    TEXT    NOT NULL,\n    date    TEXT    NOT NULL,\n    temp    REAL,\n    note    TEXT\n)\n\"\"\")\nconn.commit()\n```\n\n**主键**：每一行的唯一编号。如果你插入两条 `id=1`，数据库会直接报错。这是好事，它帮你防止重复数据。\n\n### 4. 增：INSERT\n\n```python\nconn.execute(\n    \"INSERT INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\",\n    (1, \"Nanjing\", \"2026-10-01\", 28.0, \"sunny\"),\n)\nconn.commit()\n```\n\n`?` 是占位符，不要用字符串拼接，既安全又不容易出错。\n\n### 5. 查：SELECT\n\n```python\nrows = conn.execute(\"SELECT * FROM weather_notes WHERE city = ?\", (\"Nanjing\",)).fetchall()\nfor row in rows:\n    print(row)\n```\n\n常见查询：\n\n```sql\nSELECT * FROM weather_notes ORDER BY date;\nSELECT city, COUNT(*) FROM weather_notes GROUP BY city;\nSELECT AVG(temp) FROM weather_notes WHERE city = 'Nanjing';\n```\n\n### 6. 改：UPDATE\n\n```python\nconn.execute(\"UPDATE weather_notes SET temp = ? WHERE id = ?\", (29.5, 1))\nconn.commit()\n```\n\n**一定要写 WHERE**。不写的话，整张表都会被改掉。\n\n### 7. 删：DELETE\n\n```python\nconn.execute(\"DELETE FROM weather_notes WHERE id = ?\", (4,))\nconn.commit()\n```\n\n同样，**一定要写 WHERE**。\n\n### 8. 索引\n\n```python\nconn.execute(\"CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)\")\nconn.commit()\n```\n\n索引像书的目录：按 `city` 查询会更快，但会占一点空间，写入也会稍慢。\n不是越多越好，常用查询列才建。\n\n### 9. SQLite 和 pandas 怎么配合\n\n```python\ndf.to_sql(\"pm25\", conn, if_exists=\"replace\", index=False)  # DataFrame 存进数据库\ndf2 = pd.read_sql(\"SELECT * FROM pm25 WHERE pm2.5 > 100\", conn)  # 查出来变 DataFrame\n```\n\n先把数据放进数据库，再用 SQL 查询、用 pandas 分析，是实际工作中很常见的组合。\n\n### 10. SQLite 动手练习\n\n在 `scripts/03_sqlite_basics.py` 里：\n\n1. 增加一条你自己的记录；\n2. 查询 `temp` 大于 25 的行；\n3. 把某个城市的名字改掉；\n4. 删掉一条记录；\n5. 给 `date` 列也建一个索引。\n\n---\n\n## 检查点\n\n- [ ] 我能读一个 CSV 并打印 `shape`、列名、缺失值；\n- [ ] 我能筛选行、选列、造新列；\n- [ ] 我能用 `groupby` 求每小时平均；\n- [ ] 我能把时间字符串转成 datetime；\n- [ ] 我能说出主键和索引的作用；\n- [ ] 我能写出 INSERT、SELECT、UPDATE、DELETE 四条 SQL。\n\n下一课进入重点：`04-时序特征工程核心.md`。\n"},"docs/04-时序特征工程核心.md":{"path":"docs/04-时序特征工程核心.md","name":"04-时序特征工程核心.md","size":14501,"mtime":"2026-10-08 21:15","ext":".md","kind":"text","href":"docs/04-%E6%97%B6%E5%BA%8F%E7%89%B9%E5%BE%81%E5%B7%A5%E7%A8%8B%E6%A0%B8%E5%BF%83.md","text":"# 04 时序特征工程核心：把时间变成模型能用的数字\n\n这是整个项目最重要的一课。对应导师要求 2.3、2.5、3.1、3.2。\n\n先记住三个问题，后面所有内容都围绕它们：\n\n1. **时间戳怎么变成数字？**（日历特征 + 周期编码）\n2. **怎么把\"过去发生了什么\"告诉模型？**（滞后 + 滑动窗口）\n3. **怎么证明加了这些特征有用？**（对照实验 + 指标 + 画图）\n\n---\n\n## 1. 什么是时序数据\n\n时序数据 = 带时间戳、按时间排好序的记录。\n\n例子：\n\n| datetime | pm2.5 | TEMP |\n| --- | --- | --- |\n| 2014-01-01 00:00 | 80 | -3 |\n| 2014-01-01 01:00 | 75 | -4 |\n| 2014-01-01 02:00 | 90 | -4 |\n\n普通表格数据可以打乱顺序，时序数据**不能随便打乱**，因为顺序本身就是信息。\n\n### 常见时间粒度\n\n| 粒度 | 例子 | 周期长度 |\n| --- | --- | --- |\n| 小时 | 每小时 PM2.5 | 24（一天）、168（一周） |\n| 天 | 每天销量 | 7（一周）、365（一年） |\n| 分钟 | 股票、外卖订单 | 60、1440 |\n\n---\n\n## 2. UTC：为什么时间戳最好统一\n\nUTC 是世界统一时间。不同国家有不同时区：\n\n- 北京：UTC+8；\n- 伦敦：UTC+0（夏令时 UTC+1）；\n- 纽约：UTC-5（夏令时 UTC-4）。\n\n如果两份数据一个用北京时间、一个用 UTC，直接合并就会错 8 小时。统一用 UTC 最省事。\n\n### 代码怎么写\n\n```python\n# 情况 1：原始时间本来就是 UTC\ndf[\"datetime\"] = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]])\ndf[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"UTC\")\n\n# 情况 2：原始时间是北京时间，想转成 UTC\ndf[\"datetime\"] = pd.to_datetime(df[\"datetime\"])\ndf[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"Asia/Shanghai\")\ndf[\"datetime\"] = df[\"datetime\"].dt.tz_convert(\"UTC\")\n\n# 情况 3：已经带时区，直接转换\ndf[\"datetime\"] = df[\"datetime\"].dt.tz_convert(\"UTC\")\n```\n\n本项目的数据集原始时间就是 UTC。要注意：**UTC 08:00 = 北京 16:00**。\n如果你要看\"北京人的早晚高峰\"，可以再加一列：\n\n```python\ndf[\"hour_beijing\"] = (df[\"hour\"] + 8) % 24\n```\n\n本教程为了统一，所有小时都按 UTC 讲。\n\n---\n\n## 3. 先定义预测场景：t 和 t+1\n\n这是最容易出错、也最重要的一步。\n\n我们约定：\n\n> **站在时间 t（现在），用截至 t 已经知道的信息，预测 t+1（下一个小时）的 PM2.5。**\n\n把时间轴画出来：\n\n```text\n... t-3      t-2      t-1       t        t+1      t+2 ...\n    已知      已知     已知     已知     要预测    不能看\n```\n\n- `t` 及更早的数据：可以用；\n- `t+1` 及以后的数据：绝对不能用；\n- 目标 `y` 是 `t+1` 的值；\n- 特征 `X` 只能从 `t` 及更早的时刻构造。\n\n### 用 shift 表示\n\n```python\ndf[\"y\"] = df[\"pm2.5\"].shift(-1)     # 目标：下一小时\ndf[\"lag1\"] = df[\"pm2.5\"].shift(1)   # 特征：上一小时\ndf[\"lag24\"] = df[\"pm2.5\"].shift(24) # 特征：昨天同一小时\n```\n\n`shift(-1)` 是\"把未来的值移到当前行\"，只能用于目标 `y`，不能当特征。\n`shift(1)` 是\"把过去的值移到当前行\"，可以当特征。\n\n---\n\n## 4. 日历特征：把时间拆成数字\n\n| 特征 | 怎么构造 | 含义 | 可能的作用 |\n| --- | --- | --- | --- |\n| `year` | `index.year` | 年份 | 长期趋势（本例只有 5 年，谨慎用） |\n| `month` | `index.month` | 1–12 月 | 季节变化：冬天 PM2.5 通常更高 |\n| `day` | `index.day` | 几号 | 通常作用不大，容易过拟合 |\n| `hour` | `index.hour` | 0–23 点 | 一天内的规律 |\n| `dayofweek` | `index.dayofweek` | 0=周一…6=周日 | 工作日/周末差异 |\n| `is_weekend` | `dayofweek >= 5` | 0/1 | 更直接地告诉模型\"这是周末\" |\n| `dayofyear` | `index.dayofyear` | 1–366 | 季节位置，比 month 细 |\n| `weekofyear` | `index.isocalendar().week` | 一年中的第几周 | 周期性任务常用 |\n| `quarter` | `index.quarter` | 季度 | 粗粒度的季节 |\n\n### 例子：为什么\"周末特征\"可能有用\n\n如果共享单车数据里，周末的骑行量明显高于工作日，那么 `is_weekend` 就能帮模型预测\"周末销量高\"。\n如果数据里周末和工作日没差别，这个特征就没用——**有没有用要用实验判断，不能靠感觉。**\n\n---\n\n## 5. 周期编码：sin/cos 到底在干什么\n\n### 问题：23 点和 0 点明明是邻居\n\n如果直接把 `hour` 当成一个数字：\n\n```text\n0, 1, 2, ..., 22, 23\n```\n\n模型会认为 0 和 23 相差 23，非常远。但实际上 23:00 的下一小时就是 00:00，它们只差 1。\n\n### 解决：把时间放到一个圆上\n\n```python\ndf[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\ndf[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n```\n\n- `sin` 和 `cos` 一起用，才能唯一确定圆上的位置；\n- 23 点和 0 点在圆上非常接近；\n- 同理，星期用 7，月份用 12：\n\n```python\ndf[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\ndf[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n\ndf[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12)\ndf[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12)\n```\n\n### 什么时候特别有用\n\n- 线性回归、逻辑回归等线性模型：非常有用，因为它们不会自己理解\"循环\"；\n- 树模型（随机森林、XGBoost）：也有用，但没那么关键，因为树可以自己切分。\n\n### 实验结论怎么写\n\n在本项目里：\n\n| 写法 | 好不好 |\n| --- | --- |\n| \"sin/cos 一定比原始 hour 好\" | ❌ 太绝对 |\n| \"在这个数据、线性回归、这段测试期上，周期编码让 R² 从 0.0286 变成 0.0331，MAE 略增\" | ✅ 具体、诚实 |\n\n---\n\n## 6. 滞后特征 lag：把过去的值搬过来\n\n### 核心代码\n\n```python\ndf[\"pm25_now\"] = df[\"pm2.5\"]          # 当前小时（t）\ndf[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1)  # 上一小时（t-1）\ndf[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2)  # t-2\ndf[\"pm25_lag3\"] = df[\"pm2.5\"].shift(3)  # t-3\ndf[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24)   # 昨天同一小时\ndf[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168) # 上周同一小时（24*7）\n```\n\n### 为什么要选 24 和 168\n\n- 24 小时 = 一天，捕捉\"日周期\"；\n- 168 小时 = 一周，捕捉\"周周期\"；\n- 1、2、3 小时捕捉\"短期惯性\"（刚才污染高，下一小时可能还高）。\n\n### 时间对齐表（一定要会看）\n\n| datetime | pm2.5（当前） | lag1 | lag24 | pm25_next（目标） |\n| --- | --- | --- | --- | --- |\n| 01-09 08:00 | 93 | 106 | 66 | 84 |\n| 01-09 09:00 | 84 | 93 | 92 | 73 |\n| 01-09 10:00 | 73 | 84 | 135 | 66 |\n\n看第二行：当前是 09:00，lag1 是 08:00 的 93，lag24 是昨天 09:00 的 92，\n目标是 10:00 的 73。**特征全部来自 09:00 及以前，目标来自 10:00。**\n\n### 常见错误\n\n| 错误 | 后果 |\n| --- | --- |\n| 用 `shift(-1)` 造特征 | 直接把答案喂给模型 |\n| 先 `dropna()` 再 `shift()` | 时间轴断裂，lag24 不再是 24 小时前 |\n| 随机切分后再看 lag | 训练集里混进了未来的时间 |\n\n---\n\n## 7. 滑动窗口 rolling：看最近一段时间的整体情况\n\n### 核心代码\n\n```python\nwindow24 = df[\"pm2.5\"].rolling(window=24, min_periods=18)\ndf[\"pm25_roll24_mean\"] = window24.mean()   # 最近 24 小时平均\ndf[\"pm25_roll24_std\"] = window24.std()     # 最近的波动大小\ndf[\"pm25_roll24_max\"] = window24.max()     # 最近最高\ndf[\"pm25_roll24_min\"] = window24.min()     # 最近最低\n\nwindow168 = df[\"pm2.5\"].rolling(window=168, min_periods=120)\ndf[\"pm25_roll168_mean\"] = window168.mean() # 最近一周平均\ndf[\"pm25_roll168_std\"] = window168.std()   # 最近一周波动\n```\n\n### 窗口是\"过去\"还是\"未来\"？\n\n| 写法 | 窗口包含 | 预测 t+1 时安全吗 |\n| --- | --- | --- |\n| `rolling(24)`（默认） | t-23 … t | ✅ 安全 |\n| `rolling(24, center=True)` | t-11 … t+12 | ❌ 包含未来，泄漏 |\n| `rolling(24).shift(1)` | t-24 … t-1 | ✅ 更保守 |\n\n记住：`rolling` 默认是**向过去看**（trailing window）。`center=True` 会把窗口挪到中间，就会看到未来。\n\n### min_periods 是什么\n\n数据里有缺失时，窗口里可能不是 24 个都有值。\n\n- `min_periods=24`：必须 24 个全有值，否则给 NaN；\n- `min_periods=18`：至少有 18 个值就算平均，容忍少量缺失。\n\n本项目用了 `min_periods=18`（24 小时窗口）和 `120`（168 小时窗口），\n因为数据里有长缺口，太严格会丢掉太多行；但也不能太松，只靠一两个值硬算平均没有意义。\n\n### mean / std / max / min 分别在说什么\n\n| 统计量 | 一句话 | 可能的作用 |\n| --- | --- | --- |\n| mean | 最近整体水平 | 污染是一直高还是最近才高 |\n| std | 最近波动大不大 | 天气不稳定、污染变化剧烈 |\n| max | 最近的峰值 | 是否出现过极端污染 |\n| min | 最近的谷值 | 最干净的时候有多干净 |\n\n---\n\n## 8. 差分 diff：变化量\n\n```python\ndf[\"pm25_diff1\"] = df[\"pm2.5\"].diff(1)   # 比上一小时高多少\ndf[\"pm25_diff24\"] = df[\"pm2.5\"].diff(24) # 比昨天同一小时高多少\n```\n\n差分之后，数据变成\"变化量\"：\n\n- 正数：升高了；\n- 负数：降低了；\n- 接近 0：平稳。\n\n差分的价值：有些模型更擅长预测\"变化\"，而不是\"绝对值\"；差分也能让突变、异常点更明显。\n\n---\n\n## 9. 趋势、周期、异常点\n\n### 趋势（trend）\n\n长期往上或往下。比如 5 年里 PM2.5 总体下降，说明治理有效。\n\n怎么看：把数据按天/月重采样，画折线，或者看 7 天滑动平均。\n\n### 周期（seasonality / periodicity）\n\n固定间隔重复出现：\n\n- 日周期：24 小时；\n- 周周期：7 天；\n- 年周期：12 个月。\n\n怎么看：按小时/星期/月份 `groupby().mean()`，或者画柱状图。\n\n### 异常点（outlier）\n\n突然特别高或特别低的值。可能是：\n\n- 真实事件（沙尘暴、暴雨、节假日）；\n- 数据错误（传感器故障、录入错误）。\n\n处理异常点要谨慎：不要一看到大值就删。先查清楚它是不是真实发生的。\n\n---\n\n## 10. 缺失值：怎么处理才不心虚\n\n本项目的数据里 `pm2.5` 有 2067 个缺失（4.72%）。\n\n常见处理方式：\n\n| 方法 | 做法 | 适合 |\n| --- | --- | --- |\n| 删除 | `dropna()` | 缺失极少，且删除不会破坏时间轴 |\n| 前向填充 | `ffill()` | 传感器短时中断，值变化慢 |\n| 线性插值 | `interpolate(limit=6)` | 短缺口，前后值之间平滑过渡 |\n| 保留 NaN | 让模型自己处理 | 长缺口，不想瞎猜 |\n\n本项目的做法：\n\n1. 保持完整的小时时间轴（不删行）；\n2. 连续缺失不超过 6 小时的缺口，线性插值；\n3. 长缺口保留为 NaN；\n4. 建模时，哪些行用不到就删哪些行。\n\n**关键原则**：删行会让时间轴断开，`shift(24)` 就会变成\"往前数 24 行\"，不再是 24 小时前。\n要么保持完整时间轴，要么显式补齐时间轴。\n\n---\n\n## 11. 数据泄漏：时序任务最容易犯的错\n\n数据泄漏 = 模型在训练/预测时，用到了它在真实场景里不可能知道的信息。\n\n### 常见泄漏方式\n\n| 泄漏方式 | 例子 | 为什么错 |\n| --- | --- | --- |\n| 未来值当特征 | 用 `pm25_next` 预测 `pm25_next` | 直接看答案 |\n| 中心滑动窗口 | `rolling(24, center=True)` | 窗口包含 t+1、t+2 |\n| 全量数据算统计量 | 用整段数据的均值填充缺失 | 用到了未来 |\n| 随机切分 | `train_test_split(shuffle=True)` | 训练集混入未来时间段 |\n| 先处理再切分 | 先在全量数据上标准化，再切训练/测试 | 标准化用到了测试集信息 |\n\n### 加特征前的\"三问\"\n\n1. **在预测那一刻，这个数真的拿得到吗？**（t 时知道吗）\n2. **它有没有用到 t+1 或更晚的数据？**\n3. **训练/测试是不是按时间切的？**\n\n三个问题只要有一个答案是\"不确定\"，就先不要加这个特征。\n\n### 为什么泄漏很危险\n\n泄漏的特征会让测试分数看起来很好，但上线以后一塌糊涂。\n本项目的第 9 课专门做了一个\"把答案当特征\"的实验：它的 R² = 1.0000，看起来完美，但完全没用。\n**分数好得反常时，第一反应应该是\"我是不是泄漏了\"。**\n\n---\n\n## 12. 怎么判断一个特征到底有没有用\n\n### 方法 1：对照实验\n\n保持数据、模型、切分方式不变，只改特征：\n\n```text\n模型 A：只用时间特征          → MAE = ?\n模型 B：时间 + 滞后            → MAE = ?\n模型 C：时间 + 滞后 + 滑动窗口 → MAE = ?\n```\n\n### 方法 2：消融实验（ablation）\n\n从完整特征里拿掉一组，看指标变差多少：\n\n```text\n完整特征       → MAE = 10.75\n去掉滞后       → MAE = 33.38   （变差很多，说明滞后很重要）\n去掉滑动窗口   → MAE = 10.80   （几乎没变）\n去掉天气       → MAE = 10.89   （影响很小）\n只留时间特征   → MAE = 62.66   （变差巨大）\n```\n\n### 方法 3：画图\n\n把预测值和真实值画在一起。如果预测线明显更贴近真实线，说明特征有用。\n\n### 方法 4：看系数 / 重要性（参考）\n\n线性回归的系数、树模型的特征重要性都能看，但有两点注意：\n\n- 特征之间高度相关时，重要性会被分散；\n- 相关不等于因果，不能写\"因为加了 TEMP 所以污染下降\"。\n\n### 结论模板\n\n> 在这个数据集上，和前一组特征相比，加入 ____ 后 MAE 从 ____ 变为 ____，R² 从 ____ 变为 ____。\n> 因此 ____ 特征在这个任务中有帮助 / 帮助不大。\n> 需要说明的是，这只是线性回归在这段测试期上的结果，换模型或换时间段可能不同。\n\n---\n\n## 13. 特征笔记模板\n\n每学一个特征，复制这张表：\n\n| 项目 | 内容 |\n| --- | --- |\n| 特征名 |  |\n| 怎么构造 | 写代码 |\n| 一句话含义 |  |\n| 我期望它有什么用 |  |\n| 实验证据 | 哪一组对比，指标变化多少 |\n| 结论 | 保留 / 不保留 / 不确定，为什么 |\n\n填满 5–8 个特征，你的笔记就足够交给导师了。\n\n---\n\n## 14. 本课检查点\n\n- [ ] 我能解释 UTC，并说出北京时间和 UTC 的关系；\n- [ ] 我能画出 t、t+1、lag1、lag24 的时间对齐；\n- [ ] 我能写出 hour 的 sin/cos 公式；\n- [ ] 我能说出 trailing 和 centered 窗口的区别；\n- [ ] 我能说出至少 3 种数据泄漏；\n- [ ] 我能用 MAE/R² 的前后变化判断一个特征有没有用。\n\n下一课：`05-建模与实验.md`。\n"},"docs/05-建模与实验.md":{"path":"docs/05-建模与实验.md","name":"05-建模与实验.md","size":10052,"mtime":"2026-10-08 21:15","ext":".md","kind":"text","href":"docs/05-%E5%BB%BA%E6%A8%A1%E4%B8%8E%E5%AE%9E%E9%AA%8C.md","text":"# 05 建模与实验：线性回归、切分、指标和结果解读\n\n对应脚本：\n\n- `scripts/06_baseline_model.py`\n- `scripts/07_cyclic_encoding.py`\n- `scripts/09_model_comparison.py`\n\n---\n\n## 1. 线性回归不是黑魔法\n\n线性回归就是找一条直线（或超平面），让预测值和真实值尽量接近：\n\n```text\n预测值 = b + a1*x1 + a2*x2 + ... + an*xn\n```\n\n- `x1, x2, ...` 是你的特征（hour、lag1、roll24_mean…）；\n- `a1, a2, ...` 是模型学到的系数；\n- `b` 是截距。\n\n它不神秘，就是\"给每个特征乘一个权重，再加起来\"。\n\n```python\nfrom sklearn.linear_model import LinearRegression\n\nmodel = LinearRegression()\nmodel.fit(x_train, y_train)   # 学习\npred = model.predict(x_test)  # 预测\n```\n\n---\n\n## 2. 训练集和测试集：为什么必须按时间切\n\n### 正确做法\n\n```python\nsplit_index = int(len(df) * 0.8)\ntrain = df.iloc[:split_index]   # 前 80%，旧数据\ntest = df.iloc[split_index:]    # 后 20%，新数据\n```\n\n用过去的数据学习，用未来的数据考试。这才像真实场景。\n\n### 错误做法\n\n```python\nfrom sklearn.model_selection import train_test_split\n\ntrain, test = train_test_split(df, test_size=0.2, shuffle=True)  # ❌ 时序数据不要这样\n```\n\n随机切分会让训练集里混入\"未来\"的时间段，测试集里混入\"过去\"的时间段。\n这相当于考试前把一部分考题和答案混在一起复习，分数不能代表真实水平。\n\n本项目的第 9 课专门把随机切分列出来作为**错误示范**。注意：错误做法不一定会让分数变高，它的问题是\"测的不是我们关心的东西\"。\n\n---\n\n## 3. 三个指标：MAE、RMSE、R²\n\n假设真实值是 `[100, 120, 80]`，预测值是 `[90, 130, 70]`。\n\n### MAE（平均绝对误差）\n\n```text\n|100-90| + |120-130| + |80-70| = 10 + 10 + 10 = 30\nMAE = 30 / 3 = 10\n```\n\n一句话：**平均每次预测差多少。** 越小越好，单位和目标一样（这里是 PM2.5）。\n\n### RMSE（均方根误差）\n\n先平方，再平均，再开根号：\n\n```text\nsqrt((10² + 10² + 10²) / 3) = 10\n```\n\n平方会重罚\"差得特别离谱\"的预测。所以 RMSE 通常会比 MAE 大一点。\n如果 RMSE 远大于 MAE，说明存在少数错得很离谱的预测。\n\n### R²（决定系数）\n\n```text\nR² = 1 - (模型犯的错) / (只会猜平均值犯的错)\n```\n\n- `R² = 1`：完美预测；\n- `R² = 0`：和\"永远猜平均值\"差不多；\n- `R² < 0`：比\"永远猜平均值\"还差。\n\nR² 的好处是跨数据集可比，坏处是它会被极端值影响。**不要只看 R²。**\n\n---\n\n## 4. 必须有基线：平均值和持续法\n\n### 基线 1：平均值\n\n```python\npred = [y_train.mean()] * len(y_test)\n```\n\n不管三七二十一，永远猜训练集的平均值。这个分数就是\"地板\"。\n\n### 基线 2：持续法（persistence）\n\n```python\npred = test[\"pm2.5\"]   # 把当前值直接当成下一小时的预测\n```\n\n听起来很笨，但在时间序列里非常强：如果这一小时 PM2.5 = 80，\n下一小时大概率也在 80 附近。\n\n**如果你的复杂模型还打不过持续法，就说明你的特征或模型有问题。**\n\n---\n\n## 5. 实验原则：一次只改一个东西\n\n对比实验的基本规矩：\n\n- 同一份数据；\n- 同一段时间切分；\n- 同一个模型（都用线性回归）；\n- 同一个评价指标；\n- **只改特征**。\n\n本项目第 9 课的对比：\n\n| 实验 | 特征 | 切分方式 |\n| --- | --- | --- |\n| 平均值基线 | 无 | 按时间 8:2 |\n| 持续法基线 | 当前 pm2.5 | 按时间 8:2 |\n| 只用原始时间特征 | month/day/hour… | 按时间 8:2 |\n| 只用周期编码时间 | sin/cos | 按时间 8:2 |\n| 周期编码 + 滞后 | + lag/diff | 按时间 8:2 |\n| 完整正确版 | + 滑动窗口 + 天气 | 按时间 8:2 |\n| 中心滑动窗口（错误） | 包含未来值 | 按时间 8:2 |\n| 把答案当特征（错误） | 答案 | 按时间 8:2 |\n| 随机切分（错误） | 完整特征 | 随机 8:2 |\n\n---\n\n## 6. 本项目跑出来的真实结果（你的机器上可能略有差异）\n\n### 6.1 第 6 课：只用时间特征\n\n| 模型 | MAE | RMSE | R² |\n| --- | --- | --- | --- |\n| 平均值基线 | 69.664 | 94.430 | -0.0000 |\n| 线性回归（时间特征） | 68.539 | 93.068 | 0.0286 |\n\n**解读**：只看\"现在几月几号几点\"，几乎预测不了下一小时的 PM2.5。\nR² 从 0 提升到 0.0286，提升很小。这很正常——空气污染不是看表就能算出来的。\n\n### 6.2 第 7 课：周期编码对比\n\n| 模型 | MAE | RMSE | R² |\n| --- | --- | --- | --- |\n| 原始数字时间 | 68.539 | 93.068 | 0.0286 |\n| 周期编码时间 | 68.644 | 92.853 | 0.0331 |\n\n**解读**：这是一个很好的\"诚实结论\"例子。\n\n- 周期编码让 RMSE 略降、R² 略升；\n- 但 MAE 反而略微变差（68.539 → 68.644）。\n\n所以不能写\"周期编码全面更好\"。正确的写法是：\n\n> 周期编码让 R² 略有提升（0.0286 → 0.0331），RMSE 略有下降，\n> 但 MAE 基本不变甚至略增。说明在这个数据、这个模型、这段测试期上，\n> 周期编码的作用有限，不能夸大成\"显著提升\"。\n\n### 6.3 第 9 课：完整对比\n\n| 实验 | MAE | RMSE | R² | 可信吗 |\n| --- | --- | --- | --- | --- |\n| 平均值基线 | 64.740 | 82.470 | -0.0286 | ✅ |\n| 持续法基线 | 10.981 | 19.968 | 0.9397 | ✅ |\n| 只用原始时间特征 | 62.576 | 81.323 | -0.0002 | ✅ |\n| 只用周期编码时间 | 62.656 | 80.601 | 0.0175 | ✅ |\n| 周期编码 + 滞后 | 10.934 | 19.670 | 0.9415 | ✅ |\n| 完整正确版 | 10.754 | 19.473 | 0.9426 | ✅ |\n| 中心滑动窗口 | 10.413 | 18.112 | 0.9504 | ❌ 泄漏 |\n| 把答案当特征 | 0.000 | 0.000 | 1.0000 | ❌ 作弊 |\n| 随机切分 | 12.430 | 21.106 | 0.9494 | ❌ 方法错 |\n\n**五个关键结论**：\n\n1. **只靠时间特征远远不够**。MAE 60+，R² 接近 0。\n2. **持续法非常强**。当前值直接当预测，R² 就有 0.94。这告诉我们：PM2.5 前后两小时高度相关。\n3. **滞后特征带来最大提升**。加入 lag 后，MAE 从 62.7 降到 10.9，几乎追平持续法。\n4. **滑动窗口和天气只带来小幅提升**。完整版 MAE 10.754，比只用滞后好一点点（10.934 → 10.754）。\n5. **泄漏会制造假高分**。中心滑动窗口 MAE 10.413 看起来更好，但它用了未来数据；\n   把答案当特征更是 R² = 1.0000，完全没有意义。\n\n### 6.4 第 9 课：消融实验（拿掉一组会怎样）\n\n| 实验 | MAE | RMSE | R² | 解读 |\n| --- | --- | --- | --- | --- |\n| 完整特征 | 10.754 | 19.473 | 0.9426 | 基准 |\n| 去掉滞后 | 33.376 | 45.330 | 0.6892 | 变差很多，滞后最重要 |\n| 去掉滑动窗口 | 10.804 | 19.511 | 0.9424 | 几乎没变，作用很小 |\n| 去掉天气 | 10.885 | 19.634 | 0.9417 | 影响很小 |\n| 只留时间特征 | 62.656 | 80.601 | 0.0175 | 变差巨大 |\n\n**一句话总结**：在这个\"预测下一小时\"的任务里，**最近的值（当前值、lag1）最有信息量**；\n滑动窗口和天气是锦上添花，不是决定性的。\n\n这不是失败，而是一个很真实、很有价值的科研结论。\n\n---\n\n## 7. 为什么\"预测下一小时\"这么容易\n\n因为 PM2.5 的相邻小时高度相关。今天 10:00 是 80，11:00 大概率还在 80 附近。\n持续法就抓住了这个规律。\n\n如果你想做一个更能体现特征工程价值的任务，可以尝试：\n\n- 预测 **t+24**（明天同一小时）而不是 t+1；\n- 预测 **未来 24 小时的平均值**；\n- 预测 **明天是否超过某个阈值**（变成分类问题）；\n- 用 **多步预测**：一次预测未来 6/12/24 小时。\n\n预测越远，滞后和滑动窗口的价值越明显。\n\n---\n\n## 8. 相关不等于因果\n\n看系数的时候要小心：\n\n- `TEMP` 的系数是负的，不代表\"温度降低会导致污染\"；\n- 可能是冬天温度低，同时取暖排放多，两者一起变化；\n- 特征之间高度相关时（`pm25_now`、`lag1`、`roll24_mean`），系数会互相\"抢功劳\"。\n\n可以写：\"TEMP 与目标呈负相关\"，不要写\"TEMP 导致污染\"。\n\n---\n\n## 9. 实验记录怎么写\n\n每条实验记录包含 5 个要素：\n\n1. **问题**：我想验证什么？\n2. **设置**：数据、特征组、模型、切分、指标；\n3. **结果**：具体数字，不要只写\"变好了\"；\n4. **解释**：为什么会有这个结果？\n5. **限制**：这个结论在什么条件下成立？有什么没考虑到？\n\n模板：\n\n```markdown\n### 实验：加入滞后特征是否有帮助\n\n- 问题：把 t-1、t-2、t-24 的值加入特征，能否提升下一小时 PM2.5 预测？\n- 设置：线性回归，前 80% 训练 / 后 20% 测试，MAE/RMSE/R²。\n- 结果：MAE 从 62.656 降到 10.934，R² 从 0.0175 升到 0.9415。\n- 解释：PM2.5 相邻小时高度相关，历史值提供了时间特征无法提供的信息。\n- 限制：只在线性回归上验证；换成树模型或预测更远的时刻，结论可能不同。\n```\n\n---\n\n## 10. 下一步可以尝试什么\n\n按难度从易到难：\n\n1. 把目标从 t+1 改成 t+24，看特征还好不好用；\n2. 换模型：`RandomForestRegressor`、`HistGradientBoostingRegressor`；\n3. 增加滞后：lag48、lag72、lag336（两周）；\n4. 给天气变量也做滞后和滑动窗口；\n5. 做滚动预测（walk-forward validation）：每次用过去 N 年训练，预测下一年；\n6. 对目标做 `log1p` 变换，看极端值的影响是否变小；\n7. 做分类任务：预测\"明天 PM2.5 是否超过 150\"。\n\n每试一个，就回到\"三问\"：**这个特征在预测那一刻拿得到吗？**\n\n---\n\n## 11. 本课检查点\n\n- [ ] 我能用一句话解释线性回归在做什么；\n- [ ] 我能说出为什么时序数据要按时间切分；\n- [ ] 我能解释 MAE、RMSE、R²，并知道 R² 不是唯一标准；\n- [ ] 我知道持续法基线是什么，以及它有多强；\n- [ ] 我能照模板写出 3 条实验结论；\n- [ ] 我知道\"相关不等于因果\"。\n\n下一课：`06-画图与Kaggle.md`。\n"},"docs/06-画图与Kaggle.md":{"path":"docs/06-画图与Kaggle.md","name":"06-画图与Kaggle.md","size":6944,"mtime":"2026-10-08 21:16","ext":".md","kind":"text","href":"docs/06-%E7%94%BB%E5%9B%BE%E4%B8%8EKaggle.md","text":"# 06 画图与 Kaggle：用眼睛理解特征，用比赛练手\n\n对应脚本：`scripts/10_plots.py`。\n对应导师要求：3.3 画图观察特征、3.4 用 Kaggle 入门赛练手。\n\n---\n\n## 第一部分：怎么读你生成的 6 张图\n\n图片都在 `outputs/figures/`。\n\n### 图 1：原始序列与趋势（`01_原始序列与趋势.png`）\n\n上半张是 5 年的日平均 PM2.5，下半张是放大后的两周小时数据。\n\n要看三件事：\n\n- 有没有长期趋势（整体上升/下降）；\n- 有没有季节规律（冬天通常更高）；\n- 小时级数据是不是上下波动明显。\n\n### 图 2：滑动平均与差分（`02_滑动平均与差分.png`）\n\n- 灰色线：每天的原始值，抖动很大；\n- 橙色线：7 天滑动平均，把短期噪声抹平，趋势更清楚；\n- 绿色线：差分（今天 − 昨天），正数表示升高，负数表示降低；\n- 差分图上的大尖刺就是异常变化点。\n\n### 图 3：周期性观察（`03_周期性观察.png`）\n\n三张柱状图分别是按小时、按星期、按月份的平均 PM2.5。\n\n怎么判断有没有周期：**柱子高低是否明显不同**。\n如果所有柱子一样高，说明这个时间维度没有信息；如果高低差很多，说明它可能有用。\n\n注意：这张图用的是 UTC 小时。UTC 08:00 是北京时间 16:00。\n如果你觉得峰值时间和直觉对不上，先想一想时区。\n\n### 图 4：预测对比（`04_预测对比.png`）\n\n- 黑线：真实值；\n- 橙线：只用周期时间特征的预测，几乎是平的；\n- 蓝线：完整特征（滞后 + 滑动 + 天气）的预测，紧跟黑线。\n\n这张图最直观地说明了：**滞后特征让模型从\"猜平均\"变成了\"跟着走\"。**\n\n### 图 5：周期编码圆（`05_周期编码圆.png`）\n\n23 个点分布在圆上，每个点是一个小时。0 点和 23 点在圆上紧挨着。\n这就是 sin/cos 编码想要表达的：\"小时是一个循环，不是一条直线。\"\n\n### 图 6：相关性热力图（`06_相关性热力图.png`）\n\n红色是正相关，蓝色是负相关。数值越接近 ±1 关系越强。\n\n第一行/第一列是 `pm25_next`（目标），可以看看哪些特征和它关系最近。\n但要记住：**相关不代表因果，也不能只凭相关性选特征。**\n\n---\n\n## 第二部分：matplotlib 最小必要知识\n\n```python\nimport matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(10, 4))\nax.plot(dates, values, label=\"PM2.5\")\nax.set_title(\"标题\")\nax.set_xlabel(\"日期\")\nax.set_ylabel(\"数值\")\nax.legend()\nax.grid(alpha=0.3)\nfig.savefig(\"outputs/figures/my_plot.png\")\nplt.close(fig)\n```\n\n- `fig`：整张画布；\n- `ax`：具体的坐标轴；\n- `plot`：画折线；\n- `bar`：画柱状图；\n- `scatter`：画散点；\n- `label` + `legend`：图例；\n- `savefig`：保存成图片。\n\n中文显示需要设置字体（本项目已经在 `scripts/common.py` 里统一设置）：\n\n```python\nplt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\", \"SimHei\"]\nplt.rcParams[\"axes.unicode_minus\"] = False\n```\n\n---\n\n## 第三部分：Kaggle 入门赛实战\n\n### 1. 注册\n\n打开 <https://www.kaggle.com>，用邮箱注册。免费。\n\n### 2. 找时间序列相关的 Playground 比赛\n\n路径：\n\n```text\nCompetitions → 筛选 Playground → 搜索 time series / forecasting / sales\n```\n\n也可以直接搜索这些关键词：\n\n- `Store Sales Time Series Forecasting`\n- `Bike Sharing Demand`\n- `Tabular Playground Series`（每一期主题不同，找时间序列相关的）\n- `Web Traffic Time Series Forecasting`\n- `M5 Forecasting`（经典，但可能已经结束/不可提交）\n\n注意：Kaggle 比赛会更新，具体名称和是否开放提交以网站为准。\n你要找的是：**有明确时间列、有训练集和测试集、评价指标清楚**的比赛。\n\n### 3. 看懂一个比赛页面\n\n| 页面 | 你要看什么 |\n| --- | --- |\n| Overview | 任务是什么、规则、时间线 |\n| Data | 有哪些文件、每列什么意思、训练/测试怎么分 |\n| Evaluation | 用什么指标（MAE、RMSE、SMAPE…） |\n| Code | 别人的公开 notebook |\n| Discussion | 常见坑、数据问题 |\n\n### 4. 先做一个最笨的提交\n\n不要一上来就冲高分。先做：\n\n1. 读 `sample_submission.csv`，看提交格式；\n2. 用训练集的平均值，或\"最后一个已知值\"作为预测；\n3. 生成提交文件，上传一次；\n4. 记住这个分数，它是你的基线。\n\n### 5. 读 3 篇公开 notebook 的方法\n\n不要从头到尾读代码，直接搜关键词：\n\n```text\nfeature engineering\nlag\nrolling\nshift\ncyclical\nsin\ncos\ndate\nweekday\nholiday\n```\n\n每读到一种特征，就问自己：\n\n1. 他怎么构造的？\n2. 为什么他认为这个特征有用？\n3. 我能不能在自己的数据上复现？\n4. 复现后指标变化多少？\n\n把答案写进 `notes/学习笔记模板.md`。\n\n### 6. 复现一个特征的完整流程\n\n1. 在自己的数据上写构造代码；\n2. 确认没有用到未来数据；\n3. 保持模型和切分方式不变，只加这一个特征；\n4. 记录加之前/之后的 MAE；\n5. 写下结论：有用、没用、还是不确定。\n\n### 7. 关于排名\n\n导师的要求是\"不追求排名，着重看别人的特征工程思路\"。\n所以：\n\n- 排名 3000 名不丢人；\n- 能说清楚\"我复现了 lag 特征，MAE 从 X 降到 Y\"才是真本事；\n- 抄代码不理解，面试/答辩一问就露馅。\n\n### 8. 常见的 Kaggle 时间序列特征清单\n\n| 类别 | 特征 |\n| --- | --- |\n| 日历 | year、month、day、weekday、weekofyear、is_weekend、is_holiday |\n| 周期 | hour_sin/cos、weekday_sin/cos、month_sin/cos |\n| 滞后 | lag1、lag2、lag7、lag14、lag28、lag365 |\n| 滑动 | rolling mean/std/min/max（7、14、28 天） |\n| 差分 | diff1、diff7、pct_change |\n| 其他变量 | 天气、促销、油价、节假日 |\n| 静态信息 | 店铺 id、商品 id、城市（类别特征） |\n\n注意：具体用哪些，取决于你的数据频率和业务含义。小时数据看 24/168，日数据看 7/30/365。\n\n### 9. Kaggle 检查点\n\n- [ ] 我注册了 Kaggle；\n- [ ] 我找到了一个时间序列相关的 Playground 比赛；\n- [ ] 我看懂了数据文件和提交格式；\n- [ ] 我做出了一次基线提交；\n- [ ] 我读了至少 3 篇公开 notebook；\n- [ ] 我复现了至少 1 个特征并记录了指标变化；\n- [ ] 我没有直接复制别人的代码当自己的作业。\n\n---\n\n## 第四部分：把 Kaggle 学到的东西搬回本项目\n\n如果你在 Kaggle 学到了新特征，可以回来改 `scripts/08_lag_rolling_features.py`：\n\n1. 加一个新特征；\n2. 重新运行 `09_model_comparison.py`；\n3. 看消融实验有没有变化；\n4. 把结论写进笔记。\n\n这就是一个完整的\"学习 → 复现 → 验证 → 记录\"闭环。\n导师想看到的正是这个，而不是一个漂亮的分数。\n\n---\n\n下一课：`07-交作业清单与报告模板.md`。\n"},"docs/07-交作业清单与报告模板.md":{"path":"docs/07-交作业清单与报告模板.md","name":"07-交作业清单与报告模板.md","size":7161,"mtime":"2026-10-08 21:16","ext":".md","kind":"text","href":"docs/07-%E4%BA%A4%E4%BD%9C%E4%B8%9A%E6%B8%85%E5%8D%95%E4%B8%8E%E6%8A%A5%E5%91%8A%E6%A8%A1%E6%9D%BF.md","text":"# 07 交作业清单与报告模板\n\n这一课告诉你：做完项目后，到底要交什么、怎么组织、怎么写得像\"做过科研\"。\n\n---\n\n## 1. 交付清单\n\n### 1.1 GitHub 仓库\n\n- [ ] 仓库名：`time-series-feature-engineering`\n- [ ] 根目录有 `README.md`，写清楚项目做什么、怎么运行；\n- [ ] 有 `requirements.txt`；\n- [ ] 有 `scripts/` 全部代码；\n- [ ] 有 `docs/` 教程文档（可选，但很加分）；\n- [ ] 有 `notes/学习笔记模板.md`（已填写）；\n- [ ] 有 `notes/实验记录模板.md`（已填写）；\n- [ ] 有 `outputs/figures/` 里的图（可以提交，也可以说明怎么生成）；\n- [ ] `.gitignore` 里排除了 `.venv/` 和原始大数据。\n\n### 1.2 笔记\n\n- [ ] 每个特征都有：怎么构造、什么意思、预期作用、实验结果、结论；\n- [ ] 至少写 5 个特征；\n- [ ] 有\"踩坑记录\"：遇到过什么报错、怎么解决；\n- [ ] 有实验记录：至少 3 组对照。\n\n### 1.3 图表\n\n- [ ] 原始序列图；\n- [ ] 滑动平均 + 差分图；\n- [ ] 周期性图（小时/星期/月份）；\n- [ ] 预测对比图；\n- [ ] 周期编码圆；\n- [ ] 相关性热力图。\n\n每张图下面要能说出 2–3 句话，不要只贴图。\n\n### 1.4 报告\n\n- [ ] 一页到两页；\n- [ ] 包含：目标、数据、方法、特征、结果、结论、局限；\n- [ ] 数字准确（和 CSV 对得上）；\n- [ ] 结论具体（不要写\"效果不错\"这种空话）。\n\n---\n\n## 2. 一页报告模板（直接照着填）\n\n```markdown\n# 时序数据集特征工程实验报告\n\n## 1. 实验目标\n\n本实验使用 ____ 数据集，目标是在时间 t 使用截至 t 的信息，预测 ____。\n重点研究：时间特征、周期编码、滞后特征、滑动窗口特征对预测效果的影响。\n\n## 2. 数据\n\n- 数据来源：UCI 北京 PM2.5 数据；\n- 时间范围：2010-01-01 至 2014-12-31，UTC，每小时一条，共 43824 条；\n- 目标列：pm2.5；\n- 缺失情况：pm2.5 缺失 2067 条（4.72%）；\n- 处理方式：保持完整小时时间轴；连续缺失不超过 6 小时的做线性插值；\n  长缺口保留 NaN；建模时按使用的特征删除无法计算的行。\n\n## 3. 方法\n\n- 预测目标：t+1 时刻的 pm2.5；\n- 模型：线性回归（LinearRegression）；\n- 切分方式：按时间前 80% 训练，后 20% 测试；\n- 指标：MAE、RMSE、R²。\n\n## 4. 特征工程\n\n| 特征组 | 具体特征 | 构造方法 |\n| --- | --- | --- |\n| 日历 | month、day、hour、dayofweek、is_weekend、dayofyear | 从 UTC 时间索引提取 |\n| 周期编码 | hour_sin/cos、dayofweek_sin/cos、month_sin/cos | sin(2πx/T)、cos(2πx/T) |\n| 滞后 | pm25_lag1/2/3/24/168、diff1、diff24 | shift(k)、diff(k) |\n| 滑动窗口 | roll24 的 mean/std/max/min、roll168 的 mean/std | rolling(window, min_periods) |\n| 天气 | TEMP、DEWP、PRES、Iws、Is、Ir | 原始列 + 少量滞后/滑窗 |\n\n防泄漏措施：\n1. 目标用 shift(-1)，特征只用 t 及更早的数据；\n2. 滑动窗口使用 trailing window，不使用 center=True；\n3. 训练/测试按时间切分，不随机打乱；\n4. 所有插值和统计都不使用测试期未来信息。\n\n## 5. 实验结果\n\n| 实验 | MAE | RMSE | R² | 是否可信 |\n| --- | --- | --- | --- | --- |\n| 平均值基线 | 64.740 | 82.470 | -0.0286 | 可信 |\n| 持续法基线 | 10.981 | 19.968 | 0.9397 | 可信 |\n| 只用原始时间特征 | 62.576 | 81.323 | -0.0002 | 可信 |\n| 只用周期编码时间 | 62.656 | 80.601 | 0.0175 | 可信 |\n| 周期编码 + 滞后 | 10.934 | 19.670 | 0.9415 | 可信 |\n| 完整正确版 | 10.754 | 19.473 | 0.9426 | 可信 |\n| 中心滑动窗口 | 10.413 | 18.112 | 0.9504 | 不可信（泄漏） |\n| 把答案当特征 | 0.000 | 0.000 | 1.0000 | 不可信（作弊） |\n| 随机切分 | 12.430 | 21.106 | 0.9494 | 不可信（方法错） |\n\n消融实验：\n\n| 实验 | MAE | R² | 结论 |\n| --- | --- | --- | --- |\n| 完整特征 | 10.754 | 0.9426 | 基准 |\n| 去掉滞后 | 33.376 | 0.6892 | 滞后最重要 |\n| 去掉滑动窗口 | 10.804 | 0.9424 | 影响很小 |\n| 去掉天气 | 10.885 | 0.9417 | 影响很小 |\n| 只留时间特征 | 62.656 | 0.0175 | 远远不够 |\n\n## 6. 结论\n\n1. 只使用时间特征时，模型几乎无法预测下一小时的 PM2.5\n   （MAE 62.656，R² 0.0175），说明\"看钟表\"本身信息有限。\n2. 持续法基线 MAE 10.981、R² 0.9397，说明 PM2.5 相邻小时高度相关。\n3. 加入滞后特征后，MAE 从 62.656 降到 10.934，提升最大。\n4. 在滞后特征基础上，滑动窗口和天气特征只带来小幅提升\n   （MAE 10.934 → 10.754）。\n5. 周期编码在本实验中作用有限：R² 略升，但 MAE 没有明显下降。\n6. 中心滑动窗口得分看起来更好（MAE 10.413），但它使用了未来数据，\n   属于数据泄漏；把答案当特征时 R²=1.0000，进一步说明\"异常好的分数\"要警惕。\n\n## 7. 局限与下一步\n\n- 本实验只使用了线性回归，换用树模型结论可能不同；\n- 预测目标只有下一小时，预测 t+24 时滞后和滑窗的作用可能更明显；\n- 只做了单步预测，还没有做多步预测；\n- 下一步计划：尝试 HistGradientBoostingRegressor，预测 t+24，\n  并做滚动时间验证。\n\n## 8. 复现方式\n\n```powershell\npython -m venv .venv\n.\\.venv\\Scripts\\Activate.ps1\npip install -r requirements.txt\n.\\run_all.ps1\n```\n\n结果在 `outputs/tables/09_model_comparison.csv` 和 `outputs/figures/`。\n```\n\n---\n\n## 3. 五分钟答辩/汇报怎么说\n\n按这个顺序讲，不要念代码：\n\n1. **问题是什么**（30 秒）\n   \"我要预测下一小时的 PM2.5。\"\n2. **数据怎么处理**（30 秒）\n   \"43824 小时，UTC。保持完整时间轴，短缺口插值，长缺口保留。\"\n3. **我造了哪些特征**（1 分钟）\n   \"三类：日历特征、周期编码、滞后和滑动窗口。\"\n4. **怎么防止用未来数据**（1 分钟）\n   \"目标 shift(-1)；特征只用 t 及更早；按时间切分；不用 center=True。\"\n5. **结果是什么**（1 分钟）\n   \"时间特征几乎没用，滞后特征提升最大，滑窗和天气小幅提升。\"\n6. **我踩了什么坑**（30 秒）\n   \"一开始直接删缺失行，时间轴断了；后来改成保持完整小时轴。\"\n7. **下一步**（30 秒）\n   \"预测 t+24，换树模型，做滚动验证。\"\n\n如果老师问\"哪个特征最有用\"，回答：\n\n> 在这份数据和这个任务里，当前值和 lag1 最有用。\n> 证据是消融实验：去掉全部滞后特征后，MAE 从 10.754 变成 33.376。\n> 滑动窗口和天气只带来约 0.1 的提升。\n\n---\n\n## 4. 最后的自检\n\n交之前问自己：\n\n- [ ] 我的 README 能让同学从零跑通吗？\n- [ ] 我的实验数字和 CSV 对得上吗？\n- [ ] 我有没有把 `_leaky` 特征写进\"正式模型\"？\n- [ ] 我的结论有没有过度夸大？\n- [ ] 我能不能解释每一个用到的特征？\n- [ ] 我有没有记录失败和踩坑？\n\n只要这 6 个问题都是\"是\"，这份作业就比大多数\"复制粘贴跑个分数\"的作业扎实得多。\n\n---\n\n祝顺利。遇到报错看 `99-报错急救.md`。\n"},"docs/08-知识点与代码速查.md":{"path":"docs/08-知识点与代码速查.md","name":"08-知识点与代码速查.md","size":36529,"mtime":"2026-10-09 00:20","ext":".md","kind":"text","href":"docs/08-%E7%9F%A5%E8%AF%86%E7%82%B9%E4%B8%8E%E4%BB%A3%E7%A0%81%E9%80%9F%E6%9F%A5.md","text":"# 时序特征工程 · 知识点与代码速查手册\n\n> 配套项目：`time-series-feature-engineering`（北京 PM2.5 实战）\n> 用途：把项目里用到的知识点和代码集中到一处，打印出来放在手边，写代码、写报告时对着查。\n> 阅读方式：左边是代码，代码下面的「作用」就是这段代码在干什么，不需要背，知道去哪儿找就行。\n> 重新生成 PDF：在项目根目录运行 `python guide\\build_handbook.py`，PDF 会输出到 `outputs\\知识点与代码速查.pdf`。\n> 打印版 PDF：[outputs/知识点与代码速查.pdf](outputs/知识点与代码速查.pdf)（已经在项目里生成好了，直接打开或打印即可）。\n\n---\n\n## 怎么用这本手册\n\n1. **先看「核心 10 句话」**：把整个项目的骨架记住，比记住代码重要。\n2. **要写代码时，翻到对应章节**：每一节都是「代码 + 作用」，复制过去改成自己的列名就能用。\n3. **要写报告时，看附录 A 和附录 B**：特征怎么解释、实验结论是什么，直接抄进报告。\n4. **报错时看第 10 章**：按错误信息查，先看原因，再看解决办法。\n\n---\n\n## 核心 10 句话\n\n1. 时序数据是带时间戳、按时间排好序的记录，**顺序本身就是信息**，不能随便打乱。\n2. 时间戳统一用 **UTC**；北京时间 = UTC + 8。\n3. 预测场景要先定义清楚：**站在 t 时刻，用截至 t 已知的信息，预测 t+1**。\n4. 时间列可以拆成 **年、月、日、星期、小时、是否周末** 这些数字特征。\n5. 小时、星期、月份用 **sin/cos 周期编码**，23 点和 0 点才会变成\"邻居\"。\n6. **lag（滞后）** 是把过去的值挪到当前行：`shift(1)` 是上一小时，`shift(24)` 是昨天同一小时。\n7. **rolling（滑动窗口）** 是算最近一段时间（如 24 小时）的均值、波动、最大最小值。\n8. 任何用到了 t+1 及以后的信息，都是 **数据泄漏**，测试分数会假高。\n9. 时序数据切分训练/测试必须 **按时间前后切**，不能随机切。\n10. 先跑 **基线**（平均值、持续法），再谈复杂模型；指标看 **MAE、RMSE、R²**。\n\n---\n\n# 0. 命令速查\n\n## 0.1 环境：创建并激活虚拟环境\n\n```powershell\n# 在项目根目录（time-series-feature-engineering）执行\npython -m venv .venv                       # 创建虚拟环境\n.\\.venv\\Scripts\\Activate.ps1               # 激活（Windows PowerShell）\npip install -r requirements.txt            # 安装项目需要的库\n```\n\n**作用**：\n\n- 虚拟环境 = 只属于这个项目的工具箱，不会污染电脑里其他 Python 项目。\n- 激活成功后，命令行前面会出现 `(.venv)`；关掉窗口就相当于退出。\n- Mac/Linux 用 `python3 -m venv venv` 和 `source venv/bin/activate`。\n\n## 0.2 运行脚本\n\n```powershell\npython scripts\\05_time_features.py    # 运行单个脚本\n.\\run_all.ps1                         # 一键按顺序全部运行\n```\n\n**作用**：\n\n- 脚本按编号顺序有依赖：04 生成干净数据 → 05 加时间特征 → 08 加滞后滑窗 → 09 做模型对比。\n- 跳过前面的脚本直接跑 09，会提示找不到文件（`FileNotFoundError`）。\n\n## 0.3 Git 与 GitHub\n\n```powershell\ngit init                                  # 把这个文件夹变成 Git 仓库\ngit add .                                 # 把改动放进\"待提交\"区\ngit commit -m \"完成时间特征提取\"            # 存一个版本，附上说明\ngit log --oneline                         # 看历史版本\ngit remote add origin https://github.com/你的用户名/仓库名.git\ngit push -u origin main                   # 第一次推送\ngit status                                # 看当前有哪些改动（最常用）\n```\n\n**作用**：\n\n- Git 是\"存档 + 时间机器\"，每完成一小步就 `add` + `commit` 一次。\n- GitHub 是放代码的网站，导师要的是仓库链接，不是压缩包。\n- `.gitignore` 用来排除不想上传的东西（本项目已排除 `.venv/`、`data/raw/` 等）。\n\n## 0.4 网页指引、本地服务、生成手册\n\n```powershell\npython guide\\build_guide.py                                    # 重新生成网页指引\npowershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1   # 启动本地服务（能读文件夹）\npython guide\\build_handbook.py                                 # 重新生成这本手册的 PDF\n```\n\n**作用**：\n\n- 网页指引：把教程、代码、图表、实验表格放在一个页面里看。\n- 本地服务：浏览器出于安全不允许网页直接读本地文件夹，`start-server.ps1` 会开一个只服务本机的小服务器，网页里的\"项目文件\"才能读文件夹。\n- 手册 PDF：改完上面的 Markdown 后跑一次，PDF 会重新生成。\n\n---\n\n# 1. Python 基础\n\n对应脚本：`scripts/01_python_basics.py`；对应教程：`docs/02-Python零基础.md`。\n\n## 1.1 列表 list：一串有序的数据\n\n```python\nvalues = [80, 75, 90]        # 建列表\nvalues.append(60)            # 末尾加一个\nfirst = values[0]            # 取第 1 个（下标从 0 开始）\nlast = values[-1]            # 取最后一个\nprint(len(values))           # 长度：4\nprint(values[1:3])           # 切片：第 2、3 个\n```\n\n**作用**：存放一组有顺序的数据，比如一串连续的 PM2.5 观测值。\n\n## 1.2 字典 dict：按名字取值\n\n```python\nstudent = {\"name\": \"小明\", \"score\": 90}\nprint(student[\"name\"])            # 取值：小明\nstudent[\"score\"] = 95             # 改值\nstudent[\"city\"] = \"南京\"           # 加新的一对\nfor key, value in student.items():  # 遍历\n    print(key, value)\n```\n\n**作用**：用\"名字 → 值\"的方式存数据，读代码时比记 `[0]`、`[1]` 清楚得多。\n\n## 1.3 队列 deque：先进先出\n\n```python\nfrom collections import deque\n\nwindow = deque(maxlen=3)      # 只保留最近 3 个\nfor value in [10, 20, 30, 40]:\n    window.append(value)\nprint(window)                 # deque([20, 30, 40], maxlen=3)\nprint(window[0])              # 最早的那个：20\n```\n\n**作用**：维护\"最近 N 个值\"的滑动窗口；`maxlen` 会自动丢掉最旧的，这是滑动窗口最朴素的手写版本。\n\n## 1.4 循环、条件、函数\n\n```python\ndef level(pm25: float) -> str:     # 函数：输入 → 输出\n    if pm25 > 150:\n        return \"重度污染\"\n    elif pm25 > 75:\n        return \"轻度污染\"\n    return \"正常\"\n\nfor value in [30, 90, 200]:\n    print(value, level(value))\n```\n\n**作用**：\n\n- 函数把一段逻辑包起来，起个名字，后面重复用；`pm25: float` 和 `-> str` 只是提示类型，不写也能跑。\n- `for` 用来遍历一串数据，`if/elif/else` 用来分支判断。\n\n## 1.5 读文件、写文件\n\n```python\n# 读：with 会在用完以后自动关文件，推荐写法\nwith open(\"notes/学习笔记模板.md\", \"r\", encoding=\"utf-8\") as handle:\n    text = handle.read()\nprint(text[:200])                 # 只看前 200 个字符\n\n# 写：w 表示覆盖写，a 表示在末尾追加\nwith open(\"outputs/notes.txt\", \"w\", encoding=\"utf-8\") as handle:\n    handle.write(\"第一行\\n第二行\\n\")\n```\n\n**作用**：\n\n- 读写文件都要指定 `encoding=\"utf-8\"`，否则中文在 Windows 上容易乱码。\n- 读 CSV 这种表格数据时，用 pandas 更方便（见第 2 章）。\n\n## 1.6 报错怎么读\n\n```python\n# 报错最后一行才是\"错误类型 + 原因\"，先看它，再看它上面一行指出的是哪个文件哪一行\n# 例：\n#   File \"scripts\\05_time_features.py\", line 42\n#     df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\n#   KeyError: 'hour'\n```\n\n**作用**：\n\n- `KeyError: 'hour'` 意思是没有名为 `hour` 的列 —— 通常是你忘了先运行 04/05 脚本，或者列名拼错了。\n- 详细对照表见第 10 章。\n\n---\n\n# 2. pandas 基础\n\n对应脚本：`scripts/02_pandas_basics.py`；对应教程：`docs/03-pandas与SQLite.md`。\n\n## 2.1 读 CSV\n\n```python\nimport pandas as pd\n\ndf = pd.read_csv(\"data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv\")\nprint(df.shape)        # (行数, 列数)\nprint(df.head())       # 看前 5 行\nprint(df.info())       # 每列的类型、缺失情况\n```\n\n**作用**：\n\n- `pd.read_csv` 把 CSV 读成 DataFrame（可以理解成\"程序里的 Excel 表格\"）。\n- 第一步永远先 `shape` / `head` / `info`：先看清数据长什么样，再动手。\n\n## 2.2 选列、筛行、新增列\n\n```python\ndf[\"pm2.5\"]                    # 选一列（Series）\ndf[[\"year\", \"month\", \"hour\"]]  # 选多列（DataFrame）\ndf[df[\"pm2.5\"] > 100]          # 筛出 PM2.5 大于 100 的行\ndf[(df[\"year\"] == 2014) & (df[\"month\"] == 1)]   # 多个条件用 & 连接，每个条件加括号\n\ndf[\"is_weekend\"] = (df[\"dayofweek\"] >= 5).astype(int)   # 新增一列\ndf[\"temp_f\"] = df[\"TEMP\"] * 9 / 5 + 32                  # 用已有列算新列\n```\n\n**作用**：\n\n- 特征工程的大部分工作就是\"新增列\"：把原始信息加工成模型能用的数字。\n- `.astype(int)` 把 True/False 变成 1/0，模型更喜欢数字。\n\n## 2.3 排序、去重、缺失值\n\n```python\ndf = df.sort_values(\"datetime\")          # 按时间排序\ndf = df.drop_duplicates(subset=\"datetime\")   # 去掉重复时间戳\n\ndf.isna().sum()                          # 每列有多少缺失值\ndf[\"pm2.5\"].isna().sum()                 # 目标列缺失多少\ndf = df.dropna(subset=[\"pm25_next\"])     # 删掉\"答案缺失\"的行\ndf[\"pm2.5\"] = df[\"pm2.5\"].interpolate(method=\"linear\", limit=6, limit_direction=\"both\")\n```\n\n**作用**：\n\n- 时序数据的第一原则：**先排序、再检查重复和缺失**。\n- `interpolate(limit=6)` = 最多连续补 6 个小时；补不了的宁可留着，别硬猜（详细理由见 3.3）。\n\n## 2.4 groupby：分组统计\n\n```python\ndf.groupby(\"hour\")[\"pm2.5\"].mean()               # 每个小时的平均 PM2.5\ndf.groupby(\"dayofweek\")[\"pm2.5\"].agg([\"mean\", \"std\", \"count\"])\ndf.groupby([\"is_weekend\", \"hour\"])[\"pm2.5\"].mean()   # 多列组合分组\n```\n\n**作用**：\n\n- 这是观察\"周期性\"最快的办法：如果不同小时的平均值差别明显，说明时间里有可用的信号。\n- 结果通常直接画成柱状图（见第 8 章）。\n\n## 2.5 时间列处理\n\n```python\ndf[\"datetime\"] = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]])  # 多列拼成一个时间\ndf[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"UTC\")                  # 声明\"这本来就是 UTC\"\ndf = df.set_index(\"datetime\").sort_index()                             # 时间当索引，再排序\ndf.index.hour          # 取小时；同类还有 .year .month .day .dayofweek .dayofyear\n```\n\n**作用**：\n\n- 时间必须是真正的 datetime 类型，不能是字符串，否则没法做 `shift`、`rolling` 这些时间操作。\n- 设成索引以后，`df.index.year` 就是每行的年份，写起来短。\n\n## 2.6 保存 CSV\n\n```python\ndf.to_csv(\"data/processed/pm25_clean.csv\", encoding=\"utf-8-sig\")\n```\n\n**作用**：\n\n- `encoding=\"utf-8-sig\"` 让 Excel 打开中文表头不乱码，Windows 上推荐。\n- `index=True`（默认）会把时间索引也写进去，这样别的脚本才能读回时间。\n\n---\n\n# 3. 时间戳处理\n\n对应脚本：`scripts/04_load_clean.py`；对应教程：`docs/04-时序特征工程核心.md`。\n\n## 3.1 拼出 UTC 时间列\n\n```python\nimport pandas as pd\n\ndt = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]])\ndf[\"datetime\"] = dt.dt.tz_localize(\"UTC\")\n```\n\n**作用**：\n\n- 原始数据把时间拆成 4 列存，这一步把它们拼成一个带时区的时间列。\n- `tz_localize` 的意思是\"这些数字本来就是 UTC 时间\"；如果原始时间是北京时间，就要先 `tz_localize(\"Asia/Shanghai\")` 再 `tz_convert(\"UTC\")`。\n- 统一 UTC 是为了避免\"两份数据一个用北京时间、一个用 UTC，合并后差 8 小时\"。\n\n## 3.2 排序 + 补齐完整时间轴\n\n```python\ndf = df.set_index(\"datetime\").sort_index()\ndf = df.asfreq(\"h\")          # 保证每个整点都有一行，缺的补成 NaN\n\nexpected = pd.date_range(df.index.min(), df.index.max(), freq=\"h\")\nprint(len(expected), len(df), len(expected) - len(df))   # 应该有 / 实际有 / 缺多少\n```\n\n**作用**：\n\n- `asfreq(\"h\")` 让\"每隔一小时一行\"变成硬约束。\n- 为什么必须补：如果不补，`shift(24)` 表示的是\"往前数 24 行\"，而不是\"24 小时前\"，遇到缺口就会错位，`rolling(24)` 也一样。\n\n## 3.3 缺失值：短缺口插值，长缺口保留\n\n```python\ndf[\"pm25_was_missing\"] = df[\"pm2.5\"].isna().astype(int)   # 留个标记，方便以后分析\ndf[\"pm2.5\"] = df[\"pm2.5\"].interpolate(method=\"linear\", limit=6, limit_direction=\"both\")\n```\n\n**作用**：\n\n- 连续缺失不超过 6 小时 → 用前后值线性插值补上（相邻小时污染水平接近，这样猜比较合理）。\n- 连续缺失很久 → 保留 NaN，不硬猜；建模时按用到的特征删掉这些行。\n- 插值也是\"猜\"，必须在报告里写清楚处理方式，不能装作数据本来没有缺失。\n\n## 3.4 时区换算（要看北京作息时）\n\n```python\ndf[\"hour_beijing\"] = (df[\"hour\"] + 8) % 24                      # 简便算法\ndf[\"datetime_beijing\"] = df.index.tz_convert(\"Asia/Shanghai\")   # 正规做法\n```\n\n**作用**：\n\n- 本项目统一用 UTC 讲解；UTC 08:00 = 北京 16:00。\n- 想研究\"北京早高峰\"，就加上 `hour_beijing` 这一列再分组看。\n\n---\n\n# 4. 时间特征\n\n对应脚本：`scripts/05_time_features.py`。\n\n## 4.1 日历特征\n\n```python\nindex = df.inde
