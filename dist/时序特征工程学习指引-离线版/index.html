eError: could not convert string to float 该是数字的列里混了文字/空值 df[\"列\"].head() 看看内容；必要时 pd.to_numeric(errors=\"coerce\") TypeError: unsupported operand type(s) 字符串当数字算了 检查这列的 dtype （ df.dtypes ），先转换类型 SettingWithCopyWarning 在切片副本上改数据 先 .copy() ，再赋值： part = df.iloc[:100].copy() UnicodeDecodeError: 'utf-8' codec can't decode 文件不是 UTF-8（常见 GBK） 读的时候加 encoding=\"gbk\" ；写 CSV 用 utf-8-sig CSV 用 Excel 打开中文乱码 编码不是 Excel 认的格式 保存时用 encoding=\"utf-8-sig\" matplotlib 中文变方框 没设置中文字体 加 plt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\"] 服务器提示端口被占用 8765 已被别的程序占用 换端口： start-server.ps1 -Port 8899 Git fatal: not a git repository 当前目录还不是仓库 在项目根目录先 git init Git failed to push / 要登录 远端仓库或凭据问题 git remote -v 检查地址；按提示登录 GitHub PermissionError: [Errno 13] 文件被 Excel 等程序占用 关掉正在打开的文件再运行脚本 通用排查三步 ： 看报错 最后一行 （错误类型 + 原因），再看它指出的是哪个文件哪一行。 打开那个文件、找到那一行，想想这一行需要什么（列？文件？库？）。 还没头绪就把整段报错复制去搜索，或者把\"最后一行 + 代码那几行\"发给同学/导师。 附录 A 特征清单（可直接抄进报告） 特征名 构造方法 含义 可能的作用 year index.year 年份 捕捉长期趋势 month index.month 月份 1–12 捕捉季节变化 day index.day 几号 通常用处不大，容易过拟合 hour index.hour 小时 0–23 捕捉一天内的变化 dayofweek index.dayofweek 0=周一…6=周日 工作日/周末差异 is_weekend dayofweek >= 5 是否周末 0/1 简单明了的周末效应 dayofyear index.dayofyear 一年中的第几天 更细的季节位置 hour_sin / hour_cos sin(2π·hour/24) / cos(...) 小时在圆上的坐标 让 23 点和 0 点变近 dayofweek_sin / dayofweek_cos sin(2π·dow/7) / cos(...) 星期在圆上的坐标 表达\"周而复始\" month_sin / month_cos sin(2π·(month-1)/12) 月份在圆上的坐标 表达季节循环 pm25_now 原列 当前小时的值 惯性，最强特征之一 pm25_lag1 / lag2 / lag3 shift(1/2/3) 前 1~3 小时的值 近期惯性 pm25_lag24 shift(24) 昨天同一小时 日周期 pm25_lag168 shift(168) 上周同一小时 周周期 pm25_diff1 / diff24 diff(1) / diff(24) 相比上一小时/昨天同小时的变化 趋势与突变 pm25_roll24_mean/std/max/min rolling(24).mean()/std()/max()/min() 最近 24 小时统计 水平、波动、极值 pm25_roll168_mean/std rolling(168) 最近 7 天统计 周级别水平与波动 TEMP_lag1 / TEMP_roll24_mean 对温度做同样的操作 温度的历史信息 说明方法可迁移到其他列 一句话模板 ： xxx 特征是用 xxx 方法构造的，它让模型知道 xxx，加入后 MAE 从 __ 降到 __。 附录 B 本项目的实验结论（真实数字） B.1 特征对照实验（ outputs/tables/09_model_comparison.csv ） 实验 特征 切分方式 MAE RMSE R² 是否可信 平均值基线 无 按时间 8:2 64.740 82.470 -0.0286 可信 持续法 1.1 GitHub 仓库<\/h3>\n<ul>\n<li>[ ] 仓库名：<code>time-series-feature-engineering<\/code><\/li>\n<li>[ ] 根目录有 <code>README.md<\/code>，写清楚项目做什么、怎么运行；<\/li>\n<li>[ ] 有 <code>requirements.txt<\/code>；<\/li>\n<li>[ ] 有 <code>scripts/<\/code> 全部代码；<\/li>\n<li>[ ] 有 <code>docs/<\/code> 教程文档（可选，但很加分）；<\/li>\n<li>[ ] 有 <code>notes/学习笔记模板.md<\/code>（已填写）；<\/li>\n<li>[ ] 有 <code>notes/实验记录模板.md<\/code>（已填写）；<\/li>\n<li>[ ] 有 <code>outputs/figures/<\/code> 里的图（可以提交，也可以说明怎么生成）；<\/li>\n<li>[ ] <code>.gitignore<\/code> 里排除了 <code>.venv/<\/code> 和原始大数据。<\/li>\n<\/ul>\n<h3>1.2 笔记<\/h3>\n<ul>\n<li>[ ] 每个特征都有：怎么构造、什么意思、预期作用、实验结果、结论；<\/li>\n<li>[ ] 至少写 5 个特征；<\/li>\n<li>[ ] 有\"踩坑记录\"：遇到过什么报错、怎么解决；<\/li>\n<li>[ ] 有实验记录：至少 3 组对照。<\/li>\n<\/ul>\n<h3>1.3 图表<\/h3>\n<ul>\n<li>[ ] 原始序列图；<\/li>\n<li>[ ] 滑动平均 + 差分图；<\/li>\n<li>[ ] 周期性图（小时/星期/月份）；<\/li>\n<li>[ ] 预测对比图；<\/li>\n<li>[ ] 周期编码圆；<\/li>\n<li>[ ] 相关性热力图。<\/li>\n<\/ul>\n<p>每张图下面要能说出 2–3 句话，不要只贴图。<\/p>\n<h3>1.4 报告<\/h3>\n<ul>\n<li>[ ] 一页到两页；<\/li>\n<li>[ ] 包含：目标、数据、方法、特征、结果、结论、局限；<\/li>\n<li>[ ] 数字准确（和 CSV 对得上）；<\/li>\n<li>[ ] 结论具体（不要写\"效果不错\"这种空话）。<\/li>\n<\/ul>\n<hr />\n<h2>2. 一页报告模板（直接照着填）<\/h2>\n<pre><code class=\"language-markdown\"># 时序数据集特征工程实验报告\n\n## 1. 实验目标\n\n本实验使用 ____ 数据集，目标是在时间 t 使用截至 t 的信息，预测 ____。\n重点研究：时间特征、周期编码、滞后特征、滑动窗口特征对预测效果的影响。\n\n## 2. 数据\n\n- 数据来源：UCI 北京 PM2.5 数据；\n- 时间范围：2010-01-01 至 2014-12-31，UTC，每小时一条，共 43824 条；\n- 目标列：pm2.5；\n- 缺失情况：pm2.5 缺失 2067 条（4.72%）；\n- 处理方式：保持完整小时时间轴；连续缺失不超过 6 小时的做线性插值；\n  长缺口保留 NaN；建模时按使用的特征删除无法计算的行。\n\n## 3. 方法\n\n- 预测目标：t+1 时刻的 pm2.5；\n- 模型：线性回归（LinearRegression）；\n- 切分方式：按时间前 80% 训练，后 20% 测试；\n- 指标：MAE、RMSE、R²。\n\n## 4. 特征工程\n\n| 特征组 | 具体特征 | 构造方法 |\n| --- | --- | --- |\n| 日历 | month、day、hour、dayofweek、is_weekend、dayofyear | 从 UTC 时间索引提取 |\n| 周期编码 | hour_sin/cos、dayofweek_sin/cos、month_sin/cos | sin(2πx/T)、cos(2πx/T) |\n| 滞后 | pm25_lag1/2/3/24/168、diff1、diff24 | shift(k)、diff(k) |\n| 滑动窗口 | roll24 的 mean/std/max/min、roll168 的 mean/std | rolling(window, min_periods) |\n| 天气 | TEMP、DEWP、PRES、Iws、Is、Ir | 原始列 + 少量滞后/滑窗 |\n\n防泄漏措施：\n1. 目标用 shift(-1)，特征只用 t 及更早的数据；\n2. 滑动窗口使用 trailing window，不使用 center=True；\n3. 训练/测试按时间切分，不随机打乱；\n4. 所有插值和统计都不使用测试期未来信息。\n\n## 5. 实验结果\n\n| 实验 | MAE | RMSE | R² | 是否可信 |\n| --- | --- | --- | --- | --- |\n| 平均值基线 | 64.740 | 82.470 | -0.0286 | 可信 |\n| 持续法基线 | 10.981 | 19.968 | 0.9397 | 可信 |\n| 只用原始时间特征 | 62.576 | 81.323 | -0.0002 | 可信 |\n| 只用周期编码时间 | 62.656 | 80.601 | 0.0175 | 可信 |\n| 周期编码 + 滞后 | 10.934 | 19.670 | 0.9415 | 可信 |\n| 完整正确版 | 10.754 | 19.473 | 0.9426 | 可信 |\n| 中心滑动窗口 | 10.413 | 18.112 | 0.9504 | 不可信（泄漏） |\n| 把答案当特征 | 0.000 | 0.000 | 1.0000 | 不可信（作弊） |\n| 随机切分 | 12.430 | 21.106 | 0.9494 | 不可信（方法错） |\n\n消融实验：\n\n| 实验 | MAE | R² | 结论 |\n| --- | --- | --- | --- |\n| 完整特征 | 10.754 | 0.9426 | 基准 |\n| 去掉滞后 | 33.376 | 0.6892 | 滞后最重要 |\n| 去掉滑动窗口 | 10.804 | 0.9424 | 影响很小 |\n| 去掉天气 | 10.885 | 0.9417 | 影响很小 |\n| 只留时间特征 | 62.656 | 0.0175 | 远远不够 |\n\n## 6. 结论\n\n1. 只使用时间特征时，模型几乎无法预测下一小时的 PM2.5\n   （MAE 62.656，R² 0.0175），说明&quot;看钟表&quot;本身信息有限。\n2. 持续法基线 MAE 10.981、R² 0.9397，说明 PM2.5 相邻小时高度相关。\n3. 加入滞后特征后，MAE 从 62.656 降到 10.934，提升最大。\n4. 在滞后特征基础上，滑动窗口和天气特征只带来小幅提升\n   （MAE 10.934 → 10.754）。\n5. 周期编码在本实验中作用有限：R² 略升，但 MAE 没有明显下降。\n6. 中心滑动窗口得分看起来更好（MAE 10.413），但它使用了未来数据，\n   属于数据泄漏；把答案当特征时 R²=1.0000，进一步说明&quot;异常好的分数&quot;要警惕。\n\n## 7. 局限与下一步\n\n- 本实验只使用了线性回归，换用树模型结论可能不同；\n- 预测目标只有下一小时，预测 t+24 时滞后和滑窗的作用可能更明显；\n- 只做了单步预测，还没有做多步预测；\n- 下一步计划：尝试 HistGradientBoostingRegressor，预测 t+24，\n  并做滚动时间验证。\n\n## 8. 复现方式\n\n```powershell\npython -m venv .venv\n.\\.venv\\Scripts\\Activate.ps1\npip install -r requirements.txt\n.\\run_all.ps1\n<\/code><\/pre>\n<p>结果在 <code>outputs/tables/09_model_comparison.csv<\/code> 和 <code>outputs/figures/<\/code>。\n```<\/p>\n<hr />\n<h2>3. 五分钟答辩/汇报怎么说<\/h2>\n<p>按这个顺序讲，不要念代码：<\/p>\n<ol>\n<li><strong>问题是什么<\/strong>（30 秒）\n   \"我要预测下一小时的 PM2.5。\"<\/li>\n<li><strong>数据怎么处理<\/strong>（30 秒）\n   \"43824 小时，UTC。保持完整时间轴，短缺口插值，长缺口保留。\"<\/li>\n<li><strong>我造了哪些特征<\/strong>（1 分钟）\n   \"三类：日历特征、周期编码、滞后和滑动窗口。\"<\/li>\n<li><strong>怎么防止用未来数据<\/strong>（1 分钟）\n   \"目标 shift(-1)；特征只用 t 及更早；按时间切分；不用 center=True。\"<\/li>\n<li><strong>结果是什么<\/strong>（1 分钟）\n   \"时间特征几乎没用，滞后特征提升最大，滑窗和天气小幅提升。\"<\/li>\n<li><strong>我踩了什么坑<\/strong>（30 秒）\n   \"一开始直接删缺失行，时间轴断了；后来改成保持完整小时轴。\"<\/li>\n<li><strong>下一步<\/strong>（30 秒）\n   \"预测 t+24，换树模型，做滚动验证。\"<\/li>\n<\/ol>\n<p>如果老师问\"哪个特征最有用\"，回答：<\/p>\n<blockquote>\n<p>在这份数据和这个任务里，当前值和 lag1 最有用。\n证据是消融实验：去掉全部滞后特征后，MAE 从 10.754 变成 33.376。\n滑动窗口和天气只带来约 0.1 的提升。<\/p>\n<\/blockquote>\n<hr />\n<h2>4. 最后的自检<\/h2>\n<p>交之前问自己：<\/p>\n<ul>\n<li>[ ] 我的 README 能让同学从零跑通吗？<\/li>\n<li>[ ] 我的实验数字和 CSV 对得上吗？<\/li>\n<li>[ ] 我有没有把 <code>_leaky<\/code> 特征写进\"正式模型\"？<\/li>\n<li>[ ] 我的结论有没有过度夸大？<\/li>\n<li>[ ] 我能不能解释每一个用到的特征？<\/li>\n<li>[ ] 我有没有记录失败和踩坑？<\/li>\n<\/ul>\n<p>只要这 6 个问题都是\"是\"，这份作业就比大多数\"复制粘贴跑个分数\"的作业扎实得多。<\/p>\n<hr />\n<p>祝顺利。遇到报错看 <code>99-报错急救.md<\/code>。<\/p>","plain":"07 交作业清单与报告模板 这一课告诉你：做完项目后，到底要交什么、怎么组织、怎么写得像\"做过科研\"。 1. 交付清单 1.1 GitHub 仓库 [ ] 仓库名： time-series-feature-engineering [ ] 根目录有 README.md ，写清楚项目做什么、怎么运行； [ ] 有 requirements.txt ； [ ] 有 scripts/ 全部代码； [ ] 有 docs/ 教程文档（可选，但很加分）； [ ] 有 notes/学习笔记模板.md （已填写）； [ ] 有 notes/实验记录模板.md （已填写）； [ ] 有 outputs/figures/ 里的图（可以提交，也可以说明怎么生成）； [ ] .gitignore 里排除了 .venv/ 和原始大数据。 1.2 笔记 [ ] 每个特征都有：怎么构造、什么意思、预期作用、实验结果、结论； [ ] 至少写 5 个特征； [ ] 有\"踩坑记录\"：遇到过什么报错、怎么解决； [ ] 有实验记录：至少 3 组对照。 1.3 图表 [ ] 原始序列图； [ ] 滑动平均 + 差分图； [ ] 周期性图（小时/星期/月份）； [ ] 预测对比图； [ ] 周期编码圆； [ ] 相关性热力图。 每张图下面要能说出 2–3 句话，不要只贴图。 1.4 报告 [ ] 一页到两页； [ ] 包含：目标、数据、方法、特征、结果、结论、局限； [ ] 数字准确（和 CSV 对得上）； [ ] 结论具体（不要写\"效果不错\"这种空话）。 2. 一页报告模板（直接照着填） # 时序数据集特征工程实验报告 ## 1. 实验目标 本实验使用 ____ 数据集，目标是在时间 t 使用截至 t 的信息，预测 ____。 重点研究：时间特征、周期编码、滞后特征、滑动窗口特征对预测效果的影响。 ## 2. 数据 - 数据来源：UCI 北京 PM2.5 数据； - 时间范围：2010-01-01 至 2014-12-31，UTC，每小时一条，共 43824 条； - 目标列：pm2.5； - 缺失情况：pm2.5 缺失 2067 条（4.72%）； - 处理方式：保持完整小时时间轴；连续缺失不超过 6 小时的做线性插值； 长缺口保留 NaN；建模时按使用的特征删除无法计算的行。 ## 3. 方法 - 预测目标：t+1 时刻的 pm2.5； - 模型：线性回归（LinearRegression）； - 切分方式：按时间前 80% 训练，后 20% 测试； - 指标：MAE、RMSE、R²。 ## 4. 特征工程 | 特征组 | 具体特征 | 构造方法 | | --- | --- | --- | | 日历 | month、day、hour、dayofweek、is_weekend、dayofyear | 从 UTC 时间索引提取 | | 周期编码 | hour_sin/cos、dayofweek_sin/cos、month_sin/cos | sin(2πx/T)、cos(2πx/T) | | 滞后 | pm25_lag1/2/3/24/168、diff1、diff24 | shift(k)、diff(k) | | 滑动窗口 | roll24 的 mean/std/max/min、roll168 的 mean/std | rolling(window, min_periods) | | 天气 | TEMP、DEWP、PRES、Iws、Is、Ir | 原始列 + 少量滞后/滑窗 | 防泄漏措施： 1. 目标用 shift(-1)，特征只用 t 及更早的数据； 2. 滑动窗口使用 trailing window，不使用 center=True； 3. 训练/测试按时间切分，不随机打乱； 4. 所有插值和统计都不使用测试期未来信息。 ## 5. 实验结果 | 实验 | MAE | RMSE | R² | 是否可信 | | --- | --- | --- | --- | --- | | 平均值基线 | 64.740 | 82.470 | -0.0286 | 可信 | | 持续法基线 | 10.981 | 19.968 | 0.9397 | 可信 | | 只用原始时间特征 | 62.576 | 81.323 | -0.0002 | 可信 | | 只用周期编码时间 | 62.656 | 80.601 | 0.0175 | 可信 | | 周期编码 + 滞后 | 10.934 | 19.670 | 0.9415 | 可信 | | 完整正确版 | 10.754 | 19.473 | 0.9426 | 可信 | | 中心滑动窗口 | 10.413 | 18.112 | 0.9504 | 不可信（泄漏） | | 把答案当特征 | 0.000 | 0.000 | 1.0000 | 不可信（作弊） | | 随机切分 | 12.430 | 21.106 | 0.9494 | 不可信（方法错） | 消融实验： | 实验 | MAE | R² | 结论 | | --- | --- | --- | --- | | 完整特征 | 10.754 | 0.9426 | 基准 | | 去掉滞后 | 33.376 | 0.6892 | 滞后最重要 | | 去掉滑动窗口 | 10.804 | 0.9424 | 影响很小 | | 去掉天气 | 10.885 | 0.9417 | 影响很小 | | 只留时间特征 | 62.656 | 0.0175 | 远远不够 | ## 6. 结论 1. 只使用时间特征时，模型几乎无法预测下一小时的 PM2.5 （MAE 62.656，R² 0.0175），说明\"看钟表\"本身信息有限。 2. 持续法基线 MAE 10.981、R² 0.9397，说明 PM2.5 相邻小时高度相关。 3. 加入滞后特征后，MAE 从 62.656 降到 10.934，提升最大。 4. 在滞后特征基础上，滑动窗口和天气特征只带来小幅提升 （MAE 10.934 → 10.754）。 5. 周期编码在本实验中作用有限：R² 略升，但 MAE 没有明显下降。 6. 中心滑动窗口得分看起来更好（MAE 10.413），但它使用了未来数据， 属于数据泄漏；把答案当特征时 R²=1.0000，进一步说明\"异常好的分数\"要警惕。 ## 7. 局限与下一步 - 本实验只使用了线性回归，换用树模型结论可能不同； - 预测目标只有下一小时，预测 t+24 时滞后和滑窗的作用可能更明显； - 只做了单步预测，还没有做多步预测； - 下一步计划：尝试 HistGradientBoostingRegressor，预测 t+24， 并做滚动时间验证。 ## 8. 复现方式 ```powershell python -m venv .venv .\\.venv\\Scripts\\Activate.ps1 pip install -r requirements.txt .\\run_all.ps1 结果在 outputs/tables/09_model_comparison.csv 和 outputs/figures/ 。 ``` 3. 五分钟答辩/汇报怎么说 按这个顺序讲，不要念代码： 问题是什么 （30 秒） \"我要预测下一小时的 PM2.5。\" 数据怎么处理 （30 秒） \"43824 小时，UTC。保持完整时间轴，短缺口插值，长缺口保留。\" 我造了哪些特征 （1 分钟） \"三类：日历特征、周期编码、滞后和滑动窗口。\" 怎么防止用未来数据 （1 分钟） \"目标 shift(-1)；特征只用 t 及更早；按时间切分；不用 center=True。\" 结果是什么 （1 分钟） \"时间特征几乎没用，滞后特征提升最大，滑窗和天气小幅提升。\" 我踩了什么坑 （30 秒） \"一开始直接删缺失行，时间轴断了；后来改成保持完整小时轴。\" 下一步 （30 秒） \"预测 t+24，换树模型，做滚动验证。\" 如果老师问\"哪个特征最有用\"，回答： 在这份数据和这个任务里，当前值和 lag1 最有用。 证据是消融实验：去掉全部滞后特征后，MAE 从 10.754 变成 33.376。 滑动窗口和天气只带来约 0.1 的提升。 4. 最后的自检 交之前问自己： [ ] 我的 README 能让同学从零跑通吗？ [ ] 我的实验数字和 CSV 对得上吗？ [ ] 我有没有把 _leaky 特征写进\"正式模型\"？ [ ] 我的结论有没有过度夸大？ [ ] 我能不能解释每一个用到的特征？ [ ] 我有没有记录失败和踩坑？ 只要这 6 个问题都是\"是\"，这份作业就比大多数\"复制粘贴跑个分数\"的作业扎实得多。 祝顺利。遇到报错看 99-报错急救.md 。"},{"id":"errors","title":"报错急救","group":"教程","icon":"life-buoy","file":"docs/99-报错急救.md","summary":"最常见报错的原因和解决办法。","html":"<h1>99 报错急救：先在表里找，再决定要不要问人<\/h1>\n<h2>0. 通用三步<\/h2>\n<ol>\n<li><strong>看最后一行<\/strong>：错误类型 + 原因；<\/li>\n<li><strong>看文件名和行号<\/strong>：哪一行代码出错；<\/li>\n<li><strong>看上下文<\/strong>：出错前运行了什么命令、数据文件存在吗。<\/li>\n<\/ol>\n<p>不要一看到红字就关掉终端。Python 的报错其实是在告诉你哪里出了问题。<\/p>\n<hr />\n<h2>1. 环境类错误<\/h2>\n<h3><code>'python' 不是内部或外部命令<\/code><\/h3>\n<p><strong>原因<\/strong>：没装 Python，或者安装时没勾选 \"Add Python to PATH\"。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<ol>\n<li>重新安装 Python，勾选 \"Add python.exe to PATH\"；<\/li>\n<li>或者用 <code>py --version<\/code> 试试；<\/li>\n<li>装完重开 PowerShell。<\/li>\n<\/ol>\n<h3>虚拟环境激活失败：<code>Activate.ps1 cannot be loaded because running scripts is disabled<\/code><\/h3>\n<p><strong>解决<\/strong>：<\/p>\n<pre><code class=\"language-powershell\">Set-ExecutionPolicy -Scope Process Bypass\n.\\.venv\\Scripts\\Activate.ps1\n<\/code><\/pre>\n<h3><code>ModuleNotFoundError: No module named 'pandas'<\/code><\/h3>\n<p><strong>原因<\/strong>：没装库，或者没激活虚拟环境。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<pre><code class=\"language-powershell\">.\\.venv\\Scripts\\Activate.ps1\npip install -r requirements.txt\n<\/code><\/pre>\n<p>如果提示 <code>pip<\/code> 不是命令，用：<\/p>\n<pre><code class=\"language-powershell\">python -m pip install -r requirements.txt\n<\/code><\/pre>\n<h3><code>pip<\/code> 下载很慢或超时<\/h3>\n<p>换国内镜像：<\/p>\n<pre><code class=\"language-powershell\">python -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple\n<\/code><\/pre>\n<hr />\n<h2>2. 文件类错误<\/h2>\n<h3><code>FileNotFoundError: [Errno 2] No such file or directory: ...<\/code><\/h3>\n<p><strong>原因<\/strong>：文件不存在，或者你在错误的文件夹运行脚本。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<ol>\n<li>用 <code>Get-Location<\/code> 确认在项目根目录；<\/li>\n<li>先运行生成数据的上一个脚本：<\/li>\n<\/ol>\n<pre><code class=\"language-powershell\">python scripts\\download_data.py\npython scripts\\04_load_clean.py\npython scripts\\05_time_features.py\npython scripts\\08_lag_rolling_features.py\n<\/code><\/pre>\n<ol start=\"3\">\n<li>注意脚本的运行顺序：<\/li>\n<\/ol>\n<pre><code class=\"language-text\">download_data → 04 → 05 → 06/07/08 → 09 → 10\n<\/code><\/pre>\n<h3><code>UnicodeDecodeError<\/code><\/h3>\n<p><strong>原因<\/strong>：文件编码不是 UTF-8。<\/p>\n<p><strong>解决<\/strong>：本项目读写 CSV 时统一用：<\/p>\n<pre><code class=\"language-python\">pd.read_csv(path, encoding=&quot;utf-8-sig&quot;)\ndf.to_csv(path, index=False, encoding=&quot;utf-8-sig&quot;)\n<\/code><\/pre>\n<h3>终端中文乱码<\/h3>\n<pre><code class=\"language-powershell\">chcp 65001\n[Console]::OutputEncoding = [System.Text.Encoding]::UTF8\n$env:PYTHONIOENCODING = &quot;utf-8&quot;\n<\/code><\/pre>\n<p>然后重新运行脚本。<\/p>\n<h3><code>PermissionError: [Errno 13] Permission denied<\/code><\/h3>\n<p><strong>原因<\/strong>：文件被 Excel/WPS 打开着，或者没有写权限。<\/p>\n<p><strong>解决<\/strong>：关闭正在打开该 CSV/图片的软件，再运行脚本。<\/p>\n<hr />\n<h2>3. pandas 类错误<\/h2>\n<h3><code>KeyError: 'pm2.5'<\/code><\/h3>\n<p><strong>原因<\/strong>：列名写错了，或者数据没有读对。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<pre><code class=\"language-python\">print(df.columns.tolist())\n<\/code><\/pre>\n<p>把列名打印出来，一个一个对照。注意大小写和空格：<\/p>\n<ul>\n<li><code>pm2.5<\/code> 和 <code>pm25<\/code> 不是一回事；<\/li>\n<li><code>TEMP<\/code> 和 <code>temp<\/code> 不是一回事。<\/li>\n<\/ul>\n<h3><code>SettingWithCopyWarning<\/code><\/h3>\n<p><strong>原因<\/strong>：你对一个\"切片\"做修改，pandas 不确定你改的是原表还是副本。<\/p>\n<p><strong>解决<\/strong>：在筛选后加 <code>.copy()<\/code>：<\/p>\n<pre><code class=\"language-python\">subset = df[df[&quot;pm2.5&quot;] &gt; 100].copy()\nsubset[&quot;new_col&quot;] = 1\n<\/code><\/pre>\n<h3><code>ValueError: Input contains NaN<\/code><\/h3>\n<p><strong>原因<\/strong>：模型不允许特征里有缺失值。<\/p>\n<p><strong>解决<\/strong>：在训练前明确处理：<\/p>\n<pre><code class=\"language-python\">df = df.dropna(subset=feature_columns + [&quot;target&quot;])\n<\/code><\/pre>\n<p>或者填补：<\/p>\n<pre><code class=\"language-python\">df[feature_columns] = df[feature_columns].fillna(df[feature_columns].median())\n<\/code><\/pre>\n<p>但要注意：用中位数/均值填补时，只能从训练集算统计量，不能用测试集。<\/p>\n<h3><code>ValueError: could not convert string to float<\/code><\/h3>\n<p><strong>原因<\/strong>：特征里有字符串列，例如 <code>cbwd<\/code>（风向）。<\/p>\n<p><strong>解决<\/strong>：要么删掉这列，要么做独热编码：<\/p>\n<pre><code class=\"language-python\">df = pd.get_dummies(df, columns=[&quot;cbwd&quot;], drop_first=True)\n<\/code><\/pre>\n<h3>关于 <code>NaN<\/code> 的一个提醒<\/h3>\n<p><code>NaN<\/code>（Not a Number）表示缺失值。它和 0 完全不同：<\/p>\n<ul>\n<li>0 是\"知道它等于 0\"；<\/li>\n<li>NaN 是\"不知道它等于多少\"。<\/li>\n<\/ul>\n<p>不要把 NaN 直接改成 0 就完事，除非你确定 0 有物理意义。<\/p>\n<hr />\n<h2>4. 时间序列特有错误<\/h2>\n<h3><code>shift<\/code> 之后出现一堆 NaN<\/h3>\n<p><strong>原因<\/strong>：shift 会让开头几行没有值，这是正常的。例如 <code>shift(168)<\/code> 前 168 行都是 NaN。<\/p>\n<p><strong>解决<\/strong>：在建模前按用到的特征删除：<\/p>\n<pre><code class=\"language-python\">df = df.dropna(subset=[&quot;pm25_lag168&quot;, &quot;pm25_roll168_mean&quot;, &quot;pm25_next&quot;])\n<\/code><\/pre>\n<h3>删缺失行之后，lag24 不是 24 小时前<\/h3>\n<p><strong>原因<\/strong>：删行让时间轴断了。<\/p>\n<p><strong>解决<\/strong>：保持完整小时时间轴：<\/p>\n<pre><code class=\"language-python\">df = df.set_index(&quot;datetime&quot;).sort_index().asfreq(&quot;h&quot;)\n<\/code><\/pre>\n<p>短缺口插值，长缺口保留 NaN，建模时再删除无法计算的行。<\/p>\n<h3>模型分数高得离谱（R² &gt; 0.99）<\/h3>\n<p><strong>第一反应<\/strong>：检查数据泄漏。<\/p>\n<ul>\n<li>特征里有没有 <code>shift(-1)<\/code>、<code>center=True<\/code>；<\/li>\n<li>有没有把目标列本身当特征；<\/li>\n<li>有没有先在全量数据上算统计量再切分；<\/li>\n<li>有没有随机切分时间序列。<\/li>\n<\/ul>\n<p>本项目的 <code>_leaky<\/code> 特征就是反面教材，千万不要放进正式模型。<\/p>\n<h3><code>rolling<\/code> 结果前面全是 NaN<\/h3>\n<p><strong>原因<\/strong>：窗口还没凑满。例如 <code>rolling(24)<\/code> 前 23 行都是 NaN。<\/p>\n<p><strong>解决<\/strong>：这是正常现象。可以用 <code>min_periods<\/code> 放宽，但要写清楚理由：<\/p>\n<pre><code class=\"language-python\">df[&quot;roll24_mean&quot;] = df[&quot;pm2.5&quot;].rolling(24, min_periods=18).mean()\n<\/code><\/pre>\n<hr />\n<h2>5. sklearn 类错误<\/h2>\n<h3><code>ValueError: Found input variables with inconsistent numbers of samples<\/code><\/h3>\n<p><strong>原因<\/strong>：X 和 y 的行数不一样。<\/p>\n<p><strong>解决<\/strong>：打印行数：<\/p>\n<pre><code class=\"language-python\">print(x_train.shape, y_train.shape)\nprint(x_test.shape, y_test.shape)\n<\/code><\/pre>\n<p>确保它们都来自同一个 <code>train<\/code> / <code>test<\/code> 表。<\/p>\n<h3><code>ValueError: Expected 2D array, got 1D array instead<\/code><\/h3>\n<p><strong>原因<\/strong>：sklearn 的模型要求 X 是二维表格（很多列），不是一维 Series。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<pre><code class=\"language-python\">x_train = train[[&quot;pm25_lag1&quot;]]   # 注意双层方括号\n<\/code><\/pre>\n<h3>模型分数是负数<\/h3>\n<p>R² 负数表示模型比\"永远猜平均值\"还差。常见原因：<\/p>\n<ul>\n<li>特征没有信息；<\/li>\n<li>数据泄漏或切分错误；<\/li>\n<li>训练集和测试集分布差异太大；<\/li>\n<li>有极端异常值。<\/li>\n<\/ul>\n<p>先回到基线：你的模型有没有打赢\"平均值\"和\"持续法\"？<\/p>\n<hr />\n<h2>6. Git / GitHub 类错误<\/h2>\n<h3><code>fatal: not a git repository<\/code><\/h3>\n<p><strong>原因<\/strong>：当前文件夹没有初始化 Git。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<pre><code class=\"language-powershell\">cd 正确的项目文件夹\ngit init\n<\/code><\/pre>\n<h3><code>git push<\/code> 提示 <code>rejected<\/code> / <code>fetch first<\/code><\/h3>\n<p><strong>原因<\/strong>：GitHub 上的版本比本地新。<\/p>\n<p><strong>解决<\/strong>（确保本地修改已提交）：<\/p>\n<pre><code class=\"language-powershell\">git pull --rebase origin main\ngit push\n<\/code><\/pre>\n<h3><code>remote origin already exists<\/code><\/h3>\n<p><strong>原因<\/strong>：已经加过远程地址了。<\/p>\n<p><strong>解决<\/strong>：<\/p>\n<pre><code class=\"language-powershell\">git remote -v\ngit remote set-url origin https://github.com/你的用户名/仓库名.git\n<\/code><\/pre>\n<h3>推不上去，要输密码<\/h3>\n<p>GitHub 现在不支持账号密码，要用 Personal Access Token（PAT）。\n看 <code>01-环境与工具.md<\/code> 的 5.4 节。<\/p>\n<hr />\n<h2>7. 什么时候该问人<\/h2>\n<p>自己尝试 3 次（每次换一种思路）还不行，就可以问。问的时候一次给全：<\/p>\n<pre><code class=\"language-text\">1. 我运行了什么命令：\n   python scripts\\09_model_comparison.py\n\n2. 完整报错（最后 15 行）：\n   （粘贴）\n\n3. 我已经试过：\n   - 确认激活了 .venv\n   - 重新跑了 08\n   - 删掉了 __pycache__\n\n4. 我的环境：\n   Windows 11 / Python 3.14 / pandas 3.0.6\n<\/code><\/pre>\n<p>不要只发一句\"为什么报错\"，那样别人很难帮你。<\/p>\n<hr />\n<h2>8. 最后的心理建设<\/h2>\n<ul>\n<li>报错是正常的，程序员每天都在看报错；<\/li>\n<li>报错不是\"我太笨\"，而是\"电脑在告诉我哪里不通\"；<\/li>\n<li>先复制报错最后一行去搜索，八成有人遇到过；<\/li>\n<li>每次解决一个报错，就把它写进笔记的\"踩坑记录\"——这也是科研训练的一部分。<\/li>\n<\/ul>\n<p>祝顺利。<\/p>","plain":"99 报错急救：先在表里找，再决定要不要问人 0. 通用三步 看最后一行 ：错误类型 + 原因； 看文件名和行号 ：哪一行代码出错； 看上下文 ：出错前运行了什么命令、数据文件存在吗。 不要一看到红字就关掉终端。Python 的报错其实是在告诉你哪里出了问题。 1. 环境类错误 'python' 不是内部或外部命令 原因 ：没装 Python，或者安装时没勾选 \"Add Python to PATH\"。 解决 ： 重新安装 Python，勾选 \"Add python.exe to PATH\"； 或者用 py --version 试试； 装完重开 PowerShell。 虚拟环境激活失败： Activate.ps1 cannot be loaded because running scripts is disabled 解决 ： Set-ExecutionPolicy -Scope Process Bypass .\\.venv\\Scripts\\Activate.ps1 ModuleNotFoundError: No module named 'pandas' 原因 ：没装库，或者没激活虚拟环境。 解决 ： .\\.venv\\Scripts\\Activate.ps1 pip install -r requirements.txt 如果提示 pip 不是命令，用： python -m pip install -r requirements.txt pip 下载很慢或超时 换国内镜像： python -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple 2. 文件类错误 FileNotFoundError: [Errno 2] No such file or directory: ... 原因 ：文件不存在，或者你在错误的文件夹运行脚本。 解决 ： 用 Get-Location 确认在项目根目录； 先运行生成数据的上一个脚本： python scripts\\download_data.py python scripts\\04_load_clean.py python scripts\\05_time_features.py python scripts\\08_lag_rolling_features.py 注意脚本的运行顺序： download_data → 04 → 05 → 06/07/08 → 09 → 10 UnicodeDecodeError 原因 ：文件编码不是 UTF-8。 解决 ：本项目读写 CSV 时统一用： pd.read_csv(path, encoding=\"utf-8-sig\") df.to_csv(path, index=False, encoding=\"utf-8-sig\") 终端中文乱码 chcp 65001 [Console]::OutputEncoding = [System.Text.Encoding]::UTF8 $env:PYTHONIOENCODING = \"utf-8\" 然后重新运行脚本。 PermissionError: [Errno 13] Permission denied 原因 ：文件被 Excel/WPS 打开着，或者没有写权限。 解决 ：关闭正在打开该 CSV/图片的软件，再运行脚本。 3. pandas 类错误 KeyError: 'pm2.5' 原因 ：列名写错了，或者数据没有读对。 解决 ： print(df.columns.tolist()) 把列名打印出来，一个一个对照。注意大小写和空格： pm2.5 和 pm25 不是一回事； TEMP 和 temp 不是一回事。 SettingWithCopyWarning 原因 ：你对一个\"切片\"做修改，pandas 不确定你改的是原表还是副本。 解决 ：在筛选后加 .copy() ： subset = df[df[\"pm2.5\"] > 100].copy() subset[\"new_col\"] = 1 ValueError: Input contains NaN 原因 ：模型不允许特征里有缺失值。 解决 ：在训练前明确处理： df = df.dropna(subset=feature_columns + [\"target\"]) 或者填补： df[feature_columns] = df[feature_columns].fillna(df[feature_columns].median()) 但要注意：用中位数/均值填补时，只能从训练集算统计量，不能用测试集。 ValueError: could not convert string to float 原因 ：特征里有字符串列，例如 cbwd （风向）。 解决 ：要么删掉这列，要么做独热编码： df = pd.get_dummies(df, columns=[\"cbwd\"], drop_first=True) 关于 NaN 的一个提醒 NaN （Not a Number）表示缺失值。它和 0 完全不同： 0 是\"知道它等于 0\"； NaN 是\"不知道它等于多少\"。 不要把 NaN 直接改成 0 就完事，除非你确定 0 有物理意义。 4. 时间序列特有错误 shift 之后出现一堆 NaN 原因 ：shift 会让开头几行没有值，这是正常的。例如 shift(168) 前 168 行都是 NaN。 解决 ：在建模前按用到的特征删除： df = df.dropna(subset=[\"pm25_lag168\", \"pm25_roll168_mean\", \"pm25_next\"]) 删缺失行之后，lag24 不是 24 小时前 原因 ：删行让时间轴断了。 解决 ：保持完整小时时间轴： df = df.set_index(\"datetime\").sort_index().asfreq(\"h\") 短缺口插值，长缺口保留 NaN，建模时再删除无法计算的行。 模型分数高得离谱（R² > 0.99） 第一反应 ：检查数据泄漏。 特征里有没有 shift(-1) 、 center=True ； 有没有把目标列本身当特征； 有没有先在全量数据上算统计量再切分； 有没有随机切分时间序列。 本项目的 _leaky 特征就是反面教材，千万不要放进正式模型。 rolling 结果前面全是 NaN 原因 ：窗口还没凑满。例如 rolling(24) 前 23 行都是 NaN。 解决 ：这是正常现象。可以用 min_periods 放宽，但要写清楚理由： df[\"roll24_mean\"] = df[\"pm2.5\"].rolling(24, min_periods=18).mean() 5. sklearn 类错误 ValueError: Found input variables with inconsistent numbers of samples 原因 ：X 和 y 的行数不一样。 解决 ：打印行数： print(x_train.shape, y_train.shape) print(x_test.shape, y_test.shape) 确保它们都来自同一个 train / test 表。 ValueError: Expected 2D array, got 1D array instead 原因 ：sklearn 的模型要求 X 是二维表格（很多列），不是一维 Series。 解决 ： x_train = train[[\"pm25_lag1\"]] # 注意双层方括号 模型分数是负数 R² 负数表示模型比\"永远猜平均值\"还差。常见原因： 特征没有信息； 数据泄漏或切分错误； 训练集和测试集分布差异太大； 有极端异常值。 先回到基线：你的模型有没有打赢\"平均值\"和\"持续法\"？ 6. Git / GitHub 类错误 fatal: not a git repository 原因 ：当前文件夹没有初始化 Git。 解决 ： cd 正确的项目文件夹 git init git push 提示 rejected / fetch first 原因 ：GitHub 上的版本比本地新。 解决 （确保本地修改已提交）： git pull --rebase origin main git push remote origin already exists 原因 ：已经加过远程地址了。 解决 ： git remote -v git remote set-url origin https://github.com/你的用户名/仓库名.git 推不上去，要输密码 GitHub 现在不支持账号密码，要用 Personal Access Token（PAT）。 看 01-环境与工具.md 的 5.4 节。 7. 什么时候该问人 自己尝试 3 次（每次换一种思路）还不行，就可以问。问的时候一次给全： 1. 我运行了什么命令： python scripts\\09_model_comparison.py 2. 完整报错（最后 15 行）： （粘贴） 3. 我已经试过： - 确认激活了 .venv - 重新跑了 08 - 删掉了 __pycache__ 4. 我的环境： Windows 11 / Python 3.14 / pandas 3.0.6 不要只发一句\"为什么报错\"，那样别人很难帮你。 8. 最后的心理建设 报错是正常的，程序员每天都在看报错； 报错不是\"我太笨\"，而是\"电脑在告诉我哪里不通\"； 先复制报错最后一行去搜索，八成有人遇到过； 每次解决一个报错，就把它写进笔记的\"踩坑记录\"——这也是科研训练的一部分。 祝顺利。"},{"id":"note-feature","title":"学习笔记模板","group":"笔记","icon":"notebook-pen","file":"notes/学习笔记模板.md","summary":"每个特征一张表：构造、含义、实验证据、结论。","html":"<h1>时序特征工程学习笔记<\/h1>\n<blockquote>\n<p>用法：每学一个特征，就复制下面一张表，填满。\n这份笔记最后可以直接交给导师，证明你不仅跑了代码，而且知道每个特征在干什么。<\/p>\n<\/blockquote>\n<h2>0. 基本信息<\/h2>\n<ul>\n<li>姓名：<\/li>\n<li>数据来源：UCI 北京 PM2.5 数据（2010-01-01 至 2014-12-31，每小时一条，UTC）<\/li>\n<li>预测任务：站在时间 t，预测 t+1 时刻的 PM2.5<\/li>\n<li>训练/测试切分：按时间前 80% 训练，后 20% 测试<\/li>\n<\/ul>\n<h2>1. 特征笔记（每个特征一张表）<\/h2>\n<h3>示例：hour（小时）<\/h3>\n<table>\n<thead>\n<tr>\n<th>项目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特征名<\/td>\n<td>hour<\/td>\n<\/tr>\n<tr>\n<td>怎么构造<\/td>\n<td><code>df.index.hour<\/code>，取值 0-23<\/td>\n<\/tr>\n<tr>\n<td>一句话含义<\/td>\n<td>这条记录发生在一天中的第几个小时<\/td>\n<\/tr>\n<tr>\n<td>我期望它有什么用<\/td>\n<td>捕捉早晚高峰：不同小时的 PM2.5 平均水平可能不同<\/td>\n<\/tr>\n<tr>\n<td>实验证据<\/td>\n<td>第 5 课按小时求平均，发现不同小时均值不同（填具体数值）<\/td>\n<\/tr>\n<tr>\n<td>结论<\/td>\n<td>保留 / 不保留 / 不确定（写理由）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>示例：hour_sin、hour_cos（小时周期编码）<\/h3>\n<table>\n<thead>\n<tr>\n<th>项目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特征名<\/td>\n<td>hour_sin, hour_cos<\/td>\n<\/tr>\n<tr>\n<td>怎么构造<\/td>\n<td><code>sin(2*pi*hour/24)<\/code>, <code>cos(2*pi*hour/24)<\/code><\/td>\n<\/tr>\n<tr>\n<td>一句话含义<\/td>\n<td>把 0-23 点到圆上，让 23 点和 0 点变成邻居<\/td>\n<\/tr>\n<tr>\n<td>我期望它有什么用<\/td>\n<td>让线性模型理解“一天是循环的”，而不是把小时当成一条直线<\/td>\n<\/tr>\n<tr>\n<td>实验证据<\/td>\n<td>第 7 课对比：原始数字时间的 MAE = <strong><em>_，周期编码 MAE = <\/em><\/strong>_<\/td>\n<\/tr>\n<tr>\n<td>结论<\/td>\n<td>保留 / 不保留 / 不确定（写理由）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>示例：pm25_lag24（滞后 24 小时）<\/h3>\n<table>\n<thead>\n<tr>\n<th>项目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特征名<\/td>\n<td>pm25_lag24<\/td>\n<\/tr>\n<tr>\n<td>怎么构造<\/td>\n<td><code>df[\"pm2.5\"].shift(24)<\/code><\/td>\n<\/tr>\n<tr>\n<td>一句话含义<\/td>\n<td>昨天同一小时的 PM2.5<\/td>\n<\/tr>\n<tr>\n<td>我期望它有什么用<\/td>\n<td>污染有日周期，昨天同一时刻的值可能和今天相近<\/td>\n<\/tr>\n<tr>\n<td>实验证据<\/td>\n<td>第 9 课消融实验：去掉全部滞后后 MAE 从 <strong><em>_ 变成 <\/em><\/strong>_<\/td>\n<\/tr>\n<tr>\n<td>结论<\/td>\n<td>保留 / 不保留 / 不确定（写理由）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>示例：pm25_roll24_mean（24 小时滑动平均）<\/h3>\n<table>\n<thead>\n<tr>\n<th>项目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特征名<\/td>\n<td>pm25_roll24_mean<\/td>\n<\/tr>\n<tr>\n<td>怎么构造<\/td>\n<td><code>df[\"pm2.5\"].rolling(24, min_periods=24).mean()<\/code><\/td>\n<\/tr>\n<tr>\n<td>一句话含义<\/td>\n<td>过去 24 小时（含当前小时）的平均污染水平<\/td>\n<\/tr>\n<tr>\n<td>我期望它有什么用<\/td>\n<td>单个小时会抖，平均值能反映近期整体水平<\/td>\n<\/tr>\n<tr>\n<td>实验证据<\/td>\n<td>第 9 课对比：去掉滑动窗口后 MAE = ____<\/td>\n<\/tr>\n<tr>\n<td>结论<\/td>\n<td>保留 / 不保留 / 不确定（写理由）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>轮到你了：自己写 5 个特征<\/h3>\n<p>复制上面的表格，至少完成这些特征：<\/p>\n<ul>\n<li>[ ] month / month_sin / month_cos<\/li>\n<li>[ ] dayofweek / dayofweek_sin / dayofweek_cos<\/li>\n<li>[ ] is_weekend<\/li>\n<li>[ ] pm25_lag1<\/li>\n<li>[ ] pm25_lag168<\/li>\n<li>[ ] pm25_roll24_std<\/li>\n<li>[ ] pm25_diff1<\/li>\n<li>[ ] TEMP_lag1<\/li>\n<\/ul>\n<h2>2. 我踩过的坑（很重要）<\/h2>\n<table>\n<thead>\n<tr>\n<th>日期<\/th>\n<th>报错/问题<\/th>\n<th>原因<\/th>\n<th>怎么解决<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. 一句话总结<\/h2>\n<p>用三句话向一个完全不懂的同学解释：<\/p>\n<ol>\n<li>时间戳本身不能直接喂给模型，要拆成年、月、日、小时、星期等数字。<\/li>\n<li>周期特征（sin/cos）解决“23 点之后又回到 0 点”的问题。<\/li>\n<li>滞后和滑动窗口提供“过去发生了什么”，但绝不能包含“未来会发生什么”。<\/li>\n<\/ol>","plain":"时序特征工程学习笔记 用法：每学一个特征，就复制下面一张表，填满。 这份笔记最后可以直接交给导师，证明你不仅跑了代码，而且知道每个特征在干什么。 0. 基本信息 姓名： 数据来源：UCI 北京 PM2.5 数据（2010-01-01 至 2014-12-31，每小时一条，UTC） 预测任务：站在时间 t，预测 t+1 时刻的 PM2.5 训练/测试切分：按时间前 80% 训练，后 20% 测试 1. 特征笔记（每个特征一张表） 示例：hour（小时） 项目 内容 特征名 hour 怎么构造 df.index.hour ，取值 0-23 一句话含义 这条记录发生在一天中的第几个小时 我期望它有什么用 捕捉早晚高峰：不同小时的 PM2.5 平均水平可能不同 实验证据 第 5 课按小时求平均，发现不同小时均值不同（填具体数值） 结论 保留 / 不保留 / 不确定（写理由） 示例：hour_sin、hour_cos（小时周期编码） 项目 内容 特征名 hour_sin, hour_cos 怎么构造 sin(2*pi*hour/24) , cos(2*pi*hour/24) 一句话含义 把 0-23 点到圆上，让 23 点和 0 点变成邻居 我期望它有什么用 让线性模型理解“一天是循环的”，而不是把小时当成一条直线 实验证据 第 7 课对比：原始数字时间的 MAE = _，周期编码 MAE = _ 结论 保留 / 不保留 / 不确定（写理由） 示例：pm25_lag24（滞后 24 小时） 项目 内容 特征名 pm25_lag24 怎么构造 df[\"pm2.5\"].shift(24) 一句话含义 昨天同一小时的 PM2.5 我期望它有什么用 污染有日周期，昨天同一时刻的值可能和今天相近 实验证据 第 9 课消融实验：去掉全部滞后后 MAE 从 _ 变成 _ 结论 保留 / 不保留 / 不确定（写理由） 示例：pm25_roll24_mean（24 小时滑动平均） 项目 内容 特征名 pm25_roll24_mean 怎么构造 df[\"pm2.5\"].rolling(24, min_periods=24).mean() 一句话含义 过去 24 小时（含当前小时）的平均污染水平 我期望它有什么用 单个小时会抖，平均值能反映近期整体水平 实验证据 第 9 课对比：去掉滑动窗口后 MAE = ____ 结论 保留 / 不保留 / 不确定（写理由） 轮到你了：自己写 5 个特征 复制上面的表格，至少完成这些特征： [ ] month / month_sin / month_cos [ ] dayofweek / dayofweek_sin / dayofweek_cos [ ] is_weekend [ ] pm25_lag1 [ ] pm25_lag168 [ ] pm25_roll24_std [ ] pm25_diff1 [ ] TEMP_lag1 2. 我踩过的坑（很重要） 日期 报错/问题 原因 怎么解决 3. 一句话总结 用三句话向一个完全不懂的同学解释： 时间戳本身不能直接喂给模型，要拆成年、月、日、小时、星期等数字。 周期特征（sin/cos）解决“23 点之后又回到 0 点”的问题。 滞后和滑动窗口提供“过去发生了什么”，但绝不能包含“未来会发生什么”。"},{"id":"note-experiment","title":"实验记录模板","group":"笔记","icon":"flask-conical","file":"notes/实验记录模板.md","summary":"模型对比表、消融实验表、结论模板。","html":"<h1>实验记录<\/h1>\n<h2>实验设置<\/h2>\n<table>\n<thead>\n<tr>\n<th>项目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>数据集<\/td>\n<td>UCI 北京 PM2.5<\/td>\n<\/tr>\n<tr>\n<td>时间范围<\/td>\n<td>2010-01-01 至 2014-12-31（UTC，每小时）<\/td>\n<\/tr>\n<tr>\n<td>预测目标<\/td>\n<td>t+1 时刻的 pm2.5<\/td>\n<\/tr>\n<tr>\n<td>模型<\/td>\n<td>线性回归（LinearRegression）<\/td>\n<\/tr>\n<tr>\n<td>训练/测试<\/td>\n<td>按时间前 80% / 后 20%<\/td>\n<\/tr>\n<tr>\n<td>评价指标<\/td>\n<td>MAE、RMSE、R2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>实验 1：特征组对比<\/h2>\n<blockquote>\n<p>把 <code>outputs/tables/09_model_comparison.csv<\/code> 的数字抄进来，再写自己的解读。<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>特征<\/th>\n<th>切分方式<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R2<\/th>\n<th>是否可信<\/th>\n<th>我的解读<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平均值基线<\/td>\n<td>无<\/td>\n<td>按时间 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>持续法基线<\/td>\n<td>当前 pm2.5<\/td>\n<td>按时间 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>只用原始时间特征<\/td>\n<td>month/day/hour...<\/td>\n<td>按时间 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>只用周期编码时间<\/td>\n<td>sin/cos<\/td>\n<td>按时间 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>周期编码 + 滞后<\/td>\n<td>+ lag/diff<\/td>\n<td>按时间 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>完整正确版<\/td>\n<td>+ 滑动 + 天气<\/td>\n<td>按时间 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>中心滑动窗口<\/td>\n<td>包含未来值<\/td>\n<td>按时间 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>不可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>把答案当特征<\/td>\n<td>作弊<\/td>\n<td>按时间 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>不可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>随机切分<\/td>\n<td>完整特征<\/td>\n<td>随机 8:2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>不可信<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>实验 2：消融实验（拿掉一组特征会怎样）<\/h2>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>特征个数<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R2<\/th>\n<th>我的解读<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>完整特征<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>去掉滞后<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>去掉滑动窗口<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>去掉天气<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>只留时间特征<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>实验结论模板<\/h2>\n<ol>\n<li>和只用时间特征相比，加入滞后特征后 MAE 从 <strong><em>_ 降到 <\/em><\/strong>_，说明：____。<\/li>\n<li>滑动窗口特征的加入有没有进一步提升？证据是：____。<\/li>\n<li>天气特征的表现如何？____。<\/li>\n<li>我观察到一个“假高分”：<strong><em>_，它的原因是数据泄漏，具体泄漏方式是：<\/em><\/strong>_。<\/li>\n<li>如果重做一次，我会优先改进：____。<\/li>\n<\/ol>","plain":"实验记录 实验设置 项目 内容 数据集 UCI 北京 PM2.5 时间范围 2010-01-01 至 2014-12-31（UTC，每小时） 预测目标 t+1 时刻的 pm2.5 模型 线性回归（LinearRegression） 训练/测试 按时间前 80% / 后 20% 评价指标 MAE、RMSE、R2 实验 1：特征组对比 把 outputs/tables/09_model_comparison.csv 的数字抄进来，再写自己的解读。 实验 特征 切分方式 MAE RMSE R2 是否可信 我的解读 平均值基线 无 按时间 8:2 可信 持续法基线 当前 pm2.5 按时间 8:2 可信 只用原始时间特征 month/day/hour... 按时间 8:2 可信 只用周期编码时间 sin/cos 按时间 8:2 可信 周期编码 + 滞后 + lag/diff 按时间 8:2 可信 完整正确版 + 滑动 + 天气 按时间 8:2 可信 中心滑动窗口 包含未来值 按时间 8:2 不可信 把答案当特征 作弊 按时间 8:2 不可信 随机切分 完整特征 随机 8:2 不可信 实验 2：消融实验（拿掉一组特征会怎样） 实验 特征个数 MAE RMSE R2 我的解读 完整特征 去掉滞后 去掉滑动窗口 去掉天气 只留时间特征 实验结论模板 和只用时间特征相比，加入滞后特征后 MAE 从 _ 降到 _，说明：____。 滑动窗口特征的加入有没有进一步提升？证据是：____。 天气特征的表现如何？____。 我观察到一个“假高分”： _，它的原因是数据泄漏，具体泄漏方式是： _。 如果重做一次，我会优先改进：____。"}],"scripts":[{"id":"download","title":"下载数据集","group":"准备","file":"scripts/download_data.py","cmd":"python scripts\\download_data.py","summary":"下载 UCI 北京 PM2.5 数据；网络失败时自动生成结构相同的模拟数据。","code":"\"\"\"下载教程使用的数据集。\n\n数据集：北京 PM2.5 数据（UCI Machine Learning Repository）\n- 时间范围：2010-01-01 到 2014-12-31\n- 频率：每小时一条，共 43824 条\n- 时区：UTC（正好符合“时间戳统一 UTC”的要求）\n- 目标列：pm2.5（PM2.5 浓度，单位微克/立方米）\n\n如果学校网络下载失败，脚本会自动生成一份“结构一模一样的模拟数据”，\n保证后面的课程仍然能跑通。模拟数据会在终端明确标注。\n\n运行：python scripts/download_data.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport io\nimport shutil\nimport urllib.request\nimport zipfile\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\nRAW_DIR = PROJECT_ROOT / \"data\" / \"raw\" / \"beijing_pm25\"\nTARGET_CSV = RAW_DIR / \"PRSA_data_2010.1.1-2014.12.31.csv\"\nZIP_URL = \"https://archive.ics.uci.edu/static/public/381/beijing+pm2+5+data.zip\"\n\n\ndef download_from_uci() -> bool:\n    \"\"\"从 UCI 官方地址下载。成功返回 True，失败返回 False。\"\"\"\n    print(f\"正在下载：{ZIP_URL}\")\n    try:\n        with urllib.request.urlopen(ZIP_URL, timeout=90) as response:\n            content = response.read()\n\n        with zipfile.ZipFile(io.BytesIO(content)) as zf:\n            csv_names = [n for n in zf.namelist() if n.lower().endswith(\".csv\")]\n            if not csv_names:\n                print(\"压缩包里没有 CSV 文件。\")\n                return False\n            with zf.open(csv_names[0]) as src, open(TARGET_CSV, \"wb\") as dst:\n                shutil.copyfileobj(src, dst)\n\n        print(f\"下载成功：{TARGET_CSV}\")\n        return True\n    except Exception as exc:  # noqa: BLE001 - 新手教程，任何网络错误都走备用方案\n        print(f\"下载失败：{type(exc).__name__}: {exc}\")\n        return False\n\n\ndef make_fake_data() -> None:\n    \"\"\"生成一份结构相同的模拟数据，仅在真实数据下载失败时使用。\"\"\"\n    print(\"\\n改用模拟数据（真实数据下载失败时的备用方案）。\")\n\n    rng = np.random.default_rng(42)\n    times = pd.date_range(\"2010-01-01\", \"2014-12-31 23:00\", freq=\"h\")\n    n = len(times)\n    hour = times.hour.to_numpy()\n    day_of_year = times.dayofyear.to_numpy()\n    weekday = times.dayofweek.to_numpy()\n\n    # 一个简单的“像真的”PM2.5：冬季更高 + 早晚双高峰 + 随机波动\n    season = 45 * np.cos(2 * np.pi * (day_of_year - 15) / 365.25)\n    daily = 25 * np.sin(2 * np.pi * (hour - 7) / 24) + 18 * np.sin(\n        2 * np.pi * (hour - 18) / 12\n    )\n    weekly = -8 * (weekday >= 5)\n\n    noise = np.zeros(n)\n    for i in range(1, n):\n        noise[i] = 0.82 * noise[i - 1] + rng.normal(0, 9)\n\n    pm25 = np.clip(85 + season + daily + weekly + noise, 2, None)\n    pm25[rng.random(n) < 0.045] = np.nan  # 故意制造一些缺失值，方便练习清洗\n\n    temperature = 14 - 15 * np.cos(2 * np.pi * (day_of_year - 15) / 365.25) + rng.normal(0, 3, n)\n    dew_point = temperature - rng.uniform(2, 15, n)\n    pressure = 1012 + 10 * np.cos(2 * np.pi * day_of_year / 365.25) + rng.normal(0, 4, n)\n    wind = np.abs(rng.normal(2, 1.5, n))\n    rain = (rng.random(n) < 0.03).astype(int)\n    snow = (rng.random(n) < 0.01).astype(int)\n\n    df = pd.DataFrame(\n        {\n            \"No\": np.arange(1, n + 1),\n            \"year\": times.year,\n            \"month\": times.month,\n            \"day\": times.day,\n            \"hour\": times.hour,\n            \"pm2.5\": np.round(pm25, 1),\n            \"DEWP\": np.round(dew_point, 0).astype(int),\n            \"TEMP\": np.round(temperature, 1),\n            \"PRES\": np.round(pressure, 1),\n            \"cbwd\": rng.choice([\"NW\", \"NE\", \"SE\", \"SW\", \"cv\"], size=n),\n            \"Iws\": np.round(wind, 2),\n            \"Is\": snow,\n            \"Ir\": rain,\n        }\n    )\n\n    RAW_DIR.mkdir(parents=True, exist_ok=True)\n    df.to_csv(TARGET_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"模拟数据已生成：{TARGET_CSV}\")\n\n\ndef main() -> None:\n    RAW_DIR.mkdir(parents=True, exist_ok=True)\n\n    if TARGET_CSV.exists():\n        print(f\"数据已经存在，不重复下载：{TARGET_CSV}\")\n        return\n\n    if not download_from_uci():\n        make_fake_data()\n\n    # 下载后立刻检查一遍，避免拿到空文件还不知道。\n    df = pd.read_csv(TARGET_CSV, nrows=5)\n    print(\"\\n前 5 行长这样：\")\n    print(df.to_string(index=False))\n    print(\"\\n下一步：python scripts/04_load_clean.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"python-basics","title":"01 Python 基础","group":"基础","file":"scripts/01_python_basics.py","cmd":"python scripts\\01_python_basics.py","summary":"列表、字典、deque 队列、函数、文件读写、循环和条件。","code":"\"\"\"第 1 课：Python 零基础速通。\n\n这一课只讲后面做特征工程一定会用到的 6 样东西：\n1. 变量和列表 list\n2. 字典 dict\n3. 队列 deque\n4. 函数 def\n5. 文件读写\n6. 循环和条件\n\n运行：python scripts/01_python_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import deque\n\nfrom common import TABLES_DIR, print_step, print_title\n\n\n# ---------------------------------------------------------------------------\n# 1. 列表 list：一排有顺序的数据\n# ---------------------------------------------------------------------------\ndef lesson_list() -> None:\n    print_step(\"1. 列表 list：就像一排储物柜，每个格子有编号\")\n\n    # 注意：Python 的编号从 0 开始，不是从 1 开始。\n    temperatures = [11.0, 12.5, 10.8, 9.6, 13.2]\n    print(\"原始列表：\", temperatures)\n    print(\"第 1 个元素 temperatures[0] =\", temperatures[0])\n    print(\"最后 1 个元素 temperatures[-1] =\", temperatures[-1])\n    print(\"前 3 个元素 temperatures[:3] =\", temperatures[:3])\n\n    temperatures.append(14.0)\n    print(\"append(14.0) 之后：\", temperatures)\n    print(\"最大值 =\", max(temperatures), \"  平均值 =\", sum(temperatures) / len(temperatures))\n\n\n# ---------------------------------------------------------------------------\n# 2. 字典 dict：用名字找值，就像通讯录\n# ---------------------------------------------------------------------------\ndef lesson_dict() -> None:\n    print_step(\"2. 字典 dict：用名字（键）找值\")\n\n    row = {\n        \"city\": \"南京\",\n        \"date\": \"2026-10-08\",\n        \"temperature\": 22.5,\n        \"is_weekend\": False,\n    }\n    print(\"一整条记录：\", row)\n    print('row[\"temperature\"] =', row[\"temperature\"])\n\n    row[\"weather\"] = \"多云\"  # 新增一个键\n    row[\"temperature\"] = 23.1  # 修改已有的键\n    print(\"修改后：\", row)\n\n    for key, value in row.items():\n        print(f\"  {key} -> {value}\")\n\n\n# ---------------------------------------------------------------------------\n# 3. 队列 deque：只保留最近 N 个值，天然适合“滑动窗口”\n# ---------------------------------------------------------------------------\ndef lesson_queue() -> None:\n    print_step(\"3. 队列 deque：进门排队，先来先走；只留最近 3 个数\")\n\n    window = deque(maxlen=3)\n    hourly_pm25 = [80, 75, 90, 120, 110, 95]\n\n    for hour, value in enumerate(hourly_pm25):\n        window.append(value)\n        average = sum(window) / len(window)\n        print(f\"第 {hour} 小时 PM2.5={value:>3}，窗口={list(window)}，窗口均值={average:.1f}\")\n\n    print(\"\\n这就是“滑动窗口”：每一步丢掉最老的数，加入最新的数，再算统计量。\")\n\n\n# ---------------------------------------------------------------------------\n# 4. 函数 def：把一段代码打包，起个名字反复用\n# ---------------------------------------------------------------------------\ndef c_to_f(celsius: float) -> float:\n    \"\"\"把摄氏度换成华氏度。\"\"\"\n    return celsius * 9 / 5 + 32\n\n\ndef lesson_function() -> None:\n    print_step(\"4. 函数 def：输入 -> 处理 -> 输出\")\n\n    for celsius in [0, 10, 25, 37]:\n        print(f\"{celsius:>3} 摄氏度 = {c_to_f(celsius):>5.1f} 华氏度\")\n\n\n# ---------------------------------------------------------------------------\n# 5. 文件读写：把结果存下来，下次还能用\n# ---------------------------------------------------------------------------\ndef lesson_file() -> None:\n    print_step(\"5. 文件读写：写出去，再读回来\")\n\n    note_path = TABLES_DIR / \"python_notes.txt\"\n    note_path.write_text(\n        \"我今天学会了列表、字典、队列、函数和文件读写。\\n\",\n        encoding=\"utf-8\",\n    )\n    print(f\"已写入：{note_path}\")\n    print(\"读回来：\", note_path.read_text(encoding=\"utf-8\").strip())\n\n    # 追加一行（\\n 表示换行）\n    with note_path.open(\"a\", encoding=\"utf-8\") as f:\n        f.write(\"下一步：用 pandas 读真正的 CSV 数据。\\n\")\n    print(\"追加后文件内容：\")\n    print(note_path.read_text(encoding=\"utf-8\"))\n\n\n# ---------------------------------------------------------------------------\n# 6. 循环 + 条件：自动给每条记录打标签\n# ---------------------------------------------------------------------------\ndef lesson_loop_and_if() -> None:\n    print_step(\"6. 循环 + 条件：给每个 PM2.5 数值分级\")\n\n    hourly_pm25 = [35, 76, 120, 210, 45, 90]\n    for value in hourly_pm25:\n        if value <= 50:\n            level = \"优\"\n        elif value <= 100:\n            level = \"良\"\n        elif value <= 150:\n            level = \"轻度污染\"\n        else:\n            level = \"中重度污染\"\n        print(f\"PM2.5={value:>3} -> {level}\")\n\n\n# ---------------------------------------------------------------------------\n# 小练习：先自己想，再看运行结果对照\n# ---------------------------------------------------------------------------\ndef exercises() -> None:\n    print_step(\"小练习（先暂停，自己写一写再看答案）\")\n\n    print(\"题目 1：把 [3, 1, 4, 1, 5] 排序后取最大值。\")\n    numbers = [3, 1, 4, 1, 5]\n    numbers.sort()\n    print(\"答案 1：排序后 =\", numbers, \"，最大值 =\", numbers[-1])\n\n    print(\"\\n题目 2：统计一句话里每个单词出现的次数。\")\n    sentence = \"time time series window time\"\n    counts: dict[str, int] = {}\n    for word in sentence.split():\n        counts[word] = counts.get(word, 0) + 1\n    print(\"答案 2：\", counts)\n\n    print(\"\\n题目 3：用 deque 算最近 3 个数的平均值。\")\n    window = deque(maxlen=3)\n    for value in [10, 20, 30, 40]:\n        window.append(value)\n    print(\"答案 3：最后一个窗口 =\", list(window), \"，均值 =\", sum(window) / len(window))\n\n\ndef main() -> None:\n    print_title(\"第 1 课：Python 零基础速通\")\n    print(\"这一课不需要背，先看代码 -> 运行 -> 改数字再运行。\")\n\n    lesson_list()\n    lesson_dict()\n    lesson_queue()\n    lesson_function()\n    lesson_file()\n    lesson_loop_and_if()\n    exercises()\n\n    print(\"\\n完成！你刚刚已经用到了后面做滑动窗口的核心思路。\")\n    print(\"下一步：python scripts/02_pandas_basics.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"pandas-basics","title":"02 pandas 基础","group":"基础","file":"scripts/02_pandas_basics.py","cmd":"python scripts\\02_pandas_basics.py","summary":"DataFrame、选列、筛行、groupby、datetime、读真实 CSV。","code":"\"\"\"第 2 课：pandas 基础。\n\npandas 是 Python 处理表格数据的工具。你可以把它想成“用代码操作的 Excel”。\n最重要的两个概念：\n- Series：一列数据\n- DataFrame：一张表格（很多列）\n\n运行：python scripts/02_pandas_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom common import PROCESSED_DIR, load_raw_data, print_step, print_title\n\n\ndef describe_dataframe() -> pd.DataFrame:\n    \"\"\"手动造一张小表，先认识 DataFrame 长什么样。\"\"\"\n    print_step(\"1. 手动造一张表：3 天的天气记录\")\n\n    df = pd.DataFrame(\n        {\n            \"date\": [\"2026-10-01\", \"2026-10-02\", \"2026-10-03\"],\n            \"city\": [\"南京\", \"南京\", \"南京\"],\n            \"temperature\": [28.0, 31.5, 24.0],\n            \"rain_mm\": [0.0, 12.5, 3.2],\n        }\n    )\n\n    print(df)\n    print(\"\\n形状（行数, 列数）：\", df.shape)\n    print(\"列名：\", df.columns.tolist())\n    print(\"\\n每一列的类型：\")\n    print(df.dtypes)\n    print(\"\\n数值列的统计：\")\n    print(df.describe())\n    return df\n\n\ndef select_and_filter(df: pd.DataFrame) -> None:\n    print_step(\"2. 选列、筛选行、加新列\")\n\n    print('只选一列 df[\"temperature\"]：')\n    print(df[\"temperature\"])\n\n    print(\"\\n只选两列：\")\n    print(df[[\"date\", \"temperature\"]])\n\n    print(\"\\n筛选出下雨超过 5 毫米的行：\")\n    rainy = df[df[\"rain_mm\"] > 5]\n    print(rainy)\n\n    df[\"is_rainy\"] = df[\"rain_mm\"] > 0\n    df[\"temp_f\"] = df[\"temperature\"] * 9 / 5 + 32\n    print(\"\\n新增两列后：\")\n    print(df)\n\n\ndef groupby_demo() -> None:\n    print_step(\"3. groupby：把数据分组后再算统计量\")\n\n    bigger = pd.DataFrame(\n        {\n            \"city\": [\"南京\", \"南京\", \"北京\", \"北京\", \"上海\"],\n            \"temperature\": [28.0, 31.5, 22.0, 20.5, 26.0],\n        }\n    )\n    print(bigger)\n    print(\"\\n按城市求温度平均值：\")\n    print(bigger.groupby(\"city\")[\"temperature\"].mean())\n\n\ndef datetime_demo() -> None:\n    print_step(\"4. 时间列：字符串 -> datetime -> 拆出年月日时\")\n\n    stamps = pd.Series([\"2026-10-08 08:00:00\", \"2026-10-08 09:00:00\", \"2026-10-09 00:00:00\"])\n    dt = pd.to_datetime(stamps)\n\n    print(\"原来的字符串：\")\n    print(stamps)\n    print(\"\\n变成 datetime 后：\")\n    print(dt)\n\n    result = pd.DataFrame(\n        {\n            \"datetime\": dt,\n            \"year\": dt.dt.year,\n            \"month\": dt.dt.month,\n            \"day\": dt.dt.day,\n            \"hour\": dt.dt.hour,\n            \"weekday\": dt.dt.dayofweek,  # 0=周一, 6=周日\n            \"is_weekend\": dt.dt.dayofweek >= 5,\n        }\n    )\n    print(\"\\n拆出来的时间特征：\")\n    print(result)\n\n\ndef read_real_csv() -> None:\n    print_step(\"5. 读真正的 CSV：北京 PM2.5 原始数据\")\n\n    df = load_raw_data()\n    print(\"形状（行数, 列数）：\", df.shape)\n    print(\"\\n前 5 行：\")\n    print(df.head().to_string(index=False))\n    print(\"\\n每列缺多少个值：\")\n    print(df.isna().sum())\n    print(\"\\npm2.5 这一列的统计：\")\n    print(df[\"pm2.5\"].describe())\n\n    demo_path = PROCESSED_DIR / \"pandas_demo.csv\"\n    df.head(100).to_csv(demo_path, index=False, encoding=\"utf-8-sig\")\n    print(f\"\\n前 100 行已保存到：{demo_path}\")\n\n\ndef main() -> None:\n    print_title(\"第 2 课：pandas 基础\")\n\n    df = describe_dataframe()\n    select_and_filter(df)\n    groupby_demo()\n    datetime_demo()\n    read_real_csv()\n\n    print(\"\\n完成！记住 4 个动作：读数据、看数据、选数据、造新列。\")\n    print(\"下一步：python scripts/03_sqlite_basics.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"sqlite-basics","title":"03 SQLite 基础","group":"基础","file":"scripts/03_sqlite_basics.py","cmd":"python scripts\\03_sqlite_basics.py","summary":"建表、增删改查、主键、索引，全部用 Python 自带的 sqlite3。","code":"\"\"\"第 3 课：SQLite 数据库基础（Python 自带，零配置）。\n\n你要掌握的 4 个动作：\n- 增：INSERT\n- 删：DELETE\n- 改：UPDATE\n- 查：SELECT\n\n外加两个重要概念：\n- 主键 PRIMARY KEY：每一行的唯一身份证，不允许重复\n- 索引 INDEX：像书的目录，查得更快\n\n运行：python scripts/03_sqlite_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sqlite3\n\nfrom common import PROCESSED_DIR, print_step, print_title\n\nDB_PATH = PROCESSED_DIR / \"practice.db\"\n\n\ndef create_table(conn: sqlite3.Connection) -> None:\n    print_step(\"1. 建表：CREATE TABLE（id 是主键）\")\n\n    sql = \"\"\"\n    CREATE TABLE IF NOT EXISTS weather_notes (\n        id      INTEGER PRIMARY KEY,   -- 唯一身份证，不能重复\n        city    TEXT    NOT NULL,\n        date    TEXT    NOT NULL,\n        temp    REAL,\n        note    TEXT\n    )\n    \"\"\"\n    conn.execute(sql)\n    conn.commit()\n    print(\"表 weather_notes 已创建。\")\n    print(\"字段：id（主键）, city, date, temp, note\")\n\n\ndef insert_rows(conn: sqlite3.Connection) -> None:\n    print_step(\"2. 增：INSERT 插入数据\")\n\n    rows = [\n        (1, \"Nanjing\", \"2026-10-01\", 28.0, \"sunny\"),\n        (2, \"Nanjing\", \"2026-10-02\", 31.5, \"hot\"),\n        (3, \"Beijing\", \"2026-10-01\", 22.0, \"cloudy\"),\n        (4, \"Shanghai\", \"2026-10-03\", 26.0, \"rainy\"),\n    ]\n    conn.executemany(\n        \"INSERT OR REPLACE INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\",\n        rows,\n    )\n    conn.commit()\n    print(f\"插入了 {len(rows)} 行。注意 SQL 里的 ? 是占位符，防止拼字符串出错。\")\n\n\ndef select_rows(conn: sqlite3.Connection) -> None:\n    print_step(\"3. 查：SELECT 查询数据\")\n\n    print(\"查询全部（按 id 排序）：\")\n    for row in conn.execute(\"SELECT id, city, date, temp, note FROM weather_notes ORDER BY id\"):\n        print(\"  \", row)\n\n    print(\"\\n只查南京的记录：\")\n    for row in conn.execute(\"SELECT * FROM weather_notes WHERE city = ?\", (\"Nanjing\",)):#必须为元组\n        print(\"  \", row)\n\n    print(\"\\n每个城市有几条记录（GROUP BY）：\")\n    for row in conn.execute(\n        \"SELECT city, COUNT(*) AS n FROM weather_notes GROUP BY city ORDER BY n DESC\"\n    ):\n        print(\"  \", row)\n\n\ndef update_row(conn: sqlite3.Connection) -> None:\n    print_step(\"4. 改：UPDATE 修改数据\")\n\n    conn.execute(\"UPDATE weather_notes SET temp = ?, note = ? WHERE id = ?\", (29.5, \"updated\", 1))\n    conn.commit()\n    print(\"把 id=1 的温度改成 29.5：\")\n    print(\"  \", conn.execute(\"SELECT * FROM weather_notes WHERE id = 1\").fetchone())\n\n\ndef delete_row(conn: sqlite3.Connection) -> None:\n    print_step(\"5. 删：DELETE 删除数据（只删 id=4）\")\n\n    conn.execute(\"DELETE FROM weather_notes WHERE id = ?\", (4,))\n    conn.commit()\n    remaining = conn.execute(\"SELECT COUNT(*) FROM weather_notes\").fetchone()[0]\n    print(f\"删除后还剩 {remaining} 行。\")\n\n\ndef show_primary_key_rule(conn: sqlite3.Connection) -> None:\n    print_step(\"6. 主键为什么重要：插入重复 id 会直接报错\")\n\n    try:\n        conn.execute(\n            \"INSERT INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\",\n            (2, \"Suzhou\", \"2026-10-05\", 25.0, \"duplicate test\"),\n        )\n        conn.commit()\n        print(\"居然插入成功了？说明主键设置有问题。\")\n    except sqlite3.IntegrityError as exc:\n        print(\"插入失败，这其实是好事：\", exc)\n        print(\"数据库帮我们挡住了重复 id=2，保证每一行都有唯一身份。\")\n\n\ndef create_index(conn: sqlite3.Connection) -> None:\n    print_step(\"7. 索引：给常用查询列建目录\")\n\n    conn.execute(\"CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)\")\n    conn.commit()\n    print(\"已创建索引 idx_weather_city（按 city 查询会更快）。\")\n\n    print(\"\\n当前数据库里的表和索引：\")\n    for row in conn.execute(\n        \"SELECT type, name FROM sqlite_master WHERE type IN ('table', 'index') ORDER BY type, name\"\n    ):\n        print(\"  \", row)\n\n\ndef main() -> None:\n    print_title(\"第 3 课：SQLite 数据库基础\")\n\n    # 每次运行先删掉旧数据库，保证结果可重复。\n    if DB_PATH.exists():\n        DB_PATH.unlink()\n\n    conn = sqlite3.connect(DB_PATH)\n    try:\n        create_table(conn)\n        insert_rows(conn)\n        select_rows(conn)\n        update_row(conn)\n        delete_row(conn)\n        show_primary_key_rule(conn)\n        create_index(conn)\n    finally:\n        conn.close()\n\n    print(f\"\\n数据库文件：{DB_PATH}\")\n    print(\"可以用 DB Browser for SQLite 这个免费软件打开它，点点看表里的数据。\")\n    print(\"下一步：python scripts/04_load_clean.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"load-clean","title":"04 加载与清洗","group":"数据处理","file":"scripts/04_load_clean.py","cmd":"python scripts\\04_load_clean.py","summary":"拼 UTC 时间、排序、检查重复和缺失、保持完整小时时间轴。","code":"\"\"\"第 4 课：把原始 CSV 清洗成能建模的数据。\n\n做完这一步，你会得到 data/processed/pm25_clean.csv，它满足：\n1. 时间列是真正的 datetime，不是字符串；\n2. 时间统一标成 UTC；\n3. 按时间从早到晚排好序；\n4. 没有重复时间戳；\n5. 保持完整的“每小时一行”；短缺失插值，长缺失保留为空。\n\n运行：python scripts/04_load_clean.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_raw_data,\n    print_step,\n    print_title,\n)\n\nOUT_CSV = PROCESSED_DIR / \"pm25_clean.csv\"\nREPORT_TXT = TABLES_DIR / \"04_cleaning_report.txt\"\n\n\ndef build_utc_datetime(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 把 年/月/日/小时 四列拼成一个 UTC 时间列\")\n\n    print(\"原始数据里的时间是这样分开存的：\")\n    print(df[[\"year\", \"month\", \"day\", \"hour\"]].head(3).to_string(index=False))\n\n    # pd.to_datetime 可以把多列拼成时间；tz_localize(\"UTC\") 表示“这个时间本来就是 UTC”。\n    dt = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]])\n    df = df.copy()\n    df[\"datetime\"] = dt.dt.tz_localize(\"UTC\")\n\n    print(\"\\n拼好以后：\")\n    print(df[[\"datetime\", \"pm2.5\", \"TEMP\"]].head(3).to_string(index=False))\n    print(f\"\\n时间范围：{df['datetime'].min()} 到 {df['datetime'].max()}\")\n    return df\n\n\ndef sort_and_check(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 排序 + 检查重复 + 检查有没有漏掉整点\")\n\n    df = df.set_index(\"datetime\").sort_index()\n    # asfreq(\"h\") 保证时间轴是“每个整点一行”。如果有漏掉的整点，会补一行 NaN，\n    # 这样后面的 shift(24) 才真的表示 24 小时前，而不是“往前数 24 行”。\n    df = df.asfreq(\"h\")\n\n    duplicate_count = int(df.index.duplicated().sum())\n    print(f\"重复的时间戳数量：{duplicate_count}\")\n\n    expected = pd.date_range(df.index.min(), df.index.max(), freq=\"h\")\n    missing_timestamps = len(expected) - len(df)\n    print(f\"应该有的小时数：{len(expected)}\")\n    print(f\"实际有的行数：{len(df)}\")\n    print(f\"中间漏掉的时间戳数量：{missing_timestamps}\")\n\n    if duplicate_count == 0 and missing_timestamps == 0:\n        print(\"结论：时间轴完整且没有重复，可以做滞后和滑动窗口。\")\n    else:\n        print(\"注意：时间轴不完整！后面的 lag/rolling 需要先补齐时间轴。\")\n\n    return df\n\n\ndef handle_missing_pm25(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"3. 处理缺失值（重点是目标列 pm2.5）\")\n\n    missing_before = int(df[\"pm2.5\"].isna().sum())\n    print(f\"pm2.5 缺失数量：{missing_before} / {len(df)} （{missing_before / len(df):.2%}）\")\n\n    df = df.copy()\n    # 留一个“这个值原本是不是缺失”的标记，之后可以研究缺失是否和污染有关。\n    df[\"pm25_was_missing\"] = df[\"pm2.5\"].isna().astype(int)\n\n    # 时间序列常用做法：用前后时刻线性插值。\n    # limit=6 表示“最多连续补 6 个小时”，补不了的宁可按缺失处理。\n    df[\"pm2.5\"] = df[\"pm2.5\"].interpolate(method=\"linear\", limit=6, limit_direction=\"both\")\n\n    missing_after = int(df[\"pm2.5\"].isna().sum())\n    print(f\"短缺口插值后还缺：{missing_after}（占 {missing_after / len(df):.2%}）\")\n    print(\"处理原则：短缺口（不超过 6 小时）用前后值线性插值；长缺口保留 NaN，不硬猜。\")\n    print(\"为什么不直接删掉缺失行？因为删行会让时间轴断开，\")\n    print(\"shift/rolling 里的“24 小时”就会变成“往前数 24 行”，发生错位。\")\n    print(\"所以这里保留完整小时轴；建模脚本再按实际用到的特征删除无法计算的行。\")\n    print(\"注意：插值是一种“猜”，必须在报告里写清楚，不能装作数据本来没有缺失。\")\n    return df\n\n\ndef main() -> None:\n    print_title(\"第 4 课：加载 → 解析时间 → 排序 → 检查缺失\")\n\n    raw = load_raw_data()\n    print(f\"原始数据形状：{raw.shape}\")\n\n    df = build_utc_datetime(raw)\n    df = sort_and_check(df)\n    df = handle_missing_pm25(df)\n\n    print_step(\"4. 保存清洗后的数据\")\n    df.to_csv(OUT_CSV, encoding=\"utf-8-sig\")\n    print(f\"已保存：{OUT_CSV}\")\n\n    report_lines = [\n        \"北京 PM2.5 数据清洗报告\",\n        \"=\" * 40,\n        f\"原始行数：{len(raw)}\",\n        f\"最终行数（保持完整小时轴）：{len(df)}\",\n        f\"时间范围：{df.index.min()} 到 {df.index.max()}\",\n        \"时间频率：每小时（UTC）\",\n        f\"原始 pm2.5 缺失：{int(raw['pm2.5'].isna().sum())}\",\n        f\"短缺口插值后剩余缺失：{int(df['pm2.5'].isna().sum())}\",\n        \"\",\n        \"pm2.5 统计量（缺失值不参与统计）：\",\n        df[\"pm2.5\"].describe().to_string(),\n        \"\",\n        \"处理说明：\",\n        \"1. 把 year/month/day/hour 拼成 UTC datetime；\",\n        \"2. asfreq('h') 补齐时间轴，保证每个整点一行；\",\n        \"3. 对连续缺失不超过 6 小时的缺口做线性插值；\",\n        \"4. 长缺口保留为 NaN，建模时按使用的特征删除无法计算的行；\",\n        \"5. 保留 pm25_was_missing 标记，记录哪些值原本缺失。\",\n    ]\n    REPORT_TXT.write_text(\"\\n\".join(report_lines), encoding=\"utf-8\")\n    print(f\"清洗报告：{REPORT_TXT}\")\n\n    print(\"\\n完成！下一步：python scripts/05_time_features.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"time-features","title":"05 时间特征提取","group":"特征工程","file":"scripts/05_time_features.py","cmd":"python scripts\\05_time_features.py","summary":"年、月、日、星期、小时、是否周末，以及 sin/cos 周期编码。","code":"\"\"\"第 5 课：从时间戳里拆出模型能用的特征。\n\n这一课对应导师要求 2.3：年、月、日、星期、小时、是否周末。\n另外还加上“周期编码”：用 sin/cos 告诉模型“23 点和 0 点是挨着的”。\n\n运行：python scripts/05_time_features.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import PROCESSED_DIR, TABLES_DIR, load_clean_data, print_step, print_title\n\nOUT_CSV = PROCESSED_DIR / \"pm25_time_features.csv\"\nDICT_CSV = TABLES_DIR / \"05_feature_dictionary.csv\"\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef add_calendar_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 拆出年、月、日、星期、小时、是否周末\")\n\n    df = df.copy()\n    index = df.index\n\n    df[\"year\"] = index.year\n    df[\"month\"] = index.month\n    df[\"day\"] = index.day\n    df[\"hour\"] = index.hour\n    df[\"dayofweek\"] = index.dayofweek  # 0=周一, 6=周日\n    df[\"weekday_name\"] = index.dayofweek.map(lambda x: WEEKDAY_NAMES[x])\n    df[\"is_weekend\"] = (index.dayofweek >= 5).astype(int)\n    df[\"dayofyear\"] = index.dayofyear\n    df[\"weekofyear\"] = index.isocalendar().week.to_numpy()\n    df[\"quarter\"] = index.quarter\n\n    print(\"新增了：year, month, day, hour, dayofweek, weekday_name, is_weekend, dayofyear, weekofyear, quarter\")\n    print(\"注意：这份数据的时间戳是 UTC。北京本地时间 = UTC + 8；\"\n          \"如果你想看北京作息，可以再算 (hour + 8) % 24。本教程保持 UTC 统一。\")\n    print(\"\\n随机看 5 行：\")\n    columns = [\"pm2.5\", \"year\", \"month\", \"day\", \"hour\", \"dayofweek\", \"weekday_name\", \"is_weekend\"]\n    print(df[columns].sample(5, random_state=42).sort_index().to_string())\n    return df\n\n\ndef add_cyclic_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 周期编码：把小时、星期、月份变成圆上的坐标\")\n\n    df = df.copy()\n\n    # 为什么小时用 24、星期用 7、月份用 12？\n    # 因为它们在各自的周期结束后会“回到开头”。\n    df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\n    df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n\n    df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n\n    df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12)\n    df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12)\n\n    print(\"新增了：hour_sin, hour_cos, dayofweek_sin, dayofweek_cos, month_sin, month_cos\")\n    print(\"\\n看几个关键时刻，体会 23 点和 0 点在圆上是挨着的：\")\n    demo = pd.DataFrame(\n        {\n            \"hour\": [0, 1, 6, 12, 18, 22, 23],\n        }\n    )\n    demo[\"hour_sin\"] = np.sin(2 * np.pi * demo[\"hour\"] / 24)\n    demo[\"hour_cos\"] = np.cos(2 * np.pi * demo[\"hour\"] / 24)\n    print(demo.to_string(index=False))\n    return df\n\n\ndef save_feature_dictionary() -> None:\n    print_step(\"3. 保存“特征字典”：每个特征怎么构造、什么意思、有什么用\")\n\n    rows = [\n        (\"year\", \"index.year\", \"年份\", \"捕捉长期变化趋势（本例里只有 5 年）\"),\n        (\"month\", \"index.month\", \"月份 1-12\", \"捕捉季节变化\"),\n        (\"day\", \"index.day\", \"几号\", \"通常用处不大，容易造成过拟合\"),\n        (\"hour\", \"index.hour\", \"小时 0-23\", \"捕捉一天内的早晚高峰\"),\n        (\"dayofweek\", \"index.dayofweek\", \"0=周一...6=周日\", \"捕捉工作日/周末差异\"),\n        (\"is_weekend\", \"dayofweek >= 5\", \"是否周末 0/1\", \"简单明了地告诉模型周末效应\"),\n        (\"dayofyear\", \"index.dayofyear\", \"1-366\", \"季节位置，比 month 精度更高\"),\n        (\"weekofyear\", \"index.isocalendar().week\", \"一年中的第几周\", \"周期性任务、报告常用\"),\n        (\"hour_sin\", \"sin(2*pi*hour/24)\", \"小时在圆上的横坐标\", \"让 23 点和 0 点距离变近\"),\n        (\"hour_cos\", \"cos(2*pi*hour/24)\", \"小时在圆上的纵坐标\", \"和 hour_sin 配对使用\"),\n        (\"dayofweek_sin\", \"sin(2*pi*dayofweek/7)\", \"星期在圆上的横坐标\", \"表达“周而复始”\"),\n        (\"dayofweek_cos\", \"cos(2*pi*dayofweek/7)\", \"星期在圆上的纵坐标\", \"和 dayofweek_sin 配对\"),\n        (\"month_sin\", \"sin(2*pi*(month-1)/12)\", \"月份在圆上的横坐标\", \"表达季节循环\"),\n        (\"month_cos\", \"cos(2*pi*(month-1)/12)\", \"月份在圆上的纵坐标\", \"和 month_sin 配对\"),\n    ]\n    dictionary = pd.DataFrame(rows, columns=[\"特征名\", \"构造方法\", \"含义\", \"可能的作用\"])\n    dictionary.to_csv(DICT_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"已保存：{DICT_CSV}\")\n    print(dictionary.to_string(index=False))\n\n\ndef print_group_patterns(df: pd.DataFrame) -> None:\n    print_step(\"4. 用平均值观察周期性：不同小时/星期，PM2.5 是否不一样？\")\n\n    by_hour = df.groupby(\"hour\")[\"pm2.5\"].mean()\n    by_weekday = df.groupby(\"weekday_name\")[\"pm2.5\"].mean().reindex(WEEKDAY_NAMES)\n\n    print(\"每个小时的平均 PM2.5（越高说明这个时段污染越重）：\")\n    for hour_value, mean_value in by_hour.items():\n        bar = \"#\" * int(mean_value / 5)\n        print(f\"  {hour_value:02d} 点：{mean_value:6.1f}  {bar}\")\n\n    print(\"\\n周一至周日的平均 PM2.5：\")\n    for name, mean_value in by_weekday.items():\n        print(f\"  {name}：{mean_value:6.1f}\")\n\n\ndef main() -> None:\n    print_title(\"第 5 课：时间特征提取\")\n\n    df = load_clean_data()\n    df = add_calendar_features(df)\n    df = add_cyclic_features(df)\n    save_feature_dictionary()\n    print_group_patterns(df)\n\n    print_step(\"5. 保存带时间特征的数据\")\n    df.to_csv(OUT_CSV, encoding=\"utf-8-sig\")\n    print(f\"已保存：{OUT_CSV}\")\n    print(f\"现在共有 {df.shape[1]} 列特征。\")\n\n    print(\"\\n完成！下一步：python scripts/06_baseline_model.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"baseline","title":"06 基线模型","group":"建模实验","file":"scripts/06_baseline_model.py","cmd":"python scripts\\06_baseline_model.py","summary":"平均值基线 vs 线性回归；按时间前 80% 训练、后 20% 测试。","code":"\"\"\"第 6 课：第一个基线模型（线性回归）。\n\n任务：用“现在这个小时的时间信息”，预测“下一个小时的 PM2.5”。\n\n这一课的重点不是分数高不高，而是把整套流程跑通：\n- 目标 y 是什么\n- 特征 X 是什么\n- 怎么切分训练集/测试集（时序数据必须按时间切）\n- MAE、RMSE、R2 怎么看\n\n运行：python scripts/06_baseline_model.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.dummy import DummyRegressor\nfrom sklearn.linear_model import LinearRegression\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_time_features,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"06_baseline_results.csv\"\nPRED_CSV = TABLES_DIR / \"06_baseline_predictions.csv\"\n\n# 只允许用“预测时刻已经知道/能算出来”的列。\n# 例如现在的 month/hour 是可以知道的；pm2.5 下一个小时的值不能拿来当特征。\nTIME_FEATURES = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\n\n\ndef build_target(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 构造目标 y：下一个小时的 pm2.5\")\n\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n\n    print(\"shift(-1) 的意思是“把整列往上提一行”：\")\n    demo = df[[\"pm2.5\", \"pm25_next\"]].head(4)\n    print(demo.to_string())\n    print(\"\\n看第 1 行：现在是 80，下一小时是 75，所以 pm25_next=75。\")\n    print(\"最后一行没有“下一个小时”，所以最后一个是 NaN，待会要删掉。\")\n\n    # 最后一行没有未来目标，删掉；特征有缺失的也删掉。\n    return df.dropna(subset=[\"pm25_next\"] + TIME_FEATURES)\n\n\ndef chronological_split(df: pd.DataFrame, train_ratio: float = 0.8) -> tuple[pd.DataFrame, pd.DataFrame]:\n    print_step(\"2. 按时间切分：前 80% 训练，后 20% 测试\")\n\n    split_index = int(len(df) * train_ratio)\n    train = df.iloc[:split_index].copy()\n    test = df.iloc[split_index:].copy()\n\n    print(f\"训练集：{len(train)} 行，时间 {train.index.min()} 到 {train.index.max()}\")\n    print(f\"测试集：{len(test)} 行，时间 {test.index.min()} 到 {test.index.max()}\")\n    print(\"为什么不能随机切分？因为随机切分会把未来的数据混进训练集（考试漏题）。\")\n    return train, test\n\n\ndef evaluate(name: str, y_true: pd.Series, y_pred: np.ndarray, results: list[dict]) -> None:\n    metrics = regression_metrics(y_true, y_pred)\n    print(\n        f\"{name:<24} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\"\n    )\n    results.append(\n        {\n            \"模型\": name,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n        }\n    )\n\n\ndef main() -> None:\n    print_title(\"第 6 课：线性回归基线模型\")\n\n    df = load_time_features()\n    df = build_target(df)\n    train, test = chronological_split(df)\n\n    x_train = train[TIME_FEATURES]\n    x_test = test[TIME_FEATURES]\n    y_train = train[\"pm25_next\"]\n    y_test = test[\"pm25_next\"]\n\n    results: list[dict] = []\n    print_step(\"3. 两个模型对比：只会猜平均 vs 线性回归\")\n\n    # 基线 1：完全不管特征，永远预测训练集的平均值。\n    dummy = DummyRegressor(strategy=\"mean\")\n    dummy.fit(x_train, y_train)\n    dummy_pred = dummy.predict(x_test)\n    evaluate(\"平均值基线\", y_test, dummy_pred, results)\n\n    # 基线 2：用时间特征做线性回归。\n    model = LinearRegression()\n    model.fit(x_train, y_train)\n    pred = model.predict(x_test)\n    evaluate(\"线性回归（时间特征）\", y_test, pred, results)\n\n    print_step(\"4. 看看线性回归到底学到了什么\")\n    for feature, coefficient in sorted(\n        zip(TIME_FEATURES, model.coef_), key=lambda pair: abs(pair[1]), reverse=True\n    ):\n        print(f\"  {feature:<12} 系数 = {coefficient: .4f}\")\n    print(\"\\n系数正负只表示方向；系数大小会受特征单位影响，不能直接当重要性排名。\")\n\n    result_df = pd.DataFrame(results)\n    result_df.to_csv(RESULT_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"\\n结果表已保存：{RESULT_CSV}\")\n\n    prediction_df = pd.DataFrame(\n        {\n            \"datetime\": test.index,\n            \"y_true\": y_test.to_numpy(),\n            \"pred_dummy\": dummy_pred,\n            \"pred_time_only\": pred,\n        }\n    )\n    prediction_df.to_csv(PRED_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"预测值已保存：{PRED_CSV}\")\n\n    print(\"\\n怎么读这些指标：\")\n    print(\"- MAE：平均每次预测差多少，最好和 pm2.5 本身的平均值一起看。\")\n    print(\"- RMSE：和 MAE 类似，但会重罚离谱的大错误。\")\n    print(\"- R2：1 最好；0 约等于只会猜平均值；负数比猜平均值还差。\")\n    print(\"\\n如果 R2 很低，不要沮丧，这说明“只看钟表时间”确实不够，\")\n    print(\"下一课加入周期编码，再下一课加入滞后和滑动窗口，看看能不能变好。\")\n    print(\"\\n下一步：python scripts/07_cyclic_encoding.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"cyclic","title":"07 周期编码对照","group":"建模实验","file":"scripts/07_cyclic_encoding.py","cmd":"python scripts\\07_cyclic_encoding.py","summary":"只改特征写法：原始小时/星期 vs sin/cos 周期编码。","code":"\"\"\"第 7 课：正弦/余弦周期编码，到底有没有用？\n\n对比两种写法：\nA. 直接把 hour=0..23 当成数字喂给线性回归；\nB. 把 hour 拆成 hour_sin、hour_cos 两个数再喂给线性回归。\n\n运行：python scripts/07_cyclic_encoding.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\n\nfrom common import (\n    TABLES_DIR,\n    load_time_features,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"07_cyclic_results.csv\"\nPRED_CSV = TABLES_DIR / \"07_cyclic_predictions.csv\"\n\nRAW_FEATURES = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\nCYCLIC_FEATURES = [\n    \"is_weekend\",\n    \"hour_sin\",\n    \"hour_cos\",\n    \"dayofweek_sin\",\n    \"dayofweek_cos\",\n    \"month_sin\",\n    \"month_cos\",\n]\n\n\ndef explain_problem() -> None:\n    print_step(\"1. 先说清楚：为什么直接把 23 和 0 当数字很别扭？\")\n\n    demo = pd.DataFrame({\"hour\": [0, 1, 6, 12, 18, 22, 23]})\n    demo[\"hour_sin\"] = np.sin(2 * np.pi * demo[\"hour\"] / 24)\n    demo[\"hour_cos\"] = np.cos(2 * np.pi * demo[\"hour\"] / 24)\n    print(demo.to_string(index=False))\n    print(\"\\n对模型来说，如果只给一个 hour 数字：\")\n    print(\"  23 和 0 相差 23，看起来隔得很远；\")\n    print(\"  但现实中 23:00 和 00:00 只差 1 小时。\")\n    print(\"用 sin/cos 把时间放到圆上后，两者坐标就非常接近。\")\n\n\ndef make_target(df: pd.DataFrame) -> pd.DataFrame:\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n    return df.dropna(subset=[\"pm25_next\"])\n\n\ndef fit_and_evaluate(\n    name: str,\n    train: pd.DataFrame,\n    test: pd.DataFrame,\n    features: list[str],\n    results: list[dict],\n) -> np.ndarray:\n    model = LinearRegression()\n    model.fit(train[features], train[\"pm25_next\"])\n    pred = model.predict(test[features])\n    metrics = regression_metrics(test[\"pm25_next\"], pred)\n    print(\n        f\"{name:<20} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\"\n    )\n    results.append(\n        {\n            \"模型\": name,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n        }\n    )\n    return pred\n\n\ndef main() -> None:\n    print_title(\"第 7 课：周期编码对照实验\")\n\n    explain_problem()\n\n    df = make_target(load_time_features())\n    split_index = int(len(df) * 0.8)\n    train = df.iloc[:split_index]\n    test = df.iloc[split_index:]\n\n    print_step(\"2. 同一个任务、同一段时间切分，只改特征写法\")\n    print(f\"训练集 {len(train)} 行，测试集 {len(test)} 行。\")\n\n    results: list[dict] = []\n\n    pred_raw = fit_and_evaluate(\"原始数字时间\", train, test, RAW_FEATURES, results)\n    pred_cyclic = fit_and_evaluate(\"周期编码时间\", train, test, CYCLIC_FEATURES, results)\n\n    result_df = pd.DataFrame(results)\n    result_df.to_csv(RESULT_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"\\n结果表已保存：{RESULT_CSV}\")\n\n    prediction_df = pd.DataFrame(\n        {\n            \"datetime\": test.index,\n            \"y_true\": test[\"pm25_next\"].to_numpy(),\n            \"pred_raw\": pred_raw,\n            \"pred_cyclic\": pred_cyclic,\n        }\n    )\n    prediction_df.to_csv(PRED_CSV, index=False, encoding=\"utf-8-sig\")\n    print(f\"预测值已保存：{PRED_CSV}\")\n\n    print(\"\\n怎么解读：\")\n    print(\"- 如果周期编码后的 MAE/RMSE 更小、R2 更大，说明它确实有帮助。\")\n    print(\"- 如果差别很小，也不代表周期编码没用，可能只是这个数据/模型没利用好它。\")\n    print(\"- 不要把结论写成“sin/cos 一定更好”，要写成“在这个数据、这个模型、这段测试期上，结果如何”。\")\n    print(\"\\n下一步：python scripts/08_lag_rolling_features.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"lag-rolling","title":"08 滞后与滑动窗口","group":"特征工程","file":"scripts/08_lag_rolling_features.py","cmd":"python scripts\\08_lag_rolling_features.py","summary":"shift 造 lag，rolling 造均值/波动/极值，并故意造出 _leaky 错误特征。","code":"\"\"\"第 8 课：滞后（lag）和滑动窗口（rolling）特征。\n\n先约定预测场景（非常重要）：\n    站在时间 t，用截至 t 已经知道的信息，预测 t+1 时刻的 pm2.5。\n\n所以：\n- t 时刻的 pm2.5、天气，都是“已经知道”的，可以用。\n- t+1 及以后的值，绝对不能作为特征，否则就是作弊（数据泄漏）。\n\n本脚本会生成：\n1. 正确特征：lag、diff、trailing rolling；\n2. 故意错误特征：中心滑动窗口（会看到未来）、把答案当特征；\n   它们只用于第 9 课的错误示范，不能放进正式模型。\n\n运行：python scripts/08_lag_rolling_features.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_clean_data,\n    print_step,\n    print_title,\n)\n\nOUT_CSV = PROCESSED_DIR / \"pm25_model_data.csv\"\nALIGN_CSV = TABLES_DIR / \"08_time_alignment.csv\"\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef add_time_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 先把第 5 课的时间特征加上\")\n\n    df = df.copy()\n    index = df.index\n    df[\"year\"] = index.year\n    df[\"month\"] = index.month\n    df[\"day\"] = index.day\n    df[\"hour\"] = index.hour\n    df[\"dayofweek\"] = index.dayofweek\n    df[\"weekday_name\"] = index.dayofweek.map(lambda x: WEEKDAY_NAMES[x])\n    df[\"is_weekend\"] = (index.dayofweek >= 5).astype(int)\n    df[\"dayofyear\"] = index.dayofyear\n\n    df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\n    df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n    df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12)\n    df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12)\n\n    print(\"时间特征已加上。\")\n    return df\n\n\ndef add_lag_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 滞后特征 lag：把过去的值挪到当前行\")\n\n    df = df.copy()\n\n    # 当前值：站在 t 时刻，pm2.5 已经测到了，当然可以用。\n    df[\"pm25_now\"] = df[\"pm2.5\"]\n\n    # shift(1) 表示“上一小时的值”，shift(24) 表示“昨天同一小时”。\n    df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1)\n    df[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2)\n    df[\"pm25_lag3\"] = df[\"pm2.5\"].shift(3)\n    df[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24)\n    df[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168)  # 24*7，上周同一小时\n\n    # diff 是“变化量”：比昨天同一小时高了多少？\n    df[\"pm25_diff1\"] = df[\"pm2.5\"].diff(1)\n    df[\"pm25_diff24\"] = df[\"pm2.5\"].diff(24)\n\n    print(\"新增：pm25_now, pm25_lag1/2/3/24/168, pm25_diff1, pm25_diff24\")\n    print(\"解释：lag24 能帮模型看到“昨天这个时候的污染水平”，lag168 看“上周同一时刻”。\")\n    return df\n\n\ndef add_rolling_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"3. 滑动窗口特征 rolling：最近的均值、波动、最大值\")\n\n    df = df.copy()\n\n    # 注意：窗口在 t 时刻结束（trailing window），里面的值都 <= t，预测 t+1 时是安全的。\n    # 数据里有少量长缺口，所以 min_periods 不要求 24/168 个值全部存在：\n    # 24 小时窗口至少要有 18 个值，168 小时窗口至少要有 120 个值。\n    # 既不会因为个别缺失就把整行丢掉，也不会只靠一两个值硬算平均。\n    window24 = df[\"pm2.5\"].rolling(window=24, min_periods=18)\n    window168 = df[\"pm2.5\"].rolling(window=168, min_periods=120)\n\n    df[\"pm25_roll24_mean\"] = window24.mean()\n    df[\"pm25_roll24_std\"] = window24.std()\n    df[\"pm25_roll24_max\"] = window24.max()\n    df[\"pm25_roll24_min\"] = window24.min()\n\n    df[\"pm25_roll168_mean\"] = window168.mean()\n    df[\"pm25_roll168_std\"] = window168.std()\n\n    print(\"新增：roll24 的 mean/std/max/min，roll168 的 mean/std。\")\n    print(\"min_periods=18 表示：24 小时窗口里至少有 18 个有效值才算；不够就填 NaN。\")\n\n    # 另外给天气变量也做几个滞后/滑动特征，体会同一套方法可以用在其他列上。\n    df[\"TEMP_lag1\"] = df[\"TEMP\"].shift(1)\n    df[\"TEMP_roll24_mean\"] = df[\"TEMP\"].rolling(24, min_periods=18).mean()\n    print(\"另外加了 TEMP_lag1、TEMP_roll24_mean 作为其他变量的例子。\")\n    return df\n\n\ndef add_target(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"4. 定义预测目标：下一个小时的 pm2.5\")\n\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n\n    print(\"pm25_next = pm2.5.shift(-1)，也就是把未来一行的值移到当前行。\")\n    print(\"这一列是“答案”，只能当 y，不能当特征 X。\")\n    return df\n\n\ndef add_leaky_demo_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"5. 故意制造两个“错误示范”特征，供下一课打脸用\")\n\n    df = df.copy()\n\n    # 错误 1：center=True 表示窗口中心在当前时刻，会看到 t+1、t+2... 的未来值。\n    df[\"pm25_roll24_mean_center_leaky\"] = df[\"pm2.5\"].rolling(\n        window=24, center=True, min_periods=24\n    ).mean()\n    df[\"pm25_roll168_mean_center_leaky\"] = df[\"pm2.5\"].rolling(\n        window=168, center=True, min_periods=168\n    ).mean()\n\n    # 错误 2：直接把答案挪过来当特征，这是最离谱的作弊方式。\n    df[\"pm25_answer_leaky\"] = df[\"pm25_next\"]\n\n    print(\"已创建 _leaky 结尾的错误特征。\")\n    print(\"名字里带 leaky 的列禁止进入正式模型，它们只用来演示“分数为什么会假高”。\")\n    return df\n\n\ndef show_alignment(df: pd.DataFrame) -> None:\n    print_step(\"6. 看一眼时间对齐：每一行到底用了哪些时刻的数据\")\n\n    columns = [\n        \"pm2.5\",\n        \"pm25_lag1\",\n        \"pm25_lag24\",\n        \"pm25_roll24_mean\",\n        \"pm25_next\",\n    ]\n    demo = df[columns].iloc[200:206]\n    print(demo.to_string())\n    print(\"\\n读表方法：\")\n    print(\"- 以某一行为当前时刻 t；\")\n    print(\"- pm25_lag1 是 t-1 的值；\")\n    print(\"- pm25_roll24_mean 是 t-23 到 t 这 24 个值的平均；\")\n    print(\"- pm25_next 是 t+1 的值，也就是我们要预测的答案。\")\n\n    demo.to_csv(ALIGN_CSV, encoding=\"utf-8-sig\")\n    print(f\"\\n对齐示例已保存：{ALIGN_CSV}\")\n\n\ndef main() -> None:\n    print_title(\"第 8 课：滞后特征 + 滑动窗口特征\")\n\n    df = load_clean_data()\n    df = add_time_features(df)\n    df = add_lag_features(df)\n    df = add_rolling_features(df)\n    df = add_target(df)\n    df = add_leaky_demo_features(df)\n    show_alignment(df)\n\n    print_step(\"7. 保存完整建模数据\")\n    df.to_csv(OUT_CSV, encoding=\"utf-8-sig\")\n    print(f\"已保存：{OUT_CSV}\")\n    print(f\"总列数：{df.shape[1]}\")\n\n    print(\"\\n完成！下一步：python scripts/09_model_comparison.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"compare","title":"09 模型对比与泄漏演示","group":"建模实验","file":"scripts/09_model_comparison.py","cmd":"python scripts\\09_model_comparison.py","summary":"多组特征对照、消融实验、中心滑窗泄漏、把答案当特征。","code":"\"\"\"第 9 课：把各种特征放在一起对比，并亲手演示数据泄漏。\n\n对比模型（全部用同一段训练/测试时间，除最后两个错误示范）：\n1. 平均值基线：永远猜训练集平均值\n2. 持续法基线：把当前 pm2.5 直接当成下一小时预测\n3. 只用原始时间特征\n4. 用周期编码时间特征\n5. 周期编码 + 滞后特征\n6. 周期编码 + 滞后 + 滑动窗口 + 天气（完整正确版）\n7. 错误示范：中心滑动窗口，偷看了未来\n8. 错误示范：把答案当特征，R2 约为 1\n9. 错误示范：随机切分时间序列\n\n运行：python scripts/09_model_comparison.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardScaler\n\nfrom common import (\n    TABLES_DIR,\n    load_model_data,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"09_model_comparison.csv\"\nABLATION_CSV = TABLES_DIR / \"09_ablation.csv\"\nPRED_CSV = TABLES_DIR / \"09_test_predictions.csv\"\nCOEF_CSV = TABLES_DIR / \"09_feature_coefficients.csv\"\n\nTIME_RAW = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\nTIME_CYC = [\n    \"is_weekend\",\n    \"hour_sin\",\n    \"hour_cos\",\n    \"dayofweek_sin\",\n    \"dayofweek_cos\",\n    \"month_sin\",\n    \"month_cos\",\n]\nLAGS = [\n    \"pm25_now\",\n    \"pm25_lag1\",\n    \"pm25_lag2\",\n    \"pm25_lag3\",\n    \"pm25_lag24\",\n    \"pm25_lag168\",\n    \"pm25_diff1\",\n    \"pm25_diff24\",\n]\nROLLS = [\n    \"pm25_roll24_mean\",\n    \"pm25_roll24_std\",\n    \"pm25_roll24_max\",\n    \"pm25_roll24_min\",\n    \"pm25_roll168_mean\",\n    \"pm25_roll168_std\",\n]\nWEATHER = [\"TEMP\", \"DEWP\", \"PRES\", \"Iws\", \"Is\", \"Ir\", \"TEMP_lag1\", \"TEMP_roll24_mean\"]\nLEAKY_CENTER = [\"pm25_roll24_mean_center_leaky\", \"pm25_roll168_mean_center_leaky\"]\nLEAKY_ANSWER = [\"pm25_answer_leaky\"]\n\n\ndef prepare_data() -> pd.DataFrame:\n    df = load_model_data()\n    needed = TIME_RAW + TIME_CYC + LAGS + ROLLS + WEATHER + LEAKY_CENTER + LEAKY_ANSWER + [\"pm25_next\"]\n    needed = list(dict.fromkeys(needed))  # 去重，保持顺序\n    df = df.dropna(subset=needed)\n    # 为了公平对比，错误特征在 dropna 后也一起留下；正式模型只是不选它们而已。\n    return df\n\n\ndef evaluate(\n    name: str,\n    feature_desc: str,\n    split_desc: str,\n    y_true: pd.Series,\n    y_pred: np.ndarray,\n    trust: str,\n    results: list[dict],\n) -> None:\n    metrics = regression_metrics(y_true, y_pred)\n    print(\n        f\"{name:<28} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}  [{trust}]\"\n    )\n    results.append(\n        {\n            \"实验\": name,\n            \"特征\": feature_desc,\n            \"切分方式\": split_desc,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n            \"是否可信\": trust,\n        }\n    )\n\n\ndef fit_predict(train: pd.DataFrame, test: pd.DataFrame, features: list[str]) -> np.ndarray:\n    model = LinearRegression()\n    model.fit(train[features], train[\"pm25_next\"])\n    return model.predict(test[features])\n\n\ndef main() -> None:\n    print_title(\"第 9 课：特征对照实验 + 数据泄漏演示\")\n\n    df = prepare_data()\n    split_index = int(len(df) * 0.8)\n    train = df.iloc[:split_index]\n    test = df.iloc[split_index:]\n\n    print(f\"总行数：{len(df)}，训练集 {len(train)}，测试集 {len(test)}\")\n    print(f\"训练时间：{train.index.min()} 到 {train.index.max()}\")\n    print(f\"测试时间：{test.index.min()} 到 {test.index.max()}\")\n\n    y_train = train[\"pm25_next\"]\n    y_test = test[\"pm25_next\"]\n    results: list[dict] = []\n\n    print_step(\"1. 正规对比（测试期都在训练期之后）\")\n\n    # 1. 平均值基线\n    mean_pred = np.full(len(test), y_train.mean())\n    evaluate(\"平均值基线\", \"无\", \"按时间 8:2\", y_test, mean_pred, \"可信\", results)\n\n    # 2. 持续法：直接把当前 pm2.5 当作下一小时\n    persistence_pred = test[\"pm25_now\"].to_numpy()\n    evaluate(\"持续法基线\", \"当前 pm2.5\", \"按时间 8:2\", y_test, persistence_pred, \"可信\", results)\n\n    pred_time_raw = fit_predict(train, test, TIME_RAW)\n    evaluate(\"只用原始时间特征\", \"month/day/hour/weekday...\", \"按时间 8:2\", y_test, pred_time_raw, \"可信\", results)\n\n    pred_time_cyc = fit_predict(train, test, TIME_CYC)\n    evaluate(\"只用周期编码时间\", \"hour_sin/cos...\", \"按时间 8:2\", y_test, pred_time_cyc, \"可信\", results)\n\n    pred_lags = fit_predict(train, test, TIME_CYC + LAGS)\n    evaluate(\"周期编码 + 滞后\", \"时间 + lag/diff\", \"按时间 8:2\", y_test, pred_lags, \"可信\", results)\n\n    full_features = TIME_CYC + LAGS + ROLLS + WEATHER\n    pred_full = fit_predict(train, test, full_features)\n    evaluate(\"完整正确版\", \"周期 + 滞后 + 滑动 + 天气\", \"按时间 8:2\", y_test, pred_full, \"可信\", results)\n\n    print_step(\"2. 错误示范：为什么会得到“假高分”\")\n\n    pred_center_leaky = fit_predict(train, test, TIME_CYC + LAGS + LEAKY_CENTER + WEATHER)\n    evaluate(\"中心滑动窗口（泄漏）\", \"窗口包含了未来值\", \"按时间 8:2\", y_test, pred_center_leaky, \"不可信\", results)\n\n    pred_answer_leaky = fit_predict(train, test, TIME_CYC + LAGS + LEAKY_ANSWER + WEATHER)\n    evaluate(\"把答案当特征（作弊）\", \"pm25_answer_leaky = 答案\", \"按时间 8:2\", y_test, pred_answer_leaky, \"不可信\", results)\n\n    # 随机切分：时间顺序被打乱，虽然有滞后列都 <= t，但它不代表“预测未来”。\n    train_random, test_random = train_test_split(df, test_size=0.2, shuffle=True, random_state=42)\n    pred_random = fit_predict(train_random, test_random, full_features)\n    evaluate(\n        \"随机切分（错误做法）\",\n        \"完整正确特征\",\n        \"随机 8:2\",\n        test_random[\"pm25_next\"],\n        pred_random,\n        \"不可信\",\n        results,\n    )\n\n    print_step(\"3. 哪些特征组有用？做“拿掉一组”对照（消融实验）\")\n    ablation_specs = [\n        (\"完整特征\", full_features),\n        (\"去掉滞后\", TIME_CYC + ROLLS + WEATHER),\n        (\"去掉滑动窗口\", TIME_CYC + LAGS + WEATHER),\n        (\"去掉天气\", TIME_CYC + LAGS + ROLLS),\n        (\"只留时间特征\", TIME_CYC),\n    ]\n\n    ablation_rows = []\n    for name, features in ablation_specs:\n        pred = fit_predict(train, test, features)\n        metrics = regression_metrics(y_test, pred)\n        print(f\"  {name:<12} MAE={metrics['MAE']:7.3f}  RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\")\n        ablation_rows.append(\n            {\n                \"实验\": name,\n                \"特征个数\": len(features),\n                \"MAE\": round(metrics[\"MA
