ok.py --page-break-chapters  # 每一章从新页开始\n\n输出：\n\n    outputs\\\\知识点与代码速查.html\n    outputs\\\\知识点与代码速查.pdf\n\n说明：默认不强制每章分页，纸张利用率更高。如果确实需要把每一章\n分开打印或装订，再加 --page-break-chapters。\n\n不需要额外安装任何软件。只要电脑上有 Chrome 或 Edge（Windows\n一般都有）就能出 PDF。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport shutil\nimport subprocess\nimport sys\nimport tempfile\nfrom datetime import datetime\nfrom pathlib import Path\nfrom urllib.parse import quote\n\nimport markdown\n\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\nSOURCE_MD = PROJECT_ROOT / \"docs\" / \"08-知识点与代码速查.md\"\nOUTPUT_DIR = PROJECT_ROOT / \"outputs\"\nHTML_PATH = OUTPUT_DIR / \"知识点与代码速查.html\"\nPDF_PATH = OUTPUT_DIR / \"知识点与代码速查.pdf\"\n\nBROWSER_CANDIDATES = [\n    r\"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe\",\n    r\"C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe\",\n    r\"C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\",\n    r\"C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe\",\n    \"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome\",\n    \"/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge\",\n]\n\n# 紧凑打印样式：默认不强制章节换页，靠留白和标题色块区分层级。\n# 这样可以把正文塞进前一页的剩余空间，避免每章末尾出现半页空白。\nPRINT_CSS_TEMPLATE = \"\"\"\n@page {\n  size: A4;\n  margin: 12mm 11mm 12mm;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: \"Microsoft YaHei\", \"Microsoft YaHei UI\", \"PingFang SC\", \"Segoe UI\", sans-serif;\n  font-size: 9.9pt;\n  line-height: 1.5;\n  color: #1b2733;\n  -webkit-print-color-adjust: exact;\n  print-color-adjust: exact;\n}\n\n/* 章节标题：紧凑色块，醒目但不占地方 */\nh1 {\n  font-size: 14.5pt;\n  line-height: 1.3;\n  margin: 14pt 0 6pt;\n  padding: 4pt 8pt;\n  background: #e9f2f0;\n  border-left: 4pt solid #0f7b6c;\n  color: #0a5f53;\n  break-inside: avoid;\n  page-break-inside: avoid;\n  break-after: avoid;\n  page-break-after: avoid;\n}\n\n/* 封面标题保持大标题样式 */\nh1:first-of-type {\n  font-size: 20pt;\n  line-height: 1.25;\n  margin: 0 0 10pt;\n  padding: 0 0 6pt;\n  background: transparent;\n  border-left: 0;\n  border-bottom: 2px solid #0f7b6c;\n  break-before: avoid;\n  page-break-before: avoid;\n}\n\n/*__CHAPTER_BREAK__*/\n\nh2 {\n  font-size: 11.3pt;\n  line-height: 1.35;\n  margin: 10pt 0 4pt;\n  padding-bottom: 1.5pt;\n  border-bottom: 1px solid #dfe8e6;\n  color: #14435c;\n  break-after: avoid;\n  page-break-after: avoid;\n}\n\nh3 {\n  font-size: 10.2pt;\n  line-height: 1.35;\n  margin: 8pt 0 3pt;\n  color: #37505f;\n  break-after: avoid;\n  page-break-after: avoid;\n}\n\np {\n  margin: 3pt 0;\n  orphans: 2;\n  widows: 2;\n}\n\n/* 说明文字后面紧跟着列表或代码时，不要把它单独留在页底 */\np:has(+ ul), p:has(+ ol), p:has(+ pre) {\n  break-after: avoid;\n  page-break-after: avoid;\n}\n\nh1 + *, h2 + *, h3 + * {\n  break-before: avoid;\n  page-break-before: avoid;\n}\n\n/* 代码块：浅底 + 左侧色条，长行自动换行，避免被裁掉 */\npre {\n  background: #f5f7fa;\n  border: 1px solid #d9e0e7;\n  border-left: 3px solid #0f7b6c;\n  border-radius: 2px;\n  padding: 4.5pt 6pt;\n  margin: 4.5pt 0;\n  font-family: \"Cascadia Mono\", Consolas, \"Courier New\", monospace;\n  font-size: 8.05pt;\n  line-height: 1.42;\n  white-space: pre-wrap;\n  word-break: break-word;\n  tab-size: 2;\n  break-inside: avoid;\n  page-break-inside: avoid;\n}\n\n/* 代码块尽量和紧随其后的说明留在同一页 */\npre + p { break-before: avoid; page-break-before: avoid; }\n\npre code {\n  background: transparent;\n  border: 0;\n  padding: 0;\n  font-size: inherit;\n  color: #16324a;\n}\n\ncode {\n  font-family: \"Cascadia Mono\", Consolas, \"Courier New\", monospace;\n  font-size: 8.8pt;\n  background: #eef1f4;\n  border: 1px solid #e2e6eb;\n  border-radius: 2px;\n  padding: 0 1.5pt;\n  color: #24435c;\n  word-break: break-word;\n}\n\n/* 表格：表头跨页重复，行不被拆开 */\ntable {\n  width: 100%;\n  border-collapse: collapse;\n  margin: 5pt 0;\n  font-size: 8.35pt;\n  line-height: 1.38;\n}\n\nthead { display: table-header-group; }\ntr { page-break-inside: avoid; break-inside: avoid; }\n\nth, td {\n  border: 1px solid #ccd4dc;\n  padding: 2pt 3.5pt;\n  text-align: left;\n  vertical-align: top;\n}\n\nth { background: #eef4f3; color: #0a5f53; font-weight: 700; }\n\nblockquote {\n  margin: 6pt 0;\n  padding: 5pt 8pt;\n  background: #f0f7f5;\n  border-left: 3px solid #0f7b6c;\n  border-radius: 0 2px 2px 0;\n  color: #2d3b45;\n  font-size: 9.5pt;\n}\n\nblockquote p { margin: 2pt 0; }\n\nul, ol {\n  margin: 2.5pt 0;\n  padding-left: 17pt;\n}\n\nli { margin: 1pt 0; }\nli > ul, li > ol { margin-top: 1pt; margin-bottom: 1pt; }\n\nhr {\n  border: 0;\n  border-top: 1px dashed #d8e0e6;\n  margin: 7pt 0;\n}\n\na { color: #14435c; text-decoration: none; }\n\n/* 封面上的目录 */\n.toc {\n  margin: 8pt 0 3pt;\n  padding: 6pt 8pt;\n  border: 1px solid #d9e0e7;\n  border-radius: 3px;\n  background: #fbfcfd;\n  break-inside: avoid;\n  page-break-inside: avoid;\n}\n\n.toc-title { font-weight: 700; color: #0a5f53; margin-bottom: 3pt; font-size: 9.4pt; }\n.toc ul { margin: 0; padding-left: 0; list-style: none; column-count: 2; column-gap: 18pt; }\n.toc li { margin: 1pt 0; font-size: 9pt; }\n.toc a { color: #24435c; }\n\n.meta-line {\n  font-size: 8.6pt;\n  color: #6b7885;\n  margin: 2pt 0 0;\n}\n\n@media print {\n  a { color: #24435c; }\n  .no-print { display: none; }\n}\n\"\"\"\n\nCHAPTER_BREAK_CSS = \"\"\"\n/* 可选：每一章从新的一页开始（适合分章打印或装订） */\nh1 {\n  break-before: page;\n  page-break-before: always;\n}\nh1:first-of-type {\n  break-before: avoid;\n  page-break-before: avoid;\n}\n\"\"\"\n\nHTML_TEMPLATE = \"\"\"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>{title}<\/title>\n<style>{css}<\/style>\n<\/head>\n<body>\n{body}\n<\/body>\n<\/html>\n\"\"\"\n\n\ndef read_text(path: Path) -> str:\n    try:\n        return path.read_text(encoding=\"utf-8-sig\")\n    except UnicodeDecodeError:\n        return path.read_text(encoding=\"gbk\", errors=\"replace\")\n\n\ndef find_browser() -> str | None:\n    \"\"\"找一个能打印 PDF 的浏览器。\"\"\"\n    for candidate in BROWSER_CANDIDATES:\n        path = Path(candidate)\n        if path.exists():\n            return str(path)\n\n    for name in (\"chrome\", \"google-chrome\", \"chromium\", \"msedge\", \"microsoft-edge\"):\n        found = shutil.which(name)\n        if found:\n            return found\n    return None\n\n\ndef build_css(page_break_chapters: bool) -> str:\n    chapter_rule = CHAPTER_BREAK_CSS if page_break_chapters else \"\"\n    return PRINT_CSS_TEMPLATE.replace(\"/*__CHAPTER_BREAK__*/\", chapter_rule)\n\n\ndef render_html(markdown_text: str, page_break_chapters: bool = False) -> str:\n    md = markdown.Markdown(\n        extensions=[\"tables\", \"fenced_code\", \"sane_lists\", \"attr_list\", \"toc\", \"md_in_html\"],\n        extension_configs={\"toc\": {\"toc_depth\": \"1-1\", \"permalink\": False}},\n    )\n    body = md.convert(markdown_text)\n\n    toc_html = \"\"\n    if getattr(md, \"toc\", \"\"):\n        mode_text = \"每章从新的一页开始\" if page_break_chapters else \"连续排版，节省纸张\"\n        toc_html = (\n            f'<nav class=\"toc\"><div class=\"toc-title\">目录（{mode_text}）<\/div>'\n            + md.toc\n            + \"<\/nav>\"\n        )\n        # 把目录插在封面说明（第一个引用块）之后\n        marker = \"<\/blockquote>\"\n        position = body.find(marker)\n        if position >= 0:\n            position += len(marker)\n            body = body[:position] + toc_html + body[position:]\n        else:\n            body = toc_html + body\n\n    layout_note = (\n        \"打印建议：A4、缩放 100%（每章另起一页）\"\n        if page_break_chapters\n        else \"打印建议：A4、缩放 100%（连续紧凑排版，已尽量减少空白）\"\n    )\n    meta = (\n        '<p class=\"meta-line\">项目：time-series-feature-engineering'\n        f\"　|　生成时间：{datetime.now():%Y-%m-%d %H:%M}\"\n        f\"　|　{layout_note}<\/p>\"\n    )\n    body = body.replace(\"<\/h1>\", \"<\/h1>\" + meta, 1)\n\n    return HTML_TEMPLATE.format(\n        title=\"时序特征工程 · 知识点与代码速查手册\",\n        css=build_css(page_break_chapters),\n        body=body,\n    )\n\n\ndef print_pdf(browser: str, html_path: Path, pdf_path: Path) -> bool:\n    \"\"\"调用浏览器把 HTML 打成 PDF。\"\"\"\n    if pdf_path.exists():\n        pdf_path.unlink()\n\n    with tempfile.TemporaryDirectory(prefix=\"handbook-print-\") as user_data_dir:\n        html_url = \"file:///\" + quote(html_path.as_posix(), safe=\"/:\")\n        command = [\n            browser,\n            \"--headless=new\",\n            \"--disable-gpu\",\n            \"--no-first-run\",\n            \"--no-pdf-header-footer\",\n            f\"--user-data-dir={user_data_dir}\",\n            f\"--print-to-pdf={pdf_path}\",\n            html_url,\n        ]\n        try:\n            subprocess.run(command, capture_output=True, timeout=180, check=False)\n        except (OSError, subprocess.TimeoutExpired):\n            return False\n\n    return pdf_path.exists() and pdf_path.stat().st_size > 20_000\n\n\ndef report_pdf(pdf_path: Path) -> None:\n    \"\"\"如果装了 pypdf，就顺便报一下页数，方便确认没有打空。\"\"\"\n    try:\n        from pypdf import PdfReader\n    except ImportError:\n        return\n    try:\n        reader = PdfReader(str(pdf_path))\n        print(f\"PDF 页数：{len(reader.pages)} 页\")\n    except Exception:\n        pass\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=\"生成《知识点与代码速查手册》的 HTML 和 PDF\")\n    parser.add_argument(\"--no-pdf\", action=\"store_true\", help=\"只生成 HTML，不生成 PDF\")\n    parser.add_argument(\n        \"--page-break-chapters\",\n        action=\"store_true\",\n        help=\"每一章从新的一页开始（默认关闭，连续排版更省纸）\",\n    )\n    args = parser.parse_args()\n\n    if not SOURCE_MD.exists():\n        print(f\"找不到源文件：{SOURCE_MD}\")\n        raise SystemExit(1)\n\n    OUTPUT_DIR.mkdir(parents=True, exist_ok=True)\n    markdown_text = read_text(SOURCE_MD)\n    html = render_html(markdown_text, page_break_chapters=args.page_break_chapters)\n    HTML_PATH.write_text(html, encoding=\"utf-8\")\n    print(f\"已生成 HTML：{HTML_PATH}\")\n\n    if args.no_pdf:\n        print(\"（按 --no-pdf 要求，跳过 PDF）\")\n        return\n\n    browser = find_browser()\n    if not browser:\n        print(\"没有找到 Chrome 或 Edge，无法自动生成 PDF。\")\n        print(f\"可以打开 {HTML_PATH}，按 Ctrl + P 手动打印成 PDF。\")\n        return\n\n    print(f\"正在用浏览器打印 PDF：{browser}\")\n    if print_pdf(browser, HTML_PATH, PDF_PATH):\n        size_kb = PDF_PATH.stat().st_size / 1024\n        print(f\"已生成 PDF：{PDF_PATH}（{size_kb:.0f} KB）\")\n        report_pdf(PDF_PATH)\n    else:\n        print(\"PDF 生成失败。可以打开 HTML 后按 Ctrl + P，选择“另存为 PDF”。\")\n        raise SystemExit(1)\n\n\nif __name__ == \"__main__\":\n    main()\n"},"guide/build_share_zip.py":{"path":"guide/build_share_zip.py","name":"build_share_zip.py","size":12445,"mtime":"2026-10-09 15:03","ext":".py","kind":"text","href":"guide/build_share_zip.py","text":"\"\"\"生成“解压后双击就能看”的离线分享压缩包。\n\n用法（在项目根目录）：\n\n    python guide\\\\build_share_zip.py\n    python guide\\\\build_share_zip.py --no-rebuild\n    python guide\\\\build_share_zip.py --no-zip\n\n输出：\n\n    dist\\\\时序特征工程学习指引-离线版\\\\index.html\n    dist\\\\时序特征工程学习指引-离线版.zip\n\n压缩包里包含：\n- 网页本体（教程、脚本、表格数据已内嵌在 HTML 里）；\n- 图片、知识点速查 PDF、源码、笔记模板；\n- 一个内置的文件清单，所以“项目文件”页在离线状态下也能浏览。\n\n限制：\n- 不包含 data/ 里的原始数据和处理后数据，压缩包更小，适合分享阅读；\n- “选择其他文件夹”功能仍然依赖浏览器权限，Chrome / Edge 支持。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport re\nimport shutil\nimport subprocess\nimport sys\nimport zipfile\nfrom datetime import datetime\nfrom pathlib import Path\nfrom urllib.parse import quote, unquote\n\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\nGUIDE_DIR = PROJECT_ROOT / \"guide\"\nOUTPUT_DIR = PROJECT_ROOT / \"outputs\"\nDIST_DIR = PROJECT_ROOT / \"dist\"\n\nPACKAGE_NAME = \"时序特征工程学习指引-离线版\"\nPACKAGE_DIR = DIST_DIR / PACKAGE_NAME\nZIP_PATH = DIST_DIR / f\"{PACKAGE_NAME}.zip\"\n\nGUIDE_INDEX = GUIDE_DIR / \"index.html\"\nDATA_RE = re.compile(\n    r'(<script id=\"guide-data\" type=\"application/json\">)(.*?)(<\/script>)',\n    re.S,\n)\n\nINCLUDE_ROOTS = (\"docs\", \"notes\", \"scripts\", \"guide\", \"outputs\")\nINCLUDE_ROOT_FILES = (\"README.md\", \"requirements.txt\", \"run_all.ps1\")\nSKIP_PARTS = {\".git\", \".venv\", \"venv\", \"__pycache__\", \"node_modules\", \"dist\"}\n\nIMAGE_EXTENSIONS = {\".png\", \".jpg\", \".jpeg\", \".gif\", \".svg\", \".webp\", \".bmp\", \".ico\"}\nTEXT_EXTENSIONS = {\n    \".py\",\n    \".md\",\n    \".txt\",\n    \".json\",\n    \".csv\",\n    \".js\",\n    \".css\",\n    \".html\",\n    \".ps1\",\n    \".yml\",\n    \".yaml\",\n    \".toml\",\n    \".sql\",\n    \".gitignore\",\n}\nEMBED_TEXT_LIMIT = 200 * 1024\n\n\ndef read_text(path: Path) -> str:\n    \"\"\"读文本，优先 UTF-8，失败再试 GBK。\"\"\"\n    try:\n        return path.read_text(encoding=\"utf-8-sig\")\n    except UnicodeDecodeError:\n        return path.read_text(encoding=\"gbk\", errors=\"replace\")\n\n\ndef write_text(path: Path, text: str) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_text(text, encoding=\"utf-8-sig\")\n\n\ndef run_builder(script: Path) -> None:\n    print(f\"正在重新生成：{script.relative_to(PROJECT_ROOT)}\")\n    result = subprocess.run(\n        [sys.executable, \"-X\", \"utf8\", str(script)],\n        cwd=PROJECT_ROOT,\n        check=False,\n    )\n    if result.returncode != 0:\n        raise SystemExit(f\"生成失败：{script}\")\n\n\ndef iter_source_files() -> list[Path]:\n    \"\"\"列出要放进压缩包的文件，跳过虚拟环境和缓存。\"\"\"\n    files: list[Path] = []\n\n    for name in INCLUDE_ROOT_FILES:\n        path = PROJECT_ROOT / name\n        if path.is_file():\n            files.append(path)\n\n    for root_name in INCLUDE_ROOTS:\n        root = PROJECT_ROOT / root_name\n        if not root.exists():\n            continue\n        for path in root.rglob(\"*\"):\n            if not path.is_file():\n                continue\n            relative = path.relative_to(PROJECT_ROOT)\n            if set(relative.parts) & SKIP_PARTS:\n                continue\n            # 离线包的根目录已经有一份 index.html，不再重复收录原始页面。\n            if relative.as_posix() == \"guide/index.html\":\n                continue\n            files.append(path)\n\n    unique = {path.relative_to(PROJECT_ROOT).as_posix(): path for path in files}\n    return [unique[key] for key in sorted(unique)]\n\n\ndef url_path(path: str) -> str:\n    \"\"\"把文件路径转成浏览器可以打开的相对 URL。\"\"\"\n    return \"/\".join(quote(part) for part in path.split(\"/\"))\n\n\ndef kind_of(path: Path) -> str:\n    suffix = path.suffix.lower()\n    if suffix in IMAGE_EXTENSIONS:\n        return \"image\"\n    if suffix == \".csv\":\n        return \"csv\"\n    if suffix in TEXT_EXTENSIONS:\n        return \"text\"\n    return \"binary\"\n\n\ndef build_file_records(paths: list[Path]) -> dict[str, dict]:\n    \"\"\"给每个文件建立离线清单，顺便把不太大的文本内嵌进页面。\"\"\"\n    records: dict[str, dict] = {}\n\n    for path in paths:\n        relative = path.relative_to(PROJECT_ROOT).as_posix()\n        stat = path.stat()\n        suffix = path.suffix.lower()\n        record = {\n            \"path\": relative,\n            \"name\": path.name,\n            \"size\": stat.st_size,\n            \"mtime\": datetime.fromtimestamp(stat.st_mtime).strftime(\"%Y-%m-%d %H:%M\"),\n            \"ext\": suffix,\n            \"kind\": kind_of(path),\n            \"href\": url_path(relative),\n        }\n        if suffix in TEXT_EXTENSIONS and stat.st_size <= EMBED_TEXT_LIMIT:\n            try:\n                record[\"text\"] = read_text(path)\n            except OSError:\n                pass\n        records[relative] = record\n\n    return records\n\n\ndef file_node(record: dict) -> dict:\n    return {\n        \"type\": \"file\",\n        \"name\": record[\"name\"],\n        \"path\": record[\"path\"],\n        \"size\": record[\"size\"],\n        \"mtime\": record[\"mtime\"],\n        \"ext\": record[\"ext\"],\n        \"kind\": record[\"kind\"],\n    }\n\n\ndef build_tree(records: dict[str, dict]) -> list[dict]:\n    \"\"\"把扁平文件清单变成侧边栏使用的树结构。\"\"\"\n    root: dict = {\"dirs\": {}, \"files\": []}\n\n    for record in records.values():\n        parts = record[\"path\"].split(\"/\")\n        node = root\n        for part in parts[:-1]:\n            node = node[\"dirs\"].setdefault(part, {\"dirs\": {}, \"files\": []})\n        node[\"files\"].append(record)\n\n    def convert(node: dict, prefix: str = \"\") -> list[dict]:\n        result: list[dict] = []\n\n        for name in sorted(node[\"dirs\"]):\n            child = node[\"dirs\"][name]\n            path = f\"{prefix}/{name}\" if prefix else name\n            result.append(\n                {\n                    \"type\": \"dir\",\n                    \"name\": name,\n                    \"path\": path,\n                    \"children\": convert(child, path),\n                }\n            )\n\n        for record in sorted(node[\"files\"], key=lambda item: item[\"name\"].lower()):\n            result.append(file_node(record))\n\n        return result\n\n    return convert(root)\n\n\ndef load_guide_data(index_html: str) -> tuple[dict, re.Match[str]]:\n    match = DATA_RE.search(index_html)\n    if not match:\n        raise SystemExit(\"没有在 guide/index.html 里找到 guide-data 数据块。\")\n    try:\n        data = json.loads(match.group(2))\n    except json.JSONDecodeError as exc:\n        raise SystemExit(f\"guide-data 不是合法 JSON：{exc}\") from exc\n    return data, match\n\n\ndef packaged_route(route: str, records: dict[str, dict]) -> bool:\n    \"\"\"搜索索引里指向未打包文件的条目要删掉，避免点开变成死链。\"\"\"\n    if not route.startswith(\"#file-\"):\n        return True\n    path = unquote(route[len(\"#file-\") :])\n    return path in records\n\n\ndef make_offline_html(index_html: str, data: dict, records: dict[str, dict]) -> str:\n    data[\"projectRoot\"] = \"离线分享版（解压后双击 index.html）\"\n    data[\"offline\"] = {\n        \"rootName\": PACKAGE_NAME,\n        \"rootPath\": \"离线压缩包（打包时快照）\",\n        \"fileCount\": len(records),\n        \"files\": records,\n        \"tree\": build_tree(records),\n        \"builtAt\": datetime.now().strftime(\"%Y-%m-%d %H:%M\"),\n    }\n\n    # 图片和 PDF 在压缩包根目录，路径从 outputs/ 改成 outputs/。\n    for figure in data.get(\"figures\", []):\n        record = records.get(figure.get(\"file\", \"\"))\n        if record:\n            figure[\"href\"] = record[\"href\"]\n            figure[\"exists\"] = True\n\n    data[\"search\"] = [\n        entry for entry in data.get(\"search\", [])\n        if packaged_route(entry.get(\"route\", \"\"), records)\n    ]\n\n    payload = json.dumps(data, ensure_ascii=False, separators=(\",\", \":\"))\n    payload = payload.replace(\"outputs/\", \"outputs/\")\n    payload = payload.replace(\"<\/\", \"<\\\\/\").replace(\"\\u2028\", \"\\\\u2028\").replace(\"\\u2029\", \"\\\\u2029\")\n\n    rendered = DATA_RE.sub(\n        lambda match: match.group(1) + payload + match.group(3),\n        index_html,\n        count=1,\n    )\n    rendered = rendered.replace(\n        \"<title>时序特征工程 · 学习指引<\/title>\",\n        \"<title>时序特征工程 · 学习指引（离线版）<\/title>\",\n        1,\n    )\n    rendered = rendered.replace('href=\"style.css\"', 'href=\"guide/style.css\"', 1)\n    rendered = rendered.replace('src=\"vendor/lucide.min.js\"', 'src=\"guide/vendor/lucide.min.js\"', 1)\n    rendered = rendered.replace('src=\"app.js\"', 'src=\"guide/app.js\"', 1)\n    return rendered\n\n\ndef reset_package_dir() -> None:\n    DIST_DIR.mkdir(parents=True, exist_ok=True)\n    resolved = PACKAGE_DIR.resolve()\n    if resolved.parent != DIST_DIR.resolve() or resolved.name != PACKAGE_NAME:\n        raise SystemExit(\"拒绝清理意外的目录。\")\n    if resolved.exists():\n        shutil.rmtree(resolved)\n    resolved.mkdir(parents=True, exist_ok=True)\n\n\ndef copy_package_files(records: dict[str, dict]) -> None:\n    for relative in records:\n        source = PROJECT_ROOT / relative\n        target = PACKAGE_DIR / relative\n        target.parent.mkdir(parents=True, exist_ok=True)\n        shutil.copy2(source, target)\n\n\ndef write_readme() -> None:\n    text = f\"\"\"时序特征工程 · 学习指引（离线分享版）\n\n怎么打开\n1. 先把压缩包完整解压到任意文件夹。\n2. 双击里面的 index.html，用 Chrome 或 Edge 打开。\n3. 左边的目录、搜索、代码复制、图表、表格、速查 PDF 都可以离线使用。\n\n说明\n- 教程、脚本、表格数据和文件清单已经打包进网页；\n- 图片和 PDF 放在 outputs/ 文件夹，不要单独把 index.html 拖出来；\n- “项目文件”页展示的是打包时的文件快照；\n- 如果要读取自己电脑上的其他文件夹，可以点“选择其他文件夹”（Chrome / Edge 支持）。\n\n打包时间：{datetime.now():%Y-%m-%d %H:%M}\n\"\"\"\n    write_text(PACKAGE_DIR / \"打开前先看我.txt\", text)\n\n\ndef create_zip() -> None:\n    if ZIP_PATH.exists():\n        ZIP_PATH.unlink()\n\n    with zipfile.ZipFile(ZIP_PATH, \"w\", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:\n        for path in sorted(PACKAGE_DIR.rglob(\"*\")):\n            if path.is_file():\n                arcname = path.relative_to(DIST_DIR).as_posix()\n                archive.write(path, arcname)\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=\"生成可以分享的离线学习指引压缩包\")\n    parser.add_argument(\"--no-rebuild\", action=\"store_true\", help=\"不重新生成教程和 PDF，直接打包\")\n    parser.add_argument(\"--no-zip\", action=\"store_true\", help=\"只生成文件夹，不生成 zip\")\n    args = parser.parse_args()\n\n    if not args.no_rebuild:\n        run_builder(GUIDE_DIR / \"build_guide.py\")\n        run_builder(GUIDE_DIR / \"build_handbook.py\")\n\n    if not GUIDE_INDEX.exists():\n        raise SystemExit(\"找不到 guide/index.html，请先运行 python guide\\\\build_guide.py\")\n\n    index_html = GUIDE_INDEX.read_text(encoding=\"utf-8-sig\")\n    data, _ = load_guide_data(index_html)\n\n    paths = iter_source_files()\n    records = build_file_records(paths)\n\n    reset_package_dir()\n    copy_package_files(records)\n\n    # 根目录首页：资源路径改成 guide/...，数据路径改成 outputs/...\n    share_html = make_offline_html(index_html, data, records)\n    (PACKAGE_DIR / \"index.html\").write_text(share_html, encoding=\"utf-8\")\n    write_readme()\n\n    folder_size = sum(path.stat().st_size for path in PACKAGE_DIR.rglob(\"*\") if path.is_file())\n\n    print()\n    print(f\"离线文件夹：{PACKAGE_DIR}\")\n    print(f\"文件数量：{len(records) + 1} 个，文件夹大小约 {folder_size / 1024 / 1024:.1f} MB\")\n\n    if args.no_zip:\n        print(\"按 --no-zip 要求，没有生成压缩包。\")\n        return\n\n    create_zip()\n    zip_size = ZIP_PATH.stat().st_size / 1024 / 1024\n\n    with zipfile.ZipFile(ZIP_PATH) as archive:\n        broken = archive.testzip()\n        if broken:\n            raise SystemExit(f\"压缩包校验失败：{broken}\")\n\n    print(f\"分享压缩包：{ZIP_PATH}（{zip_size:.1f} MB）\")\n    print(\"发给别人后，对方解压并双击 index.html 就能看。\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},"guide/server.py":{"path":"guide/server.py","name":"server.py","size":8500,"mtime":"2026-10-08 23:25","ext":".py","kind":"text","href":"guide/server.py","text":"\"\"\"本地学习服务器：网页 + 读取项目文件夹。\n\n用法（在项目根目录打开 PowerShell）：\n\n    python guide\\\\server.py                  # 默认端口 8765\n    python guide\\\\server.py --port 8899      # 端口被占用时换一个\n\n它做了三件事：\n\n1. 把整个项目目录当普通静态网站提供出去（所以 guide/index.html、图片、表格都能打开）；\n2. 多提供两个接口，让网页能\"读取文件夹\"：\n       GET /api/tree                 → 项目文件树（JSON）\n       GET /api/file?path=docs/x.md  → 某个文本文件的内容（JSON）\n3. 打开 http://127.0.0.1:8765/ 会自动跳到网页指引。\n\n注意：接口只允许读取本项目文件夹里的内容，不能读电脑上的其他目录。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport sys\nfrom datetime import datetime\nfrom http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer\nfrom pathlib import Path\nfrom urllib.parse import parse_qs, unquote, urlparse\n\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\nGUIDE_URL = \"/guide/index.html\"\n\nMAX_TEXT_BYTES = 512 * 1024   # 单个文本文件最多返回 512 KB\nMAX_DEPTH = 5                 # 文件树最多展开 5 层\nMAX_FILES = 2000              # 文件树最多列出 2000 个文件\n\nSKIP_DIRS = {\n    \".git\", \".venv\", \"venv\", \"__pycache__\", \"node_modules\",\n    \".idea\", \".vscode\", \".pytest_cache\", \".ipynb_checkpoints\",\n    \".mypy_cache\", \".ruff_cache\",\n}\n\nTEXT_EXT = {\n    \".py\", \".md\", \".txt\", \".json\", \".ps1\", \".bat\", \".sh\", \".js\", \".mjs\",\n    \".css\", \".html\", \".yml\", \".yaml\", \".toml\", \".ini\", \".cfg\", \".sql\",\n    \".tex\", \".csv\", \".gitignore\", \".editorconfig\",\n}\nIMAGE_EXT = {\".png\", \".jpg\", \".jpeg\", \".gif\", \".svg\", \".webp\", \".bmp\", \".ico\"}\n\n\ndef kind_of(path: Path) -> str:\n    \"\"\"给网页判断该用哪种预览方式。\"\"\"\n    ext = path.suffix.lower()\n    if ext in IMAGE_EXT:\n        return \"image\"\n    if ext == \".csv\":\n        return \"csv\"\n    if ext in TEXT_EXT:\n        return \"text\"\n    return \"binary\"\n\n\ndef relative(path: Path) -> str:\n    return path.relative_to(PROJECT_ROOT).as_posix()\n\n\ndef safe_path(value: str) -> Path:\n    \"\"\"把网页传来的相对路径转成项目内的绝对路径，阻挡越界访问。\"\"\"\n    candidate = (PROJECT_ROOT / unquote(value)).resolve()\n    candidate.relative_to(PROJECT_ROOT)   # 越界会抛 ValueError\n    return candidate\n\n\ndef read_text_file(path: Path) -> tuple[str, str]:\n    \"\"\"按 UTF-8 读，失败再试 GBK，避免中文乱码。\"\"\"\n    for encoding in (\"utf-8-sig\", \"gbk\"):\n        try:\n            return path.read_text(encoding=encoding), encoding\n        except UnicodeDecodeError:\n            continue\n    return path.read_text(encoding=\"utf-8\", errors=\"replace\"), \"utf-8(替换非法字符)\"\n\n\ndef describe_file(path: Path) -> dict:\n    stat = path.stat()\n    return {\n        \"type\": \"file\",\n        \"name\": path.name,\n        \"path\": relative(path),\n        \"size\": stat.st_size,\n        \"mtime\": datetime.fromtimestamp(stat.st_mtime).strftime(\"%Y-%m-%d %H:%M\"),\n        \"ext\": path.suffix.lower(),\n        \"kind\": kind_of(path),\n    }\n\n\ndef build_tree(directory: Path, depth: int = 0, counter: list[int] | None = None) -> list[dict]:\n    \"\"\"递归列出文件树；跳过虚拟环境、缓存等无关目录。\"\"\"\n    if counter is None:\n        counter = [0]\n\n    entries: list[dict] = []\n    try:\n        children = sorted(directory.iterdir(), key=lambda item: (not item.is_dir(), item.name.lower()))\n    except OSError:\n        return entries\n\n    for child in children:\n        if child.name.startswith(\".\") or child.name in SKIP_DIRS:\n            continue\n\n        if child.is_dir():\n            if depth >= MAX_DEPTH:\n                continue\n            entries.append(\n                {\n                    \"type\": \"dir\",\n                    \"name\": child.name,\n                    \"path\": relative(child),\n                    \"children\": build_tree(child, depth + 1, counter),\n                }\n            )\n        elif child.is_file():\n            counter[0] += 1\n            if counter[0] > MAX_FILES:\n                continue\n            entries.append(describe_file(child))\n\n    return entries\n\n\nclass GuideHandler(SimpleHTTPRequestHandler):\n    \"\"\"静态文件 + 两个只读接口。\"\"\"\n\n    def __init__(self, *args, **kwargs):\n        super().__init__(*args, directory=str(PROJECT_ROOT), **kwargs)\n\n    def end_headers(self):\n        # 关掉缓存：改完文件刷新网页就能看到最新内容\n        self.send_header(\"Cache-Control\", \"no-store\")\n        super().end_headers()\n\n    def do_GET(self):\n        parsed = urlparse(self.path)\n\n        if parsed.path == \"/\":\n            self.send_response(302)\n            self.send_header(\"Location\", GUIDE_URL)\n            self.end_headers()\n            return\n\n        if parsed.path == \"/api/tree\":\n            self.send_json(\n                {\n                    \"root\": str(PROJECT_ROOT),\n                    \"name\": PROJECT_ROOT.name,\n                    \"time\": datetime.now().strftime(\"%Y-%m-%d %H:%M\"),\n                    \"entries\": build_tree(PROJECT_ROOT),\n                }\n            )\n            return\n\n        if parsed.path == \"/api/file\":\n            self.handle_file(parse_qs(parsed.query))\n            return\n\n        super().do_GET()\n\n    def handle_file(self, query: dict) -> None:\n        wanted = (query.get(\"path\") or [\"\"])[0]\n        if not wanted:\n            self.send_json({\"error\": \"缺少 path 参数。\"}, status=400)\n            return\n\n        try:\n            target = safe_path(wanted)\n        except ValueError:\n            self.send_json({\"error\": \"这个路径不在项目文件夹里。\"}, status=400)\n            return\n\n        if not target.exists():\n            self.send_json({\"error\": f\"找不到文件：{wanted}\"}, status=404)\n            return\n        if target.is_dir():\n            self.send_json({\"error\": f\"{wanted} 是一个文件夹，不是文件。\"}, status=400)\n            return\n\n        size = target.stat().st_size\n        if size > MAX_TEXT_BYTES:\n            self.send_json(\n                {\n                    \"error\": f\"文件太大了（{size / 1024:.0f} KB），网页只显示 512 KB 以内的文本。\"\n                             \"可以点右上角“新标签打开”看原文件。\",\n                    \"path\": wanted,\n                    \"size\": size,\n                },\n                status=413,\n            )\n            return\n\n        try:\n            text, encoding = read_text_file(target)\n        except OSError as error:\n            self.send_json({\"error\": f\"读取失败：{error}\"}, status=500)\n            return\n\n        self.send_json(\n            {\n                \"path\": relative(target),\n                \"size\": size,\n                \"encoding\": encoding,\n                \"ext\": target.suffix.lower(),\n                \"text\": text,\n            }\n        )\n\n    def send_json(self, payload: dict, status: int = 200) -> None:\n        body = json.dumps(payload, ensure_ascii=False).encode(\"utf-8\")\n        self.send_response(status)\n        self.send_header(\"Content-Type\", \"application/json; charset=utf-8\")\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\n    def log_message(self, fmt: str, *args) -> None:\n        try:\n            message = fmt % args\n        except Exception:\n            message = fmt\n        if \"/api/\" in message:\n            return\n        sys.stdout.write(f\"[{datetime.now():%H:%M:%S}] {message}\\n\")\n        sys.stdout.flush()\n\n\ndef main() -> None:\n    if hasattr(sys.stdout, \"reconfigure\"):\n        sys.stdout.reconfigure(encoding=\"utf-8\", errors=\"replace\")\n\n    parser = argparse.ArgumentParser(description=\"启动“时序特征工程”学习指引本地服务器\")\n    parser.add_argument(\"--port\", type=int, default=8765, help=\"端口号，默认 8765\")\n    parser.add_argument(\"--bind\", default=\"127.0.0.1\", help=\"监听地址，默认只允许本机\")\n    args = parser.parse_args()\n\n    server = ThreadingHTTPServer((args.bind, args.port), GuideHandler)\n    print(f\"项目目录：{PROJECT_ROOT}\")\n    print(f\"网页地址：http://{args.bind}:{args.port}{GUIDE_URL}\")\n    print(\"按 Ctrl + C 停止服务器。\")\n\n    try:\n        server.serve_forever()\n    except KeyboardInterrupt:\n        print(\"\\n服务器已停止。\")\n    finally:\n        server.server_close()\n\n\nif __name__ == \"__main__\":\n    main()\n"},"guide/start-server.ps1":{"path":"guide/start-server.ps1","name":"start-server.ps1","size":1562,"mtime":"2026-10-08 23:25","ext":".ps1","kind":"text","href":"guide/start-server.ps1","text":"# 启动“学习指引”本地网页服务器（Windows PowerShell）\n#\n# 用法：在项目根目录打开 PowerShell，输入\n#   powershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1\n#\n# 然后在浏览器里打开：\n#   http://127.0.0.1:8765/guide/index.html\n#\n# 为什么需要服务器：\n# 1. 网页里的图片和表格在 outputs 文件夹，直接用 file:// 打开时部分浏览器会拦截；\n# 2. 网页里的“项目文件”要读取文件夹，浏览器只允许本地服务这么做。\n\nparam(\n    [int]$Port = 8765\n)\n\n$ErrorActionPreference = \"Stop\"\n$ProjectRoot = Split-Path -Parent $PSScriptRoot\n\n$Python = Join-Path $ProjectRoot \".venv\\Scripts\\python.exe\"\nif (-not (Test-Path $Python)) {\n    $Python = \"python\"\n}\n\n$Url = \"http://127.0.0.1:$Port/guide/index.html\"\n\nWrite-Host \"项目目录：$ProjectRoot\" -ForegroundColor DarkGray\nWrite-Host \"空闲端口：$Port\" -ForegroundColor DarkGray\n\n$busy = $null\nif (Get-Command Get-NetTCPConnection -ErrorAction SilentlyContinue) {\n    $busy = Get-NetTCPConnection -State Listen -LocalPort $Port -ErrorAction SilentlyContinue\n}\nif ($busy) {\n    Write-Host \"端口 $Port 已被占用，换一个端口试试：\" -ForegroundColor Yellow\n    Write-Host \"  powershell -File .\\guide\\start-server.ps1 -Port 8899\" -ForegroundColor Yellow\n    exit 1\n}\n\nWrite-Host \"`n学习指引地址：$Url\" -ForegroundColor Green\nWrite-Host \"按 Ctrl + C 停止服务器。`n\" -ForegroundColor DarkGray\n\nStart-Process $Url\n& $Python (Join-Path $PSScriptRoot \"server.py\") --port $Port --bind 127.0.0.1\n"},"guide/style.css":{"path":"guide/style.css","name":"style.css","size":24029,"mtime":"2026-10-08 23:26","ext":".css","kind":"text","href":"guide/style.css","text":"/* 时序特征工程 · 学习指引 —— 样式表\n   设计目标：像一个安静的工具，信息密度够高，读代码和表格不费眼。 */\n\n:root {\n  --bg: #f3f5f7;\n  --panel: #ffffff;\n  --panel-soft: #f8fafb;\n  --panel-sunken: #eef1f4;\n  --border: #e1e6ec;\n  --border-strong: #ccd4dd;\n\n  --text: #1b2733;\n  --text-soft: #46555f;\n  --text-muted: #78868f;\n\n  --accent: #0f7b6c;\n  --accent-strong: #0a5f53;\n  --accent-soft: #e4f3f0;\n\n  --link: #1d5fbf;\n  --link-soft: #e8f0fd;\n\n  --warn-bg: #fdf4e3;\n  --warn-text: #8a5308;\n  --warn-border: #f0dcb4;\n\n  --danger-bg: #fdeded;\n  --danger-text: #a12525;\n  --danger-border: #f3caca;\n\n  --ok-bg: #e9f6ed;\n  --ok-text: #1c6b36;\n  --ok-border: #c6e4cf;\n\n  --code-bg: #1d2530;\n  --code-bg-head: #151c25;\n  --code-text: #dbe4ee;\n\n  --radius: 8px;\n  --radius-sm: 6px;\n  --shadow-sm: 0 1px 2px rgba(21, 31, 41, 0.06);\n  --shadow-md: 0 10px 28px rgba(21, 31, 41, 0.14);\n\n  --font: \"Segoe UI\", \"Microsoft YaHei UI\", \"Microsoft YaHei\", \"PingFang SC\", system-ui, sans-serif;\n  --font-mono: \"Cascadia Mono\", \"Consolas\", \"Courier New\", \"Microsoft YaHei\", monospace;\n}\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font);\n  font-size: 15px;\n  line-height: 1.7;\n  -webkit-font-smoothing: antialiased;\n}\n\na { color: var(--link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\nbutton { font-family: inherit; font-size: inherit; cursor: pointer; }\n\nsvg.lucide { width: 18px; height: 18px; flex: 0 0 auto; }\n\n/* ---------------------------------------------------------------- 布局 */\n\n.app {\n  display: grid;\n  grid-template-columns: 296px minmax(0, 1fr);\n  min-height: 100vh;\n}\n\n.sidebar {\n  position: sticky;\n  top: 0;\n  height: 100vh;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  padding: 16px 14px 12px;\n  background: var(--panel);\n  border-right: 1px solid var(--border);\n  overflow: hidden;\n  z-index: 40;\n}\n\n.main {\n  min-width: 0;\n  display: flex;\n  flex-direction: column;\n}\n\n/* ---------------------------------------------------------------- 品牌 */\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 2px 4px 4px;\n}\n\n.brand-icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 34px;\n  height: 34px;\n  border-radius: var(--radius-sm);\n  background: var(--accent-soft);\n  color: var(--accent-strong);\n}\n\n.brand strong { display: block; font-size: 15px; line-height: 1.3; }\n.brand span { display: block; font-size: 12px; color: var(--text-muted); line-height: 1.4; }\n\n/* ---------------------------------------------------------------- 搜索 */\n\n.search-box {\n  position: relative;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 7px 10px;\n  background: var(--panel-sunken);\n  border: 1px solid transparent;\n  border-radius: var(--radius-sm);\n  color: var(--text-muted);\n}\n\n.search-box:focus-within {\n  background: var(--panel);\n  border-color: var(--accent);\n  box-shadow: 0 0 0 3px rgba(15, 123, 108, 0.12);\n}\n\n.search-box input {\n  flex: 1 1 auto;\n  min-width: 0;\n  border: 0;\n  background: transparent;\n  outline: none;\n  font-size: 13.5px;\n  color: var(--text);\n  font-family: inherit;\n}\n\n.search-box kbd {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  color: var(--text-muted);\n  background: var(--panel);\n  border: 1px solid var(--border-strong);\n  border-bottom-width: 2px;\n  border-radius: 4px;\n  padding: 0 5px;\n}\n\n.search-results {\n  position: absolute;\n  top: calc(100% + 6px);\n  left: 0;\n  right: 0;\n  max-height: 52vh;\n  overflow-y: auto;\n  background: var(--panel);\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-md);\n  padding: 6px;\n  z-index: 60;\n}\n\n.search-results .sr-item {\n  display: block;\n  width: 100%;\n  text-align: left;\n  border: 0;\n  background: transparent;\n  border-radius: var(--radius-sm);\n  padding: 7px 9px;\n  color: var(--text);\n}\n\n.search-results .sr-item:hover,\n.search-results .sr-item.is-active { background: var(--accent-soft); }\n\n.search-results .sr-title { font-size: 13.5px; font-weight: 600; display: block; }\n.search-results .sr-meta { font-size: 11.5px; color: var(--text-muted); display: block; }\n.search-results .sr-empty { padding: 10px; color: var(--text-muted); font-size: 13px; }\n\n/* ---------------------------------------------------------------- 导航 */\n\n.nav {\n  flex: 1 1 auto;\n  overflow-y: auto;\n  padding-right: 2px;\n  margin-right: -2px;\n}\n\n.nav-group { margin-bottom: 12px; }\n\n.nav-group-title {\n  font-size: 11.5px;\n  font-weight: 700;\n  letter-spacing: 0.04em;\n  color: var(--text-muted);\n  padding: 6px 8px 4px;\n}\n\n.nav-item {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 7px 9px;\n  border-radius: var(--radius-sm);\n  color: var(--text-soft);\n  font-size: 13.5px;\n  border-left: 2px solid transparent;\n}\n\n.nav-item:hover { background: var(--panel-sunken); color: var(--text); text-decoration: none; }\n\n.nav-item.is-active {\n  background: var(--accent-soft);\n  border-left-color: var(--accent);\n  color: var(--accent-strong);\n  font-weight: 600;\n}\n\n.nav-item svg.lucide { width: 16px; height: 16px; opacity: 0.9; }\n.nav-item .nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n.sidebar-foot {\n  border-top: 1px solid var(--border);\n  padding-top: 10px;\n}\n\n.ghost-btn {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  width: 100%;\n  padding: 8px 10px;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius-sm);\n  background: var(--panel);\n  color: var(--text-soft);\n  font-size: 13px;\n}\n\n.ghost-btn:hover { background: var(--panel-sunken); color: var(--text); }\n\n/* ---------------------------------------------------------------- 顶栏 */\n\n.topbar {\n  position: sticky;\n  top: 0;\n  z-index: 20;\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 10px 24px;\n  background: rgba(255, 255, 255, 0.94);\n  backdrop-filter: blur(6px);\n  border-bottom: 1px solid var(--border);\n}\n\n.crumb { flex: 1 1 auto; font-size: 14px; font-weight: 600; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n.top-actions { display: flex; align-items: center; gap: 8px; }\n\n.icon-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 34px;\n  height: 34px;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius-sm);\n  background: var(--panel);\n  color: var(--text-soft);\n}\n\n.icon-btn:hover { background: var(--panel-sunken); color: var(--text); }\n\n.menu-btn { display: none; }\n\n.primary-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 8px 13px;\n  border: 1px solid var(--accent-strong);\n  border-radius: var(--radius-sm);\n  background: var(--accent);\n  color: #fff;\n  font-size: 13.5px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.primary-btn:hover { background: var(--accent-strong); }\n.primary-btn svg.lucide { width: 16px; height: 16px; }\n\n/* ---------------------------------------------------------------- 内容 */\n\n.content {\n  width: 100%;\n  max-width: 1020px;\n  padding: 26px 24px 80px;\n  margin: 0 auto;\n}\n\n.page-head { margin-bottom: 20px; }\n\n.page-head h1 {\n  margin: 0 0 6px;\n  font-size: 25px;\n  line-height: 1.35;\n  letter-spacing: 0;\n}\n\n.page-head .summary { margin: 0; color: var(--text-soft); font-size: 14.5px; }\n\n.meta-row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 12px;\n  min-width: 0;\n}\n\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 3px 9px;\n  border-radius: 999px;\n  font-size: 12px;\n  background: var(--panel-sunken);\n  color: var(--text-soft);\n  border: 1px solid var(--border);\n  max-width: 100%;\n  overflow-wrap: anywhere;\n}\n\n.chip svg.lucide { width: 13px; height: 13px; }\n.chip.accent { background: var(--accent-soft); border-color: #c6e5df; color: var(--accent-strong); }\n\n.panel {\n  background: var(--panel);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  padding: 18px 20px;\n  box-shadow: var(--shadow-sm);\n}\n\n.panel + .panel { margin-top: 16px; }\n\n.panel-title {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin: 0 0 10px;\n  font-size: 16px;\n}\n\n.panel-title svg.lucide { color: var(--accent); }\n\n.section-title {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin: 26px 0 12px;\n  font-size: 17px;\n}\n\n.section-title svg.lucide { color: var(--accent); }\n\n.muted { color: var(--text-muted); font-size: 13.5px; }\n\n/* 首页快速开始 */\n\n.quick-steps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); margin: 14px 0 4px; }\n\n.step {\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  padding: 14px 15px;\n  background: var(--panel-soft);\n}\n\n.step .step-no {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 22px;\n  height: 22px;\n  border-radius: 50%;\n  background: var(--accent);\n  color: #fff;\n  font-size: 12px;\n  font-weight: 700;\n  margin-bottom: 8px;\n}\n\n.step strong { display: block; font-size: 14.5px; margin-bottom: 4px; }\n.step p { margin: 0 0 10px; font-size: 13.5px; color: var(--text-soft); }\n\n/* 概念卡片 */\n\n.concept-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); }\n\n.concept-card {\n  display: block;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--panel);\n  padding: 14px 15px;\n  color: var(--text);\n  box-shadow: var(--shadow-sm);\n}\n\n.concept-card:hover { border-color: var(--accent); text-decoration: none; }\n.concept-card .concept-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }\n.concept-card .concept-head svg.lucide { color: var(--accent); }\n.concept-card strong { font-size: 14.5px; }\n.concept-card p { margin: 0; font-size: 13px; color: var(--text-soft); }\n\n/* 统计条 */\n\n.stat-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); }\n\n.stat {\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--panel-soft);\n  padding: 10px 13px;\n}\n\n.stat b { display: block; font-size: 20px; line-height: 1.3; color: var(--accent-strong); }\n.stat span { font-size: 12.5px; color: var(--text-muted); }\n\n/* ---------------------------------------------------------------- Markdown 正文 */\n\n.md { font-size: 15px; }\n\n.md > h1:first-child { display: none; }\n\n.md h2 {\n  margin: 34px 0 12px;\n  padding-bottom: 7px;\n  font-size: 20px;\n  border-bottom: 1px solid var(--border);\n}\n\n.md h3 { margin: 24px 0 8px; font-size: 16.5px; }\n.md h4 { margin: 18px 0 6px; font-size: 15px; color: var(--text-soft); }\n\n.md p { margin: 10px 0; }\n.md ul, .md ol { margin: 10px 0; padding-left: 24px; }\n.md li { margin: 5px 0; }\n.md strong { color: #101a24; }\n\n.md a { border-bottom: 1px solid rgba(29, 95, 191, 0.35); }\n.md a:hover { text-decoration: none; border-bottom-color: var(--link); }\n\n.md code {\n  font-family: var(--font-mono);\n  font-size: 13px;\n  background: var(--panel-sunken);\n  border: 1px solid var(--border);\n  border-radius: 4px;\n  padding: 1px 5px;\n  color: #24435c;\n  word-break: break-word;\n}\n\n.md pre,\n.code-block pre {\n  margin: 0;\n  padding: 14px 16px;\n  overflow-x: auto;\n  background: var(--code-bg);\n  color: var(--code-text);\n  font-family: var(--font-mono);\n  font-size: 13px;\n  line-height: 1.65;\n  tab-size: 4;\n}\n\n.md pre code,\n.code-block pre code {\n  background: transparent;\n  border: 0;\n  padding: 0;\n  color: inherit;\n  font-size: inherit;\n  white-space: pre;\n  word-break: normal;\n}\n\n.md blockquote {\n  margin: 14px 0;\n  padding: 10px 14px;\n  background: var(--accent-soft);\n  border-left: 3px solid var(--accent);\n  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;\n  color: var(--text-soft);\n}\n\n.md blockquote p { margin: 4px 0; }\n\n.md hr { margin: 28px 0; border: 0; border-top: 1px dashed var(--border-strong); }\n\n.md img { max-width: 100%; height: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }\n\n/* 代码块外壳（由 app.js 生成） */\n\n.code-block {\n  position: relative;\n  margin: 14px 0;\n  border-radius: var(--radius);\n  overflow: hidden;\n  background: var(--code-bg);\n  border: 1px solid #2b3949;\n}\n\n.code-head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 10px;\n  padding: 5px 8px 5px 12px;\n  background: var(--code-bg-head);\n  border-bottom: 1px solid #2b3949;\n}\n\n.code-lang {\n  font-family: var(--font-mono);\n  font-size: 11.5px;\n  color: #9fb2c6;\n  letter-spacing: 0.03em;\n  text-transform: lowercase;\n}\n\n.code-copy {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 4px 9px;\n  border: 1px solid #3a4a5d;\n  border-radius: var(--radius-sm);\n  background: transparent;\n  color: #b9c8d8;\n  font-size: 12px;\n}\n\n.code-copy:hover { background: #253243; color: #fff; }\n.code-copy svg.lucide { width: 14px; height: 14px; }\n\n/* 命令行（页面里显示的“怎么运行”） */\n\n.cmd-line {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  flex-wrap: wrap;\n  margin-top: 10px;\n  padding: 10px 12px;\n  background: var(--code-bg);\n  color: var(--code-text);\n  border-radius: var(--radius-sm);\n  font-family: var(--font-mono);\n  font-size: 13px;\n  overflow-x: auto;\n}\n\n.cmd-line code { white-space: pre; }\n.cmd-line .cmd-text { flex: 1 1 320px; min-width: 0; overflow-x: auto; }\n\n/* ---------------------------------------------------------------- 表格 */\n\n.table-wrap {\n  margin: 14px 0;\n  overflow-x: auto;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--panel);\n}\n\ntable.data-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 13.5px;\n}\n\ntable.data-table th,\ntable.data-table td {\n  padding: 8px 12px;\n  text-align: left;\n  border-bottom: 1px solid var(--border);\n  vertical-align: top;\n  white-space: nowrap;\n}\n\ntable.data-table th {\n  background: var(--panel-soft);\n  font-size: 12.5px;\n  font-weight: 700;\n  color: var(--text-soft);\n  position: sticky;\n  top: 0;\n}\n\ntable.data-table tbody tr:hover { background: #f7fbfa; }\ntable.data-table tbody tr:last-child td { border-bottom: 0; }\n\ntable.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; }\n\ntable.data-table td.trust,\ntable.data-table td.untrust {\n  font-size: 12px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\ntable.data-table td.trust { color: var(--ok-text); }\ntable.data-table td.untrust { color: var(--danger-text); }\n\n.table-card + .table-card { margin-top: 22px; }\n.table-card { scroll-margin-top: 76px; }\n.table-card h2 { margin: 0 0 4px; font-size: 17px; }\n.table-card .file-path { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); word-break: break-all; }\n\n.report-pre {\n  margin: 12px 0 0;\n  padding: 14px 16px;\n  background: var(--panel-soft);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-sm);\n  font-family: var(--font-mono);\n  font-size: 12.5px;\n  line-height: 1.6;\n  overflow-x: auto;\n  white-space: pre;\n  color: var(--text-soft);\n}\n\n/* ---------------------------------------------------------------- 图廊 */\n\n.figure-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }\n\n.figure-card {\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--panel);\n  padding: 12px;\n  box-shadow: var(--shadow-sm);\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.figure-card img {\n  width: 100%;\n  height: auto;\n  display: block;\n  border: 1px solid var(--border);\n  border-radius: var(--radius-sm);\n  background: #fff;\n  cursor: zoom-in;\n}\n\n.figure-card .fig-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }\n.figure-card strong { font-size: 14.5px; }\n.figure-card p { margin: 0; font-size: 13px; color: var(--text-soft); }\n.figure-card .fig-path { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); word-break: break-all; }\n\n/* ---------------------------------------------------------------- 学习路线 */\n\n.roadmap-list { display: grid; gap: 12px; }\n\n.roadmap-item {\n  display: flex;\n  align-items: flex-start;\n  gap: 14px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--panel);\n  padding: 14px 16px;\n  box-shadow: var(--shadow-sm);\n}\n\n.roadmap-item.is-done { border-color: var(--ok-border); background: linear-gradient(0deg, var(--ok-bg), var(--ok-bg)); }\n\n.roadmap-check {\n  margin-top: 3px;\n  width: 18px;\n  height: 18px;\n  accent-color: var(--accent);\n  cursor: pointer;\n  flex: 0 0 auto;\n}\n\n.roadmap-body { flex: 1 1 auto; min-width: 0; }\n.roadmap-body .day { font-size: 12px; font-weight: 700; color: var(--accent-strong); }\n.roadmap-body strong { display: block; font-size: 15px; margin: 2px 0 4px; }\n.roadmap-body p { margin: 0 0 8px; font-size: 13.5px; color: var(--text-soft); }\n\n.link-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 5px 10px;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius-sm);\n  background: var(--panel);\n  color: var(--text-soft);\n  font-size: 12.5px;\n}\n\n.link-btn:hover { border-color: var(--accent); color: var(--accent-strong); text-decoration: none; }\n.link-btn svg.lucide { width: 14px; height: 14px; }\n\n.progress-line {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  margin: 6px 0 18px;\n  font-size: 13px;\n  color: var(--text-soft);\n}\n\n.progress-track {\n  flex: 1 1 auto;\n  height: 8px;\n  border-radius: 999px;\n  background: var(--panel-sunken);\n  overflow: hidden;\n  border: 1px solid var(--border);\n}\n\n.progress-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }\n\n/* ---------------------------------------------------------------- 导师要求 */\n\n.req-list { display: grid; gap: 10px; }\n\n.req-item {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--panel);\n  padding: 12px 16px;\n  box-shadow: var(--shadow-sm);\n}\n\n.req-no {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 46px;\n  padding: 4px 8px;\n  border-radius: var(--radius-sm);\n  background: var(--accent-soft);\n  color: var(--accent-strong);\n  font-family: var(--font-mono);\n  font-size: 12.5px;\n  font-weight: 700;\n  flex: 0 0 auto;\n}\n\n.req-body { flex: 1 1 auto; min-width: 0; }\n.req-body strong { display: block; font-size: 14.5px; }\n.req-body span { font-size: 13px; color: var(--text-soft); }\n\n/* ---------------------------------------------------------------- 提示条 */\n\n.note {\n  display: flex;\n  gap: 10px;\n  padding: 12px 14px;\n  border-radius: var(--radius);\n  border: 1px solid var(--warn-border);\n  background: var(--warn-bg);\n  color: var(--warn-text);\n  font-size: 13.5px;\n  margin: 14px 0;\n}\n\n.note svg.lucide { margin-top: 2px; }\n\n.note.danger { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }\n.note.ok { border-color: var(--ok-border); background: var(--ok-bg); color: var(--ok-text); }\n\n/* ---------------------------------------------------------------- toast / dialog */\n\n.toast {\n  position: fixed;\n  left: 50%;\n  bottom: 26px;\n  transform: translate(-50%, 12px);\n  background: #16202b;\n  color: #fff;\n  font-size: 13.5px;\n  padding: 9px 16px;\n  border-radius: 999px;\n  box-shadow: var(--shadow-md);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.2s ease, transform 0.2s ease;\n  z-index: 90;\n  max-width: min(90vw, 460px);\n  text-align: center;\n}\n\n.toast.show { opacity: 1; transform: translate(-50%, 0); }\n\n.dialog-backdrop {\n  position: fixed;\n  inset: 0;\n  background: rgba(16, 24, 33, 0.55);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 24px;\n  z-index: 80;\n}\n\n.dialog-backdrop.hidden { display: none; }\n\n.dialog {\n  width: min(1000px, 100%);\n  max-height: 88vh;\n  display: flex;\n  flex-direction: column;\n  background: var(--panel);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-md);\n  overflow: hidden;\n}\n\n.dialog-head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 12px 16px;\n  border-bottom: 1px solid var(--border);\n}\n\n.dialog-head h2 { margin: 0; font-size: 16px; }\n\n.dialog-body { padding: 16px; overflow: auto; }\n.dialog-body img { max-width: 100%; height: auto; display: block; margin: 0 auto; }\n\n/* 侧边栏遮罩（手机上用） */\n\n.nav-scrim {\n  position: fixed;\n  inset: 0;\n  background: rgba(16, 24, 33, 0.45);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.2s ease;\n  z-index: 30;\n}\n\n/* ---------------------------------------------------------------- 响应式 */\n/* ---------------------------------------------------------------- r-strong);\n  border-radius: var(--radius);\n  padding: 46px 16px;\n  text-align: center;\n  color: var(--text-muted);\n  background: var(--panel);\n}\n\n.preview-empty svg.lucide { width: 26px; height: 26px; }\n.preview-empty p { margin: 8px 0 0; font-size: 13.5px; }\n\n\n@media (max-width: 1000px) {\n  .app { grid-template-columns: 1fr; }\n\n  .sidebar {\n    position: fixed;\n    left: 0;\n    top: 0;\n    width: min(86vw, 320px);\n    transform: translateX(-102%);\n    transition: transform 0.22s ease;\n    box-shadow: var(--shadow-md);\n  }\n\n  .app.nav-open .sidebar { transform: none; }\n  .app.nav-open .nav-scrim { opacity: 1; pointer-events: auto; }\n\n  .menu-btn { display: inline-flex; }\n  .files-layout { grid-template-columns: 1fr; }\n  .file-tree { max-height: 46vh; }\n  .content { padding: 18px 16px 70px; }\n  .topbar { padding: 10px 14px; }\n}\n\n@media (max-width: 560px) {\n  .page-head h1 { font-size: 21px; }\n  .md h2 { font-size: 18px; }\n  .figure-grid { grid-template-columns: 1fr; }\n  .top-actions .primary-btn span { display: none; }\n  .top-actions .primary-btn { padding: 8px 10px; }\n  .req-item { flex-direction: column; align-items: flex-start; gap: 8px; }\n}\n"},"guide/vendor/lucide.min.js":{"path":"guide/vendor/lucide.min.js","name":"lucide.min.js","size":447688,"mtime":"2026-10-08 21:33","ext":".js","kind":"text","href":"guide/vendor/lucide.min.js"},"notes/学习笔记模板.md":{"path":"notes/学习笔记模板.md","name":"学习笔记模板.md","size":3249,"mtime":"2026-10-08 21:09","ext":".md","kind":"text","href":"notes/%E5%AD%A6%E4%B9%A0%E7%AC%94%E8%AE%B0%E6%A8%A1%E6%9D%BF.md","text":"# 时序特征工程学习笔记\n\n> 用法：每学一个特征，就复制下面一张表，填满。\n> 这份笔记最后可以直接交给导师，证明你不仅跑了代码，而且知道每个特征在干什么。\n\n## 0. 基本信息\n\n- 姓名：\n- 数据来源：UCI 北京 PM2.5 数据（2010-01-01 至 2014-12-31，每小时一条，UTC）\n- 预测任务：站在时间 t，预测 t+1 时刻的 PM2.5\n- 训练/测试切分：按时间前 80% 训练，后 20% 测试\n\n## 1. 特征笔记（每个特征一张表）\n\n### 示例：hour（小时）\n\n| 项目 | 内容 |\n| --- | --- |\n| 特征名 | hour |\n| 怎么构造 | `df.index.hour`，取值 0-23 |\n| 一句话含义 | 这条记录发生在一天中的第几个小时 |\n| 我期望它有什么用 | 捕捉早晚高峰：不同小时的 PM2.5 平均水平可能不同 |\n| 实验证据 | 第 5 课按小时求平均，发现不同小时均值不同（填具体数值） |\n| 结论 | 保留 / 不保留 / 不确定（写理由） |\n\n### 示例：hour_sin、hour_cos（小时周期编码）\n\n| 项目 | 内容 |\n| --- | --- |\n| 特征名 | hour_sin, hour_cos |\n| 怎么构造 | `sin(2*pi*hour/24)`, `cos(2*pi*hour/24)` |\n| 一句话含义 | 把 0-23 点到圆上，让 23 点和 0 点变成邻居 |\n| 我期望它有什么用 | 让线性模型理解“一天是循环的”，而不是把小时当成一条直线 |\n| 实验证据 | 第 7 课对比：原始数字时间的 MAE = ____，周期编码 MAE = ____ |\n| 结论 | 保留 / 不保留 / 不确定（写理由） |\n\n### 示例：pm25_lag24（滞后 24 小时）\n\n| 项目 | 内容 |\n| --- | --- |\n| 特征名 | pm25_lag24 |\n| 怎么构造 | `df[\"pm2.5\"].shift(24)` |\n| 一句话含义 | 昨天同一小时的 PM2.5 |\n| 我期望它有什么用 | 污染有日周期，昨天同一时刻的值可能和今天相近 |\n| 实验证据 | 第 9 课消融实验：去掉全部滞后后 MAE 从 ____ 变成 ____ |\n| 结论 | 保留 / 不保留 / 不确定（写理由） |\n\n### 示例：pm25_roll24_mean（24 小时滑动平均）\n\n| 项目 | 内容 |\n| --- | --- |\n| 特征名 | pm25_roll24_mean |\n| 怎么构造 | `df[\"pm2.5\"].rolling(24, min_periods=24).mean()` |\n| 一句话含义 | 过去 24 小时（含当前小时）的平均污染水平 |\n| 我期望它有什么用 | 单个小时会抖，平均值能反映近期整体水平 |\n| 实验证据 | 第 9 课对比：去掉滑动窗口后 MAE = ____ |\n| 结论 | 保留 / 不保留 / 不确定（写理由） |\n\n### 轮到你了：自己写 5 个特征\n\n复制上面的表格，至少完成这些特征：\n\n- [ ] month / month_sin / month_cos\n- [ ] dayofweek / dayofweek_sin / dayofweek_cos\n- [ ] is_weekend\n- [ ] pm25_lag1\n- [ ] pm25_lag168\n- [ ] pm25_roll24_std\n- [ ] pm25_diff1\n- [ ] TEMP_lag1\n\n## 2. 我踩过的坑（很重要）\n\n| 日期 | 报错/问题 | 原因 | 怎么解决 |\n| --- | --- | --- | --- |\n|  |  |  |  |\n\n## 3. 一句话总结\n\n用三句话向一个完全不懂的同学解释：\n\n1. 时间戳本身不能直接喂给模型，要拆成年、月、日、小时、星期等数字。\n2. 周期特征（sin/cos）解决“23 点之后又回到 0 点”的问题。\n3. 滞后和滑动窗口提供“过去发生了什么”，但绝不能包含“未来会发生什么”。\n"},"notes/实验记录模板.md":{"path":"notes/实验记录模板.md","name":"实验记录模板.md","size":1999,"mtime":"2026-10-08 21:09","ext":".md","kind":"text","href":"notes/%E5%AE%9E%E9%AA%8C%E8%AE%B0%E5%BD%95%E6%A8%A1%E6%9D%BF.md","text":"# 实验记录\n\n## 实验设置\n\n| 项目 | 内容 |\n| --- | --- |\n| 数据集 | UCI 北京 PM2.5 |\n| 时间范围 | 2010-01-01 至 2014-12-31（UTC，每小时） |\n| 预测目标 | t+1 时刻的 pm2.5 |\n| 模型 | 线性回归（LinearRegression） |\n| 训练/测试 | 按时间前 80% / 后 20% |\n| 评价指标 | MAE、RMSE、R2 |\n\n## 实验 1：特征组对比\n\n> 把 `outputs/tables/09_model_comparison.csv` 的数字抄进来，再写自己的解读。\n\n| 实验 | 特征 | 切分方式 | MAE | RMSE | R2 | 是否可信 | 我的解读 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 平均值基线 | 无 | 按时间 8:2 |  |  |  | 可信 |  |\n| 持续法基线 | 当前 pm2.5 | 按时间 8:2 |  |  |  | 可信 |  |\n| 只用原始时间特征 | month/day/hour... | 按时间 8:2 |  |  |  | 可信 |  |\n| 只用周期编码时间 | sin/cos | 按时间 8:2 |  |  |  | 可信 |  |\n| 周期编码 + 滞后 | + lag/diff | 按时间 8:2 |  |  |  | 可信 |  |\n| 完整正确版 | + 滑动 + 天气 | 按时间 8:2 |  |  |  | 可信 |  |\n| 中心滑动窗口 | 包含未来值 | 按时间 8:2 |  |  |  | 不可信 |  |\n| 把答案当特征 | 作弊 | 按时间 8:2 |  |  |  | 不可信 |  |\n| 随机切分 | 完整特征 | 随机 8:2 |  |  |  | 不可信 |  |\n\n## 实验 2：消融实验（拿掉一组特征会怎样）\n\n| 实验 | 特征个数 | MAE | RMSE | R2 | 我的解读 |\n| --- | --- | --- | --- | --- | --- |\n| 完整特征 |  |  |  |  |  |\n| 去掉滞后 |  |  |  |  |  |\n| 去掉滑动窗口 |  |  |  |  |  |\n| 去掉天气 |  |  |  |  |  |\n| 只留时间特征 |  |  |  |  |  |\n\n## 实验结论模板\n\n1. 和只用时间特征相比，加入滞后特征后 MAE 从 ____ 降到 ____，说明：____。\n2. 滑动窗口特征的加入有没有进一步提升？证据是：____。\n3. 天气特征的表现如何？____。\n4. 我观察到一个“假高分”：____，它的原因是数据泄漏，具体泄漏方式是：____。\n5. 如果重做一次，我会优先改进：____。\n"},"outputs/figures/01_原始序列与趋势.png":{"path":"outputs/figures/01_原始序列与趋势.png","name":"01_原始序列与趋势.png","size":225042,"mtime":"2026-10-08 21:17","ext":".png","kind":"image","href":"outputs/figures/01_%E5%8E%9F%E5%A7%8B%E5%BA%8F%E5%88%97%E4%B8%8E%E8%B6%8B%E5%8A%BF.png"},"outputs/figures/02_滑动平均与差分.png":{"path":"outputs/figures/02_滑动平均与差分.png","name":"02_滑动平均与差分.png","size":252143,"mtime":"2026-10-08 21:17","ext":".png","kind":"image","href":"outputs/figures/02_%E6%BB%91%E5%8A%A8%E5%B9%B3%E5%9D%87%E4%B8%8E%E5%B7%AE%E5%88%86.png"},"outputs/figures/03_周期性观察.png":{"path":"outputs/figures/03_周期性观察.png","name":"03_周期性观察.png","size":46993,"mtime":"2026-10-08 21:17","ext":".png","kind":"image","href":"outputs/figures/03_%E5%91%A8%E6%9C%9F%E6%80%A7%E8%A7%82%E5%AF%9F.png"},"outputs/figures/04_预测对比.png":{"path":"outputs/figures/04_预测对比.png","name":"04_预测对比.png","size":154997,"mtime":"2026-10-08 21:17","ext":".png","kind":"image","href":"outputs/figures/04_%E9%A2%84%E6%B5%8B%E5%AF%B9%E6%AF%94.png"},"outputs/figures/05_ r/24),小时在圆上的纵坐标,和 hour_sin 配对使用\ndayofweek_sin,sin(2*pi*dayofweek/7),星期在圆上的横坐标,表达“周而复始”\ndayofweek_cos,cos(2*pi*dayofweek/7),星期在圆上的纵坐标,和 dayofweek_sin 配对\nmonth_sin,sin(2*pi*(month-1)/12),月份在圆上的横坐标,表达季节循环\nmonth_cos,cos(2*pi*(month-1)/12),月份在圆上的纵坐标,和 month_sin 配对\n"},"outputs/tables/06_baseline_predictions.csv":{"path":"outputs/tables/06_baseline_predictions.csv","name":"06_baseline_predictions.csv","size":584607,"mtime":"2026-10-08 21:17","ext":".csv","kind":"csv","href":"outputs/tables/06_baseline_predictions.csv"},"outputs/tables/06_baseline_results.csv":{"path":"outputs/tables/06_baseline_results.csv","name":"06_baseline_results.csv","size":111,"mtime":"2026-10-08 21:17","ext":".csv","kind":"csv","href":"outputs/tables/06_baseline_results.csv","text":"模型,MAE,RMSE,R2\n平均值基线,69.664,94.43,-0.0\n线性回归（时间特征）,68.539,93.068,0.0286\n"},"outputs/tables/07_cyclic_predictions.csv":{"path":"outputs/tables/07_cyclic_predictions.csv","name":"07_cyclic_predictions.csv","size":586967,"mtime":"2026-10-08 21:17","ext":".csv","kind":"csv","href":"outputs/tables/07_cyclic_predictions.csv"},"outputs/tables/07_cyclic_results.csv":{"path":"outputs/tables/07_cyclic_results.csv","name":"07_cyclic_results.csv","size":105,"mtime":"2026-10-08 21:17","ext":".csv","kind":"csv","href":"outputs/tables/07_cyclic_results.csv","text":"模型,MAE,RMSE,R2\n原始数字时间,68.539,93.068,0.0286\n周期编码时间,68.644,92.853,0.0331\n"},"outputs/tables/08_time_alignment.csv":{"path":"outputs/tables/08_time_alignment.csv","name":"08_time_alignment.csv","size":432,"mtime":"2026-10-08 21:17","ext":".csv","kind":"csv","href":"outputs/tables/08_time_alignment.csv","text":"datetime,pm2.5,pm25_lag1,pm25_lag24,pm25_roll24_mean,pm25_next\n2010-01-09 08:00:00+00:00,93.0,106.0,66.0,178.58333333333334,84.0\n2010-01-09 09:00:00+00:00,84.0,93.0,92.0,178.25,73.0\n2010-01-09 10:00:00+00:00,73.0,84.0,135.0,175.66666666666666,66.0\n2010-01-09 11:00:00+00:00,66.0,73.0,155.0,171.95833333333334,40.0\n2010-01-09 12:00:00+00:00,40.0,66.0,198.0,16 信\n随机切分（错误做法）,完整正确特征,随机 8:2,12.43,21.106,0.9494,不可信\n"},"outputs/tables/09_test_predictions.csv":{"path":"outputs/tables/09_test_predictions.csv","name":"09_test_predictions.csv","size":944565,"mtime":"2026-10-08 21:17","ext":".csv","kind":"csv","href":"outputs/tables/09_test_predictions.csv"},"outputs/tables/python_notes.txt":{"path":"outputs/tables/python_notes.txt","name":"python_notes.txt","size":122,"mtime":"2026-10-09 10:05","ext":".txt","kind":"text","href":"outputs/tables/python_notes.txt","text":"我今天学会了列表、字典、队列、函数和文件读写。\n下一步：用 pandas 读真正的 CSV 数据。\n"},"outputs/知识点与代码速查.html":{"path":"outputs/知识点与代码速查.html","name":"知识点与代码速查.html","size":55367,"mtime":"2026-10-09 15:04","ext":".html","kind":"text","href":"outputs/%E7%9F%A5%E8%AF%86%E7%82%B9%E4%B8%8E%E4%BB%A3%E7%A0%81%E9%80%9F%E6%9F%A5.html","text":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>时序特征工程 · 知识点与代码速查手册<\/title>\n<style>\n@page {\n  size: A4;\n  margin: 12mm 11mm 12mm;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: \"Microsoft YaHei\", \"Microsoft YaHei UI\", \"PingFang SC\", \"Segoe UI\", sans-serif;\n  font-size: 9.9pt;\n  line-height: 1.5;\n  color: #1b2733;\n  -webkit-print-color-adjust: exact;\n  print-color-adjust: exact;\n}\n\n/* 章节标题：紧凑色块，醒目但不占地方 */\nh1 {\n  font-size: 14.5pt;\n  line-height: 1.3;\n  margin: 14pt 0 6pt;\n  padding: 4pt 8pt;\n  background: #e9f2f0;\n  border-left: 4pt solid #0f7b6c;\n  color: #0a5f53;\n  break-inside: avoid;\n  page-break-inside: avoid;\n  break-after: avoid;\n  page-break-after: avoid;\n}\n\n/* 封面标题保持大标题样式 */\nh1:first-of-type {\n  font-size: 20pt;\n  line-height: 1.25;\n  margin: 0 0 10pt;\n  padding: 0 0 6pt;\n  background: transparent;\n  border-left: 0;\n  border-bottom: 2px solid #0f7b6c;\n  break-before: avoid;\n  page-break-before: avoid;\n}\n\n\n\nh2 {\n  font-size: 11.3pt;\n  line-height: 1.35;\n  margin: 10pt 0 4pt;\n  padding-bottom: 1.5pt;\n  border-bottom: 1px solid #dfe8e6;\n  color: #14435c;\n  break-after: avoid;\n  page-break-after: avoid;\n}\n\nh3 {\n  font-size: 10.2pt;\n  line-height: 1.35;\n  margin: 8pt 0 3pt;\n  color: #37505f;\n  break-after: avoid;\n  page-break-after: avoid;\n}\n\np {\n  margin: 3pt 0;\n  orphans: 2;\n  widows: 2;\n}\n\n/* 说明文字后面紧跟着列表或代码时，不要把它单独留在页底 */\np:has(+ ul), p:has(+ ol), p:has(+ pre) {\n  break-after: avoid;\n  page-break-after: avoid;\n}\n\nh1 + *, h2 + *, h3 + * {\n  break-before: avoid;\n  page-break-before: avoid;\n}\n\n/* 代码块：浅底 + 左侧色条，长行自动换行，避免被裁掉 */\npre {\n  background: #f5f7fa;\n  border: 1px solid #d9e0e7;\n  border-left: 3px solid #0f7b6c;\n  border-radius: 2px;\n  padding: 4.5pt 6pt;\n  margin: 4.5pt 0;\n  font-family: \"Cascadia Mono\", Consolas, \"Courier New\", monospace;\n  font-size: 8.05pt;\n  line-height: 1.42;\n  white-space: pre-wrap;\n  word-break: break-word;\n  tab-size: 2;\n  break-inside: avoid;\n  page-break-inside: avoid;\n}\n\n/* 代码块尽量和紧随其后的说明留在同一页 */\npre + p { break-before: avoid; page-break-before: avoid; }\n\npre code {\n  background: transparent;\n  border: 0;\n  padding: 0;\n  font-size: inherit;\n  color: #16324a;\n}\n\ncode {\n  font-family: \"Cascadia Mono\", Consolas, \"Courier New\", monospace;\n  font-size: 8.8pt;\n  background: #eef1f4;\n  border: 1px solid #e2e6eb;\n  border-radius: 2px;\n  padding: 0 1.5pt;\n  color: #24435c;\n  word-break: break-word;\n}\n\n/* 表格：表头跨页重复，行不被拆开 */\ntable {\n  width: 100%;\n  border-collapse: collapse;\n  margin: 5pt 0;\n  font-size: 8.35pt;\n  line-height: 1.38;\n}\n\nthead { display: table-header-group; }\ntr { page-break-inside: avoid; break-inside: avoid; }\n\nth, td {\n  border: 1px solid #ccd4dc;\n  padding: 2pt 3.5pt;\n  text-align: left;\n  vertical-align: top;\n}\n\nth { background: #eef4f3; color: #0a5f53; font-weight: 700; }\n\nblockquote {\n  margin: 6pt 0;\n  padding: 5pt 8pt;\n  background: #f0f7f5;\n  border-left: 3px solid #0f7b6c;\n  border-radius: 0 2px 2px 0;\n  color: #2d3b45;\n  font-size: 9.5pt;\n}\n\nblockquote p { margin: 2pt 0; }\n\nul, ol {\n  margin: 2.5pt 0;\n  padding-left: 17pt;\n}\n\nli { margin: 1pt 0; }\nli > ul, li > ol { margin-top: 1pt; margin-bottom: 1pt; }\n\nhr {\n  border: 0;\n  border-top: 1px dashed #d8e0e6;\n  margin: 7pt 0;\n}\n\na { color: #14435c; text-decoration: none; }\n\n/* 封面上的目录 */\n.toc {\n  margin: 8pt 0 3pt;\n  padding: 6pt 8pt;\n  border: 1px solid #d9e0e7;\n  border-radius: 3px;\n  background: #fbfcfd;\n  break-inside: avoid;\n  page-break-inside: avoid;\n}\n\n.toc-title { font-weight: 700; color: #0a5f53; margin-bottom: 3pt; font-size: 9.4pt; }\n.toc ul { margin: 0; padding-left: 0; list-style: none; column-count: 2; column-gap: 18pt; }\n.toc li { margin: 1pt 0; font-size: 9pt; }\n.toc a { color: #24435c; }\n\n.meta-line {\n  font-size: 8.6pt;\n  color: #6b7885;\n  margin: 2pt 0 0;\n}\n\n@media print {\n  a { color: #24435c; }\n  .no-print { display: none; }\n}\n<\/style>\n<\/head>\n<body>\n<h1 id=\"_1\">时序特征工程 · 知识点与代码速查手册<\/h1><p class=\"meta-line\">项目：time-series-feature-engineering　|　生成时间：2026-10-09 15:04　|　打印建议：A4、缩放 100%（连续紧凑排版，已尽量减少空白）<\/p>\n<blockquote>\n<p>配套项目：<code>time-series-feature-engineering<\/code>（北京 PM2.5 实战）\n用途：把项目里用到的知识点和代码集中到一处，打印出来放在手边，写代码、写报告时对着查。\n阅读方式：左边是代码，代码下面的「作用」就是这段代码在干什么，不需要背，知道去哪儿找就行。\n重新生成 PDF：在项目根目录运行 <code>python guide\\build_handbook.py<\/code>，PDF 会输出到 <code>outputs\\知识点与代码速查.pdf<\/code>。\n打印版 PDF：<a href=\"outputs/知识点与代码速查.pdf\">outputs/知识点与代码速查.pdf<\/a>（已经在项目里生成好了，直接打开或打印即可）。<\/p>\n<\/blockquote><nav class=\"toc\"><div class=\"toc-title\">目录（连续排版，节省纸张）<\/div><div class=\"toc\">\n<ul>\n<li><a href=\"#_1\">时序特征工程 · 知识点与代码速查手册<\/a><\/li>\n<li><a href=\"#0\">0. 命令速查<\/a><\/li>\n<li><a href=\"#1-python\">1. Python 基础<\/a><\/li>\n<li><a href=\"#2-pandas\">2. pandas 基础<\/a><\/li>\n<li><a href=\"#3\">3. 时间戳处理<\/a><\/li>\n<li><a href=\"#4\">4. 时间特征<\/a><\/li>\n<li><a href=\"#5\">5. 滞后与滑动窗口<\/a><\/li>\n<li><a href=\"#6\">6. 建模与评估<\/a><\/li>\n<li><a href=\"#7\">7. 数据泄漏：三种错误示范<\/a><\/li>\n<li><a href=\"#8\">8. 画图<\/a><\/li>\n<li><a href=\"#9-sqlite\">9. SQLite 数据库<\/a><\/li>\n<li><a href=\"#10_1\">10. 报错急救<\/a><\/li>\n<li><a href=\"#a\">附录 A 特征清单（可直接抄进报告）<\/a><\/li>\n<li><a href=\"#b\">附录 B 本项目的实验结论（真实数字）<\/a><\/li>\n<li><a href=\"#c\">附录 C 文件地图<\/a><\/li>\n<\/ul>\n<\/div>\n<\/nav>\n<hr />\n<h2 id=\"_2\">怎么用这本手册<\/h2>\n<ol>\n<li><strong>先看「核心 10 句话」<\/strong>：把整个项目的骨架记住，比记住代码重要。<\/li>\n<li><strong>要写代码时，翻到对应章节<\/strong>：每一节都是「代码 + 作用」，复制过去改成自己的列名就能用。<\/li>\n<li><strong>要写报告时，看附录 A 和附录 B<\/strong>：特征怎么解释、实验结论是什么，直接抄进报告。<\/li>\n<li><strong>报错时看第 10 章<\/strong>：按错误信息查，先看原因，再看解决办法。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"10\">核心 10 句话<\/h2>\n<ol>\n<li>时序数据是带时间戳、按时间排好序的记录，<strong>顺序本身就是信息<\/strong>，不能随便打乱。<\/li>\n<li>时间戳统一用 <strong>UTC<\/strong>；北京时间 = UTC + 8。<\/li>\n<li>预测场景要先定义清楚：<strong>站在 t 时刻，用截至 t 已知的信息，预测 t+1<\/strong>。<\/li>\n<li>时间列可以拆成 <strong>年、月、日、星期、小时、是否周末<\/strong> 这些数字特征。<\/li>\n<li>小时、星期、月份用 <strong>sin/cos 周期编码<\/strong>，23 点和 0 点才会变成\"邻居\"。<\/li>\n<li><strong>lag（滞后）<\/strong> 是把过去的值挪到当前行：<code>shift(1)<\/code> 是上一小时，<code>shift(24)<\/code> 是昨天同一小时。<\/li>\n<li><strong>rolling（滑动窗口）<\/strong> 是算最近一段时间（如 24 小时）的均值、波动、最大最小值。<\/li>\n<li>任何用到了 t+1 及以后的信息，都是 <strong>数据泄漏<\/strong>，测试分数会假高。<\/li>\n<li>时序数据切分训练/测试必须 <strong>按时间前后切<\/strong>，不能随机切。<\/li>\n<li>先跑 <strong>基线<\/strong>（平均值、持续法），再谈复杂模型；指标看 <strong>MAE、RMSE、R²<\/strong>。<\/li>\n<\/ol>\n<hr />\n<h1 id=\"0\">0. 命令速查<\/h1>\n<h2 id=\"01\">0.1 环境：创建并激活虚拟环境<\/h2>\n<pre><code class=\"language-powershell\"># 在项目根目录（time-series-feature-engineering）执行\npython -m venv .venv                       # 创建虚拟环境\n.\\.venv\\Scripts\\Activate.ps1               # 激活（Windows PowerShell）\npip install -r requirements.txt            # 安装项目需要的库\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>虚拟环境 = 只属于这个项目的工具箱，不会污染电脑里其他 Python 项目。<\/li>\n<li>激活成功后，命令行前面会出现 <code>(.venv)<\/code>；关掉窗口就相当于退出。<\/li>\n<li>Mac/Linux 用 <code>python3 -m venv venv<\/code> 和 <code>source venv/bin/activate<\/code>。<\/li>\n<\/ul>\n<h2 id=\"02\">0.2 运行脚本<\/h2>\n<pre><code class=\"language-powershell\">python scripts\\05_time_features.py    # 运行单个脚本\n.\\run_all.ps1                         # 一键按顺序全部运行\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>脚本按编号顺序有依赖：04 生成干净数据 → 05 加时间特征 → 08 加滞后滑窗 → 09 做模型对比。<\/li>\n<li>跳过前面的脚本直接跑 09，会提示找不到文件（<code>FileNotFoundError<\/code>）。<\/li>\n<\/ul>\n<h2 id=\"03-git-github\">0.3 Git 与 GitHub<\/h2>\n<pre><code class=\"language-powershell\">git init                                  # 把这个文件夹变成 Git 仓库\ngit add .                                 # 把改动放进&quot;待提交&quot;区\ngit commit -m &quot;完成时间特征提取&quot;            # 存一个版本，附上说明\ngit log --oneline                         # 看历史版本\ngit remote add origin https://github.com/你的用户名/仓库名.git\ngit push -u origin main                   # 第一次推送\ngit status                                # 看当前有哪些改动（最常用）\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>Git 是\"存档 + 时间机器\"，每完成一小步就 <code>add<\/code> + <code>commit<\/code> 一次。<\/li>\n<li>GitHub 是放代码的网站，导师要的是仓库链接，不是压缩包。<\/li>\n<li><code>.gitignore<\/code> 用来排除不想上传的东西（本项目已排除 <code>.venv/<\/code>、<code>data/raw/<\/code> 等）。<\/li>\n<\/ul>\n<h2 id=\"04\">0.4 网页指引、本地服务、生成手册<\/h2>\n<pre><code class=\"language-powershell\">python guide\\build_guide.py                                    # 重新生成网页指引\npowershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1   # 启动本地服务（能读文件夹）\npython guide\\build_handbook.py                                 # 重新生成这本手册的 PDF\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>网页指引：把教程、代码、图表、实验表格放在一个页面里看。<\/li>\n<li>本地服务：浏览器出于安全不允许网页直接读本地文件夹，<code>start-server.ps1<\/code> 会开一个只服务本机的小服务器，网页里的\"项目文件\"才能读文件夹。<\/li>\n<li>手册 PDF：改完上面的 Markdown 后跑一次，PDF 会重新生成。<\/li>\n<\/ul>\n<hr />\n<h1 id=\"1-python\">1. Python 基础<\/h1>\n<p>对应脚本：<code>scripts/01_python_basics.py<\/code>；对应教程：<code>docs/02-Python零基础.md<\/code>。<\/p>\n<h2 id=\"11-list\">1.1 列表 list：一串有序的数据<\/h2>\n<pre><code class=\"language-python\">values = [80, 75, 90]        # 建列表\nvalues.append(60)            # 末尾加一个\nfirst = values[0]            # 取第 1 个（下标从 0 开始）\nlast = values[-1]            # 取最后一个\nprint(len(values))           # 长度：4\nprint(values[1:3])           # 切片：第 2、3 个\n<\/code><\/pre>\n<p><strong>作用<\/strong>：存放一组有顺序的数据，比如一串连续的 PM2.5 观测值。<\/p>\n<h2 id=\"12-dict\">1.2 字典 dict：按名字取值<\/h2>\n<pre><code class=\"language-python\">student = {&quot;name&quot;: &quot;小明&quot;, &quot;score&quot;: 90}\nprint(student[&quot;name&quot;])            # 取值：小明\nstudent[&quot;score&quot;] = 95             # 改值\nstudent[&quot;city&quot;] = &quot;南京&quot;           # 加新的一对\nfor key, value in student.items():  # 遍历\n    print(key, value)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：用\"名字 → 值\"的方式存数据，读代码时比记 <code>[0]<\/code>、<code>[1]<\/code> 清楚得多。<\/p>\n<h2 id=\"13-deque\">1.3 队列 deque：先进先出<\/h2>\n<pre><code class=\"language-python\">from collections import deque\n\nwindow = deque(maxlen=3)      # 只保留最近 3 个\nfor value in [10, 20, 30, 40]:\n    window.append(value)\nprint(window)                 # deque([20, 30, 40], maxlen=3)\nprint(window[0])              # 最早的那个：20\n<\/code><\/pre>\n<p><strong>作用<\/strong>：维护\"最近 N 个值\"的滑动窗口；<code>maxlen<\/code> 会自动丢掉最旧的，这是滑动窗口最朴素的手写版本。<\/p>\n<h2 id=\"14\">1.4 循环、条件、函数<\/h2>\n<pre><code class=\"language-python\">def level(pm25: float) -&gt; str:     # 函数：输入 → 输出\n    if pm25 &gt; 150:\n        return &quot;重度污染&quot;\n    elif pm25 &gt; 75:\n        return &quot;轻度污染&quot;\n    return &quot;正常&quot;\n\nfor value in [30, 90, 200]:\n    print(value, level(value))\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>函数把一段逻辑包起来，起个名字，后面重复用；<code>pm25: float<\/code> 和 <code>-&gt; str<\/code> 只是提示类型，不写也能跑。<\/li>\n<li><code>for<\/code> 用来遍历一串数据，<code>if/elif/else<\/code> 用来分支判断。<\/li>\n<\/ul>\n<h2 id=\"15\">1.5 读文件、写文件<\/h2>\n<pre><code class=\"language-python\"># 读：with 会在用完以后自动关文件，推荐写法\nwith open(&quot;notes/学习笔记模板.md&quot;, &quot;r&quot;, encoding=&quot;utf-8&quot;) as handle:\n    text = handle.read()\nprint(text[:200])                 # 只看前 200 个字符\n\n# 写：w 表示覆盖写，a 表示在末尾追加\nwith open(&quot;outputs/notes.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as handle:\n    handle.write(&quot;第一行\\n第二行\\n&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>读写文件都要指定 <code>encoding=\"utf-8\"<\/code>，否则中文在 Windows 上容易乱码。<\/li>\n<li>读 CSV 这种表格数据时，用 pandas 更方便（见第 2 章）。<\/li>\n<\/ul>\n<h2 id=\"16\">1.6 报错怎么读<\/h2>\n<pre><code class=\"language-python\"># 报错最后一行才是&quot;错误类型 + 原因&quot;，先看它，再看它上面一行指出的是哪个文件哪一行\n# 例：\n#   File &quot;scripts\\05_time_features.py&quot;, line 42\n#     df[&quot;hour_sin&quot;] = np.sin(2 * np.pi * df[&quot;hour&quot;] / 24)\n#   KeyError: 'hour'\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>KeyError: 'hour'<\/code> 意思是没有名为 <code>hour<\/code> 的列 —— 通常是你忘了先运行 04/05 脚本，或者列名拼错了。<\/li>\n<li>详细对照表见第 10 章。<\/li>\n<\/ul>\n<hr />\n<h1 id=\"2-pandas\">2. pandas 基础<\/h1>\n<p>对应脚本：<code>scripts/02_pandas_basics.py<\/code>；对应教程：<code>docs/03-pandas与SQLite.md<\/code>。<\/p>\n<h2 id=\"21-csv\">2.1 读 CSV<\/h2>\n<pre><code class=\"language-python\">import pandas as pd\n\ndf = pd.read_csv(&quot;data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv&quot;)\nprint(df.shape)        # (行数, 列数)\nprint(df.head())       # 看前 5 行\nprint(df.info())       # 每列的类型、缺失情况\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>pd.read_csv<\/code> 把 CSV 读成 DataFrame（可以理解成\"程序里的 Excel 表格\"）。<\/li>\n<li>第一步永远先 <code>shape<\/code> / <code>head<\/code> / <code>info<\/code>：先看清数据长什么样，再动手。<\/li>\n<\/ul>\n<h2 id=\"22\">2.2 选列、筛行、新增列<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm2.5&quot;]                    # 选一列（Series）\ndf[[&quot;year&quot;, &quot;month&quot;, &quot;hour&quot;]]  # 选多列（DataFrame）\ndf[df[&quot;pm2.5&quot;] &gt; 100]          # 筛出 PM2.5 大于 100 的行\ndf[(df[&quot;year&quot;] == 2014) &amp; (df[&quot;month&quot;] == 1)]   # 多个条件用 &amp; 连接，每个条件加括号\n\ndf[&quot;is_weekend&quot;] = (df[&quot;dayofweek&quot;] &gt;= 5).astype(int)   # 新增一列\ndf[&quot;temp_f&quot;] = df[&quot;TEMP&quot;] * 9 / 5 + 32                  # 用已有列算新列\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>特征工程的大部分工作就是\"新增列\"：把原始信息加工成模型能用的数字。<\/li>\n<li><code>.astype(int)<\/code> 把 True/False 变成 1/0，模型更喜欢数字。<\/li>\n<\/ul>\n<h2 id=\"23\">2.3 排序、去重、缺失值<\/h2>\n<pre><code class=\"language-python\">df = df.sort_values(&quot;datetime&quot;)          # 按时间排序\ndf = df.drop_duplicates(subset=&quot;datetime&quot;)   # 去掉重复时间戳\n\ndf.isna().sum()                          # 每列有多少缺失值\ndf[&quot;pm2.5&quot;].isna().sum()                 # 目标列缺失多少\ndf = df.dropna(subset=[&quot;pm25_next&quot;])     # 删掉&quot;答案缺失&quot;的行\ndf[&quot;pm2.5&quot;] = df[&quot;pm2.5&quot;].interpolate(method=&quot;linear&quot;, limit=6, limit_direction=&quot;both&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>时序数据的第一原则：<strong>先排序、再检查重复和缺失<\/strong>。<\/li>\n<li><code>interpolate(limit=6)<\/code> = 最多连续补 6 个小时；补不了的宁可留着，别硬猜（详细理由见 3.3）。<\/li>\n<\/ul>\n<h2 id=\"24-groupby\">2.4 groupby：分组统计<\/h2>\n<pre><code class=\"language-python\">df.groupby(&quot;hour&quot;)[&quot;pm2.5&quot;].mean()               # 每个小时的平均 PM2.5\ndf.groupby(&quot;dayofweek&quot;)[&quot;pm2.5&quot;].agg([&quot;mean&quot;, &quot;std&quot;, &quot;count&quot;])\ndf.groupby([&quot;is_weekend&quot;, &quot;hour&quot;])[&quot;pm2.5&quot;].mean()   # 多列组合分组\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>这是观察\"周期性\"最快的办法：如果不同小时的平均值差别明显，说明时间里有可用的信号。<\/li>\n<li>结果通常直接画成柱状图（见第 8 章）。<\/li>\n<\/ul>\n<h2 id=\"25\">2.5 时间列处理<\/h2>\n<pre><code class=\"language-python\">df[&quot;datetime&quot;] = pd.to_datetime(df[[&quot;year&quot;, &quot;month&quot;, &quot;day&quot;, &quot;hour&quot;]])  # 多列拼成一个时间\ndf[&quot;datetime&quot;] = df[&quot;datetime&quot;].dt.tz_localize(&quot;UTC&quot;)                  # 声明&quot;这本来就是 UTC&quot;\ndf = df.set_index(&quot;datetime&quot;).sort_index()                             # 时间当索引，再排序\ndf.index.hour          # 取小时；同类还有 .year .month .day .dayofweek .dayofyear\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>时间必须是真正的 datetime 类型，不能是字符串，否则没法做 <code>shift<\/code>、<code>rolling<\/code> 这些时间操作。<\/li>\n<li>设成索引以后，<code>df.index.year<\/code> 就是每行的年份，写起来短。<\/li>\n<\/ul>\n<h2 id=\"26-csv\">2.6 保存 CSV<\/h2>\n<pre><code class=\"language-python\">df.to_csv(&quot;data/processed/pm25_clean.csv&quot;, encoding=&quot;utf-8-sig&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>encoding=\"utf-8-sig\"<\/code> 让 Excel 打开中文表头不乱码，Windows 上推荐。<\/li>\n<li><code>index=True<\/code>（默认）会把时间索引也写进去，这样别的脚本才能读回时间。<\/li>\n<\/ul>\n<hr />\n<h1 id=\"3\">3. 时间戳处理<\/h1>\n<p>对应脚本：<code>scripts/04_load_clean.py<\/code>；对应教程：<code>docs/04-时序特征工程核心.md<\/code>。<\/p>\n<h2 id=\"31-utc\">3.1 拼出 UTC 时间列<\/h2>\n<pre><code class=\"language-python\">import pandas as pd\n\ndt = pd.to_datetime(df[[&quot;year&quot;, &quot;month&quot;, &quot;day&quot;, &quot;hour&quot;]])\ndf[&quot;datetime&quot;] = dt.dt.tz_localize(&quot;UTC&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>原始数据把时间拆成 4 列存，这一步把它们拼成一个带时区的时间列。<\/li>\n<li><code>tz_localize<\/code> 的意思是\"这些数字本来就是 UTC 时间\"；如果原始时间是北京时间，就要先 <code>tz_localize(\"Asia/Shanghai\")<\/code> 再 <code>tz_convert(\"UTC\")<\/code>。<\/li>\n<li>统一 UTC 是为了避免\"两份数据一个用北京时间、一个用 UTC，合并后差 8 小时\"。<\/li>\n<\/ul>\n<h2 id=\"32\">3.2 排序 + 补齐完整时间轴<\/h2>\n<pre><code class=\"language-python\">df = df.set_index(&quot;datetime&quot;).sort_index()\ndf = df.asfreq(&quot;h&quot;)          # 保证每个整点都有一行，缺的补成 NaN\n\nexpected = pd.date_range(df.index.min(), df.index.max(), freq=&quot;h&quot;)\nprint(len(expected), len(df), len(expected) - len(df))   # 应该有 / 实际有 / 缺多少\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>asfreq(\"h\")<\/code> 让\"每隔一小时一行\"变成硬约束。<\/li>\n<li>为什么必须补：如果不补，<code>shift(24)<\/code> 表示的是\"往前数 24 行\"，而不是\"24 小时前\"，遇到缺口就会错位，<code>rolling(24)<\/code> 也一样。<\/li>\n<\/ul>\n<h2 id=\"33\">3.3 缺失值：短缺口插值，长缺口保留<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_was_missing&quot;] = df[&quot;pm2.5&quot;].i
