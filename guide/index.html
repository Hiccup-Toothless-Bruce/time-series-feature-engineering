CSV, index=False, encoding=\"utf-8-sig\")\n\n    print(f\"\\n对比表：{RESULT_CSV}\")\n    print(f\"消融表：{ABLATION_CSV}\")\n    print(f\"预测值：{PRED_CSV}\")\n    print(f\"系数表：{COEF_CSV}\")\n\n    print(\"\\n结论怎么写（给你一个模板）：\")\n    print(\"从 MAE 看，完整正确版比只用时间特征好了约 X；加入滞后后提升最大，\")\n    print(\"说明 PM2.5 的“临近时刻值”信息量很强。中心滑动窗口分数虽然更好，\")\n    print(\"但它使用了预测时刻之后的数据，属于数据泄漏，不能作为真实效果。\")\n    print(\"\\n下一步：python scripts/10_plots.py\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"id": "plots", "title": "10 画图观察特征", "group": "可视化", "file": "scripts/10_plots.py", "cmd": "python scripts\\10_plots.py", "summary": "原始序列、滑动平均、差分、周期性、预测对比、周期编码圆、相关性热力图。", "code": "\"\"\"第 10 课：画图观察特征。\n\n图比数字更容易让人看懂：\n- 原始序列：整体趋势和季节变化\n- 7 天滑动平均：把短期噪声抹平，看清趋势\n- 差分序列：今天比昨天变化了多少，异常点更刺眼\n- 小时/星期/月份平均：周期长什么样\n- 周期编码圆：23 点和 0 点为什么变近了\n- 预测对比：加了特征以后，预测线有没有更贴近真实线\n\n运行：python scripts/10_plots.py\n图片保存在 outputs/figures/\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import (\n    FIGURES_DIR,\n    TABLES_DIR,\n    load_clean_data,\n    load_model_data,\n    load_time_features,\n    print_step,\n    print_title,\n    setup_matplotlib_chinese,\n)\n\nplt = setup_matplotlib_chinese()\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef plot_original_series() -> None:\n    print_step(\"1. 原始序列：整体看 5 年，再放大看 2 周\")\n\n    df = load_clean_data()\n    daily = df[\"pm2.5\"].resample(\"D\").mean()\n    zoom = df.loc[\"2014-06-01\":\"2014-06-14\", \"pm2.5\"]\n\n    fig, axes = plt.subplots(2, 1, figsize=(12, 8))\n    axes[0].plot(daily.index, daily.values, color=\"#2c7fb8\", linewidth=1)\n    axes[0].set_title(\"PM2.5 日平均值（2010-2014）\")\n    axes[0].set_ylabel(\"PM2.5\")\n    axes[0].grid(alpha=0.3)\n\n    axes[1].plot(zoom.index, zoom.values, color=\"#d95f02\", linewidth=1)\n    axes[1].set_title(\"放大看：2014 年 6 月前两周的每小时 PM2.5\")\n    axes[1].set_ylabel(\"PM2.5\")\n    axes[1].set_xlabel(\"UTC 时间\")\n    axes[1].grid(alpha=0.3)\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"01_原始序列与趋势.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n\n    print(\"怎么读图：\")\n    print(\"- 上图：能看出季节变化（冬天通常更高）和长期趋势。\")\n    print(\"- 下图：能看出一天内的高低起伏，这就是“日周期”。\")\n\n\ndef plot_rolling_and_diff() -> None:\n    print_step(\"2. 原始序列 vs 7 天滑动平均 vs 差分\")\n\n    df = load_clean_data()\n    daily = df[\"pm2.5\"].resample(\"D\").mean()\n    rolling7 = daily.rolling(7).mean()\n    diff1 = daily.diff(1)\n\n    fig, axes = plt.subplots(2, 1, figsize=(12, 8))\n    axes[0].plot(daily.index, daily.values, color=\"#aaaaaa\", linewidth=1, label=\"每日原始值\")\n    axes[0].plot(rolling7.index, rolling7.values, color=\"#e6550d\", linewidth=2.5, label=\"7 天滑动平均\")\n    axes[0].set_title(\"原始序列 vs 7 天滑动平均\")\n    axes[0].set_ylabel(\"PM2.5\")\n    axes[0].legend()\n    axes[0].grid(alpha=0.3)\n\n    axes[1].plot(diff1.index, diff1.values, color=\"#31a354\", linewidth=1)\n    axes[1].axhline(0, color=\"black\", linewidth=0.8)\n    axes[1].set_title(\"差分序列：今天 - 昨天（变化量）\")\n    axes[1].set_ylabel(\"变化量\")\n    axes[1].set_xlabel(\"日期（UTC）\")\n    axes[1].grid(alpha=0.3)\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"02_滑动平均与差分.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n    print(\"怎么读图：滑动平均像“降噪滤镜”；差分把“变化大不大”单独拎出来，突刺就是异常点。\")\n\n\ndef plot_periodicity() -> None:\n    print_step(\"3. 周期长什么样：按小时 / 星期 / 月份求平均\")\n\n    df = load_time_features()\n    by_hour = df.groupby(\"hour\")[\"pm2.5\"].mean()\n    by_weekday = df.groupby(\"dayofweek\")[\"pm2.5\"].mean().reindex(range(7))\n    by_month = df.groupby(\"month\")[\"pm2.5\"].mean().reindex(range(1, 13))\n\n    fig, axes = plt.subplots(1, 3, figsize=(16, 4.5))\n\n    axes[0].bar(by_hour.index, by_hour.values, color=\"#2c7fb8\")\n    axes[0].set_title(\"一天内的周期（按小时平均）\")\n    axes[0].set_xlabel(\"小时（UTC）\")\n    axes[0].set_ylabel(\"平均 PM2.5\")\n    axes[0].set_xticks(range(0, 24, 3))\n    axes[0].grid(alpha=0.3, axis=\"y\")\n\n    axes[1].bar(range(7), by_weekday.values, color=\"#31a354\")\n    axes[1].set_title(\"一周内的周期（按星期平均）\")\n    axes[1].set_xticks(range(7), WEEKDAY_NAMES)\n    axes[1].grid(alpha=0.3, axis=\"y\")\n\n    axes[2].bar(by_month.index, by_month.values, color=\"#e6550d\")\n    axes[2].set_title(\"一年内的周期（按月份平均）\")\n    axes[2].set_xlabel(\"月份\")\n    axes[2].set_xticks(range(1, 13))\n    axes[2].grid(alpha=0.3, axis=\"y\")\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"03_周期性观察.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n    print(\"怎么读图：柱子不是一条直线，说明小时/星期/月份确实包含预测信息。\")\n\n\ndef plot_prediction_comparison() -> None:\n    print_step(\"4. 预测对比：只看时间 vs 加上滞后滑动特征 vs 真实值\")\n\n    path = TABLES_DIR / \"09_test_predictions.csv\"\n    if not path.exists():\n        print(f\"找不到 {path}，请先运行 09_model_comparison.py。\")\n        return\n\n    pred = pd.read_csv(path)\n    pred[\"datetime\"] = pd.to_datetime(pred[\"datetime\"], utc=True)\n    pred = pred.set_index(\"datetime\")\n\n    # 测试期有大约 8500 小时，全部画会看不清，只取前 14 天。\n    start = pred.index.min()\n    end = start + pd.Timedelta(days=14)\n    part = pred.loc[start:end]\n\n    fig, ax = plt.subplots(figsize=(13, 5.5))\n    ax.plot(part.index, part[\"y_true\"], color=\"black\", linewidth=2, label=\"真实值\")\n    ax.plot(part.index, part[\"pred_time_cyc\"], color=\"#e6550d\", linewidth=1.5, alpha=0.9, label=\"只用周期时间特征\")\n    ax.plot(part.index, part[\"pred_full\"], color=\"#2c7fb8\", linewidth=1.5, alpha=0.9, label=\"完整正确特征\")\n    ax.set_title(\"测试期前 14 天：预测值 vs 真实值\")\n    ax.set_ylabel(\"PM2.5\")\n    ax.set_xlabel(\"UTC 时间\")\n    ax.legend()\n    ax.grid(alpha=0.3)\n    fig.tight_layout()\n\n    save_path = FIGURES_DIR / \"04_预测对比.png\"\n    fig.savefig(save_path)\n    plt.close(fig)\n    print(f\"已保存：{save_path}\")\n    print(\"怎么读图：蓝色线如果比橙色线更贴近黑线，说明滞后/滑动特征真的有用。\")\n\n\ndef plot_cyclic_circle() -> None:\n    print_step(\"5. 周期编码圆：23 点和 0 点在圆上其实是邻居\")\n\n    hours = np.arange(24)\n    sin_values = np.sin(2 * np.pi * hours / 24)\n    cos_values = np.cos(2 * np.pi * hours / 24)\n\n    fig, ax = plt.subplots(figsize=(6.5, 6.5))\n    ax.scatter(sin_values, cos_values, c=hours, cmap=\"viridis\", s=90, zorder=3)\n\n    for hour, x, y in zip(hours, sin_values, cos_values):\n        if hour % 2 == 0:\n            ax.annotate(str(hour), (x, y), textcoords=\"offset points\", xytext=(6, 6), fontsize=9)\n\n    circle = plt.Circle((0, 0), 1, fill=False, color=\"gray\", linewidth=1)\n    ax.add_patch(circle)\n    ax.set_aspect(\"equal\")\n    ax.set_xlim(-1.25, 1.25)\n    ax.set_ylim(-1.25, 1.25)\n    ax.set_xlabel(\"hour_sin\")\n    ax.set_ylabel(\"hour_cos\")\n    ax.set_title(\"小时周期编码：23 点和 0 点是邻居\")\n    ax.grid(alpha=0.3)\n\n    path = FIGURES_DIR / \"05_周期编码圆.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n\n\ndef plot_correlation_heatmap() -> None:\n    print_step(\"6. 相关性热力图：哪些特征和下一小时 PM2.5 关系更近\")\n\n    df = load_model_data()\n    selected = [\n        \"pm25_next\",\n        \"pm25_now\",\n        \"pm25_lag24\",\n        \"pm25_roll24_mean\",\n        \"pm25_roll168_mean\",\n        \"hour_sin\",\n        \"hour_cos\",\n        \"TEMP\",\n        \"PRES\",\n    ]\n    corr = df[selected].dropna().corr()\n\n    fig, ax = plt.subplots(figsize=(9, 7.5))\n    image = ax.imshow(corr.values, cmap=\"RdBu_r\", vmin=-1, vmax=1)\n    ax.set_xticks(range(len(selected)), selected, rotation=45, ha=\"right\")\n    ax.set_yticks(range(len(selected)), selected)\n\n    for i in range(len(selected)):\n        for j in range(len(selected)):\n            ax.text(j, i, f\"{corr.values[i, j]:.2f}\", ha=\"center\", va=\"center\", fontsize=8)\n\n    fig.colorbar(image, ax=ax, shrink=0.8)\n    ax.set_title(\"特征相关性热力图（红=正相关，蓝=负相关）\")\n    fig.tight_layout()\n\n    path = FIGURES_DIR / \"06_相关性热力图.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n    print(\"怎么读图：相关性高不代表因果，也不能只看它选特征，但可以作为第一眼参考。\")\n\n\ndef main() -> None:\n    print_title(\"第 10 课：画图观察特征\")\n\n    plot_original_series()\n    plot_rolling_and_diff()\n    plot_periodicity()\n    plot_prediction_comparison()\n    plot_cyclic_circle()\n    plot_correlation_heatmap()\n\n    print(f\"\\n全部图片都在：{FIGURES_DIR}\")\n    print(\"建议把 6 张图贴进你的 Markdown 笔记，每张图下面写 2-3 句话：\")\n    print(\"看到了什么现象 -> 这个现象说明哪个特征可能有用 -> 实验里它到底有没有用。\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"id": "common", "title": "公共工具 common.py", "group": "公共", "file": "scripts/common.py", "cmd": "（不用单独运行，被其他脚本 import）", "summary": "路径、读数据、MAE/RMSE/R²、中文画图设置。", "code": "\"\"\"公共工具函数。\n\n为什么要有一个 common.py？\n- 每个脚本都要找数据文件、算指标、设置中文字体，如果每份代码都复制一遍，\n  改起来很容易漏。放到一个公共文件里，新手也能一眼看懂。\n\n运行方式：这个文件不用单独运行，别的脚本会自动 import 它。\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\n# ---------------------------------------------------------------------------\n# 1. 项目里所有重要文件夹和文件的位置\n# ---------------------------------------------------------------------------\n# Path(__file__) 是“当前这个 py 文件”的路径；parents[1] 就是项目根目录。\n# 这样不管你在哪个文件夹里敲命令，路径都不会错。\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\n\nRAW_CSV = (\n    PROJECT_ROOT\n    / \"data\"\n    / \"raw\"\n    / \"beijing_pm25\"\n    / \"PRSA_data_2010.1.1-2014.12.31.csv\"\n)\nPROCESSED_DIR = PROJECT_ROOT / \"data\" / \"processed\"\nFIGURES_DIR = PROJECT_ROOT / \"outputs\" / \"figures\"\nTABLES_DIR = PROJECT_ROOT / \"outputs\" / \"tables\"\n\n# exist_ok=True 表示“文件夹已存在也不要报错”；parents=True 表示“缺上级文件夹就一起建”。\nfor folder in (PROCESSED_DIR, FIGURES_DIR, TABLES_DIR):\n    folder.mkdir(parents=True, exist_ok=True)\n\n\n# ---------------------------------------------------------------------------\n# 2. 打印小工具，让终端输出更易读\n# ---------------------------------------------------------------------------\ndef print_title(title: str) -> None:\n    \"\"\"打印一个醒目的标题。\"\"\"\n    print()\n    print(\"=\" * 68)\n    print(title)\n    print(\"=\" * 68)\n\n\ndef print_step(step: str) -> None:\n    \"\"\"打印一小步的说明。\"\"\"\n    print(f\"\\n--- {step} ---\")\n\n\n# ---------------------------------------------------------------------------\n# 3. 读数据\n# ---------------------------------------------------------------------------\ndef load_raw_data() -> pd.DataFrame:\n    \"\"\"读取最原始的 CSV，不做任何清洗。\"\"\"\n    if not RAW_CSV.exists():\n        raise FileNotFoundError(\n            f\"找不到原始数据：{RAW_CSV}\\n\"\n            \"请先运行：python scripts/download_data.py\"\n        )\n    return pd.read_csv(RAW_CSV)\n\n\ndef _read_csv_with_utc_index(path: Path) -> pd.DataFrame:\n    \"\"\"读带 datetime 列的 CSV，并把 datetime 设为 UTC 时间索引。\"\"\"\n    if not path.exists():\n        raise FileNotFoundError(f\"找不到文件：{path}\\n请先运行生成它的上一个脚本。\")\n    df = pd.read_csv(path)\n    df[\"datetime\"] = pd.to_datetime(df[\"datetime\"], utc=True)\n    return df.set_index(\"datetime\").sort_index()\n\n\ndef load_clean_data() -> pd.DataFrame:\n    \"\"\"读取 04_load_clean.py 生成的干净数据。\"\"\"\n    return _read_csv_with_utc_index(PROCESSED_DIR / \"pm25_clean.csv\")\n\n\ndef load_time_features() -> pd.DataFrame:\n    \"\"\"读取 05_time_features.py 生成的时间特征数据。\"\"\"\n    return _read_csv_with_utc_index(PROCESSED_DIR / \"pm25_time_features.csv\")\n\n\ndef load_model_data() -> pd.DataFrame:\n    \"\"\"读取 08_lag_rolling_features.py 生成的完整建模数据。\"\"\"\n    return _read_csv_with_utc_index(PROCESSED_DIR / \"pm25_model_data.csv\")\n\n\n# ---------------------------------------------------------------------------\n# 4. 回归模型评估指标\n# ---------------------------------------------------------------------------\ndef regression_metrics(y_true, y_pred) -> dict[str, float]:\n    \"\"\"返回 MAE、RMSE、R2 三个指标。\n\n    指标越小越好：MAE、RMSE；越大越好：R2（1 最好，0 约等于“只会猜平均”）。\n    \"\"\"\n    y_true = np.asarray(y_true, dtype=float)\n    y_pred = np.asarray(y_pred, dtype=float)\n\n    mae = float(np.mean(np.abs(y_true - y_pred)))\n    rmse = float(np.sqrt(np.mean((y_true - y_pred) ** 2)))\n\n    ss_res = float(np.sum((y_true - y_pred) ** 2))\n    ss_tot = float(np.sum((y_true - np.mean(y_true)) ** 2))\n    r2 = float(1.0 - ss_res / ss_tot) if ss_tot > 0 else float(\"nan\")\n\n    return {\"MAE\": mae, \"RMSE\": rmse, \"R2\": r2}\n\n\n# ---------------------------------------------------------------------------\n# 5. 画图设置\n# ---------------------------------------------------------------------------\ndef setup_matplotlib_chinese():\n    \"\"\"设置 matplotlib：不弹窗、能显示中文、负号正常。\n\n    返回 plt，调用方写法：plt = setup_matplotlib_chinese()\n    注意：必须在 import matplotlib.pyplot 之前调用 use(\"Agg\")。\n    \"\"\"\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n\n    import matplotlib.pyplot as plt\n\n    # Windows 自带“微软雅黑”，画中文图不会变成方框。\n    plt.rcParams[\"font.sans-serif\"] = [\n        \"Microsoft YaHei\",\n        \"SimHei\",\n        \"DejaVu Sans\",\n    ]\n    plt.rcParams[\"axes.unicode_minus\"] = False\n    plt.rcParams[\"figure.dpi\"] = 120\n    plt.rcParams[\"savefig.bbox\"] = \"tight\"\n    return plt\n"}], "tables": {"comparison": {"id": "comparison", "title": "模型对比：哪些特征有用", "file": "outputs/tables/09_model_comparison.csv", "description": "同一段时间切分，只改特征。注意区分'可信'和'不可信'的结论。", "max_rows": 50, "html": "<div class=\"table-wrap\"><table class=\"data-table\">\n<thead><tr>\n<th>实验<\/th>\n<th>特征<\/th>\n<th>切分方式<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R2<\/th>\n<th>是否可信<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td>平均值基线<\/td>\n<td>无<\/td>\n<td>按时间 8:2<\/td>\n<td class=\"num\">64.74<\/td>\n<td class=\"num\">82.47<\/td>\n<td class=\"num\">-0.0286<\/td>\n<td class=\"trust\">可信<\/td>\n<\/tr>\n<tr>\n<td>持续法基线<\/td>\n<td>当前 pm2.5<\/td>\n<td>按时间 8:2<\/td>\n<td class=\"num\">10.981<\/td>\n<td class=\"num\">19.968<\/td>\n<td class=\"num\">0.9397<\/td>\n<td class=\"trust\">可信<\/td>\n<\/tr>\n<tr>\n<td>只用原始时间特征<\/td>\n<td>month/day/hour/weekday...<\/td>\n<td>按时间 8:2<\/td>\n<td class=\"num\">62.576<\/td>\n<td class=\"num\">81.323<\/td>\n<td class=\"num\">-0.0002<\/td>\n<td class=\"trust\">可信<\/td>\n<\/tr>\n<tr>\n<td>只用周期编码时间<\/td>\n<td>hour_sin m2.5 缺失：2067\n短缺口插值后剩余缺失：1218\n\npm2.5 统计量（缺失值不参与统计）：\ncount    42606.000000\nmean        98.578252\nstd         91.851572\nmin          0.000000\n25%         29.000000\n50%         72.136364\n75%        137.000000\nmax        994.000000\n\n处理说明：\n1. 把 year/month/day/hour 拼成 UTC datetime；\n2. asfreq(&#x27;h&#x27;) 补齐时间轴，保证每个整点一行；\n3. 对连续缺失不超过 6 小时的缺口做线性插值；\n4. 长缺口保留为 NaN，建模时按使用的特征删除无法计算的行；\n5. 保留 pm25_was_missing 标记，记录哪些值原本缺失。<\/pre>", "concepts": [{"icon": "globe", "title": "UTC", "text": "世界统一时间，避免时区混乱。北京时间 = UTC + 8。", "route": "#doc-feature-core"}, {"icon": "refresh-cw", "title": "周期编码", "text": "用 sin/cos 把小时、星期放到圆上，让 23 点和 0 点变成邻居。", "route": "#doc-feature-core"}, {"icon": "history", "title": "滞后 lag", "text": "shift(1) 是上一小时，shift(24) 是昨天同一小时。", "route": "#doc-feature-core"}, {"icon": "move-horizontal", "title": "滑动窗口 rolling", "text": "最近 24/168 小时的均值、波动、最大值、最小值。", "route": "#doc-feature-core"}, {"icon": "shield-alert", "title": "数据泄漏", "text": "用了 t+1 或更晚的信息，测试分数会假高。", "route": "#doc-feature-core"}, {"icon": "target", "title": "基线", "text": "平均值和持续法。复杂模型必须先打赢它们。", "route": "#doc-modeling"}], "roadmap": [{"day": "第 1 天", "title": "环境、Git、Markdown", "desc": "跑通一键脚本，建 GitHub 仓库，学会写笔记。", "route": "#doc-env", "key": "day1"}, {"day": "第 2 天", "title": "Python 基础", "desc": "跑 01–03，改几个数字再运行，理解 list/dict/deque。", "route": "#script-python-basics", "key": "day2"}, {"day": "第 3 天", "title": "pandas 与 SQLite", "desc": "会读 CSV、筛选、分组、时间处理，会写四条 SQL。", "route": "#doc-pandas-sqlite", "key": "day3"}, {"day": "第 4 天", "title": "清洗与时间特征", "desc": "跑 04、05，理解 UTC、缺失值、is_weekend、sin/cos。", "route": "#script-time-features", "key": "day4"}, {"day": "第 5 天", "title": "基线模型与周期编码", "desc": "跑 06、07，理解 MAE/RMSE/R²，把结果抄进实验记录。", "route": "#doc-modeling", "key": "day5"}, {"day": "第 6 天", "title": "滞后、滑动窗口、防泄漏", "desc": "跑 08、09，重点看中心滑窗和'把答案当特征'的错误示范。", "route": "#script-compare", "key": "day6"}, {"day": "第 7 天", "title": "画图、Kaggle、总结", "desc": "跑 10，读 3 篇 Kaggle notebook，写一页实验总结。", "route": "#doc-plots-kaggle", "key": "day7"}], "requirements": [{"requirement": "1.1 Git 和 GitHub", "task": "上传代码到仓库", "route": "#doc-env"}, {"requirement": "1.2 Markdown", "task": "写特征笔记和实验记录", "route": "#doc-note-feature"}, {"requirement": "1.3 Python", "task": "列表、字典、文件、pandas、SQLite", "route": "#script-python-basics"}, {"requirement": "2.1 数据集", "task": "带时间戳的 CSV", "route": "#script-download"}, {"requirement": "2.2 基础处理", "task": "解析时间、排序、检查缺失", "route": "#script-load-clean"}, {"requirement": "2.3 时间特征", "task": "年、月、日、星期、小时、是否周末", "route": "#script-time-features"}, {"requirement": "2.4 基线模型", "task": "线性回归基线", "route": "#script-baseline"}, {"requirement": "2.5 周期编码", "task": "小时/星期 sin/cos 对照", "route": "#script-cyclic"}, {"requirement": "3.1 滞后和滑窗", "task": "shift 和 rolling，防止未来数据", "route": "#script-lag-rolling"}, {"requirement": "3.2 对比效果", "task": "记录哪些特征有用", "route": "#table-comparison"}, {"requirement": "3.3 画图观察", "task": "原始、滑均、差分序列", "route": "#figures"}, {"requirement": "3.4 Kaggle", "task": "看别人的特征工程思路", "route": "#doc-plots-kaggle"}], "search": [{"title": "项目总览", "type": "开始", "route": "#doc-overview", "text": "大一新生也能跑通的时序特征工程（北京 PM2.5 实战） 这不是论文导读，而是一个\"照着敲就出结果\"的完整项目。 导师的要求可以浓缩成一句话： 把时序数据的\"时间列\"拆成模型能用的特征，并用实验证明这些特征到底有没有用。 0. 先明白：你不需要一下子全懂 你现在的状态很正常：看到\"特征工程、周期性、滞后、滑动窗口\"这些词，每个字都认识，连起来不知道在说什么。 这份教程的设计是： 先让代码跑出结果 （哪怕是照着敲），建立信心； 再解释\"为什么这样写\"； 最后让你改一两个地方，做出自己的小实验； 把结果写进笔记，交给导师。 记住一句话： 时序数据 = 带时间戳、按时间排好序的记录。 网页版学习指引（推荐先看这个） 不用在文件夹里到处找文件。项目自带一个网页，把 教程、代码、图表、实验表格 放在同一页： 左边是目录，点一下就能看，不用记路径； 每个脚本页直接显示完整代码和“怎么运行”，一键复制命令； 顶部有搜索框（按 / 快速定位），比如搜“滑动窗口”“MAE”； “学习路线”页可以勾选 7 天进度，“导师要求对照”页把每条要求对应到具体内容。 “项目文件”页直接读取项目文件夹：左边选文件、右边看代码或图片，改完文件点“重新读取”就能看到最新的。 打开方式（二选一）： # 方式一：直接双击 guide\\index.html（最简单，离线可看） # 方式二（推荐）：启一个本地网页服务，图片和表格加载最稳 powershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1 # 浏览器会自动打开 http://127.0.0.1:8765/guide/index.html # 如果提示端口被占用：powershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1 -Port 8899 两种打开方式的能力不一样： 打开方式 能看教程/图片/表格 能读取项目文件夹 双击 guide\\index.html 能 不能（浏览器安全限制） 运行 start-server.ps1 能 能 启动服务后会 自动用你电脑上的默认浏览器（Chrome / Edge 等）打开 页面；也可以自己把地址粘到浏览器里： http://127.0.0.1:8765/guide/index.html 嫌上面命令太长，也可以直接运行： python guide\\server.py 在“项目文件”页里还有一个“选择其他文件夹”按钮，可以在 Chrome / Edge 里临时读取你电脑上任意一个文件夹（不写入、不上传）。 服务只允许本机访问（127.0.0.1），并且只能读到本项目文件夹里的内容。 网页是本地生成的，不联网也能看。改动教程文档或脚本后，重新生成一次即可： python guide\\build_guide.py 知识点与代码速查手册（可打印） 项目里的知识点和代码全部集中在一份手册里：每段代码下面都有“作用”说明，按章节排好，打印出来可以直接放在手边查。 Markdown 版： docs/08-知识点与代码速查.md PDF 版（推荐打印）： outputs/知识点与代码速查.pdf 网页版：打开学习指引，点左边「知识点速查手册」 重新生成（不需要额外装软件，用本机的 Chrome / Edge 打印）： python guide\\build_handbook.py # 同时生成 HTML 和 PDF python guide\\build_handbook.py --no-pdf # 只生成 HTML 打印建议：A4 纸、缩放 100%。PDF 一共二十多页，每章从新的一页开始，可以用双面打印。 默认是紧凑排版，约 14 页；章节之间不强制换页，打印更省纸。如果确实需要每章另起一页，可以加参数： python guide\\build_handbook.py --page-break-chapters 分享给同学：一键打包离线网页 如果想把教程网页发给同学，不需要对方安装 Python，也不需要启动本地服务。运行下面的命令，会生成一个可以直接分享的 zip： # 先激活项目虚拟环境，再执行 python guide\\build_share_zip.py 生成结果在 dist/时序特征工程学习指引-离线版.zip （约 3 MB）。对方解压后双击里面的 index.html ，就能离线看教程、代码、图表、表格和速查 PDF。 --no-rebuild ：不重新生成教程和 PDF，直接打包当前版本； --no-zip ：只生成文件夹，不生成压缩包。 离线包不包含 data/ 里的原始数据和处理后数据，所以体积比较小，适合分享阅读。 1. 导师要求 → 本项目对应位置（最重要的一张表） 导师要求 你要做的事 在本项目里看哪里 你会得到什么 1.1 Git 和 GitHub 把代码传到 GitHub docs/01-环境与工具.md 的 Git 部分 一个能打开的代码仓库 1.2 Markdown 用 Markdown 写笔记 notes/学习笔记模板.md 特征笔记 + 实验记录 1.3 Python 数组、列表、字典、文件、pandas、SQLite scripts/01 、 02 、 03 能看懂基础代码 2.1 找数据集 带时间戳的 CSV scripts/download_data.py 北京 PM2.5 数据（UTC 每小时） 2.2 基础处理 解析时间、排序、检查缺失 scripts/04_load_clean.py pm25_clean.csv 2.3 拆时间特征 年、月、日、星期、小时、是否周末 scripts/05_time_features.py 时间特征 + 特征字典 2.4 基线模型 用线性回归跑通 scripts/06_baseline_model.py 第一组 MAE/RMSE/R² 2.5 周期编码 小时/星期做 sin/cos scripts/07_cyclic_encoding.py 前后对比结果 3.1 滞后和滑动 shift() 和 rolling() scripts/08_lag_rolling_features.py 滞后/滑窗特征 3.1 防未来数据 理解数据泄漏 scripts/09_model_comparison.py 正确 vs 错误对照 3.2 对比效果 记录哪些特征有用 scripts/09 + notes/实验记录模板.md 消融实验表 3.3 画图观察 原始/滑均/差分序列 scripts/10_plots.py 6 张中文图 3.4 Kaggle 练手 看别人的特征工程思路 docs/06-画图与Kaggle.md 复现计划 2. 第 0 步：把项目跑起来（Windows，约 5 分钟） 2.1 打开 PowerShell，进入项目文件夹 在文件夹窗口的地址栏输入 powershell 并回车，或者在 VS Code 里按 Ctrl + 反引号 打开终端。 确认你在这个文件夹： Get-Location 应该看到以 time-series-feature-engineering 结尾的路径。 2.2 创建虚拟环境 虚拟环境就是\"只属于这个项目的工具箱\"，不会污染电脑里的其他 Python 项目。 python -m venv .venv 2.3 激活虚拟环境 .\\.venv\\Scripts\\Activate.ps1 成功后，命令行前面会出现 (.venv) 。 如果报\"禁止运行脚本\"，先执行下面这行，再重新激活： Set-ExecutionPolicy -Scope Process Bypass 2.4 安装依赖 pip install -r requirements.txt 2.5 一键跑完全部课程 .\\run_all.ps1 看到\"全部脚本运行完成\"就成功了。图片在 outputs/figures/ ，表格在 outputs/tables/ ， 网页指引也会自动重新生成到 guide/index.html 。 不想一键跑，也可以按顺序一条条运行： powershell python scripts\\download_data.py python scripts\\01_python_basics.py python scripts\\02_pandas_basics.py python scripts\\03_sqlite_basics.py python scripts\\04_load_clean.py python scripts\\05_time_features.py python scripts\\06_baseline_model.py python scripts\\07_cyclic_encoding.py python scripts\\08_lag_rolling_features.py python scripts\\09_model_comparison.py python scripts\\10_plots.py 3. 目录说明 time-series-feature-engineering/ ├─ README.md ← 你正在看的文件 ├─ requirements.txt ← 需要安装的 Python 库 ├─ run_all.ps1 ← 一键运行全部脚本 ├─ docs/ ← 分步教学文档 │ ├─ 00-先读我-导师要求翻译.md │ ├─ 01-环境与工具.md │ ├─ 02-Py"}, {"title": "导师要求翻译", "type": "开始", "route": "#doc-req", "text": "00 先读我：把导师的要求翻译成人话 1. 一句话看懂你的任务 导师给了你一份\"时序数据集\"，让你做 特征工程 。 说白了就是： 原始数据里只有一列时间，模型看不懂\"2010-01-01 08:00\"这种东西。 你要把它拆成\"年=2010、月=1、日=1、小时=8、星期几、是不是周末\"等数字， 再告诉模型\"过去几小时发生了什么\"（滞后、滑动窗口）， 最后用实验证明：加了这些特征以后，预测有没有变好。 2. 导师每一条要求，翻译成\"我要做什么\" 1.1 Git 和 GitHub（上传代码） 人话 ：把代码放到网上，让导师能看到你做了什么、改了什么。 你要做 ： 在 GitHub 建一个仓库（repository）； 在项目文件夹执行 git init ； 每次写完一部分就 git add . + git commit -m \"说明\" ； 最后 git push 到 GitHub。 怎么算完成 ：把仓库链接发给导师，链接能打开，里面有代码和 README。 细节看 01-环境与工具.md 的 Git 部分。 1.2 Markdown（写笔记） 人话 ：用简单的符号写带格式的笔记，GitHub 会自动把它显示得很漂亮。 你要做 ：把每个特征的\"怎么构造、什么意思、实验效果\"记下来。 怎么算完成 ： notes/学习笔记模板.md 里每个特征都有记录，至少写 5 个。 例子： ## hour_sin / hour_cos（小时周期编码） - 怎么构造：`sin(2*pi*hour/24)` 和 `cos(2*pi*hour/24)` - 什么意思：把 0–23 点放到一个圆上，23 点和 0 点变成邻居 - 实验效果：第 7 课对比，R² 从 ____ 变成 ____ - 结论：有用 / 作用不明显，因为 ____ 1.3 Python（实现功能） 人话 ：用 Python 完成上面这些事情。导师列的是基础中的基础。 你要会 ： 东西 一句话解释 本教程哪里学 list 列表 一排有顺序的数据 scripts/01 dict 字典 用名字找值 scripts/01 deque 队列 只保留最近 N 个数，滑窗的基础 scripts/01 函数 def 把一段代码打包反复用 scripts/01 文件读写 把结果存下来 scripts/01 pandas 用代码操作 Excel 表格 scripts/02 SQL 增删改查 数据库的基本操作 scripts/03 主键 每行数据的唯一身份证 scripts/03 索引 像书的目录，查得更快 scripts/03 SQLite Python 自带的轻量数据库 scripts/03 怎么算完成 ：能跑通 01–03，并且能自己改一个数字，说出结果哪里变了。 2.1 找一份带时间戳的数据集 人话 ：CSV 里要有一列时间，而且每一行是一个时间点的记录。 本项目已经帮你找好了 ：UCI 北京 PM2.5 数据。 2010-01-01 到 2014-12-31； 每小时一条，共 43824 条； 时间戳是 UTC； 目标列是 pm2.5 （空气污染浓度）。 怎么算完成 ：运行 python scripts\\download_data.py ，看到前 5 行数据。 2.2 用 pandas 读进内存，解析时间、排序、检查缺失 人话 ： 读 CSV； 把\"年/月/日/小时\"拼成真正的时间； 按时间从小到大排序； 看每一列缺了多少值，决定怎么处理。 你要做 ：运行 python scripts\\04_load_clean.py 。 怎么算完成 ：能回答： 这份数据一共多少小时？ 时间戳有没有重复？ pm2.5 缺了多少？ 为什么不能直接删掉缺失行？ 答案都在脚本输出和 outputs/tables/04_cleaning_report.txt 里。 2.3 从时间戳里拆出年、月、日、星期、小时、是否周末 人话 ：模型只认数字，所以你要把时间\"翻译\"成数字。 你要做 ：运行 python scripts\\05_time_features.py 。 怎么算完成 ：知道这些列分别是什么： year 、 month 、 day 、 hour dayofweek （0=周一，6=周日） is_weekend （1=周末，0=工作日） hour_sin / hour_cos （后面 2.5 才讲） 2.4 选一个目标，用线性回归跑基线 人话 ：先跑一个最笨的模型，作为以后对比的\"地板\"。 本项目选的目标 ：站在时间 t，用现在知道的信息，预测 t+1 时刻的 PM2.5。 你要做 ：运行 python scripts\\06_baseline_model.py 。 怎么算完成 ：能说出： 训练集是前 80%，测试集是后 20%； 为什么不能随机切分； MAE、RMSE、R² 分别是什么意思。 2.5 对小时、星期做正弦/余弦编码，观察效果变化 人话 ：直接给模型 hour=23 和 hour=0 ，它会觉得这两个数差得很远； 但现实中它们是挨着的。sin/cos 把时间放到一个圆上，让 23 点和 0 点变近。 你要做 ：运行 python scripts\\07_cyclic_encoding.py ，对比两行结果。 怎么算完成 ：能写出：\"在这个数据上，原始数字时间的 MAE = _，周期编码的 MAE = _，R² = ____。\" 注意：不一定周期编码一定大幅更好。实验结论要写\"在这个数据、这个模型、这段测试期上怎么样\"，不要写\"sin/cos 永远更好\"。 3.1 做滞后和滑动窗口，体会不能混入未来数据 人话 ： 滞后（lag）：把过去的值挪到当前行，例如 lag1 是上一小时的值； 滑动窗口（rolling）：算过去 24 小时的平均值、标准差、最大值； 预测 t+1 时，只能用 t 及更早的数据，不能用 t+1 的数据。 你要做 ：运行 python scripts\\08_lag_rolling_features.py 。 怎么算完成 ：能指着表说出：对每一行， lag1 是哪个时刻、 roll24_mean 用了哪些时刻、 pm25_next 是哪个时刻。 3.2 加入滞后、滑动窗口，对比效果，记录哪些有用 人话 ：做对照实验。一次只改一组特征，其他条件不变。 你要做 ：运行 python scripts\\09_model_comparison.py 。 怎么算完成 ：把 outputs/tables/09_model_comparison.csv 的数字抄进 notes/实验记录模板.md ，并写出 3 条结论。 3.3 画图观察特征 人话 ：图比数字直观。看趋势、周期、异常点。 你要做 ：运行 python scripts\\10_plots.py 。 怎么算完成 ：每张图下面写 2–3 句话： 我看到了什么现象？ 这个现象说明哪个特征可能有用？ 实验里它到底有没有用？ 3.4 用 Kaggle 入门赛练手 人话 ：找别人写过的时间序列入门赛，看他们怎么做特征，然后自己复现一遍。 你要做 ：看 06-画图与Kaggle.md ，选一个 Playground 比赛，读 3 篇公开 notebook， 把\"他们用了哪些特征、为什么\"抄进笔记。 怎么算完成 ：能提交一次结果，并在笔记里写出\"我复现了哪个特征、效果如何\"。 3. 名词速查（先混个眼熟） 名词 一句话解释 例子 时序数据 带时间戳、按时间排序的记录 每小时一条 PM2.5 时间戳 记录发生的具体时间 2014-01-01 08:00 UTC 世界统一时间，避免时区混乱 北京时间 = UTC+8 特征 喂给模型的输入列 hour、is_weekend 特征工程 从原始数据造出更有用的特征 把时间拆成小时和星期 周期 每隔一段时间重复出现的规律 一天、一周、一年 滞后 lag 过去某个时刻的值 pm2.5.shift(1) 滑动窗口 rolling 过去 N 个值的统计量 过去 24 小时平均 差分 diff 当前值减上一个值 今天比昨天高多少 基线模型 最笨但必须有的对比模型 永远猜平均值 训练集 用来学习的旧数据 前 80% 测试集 用来考试的新数据 后 20% 数据泄漏 不小心把答案或未来信息喂给模型 用 t+1 的值预测 t+1 MAE 平均差多少，越小越好 10 表示平均差 10 RMSE 更重罚大错误的指标 也是越小越好 R² 拟合好不好的指标，1 最好 0 约等于只会猜平均 4. 整个项目的数据流 原始 CSV ↓ download_data.py 带 year/month/day/hour 的原始表 ↓ 04_load_clean.py：拼 UTC 时间、排序、检查缺失 干净的小时级数据（完整时间轴） ↓ 05_time_features.py：拆年/月/日/星期/小时/是否周末 + sin/cos 带时间特征的表 ↓ 08_lag_rolling_features.py：shift + rolling + 目标 y 完整建模数据 ↓ 09_model_comparison.py：按时间切分、训练线性回归、对比 实验表格 + 预测值 ↓ 10_plots.py 6 张图 5. 现在就开始：你的第一个 30 分钟 打开 README 的\"第 0 步\"，把项目跑起来； 看到 run_all.ps1 输出\"全部脚本运行完成\"； 打开 outputs/figures/ ，把 6 张图从前到后看一遍； 在 notes/学习笔记模板.md 里写下你最好奇的一个问题；"}, {"title": "环境与工具", "type": "教程", "route": "#doc-env", "text": "01 环境与工具：Python、Git、GitHub、Markdown 这一课的目标：让你的电脑能跑 Python，让你会保存代码、上传代码、写笔记。 1. PowerShell 最少必要命令 Windows 里搜索 \"PowerShell\"，打开。下面 6 个命令够你用很久： 命令 作用 例子 Get-Location 我现在在哪个文件夹 Get-Location cd 路径 进入某个文件夹 cd E:\\develop\\codex\\github dir 或 ls 看文件夹里有什么 dir python --version 看 Python 版本 python --version python 文件.py 运行一个 Python 脚本 python scripts\\05_time_features.py git status 看 Git 现在是什么状态 git status 小技巧：在文件资源管理器的地址栏直接输入 powershell 再回车，就会在当前文件夹打开 PowerShell。 2. 虚拟环境：为什么每个人都要建 .venv 假设你以后做了 10 个项目： 项目 A 需要 pandas 2.0； 项目 B 需要 pandas 3.0。 如果所有库都装在电脑全局，就会打架。虚拟环境就是给每个项目一个独立的工具箱。 创建 python -m venv .venv 激活 .\\.venv\\Scripts\\Activate.ps1 成功后命令行前面会有 (.venv) 。 常见问题：禁止运行脚本 报错类似： 无法加载文件 ... Activate.ps1，因为在此系统上禁止运行脚本 解决： Set-ExecutionPolicy -Scope Process Bypass .\\.venv\\Scripts\\Activate.ps1 -Scope Process 表示只对当前这个终端窗口生效，关掉就恢复，安全。 安装依赖 pip install -r requirements.txt 如果下载很慢，可以换国内镜像（任选一个）： pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple 3. 建议用 VS Code 写代码 下载安装 VS Code（免费）； 用 VS Code 打开本项目文件夹： File -> Open Folder ； 安装 Python 扩展（左侧扩展图标搜索 Python）； 按 Ctrl + Shift + P ，输入 Python: Select Interpreter ，选择 .venv\\Scripts\\python.exe ； 按 Ctrl + 反引号 打开终端，就能直接运行脚本。 VS Code 只是编辑器，不是必须的。但你迟早要用它看代码、改代码。 4. 运行本项目 方式一：一键运行 .\\run_all.ps1 方式二：一个脚本一个脚本运行（推荐学习用） python scripts\\01_python_basics.py python scripts\\02_pandas_basics.py python scripts\\03_sqlite_basics.py python scripts\\04_load_clean.py python scripts\\05_time_features.py python scripts\\06_baseline_model.py python scripts\\07_cyclic_encoding.py python scripts\\08_lag_rolling_features.py python scripts\\09_model_comparison.py python scripts\\10_plots.py 中文乱码怎么办 先执行： chcp 65001 [Console]::OutputEncoding = [System.Text.Encoding]::UTF8 $env:PYTHONIOENCODING = \"utf-8\" 然后再运行脚本。 run_all.ps1 里已经自动设置好了。 5. Git：先把\"保存\"这件事学会 Git 就像游戏存档：每完成一小步，就存一个档。GitHub 是云端的存档仓库。 5.1 第一次配置身份 git config --global user.name \"你的名字\" git config --global user.email \"你的邮箱\" 5.2 在本项目里初始化 Git cd E:\\develop\\codex\\github\\time-series-feature-engineering git init git status 5.3 日常最常用的 4 条命令 # 1. 看现在改了哪些文件 git status # 2. 把所有修改放进\"待保存\" git add . # 3. 存一个档（引号里写这次做了什么） git commit -m \"完成时间特征提取\" # 4. 看历史记录 git log --oneline 提交信息建议： 完成数据下载脚本 跑通 pandas 基础练习 添加小时和星期特征 完成模型对比实验 画了 6 张特征观察图 5.4 创建 GitHub 仓库并上传 打开 https://github.com ，注册/登录； 点右上角 + → New repository ； 仓库名建议： time-series-feature-engineering ； 选择 Public（公开）或 Private（私有，需要给导师加权限）； 不要 勾选 \"Add a README file\"（我们本地已经有了）； 创建后，GitHub 会给你一个仓库地址，类似： https://github.com/你的用户名/time-series-feature-engineering.git 在本地执行： git branch -M main git remote add origin https://github.com/你的用户名/time-series-feature-engineering.git git push -u origin main 第一次 push 可能需要登录。GitHub 现在不能用账号密码，需要用 Personal Access Token（PAT）： GitHub 右上角头像 → Settings ； 左侧最下 Developer settings ； Personal access tokens → Tokens (classic) → Generate new token ； 勾选 repo ； 生成后复制 token（只显示一次）； push 时用户名填 GitHub 用户名，密码位置粘贴 token。 5.5 每次写完代码的完整流程 git status git add . git commit -m \"这次完成了什么\" git push 5.6 进阶一点：分支 # 新建并切换到一个分支 git switch -c add-lag-features # 在分支上改代码、提交 git add . git commit -m \"添加滞后特征\" # 推送到 GitHub git push -u origin add-lag-features 然后去 GitHub 网页上开 Pull Request（PR），自己 review 一下，再合并到 main。 这一步很加分，因为它说明你会团队协作的基本流程。 更完整的 Git/GitHub 教程：你之前已经有 github-start-guide 项目，可以直接对照看。 6. Markdown：30 秒学会写笔记 Markdown 就是\"用几个符号表示格式\"。 你写的 显示效果 # 一级标题 大标题 ## 二级标题 中标题 - 一句话 无序列表 1. 第一步 有序列表 **加粗** 加粗 `代码` 行内代码 ```python 代码块 ![图](路径) 插入图片 [链接](网址) 插入链接 本项目里已经准备好了两个模板： notes/学习笔记模板.md ：每个特征一张表； notes/实验记录模板.md ：每次实验一组数据。 7. 本课检查点 [ ] 我能创建并激活虚拟环境； [ ] 我能运行一个脚本并看懂终端输出； [ ] 我执行过 git init 、 git add 、 git commit ； [ ] 我把代码 push 到了 GitHub； [ ] 我会用 Markdown 写标题、列表、代码块； [ ] 我知道中文乱码时用 chcp 65001 。 有任何报错，先看 99-报错急救.md 。"}, {"title": "Python 零基础", "type": "教程", "route": "#doc-python", "text": "02 Python 零基础：只学够用的 20% 你不需要先学完一整本 Python 书。做时序特征工程，先掌握下面这些就够了。 对应脚本： scripts/01_python_basics.py 。 1. 变量：给数据起名字 temperature = 22.5 city = \"南京\" is_weekend = False temperature 是名字； 22.5 、 \"南京\" 、 False 是值； = 是\"把右边的值放进左边的名字\"，不是数学里的等于。 2. 列表 list：一排有顺序的数据 temperatures = [11.0, 12.5, 10.8, 9.6, 13.2] print(temperatures[0]) # 11.0，Python 从 0 开始编号 print(temperatures[-1]) # 13.2，-1 表示最后一个 print(temperatures[:3]) # 前 3 个 temperatures.append(14.0) # 在末尾追加 print(max(temperatures)) print(sum(temperatures) / len(temperatures)) 什么时候用：存一列数字。 3. 字典 dict：用名字找值 row = { \"city\": \"南京\", \"date\": \"2026-10-08\", \"temperature\": 22.5, \"is_weekend\": False, } print(row[\"temperature\"]) # 22.5 row[\"weather\"] = \"多云\" # 新增键 row[\"temperature\"] = 23.1 # 修改值 什么时候用：存\"一条记录\"，每个字段有名字。 4. 队列 deque：滑动窗口的思想原型 from collections import deque window = deque(maxlen=3) for value in [80, 75, 90, 120, 110]: window.append(value) print(list(window), sum(window) / len(window)) 输出： [80] 80.0 [80, 75] 77.5 [80, 75, 90] 81.66666666666667 [75, 90, 120] 95.0 [90, 120, 110] 106.66666666666667 maxlen=3 表示窗口只能装 3 个：新的进来，最老的自动出去。 这就是 rolling(3).mean() 的直觉： 只看最近 3 个，算平均 。 5. 函数 def：把代码打包 def c_to_f(celsius): return celsius * 9 / 5 + 32 print(c_to_f(25)) # 77.0 def 是定义函数； 括号里是输入； return 是输出。 以后你会看到很多函数，例如： def regression_metrics(y_true, y_pred): ... return {\"MAE\": ..., \"RMSE\": ..., \"R2\": ...} 不要怕，先看\"输入是什么、输出是什么\"。 6. 循环和条件：批量处理 for value in [35, 76, 120, 210]: if value <= 50: level = \"优\" elif value <= 100: level = \"良\" elif value <= 150: level = \"轻度污染\" else: level = \"中重度污染\" print(value, level) Python 用 缩进 表示\"谁属于谁\"。缩进乱了，程序就报错。 7. 文件读写：把结果存下来 from pathlib import Path path = Path(\"outputs/tables/my_note.txt\") path.write_text(\"我今天学会了列表和字典。\\n\", encoding=\"utf-8\") content = path.read_text(encoding=\"utf-8\") print(content) 时间序列数据通常也是这样：读一个 CSV 进来，处理完再写一个 CSV 出去。 8. 怎么读报错信息 Python 报错看起来吓人，其实结构固定： Traceback (most recent call last): File \"scripts/02_pandas_basics.py\", line 122, in <module> main() File \"scripts/02_pandas_basics.py\", line 121, in main groupby_demo(df) TypeError: groupby_demo() takes 0 positional arguments but 1 was given 看三件事： 最后一行 ：错误类型和原因（这里是参数多给了一个）； 文件名和行号 ： scripts/02_pandas_basics.py, line 122 ； 箭头附近 ：出错的那行代码。 新手最常见的 4 个错误： 报错 大概原因 怎么办 IndentationError 缩进不对 检查空格，别混用 Tab 和空格 NameError 用了没定义的变量 检查变量名拼写 ModuleNotFoundError 没装库或没激活虚拟环境 激活 .venv ， pip install -r requirements.txt FileNotFoundError 文件路径不对 确认先运行了生成数据的上一个脚本 9. 动手练习 在 scripts/01_python_basics.py 里改这几处，每改一次就运行一次： 把 hourly_pm25 的最后一个数改成 200，看平均值怎么变； 把 deque(maxlen=3) 改成 maxlen=5 ，看窗口怎么变； 在 exercises() 里加一个数字 7 ，看最大值和排序结果； 把文件里写的那句话改成你自己的名字。 10. 检查点 [ ] 我能解释 list 和 dict 的区别； [ ] 我能说出 deque(maxlen=3) 在干什么； [ ] 我能定义并调用一个函数； [ ] 我知道报错要看最后一行、文件名、行号； [ ] 我改过代码里的数字并成功重新运行。 下一课： 03-pandas与SQLite.md 。"}, {"title": "pandas 与 SQLite", "type": "教程", "route": "#doc-pandas-sqlite", "text": "03 pandas 与 SQLite：数据处理的两把常用工具 对应脚本： scripts/02_pandas_basics.py scripts/03_sqlite_basics.py 第一部分：pandas pandas 是 Python 里最常用的表格处理工具。你可以把它想成\"用代码操作的 Excel\"。 1. 两个核心概念 概念 是什么 类比 Series 一列数据 Excel 里的一列 DataFrame 一张表，很多列 一整个 Excel 工作表 2. 读 CSV import pandas as pd df = pd.read_csv(\"data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv\") df 是变量名，随便起，但大家习惯叫 df （DataFrame 的缩写）； 路径可以用相对于项目根目录的路径； 读进来之后，先用眼睛看，别急着建模。 3. 看数据的 5 个动作 df.head() # 前 5 行 df.shape # (行数, 列数) df.columns # 列名 df.dtypes # 每一列的类型 df.describe() # 数值列的统计量 df.isna().sum() # 每一列缺多少个值 新手最容易犯的错 ：拿到数据直接扔进模型。正确顺序是：先看，再洗，再用。 4. 选列和筛选行 df[\"pm2.5\"] # 选一列（Series） df[[\"pm2.5\", \"TEMP\"]] # 选两列（DataFrame） df[df[\"pm2.5\"] > 100] # 只保留 pm2.5 大于 100 的行 df[(df[\"pm2.5\"] > 100) & (df[\"TEMP\"] < 0)] # 两个条件 注意：多个条件要用 & （并且）、 | （或者），每个条件要加括号。 5. 造新列 df[\"is_weekend\"] = df[\"dayofweek\"] >= 5 df[\"temp_f\"] = df[\"TEMP\"] * 9 / 5 + 32 特征工程本质上就是不断造新列。 6. 分组统计 groupby df.groupby(\"hour\")[\"pm2.5\"].mean() # 每个小时的平均 PM2.5 df.groupby(\"dayofweek\")[\"pm2.5\"].mean() # 每个星期的平均 PM2.5 这是观察周期性的最快方法：如果每个小时的平均值不一样，说明小时可能有预测价值。 7. 时间处理：字符串 → datetime → 拆特征 df[\"datetime\"] = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]]) df[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"UTC\") df[\"year\"] = df[\"datetime\"].dt.year df[\"month\"] = df[\"datetime\"].dt.month df[\"day\"] = df[\"datetime\"].dt.day df[\"hour\"] = df[\"datetime\"].dt.hour df[\"dayofweek\"] = df[\"datetime\"].dt.dayofweek # 0=周一 datetime 是真正的时间类型，可以排序、相减、取年/月/日； tz_localize(\"UTC\") 表示\"这个时间本来就是 UTC\"； 如果原始时间是北京时间 Asia/Shanghai ，要先用 tz_localize(\"Asia/Shanghai\") ，再用 tz_convert(\"UTC\") 。 8. 时间索引和重采样 df = df.set_index(\"datetime\").sort_index() daily = df[\"pm2.5\"].resample(\"D\").mean() # 每天平均 weekly = df[\"pm2.5\"].resample(\"W\").mean() # 每周平均 resample(\"D\") ：按天分组； resample(\"W\") ：按周分组； 这是画趋势图之前常用的操作。 9. shift 和 rolling（先看一眼，下一课细讲） df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1) # 上一小时 df[\"pm25_roll24_mean\"] = df[\"pm2.5\"].rolling(24).mean() # 最近 24 小时平均 用之前一定先问自己： 这一行看到的数，在预测的时候真的拿得到吗？ 10. pandas 动手练习 在 scripts/02_pandas_basics.py 里改： 把筛选条件从 rain_mm > 5 改成 rain_mm > 1 ，看结果变化； 把 groupby(\"city\") 改成按别的列分组； 把 df.head(100) 改成 df.head(500) ； 在真正的数据上，自己算一遍 df[\"cbwd\"].value_counts() ，看风向有几种。 第二部分：SQLite SQLite 是 Python 自带的轻量数据库，零配置。你不需要装 MySQL。 对应脚本： scripts/03_sqlite_basics.py 。 1. 为什么需要数据库 CSV 适合\"读进来一次性分析\"；数据库适合\"很多次增删改查\"。 比如你要做一个天气记录系统，每天新增记录、修改、删除、查询，用数据库更合适。 2. 连接数据库 import sqlite3 conn = sqlite3.connect(\"data/processed/practice.db\") connect 时如果文件不存在，会自动创建。 3. 建表 + 主键 conn.execute(\"\"\" CREATE TABLE IF NOT EXISTS weather_notes ( id INTEGER PRIMARY KEY, -- 主键：唯一身份证，不能重复 city TEXT NOT NULL, date TEXT NOT NULL, temp REAL, note TEXT ) \"\"\") conn.commit() 主键 ：每一行的唯一编号。如果你插入两条 id=1 ，数据库会直接报错。这是好事，它帮你防止重复数据。 4. 增：INSERT conn.execute( \"INSERT INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\", (1, \"Nanjing\", \"2026-10-01\", 28.0, \"sunny\"), ) conn.commit() ? 是占位符，不要用字符串拼接，既安全又不容易出错。 5. 查：SELECT rows = conn.execute(\"SELECT * FROM weather_notes WHERE city = ?\", (\"Nanjing\",)).fetchall() for row in rows: print(row) 常见查询： SELECT * FROM weather_notes ORDER BY date; SELECT city, COUNT(*) FROM weather_notes GROUP BY city; SELECT AVG(temp) FROM weather_notes WHERE city = 'Nanjing'; 6. 改：UPDATE conn.execute(\"UPDATE weather_notes SET temp = ? WHERE id = ?\", (29.5, 1)) conn.commit() 一定要写 WHERE 。不写的话，整张表都会被改掉。 7. 删：DELETE conn.execute(\"DELETE FROM weather_notes WHERE id = ?\", (4,)) conn.commit() 同样， 一定要写 WHERE 。 8. 索引 conn.execute(\"CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)\") conn.commit() 索引像书的目录：按 city 查询会更快，但会占一点空间，写入也会稍慢。 不是越多越好，常用查询列才建。 9. SQLite 和 pandas 怎么配合 df.to_sql(\"pm25\", conn, if_exists=\"replace\", index=False) # DataFrame 存进数据库 df2 = pd.read_sql(\"SELECT * FROM pm25 WHERE pm2.5 > 100\", conn) # 查出来变 DataFrame 先把数据放进数据库，再用 SQL 查询、用 pandas 分析，是实际工作中很常见的组合。 10. SQLite 动手练习 在 scripts/03_sqlite_basics.py 里： 增加一条你自己的记录； 查询 temp 大于 25 的行； 把某个城市的名字改掉； 删掉一条记录； 给 date 列也建一个索引。 检查点 [ ] 我能读一个 CSV 并打印 shape 、列名、缺失值； [ ] 我能筛选行、选列、造新列； [ ] 我能用 groupby 求每小时平均； [ ] 我能把时间字符串转成 datetime； [ ]"}, {"title": "时序特征工程核心", "type": "教程", "route": "#doc-feature-core", "text": "04 时序特征工程核心：把时间变成模型能用的数字 这是整个项目最重要的一课。对应导师要求 2.3、2.5、3.1、3.2。 先记住三个问题，后面所有内容都围绕它们： 时间戳怎么变成数字？ （日历特征 + 周期编码） 怎么把\"过去发生了什么\"告诉模型？ （滞后 + 滑动窗口） 怎么证明加了这些特征有用？ （对照实验 + 指标 + 画图） 1. 什么是时序数据 时序数据 = 带时间戳、按时间排好序的记录。 例子： datetime pm2.5 TEMP 2014-01-01 00:00 80 -3 2014-01-01 01:00 75 -4 2014-01-01 02:00 90 -4 普通表格数据可以打乱顺序，时序数据 不能随便打乱 ，因为顺序本身就是信息。 常见时间粒度 粒度 例子 周期长度 小时 每小时 PM2.5 24（一天）、168（一周） 天 每天销量 7（一周）、365（一年） 分钟 股票、外卖订单 60、1440 2. UTC：为什么时间戳最好统一 UTC 是世界统一时间。不同国家有不同时区： 北京：UTC+8； 伦敦：UTC+0（夏令时 UTC+1）； 纽约：UTC-5（夏令时 UTC-4）。 如果两份数据一个用北京时间、一个用 UTC，直接合并就会错 8 小时。统一用 UTC 最省事。 代码怎么写 # 情况 1：原始时间本来就是 UTC df[\"datetime\"] = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]]) df[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"UTC\") # 情况 2：原始时间是北京时间，想转成 UTC df[\"datetime\"] = pd.to_datetime(df[\"datetime\"]) df[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"Asia/Shanghai\") df[\"datetime\"] = df[\"datetime\"].dt.tz_convert(\"UTC\") # 情况 3：已经带时区，直接转换 df[\"datetime\"] = df[\"datetime\"].dt.tz_convert(\"UTC\") 本项目的数据集原始时间就是 UTC。要注意： UTC 08:00 = 北京 16:00 。 如果你要看\"北京人的早晚高峰\"，可以再加一列： df[\"hour_beijing\"] = (df[\"hour\"] + 8) % 24 本教程为了统一，所有小时都按 UTC 讲。 3. 先定义预测场景：t 和 t+1 这是最容易出错、也最重要的一步。 我们约定： 站在时间 t（现在），用截至 t 已经知道的信息，预测 t+1（下一个小时）的 PM2.5。 把时间轴画出来： ... t-3 t-2 t-1 t t+1 t+2 ... 已知 已知 已知 已知 要预测 不能看 t 及更早的数据：可以用； t+1 及以后的数据：绝对不能用； 目标 y 是 t+1 的值； 特征 X 只能从 t 及更早的时刻构造。 用 shift 表示 df[\"y\"] = df[\"pm2.5\"].shift(-1) # 目标：下一小时 df[\"lag1\"] = df[\"pm2.5\"].shift(1) # 特征：上一小时 df[\"lag24\"] = df[\"pm2.5\"].shift(24) # 特征：昨天同一小时 shift(-1) 是\"把未来的值移到当前行\"，只能用于目标 y ，不能当特征。 shift(1) 是\"把过去的值移到当前行\"，可以当特征。 4. 日历特征：把时间拆成数字 特征 怎么构造 含义 可能的作用 year index.year 年份 长期趋势（本例只有 5 年，谨慎用） month index.month 1–12 月 季节变化：冬天 PM2.5 通常更高 day index.day 几号 通常作用不大，容易过拟合 hour index.hour 0–23 点 一天内的规律 dayofweek index.dayofweek 0=周一…6=周日 工作日/周末差异 is_weekend dayofweek >= 5 0/1 更直接地告诉模型\"这是周末\" dayofyear index.dayofyear 1–366 季节位置，比 month 细 weekofyear index.isocalendar().week 一年中的第几周 周期性任务常用 quarter index.quarter 季度 粗粒度的季节 例子：为什么\"周末特征\"可能有用 如果共享单车数据里，周末的骑行量明显高于工作日，那么 is_weekend 就能帮模型预测\"周末销量高\"。 如果数据里周末和工作日没差别，这个特征就没用—— 有没有用要用实验判断，不能靠感觉。 5. 周期编码：sin/cos 到底在干什么 问题：23 点和 0 点明明是邻居 如果直接把 hour 当成一个数字： 0, 1, 2, ..., 22, 23 模型会认为 0 和 23 相差 23，非常远。但实际上 23:00 的下一小时就是 00:00，它们只差 1。 解决：把时间放到一个圆上 df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24) df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24) sin 和 cos 一起用，才能唯一确定圆上的位置； 23 点和 0 点在圆上非常接近； 同理，星期用 7，月份用 12： df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7) df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7) df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12) df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12) 什么时候特别有用 线性回归、逻辑回归等线性模型：非常有用，因为它们不会自己理解\"循环\"； 树模型（随机森林、XGBoost）：也有用，但没那么关键，因为树可以自己切分。 实验结论怎么写 在本项目里： 写法 好不好 \"sin/cos 一定比原始 hour 好\" ❌ 太绝对 \"在这个数据、线性回归、这段测试期上，周期编码让 R² 从 0.0286 变成 0.0331，MAE 略增\" ✅ 具体、诚实 6. 滞后特征 lag：把过去的值搬过来 核心代码 df[\"pm25_now\"] = df[\"pm2.5\"] # 当前小时（t） df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1) # 上一小时（t-1） df[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2) # t-2 df[\"pm25_lag3\"] = df[\"pm2.5\"].shift(3) # t-3 df[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24) # 昨天同一小时 df[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168) # 上周同一小时（24*7） 为什么要选 24 和 168 24 小时 = 一天，捕捉\"日周期\"； 168 小时 = 一周，捕捉\"周周期\"； 1、2、3 小时捕捉\"短期惯性\"（刚才污染高，下一小时可能还高）。 时间对齐表（一定要会看） datetime pm2.5（当前） lag1 lag24 pm25_next（目标） 01-09 08:00 93 106 66 84 01-09 09:00 84 93 92 73 01-09 10:00 73 84 135 66 看第二行：当前是 09:00，lag1 是 08:00 的 93，lag24 是昨天 09:00 的 92， 目标是 10:00 的 73。 特征全部来自 09:00 及以前，目标来自 10:00。 常见错误 错误 后果 用 shift(-1) 造特征 直接把答案喂给模型 先 dropna() 再 shift() 时间轴断裂，lag24 不再是 24 小时前 随机切分后再看 lag 训练集里混进了未来的时间 7. 滑动窗口 rolling：看最近一段时间的整体情况 核心代码 window24 = df[\"pm2.5\"].rolling(window=24, min_periods=18) df[\"pm25_roll24_mean\"] = window24.mean() # 最近 24 小时平均 df[\"pm25_roll24_std\"] = window24.std() # 最近的波动大小 df[\"pm25_roll24_max\"] = window24.max() # 最近最高 df[\"pm25_roll24_min\"] = window24.min() # 最近最低 window168 = df[\"pm2.5\"].rolling(window=168, min_periods=120) df[\"pm25_roll168_mean\"] = window168.mean() # 最近一周平均 df[\"pm25_roll168_std\"] = window168.std() # 最近一周"}, {"title": "建模与实验", "type": "教程", "route": "#doc-modeling", "text": "05 建模与实验：线性回归、切分、指标和结果解读 对应脚本： scripts/06_baseline_model.py scripts/07_cyclic_encoding.py scripts/09_model_comparison.py 1. 线性回归不是黑魔法 线性回归就是找一条直线（或超平面），让预测值和真实值尽量接近： 预测值 = b + a1*x1 + a2*x2 + ... + an*xn x1, x2, ... 是你的特征（hour、lag1、roll24_mean…）； a1, a2, ... 是模型学到的系数； b 是截距。 它不神秘，就是\"给每个特征乘一个权重，再加起来\"。 from sklearn.linear_model import LinearRegression model = LinearRegression() model.fit(x_train, y_train) # 学习 pred = model.predict(x_test) # 预测 2. 训练集和测试集：为什么必须按时间切 正确做法 split_index = int(len(df) * 0.8) train = df.iloc[:split_index] # 前 80%，旧数据 test = df.iloc[split_index:] # 后 20%，新数据 用过去的数据学习，用未来的数据考试。这才像真实场景。 错误做法 from sklearn.model_selection import train_test_split train, test = train_test_split(df, test_size=0.2, shuffle=True) # ❌ 时序数据不要这样 随机切分会让训练集里混入\"未来\"的时间段，测试集里混入\"过去\"的时间段。 这相当于考试前把一部分考题和答案混在一起复习，分数不能代表真实水平。 本项目的第 9 课专门把随机切分列出来作为 错误示范 。注意：错误做法不一定会让分数变高，它的问题是\"测的不是我们关心的东西\"。 3. 三个指标：MAE、RMSE、R² 假设真实值是 [100, 120, 80] ，预测值是 [90, 130, 70] 。 MAE（平均绝对误差） |100-90| + |120-130| + |80-70| = 10 + 10 + 10 = 30 MAE = 30 / 3 = 10 一句话： 平均每次预测差多少。 越小越好，单位和目标一样（这里是 PM2.5）。 RMSE（均方根误差） 先平方，再平均，再开根号： sqrt((10² + 10² + 10²) / 3) = 10 平方会重罚\"差得特别离谱\"的预测。所以 RMSE 通常会比 MAE 大一点。 如果 RMSE 远大于 MAE，说明存在少数错得很离谱的预测。 R²（决定系数） R² = 1 - (模型犯的错) / (只会猜平均值犯的错) R² = 1 ：完美预测； R² = 0 ：和\"永远猜平均值\"差不多； R² < 0 ：比\"永远猜平均值\"还差。 R² 的好处是跨数据集可比，坏处是它会被极端值影响。 不要只看 R²。 4. 必须有基线：平均值和持续法 基线 1：平均值 pred = [y_train.mean()] * len(y_test) 不管三七二十一，永远猜训练集的平均值。这个分数就是\"地板\"。 基线 2：持续法（persistence） pred = test[\"pm2.5\"] # 把当前值直接当成下一小时的预测 听起来很笨，但在时间序列里非常强：如果这一小时 PM2.5 = 80， 下一小时大概率也在 80 附近。 如果你的复杂模型还打不过持续法，就说明你的特征或模型有问题。 5. 实验原则：一次只改一个东西 对比实验的基本规矩： 同一份数据； 同一段时间切分； 同一个模型（都用线性回归）； 同一个评价指标； 只改特征 。 本项目第 9 课的对比： 实验 特征 切分方式 平均值基线 无 按时间 8:2 持续法基线 当前 pm2.5 按时间 8:2 只用原始时间特征 month/day/hour… 按时间 8:2 只用周期编码时间 sin/cos 按时间 8:2 周期编码 + 滞后 + lag/diff 按时间 8:2 完整正确版 + 滑动窗口 + 天气 按时间 8:2 中心滑动窗口（错误） 包含未来值 按时间 8:2 把答案当特征（错误） 答案 按时间 8:2 随机切分（错误） 完整特征 随机 8:2 6. 本项目跑出来的真实结果（你的机器上可能略有差异） 6.1 第 6 课：只用时间特征 模型 MAE RMSE R² 平均值基线 69.664 94.430 -0.0000 线性回归（时间特征） 68.539 93.068 0.0286 解读 ：只看\"现在几月几号几点\"，几乎预测不了下一小时的 PM2.5。 R² 从 0 提升到 0.0286，提升很小。这很正常——空气污染不是看表就能算出来的。 6.2 第 7 课：周期编码对比 模型 MAE RMSE R² 原始数字时间 68.539 93.068 0.0286 周期编码时间 68.644 92.853 0.0331 解读 ：这是一个很好的\"诚实结论\"例子。 周期编码让 RMSE 略降、R² 略升； 但 MAE 反而略微变差（68.539 → 68.644）。 所以不能写\"周期编码全面更好\"。正确的写法是： 周期编码让 R² 略有提升（0.0286 → 0.0331），RMSE 略有下降， 但 MAE 基本不变甚至略增。说明在这个数据、这个模型、这段测试期上， 周期编码的作用有限，不能夸大成\"显著提升\"。 6.3 第 9 课：完整对比 实验 MAE RMSE R² 可信吗 平均值基线 64.740 82.470 -0.0286 ✅ 持续法基线 10.981 19.968 0.9397 ✅ 只用原始时间特征 62.576 81.323 -0.0002 ✅ 只用周期编码时间 62.656 80.601 0.0175 ✅ 周期编码 + 滞后 10.934 19.670 0.9415 ✅ 完整正确版 10.754 19.473 0.9426 ✅ 中心滑动窗口 10.413 18.112 0.9504 ❌ 泄漏 把答案当特征 0.000 0.000 1.0000 ❌ 作弊 随机切分 12.430 21.106 0.9494 ❌ 方法错 五个关键结论 ： 只靠时间特征远远不够 。MAE 60+，R² 接近 0。 持续法非常强 。当前值直接当预测，R² 就有 0.94。这告诉我们：PM2.5 前后两小时高度相关。 滞后特征带来最大提升 。加入 lag 后，MAE 从 62.7 降到 10.9，几乎追平持续法。 滑动窗口和天气只带来小幅提升 。完整版 MAE 10.754，比只用滞后好一点点（10.934 → 10.754）。 泄漏会制造假高分 。中心滑动窗口 MAE 10.413 看起来更好，但它用了未来数据； 把答案当特征更是 R² = 1.0000，完全没有意义。 6.4 第 9 课：消融实验（拿掉一组会怎样） 实验 MAE RMSE R² 解读 完整特征 10.754 19.473 0.9426 基准 去掉滞后 33.376 45.330 0.6892 变差很多，滞后最重要 去掉滑动窗口 10.804 19.511 0.9424 几乎没变，作用很小 去掉天气 10.885 19.634 0.9417 影响很小 只留时间特征 62.656 80.601 0.0175 变差巨大 一句话总结 ：在这个\"预测下一小时\"的任务里， 最近的值（当前值、lag1）最有信息量 ； 滑动窗口和天气是锦上添花，不是决定性的。 这不是失败，而是一个很真实、很有价值的科研结论。 7. 为什么\"预测下一小时\"这么容易 因为 PM2.5 的相邻小时高度相关。今天 10:00 是 80，11:00 大概率还在 80 附近。 持续法就抓住了这个规律。 如果你想做一个更能体现特征工程价值的任务，可以尝试： 预测 t+24 （明天同一小时）而不是 t+1； 预测 未来 24 小时的平均值 ； 预测 明天是否超过某个阈值 （变成分类问题）； 用 多步预测 ：一次预测未来 6/12/24 小时。 预测越远，滞后和滑动窗口的价值越明显。 8. 相关不等于因果 看系数的时候要小心： TEMP 的系数是负的，不代表\"温度降低会导致污染\"； 可能是冬天温度低，同时取暖排放多，两者一起变化； 特征之间高度相关时（ pm25_now 、 lag1 、 roll24_mean ），系数会互相\"抢功劳\"。 可以写：\"TEMP 与目标呈负相关\"，不要写\"TEMP 导致污染\"。 9. 实验记录怎么写 每条实验记录包含 5 个要素： 问题 ：我想验证什么？ 设置 ：数据、特征组、模型、切分、指标； 结果 ：具体数字，不要只写\"变好了\"； 解释 ：为什么会有这个结果？ 限制 ：这个结论在什么条件下成立？有什么没考虑到？ 模板： ### 实验：加入滞后特征是否有帮助 - 问题：把 t-1、t-2、t-24 的值加入特征，能否提升下一小时 PM2.5 预测？ - 设置：线性回归，前 80% 训练 / 后 20% 测试，MAE/RMSE/R²。 - 结果：MAE 从 62.656 降到 10.934，R² 从 0.0175 升到 0.9415。 - 解释：PM2.5 相邻小时高度相关，历史值提供了时间特征无法提供的信息。 - 限制：只在线性回归上验证；换成"}, {"title": "画图与 Kaggle", "type": "教程", "route": "#doc-plots-kaggle", "text": "06 画图与 Kaggle：用眼睛理解特征，用比赛练手 对应脚本： scripts/10_plots.py 。 对应导师要求：3.3 画图观察特征、3.4 用 Kaggle 入门赛练手。 第一部分：怎么读你生成的 6 张图 图片都在 outputs/figures/ 。 图 1：原始序列与趋势（ 01_原始序列与趋势.png ） 上半张是 5 年的日平均 PM2.5，下半张是放大后的两周小时数据。 要看三件事： 有没有长期趋势（整体上升/下降）； 有没有季节规律（冬天通常更高）； 小时级数据是不是上下波动明显。 图 2：滑动平均与差分（ 02_滑动平均与差分.png ） 灰色线：每天的原始值，抖动很大； 橙色线：7 天滑动平均，把短期噪声抹平，趋势更清楚； 绿色线：差分（今天 − 昨天），正数表示升高，负数表示降低； 差分图上的大尖刺就是异常变化点。 图 3：周期性观察（ 03_周期性观察.png ） 三张柱状图分别是按小时、按星期、按月份的平均 PM2.5。 怎么判断有没有周期： 柱子高低是否明显不同 。 如果所有柱子一样高，说明这个时间维度没有信息；如果高低差很多，说明它可能有用。 注意：这张图用的是 UTC 小时。UTC 08:00 是北京时间 16:00。 如果你觉得峰值时间和直觉对不上，先想一想时区。 图 4：预测对比（ 04_预测对比.png ） 黑线：真实值； 橙线：只用周期时间特征的预测，几乎是平的； 蓝线：完整特征（滞后 + 滑动 + 天气）的预测，紧跟黑线。 这张图最直观地说明了： 滞后特征让模型从\"猜平均\"变成了\"跟着走\"。 图 5：周期编码圆（ 05_周期编码圆.png ） 23 个点分布在圆上，每个点是一个小时。0 点和 23 点在圆上紧挨着。 这就是 sin/cos 编码想要表达的：\"小时是一个循环，不是一条直线。\" 图 6：相关性热力图（ 06_相关性热力图.png ） 红色是正相关，蓝色是负相关。数值越接近 ±1 关系越强。 第一行/第一列是 pm25_next （目标），可以看看哪些特征和它关系最近。 但要记住： 相关不代表因果，也不能只凭相关性选特征。 第二部分：matplotlib 最小必要知识 import matplotlib.pyplot as plt fig, ax = plt.subplots(figsize=(10, 4)) ax.plot(dates, values, label=\"PM2.5\") ax.set_title(\"标题\") ax.set_xlabel(\"日期\") ax.set_ylabel(\"数值\") ax.legend() ax.grid(alpha=0.3) fig.savefig(\"outputs/figures/my_plot.png\") plt.close(fig) fig ：整张画布； ax ：具体的坐标轴； plot ：画折线； bar ：画柱状图； scatter ：画散点； label + legend ：图例； savefig ：保存成图片。 中文显示需要设置字体（本项目已经在 scripts/common.py 里统一设置）： plt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\", \"SimHei\"] plt.rcParams[\"axes.unicode_minus\"] = False 第三部分：Kaggle 入门赛实战 1. 注册 打开 https://www.kaggle.com ，用邮箱注册。免费。 2. 找时间序列相关的 Playground 比赛 路径： Competitions → 筛选 Playground → 搜索 time series / forecasting / sales 也可以直接搜索这些关键词： Store Sales Time Series Forecasting Bike Sharing Demand Tabular Playground Series （每一期主题不同，找时间序列相关的） Web Traffic Time Series Forecasting M5 Forecasting （经典，但可能已经结束/不可提交） 注意：Kaggle 比赛会更新，具体名称和是否开放提交以网站为准。 你要找的是： 有明确时间列、有训练集和测试集、评价指标清楚 的比赛。 3. 看懂一个比赛页面 页面 你要看什么 Overview 任务是什么、规则、时间线 Data 有哪些文件、每列什么意思、训练/测试怎么分 Evaluation 用什么指标（MAE、RMSE、SMAPE…） Code 别人的公开 notebook Discussion 常见坑、数据问题 4. 先做一个最笨的提交 不要一上来就冲高分。先做： 读 sample_submission.csv ，看提交格式； 用训练集的平均值，或\"最后一个已知值\"作为预测； 生成提交文件，上传一次； 记住这个分数，它是你的基线。 5. 读 3 篇公开 notebook 的方法 不要从头到尾读代码，直接搜关键词： feature engineering lag rolling shift cyclical sin cos date weekday holiday 每读到一种特征，就问自己： 他怎么构造的？ 为什么他认为这个特征有用？ 我能不能在自己的数据上复现？ 复现后指标变化多少？ 把答案写进 notes/学习笔记模板.md 。 6. 复现一个特征的完整流程 在自己的数据上写构造代码； 确认没有用到未来数据； 保持模型和切分方式不变，只加这一个特征； 记录加之前/之后的 MAE； 写下结论：有用、没用、还是不确定。 7. 关于排名 导师的要求是\"不追求排名，着重看别人的特征工程思路\"。 所以： 排名 3000 名不丢人； 能说清楚\"我复现了 lag 特征，MAE 从 X 降到 Y\"才是真本事； 抄代码不理解，面试/答辩一问就露馅。 8. 常见的 Kaggle 时间序列特征清单 类别 特征 日历 year、month、day、weekday、weekofyear、is_weekend、is_holiday 周期 hour_sin/cos、weekday_sin/cos、month_sin/cos 滞后 lag1、lag2、lag7、lag14、lag28、lag365 滑动 rolling mean/std/min/max（7、14、28 天） 差分 diff1、diff7、pct_change 其他变量 天气、促销、油价、节假日 静态信息 店铺 id、商品 id、城市（类别特征） 注意：具体用哪些，取决于你的数据频率和业务含义。小时数据看 24/168，日数据看 7/30/365。 9. Kaggle 检查点 [ ] 我注册了 Kaggle； [ ] 我找到了一个时间序列相关的 Playground 比赛； [ ] 我看懂了数据文件和提交格式； [ ] 我做出了一次基线提交； [ ] 我读了至少 3 篇公开 notebook； [ ] 我复现了至少 1 个特征并记录了指标变化； [ ] 我没有直接复制别人的代码当自己的作业。 第四部分：把 Kaggle 学到的东西搬回本项目 如果你在 Kaggle 学到了新特征，可以回来改 scripts/08_lag_rolling_features.py ： 加一个新特征； 重新运行 09_model_comparison.py ； 看消融实验有没有变化； 把结论写进笔记。 这就是一个完整的\"学习 → 复现 → 验证 → 记录\"闭环。 导师想看到的正是这个，而不是一个漂亮的分数。 下一课： 07-交作业清单与报告模板.md 。"}, {"title": "知识点速查手册", "type": "教程", "route": "#doc-handbook", "text": "时序特征工程 · 知识点与代码速查手册 配套项目： time-series-feature-engineering （北京 PM2.5 实战） 用途：把项目里用到的知识点和代码集中到一处，打印出来放在手边，写代码、写报告时对着查。 阅读方式：左边是代码，代码下面的「作用」就是这段代码在干什么，不需要背，知道去哪儿找就行。 重新生成 PDF：在项目根目录运行 python guide\\build_handbook.py ，PDF 会输出到 outputs\\知识点与代码速查.pdf 。 打印版 PDF： outputs/知识点与代码速查.pdf （已经在项目里生成好了，直接打开或打印即可）。 怎么用这本手册 先看「核心 10 句话」 ：把整个项目的骨架记住，比记住代码重要。 要写代码时，翻到对应章节 ：每一节都是「代码 + 作用」，复制过去改成自己的列名就能用。 要写报告时，看附录 A 和附录 B ：特征怎么解释、实验结论是什么，直接抄进报告。 报错时看第 10 章 ：按错误信息查，先看原因，再看解决办法。 核心 10 句话 时序数据是带时间戳、按时间排好序的记录， 顺序本身就是信息 ，不能随便打乱。 时间戳统一用 UTC ；北京时间 = UTC + 8。 预测场景要先定义清楚： 站在 t 时刻，用截至 t 已知的信息，预测 t+1 。 时间列可以拆成 年、月、日、星期、小时、是否周末 这些数字特征。 小时、星期、月份用 sin/cos 周期编码 ，23 点和 0 点才会变成\"邻居\"。 lag（滞后） 是把过去的值挪到当前行： shift(1) 是上一小时， shift(24) 是昨天同一小时。 rolling（滑动窗口） 是算最近一段时间（如 24 小时）的均值、波动、最大最小值。 任何用到了 t+1 及以后的信息，都是 数据泄漏 ，测试分数会假高。 时序数据切分训练/测试必须 按时间前后切 ，不能随机切。 先跑 基线 （平均值、持续法），再谈复杂模型；指标看 MAE、RMSE、R² 。 0. 命令速查 0.1 环境：创建并激活虚拟环境 # 在项目根目录（time-series-feature-engineering）执行 python -m venv .venv # 创建虚拟环境 .\\.venv\\Scripts\\Activate.ps1 # 激活（Windows PowerShell） pip install -r requirements.txt # 安装项目需要的库 作用 ： 虚拟环境 = 只属于这个项目的工具箱，不会污染电脑里其他 Python 项目。 激活成功后，命令行前面会出现 (.venv) ；关掉窗口就相当于退出。 Mac/Linux 用 python3 -m venv venv 和 source venv/bin/activate 。 0.2 运行脚本 python scripts\\05_time_features.py # 运行单个脚本 .\\run_all.ps1 # 一键按顺序全部运行 作用 ： 脚本按编号顺序有依赖：04 生成干净数据 → 05 加时间特征 → 08 加滞后滑窗 → 09 做模型对比。 跳过前面的脚本直接跑 09，会提示找不到文件（ FileNotFoundError ）。 0.3 Git 与 GitHub git init # 把这个文件夹变成 Git 仓库 git add . # 把改动放进\"待提交\"区 git commit -m \"完成时间特征提取\" # 存一个版本，附上说明 git log --oneline # 看历史版本 git remote add origin https://github.com/你的用户名/仓库名.git git push -u origin main # 第一次推送 git status # 看当前有哪些改动（最常用） 作用 ： Git 是\"存档 + 时间机器\"，每完成一小步就 add + commit 一次。 GitHub 是放代码的网站，导师要的是仓库链接，不是压缩包。 .gitignore 用来排除不想上传的东西（本项目已排除 .venv/ 、 data/raw/ 等）。 0.4 网页指引、本地服务、生成手册 python guide\\build_guide.py # 重新生成网页指引 powershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1 # 启动本地服务（能读文件夹） python guide\\build_handbook.py # 重新生成这本手册的 PDF 作用 ： 网页指引：把教程、代码、图表、实验表格放在一个页面里看。 本地服务：浏览器出于安全不允许网页直接读本地文件夹， start-server.ps1 会开一个只服务本机的小服务器，网页里的\"项目文件\"才能读文件夹。 手册 PDF：改完上面的 Markdown 后跑一次，PDF 会重新生成。 1. Python 基础 对应脚本： scripts/01_python_basics.py ；对应教程： docs/02-Python零基础.md 。 1.1 列表 list：一串有序的数据 values = [80, 75, 90] # 建列表 values.append(60) # 末尾加一个 first = values[0] # 取第 1 个（下标从 0 开始） last = values[-1] # 取最后一个 print(len(values)) # 长度：4 print(values[1:3]) # 切片：第 2、3 个 作用 ：存放一组有顺序的数据，比如一串连续的 PM2.5 观测值。 1.2 字典 dict：按名字取值 student = {\"name\": \"小明\", \"score\": 90} print(student[\"name\"]) # 取值：小明 student[\"score\"] = 95 # 改值 student[\"city\"] = \"南京\" # 加新的一对 for key, value in student.items(): # 遍历 print(key, value) 作用 ：用\"名字 → 值\"的方式存数据，读代码时比记 [0] 、 [1] 清楚得多。 1.3 队列 deque：先进先出 from collections import deque window = deque(maxlen=3) # 只保留最近 3 个 for value in [10, 20, 30, 40]: window.append(value) print(window) # deque([20, 30, 40], maxlen=3) print(window[0]) # 最早的那个：20 作用 ：维护\"最近 N 个值\"的滑动窗口； maxlen 会自动丢掉最旧的，这是滑动窗口最朴素的手写版本。 1.4 循环、条件、函数 def level(pm25: float) -> str: # 函数：输入 → 输出 if pm25 > 150: return \"重度污染\" elif pm25 > 75: return \"轻度污染\" return \"正常\" for value in [30, 90, 200]: print(value, level(value)) 作用 ： 函数把一段逻辑包起来，起个名字，后面重复用； pm25: float 和 -> str 只是提示类型，不写也能跑。 for 用来遍历一串数据， if/elif/else 用来分支判断。 1.5 读文件、写文件 # 读：with 会在用完以后自动关文件，推荐写法 with open(\"notes/学习笔记模板.md\", \"r\", encoding=\"utf-8\") as handle: text = handle.read() print(text[:200]) # 只看前 200 个字符 # 写：w 表示覆盖写，a 表示在末尾追加 with open(\"outputs/notes.txt\", \"w\", encoding=\"utf-8\") as handle: handle.write(\"第一行\\n第二行\\n\") 作用 ： 读写文件都要指定 encoding=\"utf-8\" ，否则中文在 Windows 上容易乱码。 读 CSV 这种表格数据时，用 pandas 更方便（见第 2 章）。 1.6 报错怎么读 # 报错最后一行才是\"错误类型 + 原因\"，先看它，再看它上面一行指出的是哪个文件哪一行 # 例： # File \"scripts\\05_time_features.py\", line 42 # df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24) # KeyError: 'hour' 作用 ： KeyError: 'hour' 意思是没有名为 hour 的列 —— 通常是你忘了先运行 04/05 脚本，或者列名拼错了。 详细对照表见第 10 章。 2. pandas 基础 对应脚本： scripts/02_pandas_basics.py ；对应教程： docs/03-pandas与SQLite.md 。 2.1 读 CSV import pandas as pd df = pd.read_csv(\"data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv\") "}, {"title": "交作业清单与报告模板", "type": "教程", "route": "#doc-homework", "text": "07 交作业清单与报告模板 这一课告诉你：做完项目后，到底要交什么、怎么组织、怎么写得像\"做过科研\"。 1. 交付清单 1.1 GitHub 仓库 [ ] 仓库名： time-series-feature-engineering [ ] 根目录有 README.md ，写清楚项目做什么、怎么运行； [ ] 有 requirements.txt ； [ ] 有 scripts/ 全部代码； [ ] 有 docs/ 教程文档（可选，但很加分）； [ ] 有 notes/学习笔记模板.md （已填写）； [ ] 有 notes/实验记录模板.md （已填写）； [ ] 有 outputs/figures/ 里的图（可以提交，也可以说明怎么生成）； [ ] .gitignore 里排除了 .venv/ 和原始大数据。 1.2 笔记 [ ] 每个特征都有：怎么构造、什么意思、预期作用、实验结果、结论； [ ] 至少写 5 个特征； [ ] 有\"踩坑记录\"：遇到过什么报错、怎么解决； [ ] 有实验记录：至少 3 组对照。 1.3 图表 [ ] 原始序列图； [ ] 滑动平均 + 差分图； [ ] 周期性图（小时/星期/月份）； [ ] 预测对比图； [ ] 周期编码圆； [ ] 相关性热力图。 每张图下面要能说出 2–3 句话，不要只贴图。 1.4 报告 [ ] 一页到两页； [ ] 包含：目标、数据、方法、特征、结果、结论、局限； [ ] 数字准确（和 CSV 对得上）； [ ] 结论具体（不要写\"效果不错\"这种空话）。 2. 一页报告模板（直接照着填） # 时序数据集特征工程实验报告 ## 1. 实验目标 本实验使用 ____ 数据集，目标是在时间 t 使用截至 t 的信息，预测 ____。 重点研究：时间特征、周期编码、滞后特征、滑动窗口特征对预测效果的影响。 ## 2. 数据 - 数据来源：UCI 北京 PM2.5 数据； - 时间范围：2010-01-01 至 2014-12-31，UTC，每小时一条，共 43824 条； - 目标列：pm2.5； - 缺失情况：pm2.5 缺失 2067 条（4.72%）； - 处理方式：保持完整小时时间轴；连续缺失不超过 6 小时的做线性插值； 长缺口保留 NaN；建模时按使用的特征删除无法计算的行。 ## 3. 方法 - 预测目标：t+1 时刻的 pm2.5； - 模型：线性回归（LinearRegression）； - 切分方式：按时间前 80% 训练，后 20% 测试； - 指标：MAE、RMSE、R²。 ## 4. 特征工程 | 特征组 | 具体特征 | 构造方法 | | --- | --- | --- | | 日历 | month、day、hour、dayofweek、is_weekend、dayofyear | 从 UTC 时间索引提取 | | 周期编码 | hour_sin/cos、dayofweek_sin/cos、month_sin/cos | sin(2πx/T)、cos(2πx/T) | | 滞后 | pm25_lag1/2/3/24/168、diff1、diff24 | shift(k)、diff(k) | | 滑动窗口 | roll24 的 mean/std/max/min、roll168 的 mean/std | rolling(window, min_periods) | | 天气 | TEMP、DEWP、PRES、Iws、Is、Ir | 原始列 + 少量滞后/滑窗 | 防泄漏措施： 1. 目标用 shift(-1)，特征只用 t 及更早的数据； 2. 滑动窗口使用 trailing window，不使用 center=True； 3. 训练/测试按时间切分，不随机打乱； 4. 所有插值和统计都不使用测试期未来信息。 ## 5. 实验结果 | 实验 | MAE | RMSE | R² | 是否可信 | | --- | --- | --- | --- | --- | | 平均值基线 | 64.740 | 82.470 | -0.0286 | 可信 | | 持续法基线 | 10.981 | 19.968 | 0.9397 | 可信 | | 只用原始时间特征 | 62.576 | 81.323 | -0.0002 | 可信 | | 只用周期编码时间 | 62.656 | 80.601 | 0.0175 | 可信 | | 周期编码 + 滞后 | 10.934 | 19.670 | 0.9415 | 可信 | | 完整正确版 | 10.754 | 19.473 | 0.9426 | 可信 | | 中心滑动窗口 | 10.413 | 18.112 | 0.9504 | 不可信（泄漏） | | 把答案当特征 | 0.000 | 0.000 | 1.0000 | 不可信（作弊） | | 随机切分 | 12.430 | 21.106 | 0.9494 | 不可信（方法错） | 消融实验： | 实验 | MAE | R² | 结论 | | --- | --- | --- | --- | | 完整特征 | 10.754 | 0.9426 | 基准 | | 去掉滞后 | 33.376 | 0.6892 | 滞后最重要 | | 去掉滑动窗口 | 10.804 | 0.9424 | 影响很小 | | 去掉天气 | 10.885 | 0.9417 | 影响很小 | | 只留时间特征 | 62.656 | 0.0175 | 远远不够 | ## 6. 结论 1. 只使用时间特征时，模型几乎无法预测下一小时的 PM2.5 （MAE 62.656，R² 0.0175），说明\"看钟表\"本身信息有限。 2. 持续法基线 MAE 10.981、R² 0.9397，说明 PM2.5 相邻小时高度相关。 3. 加入滞后特征后，MAE 从 62.656 降到 10.934，提升最大。 4. 在滞后特征基础上，滑动窗口和天气特征只带来小幅提升 （MAE 10.934 → 10.754）。 5. 周期编码在本实验中作用有限：R² 略升，但 MAE 没有明显下降。 6. 中心滑动窗口得分看起来更好（MAE 10.413），但它使用了未来数据， 属于数据泄漏；把答案当特征时 R²=1.0000，进一步说明\"异常好的分数\"要警惕。 ## 7. 局限与下一步 - 本实验只使用了线性回归，换用树模型结论可能不同； - 预测目标只有下一小时，预测 t+24 时滞后和滑窗的作用可能更明显； - 只做了单步预测，还没有做多步预测； - 下一步计划：尝试 HistGradientBoostingRegressor，预测 t+24， 并做滚动时间验证。 ## 8. 复现方式 ```powershell python -m venv .venv .\\.venv\\Scripts\\Activate.ps1 pip install -r requirements.txt .\\run_all.ps1 结果在 outputs/tables/09_model_comparison.csv 和 outputs/figures/ 。 ``` 3. 五分钟答辩/汇报怎么说 按这个顺序讲，不要念代码： 问题是什么 （30 秒） \"我要预测下一小时的 PM2.5。\" 数据怎么处理 （30 秒） \"43824 小时，UTC。保持完整时间轴，短缺口插值，长缺口保留。\" 我造了哪些特征 （1 分钟） \"三类：日历特征、周期编码、滞后和滑动窗口。\" 怎么防止用未来数据 （1 分钟） \"目标 shift(-1)；特征只用 t 及更早；按时间切分；不用 center=True。\" 结果是什么 （1 分钟） \"时间特征几乎没用，滞后特征提升最大，滑窗和天气小幅提升。\" 我踩了什么坑 （30 秒） \"一开始直接删缺失行，时间轴断了；后来改成保持完整小时轴。\" 下一步 （30 秒） \"预测 t+24，换树模型，做滚动验证。\" 如果老师问\"哪个特征最有用\"，回答： 在这份数据和这个任务里，当前值和 lag1 最有用。 证据是消融实验：去掉全部滞后特征后，MAE 从 10.754 变成 33.376。 滑动窗口和天气只带来约 0.1 的提升。 4. 最后的自检 交之前问自己： [ ] 我的 README 能让同学从零跑通吗？ [ ] 我的实验数字和 CSV 对得上吗？ [ ] 我有没有把 _leaky 特征写进\"正式模型\"？ [ ] 我的结论有没有过度夸大？ [ ] 我能不能解释每一个用到的特征？ [ ] 我有没有记录失败和踩坑？ 只要这 6 个问题都是\"是\"，这份作业就比大多数\"复制粘贴跑个分数\"的作业扎实得多。 祝顺利。遇到报错看 99-报错急救.md 。"}, {"title": "报错急救", "type": "教程", "route": "#doc-errors", "text": "99 报错急救：先在表里找，再决定要不要问人 0. 通用三步 看最后一行 ：错误类型 + 原因； 看文件名和行号 ：哪一行代码出错； 看上下文 ：出错前运行了什么命令、数据文件存在吗。 不要一看到红字就关掉终端。Python 的报错其实是在告诉你哪里出了问题。 1. 环境类错误 'python' 不是内部或外部命令 原因 ：没装 Python，或者安装时没勾选 \"Add Python to PATH\"。 解决 ： 重新安装 Python，勾选 \"Add python.exe to PATH\"； 或者用 py --version 试试； 装完重开 PowerShell。 虚拟环境激活失败： Activate.ps1 cannot be loaded because running scripts is disabled 解决 ： Set-ExecutionPolicy -Scope Process Bypass .\\.venv\\Scripts\\Activate.ps1 ModuleNotFoundError: No module named 'pandas' 原因 ：没装库，或者没激活虚拟环境。 解决 ： .\\.venv\\Scripts\\Activate.ps1 pip install -r requirements.txt 如果提示 pip 不是命令，用： python -m pip install -r requirements.txt pip 下载很慢或超时 换国内镜像： python -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple 2. 文件类错误 FileNotFoundError: [Errno 2] No such file or directory: ... 原因 ：文件不存在，或者你在错误的文件夹运行脚本。 解决 ： 用 Get-Location 确认在项目根目录； 先运行生成数据的上一个脚本： python scripts\\download_data.py python scripts\\04_load_clean.py python scripts\\05_time_features.py python scripts\\08_lag_rolling_features.py 注意脚本的运行顺序： download_data → 04 → 05 → 06/07/08 → 09 → 10 UnicodeDecodeError 原因 ：文件编码不是 UTF-8。 解决 ：本项目读写 CSV 时统一用： pd.read_csv(path, encoding=\"utf-8-sig\") df.to_csv(path, index=False, encoding=\"utf-8-sig\") 终端中文乱码 chcp 65001 [Console]::OutputEncoding = [System.Text.Encoding]::UTF8 $env:PYTHONIOENCODING = \"utf-8\" 然后重新运行脚本。 PermissionError: [Errno 13] Permission denied 原因 ：文件被 Excel/WPS 打开着，或者没有写权限。 解决 ：关闭正在打开该 CSV/图片的软件，再运行脚本。 3. pandas 类错误 KeyError: 'pm2.5' 原因 ：列名写错了，或者数据没有读对。 解决 ： print(df.columns.tolist()) 把列名打印出来，一个一个对照。注意大小写和空格： pm2.5 和 pm25 不是一回事； TEMP 和 temp 不是一回事。 SettingWithCopyWarning 原因 ：你对一个\"切片\"做修改，pandas 不确定你改的是原表还是副本。 解决 ：在筛选后加 .copy() ： subset = df[df[\"pm2.5\"] > 100].copy() subset[\"new_col\"] = 1 ValueError: Input contains NaN 原因 ：模型不允许特征里有缺失值。 解决 ：在训练前明确处理： df = df.dropna(subset=feature_columns + [\"target\"]) 或者填补： df[feature_columns] = df[feature_columns].fillna(df[feature_columns].median()) 但要注意：用中位数/均值填补时，只能从训练集算统计量，不能用测试集。 ValueError: could not convert string to float 原因 ：特征里有字符串列，例如 cbwd （风向）。 解决 ：要么删掉这列，要么做独热编码： df = pd.get_dummies(df, columns=[\"cbwd\"], drop_first=True) 关于 NaN 的一个提醒 NaN （Not a Number）表示缺失值。它和 0 完全不同： 0 是\"知道它等于 0\"； NaN 是\"不知道它等于多少\"。 不要把 NaN 直接改成 0 就完事，除非你确定 0 有物理意义。 4. 时间序列特有错误 shift 之后出现一堆 NaN 原因 ：shift 会让开头几行没有值，这是正常的。例如 shift(168) 前 168 行都是 NaN。 解决 ：在建模前按用到的特征删除： df = df.dropna(subset=[\"pm25_lag168\", \"pm25_roll168_mean\", \"pm25_next\"]) 删缺失行之后，lag24 不是 24 小时前 原因 ：删行让时间轴断了。 解决 ：保持完整小时时间轴： df = df.set_index(\"datetime\").sort_index().asfreq(\"h\") 短缺口插值，长缺口保留 NaN，建模时再删除无法计算的行。 模型分数高得离谱（R² > 0.99） 第一反应 ：检查数据泄漏。 特征里有没有 shift(-1) 、 center=True ； 有没有把目标列本身当特征； 有没有先在全量数据上算统计量再切分； 有没有随机切分时间序列。 本项目的 _leaky 特征就是反面教材，千万不要放进正式模型。 rolling 结果前面全是 NaN 原因 ：窗口还没凑满。例如 rolling(24) 前 23 行都是 NaN。 解决 ：这是正常现象。可以用 min_periods 放宽，但要写清楚理由： df[\"roll24_mean\"] = df[\"pm2.5\"].rolling(24, min_periods=18).mean() 5. sklearn 类错误 ValueError: Found input variables with inconsistent numbers of samples 原因 ：X 和 y 的行数不一样。 解决 ：打印行数： print(x_train.shape, y_train.shape) print(x_test.shape, y_test.shape) 确保它们都来自同一个 train / test 表。 ValueError: Expected 2D array, got 1D array instead 原因 ：sklearn 的模型要求 X 是二维表格（很多列），不是一维 Series。 解决 ： x_train = train[[\"pm25_lag1\"]] # 注意双层方括号 模型分数是负数 R² 负数表示模型比\"永远猜平均值\"还差。常见原因： 特征没有信息； 数据泄漏或切分错误； 训练集和测试集分布差异太大； 有极端异常值。 先回到基线：你的模型有没有打赢\"平均值\"和\"持续法\"？ 6. Git / GitHub 类错误 fatal: not a git repository 原因 ：当前文件夹没有初始化 Git。 解决 ： cd 正确的项目文件夹 git init git push 提示 rejected / fetch first 原因 ：GitHub 上的版本比本地新。 解决 （确保本地修改已提交）： git pull --rebase origin main git push remote origin already exists 原因 ：已经加过远程地址了。 解决 ： git remote -v git remote set-url origin https://github.com/你的用户名/仓库名.git 推不上去，要输密码 GitHub 现在不支持账号密码，要用 Personal Access Token（PAT）。 看 01-环境与工具.md 的 5.4 节。 7. 什么时候该问人 自己尝试 3 次（每次换一种思路）还不行，就可以问。问的时候一次给全： 1. 我运行了什么命令： python scripts\\09_model_comparison.py 2. 完整报错（最后 15 行）： （粘贴） 3. 我已经试过： - 确认激活了 .venv - 重新跑了 08 - 删掉了 __pycache__ 4. 我的环境： Windows 11 / Python 3.14 / pandas 3.0.6 不要只发一句\"为什么报错\"，那样别人很难帮你。 8. 最后的心理建设 报错是正常的，程序员每天都在看报错； 报错不"}, {"title": "学习笔记模板", "type": "笔记", "route": "#doc-note-feature", "text": "时序特征工程学习笔记 用法：每学一个特征，就复制下面一张表，填满。 这份笔记最后可以直接交给导师，证明你不仅跑了代码，而且知道每个特征在干什么。 0. 基本信息 姓名： 数据来源：UCI 北京 PM2.5 数据（2010-01-01 至 2014-12-31，每小时一条，UTC） 预测任务：站在时间 t，预测 t+1 时刻的 PM2.5 训练/测试切分：按时间前 80% 训练，后 20% 测试 1. 特征笔记（每个特征一张表） 示例：hour（小时） 项目 内容 特征名 hour 怎么构造 df.index.hour ，取值 0-23 一句话含义 这条记录发生在一天中的第几个小时 我期望它有什么用 捕捉早晚高峰：不同小时的 PM2.5 平均水平可能不同 实验证据 第 5 课按小时求平均，发现不同小时均值不同（填具体数值） 结论 保留 / 不保留 / 不确定（写理由） 示例：hour_sin、hour_cos（小时周期编码） 项目 内容 特征名 hour_sin, hour_cos 怎么构造 sin(2*pi*hour/24) , cos(2*pi*hour/24) 一句话含义 把 0-23 点到圆上，让 23 点和 0 点变成邻居 我期望它有什么用 让线性模型理解“一天是循环的”，而不是把小时当成一条直线 实验证据 第 7 课对比：原始数字时间的 MAE = _，周期编码 MAE = _ 结论 保留 / 不保留 / 不确定（写理由） 示例：pm25_lag24（滞后 24 小时） 项目 内容 特征名 pm25_lag24 怎么构造 df[\"pm2.5\"].shift(24) 一句话含义 昨天同一小时的 PM2.5 我期望它有什么用 污染有日周期，昨天同一时刻的值可能和今天相近 实验证据 第 9 课消融实验：去掉全部滞后后 MAE 从 _ 变成 _ 结论 保留 / 不保留 / 不确定（写理由） 示例：pm25_roll24_mean（24 小时滑动平均） 项目 内容 特征名 pm25_roll24_mean 怎么构造 df[\"pm2.5\"].rolling(24, min_periods=24).mean() 一句话含义 过去 24 小时（含当前小时）的平均污染水平 我期望它有什么用 单个小时会抖，平均值能反映近期整体水平 实验证据 第 9 课对比：去掉滑动窗口后 MAE = ____ 结论 保留 / 不保留 / 不确定（写理由） 轮到你了：自己写 5 个特征 复制上面的表格，至少完成这些特征： [ ] month / month_sin / month_cos [ ] dayofweek / dayofweek_sin / dayofweek_cos [ ] is_weekend [ ] pm25_lag1 [ ] pm25_lag168 [ ] pm25_roll24_std [ ] pm25_diff1 [ ] TEMP_lag1 2. 我踩过的坑（很重要） 日期 报错/问题 原因 怎么解决 3. 一句话总结 用三句话向一个完全不懂的同学解释： 时间戳本身不能直接喂给模型，要拆成年、月、日、小时、星期等数字。 周期特征（sin/cos）解决“23 点之后又回到 0 点”的问题。 滞后和滑动窗口提供“过去发生了什么”，但绝不能包含“未来会发生什么”。"}, {"title": "实验记录模板", "type": "笔记", "route": "#doc-note-experiment", "text": "实验记录 实验设置 项目 内容 数据集 UCI 北京 PM2.5 时间范围 2010-01-01 至 2014-12-31（UTC，每小时） 预测目标 t+1 时刻的 pm2.5 模型 线性回归（LinearRegression） 训练/测试 按时间前 80% / 后 20% 评价指标 MAE、RMSE、R2 实验 1：特征组对比 把 outputs/tables/09_model_comparison.csv 的数字抄进来，再写自己的解读。 实验 特征 切分方式 MAE RMSE R2 是否可信 我的解读 平均值基线 无 按时间 8:2 可信 持续法基线 当前 pm2.5 按时间 8:2 可信 只用原始时间特征 month/day/hour... 按时间 8:2 可信 只用周期编码时间 sin/cos 按时间 8:2 可信 周期编码 + 滞后 + lag/diff 按时间 8:2 可信 完整正确版 + 滑动 + 天气 按时间 8:2 可信 中心滑动窗口 包含未来值 按时间 8:2 不可信 把答案当特征 作弊 按时间 8:2 不可信 随机切分 完整特征 随机 8:2 不可信 实验 2：消融实验（拿掉一组特征会怎样） 实验 特征个数 MAE RMSE R2 我的解读 完整特征 去掉滞后 去掉滑动窗口 去掉天气 只留时间特征 实验结论模板 和只用时间特征相比，加入滞后特征后 MAE 从 _ 降到 _，说明：____。 滑动窗口特征的加入有没有进一步提升？证据是：____。 天气特征的表现如何？____。 我观察到一个“假高分”： _，它的原因是数据泄漏，具体泄漏方式是： _。 如果重做一次，我会优先改进：____。"}, {"title": "下载数据集", "type": "脚本", "route": "#script-download", "text": "下载 UCI 北京 PM2.5 数据；网络失败时自动生成结构相同的模拟数据。 python scripts\\download_data.py \"\"\"下载教程使用的数据集。\n\n数据集：北京 PM2.5 数据（UCI Machine Learning Repository）\n- 时间范围：2010-01-01 到 2014-12-31\n- 频率：每小时一条，共 43824 条\n- 时区：UTC（正好符合“时间戳统一 UTC”的要求）\n- 目标列：pm2.5（PM2.5 浓度，单位微克/立方米）\n\n如果学校网络下载失败，脚本会自动生成一份“结构一模一样的模拟数据”，\n保证后面的课程仍然能跑通。模拟数据会在终端明确标注。\n\n运行：python scripts/download_data.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport io\nimport shutil\nimport urllib.request\nimport zipfile\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\nRAW_DIR = PROJECT_ROOT / \"data\" / \"raw\" / \"beijing_pm25\"\nTARGET_CSV = RAW_DIR / \"PRSA_data_2010.1.1-2014.12.31.csv\"\nZIP_URL = \"https://archive.ics.uci.edu/static/public/381/beijing+pm2+5+data.zip\"\n\n\ndef download_from_uci() -> bool:\n    \"\"\"从 UCI 官方地址下载。成功返回 True，失败返回 False。\"\"\"\n    print(f\"正在下载：{ZIP_URL}\")\n    try:\n        with urllib.request.urlopen(ZIP_URL, timeout=90) as response:\n            content = response.read()\n\n        with zipfile.ZipFile(io.BytesIO(content)) as zf:\n            csv_names = [n for n in zf.namelist() if n.lower().endswith(\".csv\")]\n            if not csv_names:\n                print(\"压缩包里没有 CSV 文件。\")\n                return False\n            with zf.open(csv_names[0]) as src, open(TARGET_CSV, \"wb\") as dst:\n                shutil.copyfileobj(src, dst)\n\n        print(f\"下载成功：{TARGET_CSV}\")\n        return True\n    except Exception as exc:  # noqa: BLE001 - 新手教程，任何网络错误都走备用方案\n        print(f\"下载失败：{type(exc).__name__}: {exc}\")\n        return False\n\n\ndef make_fake_data() -> None:\n    \"\"\"生成一份结构相同的模拟数据，仅在真实数据下载失败时使用。\"\"\"\n    print(\"\\n改用模拟数据（真实数据下载失败时的备用方案）。\")\n\n    rng = np.random.default_rng(42)\n    times = pd.date_range(\"2010-01-01\", \"2014-12-31 23:00\", freq=\"h\")\n    n = len(times)\n    hour = times.hour.to_numpy()\n    day_of_year = times.dayofyear.to_numpy()\n    weekday = times.dayofweek.to_numpy()\n\n    # 一个简单的“像真的”PM2.5：冬季更高 + 早晚双高峰 + 随机波动\n    season = 45 * np.cos(2 * np.pi * (day_of_year - 15) / 365.25)\n    daily = 25 * np.sin(2 * np.pi * (hour - 7) / 24) + 18 * np.sin(\n        2 * np.pi * (hour - 18) / 12\n    )\n    weekly = -8 * (weekday >= 5)\n\n    noise = np.zeros(n)\n    for i in range(1, n):\n        noise[i] = 0.82 * noise[i - 1] + rng.normal(0, 9)\n\n    pm25 = np.clip(85 + season + daily + weekly + noise, 2, None)\n    pm25[rng.random(n) < 0.045] = np.nan  # 故意制造一些缺失值，方便练习清洗\n\n    temperature = 14 - 15 * np.cos(2 * np.pi * (day_of_year - 15) / 365.25) + rng.normal(0, 3, n)\n    dew_point = temperature - rng.uniform(2, 15, n)\n    pressure = 1012 + 10 * np.c"}, {"title": "01 Python 基础", "type": "脚本", "route": "#script-python-basics", "text": "列表、字典、deque 队列、函数、文件读写、循环和条件。 python scripts\\01_python_basics.py \"\"\"第 1 课：Python 零基础速通。\n\n这一课只讲后面做特征工程一定会用到的 6 样东西：\n1. 变量和列表 list\n2. 字典 dict\n3. 队列 deque\n4. 函数 def\n5. 文件读写\n6. 循环和条件\n\n运行：python scripts/01_python_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import deque\n\nfrom common import TABLES_DIR, print_step, print_title\n\n\n# ---------------------------------------------------------------------------\n# 1. 列表 list：一排有顺序的数据\n# ---------------------------------------------------------------------------\ndef lesson_list() -> None:\n    print_step(\"1. 列表 list：就像一排储物柜，每个格子有编号\")\n\n    # 注意：Python 的编号从 0 开始，不是从 1 开始。\n    temperatures = [11.0, 12.5, 10.8, 9.6, 13.2]\n    print(\"原始列表：\", temperatures)\n    print(\"第 1 个元素 temperatures[0] =\", temperatures[0])\n    print(\"最后 1 个元素 temperatures[-1] =\", temperatures[-1])\n    print(\"前 3 个元素 temperatures[:3] =\", temperatures[:3])\n\n    temperatures.append(14.0)\n    print(\"append(14.0) 之后：\", temperatures)\n    print(\"最大值 =\", max(temperatures), \"  平均值 =\", sum(temperatures) / len(temperatures))\n\n\n# ---------------------------------------------------------------------------\n# 2. 字典 dict：用名字找值，就像通讯录\n# ---------------------------------------------------------------------------\ndef lesson_dict() -> None:\n    print_step(\"2. 字典 dict：用名字（键）找值\")\n\n    row = {\n        \"city\": \"南京\",\n        \"date\": \"2026-10-08\",\n        \"temperature\": 22.5,\n        \"is_weekend\": False,\n    }\n    print(\"一整条记录：\", row)\n    print('row[\"temperature\"] =', row[\"temperature\"])\n\n    row[\"weather\"] = \"多云\"  # 新增一个键\n    row[\"temperature\"] = 23.1  # 修改已有的键\n    print(\"修改后：\", row)\n\n    for key, value in row.items():\n        print(f\"  {key} -> {value}\")\n\n\n# ---------------------------------------------------------------------------\n# 3. 队列 deque：只保留最近 N 个值，天然适合“滑动窗口”\n# ---------------------------------------------------------------------------\ndef lesson_queue() -> None:\n    print_step(\"3. 队列 deque：进门排队，先来先走；只留最近 3 个数\")\n\n    window = deque(maxlen=3)\n    hourly_pm25 = [80, 75, 90, 120, 110, 95]\n\n    for hour, value in enumerate(hourly_pm25):\n        window.append(value)\n        average = sum(window) / len(window)\n        print(f\"第 {hour} 小时 PM2.5={value:>3}，窗口={list(window)}，窗口均值={average:.1f}\")\n\n    print(\"\\n这就是“滑动窗口”：每一步丢掉最老的数，加入最新的数，再算统计量。\")\n\n\n# ---------------------------------------------------------------------------\n# 4. 函数 def：把一段代码打包，起个名字反复用\n# ---------------------------------------------------------------------------\ndef c_to_f(celsius: float) -> float:\n    \"\"\"把摄氏度换成华氏度。\"\"\"\n    return celsius * 9 / 5 + 32\n\n\ndef l"}, {"title": "02 pandas 基础", "type": "脚本", "route": "#script-pandas-basics", "text": "DataFrame、选列、筛行、groupby、datetime、读真实 CSV。 python scripts\\02_pandas_basics.py \"\"\"第 2 课：pandas 基础。\n\npandas 是 Python 处理表格数据的工具。你可以把它想成“用代码操作的 Excel”。\n最重要的两个概念：\n- Series：一列数据\n- DataFrame：一张表格（很多列）\n\n运行：python scripts/02_pandas_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom common import PROCESSED_DIR, load_raw_data, print_step, print_title\n\n\ndef describe_dataframe() -> pd.DataFrame:\n    \"\"\"手动造一张小表，先认识 DataFrame 长什么样。\"\"\"\n    print_step(\"1. 手动造一张表：3 天的天气记录\")\n\n    df = pd.DataFrame(\n        {\n            \"date\": [\"2026-10-01\", \"2026-10-02\", \"2026-10-03\"],\n            \"city\": [\"南京\", \"南京\", \"南京\"],\n            \"temperature\": [28.0, 31.5, 24.0],\n            \"rain_mm\": [0.0, 12.5, 3.2],\n        }\n    )\n\n    print(df)\n    print(\"\\n形状（行数, 列数）：\", df.shape)\n    print(\"列名：\", df.columns.tolist())\n    print(\"\\n每一列的类型：\")\n    print(df.dtypes)\n    print(\"\\n数值列的统计：\")\n    print(df.describe())\n    return df\n\n\ndef select_and_filter(df: pd.DataFrame) -> None:\n    print_step(\"2. 选列、筛选行、加新列\")\n\n    print('只选一列 df[\"temperature\"]：')\n    print(df[\"temperature\"])\n\n    print(\"\\n只选两列：\")\n    print(df[[\"date\", \"temperature\"]])\n\n    print(\"\\n筛选出下雨超过 5 毫米的行：\")\n    rainy = df[df[\"rain_mm\"] > 5]\n    print(rainy)\n\n    df[\"is_rainy\"] = df[\"rain_mm\"] > 0\n    df[\"temp_f\"] = df[\"temperature\"] * 9 / 5 + 32\n    print(\"\\n新增两列后：\")\n    print(df)\n\n\ndef groupby_demo() -> None:\n    print_step(\"3. groupby：把数据分组后再算统计量\")\n\n    bigger = pd.DataFrame(\n        {\n            \"city\": [\"南京\", \"南京\", \"北京\", \"北京\", \"上海\"],\n            \"temperature\": [28.0, 31.5, 22.0, 20.5, 26.0],\n        }\n    )\n    print(bigger)\n    print(\"\\n按城市求温度平均值：\")\n    print(bigger.groupby(\"city\")[\"temperature\"].mean())\n\n\ndef datetime_demo() -> None:\n    print_step(\"4. 时间列：字符串 -> datetime -> 拆出年月日时\")\n\n    stamps = pd.Series([\"2026-10-08 08:00:00\", \"2026-10-08 09:00:00\", \"2026-10-09 00:00:00\"])\n    dt = pd.to_datetime(stamps)\n\n    print(\"原来的字符串：\")\n    print(stamps)\n    print(\"\\n变成 datetime 后：\")\n    print(dt)\n\n    result = pd.DataFrame(\n        {\n            \"datetime\": dt,\n            \"year\": dt.dt.year,\n            \"month\": dt.dt.month,\n            \"day\": dt.dt.day,\n            \"hour\": dt.dt.hour,\n            \"weekday\": dt.dt.dayofweek,  # 0=周一, 6=周日\n            \"is_weekend\": dt.dt.dayofweek >= 5,\n        }\n    )\n    print(\"\\n拆出来的时间特征：\")\n    print(result)\n\n\ndef read_real_csv() -> None:\n    print_step(\"5. 读真正的 CSV：北京 PM2.5 原始数据\")\n\n    df = load_raw_data()\n    print(\"形状（行数, 列数）：\", df.shape)\n    print(\"\\n前 5 行：\")\n    print(df.head().to_string(index=False))\n    print(\"\\n每列缺多少个值：\")\n    print(df.isna().sum"}, {"title": "03 SQLite 基础", "type": "脚本", "route": "#script-sqlite-basics", "text": "建表、增删改查、主键、索引，全部用 Python 自带的 sqlite3。 python scripts\\03_sqlite_basics.py \"\"\"第 3 课：SQLite 数据库基础（Python 自带，零配置）。\n\n你要掌握的 4 个动作：\n- 增：INSERT\n- 删：DELETE\n- 改：UPDATE\n- 查：SELECT\n\n外加两个重要概念：\n- 主键 PRIMARY KEY：每一行的唯一身份证，不允许重复\n- 索引 INDEX：像书的目录，查得更快\n\n运行：python scripts/03_sqlite_basics.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sqlite3\n\nfrom common import PROCESSED_DIR, print_step, print_title\n\nDB_PATH = PROCESSED_DIR / \"practice.db\"\n\n\ndef create_table(conn: sqlite3.Connection) -> None:\n    print_step(\"1. 建表：CREATE TABLE（id 是主键）\")\n\n    sql = \"\"\"\n    CREATE TABLE IF NOT EXISTS weather_notes (\n        id      INTEGER PRIMARY KEY,   -- 唯一身份证，不能重复\n        city    TEXT    NOT NULL,\n        date    TEXT    NOT NULL,\n        temp    REAL,\n        note    TEXT\n    )\n    \"\"\"\n    conn.execute(sql)\n    conn.commit()\n    print(\"表 weather_notes 已创建。\")\n    print(\"字段：id（主键）, city, date, temp, note\")\n\n\ndef insert_rows(conn: sqlite3.Connection) -> None:\n    print_step(\"2. 增：INSERT 插入数据\")\n\n    rows = [\n        (1, \"Nanjing\", \"2026-10-01\", 28.0, \"sunny\"),\n        (2, \"Nanjing\", \"2026-10-02\", 31.5, \"hot\"),\n        (3, \"Beijing\", \"2026-10-01\", 22.0, \"cloudy\"),\n        (4, \"Shanghai\", \"2026-10-03\", 26.0, \"rainy\"),\n    ]\n    conn.executemany(\n        \"INSERT OR REPLACE INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\",\n        rows,\n    )\n    conn.commit()\n    print(f\"插入了 {len(rows)} 行。注意 SQL 里的 ? 是占位符，防止拼字符串出错。\")\n\n\ndef select_rows(conn: sqlite3.Connection) -> None:\n    print_step(\"3. 查：SELECT 查询数据\")\n\n    print(\"查询全部（按 id 排序）：\")\n    for row in conn.execute(\"SELECT id, city, date, temp, note FROM weather_notes ORDER BY id\"):\n        print(\"  \", row)\n\n    print(\"\\n只查南京的记录：\")\n    for row in conn.execute(\"SELECT * FROM weather_notes WHERE city = ?\", (\"Nanjing\",)):#必须为元组\n        print(\"  \", row)\n\n    print(\"\\n每个城市有几条记录（GROUP BY）：\")\n    for row in conn.execute(\n        \"SELECT city, COUNT(*) AS n FROM weather_notes GROUP BY city ORDER BY n DESC\"\n    ):\n        print(\"  \", row)\n\n\ndef update_row(conn: sqlite3.Connection) -> None:\n    print_step(\"4. 改：UPDATE 修改数据\")\n\n    conn.execute(\"UPDATE weather_notes SET temp = ?, note = ? WHERE id = ?\", (29.5, \"updated\", 1))\n    conn.commit()\n    print(\"把 id=1 的温度改成 29.5：\")\n    print(\"  \", conn.execute(\"SELECT * FROM weather_notes WHERE id = 1\").fetchone())\n\n\ndef delete_row(conn: sqlite3.Connection) -> None:\n    print_step(\"5. 删：DELETE 删除数据（只删 id=4）\")\n\n    conn.execute(\"DELETE FROM weather_notes WHERE id = ?\", (4,))\n    conn.commit()\n    remaining = conn.execute(\"SELECT COUNT(*) FROM weather_notes\").fetchon"}, {"title": "04 加载与清洗", "type": "脚本", "route": "#script-load-clean", "text": "拼 UTC 时间、排序、检查重复和缺失、保持完整小时时间轴。 python scripts\\04_load_clean.py \"\"\"第 4 课：把原始 CSV 清洗成能建模的数据。\n\n做完这一步，你会得到 data/processed/pm25_clean.csv，它满足：\n1. 时间列是真正的 datetime，不是字符串；\n2. 时间统一标成 UTC；\n3. 按时间从早到晚排好序；\n4. 没有重复时间戳；\n5. 保持完整的“每小时一行”；短缺失插值，长缺失保留为空。\n\n运行：python scripts/04_load_clean.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_raw_data,\n    print_step,\n    print_title,\n)\n\nOUT_CSV = PROCESSED_DIR / \"pm25_clean.csv\"\nREPORT_TXT = TABLES_DIR / \"04_cleaning_report.txt\"\n\n\ndef build_utc_datetime(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 把 年/月/日/小时 四列拼成一个 UTC 时间列\")\n\n    print(\"原始数据里的时间是这样分开存的：\")\n    print(df[[\"year\", \"month\", \"day\", \"hour\"]].head(3).to_string(index=False))\n\n    # pd.to_datetime 可以把多列拼成时间；tz_localize(\"UTC\") 表示“这个时间本来就是 UTC”。\n    dt = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]])\n    df = df.copy()\n    df[\"datetime\"] = dt.dt.tz_localize(\"UTC\")\n\n    print(\"\\n拼好以后：\")\n    print(df[[\"datetime\", \"pm2.5\", \"TEMP\"]].head(3).to_string(index=False))\n    print(f\"\\n时间范围：{df['datetime'].min()} 到 {df['datetime'].max()}\")\n    return df\n\n\ndef sort_and_check(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 排序 + 检查重复 + 检查有没有漏掉整点\")\n\n    df = df.set_index(\"datetime\").sort_index()\n    # asfreq(\"h\") 保证时间轴是“每个整点一行”。如果有漏掉的整点，会补一行 NaN，\n    # 这样后面的 shift(24) 才真的表示 24 小时前，而不是“往前数 24 行”。\n    df = df.asfreq(\"h\")\n\n    duplicate_count = int(df.index.duplicated().sum())\n    print(f\"重复的时间戳数量：{duplicate_count}\")\n\n    expected = pd.date_range(df.index.min(), df.index.max(), freq=\"h\")\n    missing_timestamps = len(expected) - len(df)\n    print(f\"应该有的小时数：{len(expected)}\")\n    print(f\"实际有的行数：{len(df)}\")\n    print(f\"中间漏掉的时间戳数量：{missing_timestamps}\")\n\n    if duplicate_count == 0 and missing_timestamps == 0:\n        print(\"结论：时间轴完整且没有重复，可以做滞后和滑动窗口。\")\n    else:\n        print(\"注意：时间轴不完整！后面的 lag/rolling 需要先补齐时间轴。\")\n\n    return df\n\n\ndef handle_missing_pm25(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"3. 处理缺失值（重点是目标列 pm2.5）\")\n\n    missing_before = int(df[\"pm2.5\"].isna().sum())\n    print(f\"pm2.5 缺失数量：{missing_before} / {len(df)} （{missing_before / len(df):.2%}）\")\n\n    df = df.copy()\n    # 留一个“这个值原本是不是缺失”的标记，之后可以研究缺失是否和污染有关。\n    df[\"pm25_was_missing\"] = df[\"pm2.5\"].isna().astype(int)\n\n    # 时间序列常用做法：用前后时刻线性插值。\n    # limit=6 表示“最多连续补 6 个小时”，补不了的宁可按缺失处理。\n    df[\"pm2.5\"] = df[\"pm2.5\"].interpolate(method=\"linear\", limit=6, limit_direction=\"both\")\n\n    missing_after = int(df[\"pm2.5\"].isna().sum())\n    print(f\"短缺口插值后还缺：{missing_after}（占 {missing_after / len(df):.2%"}, {"title": "05 时间特征提取", "type": "脚本", "route": "#script-time-features", "text": "年、月、日、星期、小时、是否周末，以及 sin/cos 周期编码。 python scripts\\05_time_features.py \"\"\"第 5 课：从时间戳里拆出模型能用的特征。\n\n这一课对应导师要求 2.3：年、月、日、星期、小时、是否周末。\n另外还加上“周期编码”：用 sin/cos 告诉模型“23 点和 0 点是挨着的”。\n\n运行：python scripts/05_time_features.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import PROCESSED_DIR, TABLES_DIR, load_clean_data, print_step, print_title\n\nOUT_CSV = PROCESSED_DIR / \"pm25_time_features.csv\"\nDICT_CSV = TABLES_DIR / \"05_feature_dictionary.csv\"\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef add_calendar_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 拆出年、月、日、星期、小时、是否周末\")\n\n    df = df.copy()\n    index = df.index\n\n    df[\"year\"] = index.year\n    df[\"month\"] = index.month\n    df[\"day\"] = index.day\n    df[\"hour\"] = index.hour\n    df[\"dayofweek\"] = index.dayofweek  # 0=周一, 6=周日\n    df[\"weekday_name\"] = index.dayofweek.map(lambda x: WEEKDAY_NAMES[x])\n    df[\"is_weekend\"] = (index.dayofweek >= 5).astype(int)\n    df[\"dayofyear\"] = index.dayofyear\n    df[\"weekofyear\"] = index.isocalendar().week.to_numpy()\n    df[\"quarter\"] = index.quarter\n\n    print(\"新增了：year, month, day, hour, dayofweek, weekday_name, is_weekend, dayofyear, weekofyear, quarter\")\n    print(\"注意：这份数据的时间戳是 UTC。北京本地时间 = UTC + 8；\"\n          \"如果你想看北京作息，可以再算 (hour + 8) % 24。本教程保持 UTC 统一。\")\n    print(\"\\n随机看 5 行：\")\n    columns = [\"pm2.5\", \"year\", \"month\", \"day\", \"hour\", \"dayofweek\", \"weekday_name\", \"is_weekend\"]\n    print(df[columns].sample(5, random_state=42).sort_index().to_string())\n    return df\n\n\ndef add_cyclic_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 周期编码：把小时、星期、月份变成圆上的坐标\")\n\n    df = df.copy()\n\n    # 为什么小时用 24、星期用 7、月份用 12？\n    # 因为它们在各自的周期结束后会“回到开头”。\n    df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\n    df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n\n    df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n\n    df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12)\n    df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12)\n\n    print(\"新增了：hour_sin, hour_cos, dayofweek_sin, dayofweek_cos, month_sin, month_cos\")\n    print(\"\\n看几个关键时刻，体会 23 点和 0 点在圆上是挨着的：\")\n    demo = pd.DataFrame(\n        {\n            \"hour\": [0, 1, 6, 12, 18, 22, 23],\n        }\n    )\n    demo[\"hour_sin\"] = np.sin(2 * np.pi * demo[\"hour\"] / 24)\n    demo[\"hour_cos\"] = np.cos(2 * np.pi * demo[\"hour\"] / 24)\n    print(demo.to_string(index=False))\n    return df\n\n\ndef save_feature_dictionary() -> None:\n    print_step(\"3. 保存“"}, {"title": "06 基线模型", "type": "脚本", "route": "#script-baseline", "text": "平均值基线 vs 线性回归；按时间前 80% 训练、后 20% 测试。 python scripts\\06_baseline_model.py \"\"\"第 6 课：第一个基线模型（线性回归）。\n\n任务：用“现在这个小时的时间信息”，预测“下一个小时的 PM2.5”。\n\n这一课的重点不是分数高不高，而是把整套流程跑通：\n- 目标 y 是什么\n- 特征 X 是什么\n- 怎么切分训练集/测试集（时序数据必须按时间切）\n- MAE、RMSE、R2 怎么看\n\n运行：python scripts/06_baseline_model.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.dummy import DummyRegressor\nfrom sklearn.linear_model import LinearRegression\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_time_features,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"06_baseline_results.csv\"\nPRED_CSV = TABLES_DIR / \"06_baseline_predictions.csv\"\n\n# 只允
