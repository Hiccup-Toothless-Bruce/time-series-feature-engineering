许用“预测时刻已经知道/能算出来”的列。\n# 例如现在的 month/hour 是可以知道的；pm2.5 下一个小时的值不能拿来当特征。\nTIME_FEATURES = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\n\n\ndef build_target(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 构造目标 y：下一个小时的 pm2.5\")\n\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n\n    print(\"shift(-1) 的意思是“把整列往上提一行”：\")\n    demo = df[[\"pm2.5\", \"pm25_next\"]].head(4)\n    print(demo.to_string())\n    print(\"\\n看第 1 行：现在是 80，下一小时是 75，所以 pm25_next=75。\")\n    print(\"最后一行没有“下一个小时”，所以最后一个是 NaN，待会要删掉。\")\n\n    # 最后一行没有未来目标，删掉；特征有缺失的也删掉。\n    return df.dropna(subset=[\"pm25_next\"] + TIME_FEATURES)\n\n\ndef chronological_split(df: pd.DataFrame, train_ratio: float = 0.8) -> tuple[pd.DataFrame, pd.DataFrame]:\n    print_step(\"2. 按时间切分：前 80% 训练，后 20% 测试\")\n\n    split_index = int(len(df) * train_ratio)\n    train = df.iloc[:split_index].copy()\n    test = df.iloc[split_index:].copy()\n\n    print(f\"训练集：{len(train)} 行，时间 {train.index.min()} 到 {train.index.max()}\")\n    print(f\"测试集：{len(test)} 行，时间 {test.index.min()} 到 {test.index.max()}\")\n    print(\"为什么不能随机切分？因为随机切分会把未来的数据混进训练集（考试漏题）。\")\n    return train, test\n\n\ndef evaluate(name: str, y_true: pd.Series, y_pred: np.ndarray, results: list[dict]) -> None:\n    metrics = regression_metrics(y_true, y_pred)\n    print(\n        f\"{name:<24} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\"\n    )\n    results.append(\n        {\n            \"模型\": name,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n        }\n    )\n\n\ndef main() -> None:\n    print_title(\"第 6 课：线性回归基线模型\")\n\n    df = load_time_features()\n    df = build_target(df)\n    train, test = chronological_split(df)\n\n    x_train = train[TIME_FEATURES]\n    x_test = test[TIME_FEATURES]\n    y_train = train[\"pm25_next\"]\n    y_test = test[\"pm25_ne"}, {"title": "07 周期编码对照", "type": "脚本", "route": "#script-cyclic", "text": "只改特征写法：原始小时/星期 vs sin/cos 周期编码。 python scripts\\07_cyclic_encoding.py \"\"\"第 7 课：正弦/余弦周期编码，到底有没有用？\n\n对比两种写法：\nA. 直接把 hour=0..23 当成数字喂给线性回归；\nB. 把 hour 拆成 hour_sin、hour_cos 两个数再喂给线性回归。\n\n运行：python scripts/07_cyclic_encoding.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\n\nfrom common import (\n    TABLES_DIR,\n    load_time_features,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"07_cyclic_results.csv\"\nPRED_CSV = TABLES_DIR / \"07_cyclic_predictions.csv\"\n\nRAW_FEATURES = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\nCYCLIC_FEATURES = [\n    \"is_weekend\",\n    \"hour_sin\",\n    \"hour_cos\",\n    \"dayofweek_sin\",\n    \"dayofweek_cos\",\n    \"month_sin\",\n    \"month_cos\",\n]\n\n\ndef explain_problem() -> None:\n    print_step(\"1. 先说清楚：为什么直接把 23 和 0 当数字很别扭？\")\n\n    demo = pd.DataFrame({\"hour\": [0, 1, 6, 12, 18, 22, 23]})\n    demo[\"hour_sin\"] = np.sin(2 * np.pi * demo[\"hour\"] / 24)\n    demo[\"hour_cos\"] = np.cos(2 * np.pi * demo[\"hour\"] / 24)\n    print(demo.to_string(index=False))\n    print(\"\\n对模型来说，如果只给一个 hour 数字：\")\n    print(\"  23 和 0 相差 23，看起来隔得很远；\")\n    print(\"  但现实中 23:00 和 00:00 只差 1 小时。\")\n    print(\"用 sin/cos 把时间放到圆上后，两者坐标就非常接近。\")\n\n\ndef make_target(df: pd.DataFrame) -> pd.DataFrame:\n    df = df.copy()\n    df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1)\n    return df.dropna(subset=[\"pm25_next\"])\n\n\ndef fit_and_evaluate(\n    name: str,\n    train: pd.DataFrame,\n    test: pd.DataFrame,\n    features: list[str],\n    results: list[dict],\n) -> np.ndarray:\n    model = LinearRegression()\n    model.fit(train[features], train[\"pm25_next\"])\n    pred = model.predict(test[features])\n    metrics = regression_metrics(test[\"pm25_next\"], pred)\n    print(\n        f\"{name:<20} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}\"\n    )\n    results.append(\n        {\n            \"模型\": name,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"], 4),\n        }\n    )\n    return pred\n\n\ndef main() -> None:\n    print_title(\"第 7 课：周期编码对照实验\")\n\n    explain_problem()\n\n    df = make_target(load_time_features())\n    split_index = int(len(df) * 0.8)\n    train = df.iloc[:split_index]\n    test = df.iloc[split_index:]\n\n    print_step(\"2. 同一个任务、同一段时间切分，只改特征写法\")\n    print(f\"训练集 {len(train)} 行，测试集 {len(test)} 行。\")\n\n    results: list[dict] = []\n\n    pred_raw = fit_and_evaluate(\"原始数字时间\", train, test, RAW_FEATURES, results)\n    pred_cyclic = fit_and"}, {"title": "08 滞后与滑动窗口", "type": "脚本", "route": "#script-lag-rolling", "text": "shift 造 lag，rolling 造均值/波动/极值，并故意造出 _leaky 错误特征。 python scripts\\08_lag_rolling_features.py \"\"\"第 8 课：滞后（lag）和滑动窗口（rolling）特征。\n\n先约定预测场景（非常重要）：\n    站在时间 t，用截至 t 已经知道的信息，预测 t+1 时刻的 pm2.5。\n\n所以：\n- t 时刻的 pm2.5、天气，都是“已经知道”的，可以用。\n- t+1 及以后的值，绝对不能作为特征，否则就是作弊（数据泄漏）。\n\n本脚本会生成：\n1. 正确特征：lag、diff、trailing rolling；\n2. 故意错误特征：中心滑动窗口（会看到未来）、把答案当特征；\n   它们只用于第 9 课的错误示范，不能放进正式模型。\n\n运行：python scripts/08_lag_rolling_features.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import (\n    PROCESSED_DIR,\n    TABLES_DIR,\n    load_clean_data,\n    print_step,\n    print_title,\n)\n\nOUT_CSV = PROCESSED_DIR / \"pm25_model_data.csv\"\nALIGN_CSV = TABLES_DIR / \"08_time_alignment.csv\"\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef add_time_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"1. 先把第 5 课的时间特征加上\")\n\n    df = df.copy()\n    index = df.index\n    df[\"year\"] = index.year\n    df[\"month\"] = index.month\n    df[\"day\"] = index.day\n    df[\"hour\"] = index.hour\n    df[\"dayofweek\"] = index.dayofweek\n    df[\"weekday_name\"] = index.dayofweek.map(lambda x: WEEKDAY_NAMES[x])\n    df[\"is_weekend\"] = (index.dayofweek >= 5).astype(int)\n    df[\"dayofyear\"] = index.dayofyear\n\n    df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24)\n    df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24)\n    df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7)\n    df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12)\n    df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12)\n\n    print(\"时间特征已加上。\")\n    return df\n\n\ndef add_lag_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"2. 滞后特征 lag：把过去的值挪到当前行\")\n\n    df = df.copy()\n\n    # 当前值：站在 t 时刻，pm2.5 已经测到了，当然可以用。\n    df[\"pm25_now\"] = df[\"pm2.5\"]\n\n    # shift(1) 表示“上一小时的值”，shift(24) 表示“昨天同一小时”。\n    df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1)\n    df[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2)\n    df[\"pm25_lag3\"] = df[\"pm2.5\"].shift(3)\n    df[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24)\n    df[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168)  # 24*7，上周同一小时\n\n    # diff 是“变化量”：比昨天同一小时高了多少？\n    df[\"pm25_diff1\"] = df[\"pm2.5\"].diff(1)\n    df[\"pm25_diff24\"] = df[\"pm2.5\"].diff(24)\n\n    print(\"新增：pm25_now, pm25_lag1/2/3/24/168, pm25_diff1, pm25_diff24\")\n    print(\"解释：lag24 能帮模型看到“昨天这个时候的污染水平”，lag168 看“上周同一时刻”。\")\n    return df\n\n\ndef add_rolling_features(df: pd.DataFrame) -> pd.DataFrame:\n    print_step(\"3. 滑动窗口特征 rolling：最近的均值、波动、最大值\")\n\n    df = df.copy()\n\n    # 注意：窗口在 t 时刻结束（trailing window），里面的值都 <= t，预测 t+1 时是安全的。\n    # 数据里有少量长缺口，所以 min_perio"}, {"title": "09 模型对比与泄漏演示", "type": "脚本", "route": "#script-compare", "text": "多组特征对照、消融实验、中心滑窗泄漏、把答案当特征。 python scripts\\09_model_comparison.py \"\"\"第 9 课：把各种特征放在一起对比，并亲手演示数据泄漏。\n\n对比模型（全部用同一段训练/测试时间，除最后两个错误示范）：\n1. 平均值基线：永远猜训练集平均值\n2. 持续法基线：把当前 pm2.5 直接当成下一小时预测\n3. 只用原始时间特征\n4. 用周期编码时间特征\n5. 周期编码 + 滞后特征\n6. 周期编码 + 滞后 + 滑动窗口 + 天气（完整正确版）\n7. 错误示范：中心滑动窗口，偷看了未来\n8. 错误示范：把答案当特征，R2 约为 1\n9. 错误示范：随机切分时间序列\n\n运行：python scripts/09_model_comparison.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardScaler\n\nfrom common import (\n    TABLES_DIR,\n    load_model_data,\n    print_step,\n    print_title,\n    regression_metrics,\n)\n\nRESULT_CSV = TABLES_DIR / \"09_model_comparison.csv\"\nABLATION_CSV = TABLES_DIR / \"09_ablation.csv\"\nPRED_CSV = TABLES_DIR / \"09_test_predictions.csv\"\nCOEF_CSV = TABLES_DIR / \"09_feature_coefficients.csv\"\n\nTIME_RAW = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"]\nTIME_CYC = [\n    \"is_weekend\",\n    \"hour_sin\",\n    \"hour_cos\",\n    \"dayofweek_sin\",\n    \"dayofweek_cos\",\n    \"month_sin\",\n    \"month_cos\",\n]\nLAGS = [\n    \"pm25_now\",\n    \"pm25_lag1\",\n    \"pm25_lag2\",\n    \"pm25_lag3\",\n    \"pm25_lag24\",\n    \"pm25_lag168\",\n    \"pm25_diff1\",\n    \"pm25_diff24\",\n]\nROLLS = [\n    \"pm25_roll24_mean\",\n    \"pm25_roll24_std\",\n    \"pm25_roll24_max\",\n    \"pm25_roll24_min\",\n    \"pm25_roll168_mean\",\n    \"pm25_roll168_std\",\n]\nWEATHER = [\"TEMP\", \"DEWP\", \"PRES\", \"Iws\", \"Is\", \"Ir\", \"TEMP_lag1\", \"TEMP_roll24_mean\"]\nLEAKY_CENTER = [\"pm25_roll24_mean_center_leaky\", \"pm25_roll168_mean_center_leaky\"]\nLEAKY_ANSWER = [\"pm25_answer_leaky\"]\n\n\ndef prepare_data() -> pd.DataFrame:\n    df = load_model_data()\n    needed = TIME_RAW + TIME_CYC + LAGS + ROLLS + WEATHER + LEAKY_CENTER + LEAKY_ANSWER + [\"pm25_next\"]\n    needed = list(dict.fromkeys(needed))  # 去重，保持顺序\n    df = df.dropna(subset=needed)\n    # 为了公平对比，错误特征在 dropna 后也一起留下；正式模型只是不选它们而已。\n    return df\n\n\ndef evaluate(\n    name: str,\n    feature_desc: str,\n    split_desc: str,\n    y_true: pd.Series,\n    y_pred: np.ndarray,\n    trust: str,\n    results: list[dict],\n) -> None:\n    metrics = regression_metrics(y_true, y_pred)\n    print(\n        f\"{name:<28} MAE={metrics['MAE']:7.3f}  \"\n        f\"RMSE={metrics['RMSE']:7.3f}  R2={metrics['R2']:7.4f}  [{trust}]\"\n    )\n    results.append(\n        {\n            \"实验\": name,\n            \"特征\": feature_desc,\n            \"切分方式\": split_desc,\n            \"MAE\": round(metrics[\"MAE\"], 3),\n            \"RMSE\": round(metrics[\"RMSE\"], 3),\n            \"R2\": round(metrics[\"R2\"]"}, {"title": "10 画图观察特征", "type": "脚本", "route": "#script-plots", "text": "原始序列、滑动平均、差分、周期性、预测对比、周期编码圆、相关性热力图。 python scripts\\10_plots.py \"\"\"第 10 课：画图观察特征。\n\n图比数字更容易让人看懂：\n- 原始序列：整体趋势和季节变化\n- 7 天滑动平均：把短期噪声抹平，看清趋势\n- 差分序列：今天比昨天变化了多少，异常点更刺眼\n- 小时/星期/月份平均：周期长什么样\n- 周期编码圆：23 点和 0 点为什么变近了\n- 预测对比：加了特征以后，预测线有没有更贴近真实线\n\n运行：python scripts/10_plots.py\n图片保存在 outputs/figures/\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom common import (\n    FIGURES_DIR,\n    TABLES_DIR,\n    load_clean_data,\n    load_model_data,\n    load_time_features,\n    print_step,\n    print_title,\n    setup_matplotlib_chinese,\n)\n\nplt = setup_matplotlib_chinese()\n\nWEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef plot_original_series() -> None:\n    print_step(\"1. 原始序列：整体看 5 年，再放大看 2 周\")\n\n    df = load_clean_data()\n    daily = df[\"pm2.5\"].resample(\"D\").mean()\n    zoom = df.loc[\"2014-06-01\":\"2014-06-14\", \"pm2.5\"]\n\n    fig, axes = plt.subplots(2, 1, figsize=(12, 8))\n    axes[0].plot(daily.index, daily.values, color=\"#2c7fb8\", linewidth=1)\n    axes[0].set_title(\"PM2.5 日平均值（2010-2014）\")\n    axes[0].set_ylabel(\"PM2.5\")\n    axes[0].grid(alpha=0.3)\n\n    axes[1].plot(zoom.index, zoom.values, color=\"#d95f02\", linewidth=1)\n    axes[1].set_title(\"放大看：2014 年 6 月前两周的每小时 PM2.5\")\n    axes[1].set_ylabel(\"PM2.5\")\n    axes[1].set_xlabel(\"UTC 时间\")\n    axes[1].grid(alpha=0.3)\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"01_原始序列与趋势.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n\n    print(\"怎么读图：\")\n    print(\"- 上图：能看出季节变化（冬天通常更高）和长期趋势。\")\n    print(\"- 下图：能看出一天内的高低起伏，这就是“日周期”。\")\n\n\ndef plot_rolling_and_diff() -> None:\n    print_step(\"2. 原始序列 vs 7 天滑动平均 vs 差分\")\n\n    df = load_clean_data()\n    daily = df[\"pm2.5\"].resample(\"D\").mean()\n    rolling7 = daily.rolling(7).mean()\n    diff1 = daily.diff(1)\n\n    fig, axes = plt.subplots(2, 1, figsize=(12, 8))\n    axes[0].plot(daily.index, daily.values, color=\"#aaaaaa\", linewidth=1, label=\"每日原始值\")\n    axes[0].plot(rolling7.index, rolling7.values, color=\"#e6550d\", linewidth=2.5, label=\"7 天滑动平均\")\n    axes[0].set_title(\"原始序列 vs 7 天滑动平均\")\n    axes[0].set_ylabel(\"PM2.5\")\n    axes[0].legend()\n    axes[0].grid(alpha=0.3)\n\n    axes[1].plot(diff1.index, diff1.values, color=\"#31a354\", linewidth=1)\n    axes[1].axhline(0, color=\"black\", linewidth=0.8)\n    axes[1].set_title(\"差分序列：今天 - 昨天（变化量）\")\n    axes[1].set_ylabel(\"变化量\")\n    axes[1].set_xlabel(\"日期（UTC）\")\n    axes[1].grid(alpha=0.3)\n\n    fig.tight_layout()\n    path = FIGURES_DIR / \"02_滑动平均与差分.png\"\n    fig.savefig(path)\n    plt.close(fig)\n    print(f\"已保存：{path}\")\n    print(\"怎么读图：滑动平均像“降噪滤镜”；差分把“变化大不大”单独拎出来，突刺就"}, {"title": "公共工具 common.py", "type": "脚本", "route": "#script-common", "text": "路径、读数据、MAE/RMSE/R²、中文画图设置。 （不用单独运行，被其他脚本 import） \"\"\"公共工具函数。\n\n为什么要有一个 common.py？\n- 每个脚本都要找数据文件、算指标、设置中文字体，如果每份代码都复制一遍，\n  改起来很容易漏。放到一个公共文件里，新手也能一眼看懂。\n\n运行方式：这个文件不用单独运行，别的脚本会自动 import 它。\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\n# ---------------------------------------------------------------------------\n# 1. 项目里所有重要文件夹和文件的位置\n# ---------------------------------------------------------------------------\n# Path(__file__) 是“当前这个 py 文件”的路径；parents[1] 就是项目根目录。\n# 这样不管你在哪个文件夹里敲命令，路径都不会错。\nPROJECT_ROOT = Path(__file__).resolve().parents[1]\n\nRAW_CSV = (\n    PROJECT_ROOT\n    / \"data\"\n    / \"raw\"\n    / \"beijing_pm25\"\n    / \"PRSA_data_2010.1.1-2014.12.31.csv\"\n)\nPROCESSED_DIR = PROJECT_ROOT / \"data\" / \"processed\"\nFIGURES_DIR = PROJECT_ROOT / \"outputs\" / \"figures\"\nTABLES_DIR = PROJECT_ROOT / \"outputs\" / \"tables\"\n\n# exist_ok=True 表示“文件夹已存在也不要报错”；parents=True 表示“缺上级文件夹就一起建”。\nfor folder in (PROCESSED_DIR, FIGURES_DIR, TABLES_DIR):\n    folder.mkdir(parents=True, exist_ok=True)\n\n\n# ---------------------------------------------------------------------------\n# 2. 打印小工具，让终端输出更易读\n# ---------------------------------------------------------------------------\ndef print_title(title: str) -> None:\n    \"\"\"打印一个醒目的标题。\"\"\"\n    print()\n    print(\"=\" * 68)\n    print(title)\n    print(\"=\" * 68)\n\n\ndef print_step(step: str) -> None:\n    \"\"\"打印一小步的说明。\"\"\"\n    print(f\"\\n--- {step} ---\")\n\n\n# ---------------------------------------------------------------------------\n# 3. 读数据\n# ---------------------------------------------------------------------------\ndef load_raw_data() -> pd.DataFrame:\n    \"\"\"读取最原始的 CSV，不做任何清洗。\"\"\"\n    if not RAW_CSV.exists():\n        raise FileNotFoundError(\n            f\"找不到原始数据：{RAW_CSV}\\n\"\n            \"请先运行：python scripts/download_data.py\"\n        )\n    return pd.read_csv(RAW_CSV)\n\n\ndef _read_csv_with_utc_index(path: Path) -> pd.DataFrame:\n    \"\"\"读带 datetime 列的 CSV，并把 datetime 设为 UTC 时间索引。\"\"\"\n    if not path.exists():\n        raise FileNotFoundError(f\"找不到文件：{path}\\n请先运行生成它的上一个脚本。\")\n    df = pd.read_csv(path)\n    df[\"datetime\"] = pd.to_datetime(df[\"datetime\"], utc=True)\n    return df.set_index(\"datetime\").sort_index()\n\n\ndef load_clean_data() -> pd.DataFrame:\n    \"\"\"读取 04_load_clean.py 生成的干净数据。\"\"\"\n    return _read_csv_with_utc_index(PROCESSED_DIR / \"pm25_clean.csv\")\n\n\ndef load_time_features() -> pd.DataFrame:\n    \"\"\"读取 05_time_features.py 生成的时间特征数据。\"\"\"\n    return _read_csv_with_utc_index(PROCESSED_DIR / \"pm25_time_features.csv\")\n\n\ndef load_model_data() -> pd.DataFrame"}, {"title": "原始序列与趋势", "type": "图", "route": "#figures", "text": "上图是 5 年日平均，下图是两周小时数据。先看趋势和日周期。"}, {"title": "滑动平均与差分", "type": "图", "route": "#figures", "text": "7 天滑动平均像降噪滤镜；差分把变化量和异常点单独拎出来。"}, {"title": "周期性观察", "type": "图", "route": "#figures", "text": "按小时、星期、月份求平均。柱子高低明显，说明时间包含预测信号。"}, {"title": "预测对比", "type": "图", "route": "#figures", "text": "黑线真实值，橙线只用时间特征（几乎是平的），蓝线完整特征（紧跟真实值）。"}, {"title": "周期编码圆", "type": "图", "route": "#figures", "text": "23 点和 0 点在圆上相邻，这就是 sin/cos 编码想表达的事情。"}, {"title": "相关性热力图", "type": "图", "route": "#figures", "text": "和下一小时 PM2.5 的线性相关。相关不等于因果，只能作为第一眼参考。"}, {"title": "项目文件（读取文件夹）", "type": "工具", "route": "#files", "text": "浏览项目文件夹里的文件，教程、代码、笔记、表格、图片都能直接打开；可重新读取刷新。"}, {"title": ".gitignore", "type": "文件", "route": "#file-.gitignore", "text": ".gitignore .gitignore"}, {"title": "data/processed/pandas_demo.csv", "type": "文件", "route": "#file-data%2Fprocessed%2Fpandas_demo.csv", "text": "data/processed/pandas_demo.csv pandas_demo.csv"}, {"title": "data/processed/pm25_clean.csv", "type": "文件", "route": "#file-data%2Fprocessed%2Fpm25_clean.csv", "text": "data/processed/pm25_clean.csv pm25_clean.csv"}, {"title": "data/processed/pm25_model_data.csv", "type": "文件", "route": "#file-data%2Fprocessed%2Fpm25_model_data.csv", "text": "data/processed/pm25_model_data.csv pm25_model_data.csv"}, {"title": "data/processed/pm25_time_features.csv", "type": "文件", "route": "#file-data%2Fprocessed%2Fpm25_time_features.csv", "text": "data/processed/pm25_time_features.csv pm25_time_features.csv"}, {"title": "data/processed/practice.db", "type": "文件", "route": "#file-data%2Fprocessed%2Fpractice.db", "text": "data/processed/practice.db practice.db"}, {"title": "data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv", "type": "文件", "route": "#file-data%
