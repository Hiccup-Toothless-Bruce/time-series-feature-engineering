  <script id="guide-data" type="application/json">{"projectRoot": "E:\\develop\\codex\\github\\time-series-feature-engineering", "generatedAt": "2026-11-09 19:30", "docs": [{"id": "overview", "title": "项目总览", "group": "开始", "icon": "home", "file": "README.md", "summary": "项目做什么、怎么运行、7 天学习计划。", "html": "<h1>大一新生也能跑通的时序特征工程（北京 PM2.5 实战）<\/h1>\n<blockquote>\n<p>这不是论文导读，而是一个\"照着敲就出结果\"的完整项目。\n导师的要求可以浓缩成一句话：<strong>把时序数据的\"时间列\"拆成模型能用的特征，并用实验证明这些特征到底有没有用。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>0. 先明白：你不需要一下子全懂<\/h2>\n<p>你现在的状态很正常：看到\"特征工程、周期性、滞后、滑动窗口\"这些词，每个字都认识，连起来不知道在说什么。<\/p>\n<p>这份教程的设计是：<\/p>\n<ol>\n<li><strong>先让代码跑出结果<\/strong>（哪怕是照着敲），建立信心；<\/li>\n<li>再解释\"为什么这样写\"；<\/li>\n<li>最后让你改一两个地方，做出自己的小实验；<\/li>\n<li>把结果写进笔记，交给导师。<\/li>\n<\/ol>\n<p>记住一句话：<strong>时序数据 = 带时间戳、按时间排好序的记录。<\/strong><\/p>\n<hr />\n<h2>网页版学习指引（推荐先看这个）<\/h2>\n<p>不用在文件夹里到处找文件。项目自带一个网页，把<strong>教程、代码、图表、实验表格<\/strong>放在同一页：<\/p>\n<ul>\n<li>左边是目录，点一下就能看，不用记路径；<\/li>\n<li>每个脚本页直接显示完整代码和“怎么运行”，一键复制命令；<\/li>\n<li>顶部有搜索框（按 <code>/<\/code> 快速定位），比如搜“滑动窗口”“MAE”；<\/li>\n<li>“学习路线”页可以勾选 7 天进度，“导师要求对照”页把每条要求对应到具体内容。<\/li>\n<li>“项目文件”页直接读取项目文件夹：左边选文件、右边看代码或图片，改完文件点“重新读取”就能看到最新的。<\/li>\n<\/ul>\n<p>打开方式（二选一）：<\/p>\n<pre><code class=\"language-powershell\"># 方式一：直接双击 guide\\index.html（最简单，离线可看）\n\n# 方式二（推荐）：启一个本地网页服务，图片和表格加载最稳\npowershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1\n# 浏览器会自动打开 http://127.0.0.1:8765/guide/index.html\n# 如果提示端口被占用：powershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1 -Port 8899\n<\/code><\/pre>\n<p>两种打开方式的能力不一样：<\/p>\n<table>\n<thead>\n<tr>\n<th>打开方式<\/th>\n<th>能看教程/图片/表格<\/th>\n<th>能读取项目文件夹<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>双击 <code>guide\\index.html<\/code><\/td>\n<td>能<\/td>\n<td>不能（浏览器安全限制）<\/td>\n<\/tr>\n<tr>\n<td>运行 <code>start-server.ps1<\/code><\/td>\n<td>能<\/td>\n<td>能<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>启动服务后会<strong>自动用你电脑上的默认浏览器（Chrome / Edge 等）打开<\/strong>页面；也可以自己把地址粘到浏览器里：<\/p>\n<pre><code class=\"language-text\">http://127.0.0.1:8765/guide/index.html\n<\/code><\/pre>\n<p>嫌上面命令太长，也可以直接运行：<\/p>\n<pre><code class=\"language-powershell\">python guide\\server.py\n<\/code><\/pre>\n<p>在“项目文件”页里还有一个“选择其他文件夹”按钮，可以在 Chrome / Edge 里临时读取你电脑上任意一个文件夹（不写入、不上传）。<\/p>\n<p>服务只允许本机访问（127.0.0.1），并且只能读到本项目文件夹里的内容。<\/p>\n<p>网页是本地生成的，不联网也能看。改动教程文档或脚本后，重新生成一次即可：<\/p>\n<pre><code class=\"language-powershell\">python guide\\build_guide.py\n<\/code><\/pre>\n<hr />\n<h2>知识点与代码速查手册（可打印）<\/h2>\n<p>项目里的知识点和代码全部集中在一份手册里：每段代码下面都有“作用”说明，按章节排好，打印出来可以直接放在手边查。<\/p>\n<ul>\n<li>Markdown 版：<code>docs/08-知识点与代码速查.md<\/code><\/li>\n<li>PDF 版（推荐打印）：<code>outputs/知识点与代码速查.pdf<\/code><\/li>\n<li>网页版：打开学习指引，点左边「知识点速查手册」<\/li>\n<\/ul>\n<p>重新生成（不需要额外装软件，用本机的 Chrome / Edge 打印）：<\/p>\n<pre><code class=\"language-powershell\">python guide\\build_handbook.py            # 同时生成 HTML 和 PDF\npython guide\\build_handbook.py --no-pdf   # 只生成 HTML\n<\/code><\/pre>\n<p>打印建议：A4 纸、缩放 100%。PDF 一共二十多页，每章从新的一页开始，可以用双面打印。<\/p>\n<p>默认是紧凑排版，约 14 页；章节之间不强制换页，打印更省纸。如果确实需要每章另起一页，可以加参数：<\/p>\n<pre><code class=\"language-powershell\">python guide\\build_handbook.py --page-break-chapters\n<\/code><\/pre>\n<hr />\n<hr />\n<h2>分享给同学：一键打包离线网页<\/h2>\n<p>如果想把教程网页发给同学，不需要对方安装 Python，也不需要启动本地服务。运行下面的命令，会生成一个可以直接分享的 zip：<\/p>\n<pre><code class=\"language-powershell\"># 先激活项目虚拟环境，再执行\npython guide\\build_share_zip.py\n<\/code><\/pre>\n<p>生成结果在 <code>dist/时序特征工程学习指引-离线版.zip<\/code>（约 3 MB）。对方解压后双击里面的 <code>index.html<\/code>，就能离线看教程、代码、图表、表格和速查 PDF。<\/p>\n<ul>\n<li><code>--no-rebuild<\/code>：不重新生成教程和 PDF，直接打包当前版本；<\/li>\n<li><code>--no-zip<\/code>：只生成文件夹，不生成压缩包。<\/li>\n<\/ul>\n<p>离线包不包含 <code>data/<\/code> 里的原始数据和处理后数据，所以体积比较小，适合分享阅读。<\/p>\n<h2>1. 导师要求 → 本项目对应位置（最重要的一张表）<\/h2>\n<table>\n<thead>\n<tr>\n<th>导师要求<\/th>\n<th>你要做的事<\/th>\n<th>在本项目里看哪里<\/th>\n<th>你会得到什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.1 Git 和 GitHub<\/td>\n<td>把代码传到 GitHub<\/td>\n<td><code>docs/01-环境与工具.md<\/code> 的 Git 部分<\/td>\n<td>一个能打开的代码仓库<\/td>\n<\/tr>\n<tr>\n<td>1.2 Markdown<\/td>\n<td>用 Markdown 写笔记<\/td>\n<td><code>notes/学习笔记模板.md<\/code><\/td>\n<td>特征笔记 + 实验记录<\/td>\n<\/tr>\n<tr>\n<td>1.3 Python<\/td>\n<td>数组、列表、字典、文件、pandas、SQLite<\/td>\n<td><code>scripts/01<\/code>、<code>02<\/code>、<code>03<\/code><\/td>\n<td>能看懂基础代码<\/td>\n<\/tr>\n<tr>\n<td>2.1 找数据集<\/td>\n<td>带时间戳的 CSV<\/td>\n<td><code>scripts/download_data.py<\/code><\/td>\n<td>北京 PM2.5 数据（UTC 每小时）<\/td>\n<\/tr>\n<tr>\n<td>2.2 基础处理<\/td>\n<td>解析时间、排序、检查缺失<\/td>\n<td><code>scripts/04_load_clean.py<\/code><\/td>\n<td><code>pm25_clean.csv<\/code><\/td>\n<\/tr>\n<tr>\n<td>2.3 拆时间特征<\/td>\n<td>年、月、日、星期、小时、是否周末<\/td>\n<td><code>scripts/05_time_features.py<\/code><\/td>\n<td>时间特征 + 特征字典<\/td>\n<\/tr>\n<tr>\n<td>2.4 基线模型<\/td>\n<td>用线性回归跑通<\/td>\n<td><code>scripts/06_baseline_model.py<\/code><\/td>\n<td>第一组 MAE/RMSE/R²<\/td>\n<\/tr>\n<tr>\n<td>2.5 周期编码<\/td>\n<td>小时/星期做 sin/cos<\/td>\n<td><code>scripts/07_cyclic_encoding.py<\/code><\/td>\n<td>前后对比结果<\/td>\n<\/tr>\n<tr>\n<td>3.1 滞后和滑动<\/td>\n<td><code>shift()<\/code> 和 <code>rolling()<\/code><\/td>\n<td><code>scripts/08_lag_rolling_features.py<\/code><\/td>\n<td>滞后/滑窗特征<\/td>\n<\/tr>\n<tr>\n<td>3.1 防未来数据<\/td>\n<td>理解数据泄漏<\/td>\n<td><code>scripts/09_model_comparison.py<\/code><\/td>\n<td>正确 vs 错误对照<\/td>\n<\/tr>\n<tr>\n<td>3.2 对比效果<\/td>\n<td>记录哪些特征有用<\/td>\n<td><code>scripts/09<\/code> + <code>notes/实验记录模板.md<\/code><\/td>\n<td>消融实验表<\/td>\n<\/tr>\n<tr>\n<td>3.3 画图观察<\/td>\n<td>原始/滑均/差分序列<\/td>\n<td><code>scripts/10_plots.py<\/code><\/td>\n<td>6 张中文图<\/td>\n<\/tr>\n<tr>\n<td>3.4 Kaggle 练手<\/td>\n<td>看别人的特征工程思路<\/td>\n<td><code>docs/06-画图与Kaggle.md<\/code><\/td>\n<td>复现计划<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>2. 第 0 步：把项目跑起来（Windows，约 5 分钟）<\/h2>\n<h3>2.1 打开 PowerShell，进入项目文件夹<\/h3>\n<p>在文件夹窗口的地址栏输入 <code>powershell<\/code> 并回车，或者在 VS Code 里按 <code>Ctrl + 反引号<\/code> 打开终端。<\/p>\n<p>确认你在这个文件夹：<\/p>\n<pre><code class=\"language-powershell\">Get-Location\n<\/code><\/pre>\n<p>应该看到以 <code>time-series-feature-engineering<\/code> 结尾的路径。<\/p>\n<h3>2.2 创建虚拟环境<\/h3>\n<p>虚拟环境就是\"只属于这个项目的工具箱\"，不会污染电脑里的其他 Python 项目。<\/p>\n<pre><code class=\"language-powershell\">python -m venv .venv\n<\/code><\/pre>\n<h3>2.3 激活虚拟环境<\/h3>\n<pre><code class=\"language-powershell\">.\\.venv\\Scripts\\Activate.ps1\n<\/code><\/pre>\n<p>成功后，命令行前面会出现 <code>(.venv)<\/code>。<\/p>\n<p>如果报\"禁止运行脚本\"，先执行下面这行，再重新激活：<\/p>\n<pre><code class=\"language-powershell\">Set-ExecutionPolicy -Scope Process Bypass\n<\/code><\/pre>\n<h3>2.4 安装依赖<\/h3>\n<pre><code class=\"language-powershell\">pip install -r requirements.txt\n<\/code><\/pre>\n<h3>2.5 一键跑完全部课程<\/h3>\n<pre><code class=\"language-powershell\">.\\run_all.ps1\n<\/code><\/pre>\n<p>看到\"全部脚本运行完成\"就成功了。图片在 <code>outputs/figures/<\/code>，表格在 <code>outputs/tables/<\/code>，\n网页指引也会自动重新生成到 <code>guide/index.html<\/code>。<\/p>\n<blockquote>\n<p>不想一键跑，也可以按顺序一条条运行：\n<code>powershell\npython scripts\\download_data.py\npython scripts\\01_python_basics.py\npython scripts\\02_pandas_basics.py\npython scripts\\03_sqlite_basics.py\npython scripts\\04_load_clean.py\npython scripts\\05_time_features.py\npython scripts\\06_baseline_model.py\npython scripts\\07_cyclic_encoding.py\npython scripts\\08_lag_rolling_features.py\npython scripts\\09_model_comparison.py\npython scripts\\10_plots.py<\/code><\/p>\n<\/blockquote>\n<hr />\n<h2>3. 目录说明<\/h2>\n<pre><code class=\"language-text\">time-series-feature-engineering/\n├─ README.md                     ← 你正在看的文件\n├─ requirements.txt              ← 需要安装的 Python 库\n├─ run_all.ps1                   ← 一键运行全部脚本\n├─ docs/                         ← 分步教学文档\n│  ├─ 00-先读我-导师要求翻译.md\n│  ├─ 01-环境与工具.md\n│  ├─ 02-Python零基础.md\n│  ├─ 03-pandas与SQLite.md\n│  ├─ 04-时序特征工程核心.md\n│  ├─ 05-建模与实验.md\n│  ├─ 06-画图与Kaggle.md\n│  ├─ 07-交作业清单与报告模板.md\n│  ├─ 08-知识点与代码速查.md\n│  └─ 99-报错急救.md\n├─ scripts/                      ← 按顺序运行的代码\n├─ notes/                        ← 你要填的笔记模板\n├─ guide/                        ← 网页版学习指引（index.html + 启动脚本）\n├─ data/\n│  ├─ raw/                       ← 原始数据（download_data.py 下载）\n│  └─ processed/                 ← 清洗、特征工程后的数据\n└─ outputs/\n   ├─ 知识点与代码速查.pdf        ← 可打印的知识点手册\n   ├─ figures/                   ← 6 张图\n   └─ tables/                    ← 实验表格、预测结果、清洗报告\n<\/code><\/pre>\n<hr />\n<h2>4. 建议的 7 天学习计划（每天 1–2 小时）<\/h2>\n<table>\n<thead>\n<tr>\n<th>天数<\/th>\n<th>学什么<\/th>\n<th>做什么<\/th>\n<th>当天检查点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第 1 天<\/td>\n<td>Git、Markdown、环境<\/td>\n<td>跑通 <code>run_all.ps1<\/code>，建 GitHub 仓库<\/td>\n<td>能在 GitHub 看到代码<\/td>\n<\/tr>\n<tr>\n<td>第 2 天<\/td>\n<td>Python 基础<\/td>\n<td>跑 <code>01<\/code>–<code>03<\/code>，改几个数字再跑<\/td>\n<td>能解释 list/dict/deque<\/td>\n<\/tr>\n<tr>\n<td>第 3 天<\/td>\n<td>pandas 基础<\/td>\n<td>跑 <code>02<\/code>，在笔记里写 5 个常用操作<\/td>\n<td>能自己读一个 CSV<\/td>\n<\/tr>\n<tr>\n<td>第 4 天<\/td>\n<td>数据清洗 + 时间特征<\/td>\n<td>跑 <code>04<\/code>、<code>05<\/code>，看特征字典<\/td>\n<td>能解释 UTC 和 is_weekend<\/td>\n<\/tr>\n<tr>\n<td>第 5 天<\/td>\n<td>基线 + 周期编码<\/td>\n<td>跑 <code>06<\/code>、<code>07<\/code>，把结果抄进实验记录<\/td>\n<td>能解释 MAE/R²<\/td>\n<\/tr>\n<tr>\n<td>第 6 天<\/td>\n<td>滞后、滑窗、防泄漏<\/td>\n<td>跑 <code>08<\/code>、<code>09<\/code>，重点看错误示范<\/td>\n<td>能说出 3 种数据泄漏<\/td>\n<\/tr>\n<tr>\n<td>第 7 天<\/td>\n<td>画图 + Kaggle + 总结<\/td>\n<td>跑 <code>10<\/code>，挑 1 个 Kaggle 比赛看 3 篇 notebook<\/td>\n<td>交出一页实验总结<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>5. 这个项目里已经为你准备好的\"成品\"<\/h2>\n<ul>\n<li>真实数据：UCI 北京 PM2.5，43824 小时，UTC 时区；<\/li>\n<li>完整代码：从 Python 基础到特征对照实验；<\/li>\n<li>中文注释：每一段代码都在解释\"为什么\"；<\/li>\n<li>6 张中文图：原始序列、滑均/差分、周期性、预测对比、周期编码圆、相关性热力图；<\/li>\n<li>实验表格：模型对比、消融实验、特征系数；<\/li>\n<li>笔记模板：按特征逐条填写，最后能直接交给导师。<\/li>\n<\/ul>\n<hr />\n<h2>6. 学习时不要做的事<\/h2>\n<ul>\n<li>不要一上来就推公式。先看输出，再理解公式。<\/li>\n<li>不要复制完就跑、不看终端输出。输出里每句话都是给你看的。<\/li>\n<li>不要用随机切分时间序列。时序数据必须按时间切。<\/li>\n<li>不要只看 R²。还要看 MAE、RMSE 和预测曲线。<\/li>\n<li>不要把 <code>_leaky<\/code> 结尾的特征放进正式模型。<\/li>\n<li>不要因为周期编码没有大幅提升就认为它没用——要看实验条件。<\/li>\n<\/ul>\n<hr />\n<h2>7. 最终要交给导师的材料<\/h2>\n<ol>\n<li>GitHub 仓库链接；<\/li>\n<li>本项目的 README（说明怎  双击 guide\\index.html 能 不能（浏览器安全限制） 运行 start-server.ps1 能 能 启动服务后会 自动用你电脑上的默认浏览器（Chrome / Edge 等）打开 页面；也可以自己把地址粘到浏览器里： http://127.0.0.1:8765/guide/index.html 嫌上面命令太长，也可以直接运行： python guide\\server.py 在“项目文件”页里还有一个“选择其他文件夹”按钮，可以在 Chrome / Edge 里临时读取你电脑上任意一个文件夹（不写入、不上传）。 服务只允许本机访问（127.0.0.1），并且只能读到本项目文件夹里的内容。 网页是本地生成的，不联网也能看。改动教程文档或脚本后，重新生成一次即可： python guide\\build_guide.py 知识点与代码速查手册（可打印） 项目里的知识点和代码全部集中在一份手册里：每段代码下面都有“作用”说明，按章节排好，打印出来可以直接放在手边查。 Markdown 版： docs/08-知识点与代码速查.md PDF 版（推荐打印）： outputs/知识点与代码速查.pdf 网页版：打开学习指引，点左边「知识点速查手册」 重新生成（不需要额外装软件，用本机的 Chrome / Edge 打印）： python guide\\build_handbook.py # 同时生成 HTML 和 PDF python guide\\build_handbook.py --no-pdf # 只生成 HTML 打印建议：A4 纸、缩放 100%。PDF 一共二十多页，每章从新的一页开始，可以用双面打印。 默认是紧凑排版，约 14 页；章节之间不强制换页，打印更省纸。如果确实需要每章另起一页，可以加参数： python guide\\build_handbook.py --page-break-chapters 分享给同学：一键打包离线网页 如果想把教程网页发给同学，不需要对方安装 Python，也不需要启动本地服务。运行下面的命令，会生成一个可以直接分享的 zip： # 先激活项目虚拟环境，再执行 python guide\\build_share_zip.py 生成结果在 dist/时序特征工程学习指引-离线版.zip （约 3 MB）。对方解压后双击里面的 index.html ，就能离线看教程、代码、图表、表格和速查 PDF。 --no-rebuild ：不重新生成教程和 PDF，直接打包当前版本； --no-zip ：只生成文件夹，不生成压缩包。 离线包不包含 data/ 里的原始数据和处理后数据，所以体积比较小，适合分享阅读。 1. 导师要求 → 本项目对应位置（最重要的一张表） 导师要求 你要做的事 在本项目里看哪里 你会得到什么 1.1 Git 和 GitHub 把代码传到 GitHub docs/01-环境与工具.md 的 Git 部分 一个能打开的代码仓库 1.2 Markdown 用 Markdown 写笔记 notes/学习笔记模板.md 特征笔记 + 实验记录 1.3 Python 数组、列表、字典、文件、pandas、SQLite scripts/01 、 02 、 03 能看懂基础代码 2.1 找数据集 带时间戳的 CSV scripts/download_data.py 北京 PM2.5 数据（UTC 每小时） 2.2 基础处理 解析时间、排序、检查缺失 scripts/04_load_clean.py pm25_clean.csv 2.3 拆时间特征 年、月、日、星期、小时、是否周末 scripts/05_time_features.py 时间特征 + 特征字典 2.4 基线模型 用线性回归跑通 scripts/06_baseline_model.py 第一组 MAE/RMSE/R² 2.5 周期编码 小时/星期做 sin/cos scripts/07_cyclic_encoding.py 前后对比结果 3.1 滞后和滑动 shift() 和 rolling() scripts/08_lag_rolling_features.py 滞后/滑窗特征 3.1 防未来数据 理解数据泄漏 scripts/09_model_comparison.py 正确 vs 错误对照 3.2 对比效果 记录哪些特征有用 scripts/09 + notes/实验记录模板.md 消融实验表 3.3 画图观察 原始/滑均/差分序列 scripts/10_plots.py 6 张中文图 3.4 Kaggle 练手 看别人的特征工程思路 docs/06-画图与Kaggle.md 复现计划 2. 第 0 步：把项目跑起来（Windows，约 5 分钟） 2.1 打开 PowerShell，进入项目文件夹 在文件夹窗口的地址栏输入 powershell 并回车，或者在 VS Code 里按 Ctrl + 反引号 打开终端。 确认你在这个文件夹： Get-Location 应该看到以 time-series-feature-engineering 结尾的路径。 2.2 创建虚拟环境 虚拟环境就是\"只属于这个项目的工具箱\"，不会污染电脑里的其他 Python 项目。 python -m venv .venv 2.3 激活虚拟环境 .\\.venv\\Scripts\\Activate.ps1 成功后，命令行前面会出现 (.venv) 。 如果报\"禁止运行脚本\"，先执行下面这行，再重新激活： Set-ExecutionPolicy -Scope Process Bypass 2.4 安装依赖 pip install -r requirements.txt 2.5 一键跑完全部课程 .\\run_all.ps1 看到\"全部脚本运行完成\"就成功了。图片在 outputs/figures/ ，表格在 outputs/tables/ ， 网页指引也会自动重新生成到 guide/index.html 。 不想一键跑，也可以按顺序一条条运行： powershell python scripts\\download_data.py python scripts\\01_python_basics.py python scripts\\02_pandas_basics.py python scripts\\03_sqlite_basics.py python scripts\\04_load_clean.py python scripts\\05_time_features.py python scripts\\06_baseline_model.py python scripts\\07_cyclic_encoding.py python scripts\\08_lag_rolling_features.py python scripts\\09_model_comparison.py python scripts\\10_plots.py 3. 目录说明 time-series-feature-engineering/ ├─ README.md ← 你正在看的文件 ├─ requirements.txt ← 需要安装的 Python 库 ├─ run_all.ps1 ← 一键运行全部脚本 ├─ docs/ ← 分步教学文档 │ ├─ 00-先读我-导师要求翻译.md │ ├─ 01-环境与工具.md │ ├─ 02-Python零基础.md │ ├─ 03-pandas与SQLite.md │ ├─ 04-时序特征工程核心.md │ ├─ 05-建模与实验.md │ ├─ 06-画图与Kaggle.md │ ├─ 07-交作业清单与报告模板.md │ ├─ 08-知识点与代码速查.md │ └─ 99-报错急救.md ├─ scripts/ ← 按顺序运行的代码 ├─ notes/ ← 你要填的笔记模板 ├─ guide/ ← 网页版学习指引（index.html + 启动脚本） ├─ data/ │ ├─ raw/ ← 原始数据（download_data.py 下载） │ └─ processed/ ← 清洗、特征工程后的数据 └─ outputs/ ├─ 知识点与代码速查.pdf ← 可打印的知识点手册 ├─ figures/ ← 6 张图 └─ tables/ ← 实验表格、预测结果、清洗报告 4. 建议的 7 天学习计划（每天 1–2 小时） 天数 学什么 做什么 当天检查点 第 1 天 Git、Markdown、环境 跑通 run_all.ps1 ，建 GitHub 仓库 能在 GitHub 看到代码 第 2 天 Python 基础 跑 01 – 03 ，改几个数字再跑 能解释 list/dict/deque 第 3 天 pandas 基础 跑 02 ，在笔记里写 5 个常用操作 能自己读一个 CSV 第 4 天 数据清洗 + 时间特征 跑 04 、 05 ，看特征字典 能解释 UTC 和 is_weekend 第 5 天 基线 + 周期编码 跑 06 、 07 ，把结果抄进实验记录 能解释 MAE/R² 第 6 天 滞后、滑窗、防泄漏 跑 08 、 09 ，重点看错误示范 能说出 3 种数据泄漏 第 7 天 画图 + Kaggle + 总结 跑 10 ，挑 1 个 Kaggle 比赛看 3 篇 notebook 交出一页实验总结 5. 这个项目里已经为你准备好的\"成品\" 真实数据：UCI 北京 PM2.5，43824 小时，UTC 时区； 完整代码：从 Python 基础到特征对照实验； 中文注释：每一段代码都在解释\"为什么\"； 6 张中文图：原始序列、滑均/差分、周期性、预测对比、周期编码圆、相关性热力图； 实验表格：模型对比、消融实验、特征系数； 笔记模板：按特征逐条填写，最后能直接交给导师。 6. 学习时不要做的事 不要一上来就推公式。先看输出，再理解公式。 不要复制完就跑、不看终端输出。输出里每句话都是给你看的。 不要用随机切分时间序列。时序数据必须按时间切。 不要只看 R²。还要看 MAE、RMSE 和预测曲线。 不要把 _leaky 结尾的特征放进正式模型。 不要因为周期编码没有大幅提升就认为它没用——要看实验条件。 7. 最终要交给导师的材料 GitHub 仓库链接； 本项目的 README（说明怎么运行）； 填好的 notes/学习笔记模板.md ； 填好的 notes/实验记录模板.md ； outputs/figures/ 里的 6 张图； 一页总结：做了什么、哪个特征有用、哪个没用、为什么、下一步做什么。 报告怎么写，看 docs/07-交作业清单与报告模板.md 。 8. 常用命令速查 # 进入项目 cd E:\\develop\\codex\\github\\time-series-feature-engineering # 激活虚拟环境 .\\.venv\\Scripts\\Activate.ps1 # 运行某个脚本 python scripts\\05_time_features.py # 一键运行 .\\run_all.ps1 # 查看当前状态 git status # 保存一次修改 git add . git commit -m \"完成时间特征提取\" # 第一次连接 GitHub（把网址换成你自己的） git remote add origin https://github.com/你的用户名/仓库名.git git push -u origin main 9. 遇到报错怎么办 先不要删代码、不要重装 Python。 把终端里 最后 10 行 完整看一遍； 找到 Error 或 Traceback 那一行； 打开 docs/99-报错急救.md 对照； 还是不会，把\"你运行了什么命令 + 完整报错 + 已经试过什么\"发给同学或导师。 下一步：打开 docs/00-先读我-导师要求翻译.md ，先把导师的话翻译成人话。"}, {"id": "req", "title": "导师要求翻译", "group": "开始", "icon": "list-checks", "file": "docs/00-先读我-导师要求翻译.md", "summary": "把导师的每条要求翻译成'我要做什么'。", "html": "<h1>00 先读我：把导师的要求翻译成人话<\/h1>\n<h2>1. 一句话看懂你的任务<\/h2>\n<p>导师给了你一份\"时序数据集\"，让你做<strong>特征工程<\/strong>。<\/p>\n<p>说白了就是：<\/p>\n<blockquote>\n<p>原始数据里只有一列时间，模型看不懂\"2010-01-01 08:00\"这种东西。\n你要把它拆成\"年=2010、月=1、日=1、小时=8、星期几、是不是周末\"等数字，\n再告诉模型\"过去几小时发生了什么\"（滞后、滑动窗口），\n最后用实验证明：加了这些特征以后，预测有没有变好。<\/p>\n<\/blockquote>\n<hr />\n<h2>2. 导师每一条要求，翻译成\"我要做什么\"<\/h2>\n<h3>1.1 Git 和 GitHub（上传代码）<\/h3>\n<p><strong>人话<\/strong>：把代码放到网上，让导师能看到你做了什么、改了什么。<\/p>\n<p><strong>你要做<\/strong>：<\/p>\n<ol>\n<li>在 GitHub 建一个仓库（repository）；<\/li>\n<li>在项目文件夹执行 <code>git init<\/code>；<\/li>\n<li>每次写完一部分就 <code>git add .<\/code> + <code>git commit -m \"说明\"<\/code>；<\/li>\n<li>最后 <code>git push<\/code> 到 GitHub。<\/li>\n<\/ol>\n<p><strong>怎么算完成<\/strong>：把仓库链接发给导师，链接能打开，里面有代码和 README。<\/p>\n<p>细节看 <code>01-环境与工具.md<\/code> 的 Git 部分。<\/p>\n<hr />\n<h3>1.2 Markdown（写笔记）<\/h3>\n<p><strong>人话<\/strong>：用简单的符号写带格式的笔记，GitHub 会自动把它显示得很漂亮。<\/p>\n<p><strong>你要做<\/strong>：把每个特征的\"怎么构造、什么意思、实验效果\"记下来。<\/p>\n<p><strong>怎么算完成<\/strong>：<code>notes/学习笔记模板.md<\/code> 里每个特征都有记录，至少写 5 个。<\/p>\n<p>例子：<\/p>\n<pre><code class=\"language-markdown\">## hour_sin / hour_cos（小时周期编码）\n\n- 怎么构造：`sin(2*pi*hour/24)` 和 `cos(2*pi*hour/24)`\n- 什么意思：把 0–23 点放到一个圆上，23 点和 0 点变成邻居\n- 实验效果：第 7 课对比，R² 从 ____ 变成 ____\n- 结论：有用 / 作用不明显，因为 ____\n<\/code><\/pre>\n<hr />\n<h3>1.3 Python（实现功能）<\/h3>\n<p><strong>人话<\/strong>：用 Python 完成上面这些事情。导师列的是基础中的基础。<\/p>\n<p><strong>你要会<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>东西<\/th>\n<th>一句话解释<\/th>\n<th>本教程哪里学<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>list 列表<\/td>\n<td>一排有顺序的数据<\/td>\n<td><code>scripts/01<\/code><\/td>\n<\/tr>\n<tr>\n<td>dict 字典<\/td>\n<td>用名字找值<\/td>\n<td><code>scripts/01<\/code><\/td>\n<\/tr>\n<tr>\n<td>deque 队列<\/td>\n<td>只保留最近 N 个数，滑窗的基础<\/td>\n<td><code>scripts/01<\/code><\/td>\n<\/tr>\n<tr>\n<td>函数 def<\/td>\n<td>把一段代码打包反复用<\/td>\n<td><code>scripts/01<\/code><\/td>\n<\/tr>\n<tr>\n<td>文件读写<\/td>\n<td>把结果存下来<\/td>\n<td><code>scripts/01<\/code><\/td>\n<\/tr>\n<tr>\n<td>pandas<\/td>\n<td>用代码操作 Excel 表格<\/td>\n<td><code>scripts/02<\/code><\/td>\n<\/tr>\n<tr>\n<td>SQL 增删改查<\/td>\n<td>数据库的基本操作<\/td>\n<td><code>scripts/03<\/code><\/td>\n<\/tr>\n<tr>\n<td>主键<\/td>\n<td>每行数据的唯一身份证<\/td>\n<td><code>scripts/03<\/code><\/td>\n<\/tr>\n<tr>\n<td>索引<\/td>\n<td>像书的目录，查得更快<\/td>\n<td><code>scripts/03<\/code><\/td>\n<\/tr>\n<tr>\n<td>SQLite<\/td>\n<td>Python 自带的轻量数据库<\/td>\n<td><code>scripts/03<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>怎么算完成<\/strong>：能跑通 01–03，并且能自己改一个数字，说出结果哪里变了。<\/p>\n<hr />\n<h3>2.1 找一份带时间戳的数据集<\/h3>\n<p><strong>人话<\/strong>：CSV 里要有一列时间，而且每一行是一个时间点的记录。<\/p>\n<p><strong>本项目已经帮你找好了<\/strong>：UCI 北京 PM2.5 数据。<\/p>\n<ul>\n<li>2010-01-01 到 2014-12-31；<\/li>\n<li>每小时一条，共 43824 条；<\/li>\n<li>时间戳是 UTC；<\/li>\n<li>目标列是 <code>pm2.5<\/code>（空气污染浓度）。<\/li>\n<\/ul>\n<p><strong>怎么算完成<\/strong>：运行 <code>python scripts\\download_data.py<\/code>，看到前 5 行数据。<\/p>\n<hr />\n<h3>2.2 用 pandas 读进内存，解析时间、排序、检查缺失<\/h3>\n<p><strong>人话<\/strong>：<\/p>\n<ol>\n<li>读 CSV；<\/li>\n<li>把\"年/月/日/小时\"拼成真正的时间；<\/li>\n<li>按时间从小到大排序；<\/li>\n<li>看每一列缺了多少值，决定怎么处理。<\/li>\n<\/ol>\n<p><strong>你要做<\/strong>：运行 <code>python scripts\\04_load_clean.py<\/code>。<\/p>\n<p><strong>怎么算完成<\/strong>：能回答：<\/p>\n<ul>\n<li>这份数据一共多少小时？<\/li>\n<li>时间戳有没有重复？<\/li>\n<li><code>pm2.5<\/code> 缺了多少？<\/li>\n<li>为什么不能直接删掉缺失行？<\/li>\n<\/ul>\n<p>答案都在脚本输出和 <code>outputs/tables/04_cleaning_report.txt<\/code> 里。<\/p>\n<hr />\n<h3>2.3 从时间戳里拆出年、月、日、星期、小时、是否周末<\/h3>\n<p><strong>人话<\/strong>：模型只认数字，所以你要把时间\"翻译\"成数字。<\/p>\n<p><strong>你要做<\/strong>：运行 <code>python scripts\\05_time_features.py<\/code>。<\/p>\n<p><strong>怎么算完成<\/strong>：知道这些列分别是什么：<\/p>\n<ul>\n<li><code>year<\/code>、<code>month<\/code>、<code>day<\/code>、<code>hour<\/code><\/li>\n<li><code>dayofweek<\/code>（0=周一，6=周日）<\/li>\n<li><code>is_weekend<\/code>（1=周末，0=工作日）<\/li>\n<li><code>hour_sin<\/code> / <code>hour_cos<\/code>（后面 2.5 才讲）<\/li>\n<\/ul>\n<hr />\n<h3>2.4 选一个目标，用线性回归跑基线<\/h3>\n<p><strong>人话<\/strong>：先跑一个最笨的模型，作为以后对比的\"地板\"。<\/p>\n<p><strong>本项目选的目标<\/strong>：站在时间 t，用现在知道的信息，预测 t+1 时刻的 PM2.5。<\/p>\n<p><strong>你要做<\/strong>：运行 <code>python scripts\\06_baseline_model.py<\/code>。<\/p>\n<p><strong>怎么算完成<\/strong>：能说出：<\/p>\n<ul>\n<li>训练集是前 80%，测试集是后 20%；<\/li>\n<li>为什么不能随机切分；<\/li>\n<li>MAE、RMSE、R² 分别是什么意思。<\/li>\n<\/ul>\n<hr />\n<h3>2.5 对小时、星期做正弦/余弦编码，观察效果变化<\/h3>\n<p><strong>人话<\/strong>：直接给模型 <code>hour=23<\/code> 和 <code>hour=0<\/code>，它会觉得这两个数差得很远；\n但现实中它们是挨着的。sin/cos 把时间放到一个圆上，让 23 点和 0 点变近。<\/p>\n<p><strong>你要做<\/strong>：运行 <code>python scripts\\07_cyclic_encoding.py<\/code>，对比两行结果。<\/p>\n<p><strong>怎么算完成<\/strong>：能写出：\"在这个数据上，原始数字时间的 MAE = <strong><em>_，周期编码的 MAE = <\/em><\/strong>_，R² = ____。\"<\/p>\n<blockquote>\n<p>注意：不一定周期编码一定大幅更好。实验结论要写\"在这个数据、这个模型、这段测试期上怎么样\"，不要写\"sin/cos 永远更好\"。<\/p>\n<\/blockquote>\n<hr />\n<h3>3.1 做滞后和滑动窗口，体会不能混入未来数据<\/h3>\n<p><strong>人话<\/strong>：<\/p>\n<ul>\n<li>滞后（lag）：把过去的值挪到当前行，例如 <code>lag1<\/code> 是上一小时的值；<\/li>\n<li>滑动窗口（rolling）：算过去 24 小时的平均值、标准差、最大值；<\/li>\n<li>预测 t+1 时，只能用 t 及更早的数据，不能用 t+1 的数据。<\/li>\n<\/ul>\n<p><strong>你要做<\/strong>：运行 <code>python scripts\\08_lag_rolling_features.py<\/code>。<\/p>\n<p><strong>怎么算完成<\/strong>：能指着表说出：对每一行，<code>lag1<\/code> 是哪个时刻、<code>roll24_mean<\/code> 用了哪些时刻、<code>pm25_next<\/code> 是哪个时刻。<\/p>\n<hr />\n<h3>3.2 加入滞后、滑动窗口，对比效果，记录哪些有用<\/h3>\n<p><strong>人话<\/strong>：做对照实验。一次只改一组特征，其他条件不变。<\/p>\n<p><strong>你要做<\/strong>：运行 <code>python scripts\\09_model_comparison.py<\/code>。<\/p>\n<p><strong>怎么算完成<\/strong>：把 <code>outputs/tables/09_model_comparison.csv<\/code> 的数字抄进 <code>notes/实验记录模板.md<\/code>，并写出 3 条结论。<\/p>\n<hr />\n<h3>3.3 画图观察特征<\/h3>\n<p><strong>人话<\/strong>：图比数字直观。看趋势、周期、异常点。<\/p>\n<p><strong>你要做<\/strong>：运行 <code>python scripts\\10_plots.py<\/code>。<\/p>\n<p><strong>怎么算完成<\/strong>：每张图下面写 2–3 句话：<\/p>\n<ol>\n<li>我看到了什么现象？<\/li>\n<li>这个现象说明哪个特征可能有用？<\/li>\n<li>实验里它到底有没有用？<\/li>\n<\/ol>\n<hr />\n<h3>3.4 用 Kaggle 入门赛练手<\/h3>\n<p><strong>人话<\/strong>：找别人写过的时间序列入门赛，看他们怎么做特征，然后自己复现一遍。<\/p>\n<p><strong>你要做<\/strong>：看 <code>06-画图与Kaggle.md<\/code>，选一个 Playground 比赛，读 3 篇公开 notebook，\n把\"他们用了哪些特征、为什么\"抄进笔记。<\/p>\n<p><strong>怎么算完成<\/strong>：能提交一次结果，并在笔记里写出\"我复现了哪个特征、效果如何\"。<\/p>\n<hr />\n<h2>3. 名词速查（先混个眼熟）<\/h2>\n<table>\n<thead>\n<tr>\n<th>名词<\/th>\n<th>一句话解释<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>时序数据<\/td>\n<td>带时间戳、按时间排序的记录<\/td>\n<td>每小时一条 PM2.5<\/td>\n<\/tr>\n<tr>\n<td>时间戳<\/td>\n<td>记录发生的具体时间<\/td>\n<td>2014-01-01 08:00<\/td>\n<\/tr>\n<tr>\n<td>UTC<\/td>\n<td>世界统一时间，避免时区混乱<\/td>\n<td>北京时间 = UTC+8<\/td>\n<\/tr>\n<tr>\n<td>特征<\/td>\n<td>喂给模型的输入列<\/td>\n<td>hour、is_weekend<\/td>\n<\/tr>\n<tr>\n<td>特征工程<\/td>\n<td>从原始数据造出更有用的特征<\/td>\n<td>把时间拆成小时和星期<\/td>\n<\/tr>\n<tr>\n<td>周期<\/td>\n<td>每隔一段时间重复出现的规律<\/td>\n<td>一天、一周、一年<\/td>\n<\/tr>\n<tr>\n<td>滞后 lag<\/td>\n<td>过去某个时刻的值<\/td>\n<td><code>pm2.5.shift(1)<\/code><\/td>\n<\/tr>\n<tr>\n<td>滑动窗口 rolling<\/td>\n<td>过去 N 个值的统计量<\/td>\n<td>过去 24 小时平均<\/td>\n<\/tr>\n<tr>\n<td>差分 diff<\/td>\n<td>当前值减上一个值<\/td>\n<td>今天比昨天高多少<\/td>\n<\/tr>\n<tr>\n<td>基线模型<\/td>\n<td>最笨但必须有的对比模型<\/td>\n<td>永远猜平均值<\/td>\n<\/tr>\n<tr>\n<td>训练集<\/td>\n<td>用来学习的旧数据<\/td>\n<td>前 80%<\/td>\n<\/tr>\n<tr>\n<td>测试集<\/td>\n<td>用来考试的新数据<\/td>\n<td>后 20%<\/td>\n<\/tr>\n<tr>\n<td>数据泄漏<\/td>\n<td>不小心把答案或未来信息喂给模型<\/td>\n<td>用 t+1 的值预测 t+1<\/td>\n<\/tr>\n<tr>\n<td>MAE<\/td>\n<td>平均差多少，越小越好<\/td>\n<td>10 表示平均差 10<\/td>\n<\/tr>\n<tr>\n<td>RMSE<\/td>\n<td>更重罚大错误的指标<\/td>\n<td>也是越小越好<\/td>\n<\/tr>\n<tr>\n<td>R²<\/td>\n<td>拟合好不好的指标，1 最好<\/td>\n<td>0 约等于只会猜平均<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>4. 整个项目的数据流<\/h2>\n<pre><code class=\"language-text\">原始 CSV\n  ↓ download_data.py\n带 year/month/day/hour 的原始表\n  ↓ 04_load_clean.py：拼 UTC 时间、排序、检查缺失\n干净的小时级数据（完整时间轴）\n  ↓ 05_time_features.py：拆年/月/日/星期/小时/是否周末 + sin/cos\n带时间特征的表\n  ↓ 08_lag_rolling_features.py：shift + rolling + 目标 y\n完整建模数据\n  ↓ 09_model_comparison.py：按时间切分、训练线性回归、对比\n实验表格 + 预测值\n  ↓ 10_plots.py\n6 张图\n<\/code><\/pre>\n<hr />\n<h2>5. 现在就开始：你的第一个 30 分钟<\/h2>\n<ol>\n<li>打开 README 的\"第 0 步\"，把项目跑起来；<\/li>\n<li>看到 <code>run_all.ps1<\/code> 输出\"全部脚本运行完成\"；<\/li>\n<li>打开 <code>outputs/figures/<\/code>，把 6 张图从前到后看一遍；<\/li>\n<li>在 <code>notes/学习笔记模板.md<\/code> 里写下你最好奇的一个问题；<\/li>\n<li>明天再回来，从 <code>01-环境与工具.md<\/code> 开始逐课学。<\/li>\n<\/ol>\n<blockquote>\n<p>记住：这个阶段的目标不是\"全懂\"，而是\"能跑通 + 能说出每个东西大概在干什么\"。<\/p>\n<\/blockquote>", "plain": "00 先读我：把导师的要求翻译成人话 1. 一句话看懂你的任务 导师给了你一份\"时序数据集\"，让你做 特征工程 。 说白了就是： 原始数据里只有一列时间，模型看不懂\"2010-01-01 08:00\"这种东西。 你要把它拆成\"年=2010、月=1、日=1、小时=8、星期几、是不是周末\"等数字， 再告诉模型\"过去几小时发生了什么\"（滞后、滑动窗口）， 最后用实验证明：加了这些特征以后，预测有没有变好。 2. 导师每一条要求，翻译成\"我要做什么\" 1.1 Git 和 GitHub（上传代码） 人话 ：把代码放到网上，让导师能看到你做了什么、改了什么。 你要做 ： 在 GitHub 建一个仓库（repository）； 在项目文件夹执行 git init ； 每次写完一部分就 git add . + git commit -m \"说明\" ； 最后 git push 到 GitHub。 怎么算完成 ：把仓库链接发给导师，链接能打开，里面有代码和 README。 细节看 01-环境与工具.md 的 Git 部分。 1.2 Markdown（写笔记） 人话 ：用简单的符号写带格式的笔记，GitHub 会自动把它显示得很漂亮。 你要做 ：把每个特征的\"怎么构造、什么意思、实验效果\"记下来。 怎么算完成 ： notes/学习笔记模板.md 里每个特征都有记录，至少写 5 个。 例子： ## hour_sin / hour_cos（小时周期编码） - 怎么构造：`sin(2*pi*hour/24)` 和 `cos(2*pi*hour/24)` - 什么意思：把 0–23 点放到一个圆上，23 点和 0 点变成邻居 - 实验效果：第 7 课对比，R² 从 ____ 变成 ____ - 结论：有用 / 作用不明显，因为 ____ 1.3 Python（实现功能） 人话 ：用 Python 完成上面这些事情。导师列的是基础中的基础。 你要会 ： 东西 一句话解释 本教程哪里学 list 列表 一排有顺序的数据 scripts/01 dict 字典 用名字找值 scripts/01 deque 队列 只保留最近 N 个数，滑窗的基础 scripts/01 函数 def 把一段代码打包反复用 scripts/01 文件读写 把结果存下来 scripts/01 pandas 用代码操作 Excel 表格 scripts/02 SQL 增删改查 数据库的基本操作 scripts/03 主键 每行数据的唯一身份证 scripts/03 索引 像书的目录，查得更快 scripts/03 SQLite Python 自带的轻量数据库 scripts/03 怎么算完成 ：能跑通 01–03，并且能自己改一个数字，说出结果哪里变了。 2.1 找一份带时间戳的数据集 人话 ：CSV 里要有一列时间，而且每一行是一个时间点的记录。 本项目已经帮你找好了 ：UCI 北京 PM2.5 数据。 2010-01-01 到 2014-12-31； 每小时一条，共 43824 条； 时间戳是 UTC； 目标列是 pm2.5 （空气污染浓度）。 怎么算完成 ：运行 python scripts\\download_data.py ，看到前 5 行数据。 2.2 用 pandas 读进内存，解析时间、排序、检查缺失 人话 ： 读 CSV； 把\"年/月/日/小时\"拼成真正的时间； 按时间从小到大排序； 看每一列缺了多少值，决定怎么处理。 你要做 ：运行 python scripts\\04_load_clean.py 。 怎么算完成 ：能回答： 这份数据一共多少小时？ 时间戳有没有重复？ pm2.5 缺了多少？ 为什么不能直接删掉缺失行？ 答案都在脚本输出和 outputs/tables/04_cleaning_report.txt 里。 2.3 从时间戳里拆出年、月、日、星期、小时、是否周末 人话 ：模型只认数字，所以你要把时间\"翻译\"成数字。 你要做 ：运行 python scripts\\05_time_features.py 。 怎么算完成 ：知道这些列分别是什么： year 、 month 、 day 、 hour dayofweek （0=周一，6=周日） is_weekend （1=周末，0=工作日） hour_sin / hour_cos （后面 2.5 才讲） 2.4 选一个目标，用线性回归跑基线 人话 ：先跑一个最笨的模型，作为以后对比的\"地板\"。 本项目选的目标 ：站在时间 t，用现在知道的信息，预测 t+1 时刻的 PM2.5。 你要做 ：运行 python scripts\\06_baseline_model.py 。 怎么算完成 ：能说出： 训练集是前 80%，测试集是后 20%； 为什么不能随机切分； MAE、RMSE、R² 分别是什么意思。 2.5 对小时、星期做正弦/余弦编码，观察效果变化 人话 ：直接给模型 hour=23 和 hour=0 ，它会觉得这两个数差得很远； 但现实中它们是挨着的。sin/cos 把时间放到一个圆上，让 23 点和 0 点变近。 你要做 ：运行 python scripts\\07_cyclic_encoding.py ，对比两行结果。 怎么算完成 ：能写出：\"在这个数据上，原始数字时间的 MAE = _，周期编码的 MAE = _，R² = ____。\" 注意：不一定周期编码一定大幅更好。实验结论要写\"在这个数据、这个模型、这段测试期上怎么样\"，不要写\"sin/cos 永远更好\"。 3.1 做滞后和滑动窗口，体会不能混入未来数据 人话 ： 滞后（lag）：把过去的值挪到当前行，例如 lag1 是上一小时的值； 滑动窗口（rolling）：算过去 24 小时的平均值、标准差、最大值； 预测 t+1 时，只能用 t 及更早的数据，不能用 t+1 的数据。 你要做 ：运行 python scripts\\08_lag_rolling_features.py 。 怎么算完成 ：能指着表说出：对每一行， lag1 是哪个时刻、 roll24_mean 用了哪些时刻、 pm25_next 是哪个时刻。 3.2 加入滞后、滑动窗口，对比效果，记录哪些有用 人话 ：做对照实验。一次只改一组特征，其他条件不变。 你要做 ：运行 python scripts\\09_model_comparison.py 。 怎么算完成 ：把 outputs/tables/09_model_comparison.csv 的数字抄进 notes/实验记录模板.md ，并写出 3 条结论。 3.3 画图观察特征 人话 ：图比数字直观。看趋势、周期、异常点。 你要做 ：运行 python scripts\\10_plots.py 。 怎么算完成 ：每张图下面写 2–3 句话： 我看到了什么现象？ 这个现象说明哪个特征可能有用？ 实验里它到底有没有用？ 3.4 用 Kaggle 入门赛练手 人话 ：找别人写过的时间序列入门赛，看他们怎么做特征，然后自己复现一遍。 你要做 ：看 06-画图与Kaggle.md ，选一个 Playground 比赛，读 3 篇公开 notebook， 把\"他们用了哪些特征、为什么\"抄进笔记。 怎么算完成 ：能提交一次结果，并在笔记里写出\"我复现了哪个特征、效果如何\"。 3. 名词速查（先混个眼熟） 名词 一句话解释 例子 时序数据 带时间戳、按时间排序的记录 每小时一条 PM2.5 时间戳 记录发生的具体时间 2014-01-01 08:00 UTC 世界统一时间，避免时区混乱 北京时间 = UTC+8 特征 喂给模型的输入列 hour、is_weekend 特征工程 从原始数据造出更有用的特征 把时间拆成小时和星期 周期 每隔一段时间重复出现的规律 一天、一周、一年 滞后 lag 过去某个时刻的值 pm2.5.shift(1) 滑动窗口 rolling 过去 N 个值的统计量 过去 24 小时平均 差分 diff 当前值减上一个值 今天比昨天高多少 基线模型 最笨但必须有的对比模型 永远猜平均值 训练集 用来学习的旧数据 前 80% 测试集 用来考试的新数据 后 20% 数据泄漏 不小心把答案或未来信息喂给模型 用 t+1 的值预测 t+1 MAE 平均差多少，越小越好 10 表示平均差 10 RMSE 更重罚大错误的指标 也是越小越好 R² 拟合好不好的指标，1 最好 0 约等于只会猜平均 4. 整个项目的数据流 原始 CSV ↓ download_data.py 带 year/month/day/hour 的原始表 ↓ 04_load_clean.py：拼 UTC 时间、排序、检查缺失 干净的小时级数据（完整时间轴） ↓ 05_time_features.py：拆年/月/日/星期/小时/是否周末 + sin/cos 带时间特征的表 ↓ 08_lag_rolling_features.py：shift + rolling + 目标 y 完整建模数据 ↓ 09_model_comparison.py：按时间切分、训练线性回归、对比 实验表格 + 预测值 ↓ 10_plots.py 6 张图 5. 现在就开始：你的第一个 30 分钟 打开 README 的\"第 0 步\"，把项目跑起来； 看到 run_all.ps1 输出\"全部脚本运行完成\"； 打开 outputs/figures/ ，把 6 张图从前到后看一遍； 在 notes/学习笔记模板.md 里写下你最好奇的一个问题； 明天再回来，从 01-环境与工具.md 开始逐课学。 记住：这个阶段的目标不是\"全懂\"，而是\"能跑通 + 能说出每个东西大概在干什么\"。"}, {"id": "env", "title": "环境与工具", "group": "教程", "icon": "settings", "file": "docs/01-环境与工具.md", "summary": "Python、venv、Git、GitHub、Markdown 最小必要操作。", "html": "<h1>01 环境与工具：Python、Git、GitHub、Markdown<\/h1>\n<p>这一课的目标：让你的电脑能跑 Python，让你会保存代码、上传代码、写笔记。<\/p>\n<hr />\n<h2>1. PowerShell 最少必要命令<\/h2>\n<p>Windows 里搜索 \"PowerShell\"，打开。下面 6 个命令够你用很久：<\/p>\n<table>\n<thead>\n<tr>\n<th>命令<\/th>\n<th>作用<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Get-Location<\/code><\/td>\n<td>我现在在哪个文件夹<\/td>\n<td><code>Get-Location<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>cd 路径<\/code><\/td>\n<td>进入某个文件夹<\/td>\n<td><code>cd E:\\develop\\codex\\github<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>dir<\/code> 或 <code>ls<\/code><\/td>\n<td>看文件夹里有什么<\/td>\n<td><code>dir<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>python --version<\/code><\/td>\n<td>看 Python 版本<\/td>\n<td><code>python --version<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>python 文件.py<\/code><\/td>\n<td>运行一个 Python 脚本<\/td>\n<td><code>python scripts\\05_time_features.py<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>git status<\/code><\/td>\n<td>看 Git 现在是什么状态<\/td>\n<td><code>git status<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>小技巧：在文件资源管理器的地址栏直接输入 <code>powershell<\/code> 再回车，就会在当前文件夹打开 PowerShell。<\/p>\n<hr />\n<h2>2. 虚拟环境：为什么每个人都要建 <code>.venv<\/code><\/h2>\n<p>假设你以后做了 10 个项目：<\/p>\n<ul>\n<li>项目 A 需要 pandas 2.0；<\/li>\n<li>项目 B 需要 pandas 3.0。<\/li>\n<\/ul>\n<p>如果所有库都装在电脑全局，就会打架。虚拟环境就是给每个项目一个独立的工具箱。<\/p>\n<h3>创建<\/h3>\n<pre><code class=\"language-powershell\">python -m venv .venv\n<\/code><\/pre>\n<h3>激活<\/h3>\n<pre><code class=\"language-powershell\">.\\.venv\\Scripts\\Activate.ps1\n<\/code><\/pre>\n<p>成功后命令行前面会有 <code>(.venv)<\/code>。<\/p>\n<h3>常见问题：禁止运行脚本<\/h3>\n<p>报错类似：<\/p>\n<pre><code class=\"language-text\">无法加载文件 ... Activate.ps1，因为在此系统上禁止运行脚本\n<\/code><\/pre>\n<p>解决：<\/p>\n<pre><code class=\"language-powershell\">Set-ExecutionPolicy -Scope Process Bypass\n.\\.venv\\Scripts\\Activate.ps1\n<\/code><\/pre>\n<p><code>-Scope Process<\/code> 表示只对当前这个终端窗口生效，关掉就恢复，安全。<\/p>\n<h3>安装依赖<\/h3>\n<pre><code class=\"language-powershell\">pip install -r requirements.txt\n<\/code><\/pre>\n<p>如果下载很慢，可以换国内镜像（任选一个）：<\/p>\n<pre><code class=\"language-powershell\">pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple\n<\/code><\/pre>\n<hr />\n<h2>3. 建议用 VS Code 写代码<\/h2>\n<ol>\n<li>下载安装 VS Code（免费）；<\/li>\n<li>用 VS Code 打开本项目文件夹：<code>File -&gt; Open Folder<\/code>；<\/li>\n<li>安装 Python 扩展（左侧扩展图标搜索 Python）；<\/li>\n<li>按 <code>Ctrl + Shift + P<\/code>，输入 <code>Python: Select Interpreter<\/code>，选择 <code>.venv\\Scripts\\python.exe<\/code>；<\/li>\n<li>按 <code>Ctrl + 反引号<\/code> 打开终端，就能直接运行脚本。<\/li>\n<\/ol>\n<p>VS Code 只是编辑器，不是必须的。但你迟早要用它看代码、改代码。<\/p>\n<hr />\n<h2>4. 运行本项目<\/h2>\n<h3>方式一：一键运行<\/h3>\n<pre><code class=\"language-powershell\">.\\run_all.ps1\n<\/code><\/pre>\n<h3>方式二：一个脚本一个脚本运行（推荐学习用）<\/h3>\n<pre><code class=\"language-powershell\">python scripts\\01_python_basics.py\npython scripts\\02_pandas_basics.py\npython scripts\\03_sqlite_basics.py\npython scripts\\04_load_clean.py\npython scripts\\05_time_features.py\npython scripts\\06_baseline_model.py\npython scripts\\07_cyclic_encoding.py\npython scripts\\08_lag_rolling_features.py\npython scripts\\09_model_comparison.py\npython scripts\\10_plots.py\n<\/code><\/pre>\n<h3>中文乱码怎么办<\/h3>\n<p>先执行：<\/p>\n<pre><code class=\"language-powershell\">chcp 65001\n[Console]::OutputEncoding = [System.Text.Encoding]::UTF8\n$env:PYTHONIOENCODING = &quot;utf-8&quot;\n<\/code><\/pre>\n<p>然后再运行脚本。<code>run_all.ps1<\/code> 里已经自动设置好了。<\/p>\n<hr />\n<h2>5. Git：先把\"保存\"这件事学会<\/h2>\n<p>Git 就像游戏存档：每完成一小步，就存一个档。GitHub 是云端的存档仓库。<\/p>\n<h3>5.1 第一次配置身份<\/h3>\n<pre><code class=\"language-powershell\">git config --global user.name &quot;你的名字&quot;\ngit config --global user.email &quot;你的邮箱&quot;\n<\/code><\/pre>\n<h3>5.2 在本项目里初始化 Git<\/h3>\n<pre><code class=\"language-powershell\">cd E:\\develop\\codex\\github\\time-series-feature-engineering\ngit init\ngit status\n<\/code><\/pre>\n<h3>5.3 日常最常用的 4 条命令<\/h3>\n<pre><code class=\"language-powershell\"># 1. 看现在改了哪些文件\ngit status\n\n# 2. 把所有修改放进&quot;待保存&quot;\ngit add .\n\n# 3. 存一个档（引号里写这次做了什么）\ngit commit -m &quot;完成时间特征提取&quot;\n\n# 4. 看历史记录\ngit log --oneline\n<\/code><\/pre>\n<p>提交信息建议：<\/p>\n<ul>\n<li><code>完成数据下载脚本<\/code><\/li>\n<li><code>跑通 pandas 基础练习<\/code><\/li>\n<li><code>添加小时和星期特征<\/code><\/li>\n<li><code>完成模型对比实验<\/code><\/li>\n<li><code>画了 6 张特征观察图<\/code><\/li>\n<\/ul>\n<h3>5.4 创建 GitHub 仓库并上传<\/h3>\n<ol>\n<li>打开 <a href=\"https://github.com\">https://github.com<\/a>，注册/登录；<\/li>\n<li>点右上角 <code>+<\/code> → <code>New repository<\/code>；<\/li>\n<li>仓库名建议：<code>time-series-feature-engineering<\/code>；<\/li>\n<li>选择 Public（公开）或 Private（私有，需要给导师加权限）；<\/li>\n<li><strong>不要<\/strong>勾选 \"Add a README file\"（我们本地已经有了）；<\/li>\n<li>创建后，GitHub 会给你一个仓库地址，类似：<\/li>\n<\/ol>\n<pre><code class=\"language-text\">https://github.com/你的用户名/time-series-feature-engineering.git\n<\/code><\/pre>\n<p>在本地执行：<\/p>\n<pre><code class=\"language-powershell\">git branch -M main\ngit remote add origin https://github.com/你的用户名/time-series-feature-engineering.git\ngit push -u origin main\n<\/code><\/pre>\n<p>第一次 push 可能需要登录。GitHub 现在不能用账号密码，需要用 Personal Access Token（PAT）：<\/p>\n<ol>\n<li>GitHub 右上角头像 → <code>Settings<\/code>；<\/li>\n<li>左侧最下 <code>Developer settings<\/code>；<\/li>\n<li><code>Personal access tokens<\/code> → <code>Tokens (classic)<\/code> → <code>Generate new token<\/code>；<\/li>\n<li>勾选 <code>repo<\/code>；<\/li>\n<li>生成后复制 token（只显示一次）；<\/li>\n<li>push 时用户名填 GitHub 用户名，密码位置粘贴 token。<\/li>\n<\/ol>\n<h3>5.5 每次写完代码的完整流程<\/h3>\n<pre><code class=\"language-powershell\">git status\ngit add .\ngit commit -m &quot;这次完成了什么&quot;\ngit push\n<\/code><\/pre>\n<h3>5.6 进阶一点：分支<\/h3>\n<pre><code class=\"language-powershell\"># 新建并切换到一个分支\ngit switch -c add-lag-features\n\n# 在分支上改代码、提交\ngit add .\ngit commit -m &quot;添加滞后特征&quot;\n\n# 推送到 GitHub\ngit push -u origin add-lag-features\n<\/code><\/pre>\n<p>然后去 GitHub 网页上开 Pull Request（PR），自己 review 一下，再合并到 main。\n这一步很加分，因为它说明你会团队协作的基本流程。<\/p>\n<blockquote>\n<p>更完整的 Git/GitHub 教程：你之前已经有 <code>github-start-guide<\/code> 项目，可以直接对照看。<\/p>\n<\/blockquote>\n<hr />\n<h2>6. Markdown：30 秒学会写笔记<\/h2>\n<p>Markdown 就是\"用几个符号表示格式\"。<\/p>\n<table>\n<thead>\n<tr>\n<th>你写的<\/th>\n<th>显示效果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code># 一级标题<\/code><\/td>\n<td>大标题<\/td>\n<\/tr>\n<tr>\n<td><code>## 二级标题<\/code><\/td>\n<td>中标题<\/td>\n<\/tr>\n<tr>\n<td><code>- 一句话<\/code><\/td>\n<td>无序列表<\/td>\n<\/tr>\n<tr>\n<td><code>1. 第一步<\/code><\/td>\n<td>有序列表<\/td>\n<\/tr>\n<tr>\n<td><code>**加粗**<\/code><\/td>\n<td><strong>加粗<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>`代码`<\/code><\/td>\n<td>行内代码<\/td>\n<\/tr>\n<tr>\n<td><code>```python<\/code><\/td>\n<td>代码块<\/td>\n<\/tr>\n<tr>\n<td><code>![图](路径)<\/code><\/td>\n<td>插入图片<\/td>\n<\/tr>\n<tr>\n<td><code>[链接](网址)<\/code><\/td>\n<td>插入链接<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>本项目里已经准备好了两个模板：<\/p>\n<ul>\n<li><code>notes/学习笔记模板.md<\/code>：每个特征一张表；<\/li>\n<li><code>notes/实验记录模板.md<\/code>：每次实验一组数据。<\/li>\n<\/ul>\n<hr />\n<h2>7. 本课检查点<\/h2>\n<ul>\n<li>[ ] 我能创建并激活虚拟环境；<\/li>\n<li>[ ] 我能运行一个脚本并看懂终端输出；<\/li>\n<li>[ ] 我执行过 <code>git init<\/code>、<code>git add<\/code>、<code>git commit<\/code>；<\/li>\n<li>[ ] 我把代码 push 到了 GitHub；<\/li>\n<li>[ ] 我会用 Markdown 写标题、列表、代码块；<\/li>\n<li>[ ] 我知道中文乱码时用 <code>chcp 65001<\/code>。<\/li>\n<\/ul>\n<p>有任何报错，先看 <code>99-报错急救.md<\/code>。<\/p>", "plain": "01 环境与工具：Python、Git、GitHub、Markdown 这一课的目标：让你的电脑能跑 Python，让你会保存代码、上传代码、写笔记。 1. PowerShell 最少必要命令 Windows 里搜索 \"PowerShell\"，打开。下面 6 个命令够你用很久： 命令 作用 例子 Get-Location 我现在在哪个文件夹 Get-Location cd 路径 进入某个文件夹 cd E:\\develop\\codex\\github dir 或 ls 看文件夹里有什么 dir python --version 看 Python 版本 python --version python 文件.py 运行一个 Python 脚本 python scripts\\05_time_features.py git status 看 Git 现在是什么状态 git status 小技巧：在文件资源管理器的地址栏直接输入 powershell 再回车，就会在当前文件夹打开 PowerShell。 2. 虚拟环境：为什么每个人都要建 .venv 假设你以后做了 10 个项目： 项目 A 需要 pandas 2.0； 项目 B 需要 pandas 3.0。 如果所有库都装在电脑全局，就会打架。虚拟环境就是给每个项目一个独立的工具箱。 创建 python -m venv .venv 激活 .\\.venv\\Scripts\\Activate.ps1 成功后命令行前面会有 (.venv) 。 常见问题：禁止运行脚本 报错类似： 无法加载文件 ... Activate.ps1，因为在此系统上禁止运行脚本 解决： Set-ExecutionPolicy -Scope Process Bypass .\\.venv\\Scripts\\Activate.ps1 -Scope Process 表示只对当前这个终端窗口生效，关掉就恢复，安全。 安装依赖 pip install -r requirements.txt 如果下载很慢，可以换国内镜像（任选一个）： pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple 3. 建议用 VS Code 写代码 下载安装 VS Code（免费）； 用 VS Code 打开本项目文件夹： File -> Open Folder ； 安装 Python 扩展（左侧扩展图标搜索 Python）； 按 Ctrl + Shift + P ，输入 Python: Select Interpreter ，选择 .venv\\Scripts\\python.exe ； 按 Ctrl + 反引号 打开终端，就能直接运行脚本。 VS Code 只是编辑器，不是必须的。但你迟早要用它看代码、改代码。 4. 运行本项目 方式一：一键运行 .\\run_all.ps1 方式二：一个脚本一个脚本运行（推荐学习用） python scripts\\01_python_basics.py python scripts\\02_pandas_basics.py python scripts\\03_sqlite_basics.py python scripts\\04_load_clean.py python scripts\\05_time_features.py python scripts\\06_baseline_model.py python scripts\\07_cyclic_encoding.py python scripts\\08_lag_rolling_features.py python scripts\\09_model_comparison.py python scripts\\10_plots.py 中文乱码怎么办 先执行： chcp 65001 [Console]::OutputEncoding = [System.Text.Encoding]::UTF8 $env:PYTHONIOENCODING = \"utf-8\" 然后再运行脚本。 run_all.ps1 里已经自动设置好了。 5. Git：先把\"保存\"这件事学会 Git 就像游戏存档：每完成一小步，就存一个档。GitHub 是云端的存档仓库。 5.1 第一次配置身份 git config --global user.name \"你的名字\" git config --global user.email \"你的邮箱\" 5.2 在本项目里初始化 Git cd E:\\develop\\codex\\github\\time-series-feature-engineering git init git status 5.3 日常最常用的 4 条命令 # 1. 看现在改了哪些文件 git status # 2. 把所有修改放进\"待保存\" git add . # 3. 存一个档（引号里写这次做了什么） git commit -m \"完成时间特征提取\" # 4. 看历史记录 git log --oneline 提交信息建议： 完成数据下载脚本 跑通 pandas 基础练习 添加小时和星期特征 完成模型对比实验 画了 6 张特征观察图 5.4 创建 GitHub 仓库并上传 打开 https://github.com ，注册/登录； 点右上角 + → New repository ； 仓库名建议： time-series-feature-engineering ； 选择 Public（公开）或 Private（私有，需要给导师加权限）； 不要 勾选 \"Add a README file\"（我们本地已经有了）； 创建后，GitHub 会给你一个仓库地址，类似： https://github.com/你的用户名/time-series-feature-engineering.git 在本地执行： git branch -M main git remote add origin https://github.com/你的用户名/time-series-feature-engineering.git git push -u origin main 第一次 push 可能需要登录。GitHub 现在不能用账号密码，需要用 Personal Access Token（PAT）： GitHub 右上角头像 → Settings ； 左侧最下 Developer settings ； Personal access tokens → Tokens (classic) → Generate new token ； 勾选 repo ； 生成后复制 token（只显示一次）； push 时用户名填 GitHub 用户名，密码位置粘贴 token。 5.5 每次写完代码的完整流程 git status git add . git commit -m \"这次完成了什么\" git push 5.6 进阶一点：分支 # 新建并切换到一个分支 git switch -c add-lag-features # 在分支上改代码、提交 git add . git commit -m \"添加滞后特征\" # 推送到 GitHub git push -u origin add-lag-features 然后去 GitHub 网页上开 Pull Request（PR），自己 review 一下，再合并到 main。 这一步很加分，因为它说明你会团队协作的基本流程。 更完整的 Git/GitHub 教程：你之前已经有 github-start-guide 项目，可以直接对照看。 6. Markdown：30 秒学会写笔记 Markdown 就是\"用几个符号表示格式\"。 你写的 显示效果 # 一级标题 大标题 ## 二级标题 中标题 - 一句话 无序列表 1. 第一步 有序列表 **加粗** 加粗 `代码` 行内代码 ```python 代码块 ![图](路径) 插入图片 [链接](网址) 插入链接 本项目里已经准备好了两个模板： notes/学习笔记模板.md ：每个特征一张表； notes/实验记录模板.md ：每次实验一组数据。 7. 本课检查点 [ ] 我能创建并激活虚拟环境； [ ] 我能运行一个脚本并看懂终端输出； [ ] 我执行过 git init 、 git add 、 git commit ； [ ] 我把代码 push 到了 GitHub； [ ] 我会用 Markdown 写标题、列表、代码块； [ ] 我知道中文乱码时用 chcp 65001 。 有任何报错，先看 99-报错急救.md 。"}, {"id": "python", "title": "Python 零基础", "group": "教程", "icon": "braces", "file": "docs/02-Python零基础.md", "summary": "list、dict、deque、函数、文件读写和报错阅读。", "html": "<h1>02 Python 零基础：只学够用的 20%<\/h1>\n<p>你不需要先学完一整本 Python 书。做时序特征工程，先掌握下面这些就够了。<\/p>\n<p>对应脚本：<code>scripts/01_python_basics.py<\/code>。<\/p>\n<hr />\n<h2>1. 变量：给数据起名字<\/h2>\n<pre><code class=\"language-python\">temperature = 22.5\ncity = &quot;南京&quot;\nis_weekend = False\n<\/code><\/pre>\n<ul>\n<li><code>temperature<\/code> 是名字；<\/li>\n<li><code>22.5<\/code>、<code>\"南京\"<\/code>、<code>False<\/code> 是值；<\/li>\n<li><code>=<\/code> 是\"把右边的值放进左边的名字\"，不是数学里的等于。<\/li>\n<\/ul>\n<hr />\n<h2>2. 列表 list：一排有顺序的数据<\/h2>\n<pre><code class=\"language-python\">temperatures = [11.0, 12.5, 10.8, 9.6, 13.2]\n\nprint(temperatures[0])    # 11.0，Python 从 0 开始编号\nprint(temperatures[-1])   # 13.2，-1 表示最后一个\nprint(temperatures[:3])   # 前 3 个\n\ntemperatures.append(14.0) # 在末尾追加\nprint(max(temperatures))\nprint(sum(temperatures) / len(temperatures))\n<\/code><\/pre>\n<p>什么时候用：存一列数字。<\/p>\n<hr />\n<h2>3. 字典 dict：用名字找值<\/h2>\n<pre><code class=\"language-python\">row = {\n    &quot;city&quot;: &quot;南京&quot;,\n    &quot;date&quot;: &quot;2026-10-08&quot;,\n    &quot;temperature&quot;: 22.5,\n    &quot;is_weekend&quot;: False,\n}\n\nprint(row[&quot;temperature&quot;])  # 22.5\nrow[&quot;weather&quot;] = &quot;多云&quot;     # 新增键\nrow[&quot;temperature&quot;] = 23.1  # 修改值\n<\/code><\/pre>\n<p>什么时候用：存\"一条记录\"，每个字段有名字。<\/p>\n<hr />\n<h2>4. 队列 deque：滑动窗口的思想原型<\/h2>\n<pre><code class=\"language-python\">from collections import deque\n\nwindow = deque(maxlen=3)\n\nfor value in [80, 75, 90, 120, 110]:\n    window.append(value)\n    print(list(window), sum(window) / len(window))\n<\/code><\/pre>\n<p>输出：<\/p>\n<pre><code class=\"language-text\">[80] 80.0\n[80, 75] 77.5\n[80, 75, 90] 81.66666666666667\n[75, 90, 120] 95.0\n[90, 120, 110] 106.66666666666667\n<\/code><\/pre>\n<p><code>maxlen=3<\/code> 表示窗口只能装 3 个：新的进来，最老的自动出去。<\/p>\n<p>这就是 <code>rolling(3).mean()<\/code> 的直觉：<strong>只看最近 3 个，算平均<\/strong>。<\/p>\n<hr />\n<h2>5. 函数 def：把代码打包<\/h2>\n<pre><code class=\"language-python\">def c_to_f(celsius):\n    return celsius * 9 / 5 + 32\n\nprint(c_to_f(25))   # 77.0\n<\/code><\/pre>\n<ul>\n<li><code>def<\/code> 是定义函数；<\/li>\n<li>括号里是输入；<\/li>\n<li><code>return<\/code> 是输出。<\/li>\n<\/ul>\n<p>以后你会看到很多函数，例如：<\/p>\n<pre><code class=\"language-python\">def regression_metrics(y_true, y_pred):\n    ...\n    return {&quot;MAE&quot;: ..., &quot;RMSE&quot;: ..., &quot;R2&quot;: ...}\n<\/code><\/pre>\n<p>不要怕，先看\"输入是什么、输出是什么\"。<\/p>\n<hr />\n<h2>6. 循环和条件：批量处理<\/h2>\n<pre><code class=\"language-python\">for value in [35, 76, 120, 210]:\n    if value &lt;= 50:\n        level = &quot;优&quot;\n    elif value &lt;= 100:\n        level = &quot;良&quot;\n    elif value &lt;= 150:\n        level = &quot;轻度污染&quot;\n    else:\n        level = &quot;中重度污染&quot;\n    print(value, level)\n<\/code><\/pre>\n<p>Python 用<strong>缩进<\/strong>表示\"谁属于谁\"。缩进乱了，程序就报错。<\/p>\n<hr />\n<h2>7. 文件读写：把结果存下来<\/h2>\n<pre><code class=\"language-python\">from pathlib import Path\n\npath = Path(&quot;outputs/tables/my_note.txt&quot;)\npath.write_text(&quot;我今天学会了列表和字典。\\n&quot;, encoding=&quot;utf-8&quot;)\n\ncontent = path.read_text(encoding=&quot;utf-8&quot;)\nprint(content)\n<\/code><\/pre>\n<p>时间序列数据通常也是这样：读一个 CSV 进来，处理完再写一个 CSV 出去。<\/p>\n<hr />\n<h2>8. 怎么读报错信息<\/h2>\n<p>Python 报错看起来吓人，其实结构固定：<\/p>\n<pre><code class=\"language-text\">Traceback (most recent call last):\n  File &quot;scripts/02_pandas_basics.py&quot;, line 122, in &lt;module&gt;\n    main()\n  File &quot;scripts/02_pandas_basics.py&quot;, line 121, in main\n    groupby_demo(df)\nTypeError: groupby_demo() takes 0 positional arguments but 1 was given\n<\/code><\/pre>\n<p>看三件事：<\/p>\n<ol>\n<li><strong>最后一行<\/strong>：错误类型和原因（这里是参数多给了一个）；<\/li>\n<li><strong>文件名和行号<\/strong>：<code>scripts/02_pandas_basics.py, line 122<\/code>；<\/li>\n<li><strong>箭头附近<\/strong>：出错的那行代码。<\/li>\n<\/ol>\n<p>新手最常见的 4 个错误：<\/p>\n<table>\n<thead>\n<tr>\n<th>报错<\/th>\n<th>大概原因<\/th>\n<th>怎么办<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>IndentationError<\/code><\/td>\n<td>缩进不对<\/td>\n<td>检查空格，别混用 Tab 和空格<\/td>\n<\/tr>\n<tr>\n<td><code>NameError<\/code><\/td>\n<td>用了没定义的变量<\/td>\n<td>检查变量名拼写<\/td>\n<\/tr>\n<tr>\n<td><code>ModuleNotFoundError<\/code><\/td>\n<td>没装库或没激活虚拟环境<\/td>\n<td>激活 <code>.venv<\/code>，<code>pip install -r requirements.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>FileNotFoundError<\/code><\/td>\n<td>文件路径不对<\/td>\n<td>确认先运行了生成数据的上一个脚本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>9. 动手练习<\/h2>\n<p>在 <code>scripts/01_python_basics.py<\/code> 里改这几处，每改一次就运行一次：<\/p>\n<ol>\n<li>把 <code>hourly_pm25<\/code> 的最后一个数改成 200，看平均值怎么变；<\/li>\n<li>把 <code>deque(maxlen=3)<\/code> 改成 <code>maxlen=5<\/code>，看窗口怎么变；<\/li>\n<li>在 <code>exercises()<\/code> 里加一个数字 <code>7<\/code>，看最大值和排序结果；<\/li>\n<li>把文件里写的那句话改成你自己的名字。<\/li>\n<\/ol>\n<hr />\n<h2>10. 检查点<\/h2>\n<ul>\n<li>[ ] 我能解释 list 和 dict 的区别；<\/li>\n<li>[ ] 我能说出 deque(maxlen=3) 在干什么；<\/li>\n<li>[ ] 我能定义并调用一个函数；<\/li>\n<li>[ ] 我知道报错要看最后一行、文件名、行号；<\/li>\n<li>[ ] 我改过代码里的数字并成功重新运行。<\/li>\n<\/ul>\n<p>下一课：<code>03-pandas与SQLite.md<\/code>。<\/p>", "plain": "02 Python 零基础：只学够用的 20% 你不需要先学完一整本 Python 书。做时序特征工程，先掌握下面这些就够了。 对应脚本： scripts/01_python_basics.py 。 1. 变量：给数据起名字 temperature = 22.5 city = \"南京\" is_weekend = False temperature 是名字； 22.5 、 \"南京\" 、 False 是值； = 是\"把右边的值放进左边的名字\"，不是数学里的等于。 2. 列表 list：一排有顺序的数据 temperatures = [11.0, 12.5, 10.8, 9.6, 13.2] print(temperatures[0]) # 11.0，Python 从 0 开始编号 print(temperatures[-1]) # 13.2，-1 表示最后一个 print(temperatures[:3]) # 前 3 个 temperatures.append(14.0) # 在末尾追加 print(max(temperatures)) print(sum(temperatures) / len(temperatures)) 什么时候用：存一列数字。 3. 字典 dict：用名字找值 row = { \"city\": \"南京\", \"date\": \"2026-10-08\", \"temperature\": 22.5, \"is_weekend\": False, } print(row[\"temperature\"]) # 22.5 row[\"weather\"] = \"多云\" # 新增键 row[\"temperature\"] = 23.1 # 修改值 什么时候用：存\"一条记录\"，每个字段有名字。 4. 队列 deque：滑动窗口的思想原型 from collections import deque window = deque(maxlen=3) for value in [80, 75, 90, 120, 110]: window.append(value) print(list(window), sum(window) / len(window)) 输出： [80] 80.0 [80, 75] 77.5 [80, 75, 90] 81.66666666666667 [75, 90, 120] 95.0 [90, 120, 110] 106.66666666666667 maxlen=3 表示窗口只能装 3 个：新的进来，最老的自动出去。 这就是 rolling(3).mean() 的直觉： 只看最近 3 个，算平均 。 5. 函数 def：把代码打包 def c_to_f(celsius): return celsius * 9 / 5 + 32 print(c_to_f(25)) # 77.0 def 是定义函数； 括号里是输入； return 是输出。 以后你会看到很多函数，例如： def regression_metrics(y_true, y_pred): ... return {\"MAE\": ..., \"RMSE\": ..., \"R2\": ...} 不要怕，先看\"输入是什么、输出是什么\"。 6. 循环和条件：批量处理 for value in [35, 76, 120, 210]: if value <= 50: level = \"优\" elif value <= 100: level = \"良\" elif value <= 150: level = \"轻度污染\" else: level = \"中重度污染\" print(value, level) Python 用 缩进 表示\"谁属于谁\"。缩进乱了，程序就报错。 7. 文件读写：把结果存下来 from pathlib import Path path = Path(\"outputs/tables/my_note.txt\") path.write_text(\"我今天学会了列表和字典。\\n\", encoding=\"utf-8\") content = path.read_text(encoding=\"utf-8\") print(content) 时间序列数据通常也是这样：读一个 CSV 进来，处理完再写一个 CSV 出去。 8. 怎么读报错信息 Python 报错看起来吓人，其实结构固定： Traceback (most recent call last): File \"scripts/02_pandas_basics.py\", line 122, in <module> main() File \"scripts/02_pandas_basics.py\", line 121, in main groupby_demo(df) TypeError: groupby_demo() takes 0 positional arguments but 1 was given 看三件事： 最后一行 ：错误类型和原因（这里是参数多给了一个）； 文件名和行号 ： scripts/02_pandas_basics.py, line 122 ； 箭头附近 ：出错的那行代码。 新手最常见的 4 个错误： 报错 大概原因 怎么办 IndentationError 缩进不对 检查空格，别混用 Tab 和空格 NameError 用了没定义的变量 检查变量名拼写 ModuleNotFoundError 没装库或没激活虚拟环境 激活 .venv ， pip install -r requirements.txt FileNotFoundError 文件路径不对 确认先运行了生成数据的上一个脚本 9. 动手练习 在 scripts/01_python_basics.py 里改这几处，每改一次就运行一次： 把 hourly_pm25 的最后一个数改成 200，看平均值怎么变； 把 deque(maxlen=3) 改成 maxlen=5 ，看窗口怎么变； 在 exercises() 里加一个数字 7 ，看最大值和排序结果； 把文件里写的那句话改成你自己的名字。 10. 检查点 [ ] 我能解释 list 和 dict 的区别； [ ] 我能说出 deque(maxlen=3) 在干什么； [ ] 我能定义并调用一个函数； [ ] 我知道报错要看最后一行、文件名、行号； [ ] 我改过代码里的数字并成功重新运行。 下一课： 03-pandas与SQLite.md 。"}, {"id": "pandas-sqlite", "title": "pandas 与 SQLite", "group": "教程", "icon": "table-2", "file": "docs/03-pandas与SQLite.md", "summary": "读 CSV、筛选、groupby、时间处理、SQL 增删改查。", "html": "<h1>03 pandas 与 SQLite：数据处理的两把常用工具<\/h1>\n<p>对应脚本：<\/p>\n<ul>\n<li><code>scripts/02_pandas_basics.py<\/code><\/li>\n<li><code>scripts/03_sqlite_basics.py<\/code><\/li>\n<\/ul>\n<hr />\n<h2>第一部分：pandas<\/h2>\n<p>pandas 是 Python 里最常用的表格处理工具。你可以把它想成\"用代码操作的 Excel\"。<\/p>\n<h3>1. 两个核心概念<\/h3>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>是什么<\/th>\n<th>类比<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Series<\/code><\/td>\n<td>一列数据<\/td>\n<td>Excel 里的一列<\/td>\n<\/tr>\n<tr>\n<td><code>DataFrame<\/code><\/td>\n<td>一张表，很多列<\/td>\n<td>一整个 Excel 工作表<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>2. 读 CSV<\/h3>\n<pre><code class=\"language-python\">import pandas as pd\n\ndf = pd.read_csv(&quot;data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv&quot;)\n<\/code><\/pre>\n<ul>\n<li><code>df<\/code> 是变量名，随便起，但大家习惯叫 <code>df<\/code>（DataFrame 的缩写）；<\/li>\n<li>路径可以用相对于项目根目录的路径；<\/li>\n<li>读进来之后，先用眼睛看，别急着建模。<\/li>\n<\/ul>\n<h3>3. 看数据的 5 个动作<\/h3>\n<pre><code class=\"language-python\">df.head()          # 前 5 行\ndf.shape           # (行数, 列数)\ndf.columns         # 列名\ndf.dtypes          # 每一列的类型\ndf.describe()      # 数值列的统计量\ndf.isna().sum()    # 每一列缺多少个值\n<\/code><\/pre>\n<p><strong>新手最容易犯的错<\/strong>：拿到数据直接扔进模型。正确顺序是：先看，再洗，再用。<\/p>\n<h3>4. 选列和筛选行<\/h3>\n<pre><code class=\"language-python\">df[&quot;pm2.5&quot;]                       # 选一列（Series）\ndf[[&quot;pm2.5&quot;, &quot;TEMP&quot;]]             # 选两列（DataFrame）\ndf[df[&quot;pm2.5&quot;] &gt; 100]             # 只保留 pm2.5 大于 100 的行\ndf[(df[&quot;pm2.5&quot;] &gt; 100) &amp; (df[&quot;TEMP&quot;] &lt; 0)]  # 两个条件\n<\/code><\/pre>\n<p>注意：多个条件要用 <code>&amp;<\/code>（并且）、<code>|<\/code>（或者），每个条件要加括号。<\/p>\n<h3>5. 造新列<\/h3>\n<pre><code class=\"language-python\">df[&quot;is_weekend&quot;] = df[&quot;dayofweek&quot;] &gt;= 5\ndf[&quot;temp_f&quot;] = df[&quot;TEMP&quot;] * 9 / 5 + 32\n<\/code><\/pre>\n<p>特征工程本质上就是不断造新列。<\/p>\n<h3>6. 分组统计 groupby<\/h3>\n<pre><code class=\"language-python\">df.groupby(&quot;hour&quot;)[&quot;pm2.5&quot;].mean()       # 每个小时的平均 PM2.5\ndf.groupby(&quot;dayofweek&quot;)[&quot;pm2.5&quot;].mean()  # 每个星期的平均 PM2.5\n<\/code><\/pre>\n<p>这是观察周期性的最快方法：如果每个小时的平均值不一样，说明小时可能有预测价值。<\/p>\n<h3>7. 时间处理：字符串 → datetime → 拆特征<\/h3>\n<pre><code class=\"language-python\">df[&quot;datetime&quot;] = pd.to_datetime(df[[&quot;year&quot;, &quot;month&quot;, &quot;day&quot;, &quot;hour&quot;]])\ndf[&quot;datetime&quot;] = df[&quot;datetime&quot;].dt.tz_localize(&quot;UTC&quot;)\n\ndf[&quot;year&quot;] = df[&quot;datetime&quot;].dt.year\ndf[&quot;month&quot;] = df[&quot;datetime&quot;].dt.month\ndf[&quot;day&quot;] = df[&quot;datetime&quot;].dt.day\ndf[&quot;hour&quot;] = df[&quot;datetime&quot;].dt.hour\ndf[&quot;dayofweek&quot;] = df[&quot;datetime&quot;].dt.dayofweek   # 0=周一\n<\/code><\/pre>\n<ul>\n<li><code>datetime<\/code> 是真正的时间类型，可以排序、相减、取年/月/日；<\/li>\n<li><code>tz_localize(\"UTC\")<\/code> 表示\"这个时间本来就是 UTC\"；<\/li>\n<li>如果原始时间是北京时间 <code>Asia/Shanghai<\/code>，要先用 <code>tz_localize(\"Asia/Shanghai\")<\/code>，再用 <code>tz_convert(\"UTC\")<\/code>。<\/li>\n<\/ul>\n<h3>8. 时间索引和重采样<\/h3>\n<pre><code class=\"language-python\">df = df.set_index(&quot;datetime&quot;).sort_index()\n\ndaily = df[&quot;pm2.5&quot;].resample(&quot;D&quot;).mean()   # 每天平均\nweekly = df[&quot;pm2.5&quot;].resample(&quot;W&quot;).mean()  # 每周平均\n<\/code><\/pre>\n<ul>\n<li><code>resample(\"D\")<\/code>：按天分组；<\/li>\n<li><code>resample(\"W\")<\/code>：按周分组；<\/li>\n<li>这是画趋势图之前常用的操作。<\/li>\n<\/ul>\n<h3>9. shift 和 rolling（先看一眼，下一课细讲）<\/h3>\n<pre><code class=\"language-python\">df[&quot;pm25_lag1&quot;] = df[&quot;pm2.5&quot;].shift(1)                 # 上一小时\ndf[&quot;pm25_roll24_mean&quot;] = df[&quot;pm2.5&quot;].rolling(24).mean() # 最近 24 小时平均\n<\/code><\/pre>\n<p>用之前一定先问自己：<strong>这一行看到的数，在预测的时候真的拿得到吗？<\/strong><\/p>\n<h3>10. pandas 动手练习<\/h3>\n<p>在 <code>scripts/02_pandas_basics.py<\/code> 里改：<\/p>\n<ol>\n<li>把筛选条件从 <code>rain_mm &gt; 5<\/code> 改成 <code>rain_mm &gt; 1<\/code>，看结果变化；<\/li>\n<li>把 <code>groupby(\"city\")<\/code> 改成按别的列分组；<\/li>\n<li>把 <code>df.head(100)<\/code> 改成 <code>df.head(500)<\/code>；<\/li>\n<li>在真正的数据上，自己算一遍 <code>df[\"cbwd\"].value_counts()<\/code>，看风向有几种。<\/li>\n<\/ol>\n<hr />\n<h2>第二部分：SQLite<\/h2>\n<p>SQLite 是 Python 自带的轻量数据库，零配置。你不需要装 MySQL。<\/p>\n<p>对应脚本：<code>scripts/03_sqlite_basics.py<\/code>。<\/p>\n<h3>1. 为什么需要数据库<\/h3>\n<p>CSV 适合\"读进来一次性分析\"；数据库适合\"很多次增删改查\"。<\/p>\n<p>比如你要做一个天气记录系统，每天新增记录、修改、删除、查询，用数据库更合适。<\/p>\n<h3>2. 连接数据库<\/h3>\n<pre><code class=\"language-python\">import sqlite3\n\nconn = sqlite3.connect(&quot;data/processed/practice.db&quot;)\n<\/code><\/pre>\n<p><code>connect<\/code> 时如果文件不存在，会自动创建。<\/p>\n<h3>3. 建表 + 主键<\/h3>\n<pre><code class=\"language-python\">conn.execute(&quot;&quot;&quot;\nCREATE TABLE IF NOT EXISTS weather_notes (\n    id      INTEGER PRIMARY KEY,   -- 主键：唯一身份证，不能重复\n    city    TEXT    NOT NULL,\n    date    TEXT    NOT NULL,\n    temp    REAL,\n    note    TEXT\n)\n&quot;&quot;&quot;)\nconn.commit()\n<\/code><\/pre>\n<p><strong>主键<\/strong>：每一行的唯一编号。如果你插入两条 <code>id=1<\/code>，数据库会直接报错。这是好事，它帮你防止重复数据。<\/p>\n<h3>4. 增：INSERT<\/h3>\n<pre><code class=\"language-python\">conn.execute(\n    &quot;INSERT INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)&quot;,\n    (1, &quot;Nanjing&quot;, &quot;2026-10-01&quot;, 28.0, &quot;sunny&quot;),\n)\nconn.commit()\n<\/code><\/pre>\n<p><code>?<\/code> 是占位符，不要用字符串拼接，既安全又不容易出错。<\/p>\n<h3>5. 查：SELECT<\/h3>\n<pre><code class=\"language-python\">rows = conn.execute(&quot;SELECT * FROM weather_notes WHERE city = ?&quot;, (&quot;Nanjing&quot;,)).fetchall()\nfor row in rows:\n    print(row)\n<\/code><\/pre>\n<p>常见查询：<\/p>\n<pre><code class=\"language-sql\">SELECT * FROM weather_notes ORDER BY date;\nSELECT city, COUNT(*) FROM weather_notes GROUP BY city;\nSELECT AVG(temp) FROM weather_notes WHERE city = 'Nanjing';\n<\/code><\/pre>\n<h3>6. 改：UPDATE<\/h3>\n<pre><code class=\"language-python\">conn.execute(&quot;UPDATE weather_notes SET temp = ? WHERE id = ?&quot;, (29.5, 1))\nconn.commit()\n<\/code><\/pre>\n<p><strong>一定要写 WHERE<\/strong>。不写的话，整张表都会被改掉。<\/p>\n<h3>7. 删：DELETE<\/h3>\n<pre><code class=\"language-python\">conn.execute(&quot;DELETE FROM weather_notes WHERE id = ?&quot;, (4,))\nconn.commit()\n<\/code><\/pre>\n<p>同样，<strong>一定要写 WHERE<\/strong>。<\/p>\n<h3>8. 索引<\/h3>\n<pre><code class=\"language-python\">conn.execute(&quot;CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)&quot;)\nconn.commit()\n<\/code><\/pre>\n<p>索引像书的目录：按 <code>city<\/code> 查询会更快，但会占一点空间，写入也会稍慢。\n不是越多越好，常用查询列才建。<\/p>\n<h3>9. SQLite 和 pandas 怎么配合<\/h3>\n<pre><code class=\"language-python\">df.to_sql(&quot;pm25&quot;, conn, if_exists=&quot;replace&quot;, index=False)  # DataFrame 存进数据库\ndf2 = pd.read_sql(&quot;SELECT * FROM pm25 WHERE pm2.5 &gt; 100&quot;, conn)  # 查出来变 DataFrame\n<\/code><\/pre>\n<p>先把数据放进数据库，再用 SQL 查询、用 pandas 分析，是实际工作中很常见的组合。<\/p>\n<h3>10. SQLite 动手练习<\/h3>\n<p>在 <code>scripts/03_sqlite_basics.py<\/code> 里：<\/p>\n<ol>\n<li>增加一条你自己的记录；<\/li>\n<li>查询 <code>temp<\/code> 大于 25 的行；<\/li>\n<li>把某个城市的名字改掉；<\/li>\n<li>删掉一条记录；<\/li>\n<li>给 <code>date<\/code> 列也建一个索引。<\/li>\n<\/ol>\n<hr />\n<h2>检查点<\/h2>\n<ul>\n<li>[ ] 我能读一个 CSV 并打印 <code>shape<\/code>、列名、缺失值；<\/li>\n<li>[ ] 我能筛选行、选列、造新列；<\/li>\n<li>[ ] 我能用 <code>groupby<\/code> 求每小时平均；<\/li>\n<li>[ ] 我能把时间字符串转成 datetime；<\/li>\n<li>[ ] 我能说出主键和索引的作用；<\/li>\n<li>[ ] 我能写出 INSERT、SELECT、UPDATE、DELETE 四条 SQL。<\/li>\n<\/ul>\n<p>下一课进入重点：<code>04-时序特征工程核心.md<\/code>。<\/p>", "plain": "03 pandas 与 SQLite：数据处理的两把常用工具 对应脚本： scripts/02_pandas_basics.py scripts/03_sqlite_basics.py 第一部分：pandas pandas 是 Python 里最常用的表格处理工具。你可以把它想成\"用代码操作的 Excel\"。 1. 两个核心概念 概念 是什么 类比 Series 一列数据 Excel 里的一列 DataFrame 一张表，很多列 一整个 Excel 工作表 2. 读 CSV import pandas as pd df = pd.read_csv(\"data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv\") df 是变量名，随便起，但大家习惯叫 df （DataFrame 的缩写）； 路径可以用相对于项目根目录的路径； 读进来之后，先用眼睛看，别急着建模。 3. 看数据的 5 个动作 df.head() # 前 5 行 df.shape # (行数, 列数) df.columns # 列名 df.dtypes # 每一列的类型 df.describe() # 数值列的统计量 df.isna().sum() # 每一列缺多少个值 新手最容易犯的错 ：拿到数据直接扔进模型。正确顺序是：先看，再洗，再用。 4. 选列和筛选行 df[\"pm2.5\"] # 选一列（Series） df[[\"pm2.5\", \"TEMP\"]] # 选两列（DataFrame） df[df[\"pm2.5\"] > 100] # 只保留 pm2.5 大于 100 的行 df[(df[\"pm2.5\"] > 100) & (df[\"TEMP\"] < 0)] # 两个条件 注意：多个条件要用 & （并且）、 | （或者），每个条件要加括号。 5. 造新列 df[\"is_weekend\"] = df[\"dayofweek\"] >= 5 df[\"temp_f\"] = df[\"TEMP\"] * 9 / 5 + 32 特征工程本质上就是不断造新列。 6. 分组统计 groupby df.groupby(\"hour\")[\"pm2.5\"].mean() # 每个小时的平均 PM2.5 df.groupby(\"dayofweek\")[\"pm2.5\"].mean() # 每个星期的平均 PM2.5 这是观察周期性的最快方法：如果每个小时的平均值不一样，说明小时可能有预测价值。 7. 时间处理：字符串 → datetime → 拆特征 df[\"datetime\"] = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]]) df[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"UTC\") df[\"year\"] = df[\"datetime\"].dt.year df[\"month\"] = df[\"datetime\"].dt.month df[\"day\"] = df[\"datetime\"].dt.day df[\"hour\"] = df[\"datetime\"].dt.hour df[\"dayofweek\"] = df[\"datetime\"].dt.dayofweek # 0=周一 datetime 是真正的时间类型，可以排序、相减、取年/月/日； tz_localize(\"UTC\") 表示\"这个时间本来就是 UTC\"； 如果原始时间是北京时间 Asia/Shanghai ，要先用 tz_localize(\"Asia/Shanghai\") ，再用 tz_convert(\"UTC\") 。 8. 时间索引和重采样 df = df.set_index(\"datetime\").sort_index() daily = df[\"pm2.5\"].resample(\"D\").mean() # 每天平均 weekly = df[\"pm2.5\"].resample(\"W\").mean() # 每周平均 resample(\"D\") ：按天分组； resample(\"W\") ：按周分组； 这是画趋势图之前常用的操作。 9. shift 和 rolling（先看一眼，下一课细讲） df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1) # 上一小时 df[\"pm25_roll24_mean\"] = df[\"pm2.5\"].rolling(24).mean() # 最近 24 小时平均 用之前一定先问自己： 这一行看到的数，在预测的时候真的拿得到吗？ 10. pandas 动手练习 在 scripts/02_pandas_basics.py 里改： 把筛选条件从 rain_mm > 5 改成 rain_mm > 1 ，看结果变化； 把 groupby(\"city\") 改成按别的列分组； 把 df.head(100) 改成 df.head(500) ； 在真正的数据上，自己算一遍 df[\"cbwd\"].value_counts() ，看风向有几种。 第二部分：SQLite SQLite 是 Python 自带的轻量数据库，零配置。你不需要装 MySQL。 对应脚本： scripts/03_sqlite_basics.py 。 1. 为什么需要数据库 CSV 适合\"读进来一次性分析\"；数据库适合\"很多次增删改查\"。 比如你要做一个天气记录系统，每天新增记录、修改、删除、查询，用数据库更合适。 2. 连接数据库 import sqlite3 conn = sqlite3.connect(\"data/processed/practice.db\") connect 时如果文件不存在，会自动创建。 3. 建表 + 主键 conn.execute(\"\"\" CREATE TABLE IF NOT EXISTS weather_notes ( id INTEGER PRIMARY KEY, -- 主键：唯一身份证，不能重复 city TEXT NOT NULL, date TEXT NOT NULL, temp REAL, note TEXT ) \"\"\") conn.commit() 主键 ：每一行的唯一编号。如果你插入两条 id=1 ，数据库会直接报错。这是好事，它帮你防止重复数据。 4. 增：INSERT conn.execute( \"INSERT INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\", (1, \"Nanjing\", \"2026-10-01\", 28.0, \"sunny\"), ) conn.commit() ? 是占位符，不要用字符串拼接，既安全又不容易出错。 5. 查：SELECT rows = conn.execute(\"SELECT * FROM weather_notes WHERE city = ?\", (\"Nanjing\",)).fetchall() for row in rows: print(row) 常见查询： SELECT * FROM weather_notes ORDER BY date; SELECT city, COUNT(*) FROM weather_notes GROUP BY city; SELECT AVG(temp) FROM weather_notes WHERE city = 'Nanjing'; 6. 改：UPDATE conn.execute(\"UPDATE weather_notes SET temp = ? WHERE id = ?\", (29.5, 1)) conn.commit() 一定要写 WHERE 。不写的话，整张表都会被改掉。 7. 删：DELETE conn.execute(\"DELETE FROM weather_notes WHERE id = ?\", (4,)) conn.commit() 同样， 一定要写 WHERE 。 8. 索引 conn.execute(\"CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)\") conn.commit() 索引像书的目录：按 city 查询会更快，但会占一点空间，写入也会稍慢。 不是越多越好，常用查询列才建。 9. SQLite 和 pandas 怎么配合 df.to_sql(\"pm25\", conn, if_exists=\"replace\", index=False) # DataFrame 存进数据库 df2 = pd.read_sql(\"SELECT * FROM pm25 WHERE pm2.5 > 100\", conn) # 查出来变 DataFrame 先把数据放进数据库，再用 SQL 查询、用 pandas 分析，是实际工作中很常见的组合。 10. SQLite 动手练习 在 scripts/03_sqlite_basics.py 里： 增加一条你自己的记录； 查询 temp 大于 25 的行； 把某个城市的名字改掉； 删掉一条记录； 给 date 列也建一个索引。 检查点 [ ] 我能读一个 CSV 并打印 shape 、列名、缺失值； [ ] 我能筛选行、选列、造新列； [ ] 我能用 groupby 求每小时平均； [ ] 我能把时间字符串转成 datetime； [ ] 我能说出主键和索引的作用； [ ] 我能写出 INSERT、SELECT、UPDATE、DELETE 四条 SQL。 下一课进入重点： 04-时序特征工程核心.md 。"}, {"id": "feature-core", "title": "时序特征工程核心", "group": "教程", "icon": "calendar-clock", "file": "docs/04-时序特征工程核心.md", "summary": "UTC、日历特征、sin/cos、lag、rolling、数据泄漏。", "html": "<h1>04 时序特征工程核心：把时间变成模型能用的数字<\/h1>\n<p>这是整个项目最重要的一课。对应导师要求 2.3、2.5、3.1、3.2。<\/p>\n<p>先记住三个问题，后面所有内容都围绕它们：<\/p>\n<ol>\n<li><strong>时间戳怎么变成数字？<\/strong>（日历特征 + 周期编码）<\/li>\n<li><strong>怎么把\"过去发生了什么\"告诉模型？<\/strong>（滞后 + 滑动窗口）<\/li>\n<li><strong>怎么证明加了这些特征有用？<\/strong>（对照实验 + 指标 + 画图）<\/li>\n<\/ol>\n<hr />\n<h2>1. 什么是时序数据<\/h2>\n<p>时序数据 = 带时间戳、按时间排好序的记录。<\/p>\n<p>例子：<\/p>\n<table>\n<thead>\n<tr>\n<th>datetime<\/th>\n<th>pm2.5<\/th>\n<th>TEMP<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2014-01-01 00:00<\/td>\n<td>80<\/td>\n<td>-3<\/td>\n<\/tr>\n<tr>\n<td>2014-01-01 01:00<\/td>\n<td>75<\/td>\n<td>-4<\/td>\n<\/tr>\n<tr>\n<td>2014-01-01 02:00<\/td>\n<td>90<\/td>\n<td>-4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>普通表格数据可以打乱顺序，时序数据<strong>不能随便打乱<\/strong>，因为顺序本身就是信息。<\/p>\n<h3>常见时间粒度<\/h3>\n<table>\n<thead>\n<tr>\n<th>粒度<\/th>\n<th>例子<\/th>\n<th>周期长度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>小时<\/td>\n<td>每小时 PM2.5<\/td>\n<td>24（一天）、168（一周）<\/td>\n<\/tr>\n<tr>\n<td>天<\/td>\n<td>每天销量<\/td>\n<td>7（一周）、365（一年）<\/td>\n<\/tr>\n<tr>\n<td>分钟<\/td>\n<td>股票、外卖订单<\/td>\n<td>60、1440<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>2. UTC：为什么时间戳最好统一<\/h2>\n<p>UTC 是世界统一时间。不同国家有不同时区：<\/p>\n<ul>\n<li>北京：UTC+8；<\/li>\n<li>伦敦：UTC+0（夏令时 UTC+1）；<\/li>\n<li>纽约：UTC-5（夏令时 UTC-4）。<\/li>\n<\/ul>\n<p>如果两份数据一个用北京时间、一个用 UTC，直接合并就会错 8 小时。统一用 UTC 最省事。<\/p>\n<h3>代码怎么写<\/h3>\n<pre><code class=\"language-python\"># 情况 1：原始时间本来就是 UTC\ndf[&quot;datetime&quot;] = pd.to_datetime(df[[&quot;year&quot;, &quot;month&quot;, &quot;day&quot;, &quot;hour&quot;]])\ndf[&quot;datetime&quot;] = df[&quot;datetime&quot;].dt.tz_localize(&quot;UTC&quot;)\n\n# 情况 2：原始时间是北京时间，想转成 UTC\ndf[&quot;datetime&quot;] = pd.to_datetime(df[&quot;datetime&quot;])\ndf[&quot;datetime&quot;] = df[&quot;datetime&quot;].dt.tz_localize(&quot;Asia/Shanghai&quot;)\ndf[&quot;datetime&quot;] = df[&quot;datetime&quot;].dt.tz_convert(&quot;UTC&quot;)\n\n# 情况 3：已经带时区，直接转换\ndf[&quot;datetime&quot;] = df[&quot;datetime&quot;].dt.tz_convert(&quot;UTC&quot;)\n<\/code><\/pre>\n<p>本项目的数据集原始时间就是 UTC。要注意：<strong>UTC 08:00 = 北京 16:00<\/strong>。\n如果你要看\"北京人的早晚高峰\"，可以再加一列：<\/p>\n<pre><code class=\"language-python\">df[&quot;hour_beijing&quot;] = (df[&quot;hour&quot;] + 8) % 24\n<\/code><\/pre>\n<p>本教程为了统一，所有小时都按 UTC 讲。<\/p>\n<hr />\n<h2>3. 先定义预测场景：t 和 t+1<\/h2>\n<p>这是最容易出错、也最重要的一步。<\/p>\n<p>我们约定：<\/p>\n<blockquote>\n<p><strong>站在时间 t（现在），用截至 t 已经知道的信息，预测 t+1（下一个小时）的 PM2.5。<\/strong><\/p>\n<\/blockquote>\n<p>把时间轴画出来：<\/p>\n<pre><code class=\"language-text\">... t-3      t-2      t-1       t        t+1      t+2 ...\n    已知      已知     已知     已知     要预测    不能看\n<\/code><\/pre>\n<ul>\n<li><code>t<\/code> 及更早的数据：可以用；<\/li>\n<li><code>t+1<\/code> 及以后的数据：绝对不能用；<\/li>\n<li>目标 <code>y<\/code> 是 <code>t+1<\/code> 的值；<\/li>\n<li>特征 <code>X<\/code> 只能从 <code>t<\/code> 及更早的时刻构造。<\/li>\n<\/ul>\n<h3>用 shift 表示<\/h3>\n<pre><code class=\"language-python\">df[&quot;y&quot;] = df[&quot;pm2.5&quot;].shift(-1)     # 目标：下一小时\ndf[&quot;lag1&quot;] = df[&quot;pm2.5&quot;].shift(1)   # 特征：上一小时\ndf[&quot;lag24&quot;] = df[&quot;pm2.5&quot;].shift(24) # 特征：昨天同一小时\n<\/code><\/pre>\n<p><code>shift(-1)<\/code> 是\"把未来的值移到当前行\"，只能用于目标 <code>y<\/code>，不能当特征。\n<code>shift(1)<\/code> 是\"把过去的值移到当前行\"，可以当特征。<\/p>\n<hr />\n<h2>4. 日历特征：把时间拆成数字<\/h2>\n<table>\n<thead>\n<tr>\n<th>特征<\/th>\n<th>怎么构造<\/th>\n<th>含义<\/th>\n<th>可能的作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>year<\/code><\/td>\n<td><code>index.year<\/code><\/td>\n<td>年份<\/td>\n<td>长期趋势（本例只有 5 年，谨慎用）<\/td>\n<\/tr>\n<tr>\n<td><code>month<\/code><\/td>\n<td><code>index.month<\/code><\/td>\n<td>1–12 月<\/td>\n<td>季节变化：冬天 PM2.5 通常更高<\/td>\n<\/tr>\n<tr>\n<td><code>day<\/code><\/td>\n<td><code>index.day<\/code><\/td>\n<td>几号<\/td>\n<td>通常作用不大，容易过拟合<\/td>\n<\/tr>\n<tr>\n<td><code>hour<\/code><\/td>\n<td><code>index.hour<\/code><\/td>\n<td>0–23 点<\/td>\n<td>一天内的规律<\/td>\n<\/tr>\n<tr>\n<td><code>dayofweek<\/code><\/td>\n<td><code>index.dayofweek<\/code><\/td>\n<td>0=周一…6=周日<\/td>\n<td>工作日/周末差异<\/td>\n<\/tr>\n<tr>\n<td><code>is_weekend<\/code><\/td>\n<td><code>dayofweek &gt;= 5<\/code><\/td>\n<td>0/1<\/td>\n<td>更直接地告诉模型\"这是周末\"<\/td>\n<\/tr>\n<tr>\n<td><code>dayofyear<\/code><\/td>\n<td><code>index.dayofyear<\/code><\/td>\n<td>1–366<\/td>\n<td>季节位置，比 month 细<\/td>\n<\/tr>\n<tr>\n<td><code>weekofyear<\/code><\/td>\n<td><code>index.isocalendar().week<\/code><\/td>\n<td>一年中的第几周<\/td>\n<td>周期性任务常用<\/td>\n<\/tr>\n<tr>\n<td><code>quarter<\/code><\/td>\n<td><code>index.quarter<\/code><\/td>\n<td>季度<\/td>\n<td>粗粒度的季节<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>例子：为什么\"周末特征\"可能有用<\/h3>\n<p>如果共享单车数据里，周末的骑行量明显高于工作日，那么 <code>is_weekend<\/code> 就能帮模型预测\"周末销量高\"。\n如果数据里周末和工作日没差别，这个特征就没用——<strong>有没有用要用实验判断，不能靠感觉。<\/strong><\/p>\n<hr />\n<h2>5. 周期编码：sin/cos 到底在干什么<\/h2>\n<h3>问题：23 点和 0 点明明是邻居<\/h3>\n<p>如果直接把 <code>hour<\/code> 当成一个数字：<\/p>\n<pre><code class=\"language-text\">0, 1, 2, ..., 22, 23\n<\/code><\/pre>\n<p>模型会认为 0 和 23 相差 23，非常远。但实际上 23:00 的下一小时就是 00:00，它们只差 1。<\/p>\n<h3>解决：把时间放到一个圆上<\/h3>\n<pre><code class=\"language-python\">df[&quot;hour_sin&quot;] = np.sin(2 * np.pi * df[&quot;hour&quot;] / 24)\ndf[&quot;hour_cos&quot;] = np.cos(2 * np.pi * df[&quot;hour&quot;] / 24)\n<\/code><\/pre>\n<ul>\n<li><code>sin<\/code> 和 <code>cos<\/code> 一起用，才能唯一确定圆上的位置；<\/li>\n<li>23 点和 0 点在圆上非常接近；<\/li>\n<li>同理，星期用 7，月份用 12：<\/li>\n<\/ul>\n<pre><code class=\"language-python\">df[&quot;dayofweek_sin&quot;] = np.sin(2 * np.pi * df[&quot;dayofweek&quot;] / 7)\ndf[&quot;dayofweek_cos&quot;] = np.cos(2 * np.pi * df[&quot;dayofweek&quot;] / 7)\n\ndf[&quot;month_sin&quot;] = np.sin(2 * np.pi * (df[&quot;month&quot;] - 1) / 12)\ndf[&quot;month_cos&quot;] = np.cos(2 * np.pi * (df[&quot;month&quot;] - 1) / 12)\n<\/code><\/pre>\n<h3>什么时候特别有用<\/h3>\n<ul>\n<li>线性回归、逻辑回归等线性模型：非常有用，因为它们不会自己理解\"循环\"；<\/li>\n<li>树模型（随机森林、XGBoost）：也有用，但没那么关键，因为树可以自己切分。<\/li>\n<\/ul>\n<h3>实验结论怎么写<\/h3>\n<p>在本项目里：<\/p>\n<table>\n<thead>\n<tr>\n<th>写法<\/th>\n<th>好不好<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"sin/cos 一定比原始 hour 好\"<\/td>\n<td>❌ 太绝对<\/td>\n<\/tr>\n<tr>\n<td>\"在这个数据、线性回归、这段测试期上，周期编码让 R² 从 0.0286 变成 0.0331，MAE 略增\"<\/td>\n<td>✅ 具体、诚实<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>6. 滞后特征 lag：把过去的值搬过来<\/h2>\n<h3>核心代码<\/h3>\n<pre><code class=\"language-python\">df[&quot;pm25_now&quot;] = df[&quot;pm2.5&quot;]          # 当前小时（t）\ndf[&quot;pm25_lag1&quot;] = df[&quot;pm2.5&quot;].shift(1)  # 上一小时（t-1）\ndf[&quot;pm25_lag2&quot;] = df[&quot;pm2.5&quot;].shift(2)  # t-2\ndf[&quot;pm25_lag3&quot;] = df[&quot;pm2.5&quot;].shift(3)  # t-3\ndf[&quot;pm25_lag24&quot;] = df[&quot;pm2.5&quot;].shift(24)   # 昨天同一小时\ndf[&quot;pm25_lag168&quot;] = df[&quot;pm2.5&quot;].shift(168) # 上周同一小时（24*7）\n<\/code><\/pre>\n<h3>为什么要选 24 和 168<\/h3>\n<ul>\n<li>24 小时 = 一天，捕捉\"日周期\"；<\/li>\n<li>168 小时 = 一周，捕捉\"周周期\"；<\/li>\n<li>1、2、3 小时捕捉\"短期惯性\"（刚才污染高，下一小时可能还高）。<\/li>\n<\/ul>\n<h3>时间对齐表（一定要会看）<\/h3>\n<table>\n<thead>\n<tr>\n<th>datetime<\/th>\n<th>pm2.5（当前）<\/th>\n<th>lag1<\/th>\n<th>lag24<\/th>\n<th>pm25_next（目标）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01-09 08:00<\/td>\n<td>93<\/td>\n<td>106<\/td>\n<td>66<\/td>\n<td>84<\/td>\n<\/tr>\n<tr>\n<td>01-09 09:00<\/td>\n<td>84<\/td>\n<td>93<\/td>\n<td>92<\/td>\n<td>73<\/td>\n<\/tr>\n<tr>\n<td>01-09 10:00<\/td>\n<td>73<\/td>\n<td>84<\/td>\n<td>135<\/td>\n<td>66<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>看第二行：当前是 09:00，lag1 是 08:00 的 93，lag24 是昨天 09:00 的 92，\n目标是 10:00 的 73。<strong>特征全部来自 09:00 及以前，目标来自 10:00。<\/strong><\/p>\n<h3>常见错误<\/h3>\n<table>\n<thead>\n<tr>\n<th>错误<\/th>\n<th>后果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>用 <code>shift(-1)<\/code> 造特征<\/td>\n<td>直接把答案喂给模型<\/td>\n<\/tr>\n<tr>\n<td>先 <code>dropna()<\/code> 再 <code>shift()<\/code><\/td>\n<td>时间轴断裂，lag24 不再是 24 小时前<\/td>\n<\/tr>\n<tr>\n<td>随机切分后再看 lag<\/td>\n<td>训练集里混进了未来的时间<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>7. 滑动窗口 rolling：看最近一段时间的整体情况<\/h2>\n<h3>核心代码<\/h3>\n<pre><code class=\"language-python\">window24 = df[&quot;pm2.5&quot;].rolling(window=24, min_periods=18)\ndf[&quot;pm25_roll24_mean&quot;] = window24.mean()   # 最近 24 小时平均\ndf[&quot;pm25_roll24_std&quot;] = window24.std()     # 最近的波动大小\ndf[&quot;pm25_roll24_max&quot;] = window24.max()     # 最近最高\ndf[&quot;pm25_roll24_min&quot;] = window24.min()     # 最近最低\n\nwindow168 = df[&quot;pm2.5&quot;].rolling(window=168, min_periods=120)\ndf[&quot;pm25_roll168_mean&quot;] = window168.mean() # 最近一周平均\ndf[&quot;pm25_roll168_std&quot;] = window168.std()   # 最近一周波动\n<\/code><\/pre>\n<h3>窗口是\"过去\"还是\"未来\"？<\/h3>\n<table>\n<thead>\n<tr>\n<th>写法<\/th>\n<th>窗口包含<\/th>\n<th>预测 t+1 时安全吗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>rolling(24)<\/code>（默认）<\/td>\n<td>t-23 … t<\/td>\n<td>✅ 安全<\/td>\n<\/tr>\n<tr>\n<td><code>rolling(24, center=True)<\/code><\/td>\n<td>t-11 … t+12<\/td>\n<td>❌ 包含未来，泄漏<\/td>\n<\/tr>\n<tr>\n<td><code>rolling(24).shift(1)<\/code><\/td>\n<td>t-24 … t-1<\/td>\n<td>✅ 更保守<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>记住：<code>rolling<\/code> 默认是<strong>向过去看<\/strong>（trailing window）。<code>center=True<\/code> 会把窗口挪到中间，就会看到未来。<\/p>\n<h3>min_periods 是什么<\/h3>\n<p>数据里有缺失时，窗口里可能不是 24 个都有值。<\/p>\n<ul>\n<li><code>min_periods=24<\/code>：必须 24 个全有值，否则给 NaN；<\/li>\n<li><code>min_periods=18<\/code>：至少有 18 个值就算平均，容忍少量缺失。<\/li>\n<\/ul>\n<p>本项目用了 <code>min_periods=18<\/code>（24 小时窗口）和 <code>120<\/code>（168 小时窗口），\n因为数据里有长缺口，太严格会丢掉太多行；但也不能太松，只靠一两个值硬算平均没有意义。<\/p>\n<h3>mean / std / max / min 分别在说什么<\/h3>\n<table>\n<thead>\n<tr>\n<th>统计量<\/th>\n<th>一句话<\/th>\n<th>可能的作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>mean<\/td>\n<td>最近整体水平<\/td>\n<td>污染是一直高还是最近才高<\/td>\n<\/tr>\n<tr>\n<td>std<\/td>\n<td>最近波动大不大<\/td>\n<td>天气不稳定、污染变化剧烈<\/td>\n<\/tr>\n<tr>\n<td>max<\/td>\n<td>最近的峰值<\/td>\n<td>是否出现过极端污染<\/td>\n<\/tr>\n<tr>\n<td>min<\/td>\n<td>最近的谷值<\/td>\n<td>最干净的时候有多干净<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>8. 差分 diff：变化量<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_diff1&quot;] = df[&quot;pm2.5&quot;].diff(1)   # 比上一小时高多少\ndf[&quot;pm25_diff24&quot;] = df[&quot;pm2.5&quot;].diff(24) # 比昨天同一小时高多少\n<\/code><\/pre>\n<p>差分之后，数据变成\"变化量\"：<\/p>\n<ul>\n<li>正数：升高了；<\/li>\n<li>负数：降低了；<\/li>\n<li>接近 0：平稳。<\/li>\n<\/ul>\n<p>差分的价值：有些模型更擅长预测\"变化\"，而不是\"绝对值\"；差分也能让突变、异常点更明显。<\/p>\n<hr />\n<h2>9. 趋势、周期、异常点<\/h2>\n<h3>趋势（trend）<\/h3>\n<p>长期往上或往下。比如 5 年里 PM2.5 总体下降，说明治理有效。<\/p>\n<p>怎么看：把数据按天/月重采样，画折线，或者看 7 天滑动平均。<\/p>\n<h3>周期（seasonality / periodicity）<\/h3>\n<p>固定间隔重复出现：<\/p>\n<ul>\n<li>日周期：24 小时；<\/li>\n<li>周周期：7 天；<\/li>\n<li>年周期：12 个月。<\/li>\n<\/ul>\n<p>怎么看：按小时/星期/月份 <code>groupby().mean()<\/code>，或者画柱状图。<\/p>\n<h3>异常点（outlier）<\/h3>\n<p>突然特别高或特别低的值。可能是：<\/p>\n<ul>\n<li>真实事件（沙尘暴、暴雨、节假日）；<\/li>\n<li>数据错误（传感器故障、录入错误）。<\/li>\n<\/ul>\n<p>处理异常点要谨慎：不要一看到大值就删。先查清楚它是不是真实发生的。<\/p>\n<hr />\n<h2>10. 缺失值：怎么处理才不心虚<\/h2>\n<p>本项目的数据里 <code>pm2.5<\/code> 有 2067 个缺失（4.72%）。<\/p>\n<p>常见处理方式：<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>做法<\/th>\n<th>适合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>删除<\/td>\n<td><code>dropna()<\/code><\/td>\n<td>缺失极少，且删除不会破坏时间轴<\/td>\n<\/tr>\n<tr>\n<td>前向填充<\/td>\n<td><code>ffill()<\/code><\/td>\n<td>传感器短时中断，值变化慢<\/td>\n<\/tr>\n<tr>\n<td>线性插值<\/td>\n<td><code>interpolate(limit=6)<\/code><\/td>\n<td>短缺口，前后值之间平滑过渡<\/td>\n<\/tr>\n<tr>\n<td>保留 NaN<\/td>\n<td>让模型自己处理<\/td>\n<td>长缺口，不想瞎猜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>本项目的做法：<\/p>\n<ol>\n<li>保持完整的小时时间轴（不删行）；<\/li>\n<li>连续缺失不超过 6 小时的缺口，线性插值；<\/li>\n<li>长缺口保留为 NaN；<\/li>\n<li>建模时，哪些行用不到就删哪些行。<\/li>\n<\/ol>\n<p><strong>关键原则<\/strong>：删行会让时间轴断开，<code>shift(24)<\/code> 就会变成\"往前数 24 行\"，不再是 24 小时前。\n要么保持完整时间轴，要么显式补齐时间轴。<\/p>\n<hr />\n<h2>11. 数据泄漏：时序任务最容易犯的错<\/h2>\n<p>数据泄漏 = 模型在训练/预测时，用到了它在真实场景里不可能知道的信息。<\/p>\n<h3>常见泄漏方式<\/h3>\n<table>\n<thead>\n<tr>\n<th>泄漏方式<\/th>\n<th>例子<\/th>\n<th>为什么错<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>未来值当特征<\/td>\n<td>用 <code>pm25_next<\/code> 预测 <code>pm25_next<\/code><\/td>\n<td>直接看答案<\/td>\n<\/tr>\n<tr>\n<td>中心滑动窗口<\/td>\n<td><code>rolling(24, center=True)<\/code><\/td>\n<td>窗口包含 t+1、t+2<\/td>\n<\/tr>\n<tr>\n<td>全量数据算统计量<\/td>\n<td>用整段数据的均值填充缺失<\/td>\n<td>用到了未来<\/td>\n<\/tr>\n<tr>\n<td>随机切分<\/td>\n<td><code>train_test_split(shuffle=True)<\/code><\/td>\n<td>训练集混入未来时间段<\/td>\n<\/tr>\n<tr>\n<td>先处理再切分<\/td>\n<td>先在全量数据上标准化，再切训练/测试<\/td>\n<td>标准化用到了测试集信息<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>加特征前的\"三问\"<\/h3>\n<ol>\n<li><strong>在预测那一刻，这个数真的拿得到吗？<\/strong>（t 时知道吗）<\/li>\n<li><strong>它有没有用到 t+1 或更晚的数据？<\/strong><\/li>\n<li><strong>训练/测试是不是按时间切的？<\/strong><\/li>\n<\/ol>\n<p>三个问题只要有一个答案是\"不确定\"，就先不要加这个特征。<\/p>\n<h3>为什么泄漏很危险<\/h3>\n<p>泄漏的特征会让测试分数看起来很好，但上线以后一塌糊涂。\n本项目的第 9 课专门做了一个\"把答案当特征\"的实验：它的 R² = 1.0000，看起来完美，但完全没用。\n<strong>分数好得反常时，第一反应应该是\"我是不是泄漏了\"。<\/strong><\/p>\n<hr />\n<h2>12. 怎么判断一个特征到底有没有用<\/h2>\n<h3>方法 1：对照实验<\/h3>\n<p>保持数据、模型、切分方式不变，只改特征：<\/p>\n<pre><code class=\"language-text\">模型 A：只用时间特征          → MAE = ?\n模型 B：时间 + 滞后            → MAE = ?\n模型 C：时间 + 滞后 + 滑动窗口 → MAE = ?\n<\/code><\/pre>\n<h3>方法 2：消融实验（ablation）<\/h3>\n<p>从完整特征里拿掉一组，看指标变差多少：<\/p>\n<pre><code class=\"language-text\">完整特征       → MAE = 10.75\n去掉滞后       → MAE = 33.38   （变差很多，说明滞后很重要）\n去掉滑动窗口   → MAE = 10.80   （几乎没变）\n去掉天气       → MAE = 10.89   （影响很小）\n只留时间特征   → MAE = 62.66   （变差巨大）\n<\/code><\/pre>\n<h3>方法 3：画图<\/h3>\n<p>把预测值和真实值画在一起。如果预测线明显更贴近真实线，说明特征有用。<\/p>\n<h3>方法 4：看系数 / 重要性（参考）<\/h3>\n<p>线性回归的系数、树模型的特征重要性都能看，但有两点注意：<\/p>\n<ul>\n<li>特征之间高度相关时，重要性会被分散；<\/li>\n<li>相关不等于因果，不能写\"因为加了 TEMP 所以污染下降\"。<\/li>\n<\/ul>\n<h3>结论模板<\/h3>\n<blockquote>\n<p>在这个数据集上，和前一组特征相比，加入 <strong><em>_ 后 MAE 从 <\/em><\/strong>_ 变为 <strong><em>_，R² 从 <\/em><\/strong>_ 变为 <strong><em>_。\n因此 <\/em><\/strong>_ 特征在这个任务中有帮助 / 帮助不大。\n需要说明的是，这只是线性回归在这段测试期上的结果，换模型或换时间段可能不同。<\/p>\n<\/blockquote>\n<hr />\n<h2>13. 特征笔记模板<\/h2>\n<p>每学一个特征，复制这张表：<\/p>\n<table>\n<thead>\n<tr>\n<th>项目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>特征名<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>怎么构造<\/td>\n<td>写代码<\/td>\n<\/tr>\n<tr>\n<td>一句话含义<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>我期望它有什么用<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>实验证据<\/td>\n<td>哪一组对比，指标变化多少<\/td>\n<\/tr>\n<tr>\n<td>结论<\/td>\n<td>保留 / 不保留 / 不确定，为什么<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>填满 5–8 个特征，你的笔记就足够交给导师了。<\/p>\n<hr />\n<h2>14. 本课检查点<\/h2>\n<ul>\n<li>[ ] 我能解释 UTC，并说出北京时间和 UTC 的关系；<\/li>\n<li>[ ] 我能画出 t、t+1、lag1、lag24 的时间对齐；<\/li>\n<li>[ ] 我能写出 hour 的 sin/cos 公式；<\/li>\n<li>[ ] 我能说出 trailing 和 centered 窗口的区别；<\/li>\n<li>[ ] 我能说出至少 3 种数据泄漏；<\/li>\n<li>[ ] 我能用 MAE/R² 的前后变化判断一个特征有没有用。<\/li>\n<\/ul>\n<p>下一课：<code>05-建模与实验.md<\/code>。<\/p>", "plain": "04 时序特征工程核心：把时间变成模型能用的数字 这是整个项目最重要的一课。对应导师要求 2.3、2.5、3.1、3.2。 先记住三个问题，后面所有内容都围绕它们： 时间戳怎么变成数字？ （日历特征 + 周期编码） 怎么把\"过去发生了什么\"告诉模型？ （滞后 + 滑动窗口） 怎么证明加了这些特征有用？ （对照实验 + 指标 + 画图） 1. 什么是时序数据 时序数据 = 带时间戳、按时间排好序的记录。 例子： datetime pm2.5 TEMP 2014-01-01 00:00 80 -3 2014-01-01 01:00 75 -4 2014-01-01 02:00 90 -4 普通表格数据可以打乱顺序，时序数据 不能随便打乱 ，因为顺序本身就是信息。 常见时间粒度 粒度 例子 周期长度 小时 每小时 PM2.5 24（一天）、168（一周） 天 每天销量 7（一周）、365（一年） 分钟 股票、外卖订单 60、1440 2. UTC：为什么时间戳最好统一 UTC 是世界统一时间。不同国家有不同时区： 北京：UTC+8； 伦敦：UTC+0（夏令时 UTC+1）； 纽约：UTC-5（夏令时 UTC-4）。 如果两份数据一个用北京时间、一个用 UTC，直接合并就会错 8 小时。统一用 UTC 最省事。 代码怎么写 # 情况 1：原始时间本来就是 UTC df[\"datetime\"] = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]]) df[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"UTC\") # 情况 2：原始时间是北京时间，想转成 UTC df[\"datetime\"] = pd.to_datetime(df[\"datetime\"]) df[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"Asia/Shanghai\") df[\"datetime\"] = df[\"datetime\"].dt.tz_convert(\"UTC\") # 情况 3：已经带时区，直接转换 df[\"datetime\"] = df[\"datetime\"].dt.tz_convert(\"UTC\") 本项目的数据集原始时间就是 UTC。要注意： UTC 08:00 = 北京 16:00 。 如果你要看\"北京人的早晚高峰\"，可以再加一列： df[\"hour_beijing\"] = (df[\"hour\"] + 8) % 24 本教程为了统一，所有小时都按 UTC 讲。 3. 先定义预测场景：t 和 t+1 这是最容易出错、也最重要的一步。 我们约定： 站在时间 t（现在），用截至 t 已经知道的信息，预测 t+1（下一个小时）的 PM2.5。 把时间轴画出来： ... t-3 t-2 t-1 t t+1 t+2 ... 已知 已知 已知 已知 要预测 不能看 t 及更早的数据：可以用； t+1 及以后的数据：绝对不能用； 目标 y 是 t+1 的值； 特征 X 只能从 t 及更早的时刻构造。 用 shift 表示 df[\"y\"] = df[\"pm2.5\"].shift(-1) # 目标：下一小时 df[\"lag1\"] = df[\"pm2.5\"].shift(1) # 特征：上一小时 df[\"lag24\"] = df[\"pm2.5\"].shift(24) # 特征：昨天同一小时 shift(-1) 是\"把未来的值移到当前行\"，只能用于目标 y ，不能当特征。 shift(1) 是\"把过去的值移到当前行\"，可以当特征。 4. 日历特征：把时间拆成数字 特征 怎么构造 含义 可能的作用 year index.year 年份 长期趋势（本例只有 5 年，谨慎用） month index.month 1–12 月 季节变化：冬天 PM2.5 通常更高 day index.day 几号 通常作用不大，容易过拟合 hour index.hour 0–23 点 一天内的规律 dayofweek index.dayofweek 0=周一…6=周日 工作日/周末差异 is_weekend dayofweek >= 5 0/1 更直接地告诉模型\"这是周末\" dayofyear index.dayofyear 1–366 季节位置，比 month 细 weekofyear index.isocalendar().week 一年中的第几周 周期性任务常用 quarter index.quarter 季度 粗粒度的季节 例子：为什么\"周末特征\"可能有用 如果共享单车数据里，周末的骑行量明显高于工作日，那么 is_weekend 就能帮模型预测\"周末销量高\"。 如果数据里周末和工作日没差别，这个特征就没用—— 有没有用要用实验判断，不能靠感觉。 5. 周期编码：sin/cos 到底在干什么 问题：23 点和 0 点明明是邻居 如果直接把 hour 当成一个数字： 0, 1, 2, ..., 22, 23 模型会认为 0 和 23 相差 23，非常远。但实际上 23:00 的下一小时就是 00:00，它们只差 1。 解决：把时间放到一个圆上 df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24) df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24) sin 和 cos 一起用，才能唯一确定圆上的位置； 23 点和 0 点在圆上非常接近； 同理，星期用 7，月份用 12： df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7) df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7) df[\"month_sin\"] = np.sin(2 * np.pi * (df[\"month\"] - 1) / 12) df[\"month_cos\"] = np.cos(2 * np.pi * (df[\"month\"] - 1) / 12) 什么时候特别有用 线性回归、逻辑回归等线性模型：非常有用，因为它们不会自己理解\"循环\"； 树模型（随机森林、XGBoost）：也有用，但没那么关键，因为树可以自己切分。 实验结论怎么写 在本项目里： 写法 好不好 \"sin/cos 一定比原始 hour 好\" ❌ 太绝对 \"在这个数据、线性回归、这段测试期上，周期编码让 R² 从 0.0286 变成 0.0331，MAE 略增\" ✅ 具体、诚实 6. 滞后特征 lag：把过去的值搬过来 核心代码 df[\"pm25_now\"] = df[\"pm2.5\"] # 当前小时（t） df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1) # 上一小时（t-1） df[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2) # t-2 df[\"pm25_lag3\"] = df[\"pm2.5\"].shift(3) # t-3 df[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24) # 昨天同一小时 df[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168) # 上周同一小时（24*7） 为什么要选 24 和 168 24 小时 = 一天，捕捉\"日周期\"； 168 小时 = 一周，捕捉\"周周期\"； 1、2、3 小时捕捉\"短期惯性\"（刚才污染高，下一小时可能还高）。 时间对齐表（一定要会看） datetime pm2.5（当前） lag1 lag24 pm25_next（目标） 01-09 08:00 93 106 66 84 01-09 09:00 84 93 92 73 01-09 10:00 73 84 135 66 看第二行：当前是 09:00，lag1 是 08:00 的 93，lag24 是昨天 09:00 的 92， 目标是 10:00 的 73。 特征全部来自 09:00 及以前，目标来自 10:00。 常见错误 错误 后果 用 shift(-1) 造特征 直接把答案喂给模型 先 dropna() 再 shift() 时间轴断裂，lag24 不再是 24 小时前 随机切分后再看 lag 训练集里混进了未来的时间 7. 滑动窗口 rolling：看最近一段时间的整体情况 核心代码 window24 = df[\"pm2.5\"].rolling(window=24, min_periods=18) df[\"pm25_roll24_mean\"] = window24.mean() # 最近 24 小时平均 df[\"pm25_roll24_std\"] = window24.std() # 最近的波动大小 df[\"pm25_roll24_max\"] = window24.max() # 最近最高 df[\"pm25_roll24_min\"] = window24.min() # 最近最低 window168 = df[\"pm2.5\"].rolling(window=168, min_periods=120) df[\"pm25_roll168_mean\"] = window168.mean() # 最近一周平均 df[\"pm25_roll168_std\"] = window168.std() # 最近一周波动 窗口是\"过去\"还是\"未来\"？ 写法 窗口包含 预测 t+1 时安全吗 rolling(24) （默认） t-23 … t ✅ 安全 rolling(24, center=True) t-11 … t+12 ❌ 包含未来，泄漏 rolling(24).shift(1) t-24 … t-1 ✅ 更保守 记住： rolling 默认是 向过去看 （trailing window）。 center=True 会把窗口挪到中间，就会看到未来。 min_periods 是什么 数据里有缺失时，窗口里可能不是 24 个都有值。 min_periods=24 ：必须 24 个全有值，否则给 NaN； min_periods=18 ：至少有 18 个值就算平均，容忍少量缺失。 本项目用了 min_periods=18 （24 小时窗口）和 120 （168 小时窗口）， 因为数据里有长缺口，太严格会丢掉太多行；但也不能太松，只靠一两个值硬算平均没有意义。 mean / std / max / min 分别在说什么 统计量 一句话 可能的作用 mean 最近整体水平 污染是一直高还是最近才高 std 最近波动大不大 天气不稳定、污染变化剧烈 max 最近的峰值 是否出现过极端污染 min 最近的谷值 最干净的时候有多干净 8. 差分 diff：变化量 df[\"pm25_diff1\"] = df[\"pm2.5\"].diff(1) # 比上一小时高多少 df[\"pm25_diff24\"] = df[\"pm2.5\"].diff(24) # 比昨天同一小时高多少 差分之后，数据变成\"变化量\"： 正数：升高了； 负数：降低了； 接近 0：平稳。 差分的价值：有些模型更擅长预测\"变化\"，而不是\"绝对值\"；差分也能让突变、异常点更明显。 9. 趋势、周期、异常点 趋势（trend） 长期往上或往下。比如 5 年里 PM2.5 总体下降，说明治理有效。 怎么看：把数据按天/月重采样，画折线，或者看 7 天滑动平均。 周期（seasonality / periodicity） 固定间隔重复出现： 日周期：24 小时； 周周期：7 天； 年周期：12 个月。 怎么看：按小时/星期/月份 groupby().mean() ，或者画柱状图。 异常点（outlier） 突然特别高或特别低的值。可能是： 真实事件（沙尘暴、暴雨、节假日）； 数据错误（传感器故障、录入错误）。 处理异常点要谨慎：不要一看到大值就删。先查清楚它是不是真实发生的。 10. 缺失值：怎么处理才不心虚 本项目的数据里 pm2.5 有 2067 个缺失（4.72%）。 常见处理方式： 方法 做法 适合 删除 dropna() 缺失极少，且删除不会破坏时间轴 前向填充 ffill() 传感器短时中断，值变化慢 线性插值 interpolate(limit=6) 短缺口，前后值之间平滑过渡 保留 NaN 让模型自己处理 长缺口，不想瞎猜 本项目的做法： 保持完整的小时时间轴（不删行）； 连续缺失不超过 6 小时的缺口，线性插值； 长缺口保留为 NaN； 建模时，哪些行用不到就删哪些行。 关键原则 ：删行会让时间轴断开， shift(24) 就会变成\"往前数 24 行\"，不再是 24 小时前。 要么保持完整时间轴，要么显式补齐时间轴。 11. 数据泄漏：时序任务最容易犯的错 数据泄漏 = 模型在训练/预测时，用到了它在真实场景里不可能知道的信息。 常见泄漏方式 泄漏方式 例子 为什么错 未来值当特征 用 pm25_next 预测 pm25_next 直接看答案 中心滑动窗口 rolling(24, center=True) 窗口包含 t+1、t+2 全量数据算统计量 用整段数据的均值填充缺失 用到了未来 随机切分 train_test_split(shuffle=True) 训练集混入未来时间段 先处理再切分 先在全量数据上标准化，再切训练/测试 标准化用到了测试集信息 加特征前的\"三问\" 在预测那一刻，这个数真的拿得到吗？ （t 时知道吗） 它有没有用到 t+1 或更晚的数据？ 训练/测试是不是按时间切的？ 三个问题只要有一个答案是\"不确定\"，就先不要加这个特征。 为什么泄漏很危险 泄漏的特征会让测试分数看起来很好，但上线以后一塌糊涂。 本项目的第 9 课专门做了一个\"把答案当特征\"的实验：它的 R² = 1.0000，看起来完美，但完全没用。 分数好得反常时，第一反应应该是\"我是不是泄漏了\"。 12. 怎么判断一个特征到底有没有用 方法 1：对照实验 保持数据、模型、切分方式不变，只改特征： 模型 A：只用时间特征 → MAE = ? 模型 B：时间 + 滞后 → MAE = ? 模型 C：时间 + 滞后 + 滑动窗口 → MAE = ? 方法 2：消融实验（ablation） 从完整特征里拿掉一组，看指标变差多少： 完整特征 → MAE = 10.75 去掉滞后 → MAE = 33.38 （变差很多，说明滞后很重要） 去掉滑动窗口 → MAE = 10.80 （几乎没变） 去掉天气 → MAE = 10.89 （影响很小） 只留时间特征 → MAE = 62.66 （变差巨大） 方法 3：画图 把预测值和真实值画在一起。如果预测线明显更贴近真实线，说明特征有用。 方法 4：看系数 / 重要性（参考） 线性回归的系数、树模型的特征重要性都能看，但有两点注意： 特征之间高度相关时，重要性会被分散； 相关不等于因果，不能写\"因为加了 TEMP 所以污染下降\"。 结论模板 在这个数据集上，和前一组特征相比，加入 _ 后 MAE 从 _ 变为 _，R² 从 _ 变为 _。 因此 _ 特征在
