这个任务中有帮助 / 帮助不大。 需要说明的是，这只是线性回归在这段测试期上的结果，换模型或换时间段可能不同。 13. 特征笔记模板 每学一个特征，复制这张表： 项目 内容 特征名 怎么构造 写代码 一句话含义 我期望它有什么用 实验证据 哪一组对比，指标变化多少 结论 保留 / 不保留 / 不确定，为什么 填满 5–8 个特征，你的笔记就足够交给导师了。 14. 本课检查点 [ ] 我能解释 UTC，并说出北京时间和 UTC 的关系； [ ] 我能画出 t、t+1、lag1、lag24 的时间对齐； [ ] 我能写出 hour 的 sin/cos 公式； [ ] 我能说出 trailing 和 centered 窗口的区别； [ ] 我能说出至少 3 种数据泄漏； [ ] 我能用 MAE/R² 的前后变化判断一个特征有没有用。 下一课： 05-建模与实验.md 。"}, {"id": "modeling", "title": "建模与实验", "group": "教程", "icon": "line-chart", "file": "docs/05-建模与实验.md", "summary": "线性回归、按时间切分、MAE/RMSE/R²、结果解读。", "html": "<h1>05 建模与实验：线性回归、切分、指标和结果解读<\/h1>\n<p>对应脚本：<\/p>\n<ul>\n<li><code>scripts/06_baseline_model.py<\/code><\/li>\n<li><code>scripts/07_cyclic_encoding.py<\/code><\/li>\n<li><code>scripts/09_model_comparison.py<\/code><\/li>\n<\/ul>\n<hr />\n<h2>1. 线性回归不是黑魔法<\/h2>\n<p>线性回归就是找一条直线（或超平面），让预测值和真实值尽量接近：<\/p>\n<pre><code class=\"language-text\">预测值 = b + a1*x1 + a2*x2 + ... + an*xn\n<\/code><\/pre>\n<ul>\n<li><code>x1, x2, ...<\/code> 是你的特征（hour、lag1、roll24_mean…）；<\/li>\n<li><code>a1, a2, ...<\/code> 是模型学到的系数；<\/li>\n<li><code>b<\/code> 是截距。<\/li>\n<\/ul>\n<p>它不神秘，就是\"给每个特征乘一个权重，再加起来\"。<\/p>\n<pre><code class=\"language-python\">from sklearn.linear_model import LinearRegression\n\nmodel = LinearRegression()\nmodel.fit(x_train, y_train)   # 学习\npred = model.predict(x_test)  # 预测\n<\/code><\/pre>\n<hr />\n<h2>2. 训练集和测试集：为什么必须按时间切<\/h2>\n<h3>正确做法<\/h3>\n<pre><code class=\"language-python\">split_index = int(len(df) * 0.8)\ntrain = df.iloc[:split_index]   # 前 80%，旧数据\ntest = df.iloc[split_index:]    # 后 20%，新数据\n<\/code><\/pre>\n<p>用过去的数据学习，用未来的数据考试。这才像真实场景。<\/p>\n<h3>错误做法<\/h3>\n<pre><code class=\"language-python\">from sklearn.model_selection import train_test_split\n\ntrain, test = train_test_split(df, test_size=0.2, shuffle=True)  # ❌ 时序数据不要这样\n<\/code><\/pre>\n<p>随机切分会让训练集里混入\"未来\"的时间段，测试集里混入\"过去\"的时间段。\n这相当于考试前把一部分考题和答案混在一起复习，分数不能代表真实水平。<\/p>\n<p>本项目的第 9 课专门把随机切分列出来作为<strong>错误示范<\/strong>。注意：错误做法不一定会让分数变高，它的问题是\"测的不是我们关心的东西\"。<\/p>\n<hr />\n<h2>3. 三个指标：MAE、RMSE、R²<\/h2>\n<p>假设真实值是 <code>[100, 120, 80]<\/code>，预测值是 <code>[90, 130, 70]<\/code>。<\/p>\n<h3>MAE（平均绝对误差）<\/h3>\n<pre><code class=\"language-text\">|100-90| + |120-130| + |80-70| = 10 + 10 + 10 = 30\nMAE = 30 / 3 = 10\n<\/code><\/pre>\n<p>一句话：<strong>平均每次预测差多少。<\/strong> 越小越好，单位和目标一样（这里是 PM2.5）。<\/p>\n<h3>RMSE（均方根误差）<\/h3>\n<p>先平方，再平均，再开根号：<\/p>\n<pre><code class=\"language-text\">sqrt((10² + 10² + 10²) / 3) = 10\n<\/code><\/pre>\n<p>平方会重罚\"差得特别离谱\"的预测。所以 RMSE 通常会比 MAE 大一点。\n如果 RMSE 远大于 MAE，说明存在少数错得很离谱的预测。<\/p>\n<h3>R²（决定系数）<\/h3>\n<pre><code class=\"language-text\">R² = 1 - (模型犯的错) / (只会猜平均值犯的错)\n<\/code><\/pre>\n<ul>\n<li><code>R² = 1<\/code>：完美预测；<\/li>\n<li><code>R² = 0<\/code>：和\"永远猜平均值\"差不多；<\/li>\n<li><code>R² &lt; 0<\/code>：比\"永远猜平均值\"还差。<\/li>\n<\/ul>\n<p>R² 的好处是跨数据集可比，坏处是它会被极端值影响。<strong>不要只看 R²。<\/strong><\/p>\n<hr />\n<h2>4. 必须有基线：平均值和持续法<\/h2>\n<h3>基线 1：平均值<\/h3>\n<pre><code class=\"language-python\">pred = [y_train.mean()] * len(y_test)\n<\/code><\/pre>\n<p>不管三七二十一，永远猜训练集的平均值。这个分数就是\"地板\"。<\/p>\n<h3>基线 2：持续法（persistence）<\/h3>\n<pre><code class=\"language-python\">pred = test[&quot;pm2.5&quot;]   # 把当前值直接当成下一小时的预测\n<\/code><\/pre>\n<p>听起来很笨，但在时间序列里非常强：如果这一小时 PM2.5 = 80，\n下一小时大概率也在 80 附近。<\/p>\n<p><strong>如果你的复杂模型还打不过持续法，就说明你的特征或模型有问题。<\/strong><\/p>\n<hr />\n<h2>5. 实验原则：一次只改一个东西<\/h2>\n<p>对比实验的基本规矩：<\/p>\n<ul>\n<li>同一份数据；<\/li>\n<li>同一段时间切分；<\/li>\n<li>同一个模型（都用线性回归）；<\/li>\n<li>同一个评价指标；<\/li>\n<li><strong>只改特征<\/strong>。<\/li>\n<\/ul>\n<p>本项目第 9 课的对比：<\/p>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>特征<\/th>\n<th>切分方式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平均值基线<\/td>\n<td>无<\/td>\n<td>按时间 8:2<\/td>\n<\/tr>\n<tr>\n<td>持续法基线<\/td>\n<td>当前 pm2.5<\/td>\n<td>按时间 8:2<\/td>\n<\/tr>\n<tr>\n<td>只用原始时间特征<\/td>\n<td>month/day/hour…<\/td>\n<td>按时间 8:2<\/td>\n<\/tr>\n<tr>\n<td>只用周期编码时间<\/td>\n<td>sin/cos<\/td>\n<td>按时间 8:2<\/td>\n<\/tr>\n<tr>\n<td>周期编码 + 滞后<\/td>\n<td>+ lag/diff<\/td>\n<td>按时间 8:2<\/td>\n<\/tr>\n<tr>\n<td>完整正确版<\/td>\n<td>+ 滑动窗口 + 天气<\/td>\n<td>按时间 8:2<\/td>\n<\/tr>\n<tr>\n<td>中心滑动窗口（错误）<\/td>\n<td>包含未来值<\/td>\n<td>按时间 8:2<\/td>\n<\/tr>\n<tr>\n<td>把答案当特征（错误）<\/td>\n<td>答案<\/td>\n<td>按时间 8:2<\/td>\n<\/tr>\n<tr>\n<td>随机切分（错误）<\/td>\n<td>完整特征<\/td>\n<td>随机 8:2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>6. 本项目跑出来的真实结果（你的机器上可能略有差异）<\/h2>\n<h3>6.1 第 6 课：只用时间特征<\/h3>\n<table>\n<thead>\n<tr>\n<th>模型<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平均值基线<\/td>\n<td>69.664<\/td>\n<td>94.430<\/td>\n<td>-0.0000<\/td>\n<\/tr>\n<tr>\n<td>线性回归（时间特征）<\/td>\n<td>68.539<\/td>\n<td>93.068<\/td>\n<td>0.0286<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>解读<\/strong>：只看\"现在几月几号几点\"，几乎预测不了下一小时的 PM2.5。\nR² 从 0 提升到 0.0286，提升很小。这很正常——空气污染不是看表就能算出来的。<\/p>\n<h3>6.2 第 7 课：周期编码对比<\/h3>\n<table>\n<thead>\n<tr>\n<th>模型<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>原始数字时间<\/td>\n<td>68.539<\/td>\n<td>93.068<\/td>\n<td>0.0286<\/td>\n<\/tr>\n<tr>\n<td>周期编码时间<\/td>\n<td>68.644<\/td>\n<td>92.853<\/td>\n<td>0.0331<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>解读<\/strong>：这是一个很好的\"诚实结论\"例子。<\/p>\n<ul>\n<li>周期编码让 RMSE 略降、R² 略升；<\/li>\n<li>但 MAE 反而略微变差（68.539 → 68.644）。<\/li>\n<\/ul>\n<p>所以不能写\"周期编码全面更好\"。正确的写法是：<\/p>\n<blockquote>\n<p>周期编码让 R² 略有提升（0.0286 → 0.0331），RMSE 略有下降，\n但 MAE 基本不变甚至略增。说明在这个数据、这个模型、这段测试期上，\n周期编码的作用有限，不能夸大成\"显著提升\"。<\/p>\n<\/blockquote>\n<h3>6.3 第 9 课：完整对比<\/h3>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R²<\/th>\n<th>可信吗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平均值基线<\/td>\n<td>64.740<\/td>\n<td>82.470<\/td>\n<td>-0.0286<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>持续法基线<\/td>\n<td>10.981<\/td>\n<td>19.968<\/td>\n<td>0.9397<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>只用原始时间特征<\/td>\n<td>62.576<\/td>\n<td>81.323<\/td>\n<td>-0.0002<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>只用周期编码时间<\/td>\n<td>62.656<\/td>\n<td>80.601<\/td>\n<td>0.0175<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>周期编码 + 滞后<\/td>\n<td>10.934<\/td>\n<td>19.670<\/td>\n<td>0.9415<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>完整正确版<\/td>\n<td>10.754<\/td>\n<td>19.473<\/td>\n<td>0.9426<\/td>\n<td>✅<\/td>\n<\/tr>\n<tr>\n<td>中心滑动窗口<\/td>\n<td>10.413<\/td>\n<td>18.112<\/td>\n<td>0.9504<\/td>\n<td>❌ 泄漏<\/td>\n<\/tr>\n<tr>\n<td>把答案当特征<\/td>\n<td>0.000<\/td>\n<td>0.000<\/td>\n<td>1.0000<\/td>\n<td>❌ 作弊<\/td>\n<\/tr>\n<tr>\n<td>随机切分<\/td>\n<td>12.430<\/td>\n<td>21.106<\/td>\n<td>0.9494<\/td>\n<td>❌ 方法错<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>五个关键结论<\/strong>：<\/p>\n<ol>\n<li><strong>只靠时间特征远远不够<\/strong>。MAE 60+，R² 接近 0。<\/li>\n<li><strong>持续法非常强<\/strong>。当前值直接当预测，R² 就有 0.94。这告诉我们：PM2.5 前后两小时高度相关。<\/li>\n<li><strong>滞后特征带来最大提升<\/strong>。加入 lag 后，MAE 从 62.7 降到 10.9，几乎追平持续法。<\/li>\n<li><strong>滑动窗口和天气只带来小幅提升<\/strong>。完整版 MAE 10.754，比只用滞后好一点点（10.934 → 10.754）。<\/li>\n<li><strong>泄漏会制造假高分<\/strong>。中心滑动窗口 MAE 10.413 看起来更好，但它用了未来数据；\n   把答案当特征更是 R² = 1.0000，完全没有意义。<\/li>\n<\/ol>\n<h3>6.4 第 9 课：消融实验（拿掉一组会怎样）<\/h3>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R²<\/th>\n<th>解读<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>完整特征<\/td>\n<td>10.754<\/td>\n<td>19.473<\/td>\n<td>0.9426<\/td>\n<td>基准<\/td>\n<\/tr>\n<tr>\n<td>去掉滞后<\/td>\n<td>33.376<\/td>\n<td>45.330<\/td>\n<td>0.6892<\/td>\n<td>变差很多，滞后最重要<\/td>\n<\/tr>\n<tr>\n<td>去掉滑动窗口<\/td>\n<td>10.804<\/td>\n<td>19.511<\/td>\n<td>0.9424<\/td>\n<td>几乎没变，作用很小<\/td>\n<\/tr>\n<tr>\n<td>去掉天气<\/td>\n<td>10.885<\/td>\n<td>19.634<\/td>\n<td>0.9417<\/td>\n<td>影响很小<\/td>\n<\/tr>\n<tr>\n<td>只留时间特征<\/td>\n<td>62.656<\/td>\n<td>80.601<\/td>\n<td>0.0175<\/td>\n<td>变差巨大<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>一句话总结<\/strong>：在这个\"预测下一小时\"的任务里，<strong>最近的值（当前值、lag1）最有信息量<\/strong>；\n滑动窗口和天气是锦上添花，不是决定性的。<\/p>\n<p>这不是失败，而是一个很真实、很有价值的科研结论。<\/p>\n<hr />\n<h2>7. 为什么\"预测下一小时\"这么容易<\/h2>\n<p>因为 PM2.5 的相邻小时高度相关。今天 10:00 是 80，11:00 大概率还在 80 附近。\n持续法就抓住了这个规律。<\/p>\n<p>如果你想做一个更能体现特征工程价值的任务，可以尝试：<\/p>\n<ul>\n<li>预测 <strong>t+24<\/strong>（明天同一小时）而不是 t+1；<\/li>\n<li>预测 <strong>未来 24 小时的平均值<\/strong>；<\/li>\n<li>预测 <strong>明天是否超过某个阈值<\/strong>（变成分类问题）；<\/li>\n<li>用 <strong>多步预测<\/strong>：一次预测未来 6/12/24 小时。<\/li>\n<\/ul>\n<p>预测越远，滞后和滑动窗口的价值越明显。<\/p>\n<hr />\n<h2>8. 相关不等于因果<\/h2>\n<p>看系数的时候要小心：<\/p>\n<ul>\n<li><code>TEMP<\/code> 的系数是负的，不代表\"温度降低会导致污染\"；<\/li>\n<li>可能是冬天温度低，同时取暖排放多，两者一起变化；<\/li>\n<li>特征之间高度相关时（<code>pm25_now<\/code>、<code>lag1<\/code>、<code>roll24_mean<\/code>），系数会互相\"抢功劳\"。<\/li>\n<\/ul>\n<p>可以写：\"TEMP 与目标呈负相关\"，不要写\"TEMP 导致污染\"。<\/p>\n<hr />\n<h2>9. 实验记录怎么写<\/h2>\n<p>每条实验记录包含 5 个要素：<\/p>\n<ol>\n<li><strong>问题<\/strong>：我想验证什么？<\/li>\n<li><strong>设置<\/strong>：数据、特征组、模型、切分、指标；<\/li>\n<li><strong>结果<\/strong>：具体数字，不要只写\"变好了\"；<\/li>\n<li><strong>解释<\/strong>：为什么会有这个结果？<\/li>\n<li><strong>限制<\/strong>：这个结论在什么条件下成立？有什么没考虑到？<\/li>\n<\/ol>\n<p>模板：<\/p>\n<pre><code class=\"language-markdown\">### 实验：加入滞后特征是否有帮助\n\n- 问题：把 t-1、t-2、t-24 的值加入特征，能否提升下一小时 PM2.5 预测？\n- 设置：线性回归，前 80% 训练 / 后 20% 测试，MAE/RMSE/R²。\n- 结果：MAE 从 62.656 降到 10.934，R² 从 0.0175 升到 0.9415。\n- 解释：PM2.5 相邻小时高度相关，历史值提供了时间特征无法提供的信息。\n- 限制：只在线性回归上验证；换成树模型或预测更远的时刻，结论可能不同。\n<\/code><\/pre>\n<hr />\n<h2>10. 下一步可以尝试什么<\/h2>\n<p>按难度从易到难：<\/p>\n<ol>\n<li>把目标从 t+1 改成 t+24，看特征还好不好用；<\/li>\n<li>换模型：<code>RandomForestRegressor<\/code>、<code>HistGradientBoostingRegressor<\/code>；<\/li>\n<li>增加滞后：lag48、lag72、lag336（两周）；<\/li>\n<li>给天气变量也做滞后和滑动窗口；<\/li>\n<li>做滚动预测（walk-forward validation）：每次用过去 N 年训练，预测下一年；<\/li>\n<li>对目标做 <code>log1p<\/code> 变换，看极端值的影响是否变小；<\/li>\n<li>做分类任务：预测\"明天 PM2.5 是否超过 150\"。<\/li>\n<\/ol>\n<p>每试一个，就回到\"三问\"：<strong>这个特征在预测那一刻拿得到吗？<\/strong><\/p>\n<hr />\n<h2>11. 本课检查点<\/h2>\n<ul>\n<li>[ ] 我能用一句话解释线性回归在做什么；<\/li>\n<li>[ ] 我能说出为什么时序数据要按时间切分；<\/li>\n<li>[ ] 我能解释 MAE、RMSE、R²，并知道 R² 不是唯一标准；<\/li>\n<li>[ ] 我知道持续法基线是什么，以及它有多强；<\/li>\n<li>[ ] 我能照模板写出 3 条实验结论；<\/li>\n<li>[ ] 我知道\"相关不等于因果\"。<\/li>\n<\/ul>\n<p>下一课：<code>06-画图与Kaggle.md<\/code>。<\/p>", "plain": "05 建模与实验：线性回归、切分、指标和结果解读 对应脚本： scripts/06_baseline_model.py scripts/07_cyclic_encoding.py scripts/09_model_comparison.py 1. 线性回归不是黑魔法 线性回归就是找一条直线（或超平面），让预测值和真实值尽量接近： 预测值 = b + a1*x1 + a2*x2 + ... + an*xn x1, x2, ... 是你的特征（hour、lag1、roll24_mean…）； a1, a2, ... 是模型学到的系数； b 是截距。 它不神秘，就是\"给每个特征乘一个权重，再加起来\"。 from sklearn.linear_model import LinearRegression model = LinearRegression() model.fit(x_train, y_train) # 学习 pred = model.predict(x_test) # 预测 2. 训练集和测试集：为什么必须按时间切 正确做法 split_index = int(len(df) * 0.8) train = df.iloc[:split_index] # 前 80%，旧数据 test = df.iloc[split_index:] # 后 20%，新数据 用过去的数据学习，用未来的数据考试。这才像真实场景。 错误做法 from sklearn.model_selection import train_test_split train, test = train_test_split(df, test_size=0.2, shuffle=True) # ❌ 时序数据不要这样 随机切分会让训练集里混入\"未来\"的时间段，测试集里混入\"过去\"的时间段。 这相当于考试前把一部分考题和答案混在一起复习，分数不能代表真实水平。 本项目的第 9 课专门把随机切分列出来作为 错误示范 。注意：错误做法不一定会让分数变高，它的问题是\"测的不是我们关心的东西\"。 3. 三个指标：MAE、RMSE、R² 假设真实值是 [100, 120, 80] ，预测值是 [90, 130, 70] 。 MAE（平均绝对误差） |100-90| + |120-130| + |80-70| = 10 + 10 + 10 = 30 MAE = 30 / 3 = 10 一句话： 平均每次预测差多少。 越小越好，单位和目标一样（这里是 PM2.5）。 RMSE（均方根误差） 先平方，再平均，再开根号： sqrt((10² + 10² + 10²) / 3) = 10 平方会重罚\"差得特别离谱\"的预测。所以 RMSE 通常会比 MAE 大一点。 如果 RMSE 远大于 MAE，说明存在少数错得很离谱的预测。 R²（决定系数） R² = 1 - (模型犯的错) / (只会猜平均值犯的错) R² = 1 ：完美预测； R² = 0 ：和\"永远猜平均值\"差不多； R² < 0 ：比\"永远猜平均值\"还差。 R² 的好处是跨数据集可比，坏处是它会被极端值影响。 不要只看 R²。 4. 必须有基线：平均值和持续法 基线 1：平均值 pred = [y_train.mean()] * len(y_test) 不管三七二十一，永远猜训练集的平均值。这个分数就是\"地板\"。 基线 2：持续法（persistence） pred = test[\"pm2.5\"] # 把当前值直接当成下一小时的预测 听起来很笨，但在时间序列里非常强：如果这一小时 PM2.5 = 80， 下一小时大概率也在 80 附近。 如果你的复杂模型还打不过持续法，就说明你的特征或模型有问题。 5. 实验原则：一次只改一个东西 对比实验的基本规矩： 同一份数据； 同一段时间切分； 同一个模型（都用线性回归）； 同一个评价指标； 只改特征 。 本项目第 9 课的对比： 实验 特征 切分方式 平均值基线 无 按时间 8:2 持续法基线 当前 pm2.5 按时间 8:2 只用原始时间特征 month/day/hour… 按时间 8:2 只用周期编码时间 sin/cos 按时间 8:2 周期编码 + 滞后 + lag/diff 按时间 8:2 完整正确版 + 滑动窗口 + 天气 按时间 8:2 中心滑动窗口（错误） 包含未来值 按时间 8:2 把答案当特征（错误） 答案 按时间 8:2 随机切分（错误） 完整特征 随机 8:2 6. 本项目跑出来的真实结果（你的机器上可能略有差异） 6.1 第 6 课：只用时间特征 模型 MAE RMSE R² 平均值基线 69.664 94.430 -0.0000 线性回归（时间特征） 68.539 93.068 0.0286 解读 ：只看\"现在几月几号几点\"，几乎预测不了下一小时的 PM2.5。 R² 从 0 提升到 0.0286，提升很小。这很正常——空气污染不是看表就能算出来的。 6.2 第 7 课：周期编码对比 模型 MAE RMSE R² 原始数字时间 68.539 93.068 0.0286 周期编码时间 68.644 92.853 0.0331 解读 ：这是一个很好的\"诚实结论\"例子。 周期编码让 RMSE 略降、R² 略升； 但 MAE 反而略微变差（68.539 → 68.644）。 所以不能写\"周期编码全面更好\"。正确的写法是： 周期编码让 R² 略有提升（0.0286 → 0.0331），RMSE 略有下降， 但 MAE 基本不变甚至略增。说明在这个数据、这个模型、这段测试期上， 周期编码的作用有限，不能夸大成\"显著提升\"。 6.3 第 9 课：完整对比 实验 MAE RMSE R² 可信吗 平均值基线 64.740 82.470 -0.0286 ✅ 持续法基线 10.981 19.968 0.9397 ✅ 只用原始时间特征 62.576 81.323 -0.0002 ✅ 只用周期编码时间 62.656 80.601 0.0175 ✅ 周期编码 + 滞后 10.934 19.670 0.9415 ✅ 完整正确版 10.754 19.473 0.9426 ✅ 中心滑动窗口 10.413 18.112 0.9504 ❌ 泄漏 把答案当特征 0.000 0.000 1.0000 ❌ 作弊 随机切分 12.430 21.106 0.9494 ❌ 方法错 五个关键结论 ： 只靠时间特征远远不够 。MAE 60+，R² 接近 0。 持续法非常强 。当前值直接当预测，R² 就有 0.94。这告诉我们：PM2.5 前后两小时高度相关。 滞后特征带来最大提升 。加入 lag 后，MAE 从 62.7 降到 10.9，几乎追平持续法。 滑动窗口和天气只带来小幅提升 。完整版 MAE 10.754，比只用滞后好一点点（10.934 → 10.754）。 泄漏会制造假高分 。中心滑动窗口 MAE 10.413 看起来更好，但它用了未来数据； 把答案当特征更是 R² = 1.0000，完全没有意义。 6.4 第 9 课：消融实验（拿掉一组会怎样） 实验 MAE RMSE R² 解读 完整特征 10.754 19.473 0.9426 基准 去掉滞后 33.376 45.330 0.6892 变差很多，滞后最重要 去掉滑动窗口 10.804 19.511 0.9424 几乎没变，作用很小 去掉天气 10.885 19.634 0.9417 影响很小 只留时间特征 62.656 80.601 0.0175 变差巨大 一句话总结 ：在这个\"预测下一小时\"的任务里， 最近的值（当前值、lag1）最有信息量 ； 滑动窗口和天气是锦上添花，不是决定性的。 这不是失败，而是一个很真实、很有价值的科研结论。 7. 为什么\"预测下一小时\"这么容易 因为 PM2.5 的相邻小时高度相关。今天 10:00 是 80，11:00 大概率还在 80 附近。 持续法就抓住了这个规律。 如果你想做一个更能体现特征工程价值的任务，可以尝试： 预测 t+24 （明天同一小时）而不是 t+1； 预测 未来 24 小时的平均值 ； 预测 明天是否超过某个阈值 （变成分类问题）； 用 多步预测 ：一次预测未来 6/12/24 小时。 预测越远，滞后和滑动窗口的价值越明显。 8. 相关不等于因果 看系数的时候要小心： TEMP 的系数是负的，不代表\"温度降低会导致污染\"； 可能是冬天温度低，同时取暖排放多，两者一起变化； 特征之间高度相关时（ pm25_now 、 lag1 、 roll24_mean ），系数会互相\"抢功劳\"。 可以写：\"TEMP 与目标呈负相关\"，不要写\"TEMP 导致污染\"。 9. 实验记录怎么写 每条实验记录包含 5 个要素： 问题 ：我想验证什么？ 设置 ：数据、特征组、模型、切分、指标； 结果 ：具体数字，不要只写\"变好了\"； 解释 ：为什么会有这个结果？ 限制 ：这个结论在什么条件下成立？有什么没考虑到？ 模板： ### 实验：加入滞后特征是否有帮助 - 问题：把 t-1、t-2、t-24 的值加入特征，能否提升下一小时 PM2.5 预测？ - 设置：线性回归，前 80% 训练 / 后 20% 测试，MAE/RMSE/R²。 - 结果：MAE 从 62.656 降到 10.934，R² 从 0.0175 升到 0.9415。 - 解释：PM2.5 相邻小时高度相关，历史值提供了时间特征无法提供的信息。 - 限制：只在线性回归上验证；换成树模型或预测更远的时刻，结论可能不同。 10. 下一步可以尝试什么 按难度从易到难： 把目标从 t+1 改成 t+24，看特征还好不好用； 换模型： RandomForestRegressor 、 HistGradientBoostingRegressor ； 增加滞后：lag48、lag72、lag336（两周）； 给天气变量也做滞后和滑动窗口； 做滚动预测（walk-forward validation）：每次用过去 N 年训练，预测下一年； 对目标做 log1p 变换，看极端值的影响是否变小； 做分类任务：预测\"明天 PM2.5 是否超过 150\"。 每试一个，就回到\"三问\"： 这个特征在预测那一刻拿得到吗？ 11. 本课检查点 [ ] 我能用一句话解释线性回归在做什么； [ ] 我能说出为什么时序数据要按时间切分； [ ] 我能解释 MAE、RMSE、R²，并知道 R² 不是唯一标准； [ ] 我知道持续法基线是什么，以及它有多强； [ ] 我能照模板写出 3 条实验结论； [ ] 我知道\"相关不等于因果\"。 下一课： 06-画图与Kaggle.md 。"}, {"id": "plots-kaggle", "title": "画图与 Kaggle", "group": "教程", "icon": "image", "file": "docs/06-画图与Kaggle.md", "summary": "6 张图怎么读，以及 Kaggle 入门赛的练法。", "html": "<h1>06 画图与 Kaggle：用眼睛理解特征，用比赛练手<\/h1>\n<p>对应脚本：<code>scripts/10_plots.py<\/code>。\n对应导师要求：3.3 画图观察特征、3.4 用 Kaggle 入门赛练手。<\/p>\n<hr />\n<h2>第一部分：怎么读你生成的 6 张图<\/h2>\n<p>图片都在 <code>outputs/figures/<\/code>。<\/p>\n<h3>图 1：原始序列与趋势（<code>01_原始序列与趋势.png<\/code>）<\/h3>\n<p>上半张是 5 年的日平均 PM2.5，下半张是放大后的两周小时数据。<\/p>\n<p>要看三件事：<\/p>\n<ul>\n<li>有没有长期趋势（整体上升/下降）；<\/li>\n<li>有没有季节规律（冬天通常更高）；<\/li>\n<li>小时级数据是不是上下波动明显。<\/li>\n<\/ul>\n<h3>图 2：滑动平均与差分（<code>02_滑动平均与差分.png<\/code>）<\/h3>\n<ul>\n<li>灰色线：每天的原始值，抖动很大；<\/li>\n<li>橙色线：7 天滑动平均，把短期噪声抹平，趋势更清楚；<\/li>\n<li>绿色线：差分（今天 − 昨天），正数表示升高，负数表示降低；<\/li>\n<li>差分图上的大尖刺就是异常变化点。<\/li>\n<\/ul>\n<h3>图 3：周期性观察（<code>03_周期性观察.png<\/code>）<\/h3>\n<p>三张柱状图分别是按小时、按星期、按月份的平均 PM2.5。<\/p>\n<p>怎么判断有没有周期：<strong>柱子高低是否明显不同<\/strong>。\n如果所有柱子一样高，说明这个时间维度没有信息；如果高低差很多，说明它可能有用。<\/p>\n<p>注意：这张图用的是 UTC 小时。UTC 08:00 是北京时间 16:00。\n如果你觉得峰值时间和直觉对不上，先想一想时区。<\/p>\n<h3>图 4：预测对比（<code>04_预测对比.png<\/code>）<\/h3>\n<ul>\n<li>黑线：真实值；<\/li>\n<li>橙线：只用周期时间特征的预测，几乎是平的；<\/li>\n<li>蓝线：完整特征（滞后 + 滑动 + 天气）的预测，紧跟黑线。<\/li>\n<\/ul>\n<p>这张图最直观地说明了：<strong>滞后特征让模型从\"猜平均\"变成了\"跟着走\"。<\/strong><\/p>\n<h3>图 5：周期编码圆（<code>05_周期编码圆.png<\/code>）<\/h3>\n<p>23 个点分布在圆上，每个点是一个小时。0 点和 23 点在圆上紧挨着。\n这就是 sin/cos 编码想要表达的：\"小时是一个循环，不是一条直线。\"<\/p>\n<h3>图 6：相关性热力图（<code>06_相关性热力图.png<\/code>）<\/h3>\n<p>红色是正相关，蓝色是负相关。数值越接近 ±1 关系越强。<\/p>\n<p>第一行/第一列是 <code>pm25_next<\/code>（目标），可以看看哪些特征和它关系最近。\n但要记住：<strong>相关不代表因果，也不能只凭相关性选特征。<\/strong><\/p>\n<hr />\n<h2>第二部分：matplotlib 最小必要知识<\/h2>\n<pre><code class=\"language-python\">import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(10, 4))\nax.plot(dates, values, label=&quot;PM2.5&quot;)\nax.set_title(&quot;标题&quot;)\nax.set_xlabel(&quot;日期&quot;)\nax.set_ylabel(&quot;数值&quot;)\nax.legend()\nax.grid(alpha=0.3)\nfig.savefig(&quot;outputs/figures/my_plot.png&quot;)\nplt.close(fig)\n<\/code><\/pre>\n<ul>\n<li><code>fig<\/code>：整张画布；<\/li>\n<li><code>ax<\/code>：具体的坐标轴；<\/li>\n<li><code>plot<\/code>：画折线；<\/li>\n<li><code>bar<\/code>：画柱状图；<\/li>\n<li><code>scatter<\/code>：画散点；<\/li>\n<li><code>label<\/code> + <code>legend<\/code>：图例；<\/li>\n<li><code>savefig<\/code>：保存成图片。<\/li>\n<\/ul>\n<p>中文显示需要设置字体（本项目已经在 <code>scripts/common.py<\/code> 里统一设置）：<\/p>\n<pre><code class=\"language-python\">plt.rcParams[&quot;font.sans-serif&quot;] = [&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;]\nplt.rcParams[&quot;axes.unicode_minus&quot;] = False\n<\/code><\/pre>\n<hr />\n<h2>第三部分：Kaggle 入门赛实战<\/h2>\n<h3>1. 注册<\/h3>\n<p>打开 <a href=\"https://www.kaggle.com\">https://www.kaggle.com<\/a>，用邮箱注册。免费。<\/p>\n<h3>2. 找时间序列相关的 Playground 比赛<\/h3>\n<p>路径：<\/p>\n<pre><code class=\"language-text\">Competitions → 筛选 Playground → 搜索 time series / forecasting / sales\n<\/code><\/pre>\n<p>也可以直接搜索这些关键词：<\/p>\n<ul>\n<li><code>Store Sales Time Series Forecasting<\/code><\/li>\n<li><code>Bike Sharing Demand<\/code><\/li>\n<li><code>Tabular Playground Series<\/code>（每一期主题不同，找时间序列相关的）<\/li>\n<li><code>Web Traffic Time Series Forecasting<\/code><\/li>\n<li><code>M5 Forecasting<\/code>（经典，但可能已经结束/不可提交）<\/li>\n<\/ul>\n<p>注意：Kaggle 比赛会更新，具体名称和是否开放提交以网站为准。\n你要找的是：<strong>有明确时间列、有训练集和测试集、评价指标清楚<\/strong>的比赛。<\/p>\n<h3>3. 看懂一个比赛页面<\/h3>\n<table>\n<thead>\n<tr>\n<th>页面<\/th>\n<th>你要看什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Overview<\/td>\n<td>任务是什么、规则、时间线<\/td>\n<\/tr>\n<tr>\n<td>Data<\/td>\n<td>有哪些文件、每列什么意思、训练/测试怎么分<\/td>\n<\/tr>\n<tr>\n<td>Evaluation<\/td>\n<td>用什么指标（MAE、RMSE、SMAPE…）<\/td>\n<\/tr>\n<tr>\n<td>Code<\/td>\n<td>别人的公开 notebook<\/td>\n<\/tr>\n<tr>\n<td>Discussion<\/td>\n<td>常见坑、数据问题<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>4. 先做一个最笨的提交<\/h3>\n<p>不要一上来就冲高分。先做：<\/p>\n<ol>\n<li>读 <code>sample_submission.csv<\/code>，看提交格式；<\/li>\n<li>用训练集的平均值，或\"最后一个已知值\"作为预测；<\/li>\n<li>生成提交文件，上传一次；<\/li>\n<li>记住这个分数，它是你的基线。<\/li>\n<\/ol>\n<h3>5. 读 3 篇公开 notebook 的方法<\/h3>\n<p>不要从头到尾读代码，直接搜关键词：<\/p>\n<pre><code class=\"language-text\">feature engineering\nlag\nrolling\nshift\ncyclical\nsin\ncos\ndate\nweekday\nholiday\n<\/code><\/pre>\n<p>每读到一种特征，就问自己：<\/p>\n<ol>\n<li>他怎么构造的？<\/li>\n<li>为什么他认为这个特征有用？<\/li>\n<li>我能不能在自己的数据上复现？<\/li>\n<li>复现后指标变化多少？<\/li>\n<\/ol>\n<p>把答案写进 <code>notes/学习笔记模板.md<\/code>。<\/p>\n<h3>6. 复现一个特征的完整流程<\/h3>\n<ol>\n<li>在自己的数据上写构造代码；<\/li>\n<li>确认没有用到未来数据；<\/li>\n<li>保持模型和切分方式不变，只加这一个特征；<\/li>\n<li>记录加之前/之后的 MAE；<\/li>\n<li>写下结论：有用、没用、还是不确定。<\/li>\n<\/ol>\n<h3>7. 关于排名<\/h3>\n<p>导师的要求是\"不追求排名，着重看别人的特征工程思路\"。\n所以：<\/p>\n<ul>\n<li>排名 3000 名不丢人；<\/li>\n<li>能说清楚\"我复现了 lag 特征，MAE 从 X 降到 Y\"才是真本事；<\/li>\n<li>抄代码不理解，面试/答辩一问就露馅。<\/li>\n<\/ul>\n<h3>8. 常见的 Kaggle 时间序列特征清单<\/h3>\n<table>\n<thead>\n<tr>\n<th>类别<\/th>\n<th>特征<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>日历<\/td>\n<td>year、month、day、weekday、weekofyear、is_weekend、is_holiday<\/td>\n<\/tr>\n<tr>\n<td>周期<\/td>\n<td>hour_sin/cos、weekday_sin/cos、month_sin/cos<\/td>\n<\/tr>\n<tr>\n<td>滞后<\/td>\n<td>lag1、lag2、lag7、lag14、lag28、lag365<\/td>\n<\/tr>\n<tr>\n<td>滑动<\/td>\n<td>rolling mean/std/min/max（7、14、28 天）<\/td>\n<\/tr>\n<tr>\n<td>差分<\/td>\n<td>diff1、diff7、pct_change<\/td>\n<\/tr>\n<tr>\n<td>其他变量<\/td>\n<td>天气、促销、油价、节假日<\/td>\n<\/tr>\n<tr>\n<td>静态信息<\/td>\n<td>店铺 id、商品 id、城市（类别特征）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>注意：具体用哪些，取决于你的数据频率和业务含义。小时数据看 24/168，日数据看 7/30/365。<\/p>\n<h3>9. Kaggle 检查点<\/h3>\n<ul>\n<li>[ ] 我注册了 Kaggle；<\/li>\n<li>[ ] 我找到了一个时间序列相关的 Playground 比赛；<\/li>\n<li>[ ] 我看懂了数据文件和提交格式；<\/li>\n<li>[ ] 我做出了一次基线提交；<\/li>\n<li>[ ] 我读了至少 3 篇公开 notebook；<\/li>\n<li>[ ] 我复现了至少 1 个特征并记录了指标变化；<\/li>\n<li>[ ] 我没有直接复制别人的代码当自己的作业。<\/li>\n<\/ul>\n<hr />\n<h2>第四部分：把 Kaggle 学到的东西搬回本项目<\/h2>\n<p>如果你在 Kaggle 学到了新特征，可以回来改 <code>scripts/08_lag_rolling_features.py<\/code>：<\/p>\n<ol>\n<li>加一个新特征；<\/li>\n<li>重新运行 <code>09_model_comparison.py<\/code>；<\/li>\n<li>看消融实验有没有变化；<\/li>\n<li>把结论写进笔记。<\/li>\n<\/ol>\n<p>这就是一个完整的\"学习 → 复现 → 验证 → 记录\"闭环。\n导师想看到的正是这个，而不是一个漂亮的分数。<\/p>\n<hr />\n<p>下一课：<code>07-交作业清单与报告模板.md<\/code>。<\/p>", "plain": "06 画图与 Kaggle：用眼睛理解特征，用比赛练手 对应脚本： scripts/10_plots.py 。 对应导师要求：3.3 画图观察特征、3.4 用 Kaggle 入门赛练手。 第一部分：怎么读你生成的 6 张图 图片都在 outputs/figures/ 。 图 1：原始序列与趋势（ 01_原始序列与趋势.png ） 上半张是 5 年的日平均 PM2.5，下半张是放大后的两周小时数据。 要看三件事： 有没有长期趋势（整体上升/下降）； 有没有季节规律（冬天通常更高）； 小时级数据是不是上下波动明显。 图 2：滑动平均与差分（ 02_滑动平均与差分.png ） 灰色线：每天的原始值，抖动很大； 橙色线：7 天滑动平均，把短期噪声抹平，趋势更清楚； 绿色线：差分（今天 − 昨天），正数表示升高，负数表示降低； 差分图上的大尖刺就是异常变化点。 图 3：周期性观察（ 03_周期性观察.png ） 三张柱状图分别是按小时、按星期、按月份的平均 PM2.5。 怎么判断有没有周期： 柱子高低是否明显不同 。 如果所有柱子一样高，说明这个时间维度没有信息；如果高低差很多，说明它可能有用。 注意：这张图用的是 UTC 小时。UTC 08:00 是北京时间 16:00。 如果你觉得峰值时间和直觉对不上，先想一想时区。 图 4：预测对比（ 04_预测对比.png ） 黑线：真实值； 橙线：只用周期时间特征的预测，几乎是平的； 蓝线：完整特征（滞后 + 滑动 + 天气）的预测，紧跟黑线。 这张图最直观地说明了： 滞后特征让模型从\"猜平均\"变成了\"跟着走\"。 图 5：周期编码圆（ 05_周期编码圆.png ） 23 个点分布在圆上，每个点是一个小时。0 点和 23 点在圆上紧挨着。 这就是 sin/cos 编码想要表达的：\"小时是一个循环，不是一条直线。\" 图 6：相关性热力图（ 06_相关性热力图.png ） 红色是正相关，蓝色是负相关。数值越接近 ±1 关系越强。 第一行/第一列是 pm25_next （目标），可以看看哪些特征和它关系最近。 但要记住： 相关不代表因果，也不能只凭相关性选特征。 第二部分：matplotlib 最小必要知识 import matplotlib.pyplot as plt fig, ax = plt.subplots(figsize=(10, 4)) ax.plot(dates, values, label=\"PM2.5\") ax.set_title(\"标题\") ax.set_xlabel(\"日期\") ax.set_ylabel(\"数值\") ax.legend() ax.grid(alpha=0.3) fig.savefig(\"outputs/figures/my_plot.png\") plt.close(fig) fig ：整张画布； ax ：具体的坐标轴； plot ：画折线； bar ：画柱状图； scatter ：画散点； label + legend ：图例； savefig ：保存成图片。 中文显示需要设置字体（本项目已经在 scripts/common.py 里统一设置）： plt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\", \"SimHei\"] plt.rcParams[\"axes.unicode_minus\"] = False 第三部分：Kaggle 入门赛实战 1. 注册 打开 https://www.kaggle.com ，用邮箱注册。免费。 2. 找时间序列相关的 Playground 比赛 路径： Competitions → 筛选 Playground → 搜索 time series / forecasting / sales 也可以直接搜索这些关键词： Store Sales Time Series Forecasting Bike Sharing Demand Tabular Playground Series （每一期主题不同，找时间序列相关的） Web Traffic Time Series Forecasting M5 Forecasting （经典，但可能已经结束/不可提交） 注意：Kaggle 比赛会更新，具体名称和是否开放提交以网站为准。 你要找的是： 有明确时间列、有训练集和测试集、评价指标清楚 的比赛。 3. 看懂一个比赛页面 页面 你要看什么 Overview 任务是什么、规则、时间线 Data 有哪些文件、每列什么意思、训练/测试怎么分 Evaluation 用什么指标（MAE、RMSE、SMAPE…） Code 别人的公开 notebook Discussion 常见坑、数据问题 4. 先做一个最笨的提交 不要一上来就冲高分。先做： 读 sample_submission.csv ，看提交格式； 用训练集的平均值，或\"最后一个已知值\"作为预测； 生成提交文件，上传一次； 记住这个分数，它是你的基线。 5. 读 3 篇公开 notebook 的方法 不要从头到尾读代码，直接搜关键词： feature engineering lag rolling shift cyclical sin cos date weekday holiday 每读到一种特征，就问自己： 他怎么构造的？ 为什么他认为这个特征有用？ 我能不能在自己的数据上复现？ 复现后指标变化多少？ 把答案写进 notes/学习笔记模板.md 。 6. 复现一个特征的完整流程 在自己的数据上写构造代码； 确认没有用到未来数据； 保持模型和切分方式不变，只加这一个特征； 记录加之前/之后的 MAE； 写下结论：有用、没用、还是不确定。 7. 关于排名 导师的要求是\"不追求排名，着重看别人的特征工程思路\"。 所以： 排名 3000 名不丢人； 能说清楚\"我复现了 lag 特征，MAE 从 X 降到 Y\"才是真本事； 抄代码不理解，面试/答辩一问就露馅。 8. 常见的 Kaggle 时间序列特征清单 类别 特征 日历 year、month、day、weekday、weekofyear、is_weekend、is_holiday 周期 hour_sin/cos、weekday_sin/cos、month_sin/cos 滞后 lag1、lag2、lag7、lag14、lag28、lag365 滑动 rolling mean/std/min/max（7、14、28 天） 差分 diff1、diff7、pct_change 其他变量 天气、促销、油价、节假日 静态信息 店铺 id、商品 id、城市（类别特征） 注意：具体用哪些，取决于你的数据频率和业务含义。小时数据看 24/168，日数据看 7/30/365。 9. Kaggle 检查点 [ ] 我注册了 Kaggle； [ ] 我找到了一个时间序列相关的 Playground 比赛； [ ] 我看懂了数据文件和提交格式； [ ] 我做出了一次基线提交； [ ] 我读了至少 3 篇公开 notebook； [ ] 我复现了至少 1 个特征并记录了指标变化； [ ] 我没有直接复制别人的代码当自己的作业。 第四部分：把 Kaggle 学到的东西搬回本项目 如果你在 Kaggle 学到了新特征，可以回来改 scripts/08_lag_rolling_features.py ： 加一个新特征； 重新运行 09_model_comparison.py ； 看消融实验有没有变化； 把结论写进笔记。 这就是一个完整的\"学习 → 复现 → 验证 → 记录\"闭环。 导师想看到的正是这个，而不是一个漂亮的分数。 下一课： 07-交作业清单与报告模板.md 。"}, {"id": "handbook", "title": "知识点速查手册", "group": "教程", "icon": "book-marked", "file": "docs/08-知识点与代码速查.md", "summary": "所有知识点 + 代码 + 一句话作用，可打印；PDF 在 outputs 文件夹。", "html": "<h1>时序特征工程 · 知识点与代码速查手册<\/h1>\n<blockquote>\n<p>配套项目：<code>time-series-feature-engineering<\/code>（北京 PM2.5 实战）\n用途：把项目里用到的知识点和代码集中到一处，打印出来放在手边，写代码、写报告时对着查。\n阅读方式：左边是代码，代码下面的「作用」就是这段代码在干什么，不需要背，知道去哪儿找就行。\n重新生成 PDF：在项目根目录运行 <code>python guide\\build_handbook.py<\/code>，PDF 会输出到 <code>outputs\\知识点与代码速查.pdf<\/code>。\n打印版 PDF：<a href=\"../outputs/知识点与代码速查.pdf\">outputs/知识点与代码速查.pdf<\/a>（已经在项目里生成好了，直接打开或打印即可）。<\/p>\n<\/blockquote>\n<hr />\n<h2>怎么用这本手册<\/h2>\n<ol>\n<li><strong>先看「核心 10 句话」<\/strong>：把整个项目的骨架记住，比记住代码重要。<\/li>\n<li><strong>要写代码时，翻到对应章节<\/strong>：每一节都是「代码 + 作用」，复制过去改成自己的列名就能用。<\/li>\n<li><strong>要写报告时，看附录 A 和附录 B<\/strong>：特征怎么解释、实验结论是什么，直接抄进报告。<\/li>\n<li><strong>报错时看第 10 章<\/strong>：按错误信息查，先看原因，再看解决办法。<\/li>\n<\/ol>\n<hr />\n<h2>核心 10 句话<\/h2>\n<ol>\n<li>时序数据是带时间戳、按时间排好序的记录，<strong>顺序本身就是信息<\/strong>，不能随便打乱。<\/li>\n<li>时间戳统一用 <strong>UTC<\/strong>；北京时间 = UTC + 8。<\/li>\n<li>预测场景要先定义清楚：<strong>站在 t 时刻，用截至 t 已知的信息，预测 t+1<\/strong>。<\/li>\n<li>时间列可以拆成 <strong>年、月、日、星期、小时、是否周末<\/strong> 这些数字特征。<\/li>\n<li>小时、星期、月份用 <strong>sin/cos 周期编码<\/strong>，23 点和 0 点才会变成\"邻居\"。<\/li>\n<li><strong>lag（滞后）<\/strong> 是把过去的值挪到当前行：<code>shift(1)<\/code> 是上一小时，<code>shift(24)<\/code> 是昨天同一小时。<\/li>\n<li><strong>rolling（滑动窗口）<\/strong> 是算最近一段时间（如 24 小时）的均值、波动、最大最小值。<\/li>\n<li>任何用到了 t+1 及以后的信息，都是 <strong>数据泄漏<\/strong>，测试分数会假高。<\/li>\n<li>时序数据切分训练/测试必须 <strong>按时间前后切<\/strong>，不能随机切。<\/li>\n<li>先跑 <strong>基线<\/strong>（平均值、持续法），再谈复杂模型；指标看 <strong>MAE、RMSE、R²<\/strong>。<\/li>\n<\/ol>\n<hr />\n<h1>0. 命令速查<\/h1>\n<h2>0.1 环境：创建并激活虚拟环境<\/h2>\n<pre><code class=\"language-powershell\"># 在项目根目录（time-series-feature-engineering）执行\npython -m venv .venv                       # 创建虚拟环境\n.\\.venv\\Scripts\\Activate.ps1               # 激活（Windows PowerShell）\npip install -r requirements.txt            # 安装项目需要的库\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>虚拟环境 = 只属于这个项目的工具箱，不会污染电脑里其他 Python 项目。<\/li>\n<li>激活成功后，命令行前面会出现 <code>(.venv)<\/code>；关掉窗口就相当于退出。<\/li>\n<li>Mac/Linux 用 <code>python3 -m venv venv<\/code> 和 <code>source venv/bin/activate<\/code>。<\/li>\n<\/ul>\n<h2>0.2 运行脚本<\/h2>\n<pre><code class=\"language-powershell\">python scripts\\05_time_features.py    # 运行单个脚本\n.\\run_all.ps1                         # 一键按顺序全部运行\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>脚本按编号顺序有依赖：04 生成干净数据 → 05 加时间特征 → 08 加滞后滑窗 → 09 做模型对比。<\/li>\n<li>跳过前面的脚本直接跑 09，会提示找不到文件（<code>FileNotFoundError<\/code>）。<\/li>\n<\/ul>\n<h2>0.3 Git 与 GitHub<\/h2>\n<pre><code class=\"language-powershell\">git init                                  # 把这个文件夹变成 Git 仓库\ngit add .                                 # 把改动放进&quot;待提交&quot;区\ngit commit -m &quot;完成时间特征提取&quot;            # 存一个版本，附上说明\ngit log --oneline                         # 看历史版本\ngit remote add origin https://github.com/你的用户名/仓库名.git\ngit push -u origin main                   # 第一次推送\ngit status                                # 看当前有哪些改动（最常用）\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>Git 是\"存档 + 时间机器\"，每完成一小步就 <code>add<\/code> + <code>commit<\/code> 一次。<\/li>\n<li>GitHub 是放代码的网站，导师要的是仓库链接，不是压缩包。<\/li>\n<li><code>.gitignore<\/code> 用来排除不想上传的东西（本项目已排除 <code>.venv/<\/code>、<code>data/raw/<\/code> 等）。<\/li>\n<\/ul>\n<h2>0.4 网页指引、本地服务、生成手册<\/h2>\n<pre><code class=\"language-powershell\">python guide\\build_guide.py                                    # 重新生成网页指引\npowershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1   # 启动本地服务（能读文件夹）\npython guide\\build_handbook.py                                 # 重新生成这本手册的 PDF\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>网页指引：把教程、代码、图表、实验表格放在一个页面里看。<\/li>\n<li>本地服务：浏览器出于安全不允许网页直接读本地文件夹，<code>start-server.ps1<\/code> 会开一个只服务本机的小服务器，网页里的\"项目文件\"才能读文件夹。<\/li>\n<li>手册 PDF：改完上面的 Markdown 后跑一次，PDF 会重新生成。<\/li>\n<\/ul>\n<hr />\n<h1>1. Python 基础<\/h1>\n<p>对应脚本：<code>scripts/01_python_basics.py<\/code>；对应教程：<code>docs/02-Python零基础.md<\/code>。<\/p>\n<h2>1.1 列表 list：一串有序的数据<\/h2>\n<pre><code class=\"language-python\">values = [80, 75, 90]        # 建列表\nvalues.append(60)            # 末尾加一个\nfirst = values[0]            # 取第 1 个（下标从 0 开始）\nlast = values[-1]            # 取最后一个\nprint(len(values))           # 长度：4\nprint(values[1:3])           # 切片：第 2、3 个\n<\/code><\/pre>\n<p><strong>作用<\/strong>：存放一组有顺序的数据，比如一串连续的 PM2.5 观测值。<\/p>\n<h2>1.2 字典 dict：按名字取值<\/h2>\n<pre><code class=\"language-python\">student = {&quot;name&quot;: &quot;小明&quot;, &quot;score&quot;: 90}\nprint(student[&quot;name&quot;])            # 取值：小明\nstudent[&quot;score&quot;] = 95             # 改值\nstudent[&quot;city&quot;] = &quot;南京&quot;           # 加新的一对\nfor key, value in student.items():  # 遍历\n    print(key, value)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：用\"名字 → 值\"的方式存数据，读代码时比记 <code>[0]<\/code>、<code>[1]<\/code> 清楚得多。<\/p>\n<h2>1.3 队列 deque：先进先出<\/h2>\n<pre><code class=\"language-python\">from collections import deque\n\nwindow = deque(maxlen=3)      # 只保留最近 3 个\nfor value in [10, 20, 30, 40]:\n    window.append(value)\nprint(window)                 # deque([20, 30, 40], maxlen=3)\nprint(window[0])              # 最早的那个：20\n<\/code><\/pre>\n<p><strong>作用<\/strong>：维护\"最近 N 个值\"的滑动窗口；<code>maxlen<\/code> 会自动丢掉最旧的，这是滑动窗口最朴素的手写版本。<\/p>\n<h2>1.4 循环、条件、函数<\/h2>\n<pre><code class=\"language-python\">def level(pm25: float) -&gt; str:     # 函数：输入 → 输出\n    if pm25 &gt; 150:\n        return &quot;重度污染&quot;\n    elif pm25 &gt; 75:\n        return &quot;轻度污染&quot;\n    return &quot;正常&quot;\n\nfor value in [30, 90, 200]:\n    print(value, level(value))\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>函数把一段逻辑包起来，起个名字，后面重复用；<code>pm25: float<\/code> 和 <code>-&gt; str<\/code> 只是提示类型，不写也能跑。<\/li>\n<li><code>for<\/code> 用来遍历一串数据，<code>if/elif/else<\/code> 用来分支判断。<\/li>\n<\/ul>\n<h2>1.5 读文件、写文件<\/h2>\n<pre><code class=\"language-python\"># 读：with 会在用完以后自动关文件，推荐写法\nwith open(&quot;notes/学习笔记模板.md&quot;, &quot;r&quot;, encoding=&quot;utf-8&quot;) as handle:\n    text = handle.read()\nprint(text[:200])                 # 只看前 200 个字符\n\n# 写：w 表示覆盖写，a 表示在末尾追加\nwith open(&quot;outputs/notes.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as handle:\n    handle.write(&quot;第一行\\n第二行\\n&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>读写文件都要指定 <code>encoding=\"utf-8\"<\/code>，否则中文在 Windows 上容易乱码。<\/li>\n<li>读 CSV 这种表格数据时，用 pandas 更方便（见第 2 章）。<\/li>\n<\/ul>\n<h2>1.6 报错怎么读<\/h2>\n<pre><code class=\"language-python\"># 报错最后一行才是&quot;错误类型 + 原因&quot;，先看它，再看它上面一行指出的是哪个文件哪一行\n# 例：\n#   File &quot;scripts\\05_time_features.py&quot;, line 42\n#     df[&quot;hour_sin&quot;] = np.sin(2 * np.pi * df[&quot;hour&quot;] / 24)\n#   KeyError: 'hour'\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>KeyError: 'hour'<\/code> 意思是没有名为 <code>hour<\/code> 的列 —— 通常是你忘了先运行 04/05 脚本，或者列名拼错了。<\/li>\n<li>详细对照表见第 10 章。<\/li>\n<\/ul>\n<hr />\n<h1>2. pandas 基础<\/h1>\n<p>对应脚本：<code>scripts/02_pandas_basics.py<\/code>；对应教程：<code>docs/03-pandas与SQLite.md<\/code>。<\/p>\n<h2>2.1 读 CSV<\/h2>\n<pre><code class=\"language-python\">import pandas as pd\n\ndf = pd.read_csv(&quot;data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv&quot;)\nprint(df.shape)        # (行数, 列数)\nprint(df.head())       # 看前 5 行\nprint(df.info())       # 每列的类型、缺失情况\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>pd.read_csv<\/code> 把 CSV 读成 DataFrame（可以理解成\"程序里的 Excel 表格\"）。<\/li>\n<li>第一步永远先 <code>shape<\/code> / <code>head<\/code> / <code>info<\/code>：先看清数据长什么样，再动手。<\/li>\n<\/ul>\n<h2>2.2 选列、筛行、新增列<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm2.5&quot;]                    # 选一列（Series）\ndf[[&quot;year&quot;, &quot;month&quot;, &quot;hour&quot;]]  # 选多列（DataFrame）\ndf[df[&quot;pm2.5&quot;] &gt; 100]          # 筛出 PM2.5 大于 100 的行\ndf[(df[&quot;year&quot;] == 2014) &amp; (df[&quot;month&quot;] == 1)]   # 多个条件用 &amp; 连接，每个条件加括号\n\ndf[&quot;is_weekend&quot;] = (df[&quot;dayofweek&quot;] &gt;= 5).astype(int)   # 新增一列\ndf[&quot;temp_f&quot;] = df[&quot;TEMP&quot;] * 9 / 5 + 32                  # 用已有列算新列\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>特征工程的大部分工作就是\"新增列\"：把原始信息加工成模型能用的数字。<\/li>\n<li><code>.astype(int)<\/code> 把 True/False 变成 1/0，模型更喜欢数字。<\/li>\n<\/ul>\n<h2>2.3 排序、去重、缺失值<\/h2>\n<pre><code class=\"language-python\">df = df.sort_values(&quot;datetime&quot;)          # 按时间排序\ndf = df.drop_duplicates(subset=&quot;datetime&quot;)   # 去掉重复时间戳\n\ndf.isna().sum()                          # 每列有多少缺失值\ndf[&quot;pm2.5&quot;].isna().sum()                 # 目标列缺失多少\ndf = df.dropna(subset=[&quot;pm25_next&quot;])     # 删掉&quot;答案缺失&quot;的行\ndf[&quot;pm2.5&quot;] = df[&quot;pm2.5&quot;].interpolate(method=&quot;linear&quot;, limit=6, limit_direction=&quot;both&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>时序数据的第一原则：<strong>先排序、再检查重复和缺失<\/strong>。<\/li>\n<li><code>interpolate(limit=6)<\/code> = 最多连续补 6 个小时；补不了的宁可留着，别硬猜（详细理由见 3.3）。<\/li>\n<\/ul>\n<h2>2.4 groupby：分组统计<\/h2>\n<pre><code class=\"language-python\">df.groupby(&quot;hour&quot;)[&quot;pm2.5&quot;].mean()               # 每个小时的平均 PM2.5\ndf.groupby(&quot;dayofweek&quot;)[&quot;pm2.5&quot;].agg([&quot;mean&quot;, &quot;std&quot;, &quot;count&quot;])\ndf.groupby([&quot;is_weekend&quot;, &quot;hour&quot;])[&quot;pm2.5&quot;].mean()   # 多列组合分组\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>这是观察\"周期性\"最快的办法：如果不同小时的平均值差别明显，说明时间里有可用的信号。<\/li>\n<li>结果通常直接画成柱状图（见第 8 章）。<\/li>\n<\/ul>\n<h2>2.5 时间列处理<\/h2>\n<pre><code class=\"language-python\">df[&quot;datetime&quot;] = pd.to_datetime(df[[&quot;year&quot;, &quot;month&quot;, &quot;day&quot;, &quot;hour&quot;]])  # 多列拼成一个时间\ndf[&quot;datetime&quot;] = df[&quot;datetime&quot;].dt.tz_localize(&quot;UTC&quot;)                  # 声明&quot;这本来就是 UTC&quot;\ndf = df.set_index(&quot;datetime&quot;).sort_index()                             # 时间当索引，再排序\ndf.index.hour          # 取小时；同类还有 .year .month .day .dayofweek .dayofyear\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>时间必须是真正的 datetime 类型，不能是字符串，否则没法做 <code>shift<\/code>、<code>rolling<\/code> 这些时间操作。<\/li>\n<li>设成索引以后，<code>df.index.year<\/code> 就是每行的年份，写起来短。<\/li>\n<\/ul>\n<h2>2.6 保存 CSV<\/h2>\n<pre><code class=\"language-python\">df.to_csv(&quot;data/processed/pm25_clean.csv&quot;, encoding=&quot;utf-8-sig&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>encoding=\"utf-8-sig\"<\/code> 让 Excel 打开中文表头不乱码，Windows 上推荐。<\/li>\n<li><code>index=True<\/code>（默认）会把时间索引也写进去，这样别的脚本才能读回时间。<\/li>\n<\/ul>\n<hr />\n<h1>3. 时间戳处理<\/h1>\n<p>对应脚本：<code>scripts/04_load_clean.py<\/code>；对应教程：<code>docs/04-时序特征工程核心.md<\/code>。<\/p>\n<h2>3.1 拼出 UTC 时间列<\/h2>\n<pre><code class=\"language-python\">import pandas as pd\n\ndt = pd.to_datetime(df[[&quot;year&quot;, &quot;month&quot;, &quot;day&quot;, &quot;hour&quot;]])\ndf[&quot;datetime&quot;] = dt.dt.tz_localize(&quot;UTC&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>原始数据把时间拆成 4 列存，这一步把它们拼成一个带时区的时间列。<\/li>\n<li><code>tz_localize<\/code> 的意思是\"这些数字本来就是 UTC 时间\"；如果原始时间是北京时间，就要先 <code>tz_localize(\"Asia/Shanghai\")<\/code> 再 <code>tz_convert(\"UTC\")<\/code>。<\/li>\n<li>统一 UTC 是为了避免\"两份数据一个用北京时间、一个用 UTC，合并后差 8 小时\"。<\/li>\n<\/ul>\n<h2>3.2 排序 + 补齐完整时间轴<\/h2>\n<pre><code class=\"language-python\">df = df.set_index(&quot;datetime&quot;).sort_index()\ndf = df.asfreq(&quot;h&quot;)          # 保证每个整点都有一行，缺的补成 NaN\n\nexpected = pd.date_range(df.index.min(), df.index.max(), freq=&quot;h&quot;)\nprint(len(expected), len(df), len(expected) - len(df))   # 应该有 / 实际有 / 缺多少\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>asfreq(\"h\")<\/code> 让\"每隔一小时一行\"变成硬约束。<\/li>\n<li>为什么必须补：如果不补，<code>shift(24)<\/code> 表示的是\"往前数 24 行\"，而不是\"24 小时前\"，遇到缺口就会错位，<code>rolling(24)<\/code> 也一样。<\/li>\n<\/ul>\n<h2>3.3 缺失值：短缺口插值，长缺口保留<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_was_missing&quot;] = df[&quot;pm2.5&quot;].isna().astype(int)   # 留个标记，方便以后分析\ndf[&quot;pm2.5&quot;] = df[&quot;pm2.5&quot;].interpolate(method=&quot;linear&quot;, limit=6, limit_direction=&quot;both&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>连续缺失不超过 6 小时 → 用前后值线性插值补上（相邻小时污染水平接近，这样猜比较合理）。<\/li>\n<li>连续缺失很久 → 保留 NaN，不硬猜；建模时按用到的特征删掉这些行。<\/li>\n<li>插值也是\"猜\"，必须在报告里写清楚处理方式，不能装作数据本来没有缺失。<\/li>\n<\/ul>\n<h2>3.4 时区换算（要看北京作息时）<\/h2>\n<pre><code class=\"language-python\">df[&quot;hour_beijing&quot;] = (df[&quot;hour&quot;] + 8) % 24                      # 简便算法\ndf[&quot;datetime_beijing&quot;] = df.index.tz_convert(&quot;Asia/Shanghai&quot;)   # 正规做法\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>本项目统一用 UTC 讲解；UTC 08:00 = 北京 16:00。<\/li>\n<li>想研究\"北京早高峰\"，就加上 <code>hour_beijing<\/code> 这一列再分组看。<\/li>\n<\/ul>\n<hr />\n<h1>4. 时间特征<\/h1>\n<p>对应脚本：<code>scripts/05_time_features.py<\/code>。<\/p>\n<h2>4.1 日历特征<\/h2>\n<pre><code class=\"language-python\">index = df.index\ndf[&quot;year&quot;] = index.year\ndf[&quot;month&quot;] = index.month\ndf[&quot;day&quot;] = index.day\ndf[&quot;hour&quot;] = index.hour\ndf[&quot;dayofweek&quot;] = index.dayofweek          # 0=周一, 6=周日\ndf[&quot;is_weekend&quot;] = (index.dayofweek &gt;= 5).astype(int)\ndf[&quot;dayofyear&quot;] = index.dayofyear\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>把\"时间戳\"翻译成模型看得懂的数字：年看长期趋势，月看季节，小时看早晚高峰。<\/li>\n<li><code>day<\/code>（几号）通常用处不大，容易让模型记住偶然现象（过拟合），可以先不加。<\/li>\n<li><code>is_weekend<\/code> 是最直观的一个：工作日和周末的规律常常不一样。<\/li>\n<\/ul>\n<h2>4.2 星期几的可读版本<\/h2>\n<pre><code class=\"language-python\">WEEKDAY_NAMES = [&quot;周一&quot;, &quot;周二&quot;, &quot;周三&quot;, &quot;周四&quot;, &quot;周五&quot;, &quot;周六&quot;, &quot;周日&quot;]\ndf[&quot;weekday_name&quot;] = df[&quot;dayofweek&quot;].map(lambda x: WEEKDAY_NAMES[x])\n<\/code><\/pre>\n<p><strong>作用<\/strong>：给人看的列，画图、写报告时比 0~6 直观；建模时用 <code>dayofweek<\/code> 数字列。<\/p>\n<h2>4.3 周期编码：sin/cos<\/h2>\n<pre><code class=\"language-python\">import numpy as np\n\ndf[&quot;hour_sin&quot;] = np.sin(2 * np.pi * df[&quot;hour&quot;] / 24)\ndf[&quot;hour_cos&quot;] = np.cos(2 * np.pi * df[&quot;hour&quot;] / 24)\n\ndf[&quot;dayofweek_sin&quot;] = np.sin(2 * np.pi * df[&quot;dayofweek&quot;] / 7)\ndf[&quot;dayofweek_cos&quot;] = np.cos(2 * np.pi * df[&quot;dayofweek&quot;] / 7)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>直接给模型 <code>hour=23<\/code> 和 <code>hour=0<\/code>，模型会以为它们差 23；放到圆上以后，它俩其实是邻居。<\/li>\n<li>除以周期长度（24 小时、7 天、12 个月），再用 sin/cos 算出圆上的横纵坐标，两个数配对表示一个位置。<\/li>\n<li>月份编码写 <code>(month - 1) / 12<\/code>，是为了让 1 月从 0 开始，跟其他周期的写法一致。<\/li>\n<\/ul>\n<h2>4.4 观察周期性<\/h2>\n<pre><code class=\"language-python\">by_hour = df.groupby(&quot;hour&quot;)[&quot;pm2.5&quot;].mean()\nby_weekday = df.groupby(&quot;weekday_name&quot;)[&quot;pm2.5&quot;].mean().reindex(WEEKDAY_NAMES)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：分组求平均，看看\"哪个小时更脏、哪一天更脏\"。柱子高低差别明显，就说明时间特征有用。<\/p>\n<hr />\n<h1>5. 滞后与滑动窗口<\/h1>\n<p>对应脚本：<code>scripts/08_lag_rolling_features.py<\/code>。<\/p>\n<h2>5.1 lag：把过去的值挪到当前行<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_now&quot;] = df[&quot;pm2.5&quot;]        # 当前时刻的值（可以立刻测到，能用）\ndf[&quot;pm25_lag1&quot;] = df[&quot;pm2.5&quot;].shift(1)      # 上一小时\ndf[&quot;pm25_lag2&quot;] = df[&quot;pm2.5&quot;].shift(2)      # 上两小时\ndf[&quot;pm25_lag24&quot;] = df[&quot;pm2.5&quot;].shift(24)    # 昨天同一小时\ndf[&quot;pm25_lag168&quot;] = df[&quot;pm2.5&quot;].shift(168)  # 上周同一小时（7×24）\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>shift(1)<\/code> 把整列往下挪一格，于是\"上一小时的值\"出现在当前行，可以当作特征。<\/li>\n<li>污染物有明显惯性，<code>lag1<\/code>、<code>lag24<\/code> 通常是最有用的特征。<\/li>\n<li>挪完前几行会出现 NaN，这是正常的，最后 <code>dropna<\/code> 掉即可。<\/li>\n<\/ul>\n<h2>5.2 diff：变化量<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_diff1&quot;] = df[&quot;pm2.5&quot;].diff(1)     # 比上一小时高/低了多少\ndf[&quot;pm25_diff24&quot;] = df[&quot;pm2.5&quot;].diff(24)   # 比昨天同一小时高/低了多少\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<code>diff<\/code> 相当于\"当前值 − 之前的值\"，描述的是趋势和变化速度，对突变更敏感。<\/p>\n<h2>5.3 rolling：滑动窗口<\/h2>\n<pre><code class=\"language-python\">window24 = df[&quot;pm2.5&quot;].rolling(window=24, min_periods=18)\n\ndf[&quot;pm25_roll24_mean&quot;] = window24.mean()   # 最近 24 小时平均\ndf[&quot;pm25_roll24_std&quot;] = window24.std()     # 最近 24 小时波动\ndf[&quot;pm25_roll24_max&quot;] = window24.max()     # 最近 24 小时最高\ndf[&quot;pm25_roll24_min&quot;] = window24.min()     # 最近 24 小时最低\n\ndf[&quot;pm25_roll168_mean&quot;] = df[&quot;pm2.5&quot;].rolling(window=168, min_periods=120).mean()  # 最近 7 天\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>默认窗口在当前时刻结束（trailing），里面全是过去的值，预测下一小时时是安全的。<\/li>\n<li><code>min_periods=18<\/code> 表示\"24 小时里至少有 18 个有效值才算\"，既不会被个别缺失整行丢掉，也不会只靠一两个值硬算平均。<\/li>\n<li><code>mean<\/code> 看水平、<code>std<\/code> 看稳定程度、<code>max/min<\/code> 看极端情况。<\/li>\n<\/ul>\n<h2>5.4 目标：下一个小时的值<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_next&quot;] = df[&quot;pm2.5&quot;].shift(-1)    # 向上挪一格 = 下一小时的值\ndf = df.dropna(subset=[&quot;pm25_next&quot;])       # 最后一行没有下一小时，删掉\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>这一列是<strong>答案（y）<\/strong>，只能用来训练和打分，绝不能出现在特征列里。<\/li>\n<li><code>shift(-1)<\/code> 和 <code>shift(1)<\/code> 方向相反：负数 = 未来，正数 = 过去。<\/li>\n<\/ul>\n<h2>5.5 时间对齐：一张表看懂谁对应谁<\/h2>\n<table>\n<thead>\n<tr>\n<th>列名<\/th>\n<th>对应时刻<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>pm2.5<\/code><\/td>\n<td>t<\/td>\n<td>当前小时测得的值<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag1<\/code><\/td>\n<td>t-1<\/td>\n<td>上一小时<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag24<\/code><\/td>\n<td>t-24<\/td>\n<td>昨天同一小时<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_roll24_mean<\/code><\/td>\n<td>t-23 ~ t<\/td>\n<td>最近 24 小时的平均<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_next<\/code><\/td>\n<td>t+1<\/td>\n<td>要预测的答案<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>作用<\/strong>：写代码时随时回看这张表，就不容易把未来信息混进特征（这是最常见的错误）。<\/p>\n<hr />\n<h1>6. 建模与评估<\/h1>\n<p>对应脚本：<code>scripts/06_baseline_model.py<\/code>、<code>07_cyclic_encoding.py<\/code>、<code>09_model_comparison.py<\/code>。<\/p>\n<h2>6.1 准备好 X 和 y<\/h2>\n<pre><code class=\"language-python\">features = [&quot;month&quot;, &quot;day&quot;, &quot;hour&quot;, &quot;dayofweek&quot;, &quot;is_weekend&quot;, &quot;dayofyear&quot;]\n\nx_train = train[features]      # 特征（问题）\ny_train = train[&quot;pm25_next&quot;]   # 目标（答案）\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>建模就是把\"能知道的信息\"（X）和\"要预测的答案\"（y）分清楚。<\/li>\n<li>特征必须满足一个条件：<strong>在预测时刻已经能拿到<\/strong>。<\/li>\n<\/ul>\n<h2>6.2 按时间切分训练集/测试集<\/h2>\n<pre><code class=\"language-python\">split_index = int(len(df) * 0.8)\ntrain = df.iloc[:split_index].copy()     # 前 80%：训练\ntest = df.iloc[split_index:].copy()      # 后 20%：测试\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>时序数据必须\"用过去训练、拿未来测试\"，模拟真实预测场景。<\/li>\n<li>随机切分会让未来信息混进训练集，分数虚高（第 7 章有真实数字对比）。<\/li>\n<\/ul>\n<h2>6.3 基线模型：先跑简单的<\/h2>\n<pre><code class=\"language-python\">from sklearn.dummy import DummyRegressor\n\ndummy = DummyRegressor(strategy=&quot;mean&quot;)   # 永远预测训练集的平均值\ndummy.fit(x_train, y_train)\ndummy_pred = dummy.predict(x_test)\n\npersistence_pred = test[&quot;pm25_now&quot;].to_numpy()   # 持续法：下一小时 = 当前小时\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>平均值基线：什么都不学，只猜平均值，用来当\"最低标准\"。<\/li>\n<li>持续法：直接说\"下一小时和现在差不多\"。在污染物、股价这类有惯性的数据上，它往往很强。<\/li>\n<li>复杂模型如果打不过这两个基线，说明特征或方法有问题。<\/li>\n<\/ul>\n<h2>6.4 线性回归<\/h2>\n<pre><code class=\"language-python\">from sklearn.linear_model import LinearRegression\n\nmodel = LinearRegression()\nmodel.fit(x_train, y_train)      # 训练\npred = model.predict(x_test)     # 预测\n\nfor name, coef in zip(features, model.coef_):\n    print(name, round(coef, 4))  # 看每个特征的系数\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>线性回归就是给每个特征学一个权重，然后加权求和。<\/li>\n<li>系数正负表示方向（正 = 越大越容易高），但系数大小受量纲影响，不能直接当重要性排名；想比较大小要先标准化。<\/li>\n<\/ul>\n<h2>6.5 标准化后再看系数<\/h2>\n<pre><code class=\"language-python\">from sklearn.preprocessing import StandardScaler\n\nscaler = StandardScaler()\nx_train_scaled = scaler.fit_transform(train[features])\nx_test_scaled = scaler.transform(test[features])     # 注意：用训练集的规则去转换测试集\n\nmodel = LinearRegression().fit(x_train_scaled, y_train)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：把所有特征缩放到可比的尺度，系数大小才能横向比较（本项目输出到 <code>09_feature_coefficients.csv<\/code>）。<\/p>\n<h2>6.6 三个指标怎么读<\/h2>\n<pre><code class=\"language-python\">mae = np.mean(np.abs(y_true - y_pred))                    # 平均差多少\nrmse = np.sqrt(np.mean((y_true - y_pred) ** 2))           # 更重罚大错\nr2 = 1 - np.sum((y_true - y_pred) ** 2) / np.sum((y_true - y_true.mean()) ** 2)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><strong>MAE<\/strong>：平均每次预测差多少，最好和 PM2.5 本身的平均值一起看（本数据平均约 80~100，MAE 11 就不错）。<\/li>\n<li><strong>RMSE<\/strong>：和 MAE 类似，但对离谱的大错误更敏感。<\/li>\n<li><strong>R²<\/strong>：1 最好；0 约等于\"只会猜平均值\"；负数说明比猜平均值还差。<\/li>\n<\/ul>\n<h2>6.7 实验怎么写<\/h2>\n<pre><code class=\"language-text\">实验名 | 用了哪些特征 | 切分方式 | MAE | RMSE | R² | 是否可信\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>一次只改一处，其他保持不变，这样的对比才有意义（控制变量）。<\/li>\n<li>表里一定要标出\"是否可信\"，把泄漏实验单独区分开（项目里已有这张表：<code>outputs/tables/09_model_comparison.csv<\/code>）。<\/li>\n<\/ul>\n<hr />\n<h1>7. 数据泄漏：三种错误示范<\/h1>\n<p>对应脚本：<code>scripts/08_lag_rolling_features.py<\/code>、<code>scripts/09_model_comparison.py<\/code>。<\/p>\n<h2>7.1 中心滑动窗口（看了未来）<\/h2>\n<pre><code class=\"language-python\"># 错误：center=True 表示窗口中心在当前行，会包含 t+1、t+2 的未来值\ndf[&quot;pm25_roll24_mean_center_leaky&quot;] = df[&quot;pm2.5&quot;].rolling(window=24, center=True, min_periods=24).mean()\n<\/code><\/pre>\n<p><strong>作用/后果<\/strong>：预测下一小时时却用了后面几小时的信息。分数会变好，但这个\"好\"是假的。<\/p>\n<h2>7.2 把答案当特征（最离谱的作弊）<\/h2>\n<pre><code class=\"language-python\">df[&quot;pm25_answer_leaky&quot;] = df[&quot;pm25_next&quot;]     # 严重错误：答案直接变成特征\n<\/code><\/pre>\n<p><strong>作用/后果<\/strong>：模型等于抄答案，R² 会到 1.0000、MAE 会到 0。看到\"完美分数\"先怀疑泄漏，而不是高兴。<\/p>\n<h2>7.3 随机切分（考试漏题）<\/h2>\n<pre><code class=\"language-python\"># 错误做法：时序数据不要这样切\nx_train, x_test, y_train, y_test = train_test_split(x, y, test_size=0.2, random_state=42)\n<\/code><\/pre>\n<p><strong>作用/后果<\/strong>：随机切分会把\"未来\"混进训练集，测试分数虚高（本项目对比：随机切分 R² 0.9494，按时间切分 0.9426，看起来更好，但不可信）。<\/p>\n<h2>7.4 防泄漏检查清单<\/h2>\n<ul>\n<li>[ ] 每一列特征，在预测时刻 t 都拿得到吗？（拿不到就删）<\/li>\n<li>[ ] 有没有 <code>center=True<\/code>？有就改成默认的 trailing 窗口。<\/li>\n<li>[ ] 有没有列名带 <code>next<\/code>、<code>answer<\/code>、<code>leaky<\/code> 却出现在 <code>features<\/code> 里？<\/li>\n<li>[ ] 是在排序 + 补齐时间轴之后才算的 <code>shift<\/code>/<code>rolling<\/code> 吗？<\/li>\n<li>[ ] 训练集时间是否完全早于测试集？<\/li>\n<li>[ ] 分数好得反常（R²&gt;0.99）时，是否停下来查一遍泄漏？<\/li>\n<\/ul>\n<hr />\n<h1>8. 画图<\/h1>\n<p>对应脚本：<code>scripts/10_plots.py<\/code>；对应教程：<code>docs/06-画图与Kaggle.md<\/code>。<\/p>\n<h2>8.1 中文画图设置<\/h2>\n<pre><code class=\"language-python\">import matplotlib\nmatplotlib.use(&quot;Agg&quot;)            # 不弹窗，直接存图片文件\n\nimport matplotlib.pyplot as plt\nplt.rcParams[&quot;font.sans-serif&quot;] = [&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;]   # 中文不乱码\nplt.rcParams[&quot;axes.unicode_minus&quot;] = False                        # 负号正常显示\nplt.rcParams[&quot;figure.dpi&quot;] = 120\n<\/code><\/pre>\n<p><strong>作用<\/strong>：不设置字体，中文标题会变成一排方框；<code>Agg<\/code> 让脚本在服务器/无窗口环境也能出图。<\/p>\n<h2>8.2 常用图<\/h2>\n<pre><code class=\"language-python\">fig, axes = plt.subplots(2, 1, figsize=(12, 8))    # 上下两张图\n\naxes[0].plot(daily.index, daily[&quot;pm2.5&quot;], color=&quot;#2c7fb8&quot;)        # 折线：看趋势\naxes[0].set_title(&quot;PM2.5 日均值（UTC）&quot;)\naxes[0].set_ylabel(&quot;PM2.5&quot;)\n\naxes[1].plot(sample.index, sample[&quot;pm2.5&quot;], linewidth=0.8)        # 局部放大看细节\nfig.tight_layout()\nfig.savefig(&quot;outputs/figures/01_原始序列与趋势.png&quot;, bbox_inches=&quot;tight&quot;)\n<\/code><\/pre>\n<pre><code class=\"language-python\">plt.figure(figsize=(8, 4))\nplt.bar(by_hour.index, by_hour.values, color=&quot;#31a354&quot;)           # 柱状：比较不同小时\nplt.xlabel(&quot;UTC 小时&quot;); plt.ylabel(&quot;平均 PM2.5&quot;)\nplt.savefig(&quot;outputs/figures/03_周期性观察.png&quot;, bbox_inches=&quot;tight&quot;)\n<\/code><\/pre>\n<pre><code class=\"language-python\">fig, ax = plt.subplots(figsize=(13, 5.5))\nax.plot(part.index, part[&quot;y_true&quot;], color=&quot;black&quot;, linewidth=2, label=&quot;真实值&quot;)\nax.plot(part.index, part[&quot;pred_time_cyc&quot;], color=&quot;#e6550d&quot;, label=&quot;只用周期时间特征&quot;)\nax.plot(part.index, part[&quot;pred_full&quot;], color=&quot;#2c7fb8&quot;, label=&quot;完整正确特征&quot;)\nax.legend()\nax.set_title(&quot;测试期前 14 天：预测值 vs 真实值&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>折线看趋势和周期，柱状比较分组均值，散点看两个变量的关系。<\/li>\n<li>预测对比图是最有说服力的一张：真实值、简单特征、完整特征画在一起，一眼看出差别。<\/li>\n<\/ul>\n<h2>8.3 每张图在说什么<\/h2>\n<table>\n<thead>\n<tr>\n<th>图<\/th>\n<th>看什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>原始序列<\/td>\n<td>整体趋势、有没有季节性<\/td>\n<\/tr>\n<tr>\n<td>滑动平均与差分<\/td>\n<td>7 天滑动平均像降噪滤镜；差分把突变单独拎出来<\/td>\n<\/tr>\n<tr>\n<td>周期性观察<\/td>\n<td>不同小时/星期/月份的平均值差别大不大<\/td>\n<\/tr>\n<tr>\n<td>预测对比<\/td>\n<td>简单特征几乎是一条平线，完整特征能跟住真实值<\/td>\n<\/tr>\n<tr>\n<td>周期编码圆<\/td>\n<td>23 点和 0 点在圆上是邻居<\/td>\n<\/tr>\n<tr>\n<td>相关性热力图<\/td>\n<td>哪个特征和下一小时 PM2.5 线性相关更强（相关 ≠ 因果）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h1>9. SQLite 数据库<\/h1>\n<p>对应脚本：<code>scripts/03_sqlite_basics.py<\/code>。Python 自带，零配置。<\/p>\n<h2>9.1 连接与建表<\/h2>\n<pre><code class=\"language-python\">import sqlite3\n\nconn = sqlite3.connect(&quot;data/processed/practice.db&quot;)\nconn.execute(&quot;&quot;&quot;\n    CREATE TABLE IF NOT EXISTS weather_notes (\n        id    INTEGER PRIMARY KEY,   -- 主键：唯一身份证，不能重复\n        city  TEXT NOT NULL,\n        date  TEXT NOT NULL,\n        temp  REAL,\n        note  TEXT\n    )\n&quot;&quot;&quot;)\nconn.commit()\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>SQLite 把整个数据库存成一个 <code>.db<\/code> 文件，不用装服务器，适合练习和小项目。<\/li>\n<li><code>PRIMARY KEY<\/code> 保证每行有唯一 id；<code>NOT NULL<\/code> 表示这列不能空着。<\/li>\n<li>类型：<code>INTEGER<\/code> 整数、<code>TEXT<\/code> 文本、<code>REAL<\/code> 小数。<\/li>\n<\/ul>\n<h2>9.2 增删改查<\/h2>\n<pre><code class=\"language-python\"># 增：? 是占位符，防止拼字符串出错（也能防注入）\nconn.executemany(\n    &quot;INSERT OR REPLACE INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)&quot;,\n    [(1, &quot;Nanjing&quot;, &quot;2026-10-01&quot;, 28.0, &quot;sunny&quot;)],\n)\n\n# 查\nconn.execute(&quot;SELECT * FROM weather_notes WHERE city = ? ORDER BY id&quot;, (&quot;Nanjing&quot;,))\nconn.execute(&quot;SELECT city, COUNT(*) AS n FROM weather_notes GROUP BY city ORDER BY n DESC&quot;)\n\n# 改\nconn.execute(&quot;UPDATE weather_notes SET temp = ?, note = ? WHERE id = ?&quot;, (29.5, &quot;updated&quot;, 1))\n\n# 删\nconn.execute(&quot;DELETE FROM weather_notes WHERE id = ?&quot;, (4,))\n\nconn.commit()    # 增删改之后一定要 commit\nconn.close()     # 用完关掉\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li><code>SELECT<\/code> 查、<code>INSERT<\/code> 增、<code>UPDATE<\/code> 改、<code>DELETE<\/code> 删 —— 数据库的四个基本动作。<\/li>\n<li><code>WHERE<\/code> 决定动哪几行；<strong>忘了写 WHERE，UPDATE/DELETE 会作用到整张表<\/strong>，务必先 <code>SELECT<\/code> 确认。<\/li>\n<\/ul>\n<h2>9.3 主键与索引<\/h2>\n<pre><code class=\"language-python\">conn.execute(&quot;CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)&quot;)\n<\/code><\/pre>\n<p><strong>作用<\/strong>：<\/p>\n<ul>\n<li>主键：自动唯一，插入重复 id 会直接报 <code>IntegrityError<\/code>（这是好事，数据更安全）。<\/li>\n<li>索引：像书的目录，让\"按 city 查询\"更快；代价是占空间、写入稍慢，只给常用查询列建。<\/li>\n<\/ul>\n<hr />\n<h1>10. 报错急救<\/h1>\n<p>对应教程：<code>docs/99-报错急救.md<\/code>。<\/p>\n<table>\n<thead>\n<tr>\n<th>报错信息（关键部分）<\/th>\n<th>原因<\/th>\n<th>怎么解决<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>python 不是内部或外部命令<\/code><\/td>\n<td>没装 Python 或没勾选 Add to PATH<\/td>\n<td>重新安装 Python 并勾选 Add Python to PATH；或用 <code>py<\/code> 命令<\/td>\n<\/tr>\n<tr>\n<td><code>无法加载文件 ... Activate.ps1，未对文件进行数字签名<\/code><\/td>\n<td>PowerShell 执行策略限制<\/td>\n<td><code>Set-ExecutionPolicy -Scope CurrentUser RemoteSigned<\/code> 后重开窗口<\/td>\n<\/tr>\n<tr>\n<td><code>ModuleNotFoundError: No module named 'pandas'<\/code><\/td>\n<td>没装库，或虚拟环境没激活<\/td>\n<td>先 <code>.\\.venv\\Scripts\\Activate.ps1<\/code>，再 <code>pip install -r requirements.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>FileNotFoundError: ... data/raw/...csv<\/code><\/td>\n<td>数据还没下载<\/td>\n<td>先跑 <code>python scripts\\download_data.py<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>FileNotFoundError: ... pm25_clean.csv<\/code><\/td>\n<td>上一个脚本没跑<\/td>\n<td>按顺序跑 04 → 05 → 06…，或直接 <code>.\\run_all.ps1<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>KeyError: 'hour'<\/code><\/td>\n<td>列名不存在/拼错，或少了上一步生成的特征<\/td>\n<td>用 <code>df.columns<\/code> 看真实列名；确认跑过 05/08<\/td>\n<\/tr>\n<tr>\n<td><code>ValueError: could not convert string to float<\/code><\/td>\n<td>该是数字的列里混了文字/空值<\/td>\n<td><code>df[\"列\"].head()<\/code> 看看内容；必要时 <code>pd.to_numeric(errors=\"coerce\")<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>TypeError: unsupported operand type(s)<\/code><\/td>\n<td>字符串当数字算了<\/td>\n<td>检查这列的 <code>dtype<\/code>（<code>df.dtypes<\/code>），先转换类型<\/td>\n<\/tr>\n<tr>\n<td><code>SettingWithCopyWarning<\/code><\/td>\n<td>在切片副本上改数据<\/td>\n<td>先 <code>.copy()<\/code>，再赋值：<code>part = df.iloc[:100].copy()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>UnicodeDecodeError: 'utf-8' codec can't decode<\/code><\/td>\n<td>文件不是 UTF-8（常见 GBK）<\/td>\n<td>读的时候加 <code>encoding=\"gbk\"<\/code>；写 CSV 用 <code>utf-8-sig<\/code><\/td>\n<\/tr>\n<tr>\n<td>CSV 用 Excel 打开中文乱码<\/td>\n<td>编码不是 Excel 认的格式<\/td>\n<td>保存时用 <code>encoding=\"utf-8-sig\"<\/code><\/td>\n<\/tr>\n<tr>\n<td>matplotlib 中文变方框<\/td>\n<td>没设置中文字体<\/td>\n<td>加 <code>plt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\"]<\/code><\/td>\n<\/tr>\n<tr>\n<td>服务器提示端口被占用<\/td>\n<td>8765 已被别的程序占用<\/td>\n<td>换端口：<code>start-server.ps1 -Port 8899<\/code><\/td>\n<\/tr>\n<tr>\n<td>Git <code>fatal: not a git repository<\/code><\/td>\n<td>当前目录还不是仓库<\/td>\n<td>在项目根目录先 <code>git init<\/code><\/td>\n<\/tr>\n<tr>\n<td>Git <code>failed to push<\/code> / 要登录<\/td>\n<td>远端仓库或凭据问题<\/td>\n<td><code>git remote -v<\/code> 检查地址；按提示登录 GitHub<\/td>\n<\/tr>\n<tr>\n<td><code>PermissionError: [Errno 13]<\/code><\/td>\n<td>文件被 Excel 等程序占用<\/td>\n<td>关掉正在打开的文件再运行脚本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>通用排查三步<\/strong>：<\/p>\n<ol>\n<li>看报错<strong>最后一行<\/strong>（错误类型 + 原因），再看它指出的是哪个文件哪一行。<\/li>\n<li>打开那个文件、找到那一行，想想这一行需要什么（列？文件？库？）。<\/li>\n<li>还没头绪就把整段报错复制去搜索，或者把\"最后一行 + 代码那几行\"发给同学/导师。<\/li>\n<\/ol>\n<hr />\n<h1>附录 A　特征清单（可直接抄进报告）<\/h1>\n<table>\n<thead>\n<tr>\n<th>特征名<\/th>\n<th>构造方法<\/th>\n<th>含义<\/th>\n<th>可能的作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>year<\/code><\/td>\n<td><code>index.year<\/code><\/td>\n<td>年份<\/td>\n<td>捕捉长期趋势<\/td>\n<\/tr>\n<tr>\n<td><code>month<\/code><\/td>\n<td><code>index.month<\/code><\/td>\n<td>月份 1–12<\/td>\n<td>捕捉季节变化<\/td>\n<\/tr>\n<tr>\n<td><code>day<\/code><\/td>\n<td><code>index.day<\/code><\/td>\n<td>几号<\/td>\n<td>通常用处不大，容易过拟合<\/td>\n<\/tr>\n<tr>\n<td><code>hour<\/code><\/td>\n<td><code>index.hour<\/code><\/td>\n<td>小时 0–23<\/td>\n<td>捕捉一天内的变化<\/td>\n<\/tr>\n<tr>\n<td><code>dayofweek<\/code><\/td>\n<td><code>index.dayofweek<\/code><\/td>\n<td>0=周一…6=周日<\/td>\n<td>工作日/周末差异<\/td>\n<\/tr>\n<tr>\n<td><code>is_weekend<\/code><\/td>\n<td><code>dayofweek &gt;= 5<\/code><\/td>\n<td>是否周末 0/1<\/td>\n<td>简单明了的周末效应<\/td>\n<\/tr>\n<tr>\n<td><code>dayofyear<\/code><\/td>\n<td><code>index.dayofyear<\/code><\/td>\n<td>一年中的第几天<\/td>\n<td>更细的季节位置<\/td>\n<\/tr>\n<tr>\n<td><code>hour_sin<\/code> / <code>hour_cos<\/code><\/td>\n<td><code>sin(2π·hour/24)<\/code> / <code>cos(...)<\/code><\/td>\n<td>小时在圆上的坐标<\/td>\n<td>让 23 点和 0 点变近<\/td>\n<\/tr>\n<tr>\n<td><code>dayofweek_sin<\/code> / <code>dayofweek_cos<\/code><\/td>\n<td><code>sin(2π·dow/7)<\/code> / <code>cos(...)<\/code><\/td>\n<td>星期在圆上的坐标<\/td>\n<td>表达\"周而复始\"<\/td>\n<\/tr>\n<tr>\n<td><code>month_sin<\/code> / <code>month_cos<\/code><\/td>\n<td><code>sin(2π·(month-1)/12)<\/code><\/td>\n<td>月份在圆上的坐标<\/td>\n<td>表达季节循环<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_now<\/code><\/td>\n<td>原列<\/td>\n<td>当前小时的值<\/td>\n<td>惯性，最强特征之一<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag1 / lag2 / lag3<\/code><\/td>\n<td><code>shift(1/2/3)<\/code><\/td>\n<td>前 1~3 小时的值<\/td>\n<td>近期惯性<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag24<\/code><\/td>\n<td><code>shift(24)<\/code><\/td>\n<td>昨天同一小时<\/td>\n<td>日周期<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_lag168<\/code><\/td>\n<td><code>shift(168)<\/code><\/td>\n<td>上周同一小时<\/td>\n<td>周周期<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_diff1 / diff24<\/code><\/td>\n<td><code>diff(1) / diff(24)<\/code><\/td>\n<td>相比上一小时/昨天同小时的变化<\/td>\n<td>趋势与突变<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_roll24_mean/std/max/min<\/code><\/td>\n<td><code>rolling(24).mean()/std()/max()/min()<\/code><\/td>\n<td>最近 24 小时统计<\/td>\n<td>水平、波动、极值<\/td>\n<\/tr>\n<tr>\n<td><code>pm25_roll168_mean/std<\/code><\/td>\n<td><code>rolling(168)<\/code><\/td>\n<td>最近 7 天统计<\/td>\n<td>周级别水平与波动<\/td>\n<\/tr>\n<tr>\n<td><code>TEMP_lag1<\/code> / <code>TEMP_roll24_mean<\/code><\/td>\n<td>对温度做同样的操作<\/td>\n<td>温度的历史信息<\/td>\n<td>说明方法可迁移到其他列<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>一句话模板<\/strong>：<code>xxx 特征是用 xxx 方法构造的，它让模型知道 xxx，加入后 MAE 从 __ 降到 __。<\/code><\/p>\n<hr />\n<h1>附录 B　本项目的实验结论（真实数字）<\/h1>\n<h2>B.1 特征对照实验（<code>outputs/tables/09_model_comparison.csv<\/code>）<\/h2>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>特征<\/th>\n<th>切分方式<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R²<\/th>\n<th>是否可信<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平均值基线<\/td>\n<td>无<\/td>\n<td>按时间 8:2<\/td>\n<td>64.740<\/td>\n<td>82.470<\/td>\n<td>-0.0286<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>持续法基线<\/td>\n<td>当前 pm2.5<\/td>\n<td>按时间 8:2<\/td>\n<td>10.981<\/td>\n<td>19.968<\/td>\n<td>0.9397<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>只用原始时间特征<\/td>\n<td>month/day/hour/weekday…<\/td>\n<td>按时间 8:2<\/td>\n<td>62.576<\/td>\n<td>81.323<\/td>\n<td>-0.0002<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>只用周期编码时间<\/td>\n<td>hour_sin/cos…<\/td>\n<td>按时间 8:2<\/td>\n<td>62.656<\/td>\n<td>80.601<\/td>\n<td>0.0175<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>周期编码 + 滞后<\/td>\n<td>时间 + lag/diff<\/td>\n<td>按时间 8:2<\/td>\n<td>10.934<\/td>\n<td>19.670<\/td>\n<td>0.9415<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>完整正确版<\/td>\n<td>周期 + 滞后 + 滑动 + 天气<\/td>\n<td>按时间 8:2<\/td>\n<td>10.754<\/td>\n<td>19.473<\/td>\n<td>0.9426<\/td>\n<td>可信<\/td>\n<\/tr>\n<tr>\n<td>中心滑动窗口（泄漏）<\/td>\n<td>窗口包含未来值<\/td>\n<td>按时间 8:2<\/td>\n<td>10.413<\/td>\n<td>18.112<\/td>\n<td>0.9504<\/td>\n<td>不可信<\/td>\n<\/tr>\n<tr>\n<td>把答案当特征（作弊）<\/td>\n<td><code>pm25_answer_leaky<\/code><\/td>\n<td>按时间 8:2<\/td>\n<td>0.000<\/td>\n<td>0.000<\/td>\n<td>1.0000<\/td>\n<td>不可信<\/td>\n<\/tr>\n<tr>\n<td>随机切分（错误做法）<\/td>\n<td>完整正确特征<\/td>\n<td>随机 8:2<\/td>\n<td>12.430<\/td>\n<td>21.106<\/td>\n<td>0.9494<\/td>\n<td>不可信<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>B.2 消融实验（<code>outputs/tables/09_ablation.csv<\/code>）<\/h2>\n<table>\n<thead>\n<tr>\n<th>实验<\/th>\n<th>特征个数<\/th>\n<th>MAE<\/th>\n<th>RMSE<\/th>\n<th>R²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>完整特征<\/td>\n<td>29<\/td>\n<td>10.754<\/td>\n<td>19.473<\/td>\n<td>0.9426<\/td>\n<\/tr>\n<tr>\n<td>去掉滞后<\/td>\n<td>21<\/td>\n<td>33.376<\/td>\n<td>45.330<\/td>\n<td>0.6892<\/td>\n<\/tr>\n<tr>\n<td>去掉滑动窗口<\/td>\n<td>23<\/td>\n<td>10.804<\/td>\n<td>19.511<\/td>\n<td>0.9424<\/td>\n<\/tr>\n<tr>\n<td>去掉天气<\/td>\n<td>21<\/td>\n<td>10.885<\/td>\n<td>19.634<\/td>\n<td>0.9417<\/td>\n<\/tr>\n<tr>\n<td>只留时间特征<\/td>\n<td>7<\/td>\n<td>62.656<\/td>\n<td>80.601<\/td>\n<td>0.0175<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>B.3 三条可以写进报告的结论<\/h2>\n<ol>\n<li><strong>只用钟表时间不够<\/strong>：只加月/日/小时/星期，MAE 62.6，和\"猜平均值\"（64.7）差不多；换成周期编码也只有极小改善。<\/li>\n<li><strong>过去的值才是主力<\/strong>：加上滞后和滑动窗口后，MAE 从 62.6 降到 10.9；消融实验里\"去掉滞后\"这一项 MAE 直接涨到 33.4，说明这类特征贡献最大。<\/li>\n<li><strong>分数越高越要警惕<\/strong>：中心滑动窗口（10.413）和\"把答案当特征\"（MAE 0、R² 1.0）分数更漂亮，但都是泄漏，不能写进结论。<\/li>\n<\/ol>\n<hr />\n<h1>附录 C　文件地图<\/h1>\n<table>\n<thead>\n<tr>\n<th>位置<\/th>\n<th>里面是什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>README.md<\/code><\/td>\n<td>项目总览、7 天学习计划、导师要求对照<\/td>\n<\/tr>\n<tr>\n<td><code>docs/00<\/code> ~ <code>docs/07<\/code><\/td>\n<td>分步教程（导师要求翻译、环境、Python、pandas/SQLite、特征工程核心、建模、画图与 Kaggle、交作业模板）<\/td>\n<\/tr>\n<tr>\n<td><code>docs/08-知识点与代码速查.md<\/code><\/td>\n<td><strong>本手册的 Markdown 版本<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>docs/99-报错急救.md<\/code><\/td>\n<td>报错对照表（比本手册第 10 章更详细）<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/01<\/code> ~ <code>03<\/code><\/td>\n<td>Python、pandas、SQLite 基础练习<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/04<\/code> ~ <code>08<\/code><\/td>\n<td>数据清洗 → 时间特征 → 基线模型 → 周期编码 → 滞后滑窗<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/09<\/code><\/td>\n<td>模型对比、消融实验、泄漏演示<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/10<\/code><\/td>\n<td>画 6 张观察图<\/td>\n<\/tr>\n<tr>\n<td><code>scripts/common.py<\/code><\/td>\n<td>公共函数：路径、读数据、指标、中文字体<\/td>\n<\/tr>\n<tr>\n<td><code>data/raw/<\/code><\/td>\n<td>原始数据（下载得到）<\/td>\n<\/tr>\n<tr>\n<td><code>data/processed/<\/code><\/td>\n<td>清洗后数据、特征数据、练习数据库<\/td>\n<\/tr>\n<tr>\n<td><code>outputs/figures/<\/code><\/td>\n<td>6 张图（PNG，可插入报告）<\/td>\n<\/tr>\n<tr>\n<td><code>outputs/tables/<\/code><\/td>\n<td>实验表格（CSV，可插入报告）<\/td>\n<\/tr>\n<tr>\n<td><code>outputs/知识点与代码速查.pdf<\/code><\/td>\n<td><strong>本手册的 PDF（打印用）<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>guide/<\/code><\/td>\n<td>网页版指引：<code>index.html<\/code>、本地服务器 <code>server.py<\/code>、生成脚本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>附录 D　交作业自查<\/h2>\n<ul>\n<li>[ ] 代码能一键跑通：<code>.\\run_all.ps1<\/code><\/li>\n<li>[ ] 代码已推到 GitHub，仓库链接能打开<\/li>\n<li>[ ] 笔记里有每个特征的\"构造 + 含义 + 实验证据\"（用 <code>notes/学习笔记模板.md<\/code>）<\/li>\n<li>[ ] 实验记录表填好：模型对比、消融实验（用 <code>notes/实验记录模板.md<\/code>）<\/li>\n<li>[ ] 报告里有 1~2 张图（建议：原始序列+滑动平均、预测对比）<\/li>\n<li>[ ] 报告里写清楚了：预测目标是什么、怎么切分、有没有数据泄漏、结论是什么<\/li>\n<li>[ ] 能口头解释：为什么 23 点和 0 点是邻居、为什么要 shift、为什么不能随机切分<\/li>\n<\/ul>", "plain": "时序特征工程 · 知识点与代码速查手册 配套项目： time-series-feature-engineering （北京 PM2.5 实战） 用途：把项目里用到的知识点和代码集中到一处，打印出来放在手边，写代码、写报告时对着查。 阅读方式：左边是代码，代码下面的「作用」就是这段代码在干什么，不需要背，知道去哪儿找就行。 重新生成 PDF：在项目根目录运行 python guide\\build_handbook.py ，PDF 会输出到 outputs\\知识点与代码速查.pdf 。 打印版 PDF： outputs/知识点与代码速查.pdf （已经在项目里生成好了，直接打开或打印即可）。 怎么用这本手册 先看「核心 10 句话」 ：把整个项目的骨架记住，比记住代码重要。 要写代码时，翻到对应章节 ：每一节都是「代码 + 作用」，复制过去改成自己的列名就能用。 要写报告时，看附录 A 和附录 B ：特征怎么解释、实验结论是什么，直接抄进报告。 报错时看第 10 章 ：按错误信息查，先看原因，再看解决办法。 核心 10 句话 时序数据是带时间戳、按时间排好序的记录， 顺序本身就是信息 ，不能随便打乱。 时间戳统一用 UTC ；北京时间 = UTC + 8。 预测场景要先定义清楚： 站在 t 时刻，用截至 t 已知的信息，预测 t+1 。 时间列可以拆成 年、月、日、星期、小时、是否周末 这些数字特征。 小时、星期、月份用 sin/cos 周期编码 ，23 点和 0 点才会变成\"邻居\"。 lag（滞后） 是把过去的值挪到当前行： shift(1) 是上一小时， shift(24) 是昨天同一小时。 rolling（滑动窗口） 是算最近一段时间（如 24 小时）的均值、波动、最大最小值。 任何用到了 t+1 及以后的信息，都是 数据泄漏 ，测试分数会假高。 时序数据切分训练/测试必须 按时间前后切 ，不能随机切。 先跑 基线 （平均值、持续法），再谈复杂模型；指标看 MAE、RMSE、R² 。 0. 命令速查 0.1 环境：创建并激活虚拟环境 # 在项目根目录（time-series-feature-engineering）执行 python -m venv .venv # 创建虚拟环境 .\\.venv\\Scripts\\Activate.ps1 # 激活（Windows PowerShell） pip install -r requirements.txt # 安装项目需要的库 作用 ： 虚拟环境 = 只属于这个项目的工具箱，不会污染电脑里其他 Python 项目。 激活成功后，命令行前面会出现 (.venv) ；关掉窗口就相当于退出。 Mac/Linux 用 python3 -m venv venv 和 source venv/bin/activate 。 0.2 运行脚本 python scripts\\05_time_features.py # 运行单个脚本 .\\run_all.ps1 # 一键按顺序全部运行 作用 ： 脚本按编号顺序有依赖：04 生成干净数据 → 05 加时间特征 → 08 加滞后滑窗 → 09 做模型对比。 跳过前面的脚本直接跑 09，会提示找不到文件（ FileNotFoundError ）。 0.3 Git 与 GitHub git init # 把这个文件夹变成 Git 仓库 git add . # 把改动放进\"待提交\"区 git commit -m \"完成时间特征提取\" # 存一个版本，附上说明 git log --oneline # 看历史版本 git remote add origin https://github.com/你的用户名/仓库名.git git push -u origin main # 第一次推送 git status # 看当前有哪些改动（最常用） 作用 ： Git 是\"存档 + 时间机器\"，每完成一小步就 add + commit 一次。 GitHub 是放代码的网站，导师要的是仓库链接，不是压缩包。 .gitignore 用来排除不想上传的东西（本项目已排除 .venv/ 、 data/raw/ 等）。 0.4 网页指引、本地服务、生成手册 python guide\\build_guide.py # 重新生成网页指引 powershell -ExecutionPolicy Bypass -File .\\guide\\start-server.ps1 # 启动本地服务（能读文件夹） python guide\\build_handbook.py # 重新生成这本手册的 PDF 作用 ： 网页指引：把教程、代码、图表、实验表格放在一个页面里看。 本地服务：浏览器出于安全不允许网页直接读本地文件夹， start-server.ps1 会开一个只服务本机的小服务器，网页里的\"项目文件\"才能读文件夹。 手册 PDF：改完上面的 Markdown 后跑一次，PDF 会重新生成。 1. Python 基础 对应脚本： scripts/01_python_basics.py ；对应教程： docs/02-Python零基础.md 。 1.1 列表 list：一串有序的数据 values = [80, 75, 90] # 建列表 values.append(60) # 末尾加一个 first = values[0] # 取第 1 个（下标从 0 开始） last = values[-1] # 取最后一个 print(len(values)) # 长度：4 print(values[1:3]) # 切片：第 2、3 个 作用 ：存放一组有顺序的数据，比如一串连续的 PM2.5 观测值。 1.2 字典 dict：按名字取值 student = {\"name\": \"小明\", \"score\": 90} print(student[\"name\"]) # 取值：小明 student[\"score\"] = 95 # 改值 student[\"city\"] = \"南京\" # 加新的一对 for key, value in student.items(): # 遍历 print(key, value) 作用 ：用\"名字 → 值\"的方式存数据，读代码时比记 [0] 、 [1] 清楚得多。 1.3 队列 deque：先进先出 from collections import deque window = deque(maxlen=3) # 只保留最近 3 个 for value in [10, 20, 30, 40]: window.append(value) print(window) # deque([20, 30, 40], maxlen=3) print(window[0]) # 最早的那个：20 作用 ：维护\"最近 N 个值\"的滑动窗口； maxlen 会自动丢掉最旧的，这是滑动窗口最朴素的手写版本。 1.4 循环、条件、函数 def level(pm25: float) -> str: # 函数：输入 → 输出 if pm25 > 150: return \"重度污染\" elif pm25 > 75: return \"轻度污染\" return \"正常\" for value in [30, 90, 200]: print(value, level(value)) 作用 ： 函数把一段逻辑包起来，起个名字，后面重复用； pm25: float 和 -> str 只是提示类型，不写也能跑。 for 用来遍历一串数据， if/elif/else 用来分支判断。 1.5 读文件、写文件 # 读：with 会在用完以后自动关文件，推荐写法 with open(\"notes/学习笔记模板.md\", \"r\", encoding=\"utf-8\") as handle: text = handle.read() print(text[:200]) # 只看前 200 个字符 # 写：w 表示覆盖写，a 表示在末尾追加 with open(\"outputs/notes.txt\", \"w\", encoding=\"utf-8\") as handle: handle.write(\"第一行\\n第二行\\n\") 作用 ： 读写文件都要指定 encoding=\"utf-8\" ，否则中文在 Windows 上容易乱码。 读 CSV 这种表格数据时，用 pandas 更方便（见第 2 章）。 1.6 报错怎么读 # 报错最后一行才是\"错误类型 + 原因\"，先看它，再看它上面一行指出的是哪个文件哪一行 # 例： # File \"scripts\\05_time_features.py\", line 42 # df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24) # KeyError: 'hour' 作用 ： KeyError: 'hour' 意思是没有名为 hour 的列 —— 通常是你忘了先运行 04/05 脚本，或者列名拼错了。 详细对照表见第 10 章。 2. pandas 基础 对应脚本： scripts/02_pandas_basics.py ；对应教程： docs/03-pandas与SQLite.md 。 2.1 读 CSV import pandas as pd df = pd.read_csv(\"data/raw/beijing_pm25/PRSA_data_2010.1.1-2014.12.31.csv\") print(df.shape) # (行数, 列数) print(df.head()) # 看前 5 行 print(df.info()) # 每列的类型、缺失情况 作用 ： pd.read_csv 把 CSV 读成 DataFrame（可以理解成\"程序里的 Excel 表格\"）。 第一步永远先 shape / head / info ：先看清数据长什么样，再动手。 2.2 选列、筛行、新增列 df[\"pm2.5\"] # 选一列（Series） df[[\"year\", \"month\", \"hour\"]] # 选多列（DataFrame） df[df[\"pm2.5\"] > 100] # 筛出 PM2.5 大于 100 的行 df[(df[\"year\"] == 2014) & (df[\"month\"] == 1)] # 多个条件用 & 连接，每个条件加括号 df[\"is_weekend\"] = (df[\"dayofweek\"] >= 5).astype(int) # 新增一列 df[\"temp_f\"] = df[\"TEMP\"] * 9 / 5 + 32 # 用已有列算新列 作用 ： 特征工程的大部分工作就是\"新增列\"：把原始信息加工成模型能用的数字。 .astype(int) 把 True/False 变成 1/0，模型更喜欢数字。 2.3 排序、去重、缺失值 df = df.sort_values(\"datetime\") # 按时间排序 df = df.drop_duplicates(subset=\"datetime\") # 去掉重复时间戳 df.isna().sum() # 每列有多少缺失值 df[\"pm2.5\"].isna().sum() # 目标列缺失多少 df = df.dropna(subset=[\"pm25_next\"]) # 删掉\"答案缺失\"的行 df[\"pm2.5\"] = df[\"pm2.5\"].interpolate(method=\"linear\", limit=6, limit_direction=\"both\") 作用 ： 时序数据的第一原则： 先排序、再检查重复和缺失 。 interpolate(limit=6) = 最多连续补 6 个小时；补不了的宁可留着，别硬猜（详细理由见 3.3）。 2.4 groupby：分组统计 df.groupby(\"hour\")[\"pm2.5\"].mean() # 每个小时的平均 PM2.5 df.groupby(\"dayofweek\")[\"pm2.5\"].agg([\"mean\", \"std\", \"count\"]) df.groupby([\"is_weekend\", \"hour\"])[\"pm2.5\"].mean() # 多列组合分组 作用 ： 这是观察\"周期性\"最快的办法：如果不同小时的平均值差别明显，说明时间里有可用的信号。 结果通常直接画成柱状图（见第 8 章）。 2.5 时间列处理 df[\"datetime\"] = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]]) # 多列拼成一个时间 df[\"datetime\"] = df[\"datetime\"].dt.tz_localize(\"UTC\") # 声明\"这本来就是 UTC\" df = df.set_index(\"datetime\").sort_index() # 时间当索引，再排序 df.index.hour # 取小时；同类还有 .year .month .day .dayofweek .dayofyear 作用 ： 时间必须是真正的 datetime 类型，不能是字符串，否则没法做 shift 、 rolling 这些时间操作。 设成索引以后， df.index.year 就是每行的年份，写起来短。 2.6 保存 CSV df.to_csv(\"data/processed/pm25_clean.csv\", encoding=\"utf-8-sig\") 作用 ： encoding=\"utf-8-sig\" 让 Excel 打开中文表头不乱码，Windows 上推荐。 index=True （默认）会把时间索引也写进去，这样别的脚本才能读回时间。 3. 时间戳处理 对应脚本： scripts/04_load_clean.py ；对应教程： docs/04-时序特征工程核心.md 。 3.1 拼出 UTC 时间列 import pandas as pd dt = pd.to_datetime(df[[\"year\", \"month\", \"day\", \"hour\"]]) df[\"datetime\"] = dt.dt.tz_localize(\"UTC\") 作用 ： 原始数据把时间拆成 4 列存，这一步把它们拼成一个带时区的时间列。 tz_localize 的意思是\"这些数字本来就是 UTC 时间\"；如果原始时间是北京时间，就要先 tz_localize(\"Asia/Shanghai\") 再 tz_convert(\"UTC\") 。 统一 UTC 是为了避免\"两份数据一个用北京时间、一个用 UTC，合并后差 8 小时\"。 3.2 排序 + 补齐完整时间轴 df = df.set_index(\"datetime\").sort_index() df = df.asfreq(\"h\") # 保证每个整点都有一行，缺的补成 NaN expected = pd.date_range(df.index.min(), df.index.max(), freq=\"h\") print(len(expected), len(df), len(expected) - len(df)) # 应该有 / 实际有 / 缺多少 作用 ： asfreq(\"h\") 让\"每隔一小时一行\"变成硬约束。 为什么必须补：如果不补， shift(24) 表示的是\"往前数 24 行\"，而不是\"24 小时前\"，遇到缺口就会错位， rolling(24) 也一样。 3.3 缺失值：短缺口插值，长缺口保留 df[\"pm25_was_missing\"] = df[\"pm2.5\"].isna().astype(int) # 留个标记，方便以后分析 df[\"pm2.5\"] = df[\"pm2.5\"].interpolate(method=\"linear\", limit=6, limit_direction=\"both\") 作用 ： 连续缺失不超过 6 小时 → 用前后值线性插值补上（相邻小时污染水平接近，这样猜比较合理）。 连续缺失很久 → 保留 NaN，不硬猜；建模时按用到的特征删掉这些行。 插值也是\"猜\"，必须在报告里写清楚处理方式，不能装作数据本来没有缺失。 3.4 时区换算（要看北京作息时） df[\"hour_beijing\"] = (df[\"hour\"] + 8) % 24 # 简便算法 df[\"datetime_beijing\"] = df.index.tz_convert(\"Asia/Shanghai\") # 正规做法 作用 ： 本项目统一用 UTC 讲解；UTC 08:00 = 北京 16:00。 想研究\"北京早高峰\"，就加上 hour_beijing 这一列再分组看。 4. 时间特征 对应脚本： scripts/05_time_features.py 。 4.1 日历特征 index = df.index df[\"year\"] = index.year df[\"month\"] = index.month df[\"day\"] = index.day df[\"hour\"] = index.hour df[\"dayofweek\"] = index.dayofweek # 0=周一, 6=周日 df[\"is_weekend\"] = (index.dayofweek >= 5).astype(int) df[\"dayofyear\"] = index.dayofyear 作用 ： 把\"时间戳\"翻译成模型看得懂的数字：年看长期趋势，月看季节，小时看早晚高峰。 day （几号）通常用处不大，容易让模型记住偶然现象（过拟合），可以先不加。 is_weekend 是最直观的一个：工作日和周末的规律常常不一样。 4.2 星期几的可读版本 WEEKDAY_NAMES = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"] df[\"weekday_name\"] = df[\"dayofweek\"].map(lambda x: WEEKDAY_NAMES[x]) 作用 ：给人看的列，画图、写报告时比 0~6 直观；建模时用 dayofweek 数字列。 4.3 周期编码：sin/cos import numpy as np df[\"hour_sin\"] = np.sin(2 * np.pi * df[\"hour\"] / 24) df[\"hour_cos\"] = np.cos(2 * np.pi * df[\"hour\"] / 24) df[\"dayofweek_sin\"] = np.sin(2 * np.pi * df[\"dayofweek\"] / 7) df[\"dayofweek_cos\"] = np.cos(2 * np.pi * df[\"dayofweek\"] / 7) 作用 ： 直接给模型 hour=23 和 hour=0 ，模型会以为它们差 23；放到圆上以后，它俩其实是邻居。 除以周期长度（24 小时、7 天、12 个月），再用 sin/cos 算出圆上的横纵坐标，两个数配对表示一个位置。 月份编码写 (month - 1) / 12 ，是为了让 1 月从 0 开始，跟其他周期的写法一致。 4.4 观察周期性 by_hour = df.groupby(\"hour\")[\"pm2.5\"].mean() by_weekday = df.groupby(\"weekday_name\")[\"pm2.5\"].mean().reindex(WEEKDAY_NAMES) 作用 ：分组求平均，看看\"哪个小时更脏、哪一天更脏\"。柱子高低差别明显，就说明时间特征有用。 5. 滞后与滑动窗口 对应脚本： scripts/08_lag_rolling_features.py 。 5.1 lag：把过去的值挪到当前行 df[\"pm25_now\"] = df[\"pm2.5\"] # 当前时刻的值（可以立刻测到，能用） df[\"pm25_lag1\"] = df[\"pm2.5\"].shift(1) # 上一小时 df[\"pm25_lag2\"] = df[\"pm2.5\"].shift(2) # 上两小时 df[\"pm25_lag24\"] = df[\"pm2.5\"].shift(24) # 昨天同一小时 df[\"pm25_lag168\"] = df[\"pm2.5\"].shift(168) # 上周同一小时（7×24） 作用 ： shift(1) 把整列往下挪一格，于是\"上一小时的值\"出现在当前行，可以当作特征。 污染物有明显惯性， lag1 、 lag24 通常是最有用的特征。 挪完前几行会出现 NaN，这是正常的，最后 dropna 掉即可。 5.2 diff：变化量 df[\"pm25_diff1\"] = df[\"pm2.5\"].diff(1) # 比上一小时高/低了多少 df[\"pm25_diff24\"] = df[\"pm2.5\"].diff(24) # 比昨天同一小时高/低了多少 作用 ： diff 相当于\"当前值 − 之前的值\"，描述的是趋势和变化速度，对突变更敏感。 5.3 rolling：滑动窗口 window24 = df[\"pm2.5\"].rolling(window=24, min_periods=18) df[\"pm25_roll24_mean\"] = window24.mean() # 最近 24 小时平均 df[\"pm25_roll24_std\"] = window24.std() # 最近 24 小时波动 df[\"pm25_roll24_max\"] = window24.max() # 最近 24 小时最高 df[\"pm25_roll24_min\"] = window24.min() # 最近 24 小时最低 df[\"pm25_roll168_mean\"] = df[\"pm2.5\"].rolling(window=168, min_periods=120).mean() # 最近 7 天 作用 ： 默认窗口在当前时刻结束（trailing），里面全是过去的值，预测下一小时时是安全的。 min_periods=18 表示\"24 小时里至少有 18 个有效值才算\"，既不会被个别缺失整行丢掉，也不会只靠一两个值硬算平均。 mean 看水平、 std 看稳定程度、 max/min 看极端情况。 5.4 目标：下一个小时的值 df[\"pm25_next\"] = df[\"pm2.5\"].shift(-1) # 向上挪一格 = 下一小时的值 df = df.dropna(subset=[\"pm25_next\"]) # 最后一行没有下一小时，删掉 作用 ： 这一列是 答案（y） ，只能用来训练和打分，绝不能出现在特征列里。 shift(-1) 和 shift(1) 方向相反：负数 = 未来，正数 = 过去。 5.5 时间对齐：一张表看懂谁对应谁 列名 对应时刻 说明 pm2.5 t 当前小时测得的值 pm25_lag1 t-1 上一小时 pm25_lag24 t-24 昨天同一小时 pm25_roll24_mean t-23 ~ t 最近 24 小时的平均 pm25_next t+1 要预测的答案 作用 ：写代码时随时回看这张表，就不容易把未来信息混进特征（这是最常见的错误）。 6. 建模与评估 对应脚本： scripts/06_baseline_model.py 、 07_cyclic_encoding.py 、 09_model_comparison.py 。 6.1 准备好 X 和 y features = [\"month\", \"day\", \"hour\", \"dayofweek\", \"is_weekend\", \"dayofyear\"] x_train = train[features] # 特征（问题） y_train = train[\"pm25_next\"] # 目标（答案） 作用 ： 建模就是把\"能知道的信息\"（X）和\"要预测的答案\"（y）分清楚。 特征必须满足一个条件： 在预测时刻已经能拿到 。 6.2 按时间切分训练集/测试集 split_index = int(len(df) * 0.8) train = df.iloc[:split_index].copy() # 前 80%：训练 test = df.iloc[split_index:].copy() # 后 20%：测试 作用 ： 时序数据必须\"用过去训练、拿未来测试\"，模拟真实预测场景。 随机切分会让未来信息混进训练集，分数虚高（第 7 章有真实数字对比）。 6.3 基线模型：先跑简单的 from sklearn.dummy import DummyRegressor dummy = DummyRegressor(strategy=\"mean\") # 永远预测训练集的平均值 dummy.fit(x_train, y_train) dummy_pred = dummy.predict(x_test) persistence_pred = test[\"pm25_now\"].to_numpy() # 持续法：下一小时 = 当前小时 作用 ： 平均值基线：什么都不学，只猜平均值，用来当\"最低标准\"。 持续法：直接说\"下一小时和现在差不多\"。在污染物、股价这类有惯性的数据上，它往往很强。 复杂模型如果打不过这两个基线，说明特征或方法有问题。 6.4 线性回归 from sklearn.linear_model import LinearRegression model = LinearRegression() model.fit(x_train, y_train) # 训练 pred = model.predict(x_test) # 预测 for name, coef in zip(features, model.coef_): print(name, round(coef, 4)) # 看每个特征的系数 作用 ： 线性回归就是给每个特征学一个权重，然后加权求和。 系数正负表示方向（正 = 越大越容易高），但系数大小受量纲影响，不能直接当重要性排名；想比较大小要先标准化。 6.5 标准化后再看系数 from sklearn.preprocessing import StandardScaler scaler = StandardScaler() x_train_scaled = scaler.fit_transform(train[features]) x_test_scaled = scaler.transform(test[features]) # 注意：用训练集的规则去转换测试集 model = LinearRegression().fit(x_train_scaled, y_train) 作用 ：把所有特征缩放到可比的尺度，系数大小才能横向比较（本项目输出到 09_feature_coefficients.csv ）。 6.6 三个指标怎么读 mae = np.mean(np.abs(y_true - y_pred)) # 平均差多少 rmse = np.sqrt(np.mean((y_true - y_pred) ** 2)) # 更重罚大错 r2 = 1 - np.sum((y_true - y_pred) ** 2) / np.sum((y_true - y_true.mean()) ** 2) 作用 ： MAE ：平均每次预测差多少，最好和 PM2.5 本身的平均值一起看（本数据平均约 80~100，MAE 11 就不错）。 RMSE ：和 MAE 类似，但对离谱的大错误更敏感。 R² ：1 最好；0 约等于\"只会猜平均值\"；负数说明比猜平均值还差。 6.7 实验怎么写 实验名 | 用了哪些特征 | 切分方式 | MAE | RMSE | R² | 是否可信 作用 ： 一次只改一处，其他保持不变，这样的对比才有意义（控制变量）。 表里一定要标出\"是否可信\"，把泄漏实验单独区分开（项目里已有这张表： outputs/tables/09_model_comparison.csv ）。 7. 数据泄漏：三种错误示范 对应脚本： scripts/08_lag_rolling_features.py 、 scripts/09_model_comparison.py 。 7.1 中心滑动窗口（看了未来） # 错误：center=True 表示窗口中心在当前行，会包含 t+1、t+2 的未来值 df[\"pm25_roll24_mean_center_leaky\"] = df[\"pm2.5\"].rolling(window=24, center=True, min_periods=24).mean() 作用/后果 ：预测下一小时时却用了后面几小时的信息。分数会变好，但这个\"好\"是假的。 7.2 把答案当特征（最离谱的作弊） df[\"pm25_answer_leaky\"] = df[\"pm25_next\"] # 严重错误：答案直接变成特征 作用/后果 ：模型等于抄答案，R² 会到 1.0000、MAE 会到 0。看到\"完美分数\"先怀疑泄漏，而不是高兴。 7.3 随机切分（考试漏题） # 错误做法：时序数据不要这样切 x_train, x_test, y_train, y_test = train_test_split(x, y, test_size=0.2, random_state=42) 作用/后果 ：随机切分会把\"未来\"混进训练集，测试分数虚高（本项目对比：随机切分 R² 0.9494，按时间切分 0.9426，看起来更好，但不可信）。 7.4 防泄漏检查清单 [ ] 每一列特征，在预测时刻 t 都拿得到吗？（拿不到就删） [ ] 有没有 center=True ？有就改成默认的 trailing 窗口。 [ ] 有没有列名带 next 、 answer 、 leaky 却出现在 features 里？ [ ] 是在排序 + 补齐时间轴之后才算的 shift / rolling 吗？ [ ] 训练集时间是否完全早于测试集？ [ ] 分数好得反常（R²>0.99）时，是否停下来查一遍泄漏？ 8. 画图 对应脚本： scripts/10_plots.py ；对应教程： docs/06-画图与Kaggle.md 。 8.1 中文画图设置 import matplotlib matplotlib.use(\"Agg\") # 不弹窗，直接存图片文件 import matplotlib.pyplot as plt plt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\", \"SimHei\"] # 中文不乱码 plt.rcParams[\"axes.unicode_minus\"] = False # 负号正常显示 plt.rcParams[\"figure.dpi\"] = 120 作用 ：不设置字体，中文标题会变成一排方框； Agg 让脚本在服务器/无窗口环境也能出图。 8.2 常用图 fig, axes = plt.subplots(2, 1, figsize=(12, 8)) # 上下两张图 axes[0].plot(daily.index, daily[\"pm2.5\"], color=\"#2c7fb8\") # 折线：看趋势 axes[0].set_title(\"PM2.5 日均值（UTC）\") axes[0].set_ylabel(\"PM2.5\") axes[1].plot(sample.index, sample[\"pm2.5\"], linewidth=0.8) # 局部放大看细节 fig.tight_layout() fig.savefig(\"outputs/figures/01_原始序列与趋势.png\", bbox_inches=\"tight\") plt.figure(figsize=(8, 4)) plt.bar(by_hour.index, by_hour.values, color=\"#31a354\") # 柱状：比较不同小时 plt.xlabel(\"UTC 小时\"); plt.ylabel(\"平均 PM2.5\") plt.savefig(\"outputs/figures/03_周期性观察.png\", bbox_inches=\"tight\") fig, ax = plt.subplots(figsize=(13, 5.5)) ax.plot(part.index, part[\"y_true\"], color=\"black\", linewidth=2, label=\"真实值\") ax.plot(part.index, part[\"pred_time_cyc\"], color=\"#e6550d\", label=\"只用周期时间特征\") ax.plot(part.index, part[\"pred_full\"], color=\"#2c7fb8\", label=\"完整正确特征\") ax.legend() ax.set_title(\"测试期前 14 天：预测值 vs 真实值\") 作用 ： 折线看趋势和周期，柱状比较分组均值，散点看两个变量的关系。 预测对比图是最有说服力的一张：真实值、简单特征、完整特征画在一起，一眼看出差别。 8.3 每张图在说什么 图 看什么 原始序列 整体趋势、有没有季节性 滑动平均与差分 7 天滑动平均像降噪滤镜；差分把突变单独拎出来 周期性观察 不同小时/星期/月份的平均值差别大不大 预测对比 简单特征几乎是一条平线，完整特征能跟住真实值 周期编码圆 23 点和 0 点在圆上是邻居 相关性热力图 哪个特征和下一小时 PM2.5 线性相关更强（相关 ≠ 因果） 9. SQLite 数据库 对应脚本： scripts/03_sqlite_basics.py 。Python 自带，零配置。 9.1 连接与建表 import sqlite3 conn = sqlite3.connect(\"data/processed/practice.db\") conn.execute(\"\"\" CREATE TABLE IF NOT EXISTS weather_notes ( id INTEGER PRIMARY KEY, -- 主键：唯一身份证，不能重复 city TEXT NOT NULL, date TEXT NOT NULL, temp REAL, note TEXT ) \"\"\") conn.commit() 作用 ： SQLite 把整个数据库存成一个 .db 文件，不用装服务器，适合练习和小项目。 PRIMARY KEY 保证每行有唯一 id； NOT NULL 表示这列不能空着。 类型： INTEGER 整数、 TEXT 文本、 REAL 小数。 9.2 增删改查 # 增：? 是占位符，防止拼字符串出错（也能防注入） conn.executemany( \"INSERT OR REPLACE INTO weather_notes (id, city, date, temp, note) VALUES (?, ?, ?, ?, ?)\", [(1, \"Nanjing\", \"2026-10-01\", 28.0, \"sunny\")], ) # 查 conn.execute(\"SELECT * FROM weather_notes WHERE city = ? ORDER BY id\", (\"Nanjing\",)) conn.execute(\"SELECT city, COUNT(*) AS n FROM weather_notes GROUP BY city ORDER BY n DESC\") # 改 conn.execute(\"UPDATE weather_notes SET temp = ?, note = ? WHERE id = ?\", (29.5, \"updated\", 1)) # 删 conn.execute(\"DELETE FROM weather_notes WHERE id = ?\", (4,)) conn.commit() # 增删改之后一定要 commit conn.close() # 用完关掉 作用 ： SELECT 查、 INSERT 增、 UPDATE 改、 DELETE 删 —— 数据库的四个基本动作。 WHERE 决定动哪几行； 忘了写 WHERE，UPDATE/DELETE 会作用到整张表 ，务必先 SELECT 确认。 9.3 主键与索引 conn.execute(\"CREATE INDEX IF NOT EXISTS idx_weather_city ON weather_notes (city)\") 作用 ： 主键：自动唯一，插入重复 id 会直接报 IntegrityError （这是好事，数据更安全）。 索引：像书的目录，让\"按 city 查询\"更快；代价是占空间、写入稍慢，只给常用查询列建。 10. 报错急救 对应教程： docs/99-报错急救.md 。 报错信息（关键部分） 原因 怎么解决 python 不是内部或外部命令 没装 Python 或没勾选 Add to PATH 重新安装 Python 并勾选 Add Python to PATH；或用 py 命令 无法加载文件 ... Activate.ps1，未对文件进行数字签名 PowerShell 执行策略限制 Set-ExecutionPolicy -Scope CurrentUser RemoteSigned 后重开窗口 ModuleNotFoundError: No module named 'pandas' 没装库，或虚拟环境没激活 先 .\\.venv\\Scripts\\Activate.ps1 ，再 pip install -r requirements.txt FileNotFoundError: ... data/raw/...csv 数据还没下载 先跑 python scripts\\download_data.py FileNotFoundError: ... pm25_clean.csv 上一个脚本没跑 按顺序跑 04 → 05 → 06…，或直接 .\\run_all.ps1 KeyError: 'hour' 列名不存在/拼错，或少了上一步生成的特征 用 df.columns 看真实列名；确认跑过 05/08 ValueError: could not convert string to float 该是数字的列里混了文字/空值 df[\"列\"].head() 看看内容；必要时 pd.to_numeric(errors=\"coerce\") TypeError: unsupported operand type(s) 字符串当数字算了 检查这列的 dtype （ df.dtypes ），先转换类型 SettingWithCopyWarning 在切片副本上改数据 先 .copy() ，再赋值： part = df.iloc[:100].copy() UnicodeDecodeError: 'utf-8' codec can't decode 文件不是 UTF-8（常见 GBK） 读的时候加 encoding=\"gbk\" ；写 CSV 用 utf-8-sig CSV 用 Excel 打开中文乱码 编码不是 Excel 认的格式 保存时用 encoding=\"utf-8-sig\" matplotlib 中文变方框 没设置中文字体 加 plt.rcParams[\"font.sans-serif\"] = [\"Microsoft YaHei\"] 服务器提示端口被占用 8765 已被别的程序占用 换端口： start-server.ps1 -Port 8899 Git fatal: not a git repository 当前目录还不是仓库 在项目根目录先 git init Git failed to push / 要登录 远端仓库或凭据问题 git remote -v 检查地址；按提示登录 GitHub PermissionError: [Errno 13] 文件被 Excel 等程序占用 关掉正在打开的文件再运行脚本 通用排查三步 ： 看报错 最后一行 （错误类型 + 原因），再看它指出的是哪个文件哪一行。 打开那个文件、找到那一行，想想这一行需要什么（列？文件？库？）。 还没头绪就把整段报错复制去搜索，或者把\"最后一行 + 代码那几行\"发给同学/导师。 附录 A 特征清单（可直接抄进报告） 特征名 构造方法 含义 可能的作用 year index.year 年份 捕捉长期趋势 month index.month 月份 1–12 捕捉季节变化 day index.day 几号 通常用处不大，容易过拟合 hour index.hour 小时 0–23 捕捉一天内的变化 dayofweek index.dayofweek 0=周一…6=周日 工作日/周末差异 is_weekend dayofweek >= 5 是否周末 0/1 简单明了的周末效应 dayofyear index.dayofyear 一年中的第几天 更细的季节位置 hour_sin / hour_cos sin(2π·hour/24) / cos(...) 小时在圆上的坐标 让 23 点和 0 点变近 dayofweek_sin / dayofweek_cos sin(2π·dow/7) / cos(...) 星期在圆上的坐标 表达\"周而复始\" month_sin / month_cos sin(2π·(month-1)/12) 月份在圆上的坐标 表达季节循环 pm25_now 原列 当前小时的值 惯性，最强特征之一 pm25_lag1 / lag2 / lag3 shift(1/2/3) 前 1~3 小时的值 近期惯性 pm25_lag24 shift(24) 昨天同一小时 日周期 pm25_lag168 shift(168) 上周同一小时 周周期 pm25_diff1 / diff24 diff(1) / diff(24) 相比上一小时/昨天同小时的变化 趋势与突变 pm25_roll24_mean/std/max/min rolling(24).mean()/std()/max()/min() 最近 24 小时统计 水平、波动、极值 pm25_roll168_mean/std rolling(168) 最近 7 天统计 周级别水平与波动 TEMP_lag1 / TEMP_roll24_mean 对温度做同样的操作 温度的历史信息 说明方法可迁移到其他列 一句话模板 ： xxx 特征是用
